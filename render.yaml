# Render Blueprint — self-hosted PostgREST + Postgres + static dapp.
# Self-owned data layer: Postgres + PostgREST, all on Render.
# Spec: https://render.com/docs/blueprint-spec
#
# One-time setup after first deploy:
#   1. Connect to the DB and run, in order:
#        db/schema.sql      (tables, functions, views, RLS)
#        db/roles.sql       (authenticator + anon roles/grants)
#   2. Give the login role a password:
#        ALTER ROLE authenticator WITH PASSWORD '<strong-random-password>';
#   3. Set PGRST_DB_URI (marked sync:false below) in the dashboard to:
#        postgres://authenticator:<password>@<host>:<port>/<db>
#      using the host/port/db from the multisig-db "Info" tab.

databases:
  - name: multisig-db
    # free plan is deleted after 30 days — use a paid plan for anything real.
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ── API layer: self-hosted PostgREST ────────────────────────────
  - type: web
    name: multisig-postgrest
    runtime: image
    image:
      url: docker.io/postgrest/postgrest:v12.2.12
    plan: starter
    healthCheckPath: /
    envVars:
      # Connection string for the low-privilege `authenticator` role.
      # Render only auto-exposes the DB OWNER connection string, and
      # PostgREST must NOT connect as the owner — so set this by hand
      # (see step 3 above). sync:false = prompt for it, never store in git.
      - key: PGRST_DB_URI
        sync: false
      - key: PGRST_DB_SCHEMAS
        value: public
      - key: PGRST_DB_ANON_ROLE
        value: anon
      - key: PGRST_DB_POOL
        value: "10"
      # Fail fast when the pool is saturated instead of hanging the request
      # (the browser client retries with backoff, so a quick error beats a
      # stalled connection during a load spike or cold start).
      - key: PGRST_DB_POOL_ACQUISITION_TIMEOUT
        value: "10"
      # Recover automatically if the DB connection drops (e.g. Postgres
      # restart/failover) rather than serving 503s until a manual redeploy.
      - key: PGRST_DB_POOL_MAX_IDLETIME
        value: "30"
      # Cap rows per response so a pathological query can't exhaust memory on
      # the small instance. The dapp always paginates well under this.
      - key: PGRST_DB_MAX_ROWS
        value: "1000"
      # PostgREST listens here; Render auto-detects the open port. If routing
      # fails, add an env var PORT with the same value.
      - key: PGRST_SERVER_PORT
        value: "3000"
      # Only used if you later mint authenticated JWTs. Unused while the app
      # runs purely as anon (no Authorization header), but harmless to have.
      - key: PGRST_JWT_SECRET
        generateValue: true

  # ── Static dapp ─────────────────────────────────────────────────
  - type: web
    name: multisig-dapp
    runtime: static
    # dist/, not dapp/ — see build.js. The source keeps its comments and the
    # deployment does not: index.html is 236 KB gzipped as written and 121 KB
    # with the prose removed, on a page that already ships a 505 KB signing
    # library before it can do anything. Nothing is renamed, reordered or
    # rewritten; the build proves that its output holds the same literals in the
    # same order as its input, and that every script parses, before it writes
    # anything at all.
    #
    # Node only, no package tree. This repo vendors ethers rather than
    # installing it, and a deploy that can fail on an npm registry hiccup is a
    # deploy that can fail for reasons that have nothing to do with this project.
    staticPublishPath: ./dist
    buildCommand: "node build.js"
    headers:
      # frame-ancestors is the one CSP directive a <meta> tag cannot carry —
      # browsers ignore it there — so the pages' own policies cannot express it
      # and it has to be served. Without it any site can put this dapp in an
      # iframe and lay its own UI over the buttons that sign and execute. Both
      # spellings, because the older header is what some proxies still act on.
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      # A vault address and a proposal nonce live in the URL fragment, and a
      # fragment is not sent in a Referer — but the path is, and a full CSP or
      # font request would otherwise carry it off-site. Nothing here needs it.
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # The CSP already carries upgrade-insecure-requests, but that only rewrites
      # subresource URLs on a page the browser has ALREADY fetched — it does
      # nothing about the first navigation, which is the one a network attacker
      # gets to answer. HSTS is what removes that request, and this is a site
      # whose whole purpose is showing an operator which address they are about
      # to send funds to. Two years, subdomains included, and preload-eligible.
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      # Nothing in the dapp asks for any of these; saying so stops an embedded
      # or injected frame asking on its behalf.
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      # The two vendored bundles are 1.1 MB between them and are the only files
      # here that are not this project's own source. They are checked in at a
      # pinned version and change only when someone deliberately replaces them,
      # so a returning visitor was re-validating — and on a cold cache
      # re-downloading — a megabyte of unchanged library on every visit.
      #
      # A day, not a year, and deliberately not `immutable`: the filenames carry
      # no version or content hash, so the cache cannot be busted by changing a
      # URL. A year would mean an upgraded ethers reaching a returning visitor
      # whenever their browser felt like asking, which is not a property this app
      # should have. A day bounds that to one day and still turns the common case
      # — coming back to check a proposal — into no bytes at all.
      #
      # Nothing else is listed. index.html, wallet.js and wallet.css are this
      # app's own code and have to move together: a stale wallet.js against a
      # fresh index.html is a half-deployed interface, which is worse than a
      # slow one. They keep the platform default, which revalidates.
      - path: /ethers.min.js
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /walletconnect.min.js
        name: Cache-Control
        value: "public, max-age=86400"
      # The unfurl card. Fetched by link-preview crawlers rather than by the app,
      # never referenced by anything that would notice it being a week old.
      - path: /multisig-card-1200x630.png
        name: Cache-Control
        value: "public, max-age=604800"
    # The full CSP is served from the <meta> tag in each page instead of here,
    # so it stays next to the code whose origins it lists. If you move it, point
    # connect-src at the PostgREST service URL above.
