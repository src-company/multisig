<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* The ink ladder from index.html, copied rather than diverged. */
:root{--a:#F5FBFF;--bg:#2D5FE8;--d:#D6E6FF;--m:#EAF4FF;--ln:#FFFFFF2E;--fr:#FFFFFF47;--g:#7DFFBA;--gc:#0A0A0A;--r:#FFB1AC;--y:#FFD600;--f:'IBM Plex Mono','Courier New',monospace}
.light{--a:#00677C;--bg:#FDFDFD;--d:#008CA6;--m:#007990;--ln:#0099B326;--fr:#0099B340;--g:#059669;--gc:#fff;--r:#DC2626;--y:#B45309}
body{font-family:var(--f);background:var(--bg);color:var(--a);min-height:100dvh;padding:10px;overflow-x:hidden}
a{color:var(--a)}
input,button,textarea{font-family:var(--f);font-size:16px;color:var(--a)}
input:focus,textarea:focus{border-bottom-color:var(--a)!important;outline:none;box-shadow:inset 0 -1px 0 var(--a)}
button:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button{cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:default}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.scan{position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0A0A0A04 3px,#0A0A0A04 6px)}
.light .scan{background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0099B302 3px,#0099B302 6px)}
.frame{max-width:520px;margin:0 auto;padding:0 12px 48px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0 8px}
.logo{font-size:22px;font-weight:700;letter-spacing:-1px}.logo a{text-decoration:none}
.pill{background:transparent;border:1px solid var(--ln);color:var(--d);font-size:9px;font-weight:700;letter-spacing:2px;padding:8px 10px}
.pill.on{background:var(--a);color:var(--bg);border-color:var(--a)}
.pills{display:flex;gap:6px}
.hero{text-align:center;padding:26px 0 22px}
.marks{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:16px}
.mark{position:relative;z-index:101}
.mark svg{width:60px;height:60px;display:block}
h1{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.15}
.sub{font-size:12px;line-height:1.8;color:var(--m);margin-top:10px}
.free{display:inline-block;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--g);border:1px solid color-mix(in srgb,var(--g) 40%,transparent);padding:4px 10px;margin-top:14px}
.step{border-top:1px solid var(--ln);padding:22px 0}
.step.off{opacity:.5;padding:16px 0}
.step h2{display:flex;gap:12px;align-items:baseline;font-size:12px;font-weight:700;letter-spacing:2px}
.step h2 span{color:var(--d)}
.step h2 .ok{color:var(--g);margin-left:auto;font-size:10px}
.step>p{font-size:11px;line-height:1.8;color:var(--m);margin-top:8px}
.lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--d);margin:18px 0 8px}
.flow{list-style:none;display:flex;margin:6px 0 22px}
.flow li{flex:1;position:relative;text-align:center}
.flow li+li::before{content:"";position:absolute;top:19px;right:calc(50% + 24px);left:calc(-50% + 24px);height:1px;background:var(--ln)}
.flow li.done+li::before{background:var(--g)}
.flow button{background:none;border:none;color:var(--d);display:inline-flex;flex-direction:column;align-items:center;gap:6px;opacity:.65}
.flow button:disabled{cursor:default}
.flow .ic{width:38px;height:38px;border:1px solid var(--ln);border-radius:50%;display:flex;align-items:center;justify-content:center}
.flow .ic svg{width:19px;height:19px}
.flow .t{font-size:8px;font-weight:700;letter-spacing:1.5px}
.flow .now button{opacity:1;color:var(--a)}
.flow .now .ic{background:var(--a);color:var(--bg);border-color:var(--a)}
.flow .done button{opacity:1;color:var(--g)}
.flow .done .ic{border-color:var(--g)}
.pane h2{font-size:18px;font-weight:700;letter-spacing:-.3px}
.lead{font-size:12px;line-height:1.7;color:var(--m);margin:6px 0 16px}
.th{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2px;color:var(--d)}
.wait{font-size:11px;color:var(--m);border-left:2px solid var(--y);padding:6px 0 6px 12px;margin-top:12px;line-height:1.6}
.boxed{display:block;width:100%;border-bottom:1px solid var(--ln)}
.center{justify-content:center}.asbtn{display:inline-flex;align-items:center;text-decoration:none}
.n{color:var(--d);width:18px}.n svg{width:16px;height:16px;display:block}
.connecting{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;border:1px solid var(--ln);padding:12px 14px;margin-top:14px}
.wals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wal{display:flex;align-items:center;gap:10px;min-width:0;background:transparent;border:1px solid var(--ln);padding:12px;font-size:12px;font-weight:600;color:var(--a);text-align:left}
.wal span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wal img,.wal svg{width:22px;height:22px;flex-shrink:0;display:block}
@media(hover:hover){.wal:hover:not(:disabled){border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,transparent)}.btn.line:hover:not(:disabled){border-color:var(--a);color:var(--a)}}
.hbar{font-size:11px;letter-spacing:1px;color:var(--fr);user-select:none;overflow:hidden;white-space:nowrap;line-height:1}
.theme{background:transparent;border:1px solid var(--ln);width:32px;font-size:12px}
.link{background:none;border:none;color:var(--d);font-size:11px;padding:10px 0;display:block;margin-top:6px}
.btn{font-size:11px;font-weight:700;letter-spacing:2px;min-height:40px;padding:0 20px;border:none;text-transform:uppercase}
.fill{background:var(--a);color:var(--bg)}.line{background:transparent;border:1px solid var(--ln);color:var(--d)}.go{background:var(--g);color:var(--gc)}
.w{width:100%;height:48px;font-size:13px;letter-spacing:3px;margin-top:14px;display:block;text-align:center;line-height:48px;text-decoration:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.inp{flex:1;min-width:0;width:100%;padding:8px 0;font-size:13px;background:transparent;border:none;border-bottom:1px solid transparent;border-radius:0}
.inp::placeholder{color:var(--d);opacity:.6}
.st{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--d);white-space:nowrap}.st.ok{color:var(--g)}.st.bad{color:var(--r)}
.x{background:none;border:none;color:var(--d);font-size:12px;padding:4px 6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--ln)}
.stepper button{width:40px;height:40px;background:none;border:none;font-size:16px}
.stepper output{min-width:88px;text-align:center;font-size:13px;font-weight:700;letter-spacing:2px}
.note{font-size:11px;color:var(--m);border-left:2px solid var(--y);padding:8px 0 8px 14px;margin-top:14px;line-height:1.7}
.note.bad{border-left-color:var(--r);color:var(--r)}
.addr{font-size:12px;font-weight:600;word-break:break-all;line-height:1.7;margin-top:12px;text-align:center}
.qr{background:#fff;padding:10px;width:190px;margin:0 auto;line-height:0}.qr svg{width:100%;height:auto}
.pane{min-height:250px}
.th{margin-top:10px}
.foot{margin-top:26px;font-size:9px;letter-spacing:2px;color:var(--d);display:flex;justify-content:space-between;padding-top:18px;border-top:1px solid var(--ln)}
.foot a{color:var(--d);padding:6px 0;display:inline-block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--a);color:var(--bg);font-size:10px;font-weight:700;letter-spacing:2px;padding:10px 16px;z-index:300}
@media(max-width:560px){h1{font-size:24px}.mark svg{width:60px;height:60px}.wals{grid-template-columns:1fr}}
</style>
</head>
