<h2>WHAT</h2>
<p>A multichain multisig wallet with an embedded timelock. Deployed via CREATE2 minimal proxy clones for deterministic addresses across chains.</p>

<h2>WHY</h2>
<p>Regular multisigs execute instantly once threshold is met. That's fine until a compromised key or social engineering attack drains your treasury in one block. The embedded timelock adds a mandatory delay between queuing and execution, giving owners time to detect and cancel malicious transactions.</p>

<div class="note">Protects against everyday mistakes, defends protocols and their users from malicious upgrades and migrations, and provides more peace of mind than a regular multisig.</div>

<h2>HOW IT WORKS</h2>
<p>Owners sign transactions off-chain (EIP-712) or approve on-chain. Once threshold signatures are collected, <code>execute()</code> queues the transaction with an ETA based on the configured delay. After the timelock passes, <code>executeQueued()</code> completes it.</p>
<p>The default executor plugin (TimelockExecutor) adds two parallel paths: <strong>cancel</strong> a queued transaction with threshold signatures, or <strong>instantly execute</strong> with unanimous (all-owner) signatures when opted in. The fast path is optional — vaults must explicitly enable it via <code>enableForward</code>.</p>
<p>Setting delay to 0 creates an <strong>unlocked</strong> vault — transactions execute immediately once threshold is met, with no timelock. The fast path toggle is hidden since there is no delay to bypass.</p>

<h2>CHAINS</h2>
<p>Ethereum, Base, MegaETH, Arbitrum, Optimism. Same contract, same address via CREATE2. Testnets: Sepolia, Base Sepolia.</p>

<h2>TOKENS</h2>
<p>ETH (18 decimals), USDC (6), USDT (6), DAI (18), WBTC (8, cbBTC on Base), wstETH (18). Native ETH receiving and ERC-721/1155 callbacks supported via the fallback function. The UI converts human-readable amounts to raw token units automatically.</p>
`,

<h2>MULTISIG.SOL</h2>
<p>Single contract, ~200 lines. Owners stored as a linked list (sentinel pattern). Sequential nonce. EIP-712 signatures. ERC-1271 support via <code>isValidSignature</code>.</p>

<h2>STATE</h2>
<pre>uint32  delay        // timelock in seconds (0 = unlocked)
uint32  nonce        // sequential, increments on execute()
uint16  threshold    // sigs required
uint16  ownerCount   // total owners
address executor     // bypass role (typically TimelockExecutor)</pre>

<h2>CORE FUNCTIONS</h2>
<div class="sig">execute<span class="params">(target, value, data, sigs)</span></div>
<div class="desc">Verify signatures, then either execute immediately (delay=0 or caller is executor) or queue with ETA. Nonce increments here. Executor callers skip signature verification entirely.</div>

<div class="sig">executeQueued<span class="params">(target, value, data, nonce)</span></div>
<div class="desc">Execute a previously queued transaction. Self-calls (msg.sender == address(this)) skip the ETA check — this is how the executor accelerates queued txs. External callers must wait for the ETA to pass. Requires eta != 0 (tx must be queued).</div>

<div class="sig">approve<span class="params">(hash, ok)</span></div>
<div class="desc">On-chain approval. Owners can pre-approve a transaction hash as an alternative to off-chain EIP-712 signatures. Pass ok=false to revoke. The approve maps to the APPROVE button in the UI, while ok=false maps to UNSIGN.</div>

<div class="sig">cancelQueued<span class="params">(hash)</span></div>
<div class="desc">onlySelf. Cancel a queued transaction and delete its ETA. Invoked via the executor's cancel path — TimelockExecutor.forward() calls execute() targeting the multisig with cancelQueued calldata, satisfying the onlySelf requirement as a self-call.</div>

<div class="sig">batch<span class="params">(targets[], values[], datas[])</span></div>
<div class="desc">Execute multiple calls atomically. onlySelf — must be called by the multisig itself via execute(). The UI's BATCH mode in the TX builder encodes this.</div>

<div class="sig">delegateCall<span class="params">(target, data)</span></div>
<div class="desc">onlySelf. Execute a delegatecall to target. Use for module installations or storage-manipulating upgrades.</div>

<h2>VIEW FUNCTIONS</h2>
<div class="sig">getTransactionHash<span class="params">(target, value, data, nonce)</span></div>
<div class="desc">Compute the EIP-712 hash for a transaction. Used by both the multisig and TimelockExecutor for signature verification. Same hash format for both paths.</div>

<div class="sig">isOwner<span class="params">(account)</span> / getOwners<span class="params">()</span></div>
<div class="desc">Query owner status and list. getOwners walks the linked list from sentinel to sentinel.</div>

<div class="sig">isValidSignature<span class="params">(hash, sigs)</span></div>
<div class="desc">ERC-1271 signature validation. Wraps the hash in a SafeMessage typehash before verifying. Returns the magic value on success.</div>

<h2>ADMIN (onlySelf)</h2>
<div class="sig">setThreshold<span class="params">(threshold)</span></div>
<div class="desc">Must be non-zero and ≤ ownerCount. All admin changes go through the multisig itself — they're proposed as transactions targeting the vault's own address.</div>

<div class="sig">setDelay<span class="params">(delay)</span></div>
<div class="desc">Timelock period in seconds. Set 0 for unlocked (instant execution, no timelock).</div>

<div class="sig">setExecutor<span class="params">(executor)</span></div>
<div class="desc">Set to TimelockExecutor address for the default plugin. Set 0x0 to disable bypass entirely. The executor can call execute() without signatures and without timelock delay.</div>

<div class="sig">addOwner<span class="params">(owner)</span> / removeOwner<span class="params">(prev, owner)</span></div>
<div class="desc">Linked list ops. addOwner inserts the new owner right after the sentinel (list order isn't kept sorted). removeOwner takes the prevOwner pointer and enforces ownerCount > threshold. Sorting is only required for the init owner array and for signature bundles.</div>

<h2>FACTORY</h2>
<p><code>MultisigFactory.create()</code> deploys minimal proxy clones via CREATE2 with PUSH0 and calls <code>init()</code> on the new proxy. Salt must start with 0x0 or msg.sender for frontrun protection.</p>
<p><code>createWithCalls()</code> deploys with the factory as temporary executor, executes post-init calls (like <code>enableForward(true)</code> on the TimelockExecutor), then sets the real executor. Used when the fast path needs to be enabled at deploy time.</p>

<h2>SIGNATURES</h2>
<p>EIP-712 typed data with <code>Execute(address target,uint256 value,bytes data,uint32 nonce)</code> typehash. Packed as 65-byte chunks (r, s, v). v=0 indicates on-chain approval — address packed in r, verified against the <code>approved</code> mapping or msg.sender. Signers must be sorted ascending (contract enforces signer > prev). Same signature format for Multisig.execute() and TimelockExecutor.forward().</p>

<tr><td>TimelockExecutor</td><td><a href="https://contractscan.xyz/contract/0x00000000a72A30AdBf38e14d36BCE2610ec3973F" target="_blank" rel="noopener">0x00000000a72A30AdBf38e14d36BCE2610ec3973F</a></td></tr>
</table>
<p>Same addresses on all supported chains. Proxy clones deployed via CREATE2 inherit the implementation. View on <a href="https://contractscan.xyz" target="_blank" rel="noopener" style="color:var(--a);border-bottom:1px solid var(--ln);text-decoration:none">contractscan.xyz</a> for multichain verification.</p>

<div class="note">None of the three singletons above has a withdrawal path, and the implementation is never initialized, so it has no owners who could authorize one. <strong>ETH or tokens sent directly to the factory, the implementation or the TimelockExecutor are unrecoverable by anyone, permanently.</strong> This app will not build a transaction that sends value to them. Value passed to <code>create()</code> is unaffected — the factory forwards it into the CREATE2 as the new vault's opening balance. See <a href="#audits">AUDITS</a> — finding L-2.</div>

<h2>TIMELOCK &amp; THE FAST PATH</h2>
<p>The clearest thing to understand before configuring a vault, because two reviews raised issues that both live here.</p>
<div class="sig">THE EXECUTOR IS WHAT MAKES A TIMELOCK CANCELLABLE</div>
<div class="desc">With a delay and no executor, queueing works fine and third parties get their full notice period — but nothing can be stopped. cancelQueued is onlySelf, so a cancel routes through execute() and is queued for the same delay, maturing no earlier than what it cancels. Setting the TimelockExecutor as executor adds the missing piece: a cancel on threshold signatures, executing immediately. This app always pairs a non-zero delay with it, and will not remove it while a delay is set.</div>
<div class="sig">CANCELLING NEVER NEEDS THE FAST PATH</div>
<div class="desc">The cancel route requires only threshold signatures and does not check forwardEnabled, so the brake works on every vault using this executor whether or not the fast path is on. If you are considering enabling the fast path for emergencies, you already have what you need.</div>
<div class="sig">BUT A CANCEL MUST BE SUBMITTED BY A SIGNER</div>
<div class="desc">Both routes verify the same signatures, so a cancel bundle copied from the mempool can be replayed through execute() instead — where it is queued for the full delay rather than executing now, and burns the nonce so the real one reverts. The proposal it was meant to stop was queued first, matures first, and anyone can run it. This app defends against that by spending one slot of every executor bundle on a sender slot bound to whoever submits: a copier is not that address, so the bundle is useless to them. It works only if the submitter is one of the signers — if it cannot be bound, the app says so before sending.</div>
<div class="sig">WHAT THE FAST PATH IS ACTUALLY FOR</div>
<div class="desc">Velocity, not emergencies. A vault that needs only partial consensus to act slowly can act immediately when everyone is aligned — routine payments, trading. Signatures accrue: collect the threshold and a proposal is queueable; if a further owner signs the same proposal before it is submitted, it becomes instantly executable, with nobody re-signing.</div>
<div class="sig">EXCEPT WHERE THE THRESHOLD IS THE OWNER COUNT</div>
<div class="desc">On a 2-of-2 or 3-of-3 every quorum is already unanimous, so there is no higher bar to escalate to — the same signatures queue or execute, at the submitter's choice, including anyone who sees them in the mempool. The delay becomes the default route rather than a guarantee. Legitimate if that is what you want; this app flags it at create and needs a second press in admin rather than refusing. The cancel brake is unaffected.</div>
<div class="sig">TWO WAYS TO AUTHORISE, AND WHY BOTH EXIST</div>
<div class="desc">Signing produces an off-chain EIP-712 signature: free, private, and it keeps the front-run protection described below. Approving registers authorisation in the vault itself: it costs gas and is publicly readable, but it is the only route a DAO or nested multisig owner has — a contract cannot produce a signature — and it is the only route that needs no coordination service whatsoever. A vault whose owners all approve on-chain keeps working if this app, its database, or its operator disappear. That independence is the point, and it is why the option stays even though most signers should prefer signing.</div>
<div class="sig">KEEPING BOTH: INDEPENDENCE AND PROTECTION</div>
<div class="desc">An on-chain approval is world-readable, so the slot it fills can be assembled by anyone — which forfeits the binding that stops a collected bundle being replayed into the queueing route. The two are not actually in conflict: have every owner but one approve on-chain, and let the remaining owner submit without approving. Their slot stays sender-only, a copier is left one signature short, and the vault still needed no coordination service to get there.</div>
<div class="sig">APPROVALS ARE SCOPED TO ONE NONCE</div>
<div class="desc">The approved hash commits to the vault's nonce, and both execution routes compute against the live one, so an approval becomes permanently unreachable the moment the nonce advances past it. Stale approvals for consumed nonces are inert. The only ones worth revoking are those made for a nonce the vault has not yet reached.</div>
<div class="sig">IF A FAST-PATH PROPOSAL GETS FORCED INTO THE QUEUE</div>
<div class="desc">Because both routes accept the same signatures, someone who sees your bundle before it lands can submit it down the queueing route instead — your proposal is queued rather than executed now, and the nonce is consumed. It is not blocked and not lost: it executes when the delay elapses, and the same trick cannot be repeated once the entry is queued. To recover, accelerate it — the app forwards a self-call to executeQueued, which the vault answers itself and so skips the remaining wait. To avoid it entirely, submit through a private RPC; the attack needs your bundle to be public first. On Base, Arbitrum and OP there is no public mempool to read.</div>
<div class="sig">WHAT TO USE WHEN TIMING REALLY MATTERS</div>
<div class="desc">The fast path is a convenience, and the worst case of it being griefed is that you wait the delay you chose. The two cases where timing is critical each have a route that cannot be griefed. To <b>stop</b> something queued, cancel: threshold signatures, no forwardEnabled, and the bundle is bound to whoever submits so a copier is always one signature short. To <b>guarantee</b> emergency action, use a separate multisig as the executor rather than enabling the fast path.</div>
<div class="sig">THE COUNCIL PATTERN — NO REPLAY POSSIBLE AT ALL</div>
<div class="desc">The reason a bundle can be replayed is that the TimelockExecutor authorises against the vault's own signing digest, so the same signatures open both routes. The executor bypass needs no signatures at all — the vault skips its checks for whatever address is set as executor. So an executor that authorises against its <em>own</em> digest leaves nothing that can be replayed against the vault. A second vault is exactly that: deploy one with the same owners, unanimous threshold and no timelock, and set it as your main vault's executor. Ordinary proposals still queue for the full delay, unanimity acts immediately, and those council signatures can never be aimed at the main vault because they carry a different verifying contract. Cancellation through it cannot be forced into the queue by anyone.</div>
<div class="desc">The tradeoff is that the council's threshold governs both bypass <em>and</em> cancellation — one dial, not two. At unanimous, cancelling costs every owner rather than a quorum. The default TimelockExecutor charges only a quorum to cancel and is the better choice for most vaults; the council is there if you want the replay surface gone entirely.</div>
<div class="sig">SIGNED MESSAGES ESCAPE THE DELAY ENTIRELY</div>
<div class="desc">A timelock constrains transactions, not ERC-1271 message signing. Anything expressible as a signed order — Permit2, Seaport, intent systems — is authorised instantly with threshold signatures on any vault, however long the delay. Worth knowing if you assume the delay gates every outflow.</div>

<h2>FINDINGS &amp; RESPONSE</h2>
<p>Shred Security raised four issues, no high or medium. The Opus 5 review raised two high and six medium, all configuration-dependent — four of which re-file tradeoffs already documented as accepted, and two of which we downgraded on the evidence. What follows is what changed here as a result.</p>

<div class="sig">L-1 &middot; SELF-REFERENTIAL EXECUTOR <span class="params">— low, mitigated</span></div>
<div class="desc">A vault whose address carries the 0x1111 guard marker and whose executor is set to itself recurses through the guard hook on every execute() until it reverts — and setExecutor is only reachable through execute(), so there is no way back. This app refuses to raise that proposal, and flags an inbound one as SET EXECUTOR &middot; LOCKS VAULT with "do not sign". Executors carrying the marker are permitted but need a second confirming press. Salts mined here always produce a 0x00 address prefix, so a vault deployed from this app can never carry the marker at all.</div>

<div class="sig">L-2 &middot; UNRECOVERABLE DESTINATIONS <span class="params">— low, mitigated</span></div>
<div class="desc">Both singleton constructors are payable and neither contract has a withdrawal path, so value sent to them is gone. Transfers, custom calls and batch legs that send value to the factory, the implementation, address(0) or the owner-list sentinel are refused outright; an inbound proposal doing the same is labelled UNRECOVERABLE. Value passed to create() is unaffected.</div>

<div class="sig">I-1 &middot; QUEUE ERRORS <span class="params">— informational, mitigated</span></div>
<div class="desc">executeQueued reverts NotReady(eta) both when nothing is queued and when the timelock has not elapsed. The two cases are already distinguishable from the revert data — eta is 0 in one and a future timestamp in the other — so this app decodes them and reports them separately, rather than showing one undecoded revert for two unrelated problems.</div>

<div class="sig">I-2 &middot; DOMAIN SEPARATOR GAS <span class="params">— informational, accepted</span></div>
<div class="desc">The EIP-712 domain separator is recomputed per call rather than cached, costing ~500–800 gas. Accepted as intended design: reading block.chainid live is what makes signatures fork-safe by construction, with no cached value that can go stale. Nothing for a client to mitigate.</div>

<div class="sig">M-1 &middot; CODELESS GUARD EXECUTOR <span class="params">— medium, mitigated</span></div>
<div class="desc">The guard hook is a high-level call, so the compiler checks the target has code first. A 0x1111 address holding none — an EOA, or a guard planned but not yet deployed — reverts every execute() and executeQueued(), and every route back is onlySelf and so runs through the execute() that is already reverting. This app reads the chain before proposing such an executor and refuses one with no code.</div>

<div class="sig">M-2 &middot; M-3 &middot; UNRECOVERABLE TIMELOCK STATES <span class="params">— medium, mitigated</span></div>
<div class="desc">setDelay takes any uint32, up to ~136 years, and the proposal that would undo a bad one waits it out first. Removing the executor while a delay is set strands every queued proposal, since a cancel is queued too. Delays over 30 days need a second press and are refused outright on a vault with no executor; setExecutor(0) is refused while a delay is live.</div>

<div class="sig">H-01 &middot; ROUTE-UNBOUND SIGNATURES <span class="params">— high, mitigated</span></div>
<div class="desc">The most serious issue any review has raised here, and the only one that touches the cancel path — which needs no forwardEnabled, so it reached every vault with a timelock and this executor. Every executor bundle this app builds now spends one slot on a sender slot bound to the submitter, so a copied bundle is inert on either route. For a cancel the protection is complete: the bundle is exactly threshold slots, so binding one leaves a copier a signature short. For unanimous accelerate or instant execute on a k-of-n vault it is partial — an adversary can still extract a threshold subset from the remaining signatures to queue the action and burn the nonce, which delays rather than defeats it. Private submission is the remaining mitigation there.</div>

<div class="sig">H-2 &middot; THRESHOLD OVERFLOW AT 1009 <span class="params">— mitigated</span></div>
<div class="desc">execute() computes the required signature length in uint16 inside an unchecked block, so at a threshold of 1009 it wraps to 49 while the verification loop still reads 1009 slots — no signature set can satisfy both, and owner-signed execution is dead permanently. ERC-1271 and the executor path widen correctly and keep working, which is what would make an attacker-held executor unremovable. Reachable only by deliberately configuring 1009+ owners; this app caps owners and thresholds at 1008.</div>

<div class="sig">L-04 &middot; EXECUTOR AS A DEAD END <span class="params">— low, mitigated</span></div>
<div class="desc">The TimelockExecutor has no withdrawal path either. Plain ETH bounces since it has no receive function, but tokens sent to it are stuck forever. It is now refused as a destination alongside the factory and the implementation.</div>

<div class="sig">L-2b &middot; SILENT SELF-CALL NO-OPS <span class="params">— low, mitigated</span></div>
<div class="desc">The vault's fallback returns success for selectors it has no function for, so a mistyped governance self-call emits ExecutionSuccess, burns the nonce and changes nothing — monitoring agrees it worked. A proposal carrying a self-call the vault cannot answer is flagged SELF-CALL &middot; SILENT NO-OP.</div>

<h2>ACCEPTED, NOT FIXED</h2>
<p>Recorded so they are not surprises. Each is documented design rather than an oversight:</p>
<div class="sig">THE EXECUTOR IS A FULL KEY</div>
<div class="desc">It bypasses both signatures and the delay by design. A guard is installed <em>as</em> the executor, so installing one grants full custody — unlike Safe, where a Guard can only block. Treat any guard address as a co-owner and hold it to the same standard as the vault itself.</div>
<div class="sig">STALE APPROVALS SURVIVE REMOVAL</div>
<div class="desc">On-chain approvals are keyed by address and never cleared, so removing an owner neutralises their approvals but re-adding the same address restores them. An address removed because it was compromised must never be re-added, even after rotating the key.</div>
<div class="sig">EIP-7702 CONFIGURATION IS EFFECTIVELY PERMANENT</div>
<div class="desc">Storage survives revoking the delegation and init() cannot be re-run, so a 7702 delegation to this implementation cannot be cleanly reconfigured afterwards. The EOA key also remains a superuser throughout.</div>
<div class="sig">ZERO-PREFIX SALTS ARE NOT FRONT-RUN PROTECTED</div>
<div class="desc">The factory accepts a salt starting with either the zero address or the caller's. Only the caller-bound form protects a counterfactual address from being claimed first. This app mines sender-bound salts exclusively — there is no code path here that produces the open form.</div>

<h2>DEPLOY &amp; LOAD VERIFICATION</h2>
<p>The audit's deployment checklist asked for the audited build to be confirmed on-chain rather than assumed. It now is:</p>
<div class="sig">PREFLIGHT</div>
<div class="desc">Before deploying, the factory on every target chain is asked for its implementation() and must name the audited one. Code being present at the factory address proved nothing on its own.</div>
<div class="sig">POST-DEPLOY</div>
<div class="desc">A mined receipt is not a deployment — on a chain without the factory, create() is a plain transfer that mines with status 1. The vault's runtime bytecode is read back and compared against the audited 45-byte clone, and its owners, threshold, delay and executor are matched against what was requested. A chain that will not answer reads DEPLOYED &middot; UNVERIFIED rather than counting as verified.</div>
<div class="sig">ON EVERY LOAD</div>
<div class="desc">The same bytecode check runs each time a vault is loaded, and anything that is not the audited build is badged UNVERIFIED CODE. A vault can arrive from a pasted address, where answering threshold() and getOwners() proves only that something implements the shape.</div>

EXECUTOR:`
<h2>TIMELOCKEXECUTOR.SOL</h2>
<p>Singleton executor module — one deployment serves all multisigs. Set as the multisig's executor via <code>setExecutor()</code>. Provides parallel execution paths using the multisig's own EIP-712 signatures.</p>

<div class="note">The same signatures collected for normal execute() work with the executor's forward(). The UI routes based on signature count and target.</div>

<h2>PATHS</h2>
<div class="sig">CANCEL <span class="params">— threshold sigs, always available</span></div>
<div class="desc">Cancel a queued transaction. The UI creates a new cancel proposal (consuming a nonce) that targets the multisig with cancelQueued(hash) calldata. Once threshold owners sign, forward() calls execute() as the executor — bypassing sigs and timelock — which self-calls cancelQueued(). No opt-in needed.</div>

<div class="sig">INSTANT EXECUTE <span class="params">— all-owner sigs, opt-in required</span></div>
<div class="desc">Skip the timelock entirely with unanimous signatures from every owner. Requires the multisig to have called <code>enableForward(true)</code>. forward() verifies all ownerCount sigs, then calls execute() as the executor for immediate execution.</div>

<div class="sig">ACCELERATE <span class="params">— all-owner sigs, opt-in required</span></div>
<div class="desc">Execute a queued tx before its ETA passes. Forward a self-call to executeQueued() — the multisig skips the ETA check for msg.sender == address(this). Same unanimous + opt-in requirement. This consumes a new nonce for the acceleration call itself.</div>

<h2>CORE FUNCTION</h2>
<div class="sig">forward<span class="params">(multisig, target, value, data, sigs)</span></div>
<div class="desc">Verify signatures against the multisig's owners and current nonce, then call multisig.execute(target, value, data, "") with empty sigs. The multisig trusts its executor and skips verification. Signature count determines the path: ownerCount for instant/accelerate, threshold for cancel.</div>

<h2>OPT-IN</h2>
<div class="sig">enableForward<span class="params">(bool enabled)</span></div>
<div class="desc">Toggle the instant/accelerate paths. Must be called by the multisig itself — typically via a multisig transaction, or via createWithCalls() at deploy time. Cancel path is always available regardless. The UI shows this toggle in the admin panel under EXECUTOR · INSTANT PATH.</div>

<h2>DESIGN</h2>
<p>The executor verifies signatures independently before calling <code>execute()</code> with empty sigs — the multisig trusts its executor and skips verification. This means the executor enforces its own rules (unanimous for fast path, threshold for cancel) while the multisig only sees a trusted caller.</p>
<p>Same EIP-712 Execute typehash as the multisig — no new signature types. Wallet signing UX is identical for both paths. The UI decides which contract to submit to based on how many sigs are collected and whether the target is a cancelQueued call.</p>

<div class="note">WARNING: Do not deploy TimelockExecutor at a vanity 0x1111 address. The Multisig has pre/post execution hooks that check if the executor address starts or ends with 0x1111 and would call into it unexpectedly.</div>
`,

INTERFACE:`
<h2>DASHBOARD</h2>
<p>Vault selector tabs across the top with inline status dots — green (pulsing) for executable transactions, yellow for transactions needing your signature. Primary holding displayed large, secondary tokens inline below. Vaults with no balances show a clean empty state. Metadata line shows threshold ratio, timelock duration (or UNLOCKED in yellow for delay=0), chain, and FAST PATH indicator when enabled.</p>
<p>An action counter above the tabs summarizes pending items across all vaults: signatures needed, ready to execute, ready to submit.</p>
<p>With no vaults loaded, the empty state offers CREATE VAULT or loading any existing vault by address or <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> name. Owner addresses reverse-resolve the same way — WNS (<code>.wei</code>) first, GNS (<code>.gwei</code>) as fallback, then ENS.</p>

<h2>SIGNING</h2>
<p>Two paths: <strong>SIGN</strong> (off-chain EIP-712, free, filled button) or <strong>APPROVE</strong> (on-chain approve() call, costs gas, outline button). Both count toward threshold. <strong>UNSIGN</strong> (outline) withdraws your approval — calls approve(hash, false). Visual hierarchy: filled = primary action, outline = secondary or already completed.</p>

<h2>TRANSACTION LIFECYCLE</h2>
<pre>STANDARD PATH (delay > 0)
  NEEDS SIGS → SUBMIT → ETA countdown → READY → EXECUTE

CANCEL PATH (threshold sigs, via executor)
  QUEUED TX → CANCEL creates new proposal → collect sigs → EXECUTE CANCEL

FAST PATH (all-owner sigs, opt-in, via executor)
  NEEDS SIGS → INSTANT EXECUTE (or QUEUE WITH TIMELOCK)

UNLOCKED (delay = 0)
  NEEDS SIGS → EXECUTE (immediate, no timelock)</pre>

<p>The standard path goes through the timelock. Cancel creates a new proposal at the next nonce targeting cancelQueued — it needs threshold signatures and executes immediately via the executor (no timelock for cancels). Cancel proposals are never blocked by the sequential queue since they route through the executor's parallel path and are marked VIA EXECUTOR.</p>
<p>The fast path appears when all owners have signed AND enableForward is active — offering both INSTANT EXECUTE and QUEUE WITH TIMELOCK as options. Unlocked vaults (delay=0) skip the queue entirely.</p>

<h2>TX BUILDER</h2>
<p>Three modes:</p>
<p><strong>TRANSFER</strong> — Token selector shows chain-specific tokens with correct decimal handling: ETH (18), USDC/USDT (6), WBTC/cbBTC (8), DAI/wstETH (18). Amount input shows live conversion to raw token units below the field. For ERC-20s, a note clarifies the on-chain encoding: transfer(recipient, amount) on the token contract.</p>
<p><strong>CUSTOM</strong> — Raw target address, ETH value (with live wei conversion preview), and calldata textarea. For arbitrary contract interactions.</p>
<p><strong>BATCH</strong> — Multiple calls with target, value (ETH with wei preview), and calldata. Add/remove calls dynamically. Encodes as a single multisig transaction via batch() — onlySelf, so the multisig calls itself.</p>

<h2>ADMIN</h2>
<p>Three sub-tabs — POLICY, OWNERS, HISTORY. Vault selector at top allows switching between vaults. All changes flash PROPOSE messages since they require multisig approval (onlySelf).</p>
<p><strong>POLICY</strong> — Threshold selector with live CHANGED indicator. Delay input in hours with diff preview. Executor address display showing TIMELOCK EXECUTOR (DEFAULT) when using the standard plugin. When delay > 0 and executor is set, an EXECUTOR · INSTANT PATH section shows the enableForward toggle with signature requirement details (N/N for instant, threshold/N for cancel).</p>
<p><strong>OWNERS</strong> — List with REMOVE buttons (not shown for yourself). Add owner form. removeOwner requires ownerCount > threshold.</p>
<p><strong>HISTORY</strong> — Executed transaction log with nonce, action type, details, and time.</p>

<h2>CREATE</h2>
<p>Deploy a new vault via MultisigFactory. Add owner addresses in any order — the app auto-sorts them ascending before submission (contract requirement). Minimum 1 owner. Threshold selector auto-clamps to owner count. Delay in hours — setting 0 shows UNLOCKED warning and hides the fast path toggle.</p>
<p><strong>CLONE A SAFE</strong> — the Safe mark beside OWNERS opens a one-field migration tool: give it a Gnosis Safe by address or <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> name and it copies that Safe's owners and threshold into the form, labelling each signer with whatever name it reverse-resolves to. Read-only — it calls <code>getOwners()</code> and <code>getThreshold()</code>, touches nothing on the Safe, and moves no funds; the new vault is a fresh deployment, so assets are transferred afterwards. Timelock, instant execution and chain selections stay whatever you set. The Safe is read on the network the form is deploying to; if it is not there, the tool reports which supported chains it did find it on, and loading one of those switches the deploy to that chain. A banner records the source Safe and undoes the clone in one click.</p>
<p>When delay > 0, an INSTANT EXECUTION toggle enables the fast path at deploy time. If enabled, deployment uses <code>createWithCalls()</code> to call enableForward(true) on the TimelockExecutor as a post-init step with the factory as temporary executor. Network selector shows supported chains with chain IDs and token lists.</p>
`
