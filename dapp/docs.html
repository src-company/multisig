<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* Ink ladder — kept in step with index.html. See the note there for the
   derivation; figures are APCA Lc against each theme's own --bg. */
:root{
  /* Lc:      78.1        —          64.3        73.3   */
  --a:#F5FBFF;--bg:#2D5FE8;--d:#D6E6FF;--m:#EAF4FF;
  /* Lc:       9.5         16.2        65.7                45.0        57.3 */
  --ln:#FFFFFF2E;--fr:#FFFFFF47;--g:#7DFFBA;--gc:#0A0A0A;--r:#FFB1AC;--y:#FFD600;
  --on:#0A0A0A;
  --f:'IBM Plex Mono','Courier New',monospace;
}
.light{
  /* Lc:      80.5        —          65.2        73.3   */
  --a:#00677C;--bg:#FDFDFD;--d:#008CA6;--m:#007990;
  --ln:#0099B326;--fr:#0099B340;--g:#059669;--gc:#fff;--r:#DC2626;--y:#B45309;
  --on:#FDFDFD;
}
body{font-family:var(--f);background:var(--bg);color:var(--a);min-height:100vh;padding:10px;transition:background .3s,color .3s}
a{color:var(--a)}
button{cursor:pointer;font-family:var(--f)}
button:active{transform:scale(.97)}
@media(hover:hover){button:hover{opacity:.75}}
/* Kept in step with index.html: this page had no focus indicator at all, so a
   keyboard user tabbing between the section tabs had nothing to go on. */
button:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--ln)}

.scan{position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0A0A0A04 3px,#0A0A0A04 6px)}
.light .scan{background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0099B302 3px,#0099B302 6px)}

.frame{position:relative;padding:0 24px;max-width:780px;margin:0 auto}
.rail{position:absolute;top:0;bottom:0;width:12px;overflow:hidden;writing-mode:vertical-lr;font-size:11px;letter-spacing:1px;color:var(--fr);user-select:none;line-height:12px}
.rail-l{left:0}.rail-r{right:0}
.hbar{font-size:11px;letter-spacing:1px;color:var(--fr);user-select:none;overflow:hidden;white-space:nowrap;line-height:1}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:22px 0 16px}
.logo{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1}
.logo a{text-decoration:none;color:var(--a)}
.logo-sub{font-size:10px;letter-spacing:2px;color:var(--m);margin-top:4px}
.theme-btn{background:transparent;border:1px solid var(--ln);color:var(--a);width:40px;height:40px;font-size:14px;display:flex;align-items:center;justify-content:center}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--ln);margin-bottom:32px}
.tab{background:transparent;border:none;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--d);padding:14px 0;border-bottom:2px solid transparent;text-transform:uppercase}
.tab.on{color:var(--a);border-bottom-color:var(--a)}

.content{min-height:50vh}

h2{font-size:14px;font-weight:700;letter-spacing:2px;margin:32px 0 12px;text-transform:uppercase}
h2:first-child{margin-top:0}
p{font-size:13px;line-height:1.9;color:var(--m);margin-bottom:16px}
code{font-size:12px;color:var(--a);background:var(--ln);padding:2px 6px}
pre{font-size:11px;line-height:1.7;color:var(--m);padding:16px;border:1px solid var(--ln);overflow-x:auto;margin-bottom:16px;white-space:pre;tab-size:2}
.sig{font-size:12px;color:var(--a);padding:10px 0;border-bottom:1px solid var(--ln);font-weight:600}

.desc{font-size:12px;color:var(--m);padding:4px 0 14px;line-height:1.7}
.note{font-size:11px;color:var(--m);border-left:2px solid var(--a);padding:8px 0 8px 14px;margin:16px 0;line-height:1.7}
/* Tables carry two columns of short label + value here, so they get a real
   column gutter (there was none — cells butted straight into each other) and
   top alignment, so the first line of every cell in a row shares a baseline
   instead of the shortest cell floating to the middle of the tallest.
   Wrapping is opt-in: break-all was applied to every cell, which is right for a
   40-character address and wrong for prose, where it splits words mid-syllable.
   .brk marks the cells that hold unbreakable machine strings. */
table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--d);padding:10px 20px 10px 0;border-bottom:1px solid var(--ln);vertical-align:bottom}
td{padding:12px 20px 12px 0;border-bottom:1px solid var(--ln);color:var(--m);vertical-align:top}
th:last-child,td:last-child{padding-right:0}
td.brk{word-break:break-all}
td a{color:var(--a);text-decoration:none;border-bottom:1px solid var(--ln)}
td a:hover{border-bottom-color:var(--a)}

/* ── AUDIT LEDGER ──────────────────────────────────────────────────
   Six reviews, each with a date, an auditor, a scope and a severity
   breakdown. As a five-column table inside a 780px frame every cell was
   narrower than its content, so every one of them was hand-broken with <br>
   until nothing lined up: the date floated to the vertical middle of a
   three-line neighbour, and break-all split "multi-agent" across lines.
   One record per review instead. The date and auditor lead on a single line
   with the report links on the trailing edge; the scope reads as prose because
   that is what it is; and the finding counts become chips toned by severity
   class, so the ladder is scannable without being read word by word. */
/* baseline, not top: the date is 11px and the auditor 13px, so aligning their
   boxes leaves the date sitting 2px high. Rows 2 and 3 hold a single item each,
   where baseline alignment is a no-op. */
.audit{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:7px 18px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--ln)}
.audit:first-of-type{border-top:1px solid var(--ln)}
.audit-when{grid-column:1;grid-row:1;font-size:11px;color:var(--d);white-space:nowrap;line-height:1.5}
.audit-who{grid-column:2;grid-row:1;font-size:13px;font-weight:700;color:var(--a);line-height:1.5}
/* The qualifier is who/how, not a second auditor — same line where it fits,
   never competing with the name for weight. */
.audit-who .q{font-weight:400;color:var(--d);font-size:11px;margin-left:8px}
.audit-links{grid-column:3;grid-row:1;display:flex;gap:14px;justify-self:end;align-items:baseline;white-space:nowrap}
.audit-links a{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--d);text-decoration:none;border-bottom:1px solid var(--ln)}
.audit-links a:hover{color:var(--a);border-bottom-color:var(--a)}
.audit-scope{grid-column:2/-1;font-size:11px;color:var(--m);line-height:1.6}
.audit-scope .op{color:var(--d)}
.audit-find{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
/* Method is how the review was run, not what it covered — dimmer than the scope,
   and placed explicitly like its siblings so a record that omits one row does not
   shuffle the rest into column 1. */
.audit-meth{grid-column:2/-1;font-size:11px;color:var(--d);line-height:1.6}
/* Severity chip. Tone is the severity CLASS, not a verdict on the project —
   the same vocabulary every report uses. A zero count keeps its slot (0 high is
   the most informative cell in the row) but drops its tone, so the eye lands on
   what was actually found. */
.sev{font-size:9px;font-weight:700;letter-spacing:1.5px;border:1px solid var(--ln);padding:3px 7px;color:var(--d);white-space:nowrap}
.sev.crit,.sev.high{color:var(--r);border-color:color-mix(in srgb,var(--r) 45%,transparent);background:color-mix(in srgb,var(--r) 8%,transparent)}
.sev.med{color:var(--y);border-color:color-mix(in srgb,var(--y) 45%,transparent);background:color-mix(in srgb,var(--y) 8%,transparent)}
.sev.low{color:var(--m)}
.sev.zero{color:var(--d);border-color:var(--ln);background:transparent}

.footer{border-top:1px solid var(--ln);padding:12px 0;display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:var(--d)}
.footer a{color:var(--d);text-decoration:none}
.footer a:hover{color:var(--a)}

@media(max-width:640px){

  .hdr{padding:18px 0 12px}
  .tabs{gap:12px;margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{font-size:11px;padding:12px 0;white-space:nowrap}
  h2{font-size:13px;margin:24px 0 10px}
  p{font-size:12px}
  pre{font-size:10px;padding:12px}
  /* One column: the date leads as its own dim line, the auditor and scope run
     full width, and the report links drop to the bottom of the record rather
     than fighting the name for a 320px row. */
  .audit{grid-template-columns:minmax(0,1fr);gap:6px 0;padding:16px 0}
  .audit-when{grid-area:1/1}
  .audit-who{grid-area:2/1;font-size:12px}
  .audit-scope{grid-area:3/1}
  .audit-meth{grid-area:4/1}
  .audit-find{grid-area:5/1}
  .audit-links{grid-area:6/1;justify-self:start;gap:16px;margin-top:3px}
  .audit-who .q{display:block;margin-left:0;margin-top:2px}
  th,td{padding-right:14px}
}

<script>
const asc=n=>"/".repeat(n);
const mob=()=>window.innerWidth<=640;

const TABS=["OVERVIEW","CONTRACT","EXECUTOR","INTERFACE","AUDITS"];

// Tabs are addressable by hash, so a link can open the page on one — the app
// footer's AUDIT link is docs.html#audits. An unknown or absent hash falls back
// to OVERVIEW rather than rendering an empty page.
const tabFromHash=()=>{
  const h=decodeURIComponent(location.hash.replace(/^#/,'')).toUpperCase();
  return TABS.includes(h)?h:"OVERVIEW";
};
let dark=!localStorage.getItem('ms_light'),tab=tabFromHash();
// Writing the hash keeps a tab shareable and gives Back something to return to.
function go(t){ if(!TABS.includes(t)) return; tab=t; location.hash=t.toLowerCase(); render(); }

const CONTENT={
OVERVIEW:`
<h2>WHAT</h2>
<p>A multichain multisig wallet with an embedded timelock. Deployed via CREATE2 minimal proxy clones for deterministic addresses across chains.</p>

<h2>WHY</h2>
<p>Regular multisigs execute instantly once threshold is met. That's fine until a compromised key or social engineering attack drains your treasury in one block. The embedded timelock adds a mandatory delay between queuing and execution, giving owners time to detect and cancel malicious transactions.</p>

<div class="note">Protects against everyday mistakes, defends protocols and their users from malicious upgrades and migrations, and provides more peace of mind than a regular multisig.</div>

<h2>HOW IT WORKS</h2>
<p>Owners sign transactions off-chain (EIP-712) or approve on-chain. Once threshold signatures are collected, <code>execute()</code> queues the transaction with an ETA based on the configured delay. After the timelock passes, <code>executeQueued()</code> completes it.</p>
<p>The default executor plugin (TimelockExecutor) adds two parallel paths: <strong>cancel</strong> a queued transaction with threshold signatures, or <strong>instantly execute</strong> with unanimous (all-owner) signatures when opted in. The fast path is optional — vaults must explicitly enable it via <code>enableForward</code>.</p>
<p>Setting delay to 0 creates an <strong>unlocked</strong> vault — transactions execute immediately once threshold is met, with no timelock. The fast path toggle is hidden since there is no delay to bypass.</p>

<h2>TWO WAYS TO GET ONE</h2>
<p>Deploy a vault — a CREATE2 clone, same address on every chain — or delegate an <strong>existing EOA</strong> to the same implementation under EIP-7702, which keeps the address you already have and adds batching, ERC-1271 signing, an optional delay and optional co-signers to it. The first is custody; the second is capability. Many accounts want the second long before they need the first, and delegating costs one transaction and moves nothing. See <a href="#contract">CONTRACT</a>.</p>

<h2>CHAINS</h2>
<p>Ethereum, Base, MegaETH, Arbitrum, Optimism. Same contract, same address via CREATE2. Testnets: Sepolia, Base Sepolia.</p>

<h2>TOKENS</h2>
<p>ETH (18 decimals), USDC (6), USDT (6), DAI (18), WBTC (8, cbBTC on Base), wstETH (18). Native ETH receiving and ERC-721/1155 callbacks supported via the fallback function. The UI converts human-readable amounts to raw token units automatically.</p>
`,

CONTRACT:`
<h2>MULTISIG.SOL</h2>
<p>One file, 321 lines, holding the wallet and its factory. Owners stored as a linked list (sentinel pattern). Sequential nonce. EIP-712 signatures. ERC-1271 support via <code>isValidSignature</code>.</p>

<h2>STATE</h2>
<pre>uint32  delay        // timelock in seconds (0 = unlocked)
uint32  nonce        // sequential, increments on execute()
uint16  threshold    // sigs required
uint16  ownerCount   // total owners
address executor     // bypass role (typically TimelockExecutor)</pre>

<h2>CORE FUNCTIONS</h2>
<div class="sig">execute<span class="params">(target, value, data, sigs)</span></div>
<div class="desc">Verify signatures, then either execute immediately (delay=0 or caller is executor) or queue with ETA. Nonce increments here. Executor callers skip signature verification entirely.</div>

<div class="sig">executeQueued<span class="params">(target, value, data, nonce)</span></div>
<div class="desc">Execute a previously queued transaction. Self-calls (msg.sender == address(this)) skip the ETA check — this is how the executor accelerates queued txs. External callers must wait for the ETA to pass. Requires eta != 0 (tx must be queued).</div>

<div class="sig">approve<span class="params">(hash, ok)</span></div>
<div class="desc">On-chain approval. Owners can pre-approve a transaction hash as an alternative to off-chain EIP-712 signatures. Pass ok=false to revoke. The approve maps to the APPROVE button in the UI, while ok=false maps to UNSIGN.</div>

<div class="sig">cancelQueued<span class="params">(hash)</span></div>
<div class="desc">onlySelf. Cancel a queued transaction and delete its ETA. Invoked via the executor's cancel path — TimelockExecutor.forward() calls execute() targeting the multisig with cancelQueued calldata, satisfying the onlySelf requirement as a self-call.</div>

<div class="sig">batch<span class="params">(targets[], values[], datas[])</span></div>
<div class="desc">Execute multiple calls atomically. onlySelf — must be called by the multisig itself via execute(). The UI's BATCH mode in the TX builder encodes this.</div>

<div class="sig">delegateCall<span class="params">(target, data)</span></div>
<div class="desc">onlySelf. Execute a delegatecall to target. Use for module installations or storage-manipulating upgrades.</div>

<h2>VIEW FUNCTIONS</h2>
<div class="sig">getTransactionHash<span class="params">(target, value, data, nonce)</span></div>
<div class="desc">Compute the EIP-712 hash for a transaction. Used by both the multisig and TimelockExecutor for signature verification. Same hash format for both paths.</div>

<div class="sig">isOwner<span class="params">(account)</span> / getOwners<span class="params">()</span></div>
<div class="desc">Query owner status and list. getOwners walks the linked list from sentinel to sentinel.</div>

<div class="sig">isValidSignature<span class="params">(hash, sigs)</span></div>
<div class="desc">ERC-1271 signature validation. Wraps the hash in a SafeMessage typehash before verifying. Returns the magic value on success.</div>

<h2>ADMIN (onlySelf)</h2>
<div class="sig">setThreshold<span class="params">(threshold)</span></div>
<div class="desc">Must be non-zero and ≤ ownerCount. All admin changes go through the multisig itself — they're proposed as transactions targeting the vault's own address.</div>

<div class="sig">setDelay<span class="params">(delay)</span></div>
<div class="desc">Timelock period in seconds. Set 0 for unlocked (instant execution, no timelock).</div>

<div class="sig">setExecutor<span class="params">(executor)</span></div>
<div class="desc">Set to TimelockExecutor address for the default plugin. Set 0x0 to disable bypass entirely. The executor can call execute() without signatures and without timelock delay.</div>

<div class="sig">addOwner<span class="params">(owner)</span> / removeOwner<span class="params">(prev, owner)</span></div>
<div class="desc">Linked list ops. addOwner inserts the new owner right after the sentinel (list order isn't kept sorted). removeOwner takes the prevOwner pointer and enforces ownerCount > threshold. Sorting is only required for the init owner array and for signature bundles.</div>

<h2>FACTORY</h2>
<p><code>MultisigFactory.create()</code> deploys minimal proxy clones via CREATE2 with PUSH0 and calls <code>init()</code> on the new proxy. Salt must start with 0x0 or msg.sender for frontrun protection.</p>
<p><code>createWithCalls()</code> deploys with the factory as temporary executor, executes post-init calls (like <code>enableForward(true)</code> on the TimelockExecutor), then sets the real executor. Used when the fast path needs to be enabled at deploy time.</p>
<p>Post-init calls are one list, not one call. Enabling the fast path and claiming an on-chain name are independent options that produce one, two or three entries in the same <code>targets/values/datas</code> arrays, executed in order by the new vault before the real executor is installed. Every call runs as the vault, which is why a name claimed this way is minted to the vault rather than to the deployer.</p>

<h2>EIP-7702 DELEGATION</h2>
<p>The implementation the factory clones can be installed on an existing EOA instead of deployed beside it. An EIP-7702 authorisation points the account's code at the implementation, and a self-call to <code>init(owners, delay, threshold, executor)</code> in the same transaction configures it — <code>init</code> accepts the factory <em>or</em> the account itself, which is the whole of what makes the second path work. Nothing is deployed and nothing is transferred: the address, its history, its holdings and its name stay where they are.</p>
<p>Treat it as an onboarding step rather than a commitment. An account that wants batching today can delegate today and deploy a real vault later, when there is something worth guarding — or never, if co-signing on the address it already has is the whole requirement.</p>

<div class="sig">WHAT THE ACCOUNT GAINS</div>
<div class="desc"><code>batch()</code> for atomic multicalls — approve and swap as one transaction, or pay thirty addresses without signing thirty times; <code>delegateCall</code>; ERC-1271 <code>isValidSignature</code>, so the account can authorise Permit2, Seaport and intent orders as a smart account rather than as a bare key; ERC-721/1155 receive callbacks; an optional timelock; and the executor slot with its guard hooks. <code>batch</code> and <code>delegateCall</code> are onlySelf, and the delegating key satisfies onlySelf directly — a solo delegation uses both with no signature collection at all. Where ECDSA signatures are collected instead, <code>execute()</code> is permissionless, so a third party can relay it and pay the gas.</div>

<div class="sig">CO-SIGNING WITHOUT SHARED CUSTODY</div>
<div class="desc">Owners can be the account itself plus one other key, at 2-of-2. The account's own slot is filled by the sender bypass — <code>v=0</code> with its address in <code>r</code>, satisfied because <code>msg.sender</code> is the account — so exactly one signature is ever collected, and pressing send <em>is</em> your half of the quorum. The other key can equally be the submitter, with your ECDSA signature or on-chain approval filling your slot.</div>

<div class="sig">THE AGENTIC 2-OF-2</div>
<div class="desc">The natural use of that shape: your EOA delegates, and an agent's key is the second owner. The agent can prepare, sign and submit whatever it likes and can complete nothing alone, because it holds one of two required slots. Add a delay and its proposals queue in the open where you can cancel them; set a guard as executor and its reach narrows to an allowlist. The direction matters — <strong>you</strong> must hold the delegating key. Inverted, with the agent holding it, the quorum protects nothing, for the reason below.</div>

<div class="sig">THE KEY IS STILL A SUPERUSER</div>
<div class="desc">The delegating EOA never stops being an EOA. It can send ordinary transactions that touch none of this logic, it satisfies every onlySelf function directly — <code>setThreshold</code>, <code>addOwner</code>, <code>setDelay</code> — and it can revoke the delegation whenever it likes. The threshold is therefore a floor for everyone <em>except</em> that key: co-signers are bound, the key is not, and the delay constrains the quorum route rather than the account. That is exactly right for delegating capability to an agent or a co-signer, and exactly wrong for a treasury where no single key should be able to move funds. For that, deploy a clone — a clone has no superuser.</div>

<div class="sig">CONFIGURE ONCE, NOT TWICE</div>
<div class="desc">Revoking the delegation does not clear the storage it wrote. The owners, threshold and nonce survive, and <code>init()</code> refuses to run a second time, so an account cannot be re-delegated and re-configured from scratch; the same slot written by some <em>other</em> delegate is the same hazard in reverse, and this implementation should not be pointed at an account that has carried one. Ordinary reconfiguration still works — the setters are reachable, and the key can call them directly. It is the reset that is unavailable. See <a href="#audits">AUDITS</a> — EIP-7702 configuration is effectively permanent.</div>

<div class="sig">PER CHAIN, AND BOUND TO THE ACCOUNT</div>
<div class="desc">Authorisation and init are per chain: the same EOA elsewhere is a plain EOA until delegated and inited there, with its own independent owner set and nonce. The EIP-712 domain separator is the account's own address and live chain id, so signatures collected for a delegated account cannot be aimed at a clone, at another account, or at the same account on another chain.</div>

<p>EIP-712 typed data with <code>Execute(address target,uint256 value,bytes data,uint32 nonce)</code> typehash. Packed as 65-byte chunks (r, s, v). v=0 indicates on-chain approval — address packed in r, verified against the <code>approved</code> mapping or msg.sender. Signers must be sorted ascending (contract enforces signer > prev). Same signature format for Multisig.execute() and TimelockExecutor.forward().</p>

<h2>WHAT THEY FOUND</h2>
<p><strong>No reviewer found a way for an unauthorised party to move funds from a correctly configured vault.</strong> The signature scheme, nonce handling, owner list, replay protection and clone bytecode were each independently verified sound by several of them. Nothing found warranted redeploying the contracts, which are immutable singletons already live at mined addresses on every supported chain.</p>
<p>What they did find falls into two groups. <strong>Configuration traps</strong> — one-way doors a vault's owners would have to deliberately sign their way into. This app now refuses to build every one of them. And <strong>composition issues</strong> between the vault and its executor module, which cost timing rather than funds. Those are answered below.</p>
<div class="note">Severities were inconsistent across reports — one filed a critical that rested on a misreading of which address a code branch tests, and two mis-sized the same arithmetic bug by a factor of 65. Each report's response records where we agreed, where we did not, and why. Disputed findings are argued in the reports rather than quietly dropped.</div>
<div class="note">The 2026-04 pass is the reason several later reviews came back clean, and its own record is worth reading for one reversal. It found the route-substitution mechanism first and accepted it, on the grounds that the worst case was a <em>delayed</em> cancel rather than no cancel. That holds for an ordinary transaction and fails for a cancellation, which is the case it missed — and which the July reviews escalated. An impact argument that holds in general can still fail on the one call whose whole value is being fast.</div>

<h2>CONFIGURING A VAULT</h2>
<p>The choices that actually matter, in the order you make them.</p>

<div class="sig">A TIMELOCK NEEDS AN EXECUTOR TO BE CANCELLABLE</div>
<div class="desc">With a delay and no executor, queueing works and third parties get their full notice period — but nothing can be stopped. Cancelling is a self-call, so it routes through the queue like everything else and matures no earlier than the thing it cancels. Setting the TimelockExecutor as executor adds the missing half: a cancel on threshold signatures, executing immediately. This app always pairs a non-zero delay with it, and refuses to remove it while a delay is set.</div>

<div class="sig">CANCELLING IS THE RELIABLE BRAKE</div>
<div class="desc">It needs only threshold signatures, works whether or not the fast path is enabled, and executes immediately. If you are considering the fast path for emergencies, you already have what you need. One operational detail: a cancel should be submitted by one of its signers. The app spends a slot of the bundle on that signer so a copy of it is useless to anyone else — see below — and tells you if it could not.</div>

<div class="sig">THE FAST PATH IS FOR SPEED, NOT EMERGENCIES</div>
<div class="desc">It lets a vault that needs only partial consensus to act slowly act immediately when every owner agrees — routine payments, trading. Signatures accrue toward it: collect the threshold and a proposal is queueable; if a further owner signs the same proposal before it is submitted, it becomes instantly executable, with nobody re-signing.</div>

<div class="sig">EXCEPT WHERE THE THRESHOLD IS THE OWNER COUNT</div>
<div class="desc">On a 2-of-2 or 3-of-3 every quorum is already unanimous, so there is no higher bar to escalate to — the same signatures queue or execute, at the submitter's choice. The delay becomes the default route rather than a guarantee. Legitimate if that is what you want; the app flags it at create and asks for a second press in admin rather than refusing. Cancelling is unaffected.</div>

<div class="sig">SIGNED MESSAGES ARE NOT SUBJECT TO THE DELAY</div>
<div class="desc">A timelock constrains transactions, not message signing. Anything expressible as a signed order — Permit2, Seaport, intent systems — is authorised instantly with threshold signatures on any vault, however long the delay. Worth knowing if you assume the delay gates every outflow.</div>

<h2>SIGNING VS APPROVING</h2>
<div class="sig">WHY BOTH EXIST</div>
<div class="desc">Signing produces an off-chain signature: free, private, and it keeps the front-run protection described below. Approving registers authorisation in the vault itself: it costs gas and is publicly readable, but it is the only route a DAO or contract owner has — a contract cannot produce a signature — and the only route that needs no coordination service at all. A vault whose owners approve on-chain keeps working if this app, its database, or its operator disappear. That independence is the point, and it is why the option stays even though most signers should prefer signing.</div>
<div class="sig">KEEPING BOTH PROPERTIES AT ONCE</div>
<div class="desc">An on-chain approval is world-readable, so the slot it fills can be assembled by anyone — which gives up the binding that stops a collected bundle being replayed. The two are not in conflict: have every owner but one approve on-chain, and let the remaining owner submit without approving. Their slot stays sender-only, a copier is left one signature short, and no coordination service was needed to get there.</div>
<div class="sig">APPROVALS EXPIRE WITH THE NONCE</div>
<div class="desc">The approved hash commits to the vault's nonce and both execution routes compute against the live one, so an approval becomes permanently unreachable the moment the nonce advances past it. Stale approvals for consumed nonces are inert. Only ones made for a nonce the vault has not yet reached are worth revoking.</div>

<h2>WHEN TIMING IS CRITICAL</h2>
<div class="sig">WHY A PROPOSAL CAN BE FORCED INTO THE QUEUE</div>
<div class="desc">Both execution routes accept the same signatures, so someone who sees your bundle before it lands can submit it down the queueing route instead — your proposal is queued rather than executed now, and the nonce is consumed. It is not blocked and not lost: it executes when the delay elapses, and the same trick cannot be repeated once the entry is queued. To recover, accelerate it. To avoid it, submit through a private RPC — the attack needs your bundle to be public first, and on Base, Arbitrum and OP there is no public mempool to read.</div>
<div class="sig">THE TWO ROUTES THAT CANNOT BE FORCED</div>
<div class="desc">Cancelling is protected: the bundle is exactly threshold slots, so binding one to the submitter leaves a copier one short. And for guaranteed emergency <em>action</em>, the fast path is the wrong tool — use a separate multisig as the executor instead.</div>
<div class="sig">THE COUNCIL PATTERN</div>
<div class="desc">Replay is possible because the TimelockExecutor authorises against the vault's own signing digest, so one set of signatures opens both routes. The executor bypass needs no signatures at all — the vault skips its checks for whatever address is set as executor. So an executor that authorises against its <em>own</em> digest leaves nothing that can be replayed against the vault. A second vault is exactly that: deploy one with the same owners, unanimous threshold and no timelock, and set it as your main vault's executor. Ordinary proposals still queue for the full delay, unanimity acts immediately, and those signatures can never be aimed at the main vault because they carry a different verifying contract.</div>
<div class="desc">The tradeoff: the council's threshold governs both bypass <em>and</em> cancellation — one dial, not two. At unanimous, cancelling costs every owner rather than a quorum. The default TimelockExecutor charges only a quorum to cancel and is the better choice for most vaults; the council is there if you want the replay surface gone entirely.</div>

<h2>WHAT THIS APP GUARDS</h2>
<p>Every finding the reviews raised that a client can answer is answered here, at the point the transaction is built — so a proposal raised by other tooling is flagged the same way.</p>

<div class="sig">REPLAYED SIGNATURE BUNDLES <span class="params">— GPT-5.6 H-01, leftclaw M-2, Pashov executor F-1</span></div>
<div class="desc">Every executor bundle spends one slot on a sender slot bound to whoever submits, so a copied bundle is inert on either route. Complete for cancellation. Partial for unanimous fast-path bundles on a k-of-n vault, where a threshold subset of the remaining signatures can still be extracted to queue the action — which delays rather than defeats it.</div>

<div class="sig">EXECUTORS THAT BRICK THE VAULT <span class="params">— Shred L-1, Opus M-1, leftclaw H-1</span></div>
<div class="desc">A vault set as its own executor recurses through its guard hook until it runs out of gas, and the route back is only reachable through the call that is already failing. The same is true of any 0x1111-marked address holding no code, because the hook checks for code first. The app refuses a self-referential executor outright, and reads the chain before proposing a marked one.</div>

<div class="sig">UNRECOVERABLE TIMELOCK STATES <span class="params">— Opus M-2, M-3</span></div>
<div class="desc">The delay accepts any value up to ~136 years, and the proposal that would undo a bad one waits it out first. Removing the executor while a delay is set strands every queued proposal. Delays over 30 days need a second press and are refused outright on a vault with no executor; clearing the executor is refused while a delay is live.</div>

<div class="sig">THRESHOLD OVERFLOW <span class="params">— leftclaw H-2</span></div>
<div class="desc">The vault computes its required signature length in 16-bit arithmetic, so at a threshold of 1009 it wraps and no signature set can satisfy both the length check and the verification loop — owner-signed execution dies permanently while the executor path keeps working. Reachable only by deliberately configuring 1009+ owners; the app caps owners and thresholds at 1008.</div>

<div class="sig">UNRECOVERABLE DESTINATIONS <span class="params">— Shred L-2, GPT-5.6 L-04</span></div>
<div class="desc">None of the three singletons has a withdrawal path, and the implementation is never initialised so it has no owners who could authorise one. Transfers, custom calls and batch legs that send value to the factory, the implementation, the TimelockExecutor, address(0) or the owner-list sentinel are refused outright.</div>

<div class="sig">FAILURES THAT LOOK LIKE SUCCESSES <span class="params">— Shred I-1, Opus L-2</span></div>
<div class="desc">The vault reverts with one error for both "nothing is queued" and "the timelock has not elapsed"; the app decodes the eta and reports them separately. And its fallback returns success for selectors it has no function for, so a mistyped governance self-call would burn a nonce, emit a success event and change nothing — proposals carrying one are flagged before you sign.</div>

<h2>ACCEPTED, NOT FIXED</h2>
<p>Recorded so they are not surprises. Each is documented design rather than an oversight.</p>
<div class="sig">THE EXECUTOR IS A FULL KEY</div>
<div class="desc">It bypasses both signatures and the delay by design. A guard is installed <em>as</em> the executor, so installing one grants full custody — unlike Safe, where a Guard can only block. Treat any executor address as a co-owner and hold it to the same standard as the vault.</div>
<div class="sig">STALE APPROVALS SURVIVE REMOVAL</div>
<div class="desc">On-chain approvals are keyed by address and never cleared, so removing an owner neutralises their approvals but re-adding the same address restores them. An address removed because it was compromised must never be re-added, even after rotating the key.</div>
<div class="sig">QUEUED PROPOSALS OUTLIVE CONFIGURATION CHANGES</div>
<div class="desc">Execution re-checks nothing but the hash and the elapsed time — not the owner set, the threshold, or the executor — and queued entries never expire. Review and clear the queue before rotating owners, changing the threshold or the executor, or making a large deposit.</div>
<div class="sig">EIP-7702 CONFIGURATION IS EFFECTIVELY PERMANENT</div>
<div class="desc">Storage survives revoking the delegation and initialisation cannot be re-run, so a 7702 delegation to this implementation cannot be cleanly reconfigured afterwards. The EOA key also remains a superuser throughout.</div>
<div class="sig">ZERO-PREFIX SALTS ARE NOT FRONT-RUN PROTECTED</div>
<div class="desc">The factory accepts a salt starting with either the zero address or the caller's. Only the caller-bound form protects a counterfactual address from being claimed first. This app mines sender-bound salts exclusively — there is no code path here that produces the open form.</div>

<h2>VERIFYING A DEPLOYMENT</h2>
<p>The reviews asked for the audited build to be confirmed on-chain rather than assumed. It now is, on every deploy and every load.</p>
<div class="sig">BEFORE DEPLOYING</div>
<div class="desc">The factory on every target chain is asked for its implementation address and must name the audited one. Code being present at the factory address proved nothing on its own.</div>
<div class="sig">AFTER DEPLOYING</div>
<div class="desc">A mined receipt is not a deployment — on a chain without the factory, the call is a plain transfer that mines successfully. The vault's runtime bytecode is read back and compared against the audited clone, and its owners, threshold, delay and executor are matched against what was requested. A chain that will not answer reads DEPLOYED &middot; UNVERIFIED rather than counting as verified.</div>
<div class="sig">ON EVERY LOAD</div>
<div class="desc">The same bytecode check runs each time a vault is loaded, and anything that is not the audited build is badged UNVERIFIED CODE. A vault can arrive from a pasted address, where answering threshold() and getOwners() proves only that something implements the shape.</div>

EXECUTOR:`
<h2>TIMELOCKEXECUTOR.SOL</h2>
<p>Singleton executor module — one deployment serves all multisigs. Set as the multisig's executor via <code>setExecutor()</code>. Provides parallel execution paths using the multisig's own EIP-712 signatures.</p>

<div class="note">The same signatures collected for normal execute() work with the executor's forward(). The UI routes based on signature count and target.</div>

<h2>PATHS</h2>
<div class="sig">CANCEL <span class="params">— threshold sigs, always available</span></div>
<div class="desc">Cancel a queued transaction. The UI creates a new cancel proposal (consuming a nonce) that targets the multisig with cancelQueued(hash) calldata. Once threshold owners sign, forward() calls execute() as the executor — bypassing sigs and timelock — which self-calls cancelQueued(). No opt-in needed.</div>

<div class="sig">INSTANT EXECUTE <span class="params">— all-owner sigs, opt-in required</span></div>
<div class="desc">Skip the timelock entirely with unanimous signatures from every owner. Requires the multisig to have called <code>enableForward(true)</code>. forward() verifies all ownerCount sigs, then calls execute() as the executor for immediate execution.</div>

<div class="sig">ACCELERATE <span class="params">— all-owner sigs, opt-in required</span></div>
<div class="desc">Execute a queued tx before its ETA passes. Forward a self-call to executeQueued() — the multisig skips the ETA check for msg.sender == address(this). Same unanimous + opt-in requirement. This consumes a new nonce for the acceleration call itself.</div>

<h2>CORE FUNCTION</h2>
<div class="sig">forward<span class="params">(multisig, target, value, data, sigs)</span></div>
<div class="desc">Verify signatures against the multisig's owners and current nonce, then call multisig.execute(target, value, data, "") with empty sigs. The multisig trusts its executor and skips verification. Signature count determines the path: ownerCount for instant/accelerate, threshold for cancel.</div>

<h2>OPT-IN</h2>
<div class="sig">enableForward<span class="params">(bool enabled)</span></div>
<div class="desc">Toggle the instant/accelerate paths. Must be called by the multisig itself — typically via a multisig transaction, or via createWithCalls() at deploy time. Cancel path is always available regardless. The UI shows this toggle in the admin panel under EXECUTOR · INSTANT PATH.</div>

<h2>DESIGN</h2>
<p>The executor verifies signatures independently before calling <code>execute()</code> with empty sigs — the multisig trusts its executor and skips verification. This means the executor enforces its own rules (unanimous for fast path, threshold for cancel) while the multisig only sees a trusted caller.</p>
<p>Same EIP-712 Execute typehash as the multisig — no new signature types. Wallet signing UX is identical for both paths. The UI decides which contract to submit to based on how many sigs are collected and whether the target is a cancelQueued call.</p>

<div class="note">WARNING: Do not deploy TimelockExecutor at a vanity 0x1111 address. The Multisig has pre/post execution hooks that check if the executor address starts or ends with 0x1111 and would call into it unexpectedly.</div>

<p>Vault selector tabs across the top with inline status dots — green (pulsing) for executable transactions, yellow for transactions needing your signature. Primary holding displayed large, secondary tokens inline below. Vaults with no balances show a clean empty state. Metadata line shows threshold ratio, timelock duration (or UNLOCKED in yellow for delay=0), chain, and FAST PATH indicator when enabled.</p>
<p>An action counter above the tabs summarizes pending items across all vaults: signatures needed, ready to execute, ready to submit.</p>
<p>With no vaults loaded, the empty state offers CREATE VAULT or loading any existing vault by address or <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> name. Owner addresses reverse-resolve the same way — WNS (<code>.wei</code>) first, GNS (<code>.gwei</code>) as fallback, then ENS.</p>
<p><strong>A DELEGATED EOA LOADS LIKE ANY VAULT</strong> — an EOA delegated to the implementation under EIP-7702 answers the same ABI, so it loads by address and drives from the same screens: proposals, signing, the timelock, admin. It is badged <strong>EIP-7702</strong> rather than counted as a clone, because the code read back is <code>0xef0100</code> followed by the implementation address instead of the 45-byte clone, and because the key behind it can revoke the delegation at any time — the badge is there so a co-signer reads that before signing, not after. The delegation itself is a SET_CODE_TX signed by the account: make it from a wallet that supports EIP-7702 authorisations, then load the address here. This app operates a delegated account; it does not create the delegation.</p>

<h2>SIGNING</h2>
<p>Two paths: <strong>SIGN</strong> (off-chain EIP-712, free, filled button) or <strong>APPROVE</strong> (on-chain approve() call, costs gas, outline button). Both count toward threshold. <strong>UNSIGN</strong> (outline) withdraws your approval — calls approve(hash, false). Visual hierarchy: filled = primary action, outline = secondary or already completed.</p>

<h2>TRANSACTION LIFECYCLE</h2>
<pre>STANDARD PATH (delay > 0)
  NEEDS SIGS → SUBMIT → ETA countdown → READY → EXECUTE

CANCEL PATH (threshold sigs, via executor)
  QUEUED TX → CANCEL creates new proposal → collect sigs → EXECUTE CANCEL

FAST PATH (all-owner sigs, opt-in, via executor)
  NEEDS SIGS → INSTANT EXECUTE (or QUEUE WITH TIMELOCK)

UNLOCKED (delay = 0)
  NEEDS SIGS → EXECUTE (immediate, no timelock)</pre>

<p>The standard path goes through the timelock. Cancel creates a new proposal at the next nonce targeting cancelQueued — it needs threshold signatures and executes immediately via the executor (no timelock for cancels). Cancel proposals are never blocked by the sequential queue since they route through the executor's parallel path and are marked VIA EXECUTOR.</p>
<p>The fast path appears when all owners have signed AND enableForward is active — offering both INSTANT EXECUTE and QUEUE WITH TIMELOCK as options. Unlocked vaults (delay=0) skip the queue entirely.</p>

<h2>TX BUILDER</h2>
<p>Modes:</p>
<p><strong>TRANSFER</strong> — Token selector shows chain-specific tokens with correct decimal handling: ETH (18), USDC/USDT (6), WBTC/cbBTC (8), DAI/wstETH (18). Amount input shows live conversion to raw token units below the field. For ERC-20s, a note clarifies the on-chain encoding: transfer(recipient, amount) on the token contract.</p>
<p><strong>NAME</strong> — Ethereum mainnet only. Claims a free <code>&lt;label&gt;.id.wei</code> subdomain for the vault and points reverse resolution at it. Two calls: <code>register(namehash('id.wei'), label)</code> on the id.wei registrar, which mints the name to the caller and so makes the name resolve <em>to</em> the vault, and <code>setPrimaryName(id)</code> on WNS, which makes the vault answer <em>with</em> the name — the direction wallets and explorers read. Both are made by the vault, so the name is an NFT the vault itself holds and only a proposal reaching quorum can move it; holding it grants nobody any power over the vault. Where both calls are needed they are wrapped in the vault's own <code>batch()</code> so the mint and the reverse record either both land or neither does — a vault that minted a name and then failed to point at it would need a second proposal to finish a job that reads as done. Availability is checked by static-calling the exact <code>register()</code> that will run, asked <em>as the vault</em>: the registrar uses <code>_safeMint</code>, so that probe also answers whether this vault's code can receive the name at all. A name the vault already holds drops the proposal to <code>setPrimaryName</code> alone, since a second <code>register()</code> would revert and consume the nonce doing it. The interface will only claim labels of Latin letters, digits, hyphen and underscore, which is narrower than the registrar allows — the registrar accepts zero-width and non-breaking spaces and mixed scripts, and a name whose whole purpose is to be read before signing must not be able to look like another name.</p>
<p><strong>CUSTOM</strong> — Raw target address, ETH value (with live wei conversion preview), and calldata textarea. For arbitrary contract interactions.</p>
<p><strong>BATCH</strong> — Multiple calls with target, value (ETH with wei preview), and calldata. Add/remove calls dynamically. Encodes as a single multisig transaction via batch() — onlySelf, so the multisig calls itself.</p>

<h2>ADMIN</h2>
<p>Three sub-tabs — POLICY, OWNERS, HISTORY. Vault selector at top allows switching between vaults. All changes flash PROPOSE messages since they require multisig approval (onlySelf).</p>
<p><strong>POLICY</strong> — Threshold selector with live CHANGED indicator. Delay input in hours with diff preview. Executor address display showing TIMELOCK EXECUTOR (DEFAULT) when using the standard plugin. When delay > 0 and executor is set, an EXECUTOR · INSTANT PATH section shows the enableForward toggle with signature requirement details (N/N for instant, threshold/N for cancel).</p>
<p><strong>OWNERS</strong> — List with REMOVE buttons (not shown for yourself). Add owner form. removeOwner requires ownerCount > threshold.</p>
<p><strong>HISTORY</strong> — Executed transaction log with nonce, action type, details, and time.</p>

<h2>CREATE</h2>
<p>Deploy a new vault via MultisigFactory. Add owner addresses in any order — the app auto-sorts them ascending before submission (contract requirement), carrying each label with its address so labels cannot end up filed against the wrong signer. Minimum 1 owner. Threshold selector auto-clamps to owner count. Delay in hours — setting 0 shows UNLOCKED warning and hides the fast path toggle.</p>
<p><strong>OWNER NAMES RESOLVE IN THE FORM</strong> — an owner may be given as <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> instead of an address, and the row then shows the address it resolves to, truncated and linked to the explorer of the chain being deployed to. The owner set is the one part of a vault that cannot be corrected afterwards without a full multisig round of the vault itself, so it is not signed for while any of it is still an unresolved string: DEPLOY stays disabled while a lookup is in flight, and refuses a name that does not resolve, resolves to <code>0x0</code>/<code>0x1</code> (the owner list's sentinels), or lands on an address another row already holds. That last check is why resolution happens here rather than at submission — two names, or a name and the address it points at, are the same owner, and <code>init()</code> reverts on a repeat after the salt has been mined and the gas paid. What the form resolved is what gets deployed: if a name repoints between being reviewed and being signed for, the deploy stops instead of installing a signer nobody saw.</p>
<p><strong>ONE VAULT, MANY CHAINS</strong> — CLONE TO OTHER CHAINS deploys the same vault to the same address on every chain picked. The address is a CREATE2 address mined from the factory, the deployer and a salt, all of which are chain-independent, so the candidate is checked for existing code on <em>every</em> selected chain before it is accepted: an address that is free here but taken on a clone target would otherwise hand back a stranger's vault as though the clone had succeeded. Mixing mainnets and testnets in one go is allowed and flagged.</p>
<p><strong>REVIEW BEFORE ANY SIGNATURE</strong> — DEPLOY runs a read-only preflight, not a transaction: per chain, is the factory there, does the factory name the audited implementation, does the connected wallet hold gas, and — with instant execution on — is the TimelockExecutor there. A chain that will not answer is reported as unchecked rather than ready. The mined vault address is shown alongside, so the address funds will be sent to can be read before anything is signed. Every deploy stops on this screen, clean preflights included: it lists each owner at its resolved address, the signature threshold, the timelock, whether instant execution is on and what that grants, and which factory call will be made. Deploys then run one chain at a time, each needing a network switch and a signature. CANCEL returns to the form with it intact; nothing is signed until PROCEED.</p>
<p><strong>DEPLOYS ARE READ BACK, NOT ASSUMED</strong> — a mined receipt is not a deployment. A <code>create()</code> sent to a chain without the factory is a plain transfer to a codeless address: it succeeds, emits no <code>Created</code> event, and deploys nothing. So each chain is re-read after its transaction — code present, code is the audited build, and the live vault reports the owners, threshold, delay and executor that were ordered. A chain that deploys but cannot be read back is labelled UNVERIFIED rather than borrowing the word the checked ones earned, and a chain that fails can be retried on its own without redoing the ones that landed.</p>
<p><strong>A FREE ON-CHAIN NAME, IF THE VAULT IS NAMED</strong> — typing a vault name folds it into a candidate <code>.id.wei</code> label and offers to claim it, free, in the same transaction that deploys the vault. It is a checkbox and stays one: it costs nothing, grants nobody anything, and can be done later from the NAME tab instead. Availability is read live from the registrar, again in the deploy preflight, and once more immediately before the wallet prompt — a register that reverts takes the whole <code>createWithCalls()</code> down with it, and the vault, the mined salt and the gas are not worth losing for an option. If the name is gone by then, or mainnet will not confirm it is free, the name is dropped and the vault deploys without it, reported on the chain it was asked for rather than left silent. After the transaction lands the claim is read back off WNS instead of inferred from the receipt. WNS is a mainnet contract, so ticking the box adds Ethereum to the deploy if it was not already selected — stated on the line before the tick, and shown by Ethereum appearing ticked in the network panel, where unticking it cancels the claim. Clones on other chains share the vault's address, not its name.</p>
<p><strong>CLONE A SAFE</strong> — the Safe mark beside OWNERS opens a one-field migration tool: give it a Gnosis Safe by address or <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> name and it copies that Safe's owners and threshold into the form, labelling each signer with whatever name it reverse-resolves to. Read-only — it calls <code>getOwners()</code> and <code>getThreshold()</code>, touches nothing on the Safe, and moves no funds; the new vault is a fresh deployment, so assets are transferred afterwards. Timelock, instant execution and chain selections stay whatever you set. The Safe is read on the network the form is deploying to; if it is not there, the tool reports which supported chains it did find it on, and loading one of those switches the deploy to that chain. A banner records the source Safe and undoes the clone in one click.</p>
<p>When delay > 0, an INSTANT EXECUTION toggle enables the fast path at deploy time. If enabled, deployment uses <code>createWithCalls()</code> to call enableForward(true) on the TimelockExecutor as a post-init step with the factory as temporary executor. Network selector shows supported chains with chain IDs and token lists.</p>
`
};
