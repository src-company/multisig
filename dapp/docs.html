/* ── AUDIT LEDGER ──────────────────────────────────────────────────

/* The qualifier is who/how, not a second auditor: same line where it fits,
   never competing with the name for weight. */
.audit-who .q{font-weight:400;color:var(--d);font-size:11px;margin-left:8px}
.audit-links{grid-column:3;grid-row:1;display:flex;gap:14px;justify-self:end;align-items:baseline;white-space:nowrap}

.audit-scope{grid-column:2/-1;font-size:11px;color:var(--m);line-height:1.6}

.audit-find{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}

   the scope. Placed explicitly like its siblings, so a record that omits one row
   does not shuffle the rest into column 1. */
.audit-meth{grid-column:2/-1;font-size:11px;color:var(--d);line-height:1.6}

   row, but drops its tone so the eye lands on what was actually found. */
.sev{font-size:9px;font-weight:700;letter-spacing:1.5px;border:1px solid var(--ln);padding:3px 7px;color:var(--d);white-space:nowrap}

<script>

// How the sibling pages are linked to. `.html` is how a page happened to be
// requested, not part of where it lives, and the host answers both spellings —
// so BACK TO APP hands back `/` rather than `/index.html`, which is what the app
// itself spells in every link it builds. A directory index answers at both, and
// the bare directory is the one that belongs in a URL a reader may copy. Off
// http(s) — a copy opened from disk — the filename is the only thing that
// resolves, so there it stays.
const HTTPISH = /^https?:$/.test(location.protocol);
const APP_URL = HTTPISH ? "./" : "index.html";
const BRAND_URL = HTTPISH ? "brand" : "brand.html";

const TABS=["OVERVIEW","CONTRACT","EXECUTOR","INTERFACE","AUDITS"];

// Tabs are addressable by hash, so a link can open the page on one — the app
// footer's AUDIT link is docs.html#audits. An unknown or absent hash falls back
// to OVERVIEW rather than rendering an empty page.
const tabFromHash=()=>{
  // decodeURIComponent throws a URIError on a malformed escape — '#%' is
  // enough — and this runs at load as well as on every hashchange, so an
  // unguarded call turns a mistyped link into a blank page.
  let h;
  try{ h=decodeURIComponent(location.hash.replace(/^#/,'')).toUpperCase(); }
  catch(e){ return "OVERVIEW"; }
  return TABS.includes(h)?h:"OVERVIEW";
};
// Storage can be blocked or partitioned away, and it throws on read when it
// is — which at top level would take the whole page down over a theme.

const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
let dark=!lsGet('ms_light'),tab=tabFromHash();
// Writing the hash keeps a tab shareable and gives Back something to return to.

const CONTENT={
OVERVIEW:`
<h2>WHAT</h2>
<p>A multichain multisig wallet with a timelock built in. Vaults are CREATE2 minimal proxy clones, so one vault can hold the same address on every chain.</p>

<h2>WHY</h2>
<p>Most multisigs execute the moment the threshold is met, so a compromised key or a social-engineered signature can drain a treasury in one block. The timelock puts a mandatory delay between queuing and execution, which gives the other owners time to see a transaction and cancel it.</p>

<div class="note">It catches ordinary mistakes as well as attacks, and it gives a protocol's users notice before an upgrade or migration lands.</div>

<h2>HOW IT WORKS</h2>
<p>Owners sign transactions off-chain (EIP-712) or approve them on-chain. Once threshold signatures are collected, <code>execute()</code> queues the transaction with an ETA set by the configured delay. When the delay has passed, <code>executeQueued()</code> completes it.</p>
<p>The default executor plugin (TimelockExecutor) adds two parallel paths: <strong>cancel</strong> a queued transaction with threshold signatures, or <strong>execute instantly</strong> with signatures from every owner. The fast path is opt-in; a vault must enable it with <code>enableForward</code>.</p>
<p>A delay of 0 makes the vault <strong>unlocked</strong>: transactions execute as soon as the threshold is met. The fast path toggle is hidden, since there is no delay to skip.</p>

<h2>TWO WAYS TO GET ONE</h2>
<p>Deploy a vault, a CREATE2 clone with the same address on every chain. Or delegate an <strong>existing EOA</strong> to the same implementation under EIP-7702, which keeps the address you already have and adds batching, ERC-1271 signing, an optional delay and optional co-signers to it. A clone is a new account under shared custody; a delegation adds capability to an account that stays under one key. Delegating costs one transaction and moves nothing. See <a href="#contract">CONTRACT</a>.</p>

<h2>CHAINS</h2>
<p>Ethereum, Base, MegaETH, Arbitrum, Optimism. Same contract, same address via CREATE2. Testnets: Sepolia, Base Sepolia.</p>

<h2>TOKENS</h2>
<p>ETH (18 decimals), USDC (6), USDT (6), DAI (18), WBTC (8, cbBTC on Base), wstETH (18). On MegaETH: MEGA (18), USDm (18), USDT0 (6), WBTC (8), wstETH (18). Native ETH transfers in and ERC-721/1155 callbacks are handled by the fallback function. The app converts human-readable amounts to raw token units.</p>
`,

CONTRACT:`
<h2>MULTISIG.SOL</h2>
<p>One file, 275 lines of code, holding the wallet and its factory. Owners stored as a linked list (sentinel pattern). Sequential nonce. EIP-712 signatures. ERC-1271 support via <code>isValidSignature</code>.</p>

<h2>STATE</h2>
<pre>uint32  delay        // timelock in seconds (0 = unlocked)
uint32  nonce        // sequential, increments on execute()
uint16  threshold    // sigs required
uint16  ownerCount   // total owners
address executor     // bypass role (typically TimelockExecutor)</pre>

<h2>CORE FUNCTIONS</h2>
<div class="sig">execute<span class="params">(target, value, data, sigs)</span></div>
<div class="desc">Verify signatures, then either execute immediately (delay=0 or caller is executor) or queue with ETA. Nonce increments here. Executor callers skip signature verification entirely.</div>

<div class="sig">executeQueued<span class="params">(target, value, data, nonce)</span></div>
<div class="desc">Execute a previously queued transaction. Self-calls (msg.sender == address(this)) skip the ETA check, which is how the executor accelerates queued transactions. External callers must wait for the ETA to pass. Requires eta != 0, so the transaction must already be queued.</div>

<div class="sig">approve<span class="params">(hash, ok)</span></div>
<div class="desc">On-chain approval. Owners can pre-approve a transaction hash instead of producing an off-chain EIP-712 signature. Pass ok=false to revoke. APPROVE in the app calls this; UNSIGN calls it with ok=false.</div>

<div class="sig">cancelQueued<span class="params">(hash)</span></div>
<div class="desc">onlySelf. Cancel a queued transaction and delete its ETA. Invoked via the executor's cancel path: TimelockExecutor.forward() calls execute() targeting the multisig with cancelQueued calldata, which satisfies the onlySelf requirement as a self-call.</div>

<div class="sig">batch<span class="params">(targets[], values[], datas[])</span></div>
<div class="desc">Execute multiple calls atomically. onlySelf, so it must be called by the multisig itself via execute(). BATCH mode in the transaction builder encodes this.</div>

<div class="sig">delegateCall<span class="params">(target, data)</span></div>
<div class="desc">onlySelf. Execute a delegatecall to target. Use for module installations or storage-manipulating upgrades.</div>

<h2>VIEW FUNCTIONS</h2>
<div class="sig">getTransactionHash<span class="params">(target, value, data, nonce)</span></div>
<div class="desc">Compute the EIP-712 hash for a transaction. Used by both the multisig and TimelockExecutor for signature verification. Same hash format for both paths.</div>

<div class="sig">isOwner<span class="params">(account)</span> / getOwners<span class="params">()</span></div>
<div class="desc">Query owner status and list. getOwners walks the linked list from sentinel to sentinel.</div>

<div class="sig">isValidSignature<span class="params">(hash, sigs)</span></div>
<div class="desc">ERC-1271 signature validation. Wraps the hash in a SafeMessage typehash before verifying. Returns the magic value on success.</div>

<h2>ADMIN (onlySelf)</h2>
<div class="sig">setThreshold<span class="params">(threshold)</span></div>
<div class="desc">Must be non-zero and ≤ ownerCount. All admin changes go through the multisig itself, proposed as transactions targeting the vault's own address.</div>

<div class="sig">setDelay<span class="params">(delay)</span></div>
<div class="desc">Timelock period in seconds. Set 0 for unlocked (instant execution, no timelock).</div>

<div class="sig">setExecutor<span class="params">(executor)</span></div>
<div class="desc">Set to TimelockExecutor address for the default plugin. Set 0x0 to disable bypass entirely. The executor can call execute() without signatures and without timelock delay.</div>

<div class="sig">addOwner<span class="params">(owner)</span> / removeOwner<span class="params">(prev, owner)</span></div>
<div class="desc">Linked list ops. addOwner inserts the new owner right after the sentinel (list order isn't kept sorted). removeOwner takes the prevOwner pointer and enforces ownerCount > threshold. Sorting is only required for the init owner array and for signature bundles.</div>

<h2>FACTORY</h2>
<p><code>MultisigFactory.create()</code> deploys minimal proxy clones via CREATE2 with PUSH0 and calls <code>init()</code> on the new proxy. Salt must start with 0x0 or msg.sender for frontrun protection.</p>
<p><code>createWithCalls()</code> deploys with the factory as temporary executor, executes post-init calls (like <code>enableForward(true)</code> on the TimelockExecutor), then sets the real executor. Used when the fast path needs to be enabled at deploy time.</p>
<p>Post-init calls are a list rather than a single call. Enabling the fast path and claiming an on-chain name are independent options, and each adds entries to the same <code>targets/values/datas</code> arrays. The new vault runs them in order before the real executor is installed. Every call runs as the vault, so a name claimed this way is minted to the vault rather than to the deployer.</p>

<h2>EIP-7702 DELEGATION</h2>
<p>The implementation the factory clones can be installed on an existing EOA instead of deployed beside it. An EIP-7702 authorisation points the account's code at the implementation, and a self-call to <code>init(owners, delay, threshold, executor)</code> in the same transaction configures it. This works because <code>init</code> accepts the factory or the account itself. Nothing is deployed and nothing is transferred: the address keeps its history, its holdings and its name.</p>
<p>Delegating is not a commitment. An account that wants batching today can delegate today and deploy a vault later, when there is something worth guarding, or never, if co-signing on the address it already has is the whole requirement.</p>

<div class="sig">WHAT THE ACCOUNT GAINS</div>
<div class="desc"><code>batch()</code> for atomic multicalls, so approve and swap become one transaction and thirty payments need one signature; <code>delegateCall</code>; ERC-1271 <code>isValidSignature</code>, so the account can authorise Permit2, Seaport and intent orders as a smart account; ERC-721/1155 receive callbacks; an optional timelock; and the executor slot with its guard hooks. <code>batch</code> and <code>delegateCall</code> are onlySelf, and the delegating key satisfies onlySelf directly, so a solo delegation uses both without collecting any signatures. Where ECDSA signatures are collected instead, <code>execute()</code> is permissionless, so a third party can relay it and pay the gas.</div>

<div class="sig">CO-SIGNING WITHOUT SHARED CUSTODY</div>
<div class="desc">The owners can be the account itself plus one other key, at 2-of-2. The account's own slot is filled by the sender bypass: <code>v=0</code> with its address in <code>r</code>, satisfied because <code>msg.sender</code> is the account. Only one signature is ever collected, and submitting the transaction fills the second slot. The other key can equally be the submitter, with your ECDSA signature or on-chain approval filling your slot.</div>

<div class="sig">THE AGENTIC 2-OF-2</div>
<div class="desc">The main use of that shape: your EOA delegates, and an agent's key is the second owner. The agent can prepare, sign and submit whatever it likes and can complete nothing alone, because it holds one of two required slots. Add a delay and its proposals queue in the open where you can cancel them. Set a guard as executor and its reach narrows to an allowlist. You must hold the delegating key; if the agent holds it instead, the quorum protects nothing, for the reason below.</div>

<div class="sig">THE KEY IS STILL A SUPERUSER</div>
<div class="desc">The delegating EOA never stops being an EOA. It can send ordinary transactions that touch none of this logic, it satisfies every onlySelf function directly (<code>setThreshold</code>, <code>addOwner</code>, <code>setDelay</code>), and it can revoke the delegation at any time. So the threshold binds the co-signers and not that key, and the delay constrains the quorum route rather than the account. That is what you want when delegating capability to an agent or a co-signer. It is not enough for a treasury where no single key should be able to move funds; deploy a clone for that, which has no superuser.</div>

<div class="sig">CONFIGURE ONCE, NOT TWICE</div>
<div class="desc">Revoking the delegation does not clear the storage it wrote. The owners, threshold and nonce survive, and <code>init()</code> refuses to run a second time, so an account cannot be re-delegated and reconfigured from scratch. An account that has carried some other delegate may have written the same slots, so this implementation should not be pointed at one. Ordinary reconfiguration still works: the setters are reachable and the key can call them directly. Only the reset is unavailable. See <a href="#audits">AUDITS</a>: EIP-7702 configuration is effectively permanent.</div>

<div class="sig">PER CHAIN, AND BOUND TO THE ACCOUNT</div>
<div class="desc">Authorisation and init are per chain: the same EOA elsewhere is a plain EOA until it is delegated and inited there, with its own owner set and nonce. The EIP-712 domain separator uses the account's own address and the live chain id, so signatures collected for a delegated account cannot be aimed at a clone, at another account, or at the same account on another chain.</div>

<h2>SIGNATURES</h2>
<p>EIP-712 typed data with <code>Execute(address target,uint256 value,bytes data,uint32 nonce)</code> typehash. Packed as 65-byte chunks (r, s, v). v=0 indicates on-chain approval, with the address packed in r and verified against the <code>approved</code> mapping or msg.sender. Signers must be sorted ascending; the contract enforces signer > prev. The same signature format works for Multisig.execute() and TimelockExecutor.forward().</p>

<h2>WHAT THEY FOUND</h2>
<p><strong>No reviewer found a way for an unauthorised party to move funds from a correctly configured vault.</strong> The signature scheme, nonce handling, owner list, replay protection and clone bytecode were each verified sound by several of them independently. Nothing found warranted redeploying the contracts, which are immutable singletons already live at mined addresses on every supported chain.</p>
<p>What they did find falls into two groups. <strong>Configuration traps</strong>, one-way doors a vault's owners would have to deliberately sign their way into: this app now refuses to build every one of them. And <strong>composition issues</strong> between the vault and its executor module, which cost timing rather than funds. Those are answered below.</p>
<div class="note">Severities were inconsistent across reports. One filed a critical that rested on a misreading of which address a code branch tests, and two mis-sized the same arithmetic bug by a factor of 65. Each report's response records where we agreed, where we did not, and why. Disputed findings are argued in the reports rather than quietly dropped.</div>
<div class="note">The 2026-04 pass is why several later reviews came back clean, and its record is worth reading for one reversal. It found the route-substitution mechanism first and accepted it, on the grounds that the worst case was a <em>delayed</em> cancel rather than no cancel. That holds for an ordinary transaction and fails for a cancellation, which is the case it missed and the July reviews escalated.</div>

<h2>CONFIGURING A VAULT</h2>
<p>The choices that matter, in the order you make them.</p>

<div class="sig">A TIMELOCK NEEDS AN EXECUTOR TO BE CANCELLABLE</div>
<div class="desc">With a delay and no executor, queueing works and third parties get their full notice period, but nothing can be stopped. Cancelling is a self-call, so it routes through the queue like everything else and matures no earlier than the thing it cancels. Setting the TimelockExecutor as executor supplies the missing half: a cancel that needs threshold signatures and executes immediately. This app always pairs a non-zero delay with it, and refuses to remove it while a delay is set.</div>

<div class="sig">CANCELLING IS THE RELIABLE BRAKE</div>
<div class="desc">It needs only threshold signatures, works whether or not the fast path is enabled, and executes immediately. The fast path is not needed for emergencies. One operational detail: a cancel should be submitted by one of its signers. The app binds a slot of the bundle to that signer so a copy is useless to anyone else (see below), and tells you when it could not.</div>

<div class="sig">THE FAST PATH IS FOR SPEED, NOT EMERGENCIES</div>
<div class="desc">It lets a vault that normally acts slowly on partial consensus act immediately when every owner agrees, which suits routine payments and trading. Signatures accrue toward it: collect the threshold and a proposal is queueable, and if a further owner signs the same proposal before it is submitted, it becomes instantly executable with nobody re-signing.</div>

<div class="sig">EXCEPT WHERE THE THRESHOLD IS THE OWNER COUNT</div>
<div class="desc">On a 2-of-2 or 3-of-3 every quorum is already unanimous, so there is no higher bar to escalate to: the same signatures queue or execute, at the submitter's choice. The delay becomes a default route rather than a guarantee. That is a legitimate configuration, so the app flags it at create and asks for a second press in admin rather than refusing it. Cancelling is unaffected.</div>

<div class="sig">SIGNED MESSAGES ARE NOT SUBJECT TO THE DELAY</div>
<div class="desc">A timelock constrains transactions, not message signing. Anything expressible as a signed order, such as Permit2, Seaport or intent systems, is authorised instantly with threshold signatures on any vault, however long the delay. The delay does not gate every outflow.</div>

<h2>SIGNING VS APPROVING</h2>
<div class="sig">WHY BOTH EXIST</div>
<div class="desc">Signing produces an off-chain signature: free, private, and it keeps the front-run protection described below. Approving registers the authorisation in the vault itself. It costs gas and is publicly readable, but it is the only route open to a DAO or a contract owner, since a contract cannot produce a signature, and the only route that needs no coordination service. A vault whose owners approve on-chain keeps working if this app, its database or its operator disappear. Most signers should still prefer signing.</div>
<div class="sig">KEEPING BOTH PROPERTIES AT ONCE</div>
<div class="desc">An on-chain approval is world-readable, so the slot it fills can be assembled by anyone, which gives up the binding that stops a collected bundle being replayed. You can keep both: have every owner but one approve on-chain, and let the remaining owner submit without approving. Their slot stays sender-only, a copier is left one signature short, and no coordination service is involved.</div>
<div class="sig">APPROVALS EXPIRE WITH THE NONCE</div>
<div class="desc">The approved hash commits to the vault's nonce and both execution routes compute against the live one, so an approval becomes permanently unreachable the moment the nonce advances past it. Stale approvals for consumed nonces are inert. Only ones made for a nonce the vault has not yet reached are worth revoking.</div>

<h2>WHEN TIMING IS CRITICAL</h2>
<div class="sig">WHY A PROPOSAL CAN BE FORCED INTO THE QUEUE</div>
<div class="desc">Both execution routes accept the same signatures, so someone who sees your bundle before it lands can submit it down the queueing route instead. Your proposal is queued rather than executed now, and the nonce is consumed. It is not blocked and not lost: it executes when the delay elapses, and the trick cannot be repeated once the entry is queued. To recover, accelerate it. To avoid it, submit through a private RPC, since the attack needs your bundle to be public first. On Base, Arbitrum and OP there is no public mempool to read.</div>
<div class="sig">THE TWO ROUTES THAT CANNOT BE FORCED</div>
<div class="desc">Cancelling is protected: the bundle is exactly threshold slots, so binding one to the submitter leaves a copier one short. For guaranteed emergency <em>action</em>, use a separate multisig as the executor rather than the fast path.</div>
<div class="sig">THE COUNCIL PATTERN</div>
<div class="desc">Replay is possible because the TimelockExecutor authorises against the vault's own signing digest, so one set of signatures opens both routes. The executor bypass needs no signatures at all: the vault skips its checks for whatever address is set as executor. An executor that authorises against its <em>own</em> digest therefore leaves nothing that can be replayed against the vault. A second vault does exactly that. Deploy one with the same owners, a unanimous threshold and no timelock, and set it as your main vault's executor. Ordinary proposals still queue for the full delay, unanimity acts immediately, and those signatures can never be aimed at the main vault because they carry a different verifying contract.</div>
<div class="desc">The tradeoff is that the council's threshold governs both bypass and cancellation, one dial rather than two. At a unanimous threshold, cancelling costs every owner rather than a quorum. The default TimelockExecutor charges only a quorum to cancel and is the better choice for most vaults. The council is for when you want the replay surface gone entirely.</div>

<h2>WHAT THIS APP GUARDS</h2>
<p>Every finding the reviews raised that a client can answer is answered here, at the point the transaction is built, so a proposal raised by other tooling is flagged the same way.</p>

<div class="sig">REPLAYED SIGNATURE BUNDLES <span class="params">— GPT-5.6 H-01, leftclaw M-2, Pashov executor F-1</span></div>
<div class="desc">Every executor bundle spends one slot on a sender slot bound to whoever submits, so a copied bundle is inert on either route. Complete for cancellation. Partial for unanimous fast-path bundles on a k-of-n vault, where a threshold subset of the remaining signatures can still be extracted to queue the action, which delays it rather than defeating it.</div>

<div class="sig">EXECUTORS THAT BRICK THE VAULT <span class="params">— Shred L-1, Opus M-1, leftclaw H-1</span></div>
<div class="desc">A vault set as its own executor recurses through its guard hook until it runs out of gas, and the route back is only reachable through the call that is already failing. The same is true of any 0x1111-marked address holding no code, because the hook checks for code first. The app refuses a self-referential executor outright, and reads the chain before proposing a marked one.</div>

<div class="sig">UNRECOVERABLE TIMELOCK STATES <span class="params">— Opus M-2, M-3</span></div>
<div class="desc">The delay accepts any value up to ~136 years, and the proposal that would undo a bad one waits it out first. Removing the executor while a delay is set strands every queued proposal. Delays over 30 days need a second press and are refused outright on a vault with no executor, and clearing the executor is refused while a delay is live.</div>

<div class="sig">THRESHOLD OVERFLOW <span class="params">— leftclaw H-2</span></div>
<div class="desc">The vault computes its required signature length in 16-bit arithmetic, so at a threshold of 1009 it wraps and no signature set can satisfy both the length check and the verification loop. Owner-signed execution dies permanently while the executor path keeps working. It is reachable only by deliberately configuring 1009 or more owners, and the app caps owners and thresholds at 1008.</div>

<div class="sig">UNRECOVERABLE DESTINATIONS <span class="params">— Shred L-2, GPT-5.6 L-04</span></div>
<div class="desc">None of the three singletons has a withdrawal path, and the implementation is never initialised so it has no owners who could authorise one. Transfers, custom calls and batch legs that send value to the factory, the implementation, the TimelockExecutor, address(0) or the owner-list sentinel are refused outright.</div>

<div class="sig">FAILURES THAT LOOK LIKE SUCCESSES <span class="params">— Shred I-1, Opus L-2</span></div>
<div class="desc">The vault reverts with one error for both "nothing is queued" and "the timelock has not elapsed", and the app decodes the eta to report them separately. Its fallback also returns success for selectors it has no function for, so a mistyped governance self-call would burn a nonce, emit a success event and change nothing. Proposals carrying one are flagged before you sign.</div>

<h2>ACCEPTED, NOT FIXED</h2>
<p>Documented design rather than oversights, recorded here so they are not surprises.</p>
<div class="sig">THE EXECUTOR IS A FULL KEY</div>
<div class="desc">It bypasses both signatures and the delay by design. A guard is installed <em>as</em> the executor, so installing one grants full custody, unlike Safe, where a Guard can only block. Treat any executor address as a co-owner and hold it to the same standard as the vault.</div>
<div class="sig">STALE APPROVALS SURVIVE REMOVAL</div>
<div class="desc">On-chain approvals are keyed by address and never cleared, so removing an owner neutralises their approvals but re-adding the same address restores them. An address removed because it was compromised must never be re-added, even after rotating the key.</div>
<div class="sig">QUEUED PROPOSALS OUTLIVE CONFIGURATION CHANGES</div>
<div class="desc">Execution re-checks nothing but the hash and the elapsed time, not the owner set, the threshold or the executor, and queued entries never expire. Review and clear the queue before rotating owners, changing the threshold or the executor, or making a large deposit.</div>
<div class="sig">EIP-7702 CONFIGURATION IS EFFECTIVELY PERMANENT</div>
<div class="desc">Storage survives revoking the delegation and initialisation cannot be re-run, so a 7702 delegation to this implementation cannot be cleanly reconfigured afterwards. The EOA key also remains a superuser throughout.</div>
<div class="sig">ZERO-PREFIX SALTS ARE NOT FRONT-RUN PROTECTED</div>
<div class="desc">The factory accepts a salt starting with either the zero address or the caller's. Only the caller-bound form protects a counterfactual address from being claimed first. This app mines sender-bound salts exclusively; no code path here produces the open form.</div>

<h2>VERIFYING A DEPLOYMENT</h2>
<p>The reviews asked for the audited build to be confirmed on-chain rather than assumed. It is now checked on every deploy and every load.</p>
<div class="sig">BEFORE DEPLOYING</div>
<div class="desc">The factory on every target chain is asked for its implementation address and must name the audited one. Code being present at the factory address proves nothing on its own.</div>
<div class="sig">AFTER DEPLOYING</div>
<div class="desc">A mined receipt is not a deployment: on a chain without the factory, the call is a plain transfer that mines successfully. The vault's runtime bytecode is read back and compared against the audited clone, and its owners, threshold, delay and executor are matched against what was requested. A chain that will not answer reads DEPLOYED &middot; UNVERIFIED rather than counting as verified.</div>
<div class="sig">ON EVERY LOAD</div>
<div class="desc">The same bytecode check runs each time a vault is loaded, and anything that is not the audited build is badged UNVERIFIED CODE. A vault can arrive from a pasted address, and answering threshold() and getOwners() only proves that something implements the interface.</div>
`,

EXECUTOR:`
<h2>TIMELOCKEXECUTOR.SOL</h2>
<p>A singleton executor module: one deployment serves all multisigs. Set it as the multisig's executor via <code>setExecutor()</code>. It provides parallel execution paths using the multisig's own EIP-712 signatures.</p>

<div class="note">The same signatures collected for a normal execute() work with the executor's forward(). The app routes on signature count and target.</div>

<h2>PATHS</h2>
<div class="sig">CANCEL <span class="params">— threshold sigs, always available</span></div>
<div class="desc">Cancel a queued transaction. The app creates a new cancel proposal, consuming a nonce, that targets the multisig with cancelQueued(hash) calldata. Once threshold owners sign, forward() calls execute() as the executor, bypassing signatures and timelock, which self-calls cancelQueued(). No opt-in needed.</div>

<div class="sig">INSTANT EXECUTE <span class="params">— all-owner sigs, opt-in required</span></div>
<div class="desc">Skip the timelock with signatures from every owner. Requires the multisig to have called <code>enableForward(true)</code>. forward() verifies all ownerCount signatures, then calls execute() as the executor for immediate execution.</div>

<div class="sig">ACCELERATE <span class="params">— all-owner sigs, opt-in required</span></div>
<div class="desc">Execute a queued transaction before its ETA passes. Forward a self-call to executeQueued(): the multisig skips the ETA check when msg.sender == address(this). Same unanimous and opt-in requirement. This consumes a new nonce for the acceleration call itself.</div>

<h2>CORE FUNCTION</h2>
<div class="sig">forward<span class="params">(multisig, target, value, data, sigs)</span></div>
<div class="desc">Verify signatures against the multisig's owners and current nonce, then call multisig.execute(target, value, data, "") with empty sigs. The multisig trusts its executor and skips verification. Signature count determines the path: ownerCount for instant/accelerate, threshold for cancel.</div>

<h2>OPT-IN</h2>
<div class="sig">enableForward<span class="params">(bool enabled)</span></div>
<div class="desc">Toggle the instant and accelerate paths. Must be called by the multisig itself, typically via a multisig transaction or via createWithCalls() at deploy time. The cancel path is always available regardless. The app shows this toggle in the admin panel under EXECUTOR · INSTANT PATH.</div>

<h2>DESIGN</h2>
<p>The executor verifies signatures itself before calling <code>execute()</code> with empty sigs, since the multisig trusts its executor and skips verification. So the executor enforces its own rules, unanimous for the fast path and threshold for cancel, while the multisig sees only a trusted caller.</p>
<p>It uses the same EIP-712 Execute typehash as the multisig, so there are no new signature types and wallet signing looks identical on both paths. The app chooses which contract to submit to from how many signatures are collected and whether the target is a cancelQueued call.</p>

INTERFACE:`
<h2>DASHBOARD</h2>
<p>Vault selector tabs across the top carry inline status dots: green and pulsing for executable transactions, yellow for transactions needing your signature. The primary holding is displayed large, with secondary tokens inline below, and vaults with no balances show an empty state. The metadata line gives the threshold ratio, the timelock duration (or UNLOCKED in yellow for delay=0), the chain, and a FAST PATH indicator when it is enabled.</p>
<p>An action counter above the tabs totals pending items across all vaults: signatures needed, ready to execute, ready to submit.</p>
<p>With no vaults loaded, the empty state offers CREATE VAULT, or loads any existing vault by address or by <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> / <code>.base.eth</code> / <code>.mega</code> name. Owner addresses reverse-resolve the same way: WNS (<code>.wei</code>) first, GNS (<code>.gwei</code>) as fallback, then ENS, then the chain-local namespaces &mdash; Basenames (<code>.base.eth</code>) and MegaNames (<code>.mega</code>) &mdash; except on Base or MegaETH, where that chain's own namespace is tried first and wins.</p>

<p><strong>CHAIN-LOCAL NAMES</strong> &mdash; two of the five namespaces do not live on Ethereum: Basenames (<code>&lt;label&gt;.base.eth</code>) live on Base, MegaNames (<code>&lt;label&gt;.mega</code>) on MegaETH. Both are read on the same terms as the mainnet three, from every chain. Anywhere an address is typed &mdash; an owner in the create form, a send recipient, a custom-call or batch target, a vault to load, a Safe to clone &mdash; either is accepted and the address it resolves to is shown before anything is signed. A name is a way of spelling an address, and an address is the same address on every chain, so the suffix decides which network the lookup goes to and nothing downstream of the answer cares. An Ethereum deploy can take <code>nick.eth</code>, <code>ross.wei</code>, <code>donnoh.gwei</code>, <code>jesse.base.eth</code> and <code>bread.mega</code> as five owners of the same vault, and the multichain clones carry that signer set to every chain selected.</p>

<p>A basename is a <code>.eth</code> name, so nothing about the fields had to change to accept one &mdash; what changed is where it is resolved. <code>base.eth</code> on Ethereum answers through an ENSIP-10 offchain gateway, so resolving <code>alice.base.eth</code> there costs a mainnet lookup plus an HTTP round trip to a CCIP endpoint that can be down, blocked or slow. The records themselves live on Base as a plain ENS-shaped resolver, so this app reads them there: one call, no gateway. The reverse direction is not available from Ethereum at all &mdash; mainnet's reverse registry answers with an account's <em>mainnet</em> primary name, which for a Base-native account is nothing &mdash; so it is read off Base too, through the ENSIP-11 reverse node. Both directions batch through Multicall3, which means an entire signer list reverse-resolves in one call plus one to verify it, whatever its length.</p>

<p>What stays local to a chain is precedence and links. Reverse resolution puts a chain's own namespace <em>first</em> on that chain, so a signer with both a mainnet name and a Basename reads as their Base identity on Base and as their mainnet one everywhere else; away from home the local namespaces are tried last, only for addresses ENS, WNS and GNS all had nothing for, which is what keeps them cheap. And a shareable vault link can only be spelled with a name whose namespace the arriving browser will read on the chain the link implies &mdash; <code>#name.id.wei</code> means Ethereum, <code>#name.base.eth</code> means Base, <code>#name.mega</code> means MegaETH &mdash; so a vault gets a named link only on the chain its own name belongs to. A plain ENS name never gets one, because it may only answer through a gateway. Everywhere else the link spells the address out.</p>

<p>MegaNames is read over its resolver at <code>api.dotmega.domains</code> rather than by contract call, because it answers in one edge-cached round trip where the contract path would be two against a chain the app may not be pointed at. It publishes a 60-requests-per-minute ceiling and reports what is left of it in every response, so the budget is read rather than guessed: answers are cached in both directions including misses, concurrent lookups of the same name make one request, and the budget is tiered &mdash; a name typed into a field will wait for a window to roll over, decorating a signer list never will, so a hundred-owner vault cannot starve the field being typed into. Reverse records are forward-verified before they are shown, in every namespace here: a primary name that no longer resolves back to the address claiming it is displayed as nothing at all.</p>

<p>The namespace is scoped to the chain it belongs to, in both directions. A <code>.mega</code> name is a MegaETH identity, so it is not offered as a recipient on Arbitrum and not shown beside a signer on Base &mdash; the same way a <code>.wei</code> name is only linkable on Ethereum. Names are read over MegaNames' resolver at <code>api.dotmega.domains</code> rather than by contract call, because it answers in one edge-cached round trip where the contract path would be two against a chain the app may not be pointed at. Reverse records are forward-verified before they are shown, exactly as the mainnet ones are: a primary name that no longer resolves back to the address claiming it is displayed as nothing at all.</p>
<p><strong>A DELEGATED EOA LOADS LIKE ANY VAULT</strong> — an EOA delegated to the implementation under EIP-7702 answers the same ABI, so it loads by address and drives from the same screens: proposals, signing, the timelock, admin. It is badged <strong>EIP-7702</strong> rather than counted as a clone, for two reasons. The code read back is <code>0xef0100</code> followed by the implementation address rather than the 45-byte clone, and the key behind it can revoke the delegation at any time. The badge is there so a co-signer reads that before signing rather than after. The delegation itself is a SET_CODE_TX signed by the account: make it from a wallet that supports EIP-7702 authorisations, then load the address here. This app operates a delegated account; it does not create the delegation.</p>

<h2>SIGNING</h2>
<p>Two paths: <strong>SIGN</strong> (off-chain EIP-712, free, filled button) or <strong>APPROVE</strong> (on-chain approve() call, costs gas, outline button). Both count toward the threshold. <strong>UNSIGN</strong> (outline) withdraws your approval by calling approve(hash, false). Filled buttons are the primary action, outlined ones are secondary or already completed.</p>

<h2>TRANSACTION LIFECYCLE</h2>
<pre>STANDARD PATH (delay > 0)
  NEEDS SIGS → SUBMIT → ETA countdown → READY → EXECUTE

CANCEL PATH (threshold sigs, via executor)
  QUEUED TX → CANCEL creates new proposal → collect sigs → EXECUTE CANCEL

FAST PATH (all-owner sigs, opt-in, via executor)
  NEEDS SIGS → INSTANT EXECUTE (or QUEUE WITH TIMELOCK)

UNLOCKED (delay = 0)
  NEEDS SIGS → EXECUTE (immediate, no timelock)</pre>

<p>The standard path goes through the timelock. Cancel creates a new proposal at the next nonce targeting cancelQueued: it needs threshold signatures and executes immediately via the executor, with no timelock on cancels. Cancel proposals are never blocked by the sequential queue, because they route through the executor's parallel path, and they are marked VIA EXECUTOR.</p>
<p>The fast path appears when all owners have signed and enableForward is active, offering INSTANT EXECUTE and QUEUE WITH TIMELOCK as alternatives. Unlocked vaults (delay=0) skip the queue entirely.</p>

<h2>TX BUILDER</h2>
<p>Four modes.</p>
<p><strong>TRANSFER</strong> — the token selector shows chain-specific tokens with their decimals: ETH (18), USDC/USDT (6), WBTC/cbBTC (8), DAI/wstETH (18). The amount field shows a live conversion to raw token units below it. For ERC-20s, a note gives the on-chain encoding: transfer(recipient, amount) on the token contract.</p>
<p><strong>NAME</strong> — Ethereum mainnet only. Claims a free <code>&lt;label&gt;.id.wei</code> subdomain for the vault and points reverse resolution at it. It takes two calls. <code>register(namehash('id.wei'), label)</code> on the id.wei registrar mints the name to the caller, which makes the name resolve <em>to</em> the vault. <code>setPrimaryName(id)</code> on WNS makes the vault answer <em>with</em> the name, the direction wallets and explorers read. Both are made by the vault, so the name is an NFT the vault itself holds, only a proposal reaching quorum can move it, and holding it grants nobody any power over the vault. Where both calls are needed they are wrapped in the vault's own <code>batch()</code>, so the mint and the reverse record either both land or neither does. A vault that minted a name and then failed to point at it would need a second proposal to finish a job that reads as done.</p>
<p>Availability is checked by static-calling the exact <code>register()</code> that will run, asked <em>as the vault</em>. The registrar uses <code>_safeMint</code>, so that probe also answers whether this vault's code can receive the name at all. A name the vault already holds drops the proposal to <code>setPrimaryName</code> alone, since a second <code>register()</code> would revert and consume the nonce doing it. The app only claims labels of Latin letters, digits, hyphen and underscore, which is narrower than the registrar allows: the registrar accepts zero-width and non-breaking spaces and mixed scripts, and a name meant to be read before signing must not be able to look like another name.</p>
<p><strong>CUSTOM</strong> — a raw target address, an ETH value with a live wei conversion, and a calldata field, for arbitrary contract interactions.</p>
<p><strong>BATCH</strong> — multiple calls, each with target, value (ETH with a wei preview) and calldata, added and removed as you go. Encodes as a single multisig transaction via batch(), which is onlySelf, so the multisig calls itself.</p>

<h2>SIMULATION</h2>
<p>Every live proposal, and every transaction the builder is about to propose, has a <strong>SIMULATE</strong> button. It replays the call against the latest block with <code>from</code> set to the vault, which is what execution does: <code>target.call{value}(data)</code> with <code>msg.sender</code> the vault. The dry run is therefore the real call rather than an approximation. Nothing is signed and nothing is sent.</p>
<p><strong>WHAT IT REPORTS</strong> — pass or revert, the decoded revert reason including the vault's own custom errors, gas for the inner call, and a ledger of everything that moves in or out of the vault: ETH, ERC-20 amounts, and individual ERC-721 and ERC-1155 token ids listed by id. A BATCH proposal simulates as the single <code>batch()</code> self-call it will be, so state carries between its calls the way it will on-chain.</p>
<p><strong>GUARDS ARE REPLAYED TOO</strong> — a vault whose executor address carries the <code>0x1111</code> marker calls that executor before and/or after every execution, and a pre-guard that refuses stops the transaction dead. Those hook calls run inside the same simulated frame, in the order the wallet makes them, so a proposal an AllowlistGuard will reject reads <strong>BLOCKED BY GUARD</strong> rather than passing. A passing simulation on such a vault is tagged GUARD OK, so the check is visible when it succeeds and not only when it fails. The signature bundle a real execution forwards to the hook does not exist at dry-run time, so empty bytes are passed; a custom guard that inspects signatures is the one case this can misjudge.</p>
<p><strong>WHAT IT CANNOT TELL YOU</strong> — the result is one block's snapshot, stamped with the time it was produced. A proposal that passes now can revert when it is executed days later, which is the ordinary case for a timelocked queue, so re-run it before executing rather than trusting a panel left on screen. The gas figure covers the vault's own call only, not the signature checks and nonce write that <code>execute()</code> wraps around it. A vault that is not funded yet reports a revert that is true today and may not be true at the ETA. On an RPC without <code>eth_simulateV1</code> the panel falls back to a bare revert check with no asset trace, and labels itself <strong>REVERT-CHECK ONLY</strong> rather than claiming nothing moved.</p>
<div class="note">A simulation that reverts blocks nothing. The proposal can still be created, signed and submitted. The panel is there to be read before signing, not to decide on your behalf.</div>

<h2>ADMIN</h2>
<p>Three sub-tabs: POLICY, OWNERS and HISTORY, with a vault selector at the top. Every change is proposed rather than applied, since all of them are onlySelf and need multisig approval.</p>
<p><strong>POLICY</strong> — threshold selector with a live CHANGED indicator, delay input in hours with a diff preview, and the executor address, shown as TIMELOCK EXECUTOR (DEFAULT) when the standard plugin is in use. When delay > 0 and an executor is set, an EXECUTOR · INSTANT PATH section carries the enableForward toggle and its signature requirements (N/N for instant, threshold/N for cancel).</p>
<p><strong>OWNERS</strong> — the owner list with REMOVE buttons, which are not shown for yourself, and a form to add one. removeOwner requires ownerCount > threshold.</p>
<p><strong>HISTORY</strong> — the executed transaction log, with nonce, action type, details and time.</p>

<h2>CREATE</h2>
<p>Deploy a new vault via MultisigFactory. Add owner addresses in any order; the app sorts them ascending before submission, as the contract requires, carrying each label with its address so labels cannot end up filed against the wrong signer. One owner is the minimum. The threshold selector clamps to the owner count. The delay is in hours, and setting it to 0 shows an UNLOCKED warning and hides the fast path toggle.</p>
<p><strong>OWNER NAMES RESOLVE IN THE FORM</strong> — an owner may be given as a <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> / <code>.base.eth</code> / <code>.mega</code> name instead of an address, and the row then shows the address it resolves to, truncated and linked to the explorer of the chain being deployed to. The owner set is the one part of a vault that cannot be corrected afterwards without a full multisig round of the vault itself, so it is never signed for while any of it is still an unresolved string. DEPLOY stays disabled while a lookup is in flight, and refuses a name that does not resolve, resolves to <code>0x0</code> or <code>0x1</code> (the owner list's sentinels), or lands on an address another row already holds. That last check is why resolution happens here rather than at submission: two names, or a name and the address it points at, are the same owner, and <code>init()</code> reverts on a repeat after the salt has been mined and the gas paid. What the form resolved is what gets deployed, so if a name repoints between being reviewed and being signed for, the deploy stops rather than installing a signer nobody saw.</p>
<p><strong>ONE VAULT, MANY CHAINS</strong> — CLONE TO OTHER CHAINS deploys the same vault to the same address on every chain picked. The address is a CREATE2 address mined from the factory, the deployer and a salt, all of which are chain-independent, so the candidate is checked for existing code on <em>every</em> selected chain before it is accepted. An address that is free here but taken on a clone target would otherwise hand back a stranger's vault as though the clone had succeeded. Mixing mainnets and testnets in one go is allowed and flagged.</p>
<p><strong>REVIEW BEFORE ANY SIGNATURE</strong> — DEPLOY runs a read-only preflight rather than a transaction. Per chain: is the factory there, does the factory name the audited implementation, does the connected wallet hold gas, and, with instant execution on, is the TimelockExecutor there. A chain that will not answer is reported as unchecked rather than ready. The mined vault address is shown alongside, so the address funds will be sent to can be read before anything is signed. Every deploy stops on this screen, clean preflights included, listing each owner at its resolved address, the signature threshold, the timelock, whether instant execution is on and what that grants, and which factory call will be made. Deploys then run one chain at a time, each needing a network switch and a signature. CANCEL returns to the form with it intact, and nothing is signed until PROCEED.</p>
<p><strong>DEPLOYS ARE READ BACK, NOT ASSUMED</strong> — a mined receipt is not a deployment. A <code>create()</code> sent to a chain without the factory is a plain transfer to a codeless address: it succeeds, emits no <code>Created</code> event, and deploys nothing. So each chain is re-read after its transaction, for code present, code matching the audited build, and a live vault reporting the owners, threshold, delay and executor that were ordered. A chain that deploys but cannot be read back is labelled UNVERIFIED rather than borrowing the word the checked ones earned, and a chain that fails can be retried on its own without redoing the ones that landed.</p>
<p><strong>A FREE ON-CHAIN NAME, IF THE VAULT IS NAMED</strong> — typing a vault name folds it into a candidate <code>.id.wei</code> label and offers to claim it, free, in the same transaction that deploys the vault. It stays a checkbox: it costs nothing, grants nobody anything, and can be done later from the NAME tab instead. Availability is read live from the registrar, again in the deploy preflight, and once more immediately before the wallet prompt, because a register that reverts takes the whole <code>createWithCalls()</code> down with it, and the vault, the mined salt and the gas are not worth losing for an option. If the name is gone by then, or mainnet will not confirm it is free, the name is dropped and the vault deploys without it, reported on the chain it was asked for rather than left silent. After the transaction lands, the claim is read back off WNS instead of inferred from the receipt. WNS is a mainnet contract, so ticking the box adds Ethereum to the deploy if it was not already selected. That is stated on the line before the tick, and shown by Ethereum appearing ticked in the network panel, where unticking it cancels the claim. Clones on other chains share the vault's address, not its name.</p>
<p><strong>CLONE A SAFE</strong> — the Safe mark beside OWNERS opens a one-field migration tool. Give it a Gnosis Safe by address or by <code>.eth</code> / <code>.wei</code> / <code>.gwei</code> / <code>.base.eth</code> / <code>.mega</code> name and it copies that Safe's owners and threshold into the form, labelling each signer with whatever name it reverse-resolves to. It is read-only: it calls <code>getOwners()</code> and <code>getThreshold()</code>, touches nothing on the Safe and moves no funds. The new vault is a fresh deployment, so assets are transferred afterwards. Timelock, instant execution and chain selections stay whatever you set. The Safe is read on the network the form is deploying to, and if it is not there, the tool reports which supported chains it did find it on; loading one of those switches the deploy to that chain. A banner records the source Safe and undoes the clone in one click.</p>
<p>When delay > 0, an INSTANT EXECUTION toggle enables the fast path at deploy time. Deployment then uses <code>createWithCalls()</code> to call enableForward(true) on the TimelockExecutor as a post-init step, with the factory as temporary executor. The network selector lists the supported chains with their chain IDs and token lists.</p>
