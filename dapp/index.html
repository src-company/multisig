// ── ABI FETCH (Sourcify) ─────────────────────────────────────────
// Cache: false=EOA, []=unverified contract, [...]=verified fns, undefined=not fetched
const _abiCache = {};
const _ABI_CACHE_MAX = 200;
let _cxDebounce = null;
const SOURCIFY_REPO = 'https://repo.sourcify.dev/contracts';
// Proxy implementation storage slots
const IMPL_SLOTS = [
  '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc', // EIP-1967
  '0x7050c9e0f4ca769c69bd3a8ef740bc37934f8e2c036e5a723fd8ee048ed3f8c3', // OZ legacy
];

async function sourcifyAbi(chainId, addr) {
  for(const match of ['full_match', 'partial_match']) {
    try {
      const res = await fetch(`${SOURCIFY_REPO}/${match}/${chainId}/${addr}/metadata.json`);
      if(res.ok) {
        const json = await res.json();
        return (json.output && json.output.abi) || [];
      }
    } catch(_) {}
  }
  return null;
}

function extractWriteFns(abi) {
  return abi
    .filter(item => item.type === 'function' && item.stateMutability !== 'view' && item.stateMutability !== 'pure')
    .sort((a, b) => a.name.localeCompare(b.name));
}

async function fetchContractAbi(addr) {
  const key = S.chainId + ':' + addr.toLowerCase();
  if(_abiCache[key] !== undefined) return _abiCache[key];
  if(Object.keys(_abiCache).length >= _ABI_CACHE_MAX) {
    const first = Object.keys(_abiCache)[0]; delete _abiCache[first];
  }
  try {
    const code = await provider.getCode(addr);
    if(!code || code === '0x') { _abiCache[key] = false; return false; }

    // Check proxy implementation slots in parallel
    const slotReads = IMPL_SLOTS.map(s => provider.getStorage(addr, s).catch(() => null));
    const [directAbi, ...slotResults] = await Promise.all([sourcifyAbi(S.chainId, addr), ...slotReads]);

    // Find implementation address from first non-zero slot
    let implAddr = null;
    for(const raw of slotResults) {
      if(raw && raw !== '0x' + '0'.repeat(64)) {
        const a = '0x' + raw.slice(-40);
        if(a !== ethers.ZeroAddress) { implAddr = ethers.getAddress(a); break; }
      }
    }

    // If proxy detected, fetch implementation ABI
    if(implAddr) {
      const implAbi = await sourcifyAbi(S.chainId, implAddr);
      if(implAbi && implAbi.length) {
        const fns = extractWriteFns(implAbi);
        _abiCache[key] = fns;
        return fns;
      }
    }

    // Fall back to direct ABI
    if(directAbi && directAbi.length) {
      const fns = extractWriteFns(directAbi);
      _abiCache[key] = fns;
      return fns;
    }

    _abiCache[key] = [];
    return [];
  } catch(e) {
    console.error('Fetch ABI:', e);
    return []; // Network error — don't cache, allow retry
  }
}

function onCxTargetChange(val) {
  S.cxTarget = val;
  clearTimeout(_cxDebounce);
  updateCxTargetStatus(val);
  if(!val || !ethers.isAddress(val)) {
    if(S.cxAbi !== null || S.cxLoading) { S.cxAbi = null; S.cxFn = null; S.cxArgs = {}; S.cxAddr = ''; S.cxLoading = false; }
    return;
  }
  const addr = ethers.getAddress(val);
  if(addr === S.cxAddr) return;
  S.cxLoading = true; S.cxAbi = null; S.cxFn = null; S.cxArgs = {}; S.cxAddr = addr; render();
  _cxDebounce = setTimeout(async () => {
    const fns = await fetchContractAbi(addr);
    if(S.cxAddr !== addr) return;
    S.cxAbi = fns; S.cxLoading = false;
    render();
  }, 500);
}

function selectCxFn(idx) {
  S.cxFn = S.cxFn === idx ? null : idx;
  S.cxArgs = {};
  render();
}

function encodeCxCall() {
  if(!S.cxAbi || S.cxFn == null) return null;
  const fn = S.cxAbi[S.cxFn];
  if(!fn) return null;
  try {
    const iface = new ethers.Interface([fn]);
    const args = fn.inputs.map((inp, i) => parseCxArg(S.cxArgs[i] || '', inp.type));
    return iface.encodeFunctionData(fn.name, args);
  } catch(e) { return null; }
}

function parseCxArg(raw, type) {
  if(type.endsWith('[]')) {
    if(!raw) return [];
    try { return JSON.parse(raw); } catch(_) { return raw.split(',').map(s => s.trim()); }
  }
  if(type === 'tuple') { try { return JSON.parse(raw); } catch(_) { return raw; } }
  if(type === 'bool') return raw === 'true' || raw === '1';
  return raw;
}

function resetCxState() {
  S.cxTarget = '';
  S.cxValue = '';
  S.cxAbi = null;
  S.cxFn = null;
  S.cxArgs = {};
  S.cxAddr = '';
  S.cxLoading = false;
  clearTimeout(_cxDebounce);
}

// Every signing and sending path starts here, so the chain check lives here.
// A vault is a CREATE2 clone at the same address on every chain, and the app's
// selected chain is what builds the EIP-712 domain and what every read comes
// from — but the transaction goes wherever the WALLET is. Left unchecked, a
// wallet sitting on another chain sends execute() to whatever occupies that
// address there: a different vault, with different owners, or nothing at all.
// The domain's chainId makes the signature useless there, so this is a wasted
// fee rather than a loss — but approve() would register real authorisation on

             8px and read as a fifth link. */''}
        <span style="color:var(--ln)">&middot;</span><span>${_todayStr}</span>
      </div>
    </div>
    <div class="hbar" aria-hidden="true">${ASC200}</div>
    <a class="colophon" href="${SRC_URL}" target="_blank" rel="noopener" title="SRC_CO &middot; source.wei.domains">PUBLIC GOOD BY SRC_CO${SRC_MARK}</a>
  </div>
  ${S.showChains?renderChainOverlay(mob):""}
  ${S.safeClone?renderSafeCloneModal():""}
  ${S.deploy?renderDeployOverlay():""}
  ${S.topup?renderTopUp():""}`;
  restoreFocus(_focusState);
  syncOverlayFocus();
  // Paint the send-flow review card + submit readiness from state on every
  // rebuild, so it survives token switches, polls and delivery-mode changes.
  updateTxReview();
  // Scroll a freshly deep-linked tx into view once, when it first appears.
  if(_focusScroll){
    const fel = document.querySelector(`[data-tx-nonce="${_focusNonce}"]`);
    if(fel){ _focusScroll = false; fel.scrollIntoView({behavior:'smooth',block:'center'}); fel.classList.remove('tx-linked'); void fel.offsetWidth; fel.classList.add('tx-linked'); }
  }
}

// A gas shortfall in native units, short enough for a status slot. Deploy costs
// land anywhere between a few hundred wei of an L2's ETH and a meaningful
// fraction of one on mainnet, so the precision follows the size rather than
// being fixed — 0.0000 ETH is not a number anyone can act on.
function fmtGasShort(wei){
  if(!wei || wei <= 0n) return '0 ETH';
  const n = Number(ethers.formatEther(wei));
  if(!isFinite(n) || n <= 0) return '0 ETH';
  // Significant figures, not decimal places. A fixed precision either drowns an
  // L2 shortfall in zeros or rounds it away entirely — 0.00000123 ETH reported
  // as 0.000001 is no longer the number to top up by.
  let s = n >= 1 ? n.toFixed(4) : n.toPrecision(4);
  if(s.indexOf('e') >= 0) s = n.toFixed(18);          // smaller than toPrecision will spell out
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s + ' ETH';
}

function renderDeployOverlay(){
  const d = S.deploy, phase = d.phase;
  // 'checking' is the reconciliation after something threw with a transaction
  // already broadcast: the wallet is not being asked for anything and the deploy
  // may well have worked, so the row waits on the chain rather than going red on
  // the strength of an error that arrived after the transaction did.
  const glyph = { pending:'○', switching:'◐', mining:'◐', deploying:'◐', checking:'◐', done:'●', skipped:'●', failed:'✕' };
  const col = { pending:'var(--d)', switching:'var(--y)', mining:'var(--y)', deploying:'var(--y)', checking:'var(--y)', done:'var(--g)', skipped:'var(--m)', failed:'var(--r)' };
  const lbl = { pending:'WAITING', switching:'SWITCH IN WALLET…', mining:'MINING ADDRESS…', deploying:'CONFIRM IN WALLET…', checking:'CONFIRMING ON CHAIN…', done:'DEPLOYED', skipped:'ALREADY DEPLOYED', failed:'FAILED' };
  const anyFail = d.steps.some(s=>s.status==='failed');
  const nch = d.steps.length, plural = nch>1?'S':'';
  // A halted run is its own outcome, not a variety of DONE: some chains have a
  // vault and some were never asked, and the difference is what RESUME acts on.
  const remaining = d.steps.filter(s=>s.status!=='done' && s.status!=='skipped').length;
  const title = phase==='preflight' ? `CHECKING ${nch} CHAIN${plural}…`
    : phase==='review' ? `REVIEW · ${nch} CHAIN${plural}`
    : `${d.done?(d.halted?`DEPLOY · STOPPED · ${remaining} OF ${nch} LEFT`:anyFail?'DEPLOY · DONE (WITH ERRORS)':'DEPLOY · DONE'):'DEPLOYING'}${d.halted?'':` · ${nch} CHAIN${plural}`}`;

  const rows = d.steps.map((s,k)=>{
    let g = glyph[s.status], gc = col[s.status], right;
    if(phase==='preflight'){ g='◐'; gc='var(--y)'; right=`<span style="font-size:9px;color:var(--d)">CHECKING…</span>`; }
    else if(phase==='review'){
      const bad = s.pf && (s.pf.gasOk===false || s.pf.executorOk===false || s.pf.factoryOk===false || s.pf.implOk===false);
      // null means the chain would not answer, which is not the same as ready.
      // Now that every deploy stops here, a green READY has to have been earned
      // by a reply — otherwise a dead RPC reads as a cleared preflight. The
      // executor only counts when this vault will carry one; unasked is not
      // unanswered.
      const unread = s.pf && (s.pf.factoryOk===null || s.pf.gasOk===null || (s.pf.needExec && s.pf.executorOk===null));
      const w=[];
      if(s.pf&&s.pf.factoryOk===false)w.push('NO FACTORY');
      if(s.pf&&s.pf.implOk===false)w.push('UNKNOWN FACTORY');
      // Naming the shortfall turns "NO GAS" from a verdict into an instruction:
      // the operator can top the wallet up by that much and press RESUME.
      if(s.pf&&s.pf.gasOk===false)w.push(s.pf.gasShort!=null?`NEEDS ~${esc(fmtGasShort(s.pf.gasShort))} MORE`:'NO GAS');
      if(s.pf&&s.pf.executorOk===false)w.push('NO EXECUTOR');
      const amber = bad || (!w.length && unread);
      g = bad?'✕':unread?'◐':'●'; gc = amber?'var(--y)':'var(--g)';
      right = `<span style="font-size:9px;letter-spacing:1px;color:${amber?'var(--y)':'var(--g)'}">${w.length?w.join(' · '):unread?'UNCHECKED · NO REPLY':'READY'}</span>`;
    } else {
      const canRetry = s.status==='failed' && d.done;
      // A chain the run stopped before reaching has not failed and was not
      // skipped — it was never tried. Saying WAITING under a finished run reads
      // as still working, which is the stall the halt is meant to replace.
      const untried = s.status==='pending' && d.done;
      // A deploy that could not be read back is still a deploy — say so, but
      // never let it borrow the word the verified ones earned. The reason for a
      // failure goes on its own line below rather than being truncated into this
      // slot: "SWITCH TO ARBITRUM ONE REJECT" is not an instruction.
      const txt = s.status==='failed' ? (s.blocked ? 'STOPPED' : 'FAILED')
        : untried ? 'NOT ATTEMPTED'
        : s.status==='done' ? (s.verified ? 'DEPLOYED · VERIFIED' : 'DEPLOYED · UNVERIFIED')
        : lbl[s.status];
      const tc = s.status==='done' && !s.verified ? 'var(--y)' : s.blocked ? 'var(--y)' : gc;
      if(untried){ g='○'; }
      right = `<span style="font-size:9px;letter-spacing:1px;color:${tc}">${txt}</span>${canRetry?` <button class="reject-link" style="padding:2px 9px;margin-left:8px" onclick="retryChain(${k})">RETRY</button>`:''}`;
    }
    // Per-chain explorer link: each chain has its own explorer, so build the
    // base from the step's chain id (not the connected chain) — links stay
    // correct across a multichain deploy.
    let xlink = '';
    // A failed step links out too, whenever it left a transaction behind. That is
    // the case the link matters most in — a deploy that reverted, or whose wait()
    // lost the RPC, is exactly the one whose transaction has to be read, and the
    // row was the only thing that ever knew its hash.
    if((s.status==='done'||s.status==='skipped'||s.status==='failed') && (s.txHash||s.address)){
      const eb = CHAINS[s.id] ? CHAINS[s.id].explorer : 'https://etherscan.io';
      const href = s.txHash ? `${eb}/tx/${s.txHash}` : `${eb}/address/${s.address}`;
      xlink = `<a class="tx-explorer" href="${href}" target="_blank" rel="noopener" title="${s.txHash?(s.status==='failed'?'View the transaction that failed':'View deploy transaction'):'View vault on explorer'} · ${esc(s.name)}">↗</a>`;
    }
    // A name that was asked for and did not land is reported on the chain it
    // was asked for on. The deploy still succeeded, so this is a second line
    // under a green row rather than a failure — but it is never left silent,
    // because "deployed" would otherwise cover a claim that never happened.
    const idText = s.wnsName
      ? { color:'var(--g)', html:`CLAIMED <b>${esc(s.wnsName)}</b> &middot; REVERSE RESOLUTION SET` }
      : s.wnsSkipped
        ? { color:'var(--y)', html:(s.wnsSkipped==='taken' ? 'NAME WAS CLAIMED BY SOMEONE ELSE FIRST &mdash; DEPLOYED WITHOUT IT'
            : s.wnsSkipped==='unchecked' ? 'COULD NOT CONFIRM THE NAME WAS FREE &mdash; DEPLOYED WITHOUT IT RATHER THAN RISK REVERTING THE DEPLOY'
            : 'NAME DID NOT READ BACK FROM WNS &mdash; THE VAULT DEPLOYED, THE CLAIM IS UNCONFIRMED')
            + '. CLAIM ONE FROM THE NAME TAB.' }
        : null;
    // Sub-lines under the row, in the order they matter: why this chain stopped,
    // then what happened to the name. Full sentences, because the right-hand slot
    // only has room for a status word and the reason is the actionable half.
    const subs = [];
    if(phase!=='preflight' && phase!=='review' && s.status==='failed' && s.err)
      subs.push({ color:s.blocked?'var(--y)':'var(--r)', html:esc(String(s.err)) });
    if(idText) subs.push(idText);
    const subLines = subs.map((t,i)=>`<div style="font-size:9px;letter-spacing:1.5px;line-height:1.6;color:${t.color};padding:0 0 ${i===subs.length-1?'10px':'4px'} 24px;${i===subs.length-1?'border-bottom:1px solid var(--ln)':''}">${t.html}</div>`).join('');
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${subLines?'none':'1px solid var(--ln)'}">
      <span style="color:${gc};font-size:12px;width:14px;text-align:center">${g}</span>
      ${chainIcon(s.id)}<span style="flex:1;font-size:12px;font-weight:700;letter-spacing:1px">${esc(s.name)}</span>${right}${xlink}</div>${subLines}`;
  }).join('');

  // Every chain in this deploy has its own explorer, and the vault has one
  // address across all of them. Link it on the primary target rather than on the
  // connected chain: during the chain walk that is a moving target, and before
  // the walk starts the wallet may not be sitting on a target chain at all.
  const primaryId = (d.chains && d.chains[0]) ? d.chains[0].id : (d.steps[0] ? d.steps[0].id : null);
  const xbase = (CHAINS[primaryId] && CHAINS[primaryId].explorer) || 'https://etherscan.io';
  const xa = (a, txt) => `<a href="${xbase}/address/${esc(a)}" target="_blank" rel="noopener" title="${esc(a)} &middot; view on explorer" style="color:var(--m);text-decoration:none;border-bottom:1px solid var(--ln)">${esc(txt || a)}</a>`;

  // What is about to be signed for, spelled out. The owner set is the part that
  // cannot be corrected afterwards without a full multisig round of the vault
  // being created, so every owner is listed at the address it resolved to —
  // names included, since a name is not what goes on chain.
  let summary = '';
  if(phase === 'review' && d.ctx){
    const ct = d.ctx, n = ct.resolvedOwners.length;
    const ownerRows = ct.resolvedOwners.map((a,i)=>{
      const lb = (ct.ownerLabels && ct.ownerLabels[i]) || '';
      const you = ct.connectedAddress && a.toLowerCase() === ct.connectedAddress.toLowerCase();
      return `<div style="display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:10px;letter-spacing:1px">
        <span style="color:var(--d)">${String(i+1).padStart(2,'0')}</span>${xa(a, shortAddr(a))}
        ${lb?`<span style="color:var(--d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lb)}</span>`:''}
        ${you?'<span style="color:var(--g);font-size:8px;margin-left:auto">YOU</span>':''}
      </div>`;
    }).join('');
    summary = `<div style="margin-top:4px;margin-bottom:16px">
      <div style="font-size:9px;color:var(--d);letter-spacing:1px;margin-bottom:4px">${n} OWNER${n>1?'S':''} &middot; IMMUTABLE WITHOUT A MULTISIG VOTE</div>
      ${ownerRows}
      <div class="rrow"><span>SIGNATURES</span><b>${ct.thresh} OF ${n}</b></div>
      <div class="rrow"><span>TIMELOCK</span><b${ct.del>0?'':' class="hi"'}>${ct.del>0?esc(fmtD(ct.del)):'NONE &middot; EXECUTES AT QUORUM'}</b></div>
      ${ct.del>0?`<div class="rrow"><span>INSTANT EXECUTION</span><b>${ct.wantForward?'ENABLED &middot; ALL OWNERS SKIP THE DELAY':'DISABLED'}</b></div>`:''}
      ${ct.wns?`<div class="rrow"><span>IDENTITY</span><b${d.wnsAvail===true?'':' class="hi"'}>${esc(ct.wns.full.toUpperCase())} &middot; ${d.wnsAvail===true?'FREE, CLAIMED ON ETHEREUM':d.wnsAvail===false?'NO LONGER AVAILABLE':'AVAILABILITY UNCONFIRMED'}</b></div>`:''}
      <div class="rrow"><span>CALL</span><b>${ct.wantForward||ct.wns?'createWithCalls()':'create()'}</b></div>
      <div class="rrow"><span>FACTORY</span><b>${xa(FACTORY, shortAddr(FACTORY))}</b></div>
    </div>`;
  }

  let footer;
  if(phase==='review'){
    const noExec = d.steps.some(s=>s.pf&&s.pf.executorOk===false);
    const noGas = d.steps.some(s=>s.pf&&s.pf.gasOk===false);
    // How much the worst-off chain is short, so the warning can be acted on.
    const shortfall = d.steps.reduce((m,s)=>(s.pf&&s.pf.gasShort!=null&&s.pf.gasShort>m)?s.pf.gasShort:m, 0n);
    const noFac = d.steps.some(s=>s.pf&&s.pf.factoryOk===false);
    const badImpl = d.steps.some(s=>s.pf&&s.pf.implOk===false);
    const notOwner = d.ctx && d.ctx.deployerIsOwner === false;
    const fpVoid = d.ctx && d.ctx.fastPathVoid === true;
    const unread = d.steps.some(s=>s.pf&&(s.pf.factoryOk===null||s.pf.gasOk===null));
    // The review screen is now the checkpoint for every deploy, clean ones
    // included, so the warning block only appears when there is something to
    // warn about — and "proceed anyway and those chains may fail" is not
    // something to tell someone whose preflight came back green.
    const warnText = `${fpVoid?`At ${d.ctx.thresh}-of-${d.ctx.resolvedOwners.length} every quorum is already unanimous, so instant execution makes the timelock advisory rather than enforced — the same signatures can queue or execute, whichever the submitter picks. Lower the threshold, or leave instant execution off, to keep the delay enforced. `:''}${noFac?'No factory on some chains — the vault cannot be deployed there. ':''}${badImpl?'On some chains the factory address holds code that does not name the audited implementation — a vault deployed there would not be the reviewed contract. ':''}${noExec?`No TimelockExecutor on some chains${d.ctx&&d.ctx.wantForward?' — instant execution cannot be enabled there, and there':' — there'} is no way to cancel a queued proposal inside its ${d.ctx?esc(fmtD(d.ctx.del)):''} window: a cancel raised as an ordinary proposal is itself queued for the full delay. `:''}${noGas?`Not enough gas in the connected wallet on some chains${shortfall>0n?` — up to ${esc(fmtGasShort(shortfall))} short`:''}. `:''}${notOwner?'You are not one of the owners — the vault will deploy, but it will not appear in your history. ':''}${d.ctx&&d.ctx.wns&&d.wnsAvail!==true?`${d.ctx.wns.full} ${d.wnsAvail===false?'has been claimed by someone else since you picked it':'could not be confirmed free — mainnet did not answer'}. The vault deploys either way; the name is dropped rather than reverting the deploy, and you can claim another one from the NAME tab afterwards. `:''}`;
    const anyWarn = !!warnText;
    footer = `${anyWarn?`<div style="margin-top:14px;font-size:10px;color:var(--y);letter-spacing:1px;line-height:1.6">${warnText}Proceed anyway and those chains may fail.</div>`
      :`<div style="margin-top:14px;font-size:9px;color:var(--d);letter-spacing:1px;line-height:1.6">${unread?'Some chains would not answer the preflight — they are listed as unchecked, not as ready. ':''}${nch>1?`Deploys run one chain at a time and each one needs a network switch plus a signature in your wallet — ${nch} in total.`:'Needs one signature in your wallet.'}</div>`}
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-outline btn-w" onclick="closeDeploy()">CANCEL</button><button class="btn btn-fill btn-w" onclick="proceedDeploy()">${nch>1?`DEPLOY &middot; ${nch} CHAINS`:'DEPLOY'}</button></div>`;
  } else if(d.done){
    const dbWarn = d.steps.some(s=>s.dbWarn);
    // The run stopped on something only the wallet can fix. Say which chain it
    // stopped on, what it was waiting for, how many chains are still owed a vault
    // — and offer the one button that carries on from there. Without this the
    // flow's only recovery was RETRY per chain, in the right order, guessed.
    let haltMsg = '';
    if(d.halted){
      const landed = d.steps.filter(s=>s.status==='done'||s.status==='skipped').length;
      const drift = S.walletChain && S.walletChain !== d.chains[d.halted.at].id
        ? ` Your wallet is on ${esc(CHAINS[S.walletChain] ? CHAINS[S.walletChain].name : 'chain ' + S.walletChain)}.` : '';
      // Closing is safe to say here because the salt is now saved outside the run:
      // the untried chains can still reach this address in a later session.
      haltMsg = `<div style="margin-top:14px;font-size:10px;color:var(--y);letter-spacing:1px;line-height:1.6">Stopped at ${esc(d.halted.name)} — ${esc(String(d.halted.reason).toLowerCase())}.${drift} ${landed} of ${nch} chain${nch>1?'s':''} ${landed===1?'has':'have'} the vault; the rest were left untried rather than firing the same prompt at each one. Fix it in your wallet and press RESUME.${landed?' Closing is safe too — the mined address is held, and the RESUME banner will offer the remaining chains again.':''}</div>`;
    }
    footer = `${haltMsg}${dbWarn?`<div style="margin-top:14px;font-size:10px;color:var(--y);letter-spacing:1px;line-height:1.6">Deployed on-chain, but not recorded in history — the vault is live at the address above.</div>`:''}
      <div style="display:flex;gap:8px;margin-top:20px">${d.halted?`<button class="btn btn-outline btn-w" onclick="closeDeploy()">CLOSE</button><button class="btn btn-fill btn-w" onclick="resumeDeploy()">RESUME &middot; ${remaining} CHAIN${remaining>1?'S':''}</button>`
        :`<button class="btn btn-fill btn-w" onclick="closeDeploy()">${anyFail?'CLOSE':'VIEW VAULT'}</button>`}</div>`;
  } else if(phase==='deploying'){
    // Which chain, and what it is waiting for. "APPROVE EACH WALLET PROMPT" is
    // true of the whole run and therefore says nothing about the prompt that is
    // actually open — on a five-chain walk that is the only thing worth saying.
    const cur = d.steps.findIndex(s=>s.status==='switching'||s.status==='mining'||s.status==='deploying'||s.status==='checking');
    const at = cur >= 0 ? d.steps[cur] : null;
    // 'checking' is the one line here that asks for nothing. Leaving it to fall
    // through to "APPROVE EACH WALLET PROMPT" would send the operator to look for
    // a prompt that does not exist, when the truth is better news than that.
    const what = at && at.status==='switching' ? `SWITCH TO ${esc(String(at.name).toUpperCase())} IN YOUR WALLET`
      : at && at.status==='deploying' ? `CONFIRM ${esc(String(at.name).toUpperCase())} IN YOUR WALLET`
      : at && at.status==='mining' ? 'MINING THE VAULT ADDRESS'
      : at && at.status==='checking' ? `WAITING FOR ${esc(String(at.name).toUpperCase())} TO CONFIRM THE TRANSACTION &middot; NOTHING TO APPROVE`
      : 'APPROVE EACH WALLET PROMPT TO CONTINUE';
    footer = `<div style="margin-top:16px;font-size:9px;color:var(--d);letter-spacing:1px;line-height:1.6;text-align:center">${what}${nch>1&&cur>=0?` &middot; ${cur+1} OF ${nch}`:''}</div>`;
  } else if(phase==='preflight'){
    // Preflight reads N chains and mines the address; a wedged RPC used to leave
    // this dialog with no way out at all, on a step where nothing has been signed
    // and there is nothing to abandon.
    footer = `<div style="margin-top:16px;font-size:9px;color:var(--d);letter-spacing:1px;line-height:1.6;text-align:center">READING THE FACTORY, YOUR GAS AND THE VAULT ADDRESS ON EACH CHAIN. NOTHING IS SIGNED YET.</div>
      <button class="btn btn-outline btn-w" style="margin-top:14px" onclick="closeDeploy()">CANCEL</button>`;
  } else { footer = ''; }

  // No click-out: this dialog is either mid-flight against a wallet or holding
  // the last confirmation before one, and a stray tap on the scrim must not be
  // able to abandon either. CANCEL / CLOSE are the only exits (plus Escape once
  // it is safe — see dismissTop()).
  return `<div class="ovl">
    <div class="ovl-card" style="--ow:460px;padding:24px" role="dialog" aria-modal="true" aria-label="Deploy vault" aria-busy="${!d.done && d.phase!=='review'}">
      <div class="ovl-title" style="margin-bottom:6px">${title}</div>
      ${d.address
        ? `<div style="margin-bottom:16px">
             <div style="font-size:9px;color:var(--d);letter-spacing:1px;margin-bottom:3px">${d.done||phase==='deploying'?'VAULT ADDRESS':'WILL DEPLOY TO'}${nch>1?` &middot; SAME ON ALL ${nch} CHAINS`:''}</div>
             <div style="font-size:11px;color:var(--m);letter-spacing:1px;word-break:break-all">${xa(d.address)}</div>
           </div>`
        : `<div style="font-size:10px;color:var(--d);letter-spacing:1px;margin-bottom:16px">${phase==='preflight'?'MINING THE VAULT ADDRESS&hellip;':'Same vault address on every chain'}</div>`}
      ${summary}
      <div>${rows}</div>
      ${footer}
    </div>
  </div>`;
}
function renderChainOverlay(mob){
  const mainnets = NETS.filter(n=>!n.test);
  const testnets = NETS.filter(n=>n.test);
  // One row template for both groups \u2014 they only ever differed by the TEST tag.
  const row = n => {
    const on = (!S.demoMode && n.id===S.chainId);
    return`<button type="button" class="net-row${on?" on":""}"${on?' aria-current="true"':''} onclick="switchChain(${n.id})">
      <span style="font-size:8px" aria-hidden="true">${on?"\u25CF":"\u25CB"}</span>${chainIcon(n.id)}<span>${esc(n.name)}</span>
      <span class="net-id">${n.id}</span>${n.test?'<span class="net-test">TEST</span>':''}
    </button>`;
  };
  return`<div class="ovl" onclick="if(event.target===this){S.showChains=false;render()}">
    <div class="ovl-card" style="--ow:400px" role="dialog" aria-modal="true" aria-label="Select chain">
      <div class="ovl-head" style="align-items:center;margin-bottom:16px">
        <span class="ovl-title">SELECT CHAIN</span>
        <button class="x-btn" onclick="S.showChains=false;render()" style="margin:0" aria-label="Close">&#10005;</button>
      </div>
      <div style="font-size:9px;letter-spacing:2px;color:var(--d);margin-bottom:8px">MAINNETS</div>
      ${mainnets.map(row).join("")}
      <div style="font-size:9px;letter-spacing:2px;color:var(--d);margin:12px 0 8px">TESTNETS</div>
      ${testnets.map(row).join("")}
    </div>
  </div>`;
}

// ── DASHBOARD ─────────────────────────────────────────────────────
function renderDash(v,mob){
  if(!v)return`<div class="empty"><div class="empty-title">NO VAULTS</div><div class="empty-sub">${S.demoMode?"":"DEPLOY YOUR FIRST MULTISIG"}</div><button class="btn btn-outline" style="padding:0 32px;height:48px" onclick="S.view='CREATE';render()">CREATE VAULT</button>${!S.demoMode?`<div style="max-width:400px;margin:44px auto 0;padding-top:32px;border-top:1px solid var(--ln)"><div style="font-size:10px;font-weight:600;letter-spacing:2px;color:var(--m)">LOAD EXISTING VAULT</div><div style="margin-top:12px;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap"><input class="inp" id="load-addr" style="max-width:320px;min-width:0;flex:1;margin:0;font-size:16px" placeholder="0x... or name.eth / name.(g)wei" aria-label="Vault address or name" aria-describedby="load-status" oninput="updateLoadStatus(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();loadVaultByAddress()}"><button class="btn btn-outline btn-sm" onclick="loadVaultByAddress()">LOAD</button></div><div id="load-status" role="status" style="font-size:9px;letter-spacing:1px;text-align:center;min-height:12px;margin-top:6px"></div><div style="margin-top:24px"><button class="btn btn-outline" style="font-size:9px;border-color:var(--ln);color:var(--d)" onclick="S.demoMode=true;S.vaults=seed();S.sel=0;flash('DEMO LOADED');render()">LOAD DEMO</button></div></div>`:""}</div>`;
  const you = getYou();
  const h0=v.holdings[0];

  // Single pass over every vault's queue: accumulate the global action counts
  // and, per vault, the flags the tabs below need — so txSt() is evaluated once
  // per tx instead of again for each tab dot.
  let needsSig=0,readyExec=0,pendingSubmit=0;
  const vaultFlags=S.vaults.map(vt=>{
    let rdy=false,needsYou=false;
    vt.queue.forEach(tx=>{
      const st=txSt(tx,vt);
      if(st.sign&&you&&!tx.approvals[you]){needsSig++;needsYou=true;}
      if(st.exec||st.instant){readyExec++;rdy=true;}
      else if(st.queue)pendingSubmit++;
    });
    return{rdy,needsYou};
  });
  const totalActions=needsSig+readyExec+pendingSubmit;
  // The proposal at the head of the unqueued run — everything behind it is
  // blocked on its nonce. One scan, hoisted out of the queue map below, where
  // it was being recomputed (each pass re-running isCancelTx over the whole
  // queue) once per card.
  const firstUnqueued=v.queue.findIndex(t=>t.eta===0&&!isCancelTx(t,v));
  const attnParts=[];
  if(needsSig)attnParts.push(`${needsSig} NEED${needsSig>1?"":"S"} YOUR SIG`);
  if(readyExec)attnParts.push(`${readyExec} READY TO EXECUTE`);
  if(pendingSubmit)attnParts.push(`${pendingSubmit} READY TO SUBMIT`);

  return`
  ${totalActions>0?`<div role="status" style="padding:${mob?"12px 6px":"14px 8px"};margin-bottom:4px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:${mob?8:12}px;flex-wrap:wrap;font-size:10px;letter-spacing:2px">
    <span style="color:var(--y);font-weight:700">${totalActions} ACTION${totalActions>1?"S":""}</span>
    <span style="color:var(--d)">${attnParts.join(" &middot; ")}</span>
  </div>`:""}
  <div class="vtabs"><div class="vtabs-inner">
    ${S.vaults.map((vt,i)=>{
      const on=i===S.sel;
      const {rdy,needsYou}=vaultFlags[i];
      const dot=rdy?'<span class="vtab-dot" style="background:var(--g)" title="Ready to execute" aria-hidden="true"></span>':needsYou?'<span class="vtab-dot" style="background:var(--y)" title="Needs your signature" aria-hidden="true"></span>':"";
      const pending=vt.queue.length>0?`${vt.queue.length} PENDING`:"";
      // The balance summary is a comparison aid for choosing between vaults, so it
      // belongs on the ones you might switch TO. On the selected tab it only
      // echoes the hero stat a few pixels below — true whether there is one vault
      // or ten — so the rule is per-tab, not per-list: the active tab keeps its
      // pending count and gives the balance back to the hero.
      const bal=vt.holdings.length?tokIcon(vt.holdings[0].token,'sm')+' <span class="priv">'+esc(vt.holdings[0].balance)+'</span> '+esc(vt.holdings[0].token)+(vt.holdings.length>1?" +"+(vt.holdings.length-1)+" MORE":""):"EMPTY";
      const info=on?pending:bal+(pending?` &middot; ${pending}`:"");
      return`<button class="vtab${on?" on":""}"${on?' aria-current="true"':''} onclick="S.sel=${i};S.nt=S.vaults[${i}].threshold;setNd(S.vaults[${i}].delay);S.showTx=false;render()">
      <div class="vtab-name">${esc(vt.name)}${dot}</div>
      ${info?`<div class="vtab-info">${info}</div>`:""}
    </button>`}).join("")}
  </div></div>
  <div class="stats">
    ${h0?`<div class="privg"${pgAttrs()} style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${tokIcon(h0.token,'big')}
      <span class="stat-big priv">${esc(h0.balance)}</span>
      <span class="stat-token">${esc(h0.token)}</span>
      <span class="stat-usd priv">${esc(h0.usd)}</span>
    </div>
    ${v.holdings.length>1?`<div class="holdings privg"${pgAttrs()}>${v.holdings.slice(1).map(h=>`<span>${tokIcon(h.token,'sm')} <span class="priv">${esc(h.balance)}</span> <strong>${esc(h.token)}</strong><span class="usd priv">${esc(h.usd)}</span></span>`).join("")}</div>`:""}`
    :`<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <span class="stat-big" style="color:var(--d)">0</span>
      <span class="stat-token">ETH</span>
    </div>
    <div style="font-size:11px;color:var(--d);letter-spacing:2px;margin-top:8px">NO BALANCES</div>`}
    <div class="meta">
      <span>${v.threshold}/${v.ownerCount} SIG</span>
${/* When this vault executes, as one bracketed clause. The delay and the one
           thing that voids it are a single sentence — "1D TIMELOCK, unless every
           owner signs, in which case none" — so the accent rule brackets both.
           INSTANT · ALL OWNERS used to sit at the far end of this row, two
           unrelated facts downstream of the delay it contradicts, and on a phone
           it wrapped onto a line of its own where it read as a free-standing
           claim that this vault executes instantly. Nothing about it is
           free-standing: without a delay to bypass it says nothing.
           The bracket is shared rather than written twice so an UNLOCKED vault
           groups the same way, and the whitespace between the two spans is real
           — the gap between them is CSS, and a screen reader reading the text
           straight through would otherwise say "1D TIMELOCKINSTANT". */''}
      <span class="meta-when${v.delay>0?"":" open"}">${v.delay>0
        ?`<span><strong>${fmtD(v.delay)}</strong> TIMELOCK</span>`
        :`<span><strong>UNLOCKED</strong></span>`}
        ${v.fastPath?'<span class="meta-fast" title="Unanimous owner signatures can bypass the timelock — instant execution via the executor">INSTANT &middot; ALL OWNERS</span>':""}</span>
      <span>${S.demoMode?v.chain:chainName()}</span>
      ${v.address&&ethers.isAddress(v.address)?`<span>${S.demoMode?addrLink(v.address,v.chain):addrLink(v.address)}${copyBtn(v.address)}</span>`:""}
${/* The name used to sit here too. It moved up to the header, beside the
           address it stands in for, where it is visible from every tab rather
           than only this one — and repeating it a hundred pixels below said
           nothing the first one had not. */''}
      ${v.executor===ethers.ZeroAddress||v.executor==="0x0000...0000"?'<span style="color:var(--y)">NO EXECUTOR</span>':""}
      ${v.codeKind==='foreign'?'<span style="color:var(--r)" title="The code at this address is not the audited Multisig clone. Everything below is read from a contract this interface cannot vouch for.">UNVERIFIED CODE</span>':""}
      ${v.codeKind==='7702'?'<span style="color:var(--m)" title="An EOA delegating to the Multisig implementation under EIP-7702. The key behind the address can revoke that delegation at any time.">EIP-7702</span>':""}
    </div>
${/* Topping up is the one action here that needs no signature, no quorum and no
       proposal — anyone can send to the address. It sits below the facts rather
       than between them and the balance, so balance → policy → chain → address
       stays one unbroken statement of what this vault IS, and it takes the
       tertiary treatment rather than .btn-outline: at full accent it was the
       heaviest box above the fold and read as the peer of + NEW, which is the
       action that actually moves the vault's money. */''}
    ${!S.demoMode&&v.address&&ethers.isAddress(v.address)?`<div style="margin-top:14px"><button class="alt-link" id="topup-btn" style="display:inline-flex;align-items:center;gap:6px" onclick="openTopUp()"><span style="font-size:11px;line-height:1" aria-hidden="true">&#8595;</span> TOP UP</button></div>`:""}
  </div>
  ${renderSlowOutbound(v,mob)}
  <div class="sec"><span>QUEUE</span><span class="line"></span>
    ${S.showTx?"":`<button class="btn btn-outline btn-sm" onclick="openTxBuilder()">+ NEW</button>`}
  </div>
  ${S.showTx?renderTxBuilder(v,mob):""}
  ${/* An empty queue is the common resting state, not an event. On a phone the
       desktop padding spent 113px of an 844px viewport saying nothing and pushed
       SIGNERS — the only content on the screen — to the bottom edge. */''}
  ${v.queue.length===0&&!S.showTx?`<div style="padding:${mob?"26px 0":"48px 0"};text-align:center;font-size:13px;color:var(--d);letter-spacing:2px">NO PENDING TRANSACTIONS</div>`:v.queue.map((tx,i)=>{
    const s=txSt(tx,v),isCancel=isCancelTx(tx,v);
    const isQueued=tx.eta>0;
    const blocked=!isQueued&&!isCancel&&i!==firstUnqueued;
    const dv=tx.displayValue||tx.value,dt=tx.displayToken||tx.token;
    // What kind of proposal this is, and what executing it would actually do.
    const kind=isCancel&&tx.cancelTarget!=null
      ?{label:`CANCEL #${tx.cancelTarget}`,tone:'danger',note:`DROPS QUEUED PROPOSAL #${tx.cancelTarget} BEFORE ITS TIMELOCK ELAPSES, SO IT CAN NEVER EXECUTE.`}
      :txKind(tx,v);
    // With no value to lead on, the kind label IS the headline — one vocabulary
    // across the badge, the headline and the note, instead of two.
    const display=dv&&dv!=="0"?`${dv} ${dt}`:kind.label;
    const acCount=Object.values(tx.approvals).filter(Boolean).length;
    // The absolute moment this proposal matures. Hoisted above the progress line
    // because that line claims it when it has a bar to attach it to; the ticker
    // finds it by [data-eta] wherever it ends up, so which parent holds it is a
    // layout question only.
    const etaHtml=tx.eta>0&&fmtEta(tx.eta)!=="READY"?`<span class="eta" data-eta="${tx.eta}">${new Date(tx.eta*1000).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>`:"";
    let progressLine="",etaRow=etaHtml;
    if(!isCancel&&!isQueued&&!blocked){
      const pct=v.threshold?Math.min(1,acCount/v.threshold):0,done=acCount>=v.threshold;
      progressLine=`<div class="tx-progress"><span class="plabel">SIGNATURES</span><div class="pbar" role="progressbar" aria-label="Signatures collected" aria-valuemin="0" aria-valuemax="${v.threshold}" aria-valuenow="${acCount}"><i style="width:${Math.round(pct*100)}%;background:${done?"var(--g)":"var(--y)"}"></i></div><span style="color:${done?"var(--g)":"var(--m)"}">${acCount}/${v.threshold}${done&&acCount>=v.ownerCount?" \u00B7 ALL":""}</span></div>`;
    }else if(isQueued&&v.delay>0&&fmtEta(tx.eta)!=="READY"){
      const queuedAt=tx.eta-v.delay,pct=Math.min(1,Math.max(0,(NOW()-queuedAt)/v.delay));
      // The date moves into the bar's value slot and out of the approvals row \u2014
      // it is what this bar is counting to, and it is the only thing on the card
      // that says WHEN rather than how long. Only in this branch: a card with no
      // timelock bar has no slot to move it to, so it stays where it was.
      progressLine=`<div class="tx-progress"><span class="plabel">TIMELOCK</span><div class="pbar" role="progressbar" aria-label="Timelock elapsed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct*100)}"><i data-tl-eta="${tx.eta}" data-tl-delay="${v.delay}" style="width:${Math.round(pct*100)}%;background:var(--a)"></i></div>${etaHtml}</div>`;
      etaRow="";
    }
    const apHtml=v.owners.map(o=>{
      const signed=!!tx.approvals[o.addr];
      return `<span class="${signed?"ap-ok":"ap-no"}" title="${esc(ownerIdent(o))} ${signed?"has signed":"has not signed"}"><span aria-hidden="true">${signed?"\u2713":"\u25CB"}</span><span class="vh">${signed?"signed":"not signed"}</span> ${esc(ownerIdent(o))}${o.you?"*":""}</span>`;
    }).join("");
    const signedByYou=you&&tx.approvals[you];
    let actionBtn="";
    if(s.sign&&!signedByYou){
      // Signing is the path almost everyone wants: free, private, and it keeps
      // the submitter binding that stops a collected bundle being replayed down
      // the queueing route. On-chain approval is demoted to a fallback rather
      // than removed — a DAO or nested multisig owner has no other way to
      // authorise, and it is the only route that works with no coordination
      // service at all. The tooltip carries the tradeoff so the choice is not
      // made on the label alone.
      const apTitle = 'Registers approval in the vault itself instead of signing a message. '
        + 'Use it if you cannot sign — a DAO or contract owner — or if you want this vault to work with no coordination service. '
        + 'Costs gas, is publicly visible, and gives up front-run protection unless a different owner submits the transaction.';
      actionBtn=mob
        ?`<div style="display:flex;gap:8px;flex-direction:column">
            <button class="btn btn-fill btn-w" onclick="doSign(${S.sel},${tx.nonce})">SIGN <span class="btn-qual">OFF-CHAIN</span></button>
            <button class="alt-link" style="width:100%" title="${apTitle}" onclick="doApprove(${S.sel},${tx.nonce})">APPROVE ON-CHAIN INSTEAD</button>
          </div>`
        :`<div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-fill" onclick="doSign(${S.sel},${tx.nonce})">SIGN</button>
            <button class="alt-link" title="${apTitle}" onclick="doApprove(${S.sel},${tx.nonce})">OR APPROVE ON-CHAIN</button>
          </div>`;
    }else if(s.sign&&signedByYou){
      actionBtn=`<button class="btn btn-outline" ${mob?"style='width:100%'":""} onclick="doUnsign(${S.sel},${tx.nonce})">UNSIGN</button>`;
    }else if(s.queue){
      const ac=Object.values(tx.approvals).filter(Boolean).length;
      const unanimous=ac===v.ownerCount;
      const unsignLink=signedByYou?`<button class="unsign-link" onclick="doUnsign(${S.sel},${tx.nonce})">UNSIGN</button>`:'';
      if(s.instant){
        actionBtn=`<div style="display:flex;flex-direction:column;${mob?"width:100%":"align-items:flex-end"}"><button class="btn btn-green" ${mob?"style='width:100%'":""} onclick="doSubmit(${S.sel},${tx.nonce})">EXECUTE</button>${unsignLink}</div>`;
      }else if(isCancel){
        actionBtn=`<button class="btn btn-danger" ${mob?"style='width:100%'":""} onclick="doSubmit(${S.sel},${tx.nonce})">EXECUTE CANCEL</button>`;
      }else if(unanimous&&v.fastPath){
        actionBtn=mob
          ?`<div style="display:flex;gap:8px;flex-direction:column">
              <button class="btn btn-green btn-w" onclick="doFastExecute(${S.sel},${tx.nonce})">INSTANT EXECUTE <span class="btn-qual">VIA EXECUTOR</span></button>
              <button class="btn btn-outline btn-w" onclick="doSubmit(${S.sel},${tx.nonce})">QUEUE WITH TIMELOCK</button>
              ${unsignLink}
            </div>`
          :`<div style="display:flex;flex-direction:column;align-items:flex-end">
              <div style="display:flex;gap:8px">
                <button class="btn btn-green" onclick="doFastExecute(${S.sel},${tx.nonce})">INSTANT EXECUTE</button>
                <button class="btn btn-outline" onclick="doSubmit(${S.sel},${tx.nonce})">QUEUE</button>
              </div>
              ${unsignLink}
            </div>`;
      }else{
        actionBtn=`<div style="display:flex;flex-direction:column;${mob?"width:100%":"align-items:flex-end"}"><button class="btn btn-fill" ${mob?"style='width:100%'":""} onclick="doSubmit(${S.sel},${tx.nonce})">SUBMIT</button>${unsignLink}</div>`;
      }
    }else if(s.exec){
      actionBtn=mob
        ?`<div style="display:flex;gap:8px;flex-direction:column">
            <button class="btn btn-green btn-w" onclick="doExecute(${S.sel},${tx.nonce})">EXECUTE</button>
            ${s.cancelExec?`<button class="btn btn-danger btn-w" onclick="doCancel(${S.sel},${tx.nonce})">EXECUTE CANCEL <span class="btn-qual">${s.cancelSigs}/${v.threshold} VIA EXECUTOR</span></button>`:''}
            ${s.cancel?`<button class="btn btn-danger btn-w" onclick="doCancel(${S.sel},${tx.nonce})">CANCEL${s.cancelSigs?` (${s.cancelSigs}/${v.threshold})`:''}</button>`:''}
            ${!s.cancel&&!s.cancelExec&&s.cancelSigs?`<span style="font-size:10px;color:var(--r);letter-spacing:1px">CANCEL ${s.cancelSigs}/${v.threshold}</span>`:''}
            ${s.noCancel?`<span style="font-size:10px;color:var(--d);letter-spacing:1px" title="Cancelling inside the timelock window goes through the executor's forward(). This vault has no TimelockExecutor, so there is no route: a cancel raised as an ordinary proposal is itself queued for the full delay and matures no earlier than what it would stop.">NO EXECUTOR &middot; CANNOT CANCEL</span>`:''}
          </div>`
        :`<div style="display:flex;gap:8px">
            <button class="btn btn-green" onclick="doExecute(${S.sel},${tx.nonce})">EXECUTE</button>
            ${s.cancelExec?`<button class="btn btn-danger" onclick="doCancel(${S.sel},${tx.nonce})">EXECUTE CANCEL <span class="btn-qual">${s.cancelSigs}/${v.threshold} VIA EXECUTOR</span></button>`:''}
            ${s.cancel?`<button class="btn btn-danger" onclick="doCancel(${S.sel},${tx.nonce})">CANCEL${s.cancelSigs?` (${s.cancelSigs}/${v.threshold})`:''}</button>`:''}
            ${!s.cancel&&!s.cancelExec&&s.cancelSigs?`<span style="font-size:10px;color:var(--r);letter-spacing:1px">CANCEL ${s.cancelSigs}/${v.threshold}</span>`:''}
            ${s.noCancel?`<span style="font-size:10px;color:var(--d);letter-spacing:1px" title="Cancelling inside the timelock window goes through the executor's forward(). This vault has no TimelockExecutor, so there is no route: a cancel raised as an ordinary proposal is itself queued for the full delay and matures no earlier than what it would stop.">NO EXECUTOR &middot; CANNOT CANCEL</span>`:''}
          </div>`;
    }else if(s.cancel||s.cancelExec||s.accel||s.accelExec||s.noCancel){
      actionBtn=mob
        ?`<div style="display:flex;gap:8px;flex-direction:column">
            ${s.accelExec?`<button class="btn btn-green btn-w" onclick="doAccelerate(${S.sel},${tx.nonce})">INSTANT EXECUTE <span class="btn-qual">${s.accelSigs}/${v.ownerCount} VIA EXECUTOR</span></button>`:''}
            ${s.accel?`<button class="btn btn-outline btn-w" onclick="doAccelerate(${S.sel},${tx.nonce})">ACCELERATE${s.accelSigs?` (${s.accelSigs}/${v.ownerCount})`:''}</button>`:''}
            ${!s.accel&&!s.accelExec&&s.accelSigs?`<span style="font-size:10px;color:var(--d);letter-spacing:1px">ACCELERATE ${s.accelSigs}/${v.ownerCount}</span>`:''}
            ${s.noCancel?`<span style="font-size:10px;color:var(--d);letter-spacing:1px" title="Cancelling inside the timelock window goes through the executor's forward(). This vault has no TimelockExecutor, so there is no route: a cancel raised as an ordinary proposal is itself queued for the full delay and matures no earlier than what it would stop.">NO EXECUTOR &middot; CANNOT CANCEL</span>`:''}
            ${s.cancelExec?`<button class="btn btn-danger btn-w" onclick="doCancel(${S.sel},${tx.nonce})">EXECUTE CANCEL <span class="btn-qual">${s.cancelSigs}/${v.threshold} VIA EXECUTOR</span></button>`:''}
            ${s.cancel?`<button class="btn btn-danger btn-w" onclick="doCancel(${S.sel},${tx.nonce})">CANCEL${s.cancelSigs?` (${s.cancelSigs}/${v.threshold})`:''}</button>`:''}
          </div>`
        :`<div style="display:flex;gap:8px">
            ${s.accelExec?`<button class="btn btn-green" onclick="doAccelerate(${S.sel},${tx.nonce})">INSTANT EXECUTE <span class="btn-qual">${s.accelSigs}/${v.ownerCount} VIA EXECUTOR</span></button>`:''}
            ${s.accel?`<button class="btn btn-outline" onclick="doAccelerate(${S.sel},${tx.nonce})">ACCELERATE${s.accelSigs?` (${s.accelSigs}/${v.ownerCount})`:''}</button>`:''}
            ${!s.accel&&!s.accelExec&&s.accelSigs?`<span style="font-size:10px;color:var(--d);letter-spacing:1px">ACCELERATE ${s.accelSigs}/${v.ownerCount}</span>`:''}
            ${s.noCancel?`<span style="font-size:10px;color:var(--d);letter-spacing:1px" title="Cancelling inside the timelock window goes through the executor's forward(). This vault has no TimelockExecutor, so there is no route: a cancel raised as an ordinary proposal is itself queued for the full delay and matures no earlier than what it would stop.">NO EXECUTOR &middot; CANNOT CANCEL</span>`:''}
            ${s.cancelExec?`<button class="btn btn-danger" onclick="doCancel(${S.sel},${tx.nonce})">EXECUTE CANCEL <span class="btn-qual">${s.cancelSigs}/${v.threshold} VIA EXECUTOR</span></button>`:''}
            ${s.cancel?`<button class="btn btn-danger" onclick="doCancel(${S.sel},${tx.nonce})">CANCEL${s.cancelSigs?` (${s.cancelSigs}/${v.threshold})`:''}</button>`:''}
          </div>`;
    }
    // Kind badge — what sort of call this is. Suppressed when the headline
    // line already says it (a bare "BATCH (3)" needs no "BATCH" tag beside it).
    // esc() on the label, not on the note: a note is authored here and carries
    // deliberate entities (&mdash;, &rarr;), whereas a label can end in a bare
    // selector read off a proposal row — and rows are anon-writable.
    const kindTag=(kind.label&&kind.label!==display)
      ?`<span class="tx-kind ${esc(kind.tone||'')}">${kind.icon?`${tokIcon(kind.icon,'sm')} `:''}${esc(kind.label)}</span>`
      :'';
    const kindNote=kind.note?`<div class="tx-note${kind.warn?' warn':''}">${kind.note}</div>`:'';
    const _txRef=vaultRef(v);
    const txLink=!S.demoMode&&_txRef?appBase()+refHash(_txRef,tx.nonce):'';
    const isFocus=_focusNonce!==null&&tx.nonce===_focusNonce&&!!v.address&&v.address.toLowerCase()===(_focusVaultAddr||'').toLowerCase();
    return`<div class="tx privg${blocked?" blocked":""}${isFocus?" tx-focus":""}" data-tx-nonce="${tx.nonce}">
      ${isFocus?`<div style="margin-bottom:10px"><span class="tx-share">SHARED FOR REVIEW${txLink?` <button onclick="event.stopPropagation();copyText('${jstr(txLink)}','CO-SIGN LINK COPIED')" aria-label="Copy co-sign link" title="Copy co-sign link">⧉</button>`:''}<button onclick="dismissFocus()" aria-label="Dismiss shared-for-review banner" title="Dismiss">&#10005;</button></span></div>`:''}
      <div class="tx-top">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span class="tx-nonce">#${tx.nonce}${isCancel?" VIA EXECUTOR":i===firstUnqueued&&!isQueued?" NEXT":""}${txLink?` <button class="x-btn copy-btn icon-btn" onclick="event.stopPropagation();copyText('${jstr(txLink)}','CO-SIGN LINK COPIED')" aria-label="Copy co-sign link for proposal ${tx.nonce}" title="Copy co-sign link">\u29C9</button>`:""}</span>
            ${kindTag}
          </div>
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px">
            <span class="tx-val${(!kindTag&&(kind.tone==='policy'||kind.tone==='danger'))?' '+kind.tone:''}" style="display:inline-flex;align-items:center;gap:6px">${(dv&&dv!=='0')?`${tokIcon(dt)}<span class="priv">${esc(dv)}</span> ${esc(dt)}`:esc(display)}</span>
          </div>
          <div class="tx-to">&rarr; ${S.demoMode?addrLink(tx.target,v.chain):addrLink(tx.displayTo||tx.target)}${(()=>{const a=S.demoMode?tx.target:(tx.displayTo||tx.target);return ethers.isAddress(a)?copyBtn(a):'';})()}</div>
          ${tx.orphanedFrom?`<div class="tx-note warn">${tx.orphanedFrom==='proposed'
            ? 'THE COORDINATION RECORD HAS THIS PROPOSAL AS NEVER QUEUED.'
            : `THE COORDINATION RECORD SAYS THIS PROPOSAL WAS ${esc(String(tx.orphanedFrom).toUpperCase())}.`} THE VAULT DISAGREES — IT IS QUEUED ON CHAIN, STILL MATURING, AND ANYONE CAN EXECUTE IT ONCE IT DOES. THE CHAIN IS THE AUTHORITY: TREAT THIS AS LIVE, AND CANCEL IT IF IT SHOULD NOT RUN.</div>`:''}
          ${kindNote}
        </div>
        ${!blocked?`<span class="tx-status" style="color:${s.c}"${tx.eta>0&&!s.exec?` data-eta-status="${tx.eta}"`:``}>&bull; ${s.l}</span>`:""}
        ${blocked?(()=>{
          // Two proposals can now sit at the same nonce — a nonce is contested,
          // not owned, and the companion flows have to build at the live one.
          // Only one of a contested set can ever execute, and "waiting on #4"
          // reads as nonsense on a proposal that is itself #4.
          const head=v.queue[firstUnqueued];
          const same=head&&head.nonce===tx.nonce;
          return `<span class="tx-status" style="color:var(--d)" title="${same
            ?`Another proposal is already claiming nonce ${tx.nonce}. Only one of them can execute; the other is dropped once the vault moves past it.`
            :`Waiting on proposal #${head?head.nonce:''} — the vault executes nonces in order`}">&bull; ${same?"CONTESTED":"BLOCKED"}</span>`;
        })():""}
      </div>
      ${blocked?"":progressLine}
      <div class="approvals">${apHtml}${etaRow}${(()=>{const xl=txExplorerLink(tx,v);return xl?`<span class="eta" style="margin-left:${etaRow?'12px':'auto'}">${xl}</span>`:'';})()}</div>
      ${blocked?'':(()=>{
        // Any live proposal can be dry-run — knowing it reverts is just as
        // useful while it sits in the timelock as it is before signing.
        const canReject = i===firstUnqueued && !isQueued && !isCancel;
        const rsc = tx.rejectSigners ? tx.rejectSigners.size : 0;
        const armed = _rejectArmed === tx.nonce;
        const rlabel = armed ? 'CONFIRM &middot; SKIP NONCE?' : `REJECT &middot; SKIP NONCE${rsc?` (${rsc}/${v.threshold})`:''}`;
        return `<div class="tx-foot">
          <div class="tx-foot-diag">
            <button class="sim-btn" onclick="simulateProposal(${S.sel},${tx.nonce})" title="Dry-run this proposal against current chain state (from = the vault)">${tx._sim&&!tx._sim.loading?'RE-SIMULATE':'SIMULATE'}</button>
            ${canReject?`<button class="reject-link${armed?' armed':''}" onclick="armReject(${S.sel},${tx.nonce})" title="Sign a no-op to consume this nonce so later transactions can proceed">${rlabel}</button>`:''}
          </div>
          ${actionBtn?`<div class="tx-foot-act">${actionBtn}</div>`:''}
        </div>`;
      })()}
      ${tx._sim?renderSim(tx._sim,{ rerun:`simulateProposal(${S.sel},${tx.nonce})`, dismiss:`dismissProposalSim(${S.sel},${tx.nonce})` }):''}
    </div>`}).join("")}
  <div class="sec"><span>SIGNERS</span><span class="line"></span></div>
${/* Name first, then the address it stands for, then the annotations. YOU sits
     inside the group rather than being pushed to the far edge by .row's
     space-between: on a phone that left ~250px between a signer and the label
     that belongs to them, which reads as a column heading, not an annotation. */''}
  ${v.owners.map(o=>`<div class="row">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0">
      ${signerIdentHtml(o,v.chain)}${o.label&&o.label.trim().toUpperCase()!=='YOU'?`<span class="signer-label">${esc(o.label)}</span>`:""}${o.you?'<span class="signer-you">YOU</span>':""}
    </div>
  </div>`).join("")}`;
}

// USD rate for a holding, derived from the balance/usd pair the treasury
// loader already priced (0 when the asset has no feed).
function tokRate(hold){
  if(!hold || !hold.usd) return 0;
  const u = parseFloat(String(hold.usd).replace(/[^0-9.]/g, ''));
  const b = parseFloat(stripCommas(String(hold.balance)));
  return (u > 0 && b > 0) ? u / b : 0;
}
function fmtUsd(n){
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Thousands-separate the integer part of a decimal string, leaving the
// fraction exact — token amounts must stay digit-for-digit truthful.
function groupInt(s){
  const [w, f] = String(s).split('.');
  return w.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
}
// What the builder is still missing before it can be signed.
function txMissing(){
  const miss = [];
  if(S.txMode === 'STAKE'){
    if(!(parseFloat(stripCommas(S.stakeAmount || '')) > 0)) miss.push('AN AMOUNT TO STAKE');
    return miss;
  }
  // NAME asks for a label, not an amount and a recipient. Answering for it in
  // the transfer's vocabulary is what put "ENTER AMOUNT + RECIPIENT" under a
  // form that has neither field.
  if(S.txMode === 'NAME'){
    const v = S.vaults[S.sel];
    if(!v) return miss;
    const plan = wnsProposalPlan(v, S.wnsLabel);
    if(!plan.calls.length) miss.push(asciiLower(String(S.wnsLabel || '').trim()) ? 'A FREE NAME' : 'A NAME');
    return miss;
  }
  if(!(parseFloat(stripCommas(S.txAmount || '')) > 0)) miss.push('AMOUNT');
  const t = (S.txTo || '').trim();
  if(!t || !(ethers.isAddress(t) || NAME_RE.test(t))) miss.push('RECIPIENT');
  return miss;
}

// ── NAME (WNS id.wei) ─────────────────────────────────────────────
function wnsAvailableChain(){ return !S.demoMode && S.chainId === WNS_CHAIN_ID; }

// One place decides what the NAME tab proposes, and the field hint, the review
// panel, the dry-run and the submit all read it. Two things being encoded from
// two different readings of the same input is how a review panel ends up
// describing a transaction nobody signed.
//
// The case worth spelling out is a name the vault already holds: register()
// would revert NotAvailable and burn the proposal's nonce doing it, so what is
// left to propose is the reverse record alone.
function wnsProposalPlan(v, label){
  const lab = asciiLower(String(label || '').trim());
  // Asked as the vault, because the vault is what will make the call — which
  // makes this the check that a vault whose code cannot receive an ERC721
  // (a foreign clone, an EIP-7702 delegation) never gets offered a name it
  // would revert on.
  const st = lab ? wnsAvState(lab, v.address) : { state:'invalid', holder:null };
  const holder = st.holder;
  const owned = st.state === 'taken' && !!holder && !!v.address
    && holder.toLowerCase() === v.address.toLowerCase();
  const registerToo = st.state === 'free';
  const primary = !!S.wnsPrimary;
  const calls = (registerToo || (owned && primary))
    ? wnsClaimCalls(lab, { primary, registerToo })
    : [];
  return { label:lab, full:wnsFullName(lab), av:st.state, holder, owned, registerToo, primary, calls };
}
// {target,value,data,desc} for the plan — one call proposed directly, two
// wrapped in the vault's own batch() so the mint and the reverse record either
// both land or neither does. A vault that minted a name and then failed to
// point at it would need a second proposal to finish a job that reads as done.
function buildWnsProposal(v, plan){
  const calls = plan.calls;
  if(!calls.length) return null;
  if(calls.length === 1) return {
    target: calls[0].target, value: '0', data: calls[0].data, batched: false,
    desc: plan.registerToo ? `Claim ${plan.full}` : `Primary name → ${plan.full}` };
  return {
    target: v.address, value: '0', batched: true,
    data: msIface.encodeFunctionData('batch',
      [calls.map(c => c.target), calls.map(() => 0n), calls.map(c => c.data)]),
    desc: `On-chain identity ${plan.full}` };
}
function nameReviewBody(v){
  const plan = wnsProposalPlan(v, S.wnsLabel);
  const named = plan.av !== 'invalid';
  const nameHtml = named
    ? `<div class="review-amt" style="font-size:20px">${esc(plan.full)}</div>`
    : `<div class="review-amt ph" style="font-size:20px">name${WNS_ID_SUFFIX}</div>`;
  const steps = plan.calls.length
    ? plan.calls.map(c => c.target === WNS_ID_REGISTRAR ? 'register() &rarr; NAME RESOLVES TO THE VAULT' : 'setPrimaryName() &rarr; VAULT ANSWERS WITH THE NAME').join('<br>')
    : '&mdash;';
  const rows = [
    ['REGISTRY', `<b>WNS &middot; ${xaWns(WEINS)}</b>`],
    ['REGISTRAR', `<b>${xaWns(WNS_ID_REGISTRAR)}</b>`],
    ['PRICE', '<b>FREE &middot; NO FEE, NO RENEWAL</b>'],
    ['CALLS', `<b>${plan.calls.length ? (plan.calls.length > 1 ? 'BATCH &middot; 2' : '1') : '&mdash;'}</b>`],
    ['SIGNATURES', `<b>${v.threshold} OF ${v.ownerCount}</b>`],
    ['TIMELOCK', v.delay > 0
      ? `<b>${esc(fmtD(v.delay))}${v.fastPath ? ' &middot; SKIPPABLE' : ''}</b>`
      : '<b>NONE &middot; EXECUTES AT QUORUM</b>'],
  ].map(([k, val]) => `<div class="rrow"><span>${k}</span>${val}</div>`).join('');
  const warns = [];
  if(plan.av === 'taken' && !plan.owned) warns.push('THAT NAME IS ALREADY HELD BY ANOTHER ADDRESS. NOTHING CAN BE PROPOSED FOR IT.');
  if(plan.owned && !plan.primary) warns.push('THE VAULT ALREADY HOLDS THIS NAME AND REVERSE RESOLUTION IS EXCLUDED, SO THERE IS NOTHING LEFT TO PROPOSE.');
  if(plan.av === 'unknown') warns.push('MAINNET WOULD NOT SAY WHETHER THIS NAME IS FREE. A REGISTER THAT LANDS ON A TAKEN NAME REVERTS AND CONSUMES THE PROPOSAL NONCE.');
  if(plan.calls.length && v.delay > 0) warns.push('NAMES ARE FIRST COME, FIRST SERVED. THIS PROPOSAL SERVES THE VAULT TIMELOCK BEFORE IT CAN EXECUTE, AND THE NAME CAN BE TAKEN IN THE MEANTIME.');
  return `${nameHtml}
    <div class="review-arrow">&darr; WHAT EXECUTES</div>
    <div class="review-to${plan.calls.length?'':' ph'}" style="line-height:1.9">${steps}</div>
    <div class="review-rows">${rows}</div>
    ${warns.map(w => `<div class="review-warn">${w}</div>`).join('')}`;
}
// Both WNS contracts live on mainnet whatever chain the app is pointed at, so
// their links are pinned to mainnet's explorer rather than the connected one.
function xaWns(a){
  return `<a href="https://etherscan.io/address/${esc(a)}" target="_blank" rel="noopener" title="${esc(a)} &middot; view on Etherscan" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--ln)">${esc(shortAddr(a))}</a>`;
}

// The live proposal summary: exactly what SIGN + SUBMIT will construct,
// down to the call it encodes and the nonce it will occupy.
function txReviewBody(v){
  const ct = curTok(v);
  const amtStr = stripCommas(S.txAmount || '').trim();
  const amtNum = parseFloat(amtStr) || 0;
  const to = (S.txTo || '').trim();
  const hold = (v.holdings || []).find(h => h.token === S.txToken);
  const rate = tokRate(hold);
  const slowOn = slowAvailable() && S.txSlow;
  const isAddr = ethers.isAddress(to);
  const isName = NAME_RE.test(to);
  const availNum = hold ? Number(hold.raw != null ? ethers.formatUnits(hold.raw, hold.decimals || ct.decimals) : stripCommas(hold.balance)) : 0;

  const amtHtml = amtNum > 0
    ? `<div class="privg"${pgAttrs()}>
         <div class="review-amt">${tokIcon(S.txToken)}<span class="priv">${esc(groupInt(amtStr))}</span><span style="font-size:13px;color:var(--m)">${esc(S.txToken)}</span></div>
         ${rate > 0 ? `<div class="review-usd priv">${esc(fmtUsd(amtNum * rate))}</div>` : ''}
       </div>`
    : `<div class="review-amt ph">${tokIcon(S.txToken)}<span>0.0</span><span style="font-size:13px">${esc(S.txToken)}</span></div>`;
  // A name shows the address it resolves to, right here, because that address
  // is what the proposal will carry and what every co-signer will vote on.
  const pv = isName ? previewName(to, S.chainId, () => { if(S.showTx) updateTxReview(); }) : null;
  const toHtml = isAddr
    ? `<div class="review-to">${esc(shortAddr(to))}</div>`
    : isName
      ? `<div class="review-to">${esc(to)}</div>` + (
          !pv ? ''
          : pv.state === 'resolving' ? `<div class="review-to-sub">RESOLVING&hellip;</div>`
          : pv.state === 'err' ? `<div class="review-to-sub bad">${esc(pv.err)}</div>`
          : `<div class="review-to-sub">&rarr; ${esc(pv.addr)}</div>`)
      : `<div class="review-to ph">NO RECIPIENT YET</div>`;

  // The on-chain shape of the proposal, named the way the queue will label it.
  const call = slowOn ? 'SLOW.depositTo()'
    : (S.txToken === 'ETH' ? 'NATIVE SEND' : `${esc(S.txToken)}.transfer()`);

  const rows = [
    ['ROUTE', slowOn ? `<b class="hi">SLOW &middot; ${esc(fmtDelay(S.txSlowDelaySec))}</b>` : '<b>DIRECT</b>'],
    slowOn ? ['CLAIMABLE', `<b>${esc(fmtDelay(S.txSlowDelaySec))} AFTER EXECUTION</b>`] : null,
    ['SIGNATURES', `<b>${v.threshold} OF ${v.ownerCount}</b>`],
    ['TIMELOCK', v.delay > 0
      ? `<b>${esc(fmtD(v.delay))}${v.fastPath ? ' &middot; SKIPPABLE' : ''}</b>`
      : '<b>NONE &middot; EXECUTES AT QUORUM</b>'],
    ['CALL', `<b>${call}</b>`],
    // The approve is only batched in when the vault's standing allowance to
    // SLOW falls short, so state it as conditional rather than promise a batch.
    (slowOn && S.txToken !== 'ETH') ? ['ALLOWANCE', '<b>APPROVE BATCHED IF SHORT</b>'] : null,
  ].filter(Boolean).map(([k, val]) => `<div class="rrow"><span>${k}</span>${val}</div>`).join('');

  const warns = [];
  if(availNum > 0 && amtNum > availNum) warns.push('AMOUNT EXCEEDS THE VAULT BALANCE — THIS WILL REVERT ON EXECUTION.');
  else if(!hold && amtNum > 0 && !S.demoMode) warns.push(`THE VAULT HOLDS NO ${esc(S.txToken)} — THIS WILL REVERT ON EXECUTION.`);
  if(slowOn && v.delay > 0 && !v.fastPath && v.delay >= Number(S.txSlowDelaySec))
    warns.push('THE VAULT TIMELOCK IS AS LONG AS THE SLOW DELAY — A REVERSE MAY NOT CLEAR IN TIME.');
  if(pv && pv.state === 'err') warns.push(`${esc(pv.err)} — THE PROPOSAL CANNOT BE BUILT UNTIL IT DOES.`);
  else if(pv && pv.alt) warns.push(`${esc(to.toUpperCase())} PUBLISHES A DIFFERENT ADDRESS FOR ${esc((CHAINS[S.chainId] || {}).name || 'THIS CHAIN').toUpperCase()} (${esc(shortAddr(pv.alt))}). THIS SENDS TO THE ADDRESS ABOVE — CONFIRM WHICH ONE YOU WANT.`);

  return `${amtHtml}
    <div class="review-arrow">&darr; TO</div>
    ${toHtml}
    <div class="review-rows">${rows}</div>
    ${warns.map(w => `<div class="review-warn">${w}</div>`).join('')}`;
}
// The submit button's readiness and the line under it, from one source. NAME
// keeps the enabled/disabled state its own render decided — that tab's button
// is btn-fill or btn-disabled outright rather than dimmed — but it still says
// what it is waiting for, in the same words every other tab uses.
function _paintTxReady(){
  const miss = txMissing();
  const btn = document.getElementById('tx-submit');
  if(btn && S.txMode !== 'NAME') btn.classList.toggle('btn-pending', miss.length > 0);
  const note = document.getElementById('tx-ready-note');
  if(note) note.textContent = miss.length ? 'ENTER ' + miss.join(' + ') : '';
}
// Repaint the review card + submit affordance in place (no re-render, so the
// amount/recipient fields keep focus while the summary tracks each keystroke).
function updateTxReview(){
  const host = document.getElementById('tx-review');
  if(!host) return;
  const v = S.vaults[S.sel];
  if(!v) return;
  if(S.txMode === 'STAKE'){
    host.innerHTML = stakeReviewBody(v);
    const sHold = (v.holdings || []).find(h => h.token === 'ETH');
    const sAvail = sHold ? Number(sHold.raw != null ? ethers.formatUnits(sHold.raw, sHold.decimals || 18) : stripCommas(sHold.balance)) : 0;
    const sN = parseFloat(stripCommas(S.stakeAmount || '')) || 0;
    const sU = document.getElementById('stake-units');
    if(sU) sU.textContent = S.stakeAmount ? toUnits(S.stakeAmount, 18) + ' WEI' : '';
    const sW = document.getElementById('stake-amount-warn');
    if(sW) sW.textContent = (sAvail > 0 && sN > sAvail) ? 'EXCEEDS VAULT ETH BALANCE' : '';
    const sUsd = document.getElementById('stake-amount-usd');
    if(sUsd){ const r = Number(sUsd.dataset.rate) || 0; sUsd.textContent = (r > 0 && sN > 0) ? fmtUsd(sN * r) : ''; }
    _paintTxReady();
    return;
  }
  // Every tab that owns a #tx-review card has to be named here. It was not, so
  // the NAME tab painted its own review and then had it overwritten — by the
  // TRANSFER card, on the very next line — on every render: a poll tick, an
  // availability lookup landing, a keystroke echo. What a co-signer read under
  // REVIEW was a send of nothing to nobody, and the note below the button asked
  // for an amount and a recipient the tab does not have.
  if(S.txMode === 'NAME'){
    host.innerHTML = nameReviewBody(v);
    _paintTxReady();
    return;
  }
  host.innerHTML = txReviewBody(v);

  // Re-derive the field echoes too — they are wiped by each rebuild, but the
  // values behind them live in S and must survive it.
  const ct = curTok(v);
  const hold = (v.holdings || []).find(h => h.token === S.txToken);
  const availNum = hold ? Number(hold.raw != null ? ethers.formatUnits(hold.raw, hold.decimals || ct.decimals) : stripCommas(hold.balance)) : 0;
  const n = parseFloat(stripCommas(S.txAmount || '')) || 0;
  const u = document.getElementById('tx-units');
  if(u) u.textContent = S.txAmount ? toUnits(S.txAmount, ct.decimals) + ' ' + (S.txToken === 'ETH' ? 'WEI' : 'UNITS (' + ct.decimals + ' DECIMALS)') : '';
  const w = document.getElementById('tx-amount-warn');
  if(w) w.textContent = (availNum > 0 && n > availNum) ? 'EXCEEDS AVAILABLE BALANCE' : '';
  const usd = document.getElementById('tx-amount-usd');
  if(usd){ const r = Number(usd.dataset.rate) || 0; usd.textContent = (r > 0 && n > 0) ? fmtUsd(n * r) : ''; }
  const st = document.getElementById('tx-to-status');
  if(st){ const s = _addrState(S.txTo); st.textContent = s.txt; st.style.color = s.color || ''; }

  _paintTxReady();
}
// Shared address/name field feedback (returns state; writes to a status node).
function _addrState(t){
  t = (t || '').trim();
  if(!t) return { txt:'', color:'' };
  if(ethers.isAddress(t)) return { txt:'VALID ADDRESS', color:'var(--g)' };
  // Every namespace is rooted on mainnet, so this holds whichever chain the app
  // is pointed at. Timing is deliberately not promised here: the send flow now
  // resolves in the review, before anything is signed.
  if(NAME_RE.test(t)) return { txt:'NAME · RESOLVED ON MAINNET', color:'var(--a)' };
  // Right shape, wrong case: a mistyped or truncated paste, not a bad format.
  // Naming it precisely is the difference between a 2-second fix and a re-copy.
  if(/^0x[0-9a-fA-F]{40}$/.test(t)) return { txt:'BAD CHECKSUM — RE-COPY THE ADDRESS', color:'var(--r)' };
  if(/^0x[0-9a-fA-F]*$/.test(t)) return { txt:`${t.length-2}/40 HEX CHARS`, color:'var(--d)' };
  return { txt:'NOT A VALID ADDRESS OR NAME', color:'var(--r)' };
}
function _hexState(d){
  d = (d || '').trim();
  if(!d || d === '0x') return { txt:'', color:'' };
  if(!/^0x[0-9a-fA-F]*$/.test(d)) return { txt:'NOT HEX', color:'var(--r)' };
  if(d.length % 2 !== 0) return { txt:'ODD LENGTH', color:'var(--r)' };
  return { txt:'OK', color:'var(--g)' };
}
// CUSTOM target — mirrors onCxTargetChange's ABI fetch with an inline hint for
// the name / invalid cases the ABI status doesn't cover.
// A call target is signed just like a recipient is, so it gets the same
// treatment: show the address the name resolves to rather than promising to
// resolve it later, out of sight.
function _nameHint(el, raw, repaint){
  const t = (raw || '').trim();
  const pv = previewName(t, S.chainId, repaint);
  if(!pv) return false;
  if(pv.state === 'resolving'){ el.textContent = 'RESOLVING…'; el.style.color = 'var(--a)'; }
  else if(pv.state === 'err'){ el.textContent = pv.err; el.style.color = 'var(--r)'; }
  else { el.textContent = '→ ' + shortAddr(pv.addr) + (pv.alt ? ' · PUBLISHES A DIFFERENT ADDRESS FOR THIS CHAIN' : ''); el.style.color = pv.alt ? 'var(--y)' : 'var(--g)'; }
  return true;
}
function updateCxTargetStatus(val){
  const el = document.getElementById('cx-target-status');
  if(!el) return;
  const t = (val || '').trim();
  if(!t || ethers.isAddress(t)){ el.textContent = ''; return; }
  if(_nameHint(el, t, () => updateCxTargetStatus(S.cxTarget))) return;
  const s = _addrState(t);
  el.textContent = s.txt; el.style.color = s.color;
}
function onBatchTarget(i, val){
  S.batch[i].t = val;

function updateBatchTargetStatus(i){
  const el = document.getElementById('batch-t-' + i);
  if(!el) return;

  const t = (val || '').trim();
  if(ethers.isAddress(t)){ el.textContent = '✓'; el.style.color = 'var(--g)'; return; }
  if(_nameHint(el, t, () => updateBatchTargetStatus(i))) return;

}

  if(existing){ S.txToken = existing.symbol; S.showCustomTok = false; render(); return; }

// ── TOP UP (deposit into the multisig from the connected wallet) ───
// Sends ETH or an ERC-20 straight from the connected EOA to the vault address
// on the vault's own chain. Decimals are handled per-token via parseUnits.

function _amtTrim(s){ s=String(s||''); if(!s) return '0'; if(s.indexOf('.')<0) return s; s=s.replace(/0+$/,'').replace(/\.$/,''); return s||'0'; }
function _amtDisp(s){ s=_amtTrim(s); const i=s.indexOf('.'); return i<0?s:s.slice(0,i+7).replace(/\.$/,''); }

// Read the connected wallet's balance for each listed token (+ ETH) on the
// current chain. Returns a symbol -> {raw, decimals} map; never throws.
async function fetchTopUpBalances(walletAddr, toks){
  const out = {};
  const erc = toks.filter(t => t.address && t.address !== ethers.ZeroAddress);
  try {
    const mc = getMC3();
    const calls = erc.map(t => ({ target:t.address, allowFailure:true, callData: erc20Iface.encodeFunctionData('balanceOf',[walletAddr]) }));
    const res = await mc.aggregate3(calls);
    res.forEach((r,i)=>{ if(r.success){ try { const b=erc20Iface.decodeFunctionResult('balanceOf', r.returnData)[0]; out[erc[i].symbol]={ raw:b.toString(), decimals:erc[i].decimals }; } catch(_){} } });
  } catch(_){
    await Promise.all(erc.map(async t => {
      try { const c=new ethers.Contract(t.address, ERC20_ABI, provider); const b=await c.balanceOf(walletAddr); out[t.symbol]={ raw:b.toString(), decimals:t.decimals }; } catch(_){}
    }));
  }
  try { const e = await provider.getBalance(walletAddr); out['ETH']={ raw:e.toString(), decimals:18 }; } catch(_){}
  return out;
}

async function submitTopUp(){
  const v = S.vaults[S.sel]; if(!v) return;
  const t = S.topup; if(!t || t.sending) return;
  const w = requireSigner(); if(!w) return;
  const { signer } = w;
  const sel = vaultTokens(v).find(x => x.symbol === t.sym) || vaultTokens(v)[0];
  const amtStr = (document.getElementById('topup-amount')?.value || '').trim();
  if(!amtStr){ flash('ENTER AN AMOUNT'); return; }
  let amount;
  try { amount = ethers.parseUnits(stripCommas(amtStr), sel.decimals); }
  catch(_){ flash('INVALID AMOUNT'); return; }
  if(amount <= 0n){ flash('ENTER AN AMOUNT'); return; }

  t.sending = true; t.err = null; render();
  // Make sure the wallet is on the vault's chain before sending — otherwise the
  // funds would land at the same address on the wrong chain.
  if(window._connectedWalletProvider){
    let wc = null;
    try { wc = parseInt(await window._connectedWalletProvider.request({method:'eth_chainId'}), 16); } catch(_){}
    if(wc !== S.chainId){
      try { await walletSwitchChain({ chainId:S.chainId, chainHex:CHAINS[S.chainId].hex, rpc:CHAINS[S.chainId].rpcs[0], addChainParams:ADD_CHAIN_PARAMS[S.chainId]||null }); } catch(_){}
      if(!(await waitForWalletChain(S.chainId))){ t.sending=false; t.err = 'SWITCH WALLET TO ' + (CHAINS[S.chainId]?.name||'CHAIN').toUpperCase(); render(); return; }
    }
  }
  try {
    let tx;
    if(sel.symbol === 'ETH' || sel.address === ethers.ZeroAddress){
      tx = await signer.sendTransaction({ to: v.address, value: amount });
    } else {
      const erc = new ethers.Contract(sel.address, ERC20_ABI, signer);
      tx = await erc.transfer(v.address, amount);
    }
    if(S.topup){ S.topup.txHash = tx.hash; render(); }
    await tx.wait();
    flash(`TOPPED UP ${_amtDisp(amtStr)} ${sel.symbol}`);
    S.topup = null; render();
    reloadHoldings(S.sel);
  } catch(e){
    console.error('Top up:', e);
    if(S.topup){ S.topup.sending = false; S.topup.err = e.shortMessage || e.message || 'FAILED'; render(); }
  }
}
