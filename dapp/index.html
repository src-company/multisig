async function prodSubmitBatch() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;

  const calls = S.batch.filter(c => c.t.trim());
  if(!calls.length) { flash('ADD AT LEAST 1 CALL'); return; }
  for(const c of calls) {
    const cd = (c.d || '0x').trim();
    if(cd !== '0x' && !/^0x[0-9a-fA-F]*$/.test(cd)) { flash('INVALID CALLDATA — MUST BE HEX (0x...)'); return; }
    if(cd !== '0x' && cd.length % 2 !== 0) { flash('INVALID CALLDATA — ODD LENGTH'); return; }
  }

  try {
    const targets = await Promise.all(calls.map(async c => assertPreviewed(c.t, await resolveName(c.t), S.chainId)));
    const values = calls.map(c => ethers.parseEther(stripCommas(c.v || '0')));
    const datas = calls.map(c => (c.d || '0x').trim());
    // Audit L-2. A batch executes atomically, so one burnt leg is reason enough
    // to refuse the whole thing — and inside a batch that leg is the easiest
    // one for a co-signer to read past.
    for(let i = 0; i < targets.length; i++) {
      const burn = values[i] > 0n && lockedDest(targets[i]);
      if(burn) { flash(`REFUSED — CALL ${i + 1} SENDS ETH TO ${burn}, WHICH CANNOT SEND IT BACK`); return; }
    }

    const batchData = msIface.encodeFunctionData('batch', [targets, values, datas]);
    const target = v.address;
    const value = '0';

    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target, value: 0n, data: batchData, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, value, batchData, txHash, v.threshold, connectedAddress, `Batch (${calls.length} calls)`);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`BATCH TX #${nonce} CREATED`);
    S.showTx = false;
    S.batch = [{t:'',v:'',d:''},{t:'',v:'',d:''}];
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}

// ── PRODUCTION: ADMIN PROPOSALS ───────────────────────────────────

async function prodAdminPropose(action, val) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;

  let data, desc;
  try {
    switch(action) {
      case 'setThreshold': {
        if(!val || val < 1 || val > v.ownerCount) { flash('THRESHOLD MUST BE 1..' + v.ownerCount); return; }
        // Audit H-2 — at or above 1009 the signature-length check wraps and no
        // owner-signed transaction can ever execute again.
        if(val > MAX_SAFE_THRESHOLD) { flash(`REFUSED — A THRESHOLD ABOVE ${MAX_SAFE_THRESHOLD} OVERFLOWS THE SIGNATURE-LENGTH CHECK AND WOULD PERMANENTLY DISABLE OWNER-SIGNED EXECUTION`); return; }
        data = msIface.encodeFunctionData('setThreshold', [val]);
        desc = `setThreshold(${val})`;
        break;
      }
      case 'setDelay': {
        if(val > 4294967295) { flash('DELAY TOO LARGE'); return; }  // setDelay(uint32)
        // Audit M-2. setDelay takes any uint32 — up to ~136 years — and the fix
        // for a bad one is itself subject to the delay just set, because
        // setDelay is onlySelf and so routes through execute(). Units confusion
        // is the realistic path here: 3153600000 for 3153600 reads the same at
        // a glance in hex calldata. With no executor there is no bypass and no
        // cancel, so a fat finger is terminal; with one, an unanimous forward()
        // can still undo it. Gate on that difference rather than on the number.
        const noExec = !v.executor || v.executor === ethers.ZeroAddress || v.executor === '0x0000...0000';
        if(val > DELAY_SANE_MAX && noExec) {
          flash(`REFUSED — ${fmtDelay(val)} WITH NO EXECUTOR IS UNRECOVERABLE. THE PROPOSAL THAT UNDOES IT WOULD ITSELF WAIT ${fmtDelay(val)}.`);
          return;
        }
        if(val > DELAY_SANE_MAX && _delayArmed !== val) {
          clearTimeout(_delayArmTimer);
          _delayArmed = val;
          _delayArmTimer = setTimeout(() => { _delayArmed = null; }, 6000);
          flash(`${fmtDelay(val)} IS AN UNUSUALLY LONG TIMELOCK — EVERY PROPOSAL, INCLUDING ONE SHORTENING IT AGAIN, WOULD WAIT THAT LONG. PRESS AGAIN TO PROPOSE IT.`);
          return;
        }
        _delayArmed = null;
        data = msIface.encodeFunctionData('setDelay', [val]);
        desc = `setDelay(${val})`;
        break;
      }
      case 'setExecutor': {
        const addr = document.getElementById('admin-executor-input')?.value?.trim();
        if(!addr || !ethers.isAddress(addr)) { flash('INVALID ADDRESS'); return; }
        // Audit M-3. cancelQueued is onlySelf, so a cancel has to be routed
        // through execute() — where it is queued for `delay` like anything
        // else, maturing no earlier than the proposal it means to stop. The
        // executor is the only role that can act inside the window, so clearing
        // it under a live timelock does not "disable the executor": it makes
        // every queued proposal, including any already waiting, irrevocable.
        if(BigInt(addr) === 0n && v.delay > 0) {
          flash('REFUSED — REMOVING THE EXECUTOR WHILE A TIMELOCK IS SET MAKES QUEUED PROPOSALS IMPOSSIBLE TO CANCEL. SET THE DELAY TO ZERO FIRST.');
          return;
        }
        // Audit L-1. A vault pointed at itself can never be pointed anywhere
        // else again — setExecutor is onlySelf, so the only route to it is the
        // execute() that the guard hook is busy recursing through. Refuse to
        // raise the proposal at all; a co-signer should never be asked to look
        // at this one, and by the time it executes nothing can undo it.
        const risk = executorRisk(addr, v.address);
        if(risk === 'lock' || risk === 'self') {
          flash(risk === 'lock'
            ? 'REFUSED — THE VAULT AS ITS OWN EXECUTOR WOULD LOCK IT PERMANENTLY'
            : 'REFUSED — A VAULT CANNOT BE ITS OWN EXECUTOR');
          return;
        }
        if(risk === 'hook') {
          // Audit M-1. The hook is a high-level Solidity call, so solc emits an
          // extcodesize check ahead of it: a marked address holding no code
          // reverts every execute() and executeQueued(), and every route back —
          // setExecutor, batch, delegateCall — is onlySelf and therefore runs
          // through the execute() that is already reverting. An EOA here, or a
          // guard address planned but not yet deployed, is a one-way door.
          // Read the chain rather than warn: this is not a judgement call.
          let code = null;
          try { code = await provider.getCode(ethers.getAddress(addr)); } catch(_) {}
          if(code === '0x') {
            flash('REFUSED — NO CONTRACT AT THIS 0x1111 ADDRESS. THE GUARD HOOK WOULD REVERT EVERY TRANSACTION AND LOCK THE VAULT PERMANENTLY.');
            return;
          }
          if(code === null) {
            flash('CANNOT VERIFY THIS ADDRESS HAS CODE — CHAIN UNREACHABLE. NOT PROPOSING.');
            return;
          }
          // A distinct executor carrying the marker is the legitimate guardian
          // pattern, so it is allowed — but a guard that reverts stops the vault
          // dead, so it does not get raised on one click.
          if(_hookArmed !== addr.toLowerCase()) {
            clearTimeout(_hookArmTimer);
            _hookArmed = addr.toLowerCase();
            _hookArmTimer = setTimeout(() => { _hookArmed = null; }, 6000);
            flash('0x1111 GUARD HOOK — THIS EXECUTOR RUNS BEFORE EVERY TX AND CAN BLOCK THE VAULT. PRESS AGAIN TO PROPOSE IT.');
            return;
          }
        }
        _hookArmed = null;
        data = msIface.encodeFunctionData('setExecutor', [ethers.getAddress(addr)]);
        desc = `setExecutor(${addr.slice(0,10)}...)`;
        break;
      }
      case 'enableForward': {
        const newState = !v.fastPath;
        // Audit H-1. forward() and execute() verify against the same EIP-712
        // Execute digest; the only thing separating "run this now" from "queue
        // this for review" is how many signatures came with it — all owners for
        // the first, threshold for the second. On an n-of-n vault those two
        // numbers are the same, so one signature set opens both doors and
        // whoever holds it picks; the signers see one struct either way.
        // Not refused. The owners authorised the transaction, and on an n-of-n
        // vault the cancel path needs unanimity too (forward() asks for
        // threshold sigs), so the window this gives up could only ever have
        // been used by unanimous agreement — it was mistake-recovery, never a
        // defence against a compromised co-signer. What it does cost is the
        // guarantee: the timelock stops being enforced and becomes a default
        // anyone holding the signatures can waive. Worth one deliberate press.
        if(newState && fastPathVoidsTimelock(v) && _fpArmed !== v.address) {
          clearTimeout(_fpArmTimer);
          _fpArmed = v.address;
          _fpArmTimer = setTimeout(() => { _fpArmed = null; }, 6000);
          flash(`ON A ${v.threshold}-OF-${v.ownerCount} VAULT EVERY QUORUM IS ALREADY UNANIMOUS, SO THIS MAKES THE ${fmtD(v.delay)} TIMELOCK ADVISORY — THE SAME SIGNATURES CAN QUEUE OR EXECUTE, AT THE SUBMITTER'S CHOICE. PRESS AGAIN TO PROPOSE IT.`);
          return;
        }
        _fpArmed = null;
        data = tlIface.encodeFunctionData('enableForward', [newState]);
        desc = `enableForward(${newState})`;
        // For enableForward, target is the executor, not self
        const target = v.executor;
        const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
        const nonce = nextNonce(v);
        const msg = { target, value: 0n, data, nonce };
        const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
        const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);
        if(v.dbId) {
          const txId = await dbProposeTx(v.dbId, nonce, target, '0', data, txHash, v.threshold, connectedAddress, desc);
          if(txId) await dbAddSig(txId, connectedAddress, sig);
        }
        flash(`PROPOSE: ${desc}`);
        await reloadQueue(S.sel);
        return;
      }
      case 'addOwner': {
        const raw = document.getElementById('admin-add-owner')?.value?.trim();
        if(!raw) { flash('ENTER AN ADDRESS'); return; }
        const addr = await resolveName(raw);
        // Contract requires _owner > SENTINEL (address(1)); reject 0x0 / 0x1.
        if(addr === ethers.ZeroAddress || addr.toLowerCase() === SENTINEL.toLowerCase()) { flash('INVALID OWNER ADDRESS'); return; }
        const ownerList = v.loadedOwners || v.owners.map(o => o.addr);
        if(ownerList.some(o => o.toLowerCase() === addr.toLowerCase())) { flash('ALREADY AN OWNER'); return; }
        const addLabel = document.getElementById('admin-add-label')?.value?.trim() || '';
        data = msIface.encodeFunctionData('addOwner', [addr]);
        desc = `addOwner(${addr.slice(0,10)}...)`;
        // Store label so it can be applied after execution
        v._pendingLabel = { addr: addr.toLowerCase(), label: addLabel };
        break;
      }
      case 'removeOwner': {
        const idx = val;
        const ownerAddr = v.owners[idx]?.addr;
        if(!ownerAddr) { flash('INVALID OWNER'); return; }
        if(v.ownerCount <= v.threshold) { flash('LOWER THRESHOLD FIRST'); return; }
        // prevOwner is the linked-list predecessor from getOwners() order; the
        // contract requires _owners[prevOwner] == ownerAddr, so it must be exact.
        const loadedIdx = v.loadedOwners ? v.loadedOwners.findIndex(o => o.toLowerCase() === ownerAddr.toLowerCase()) : -1;
        if(loadedIdx === -1) { flash('OWNER NOT IN ON-CHAIN LIST — RELOAD VAULT'); return; }
        const prevOwner = loadedIdx === 0 ? SENTINEL : v.loadedOwners[loadedIdx - 1];
        data = msIface.encodeFunctionData('removeOwner', [prevOwner, ownerAddr]);
        desc = `removeOwner(${ownerAddr.slice(0,10)}...)`;
        break;
      }
      default: return;
    }

    // Self-call for settings changes
    const target = v.address;
    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target, value: 0n, data, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, '0', data, txHash, v.threshold, connectedAddress, desc);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`PROPOSE: ${desc}`);
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}

// ── CHAIN SWITCHING ───────────────────────────────────────────────

// Point the app's own reads at a chain, without asking the wallet for anything.
// Split out of switchChain because two callers need exactly this half and must
// not send a wallet prompt: onWalletChainChanged (the wallet is already there —
// asking it to go where it is would prompt on every manual switch) and a halted
// multichain deploy landing on the chain that did deploy (the operator has just
// declined a prompt; the reply to that is not another prompt).
function adoptChain(id) {
  if(!CHAINS[id]) return false;
  S.chainId = id;
  lsSet('ms_chain', String(id));
  provider = makeProvider(id);
  S.showChains = false;
  S.latestBlock = 0;
  S.txToken = 'ETH';
  resetCxState();
  fetchBlock();
  return true;
}

// Resolves to walletSwitchChain's result ({ ok, rejected?, unsupported?, … }) so
// callers that are about to sign something can say why the wallet never arrived.
async function switchChain(id, skipLoad) {
  if(!CHAINS[id]) return { ok:false, unknown:true };
  adoptChain(id);

  // Ask wallet to switch chain
  let res = { ok: true };
  if(window._connectedWalletProvider) {
    try {
      res = await walletSwitchChain({
        chainId: id,
        chainHex: CHAINS[id].hex,
        rpc: CHAINS[id].rpcs[0],
        addChainParams: ADD_CHAIN_PARAMS[id] || null
      }) || { ok: true };
    } catch(e) { console.error('Chain switch:', e); res = { ok:false, code:e&&e.code, error:e }; }
    // Warn if wallet rejected the switch (browsing still works, signing won't).
    // Suppressed for programmatic switches (skipLoad) — e.g. the multi-chain
    // deploy loop, which surfaces per-chain switch state in its own overlay.
    if(!skipLoad){
      // readWalletChain rather than a bare request: this is the app's most direct
      // observation of where the wallet is, and recording it keeps requireSigner
      // from refusing on a chainChanged event that never arrived.
      let landed = res.ok;
      const at = await readWalletChain();
      if(at !== null) landed = at === id;
      if(!landed) flash(res.rejected ? 'CHAIN SWITCH REJECTED — WALLET STILL ON THE OLD CHAIN'
        : res.unsupported ? `ADD ${CHAINS[id].name.toUpperCase()} TO YOUR WALLET TO SIGN ON IT`
        : 'WALLET ON DIFFERENT CHAIN — SWITCH TO SIGN');
    }
  }

  if(!S.demoMode && !skipLoad) {
    S.vaults = [];
    S.sel = 0;
    if(window._connectedAddress) showLoading('SWITCHING CHAIN');
    render();
    loadAllVaults();
  } else {
    render();
  }
  return res;
}

// The wallet moved to another chain. Follow it in place rather than reloading the
// page: a reload here is what abandoned a multichain deploy at its second chain.
window.onWalletChainChanged = function(id) {
  // Recorded unconditionally, including when it matches: this is the app's only
  // reliable answer to "where is the wallet", and a stale value would let the
  // deploy overlay name the wrong chain in an error about the wallet.
  S.walletChain = id;
  // Our own switch, echoing back — switchChain sets S.chainId before it asks the
  // wallet, so by the time the event lands the app is already there.
  if(id === S.chainId){ render(); return; }
  if(S.deploy && !S.deploy.done){
    // Mid-deploy, and not where this run put the wallet: the operator switched
    // by hand. Do not follow — the run owns the chain walk, and its per-chain
    // poll is what decides whether the wallet arrived.
    render();
    return;
  }
  if(!CHAINS[id]){
    // Nothing to point the app at, so leave it where it is and say so rather
    // than silently reading one chain while the wallet would sign on another.
    flash('WALLET SWITCHED TO AN UNSUPPORTED CHAIN — SWITCH BACK TO SIGN');
    render();
    return;
  }
  adoptChain(id);
  if(S.demoMode){ render(); return; }
  S.vaults = [];
  S.sel = 0;
  // No full-screen loader while a deploy dialog is up. This path is reachable with
  // a halted run still on screen — the operator is switching chains in the wallet
  // because that dialog told them to — and covering the RESUME button with a
  // spinner is the last thing to do at that moment.
  if(window._connectedAddress && !S.deploy) showLoading('SWITCHING CHAIN');
  render();
  loadAllVaults();
};

// The wallet switched accounts. Same reasoning as the chain: in the middle of a
// deploy the run has its own guard for this (the CREATE2 salt is bound to the
// deployer, so signing from another account reverts) and it can only fire if the
// page is still here to run it.
window.onWalletAccountsChanged = function(addr, prev) {
  if(S.deploy && !S.deploy.done){
    flash(`WALLET SWITCHED TO ${shortAddr(addr)} — THIS DEPLOY IS SIGNED BY ${shortAddr(prev || (S.deploy.ctx && S.deploy.ctx.connectedAddress) || addr)}`);
    render();
    return;
  }
  S.vaults = [];
  S.sel = 0;
  if(window._connectedAddress && !S.deploy) showLoading('SWITCHING ACCOUNT');
  render();
  loadAllVaults();
};

// ── WALLET INTEGRATION ────────────────────────────────────────────

// walletInit calls its onConnect callbacks synchronously and logs whatever they
// throw. The body below has to await, so it is kept behind a plain function that
// hands the rejection back to the same place it used to surface — an async
// callback would turn a failed render into an unhandled rejection instead.
function onWalletConnect() {
  _onWalletConnect().catch(e => console.error('onConnect error:', e));
}
async function _onWalletConnect() {
  if(S.demoMode) S.demoMode = false;
  // Wait for a link that is still being followed before touching the vault
  // list. This used to snapshot S.vaults synchronously and restore it further
  // down, which works only if the link has already landed — and in a second tab
  // it has not: the wallet is authorised there, answers without a prompt, and
  // gets here while the link is still a name and two round trips. The snapshot
  // then read an empty array, found nothing worth restoring, and loadAllVaults()
  // below replaced the screen with the operator's own vaults. Which of the two
  // the visitor ended up looking at was decided by whichever request answered
  // first, and that is the whole of the unreliability.
  if(_deepLinkPending) { try { await _deepLinkPending; } catch(_) {} }
  const deepLinked = S.vaults.length > 0 ? [...S.vaults] : null;
  S.vaults = [];
  S.sel = 0;
  // Only now is the deployer's address known, and it is what decides whether an
  // unfinished deploy belongs to this session at all.
  reconcileDeployResume().catch(e => console.error('Resume reconcile:', e));

  if(window._connectedWalletProvider) {
    try {
      const wc = await window._connectedWalletProvider.request({method:'eth_chainId'});
      const walletChain = parseInt(wc, 16);
      // A link names its chain; a wallet merely happens to be on one. Following
      // the wallet here moved a link opened from a second tab onto whatever
      // network that tab had left selected — and for a WNS name, which resolves
      // on mainnet and nowhere else, that lands the vault it just resolved on a
      // chain the name does not even exist on. The link wins: it is the only one
      // of the two that is an instruction. The mismatch is already handled where
      // it has to be — requireSigner() refuses to sign and names the chain to
      // switch to — so nothing is lost by staying put.
      // Consumed once. A later account switch comes back through here, and by
      // then the link is history, not a standing instruction.
      const claimed = _deepLinkChain; _deepLinkChain = null;
      if(!claimed && walletChain !== S.chainId && CHAINS[walletChain]) {
        S.chainId = walletChain;
        lsSet('ms_chain', String(S.chainId));
        provider = makeProvider(S.chainId);
        S.latestBlock = 0;
        fetchBlock();
      }
      S.walletChain = walletChain;
    } catch(_) {}
  }
  if(deepLinked) { S.vaults = deepLinked; S.sel = 0; }
  render();
  loadAllVaults();
}

function onWalletDisconnect() {
  // A vault opened from a link is public, and was readable before any wallet was
  // connected — disconnecting is not a reason to take it off the screen. The
  // rest of the list is there because of the wallet, so it leaves with it.
  const li = deepLinkIndex();
  S.vaults = li === -1 ? [] : [S.vaults[li]];
  S.sel = 0;
  render();
}

window.onWalletDisplayUpdate = function() {
  const hasFocused = document.querySelector(
    '.txb input:focus, .txb textarea:focus, .content input:focus, .content textarea:focus, .content select:focus'
  );
  if (!hasFocused) render();
};

// ── DEEP LINKING ──────────────────────────────────────────────────

// What became of a proposal somebody was linked to that is no longer pending.
// History is already in hand at every call site, and it distinguishes the three
// endings that matter to a co-signer who arrived a few minutes late: it ran, it
// was stopped, or it was overtaken and never ran at all.
function deepLinkOutcome(v, nonce) {
  const past = (v.history || []).find(h => h.nonce === nonce);
  const ago = past && past.age ? ` ${past.age} AGO` : '';
  if(past && past.status === 'executed') return `TX #${nonce} WAS EXECUTED${ago} — NOTHING LEFT TO SIGN`;
  if(past && past.status === 'cancelled') return `TX #${nonce} WAS CANCELLED${ago} — IT CANNOT EXECUTE`;
  if(past && past.status === 'stale') return `TX #${nonce} NEVER RAN — ANOTHER PROPOSAL TOOK ITS NONCE`;
  // Not in the last 50 terminal rows either. The vault's own nonce still says
  // whether this one is behind it, which is the part worth being sure about.
  if(typeof v.nonce === 'number' && nonce < v.nonce) return `TX #${nonce} IS NO LONGER PENDING — THE VAULT IS PAST NONCE ${nonce}`;
  return `TX #${nonce} IS NOT IN THIS VAULT'S QUEUE`;
}

// What a deep link can say, in the two spellings a vault can be named in:
//
//   #1/0xabc…             #1/0xabc…/tx/7
//   #nrd.id.wei           #nrd.id.wei/tx/7        (#1/nrd.id.wei also opens)
//
// An address carries no chain of its own — the same twenty bytes is a different
// vault, or nothing, on each of them — so the prefix in front of it is required
// and is the only thing that picks one. A name carries one implicitly: WNS is
// deployed on mainnet and nowhere else, so a named link is a mainnet link. A
// prefix in front of a name is accepted only when it agrees, because `8453/`
// in front of a name would be a link asserting two different chains at once,
// and guessing which half was meant is not this function's business.
//
// Parsing stops at "which of the two is it". The name still has to leave the
// machine to become an address, and that belongs in the loader below, where
// there is an overlay to do it under and somewhere to report a failure.
// Returns { chainId, ref, isName, nonce } or null.
function parseDeepLink(hash) {
  const m = String(hash || '').match(/^(?:(\d+)\/)?([^\/]+)(?:\/tx\/(\d+))?$/);
  if(!m) return null;
  const prefix = m[1] === undefined ? null : parseInt(m[1]);
  const ref = m[2];
  const nonce = m[3] === undefined ? null : parseInt(m[3]);
  if(/^0x[0-9a-fA-F]{40}$/.test(ref)) {
    if(prefix === null || !CHAINS[prefix]) return null;
    // Canonical spelling. A fragment is the one part of a URL that gets
    // retyped, wrapped and case-folded on its way between owners, and it
    // arrives here as whatever survived that. Every other entry point already
    // normalises — resolveName() ends in getAddress(), getOwners() decodes
    // checksummed — so this was the one route by which a vault could be read
    // under an address that did not match its own. Lowercased before
    // checksumming so a link that lost its case still opens: EIP-55 is there to
    // catch a typo, and a typo'd address is caught better downstream, where the
    // code at it is read and reported as not being a Multisig clone.
    return { chainId: prefix, ref: ethers.getAddress(ref.toLowerCase()), isName: false, nonce };
  }
  if(WNS_NAME_RE.test(ref)) {
    if(prefix !== null && prefix !== WNS_CHAIN_ID) return null;
    return { chainId: WNS_CHAIN_ID, ref: ref.toLowerCase(), isName: true, nonce };
  }
  return null;
}

function handleDeepLink() {
  const link = parseDeepLink(location.hash.slice(1));
  if(!link) return false;

  S.chainId = link.chainId;
  lsSet('ms_chain', String(S.chainId));
  provider = makeProvider(S.chainId);
  fetchBlock();
  // Sync wallet target chain so auto-reconnect uses the deep-linked chain
  walletSwitchChain({
    chainId: link.chainId,
    chainHex: CHAINS[link.chainId].hex,
    rpc: CHAINS[link.chainId].rpcs[0],
    addChainParams: ADD_CHAIN_PARAMS[link.chainId] || null
  }).catch(_=>{});

  showLoading(link.isName ? 'RESOLVING ' + link.ref.toUpperCase() : 'LOADING VAULT');
  // Staked before the first await, so onWalletConnect can wait for it instead of
  // snapshotting a vault list this has not filled yet.
  _deepLinkChain = link.chainId;
  _deepLinkPending = (async () => {
    try {
      let addr = link.ref;
      if(link.isName) {
        // resolveName() ends in getAddress() and throws a NameError that already
        // distinguishes "no such name" from "mainnet did not answer" — which is
        // the whole difference between a link that is wrong and a link that is
        // fine but arrived during an outage.
        addr = await resolveName(link.ref);
        showLoading('LOADING VAULT');
      }
      // Set after resolution rather than before: the focus banner matches rows
      // by address, and until the name has resolved there is no address to
      // match on. Nothing is painted in between — the overlay is up.
      if(link.nonce !== null){ _focusNonce = link.nonce; _focusVaultAddr = addr; _focusScroll = true; }
      _deepLinkAddr = addr;
      const vData = await loadSingleVaultData(addr);
      if(vData) {
        // Take the selection, not the whole list. With a wallet connected,
        // loadAllVaults() may already have landed the operator's own vaults —
        // and replacing the array wholesale is what made following a link cost
        // you your vault list, depending only on which request answered first.
        // Whoever lands last now, both survive and the link's vault is the one
        // on screen.
        const others = S.vaults.filter(x => x && x.address &&
          x.address.toLowerCase() !== addr.toLowerCase());
        S.vaults = [vData, ...others];
        S.sel = 0;
        S.nt = vData.threshold;
        setNd(vData.delay);
        hideLoading();
        render();
        // Look the index up again rather than trusting the 0 just written.
        // loadAllVaults() can answer at any point across these awaits, and it
        // rebuilds S.vaults wholesale — dropping this vault from its "existing"
        // set precisely when the visitor turns out to own it, which is the
        // common case for a link sent between co-signers. Loading a queue into
        // whatever ended up at index 0 filled a different vault's queue with
        // this one's proposals.
        const li = deepLinkIndex();
        if(li !== -1) {
          S.sel = li;
          await Promise.all([loadVaultQueue(li), loadVaultHistory(li)]);
          render();
          // If the linked proposal isn't in the queue, say what became of it.
          // Someone followed this link to co-sign; "may be executed or
          // cancelled" leaves them to work out which, and the answer is
          // already loaded — loadVaultHistory ran in the same breath above.
          const lv = S.vaults[deepLinkIndex()];
          if(_focusNonce !== null && lv && !lv.queue.some(t => t.nonce === _focusNonce)) {
            flash(deepLinkOutcome(lv, _focusNonce));
            _focusNonce = null; _focusVaultAddr = null; _focusScroll = false;
          }
        }
      } else {
        hideLoading();
        flash(deepLinkFailure(link, null), 4000);
      }
    } catch(e) {
      console.error('Deep link load:', e);
      hideLoading();
      flash(deepLinkFailure(link, e), 4000);
      render();
    }
  })();
  return true;
}

// Why a followed link showed nothing. Silence was survivable while a link could
// only carry an address — a wrong one is a wrong one — but a name has more ways
// to come up empty than to succeed, and they call for different responses:
// unregistered is permanent, mainnet-unreachable is not, and resolving fine but
// loading nothing means the name points at something that is not a vault.
function deepLinkFailure(link, e) {
  if(e instanceof NameError) return nameErrText(link.ref, e);
  const what = link.isName ? link.ref.toUpperCase() : shortAddr(link.ref);
  return `${what} — FAILED TO LOAD. IS THIS A MULTISIG?`;
}

// A link pasted into a tab that is already open, or followed from one page of
// the app to another. Nothing listened for this before, so the address bar
// changed and the page did not — which reads as the link being broken.
//
// Only real navigation arrives here: the canonical fragment is kept in sync with
// replaceState, and replaceState does not fire hashchange. But the fragment may
// still name what is already on screen, and reloading a vault to arrive where
// you already are throws away its queue and history to repaint the same page.
window.addEventListener('hashchange', () => {
  const link = parseDeepLink(location.hash.slice(1));
  const v = S.vaults[S.sel];
  const here = link && v && !S.demoMode && link.chainId === S.chainId && (link.isName
    ? link.ref === String(v.wnsName || '').toLowerCase()
    : link.ref.toLowerCase() === String(v.address || '').toLowerCase());
  if(here) {
    // Same vault, different proposal — a co-sign link for the queue on screen.
    // Move the focus and say what became of it, exactly as arriving fresh would,
    // but without the reload.
    _focusNonce = link.nonce; _focusVaultAddr = v.address; _focusScroll = link.nonce !== null;
    render();
    if(link.nonce !== null && !v.queue.some(t => t.nonce === link.nonce)) {
      flash(deepLinkOutcome(v, link.nonce));
      _focusNonce = null; _focusVaultAddr = null; _focusScroll = false;
      render();
    }
    return;
  }
  handleDeepLink();
});

// ── TICK (block number + ETA updates) ─────────────────────────────
async function fetchBlock() {
  try {
    // The active-chain provider is held in a global rather than fetched per
    // call, so it cannot heal itself the way makeProvider's callers do. This
    // poll runs anyway — use it to swap a wedged provider out.
    if (provider && provider._wedged) provider = makeProvider(S.chainId);
    const n = await provider.getBlockNumber();
    S.latestBlock = n;
    document.querySelectorAll("[data-block]").forEach(el => el.textContent = "BLOCK " + n.toLocaleString());
  } catch (_) {}
}
function pollTick() {
  if (document.hidden) return;
  fetchBlock();
  let anyReady = false;
  document.querySelectorAll("[data-eta]").forEach(el => {
    const eta = +el.dataset.eta;
    const f = fmtEta(eta);
    if (f) {
      if (f === "READY" && el.textContent !== "READY") anyReady = true;
      el.textContent = f === "READY"
        ? "READY"
        : new Date(eta * 1000).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
  });
  document.querySelectorAll("[data-eta-status]").forEach(el => {
    const eta = +el.dataset.etaStatus;
    const f = fmtEta(eta);
    if (f) {
      if (f === "READY" && !el.textContent.includes("READY")) anyReady = true;
      el.textContent = "\u2022 " + f;
      el.style.color = f === "READY" ? "var(--g)" : "var(--d)";
    }
  });
  document.querySelectorAll("[data-tl-eta]").forEach(el => {
    const eta = +el.dataset.tlEta, delay = +el.dataset.tlDelay;
    if (delay > 0) el.style.width = Math.round(Math.min(1, Math.max(0, (NOW() - (eta - delay)) / delay)) * 100) + "%";
  });
  const hasFocused = document.querySelector(
    '.txb input:focus, .txb textarea:focus, .content input:focus, .content textarea:focus, .content select:focus'
  );
  if (anyReady && !hasFocused) render();
}
setInterval(pollTick, 12000);
// Refresh immediately when the tab regains focus instead of waiting out the
// interval, so the block number and ETAs are current the moment the user returns.
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollTick(); });

// SLOW · OUTBOUND unlock countdowns tick every second (in-place text updates so
// the seconds are visible in the final minute). When a timer crosses zero, do a
// single focus-guarded re-render so that row drops its REVERSE button and
// relabels as no longer reversible.
function tickSlowCountdowns() {
  if (document.hidden) return;
  const els = document.querySelectorAll('[data-slow-unlock]');
  if (!els.length) return;
  const now = NOW();
  let crossed = false;
  els.forEach(el => {
    const remaining = (+el.dataset.slowUnlock) - now;
    if (remaining > 0) el.textContent = 'UNLOCKS IN ' + fmtRemaining(remaining);
    else crossed = true;
  });
  if (crossed) {
    const hasFocused = document.querySelector(
      '.txb input:focus, .txb textarea:focus, .content input:focus, .content textarea:focus, .content select:focus'
    );
    if (!hasFocused) render();
  }
}
setInterval(tickSlowCountdowns, 1000);

// ── INIT ──────────────────────────────────────────────────────────
(function init() {
  if(!CHAINS[S.chainId]) S.chainId = 1;
  provider = makeProvider(S.chainId);

  walletInit({
    appName: 'Multisig',
    chainId: S.chainId,
    chainHex: CHAINS[S.chainId].hex,
    rpc: CHAINS[S.chainId].rpcs[0],
    addChainParams: ADD_CHAIN_PARAMS[S.chainId] || null,
    onConnect: [onWalletConnect],
    onDisconnect: [onWalletDisconnect],
  });

  fetchBlock();

  // Fire and forget: it only ever reports, and reporting late is still better
  // than a proposal failing with a message about the wrong thing.
  checkSchemaFresh().catch(() => {});

  const hasDeepLink = handleDeepLink();
  render();
  if(!hasDeepLink) {
    const hasSavedWallet = !!lsGet('ms_wallet');
    if(hasSavedWallet) {
      window._onAutoReconnectFail = () => { clearTimeout(_initLoadingTimer); hideLoading(); };
      // The boot overlay is painted by the inline script above, so it never went
      // through showLoading — arm the slow-wait line by hand for the one wait
      // that is allowed to run five seconds.
      armSlowLoading();
      _initLoadingTimer = setTimeout(hideLoading, 5000);
    } else {
      _initLoadingTimer = setTimeout(hideLoading, 400);
    }
  }

  let resizeT;
  window.addEventListener("resize", () => {
    _vw = window.innerWidth;
    clearTimeout(resizeT);
    resizeT = setTimeout(render, 150);
  });
})();
</script>
