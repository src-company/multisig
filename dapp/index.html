// ── CREATE: CLONE A GNOSIS SAFE ───────────────────────────────────
// Migrating off a Safe means retyping its signer set, which is exactly the
// step where an address gets fat-fingered. So copy it: two read-only getters
// give the owners and the threshold, and the rest of this page — timelock,
// fast path, chains — stays whatever the operator chose. The Safe itself is
// never touched, and no funds move; this only fills in the form.
const netIdx = chainId => NETS.findIndex(n => n.id === chainId);
const MAX_CLONE_OWNERS = 100;   // far above any real Safe; a guard, not a limit

function openSafeClone(){
  S.safeClone = { input:'', busy:false, err:'', found:null, addr:null, label:'' };
  render();
  setTimeout(() => document.getElementById('safe-input')?.focus(), 60);
}
function closeSafeClone(){ S.safeClone = null; render(); }

// Live field hint, in the same vocabulary as every other address input.
function safeCloneInput(val){
  if(S.safeClone){ S.safeClone.input = val; S.safeClone.err = ''; }
  const el = document.getElementById('safe-status');
  if(!el) return;
  const s = _addrState(val);
  el.textContent = s.txt;
  el.style.color = s.color || '';
}

// Read a Safe at `addr` on `chainId`. Resolves `{ hit, status }`, never throws.
// The status matters as much as the hit: "there is no Safe here" and "we could
// not look" are different claims, and reporting the second as the first is how
// a modal ends up telling someone their Safe does not exist because an RPC was
// wedged. 'none' = nothing deployed or not a Safe, 'big' = an owner list too
// long to render, 'down' = the chain would not answer inside `ms`. The timeout
// matters because this fans out over every supported chain.
function readSafe(addr, chainId, ms = 8000){
  if(!CHAINS[chainId]) return Promise.resolve({ hit:null, status:'none' });
  let timer;
  const read = (async () => {
    const p = makeProvider(chainId);
    let code;
    try { code = await p.getCode(addr); }
    catch(_) { return { hit:null, status:'down' }; }
    if(!code || code === '0x') return { hit:null, status:'none' };
    const s = new ethers.Contract(addr, SAFE_ABI, p);
    let owners, threshold;
    try { [owners, threshold] = await Promise.all([s.getOwners(), s.getThreshold()]); }
    catch(e) {
      // A contract that returns nothing decodable for these two getters is not
      // a Safe. Any other failure is the chain not answering — which must not
      // be reported back as "not a Safe".
      const notSafe = e && (e.code === 'BAD_DATA' || e.code === 'CALL_EXCEPTION');
      return { hit:null, status: notSafe ? 'none' : 'down' };
    }
    if(!owners || !owners.length) return { hit:null, status:'none' };
    // Both bounds are about a contract that only claims to be a Safe: an owner
    // list long enough to hang the form, or a VERSION() long enough to wreck
    // the layout, are the two things it gets to choose here.
    if(owners.length > MAX_CLONE_OWNERS) return { hit:null, status:'big' };
    let version = null;
    try { version = String(await s.VERSION()).trim().slice(0, 16); } catch(_){}
    return { hit: { addr, chainId, owners: owners.map(a => ethers.getAddress(a)), threshold: Number(threshold), version }, status:'ok' };
  })();
  return Promise.race([read, new Promise(r => { timer = setTimeout(() => r({ hit:null, status:'down' }), ms); })])
    .finally(() => clearTimeout(timer));
}

// One click: resolve the input (address, .eth, .wei or .gwei), read the Safe on
// the chain this form deploys to, and fill the form in. Safes share an address
// across chains but not always a signer set, so when it is not on the selected
// chain we say where it is instead of dead-ending — loading one of those is an
// explicit choice that also switches the deploy target.
async function safeCloneSearch(){
  const sc = S.safeClone;
  if(!sc || sc.busy) return;
  const raw = (document.getElementById('safe-input')?.value ?? sc.input ?? '').trim();
  sc.input = raw;
  if(!raw){ sc.err = 'ENTER A SAFE ADDRESS OR NAME'; render(); return; }
  sc.busy = true; sc.err = ''; sc.found = null; render();

  let addr;
  try { addr = await resolveName(raw); }
  catch(e) {
    if(!S.safeClone) return;
    sc.busy = false;
    sc.err = NAME_RE.test(raw) ? nameErrText(raw, e) : 'NOT A VALID ADDRESS OR NAME';
    render(); return;
  }

  const chainId = NETS[S.cf.net]?.id;
  const primary = await readSafe(addr, chainId);
  if(!S.safeClone) return;                  // modal closed while reading
  if(primary.hit){ applySafe(primary.hit, raw); return; }

  const ids = Object.keys(CHAINS).map(Number).filter(id => id !== chainId);
  const scans = await Promise.all(ids.map(id => readSafe(addr, id)));
  if(!S.safeClone) return;
  const others = scans.map(s => s.hit).filter(Boolean);
  const all = [primary, ...scans];
  sc.busy = false; sc.addr = addr; sc.label = raw;
  sc.found = others.length ? others.sort((a,b) => netIdx(a.chainId) - netIdx(b.chainId)) : null;
  // Say what actually happened. A Safe too big to clone is not a missing Safe,
  // and a chain that never answered is not a chain without one.
  if(others.length) sc.err = '';
  else if(all.some(s => s.status === 'big')) sc.err = `THAT SAFE HAS MORE THAN ${MAX_CLONE_OWNERS} OWNERS — TOO MANY TO CLONE`;
  else if(all.some(s => s.status === 'down')) sc.err = `NO SAFE AT ${shortAddr(addr)} ON THE CHAINS THAT ANSWERED — SOME COULD NOT BE READ`;
  else sc.err = `NO SAFE AT ${shortAddr(addr)} ON ANY SUPPORTED CHAIN`;
  render();
}

// Load a Safe that was found on a chain other than the selected one.
function applyFoundSafe(chainId){
  const sc = S.safeClone;
  const hit = (sc?.found || []).find(f => f.chainId === chainId);
  if(hit) applySafe(hit, sc.label);
}

// Fill the form from a Safe, keeping enough of the previous state to undo.
async function applySafe(src, typed){
  const c = S.cf;
  // The modal instance this clone belongs to. Reverse-resolving the signer
  // names takes a round trip, and closing the modal in the middle of it has to
  // mean cancelled — otherwise dismissing the dialog still rewrites the form.
  const token = S.safeClone;
  if(token){ token.busy = true; render(); }
  // Owner labels come free: whatever .wei / .gwei / ENS name each signer holds.
  let names = {};
  try { names = await resolveOwnerNames(src.owners); } catch(_){}
  if(S.safeClone !== token) return;
  const you = (window._connectedAddress || '').toLowerCase();
  c.safeSrc = {
    addr: src.addr, chainId: src.chainId, version: src.version,
    ownerCount: src.owners.length, threshold: src.threshold,
    // Snapshot everything this function touches — the chain picks included,
    // since loading a Safe found elsewhere moves the deploy target too.
    prev: { owners: c.owners.map(o => ({ ...o })), threshold: c.threshold, name: c.name, net: c.net, clone: (c.clone || []).slice() },
  };
  c.owners = src.owners.map(a => ({ addr: a, label: a.toLowerCase() === you ? 'YOU' : (names[a.toLowerCase()] || '') }));
  c.threshold = String(Math.min(Math.max(src.threshold || 1, 1), c.owners.length));
  const ni = netIdx(src.chainId);
  if(ni >= 0){ c.net = ni; c.clone = (c.clone || []).filter(x => x !== ni); }
  // Name the vault after whatever the operator searched for, but never
  // overwrite a name they typed themselves.
  if(!String(c.name || '').trim()) c.name = (NAME_RE.test(typed || '') ? typed.trim() : 'SAFE ' + src.addr.slice(2, 6)).toUpperCase();
  S.safeClone = null;
  flash(`CLONED ${c.owners.length} OWNERS · ${c.threshold} OF ${c.owners.length}`);
  render();
}

function undoSafeClone(){
  const c = S.cf, s = c.safeSrc;
  if(!s) return;
  if(s.prev){
    c.owners = s.prev.owners?.length ? s.prev.owners : [{ addr:'', label:'' }];
    c.threshold = s.prev.threshold;
    c.name = s.prev.name;
    if(typeof s.prev.net === 'number') c.net = s.prev.net;
    if(Array.isArray(s.prev.clone)) c.clone = s.prev.clone.slice();
  }
  c.safeSrc = null;
  flash('CLONE UNDONE');
  render();
}

// Demo: simulate the sequential multi-chain deploy so the flow/overlay is visible.
async function demoDeploy() {
  const c = S.cf, net = NETS[c.net];
  const valid = c.owners.filter(o => o.addr.trim());
  if (!valid.length) { flash("ADD AT LEAST 1 OWNER"); return; }
  if (parseInt(c.threshold) > valid.length) { flash("THRESHOLD > OWNER COUNT"); return; }

    st.status='deploying'; render(); await new Promise(r=>setTimeout(r,600));

    executor: TIMELOCK_EXECUTOR, holdings: [], owners, queue: [], history: [], fastPath: fp,

  render();
}

function doAdminPropose(action, val) {

// ── PRODUCTION: NAME RESOLUTION ───────────────────────────────────
// All three namespaces are rooted on Ethereum mainnet, so every lookup goes
// through this dedicated mainnet provider rather than the active `provider` — a
// name means the same thing whether the app is pointed at Base, Arbitrum or a
// testnet. The consequence is that resolution is a *foreign* network call from
// every chain but one, which is why it is bounded by a timeout and why its
// failures are classified instead of collapsed into "not found".
// Fetched fresh on every use rather than held in a const: makeProvider
// rebuilds a wedged provider, and a captured instance would never see it.
function mainnetRpc() { return makeProvider(1); }
const NAME_TIMEOUT_MS = 12000;

class NameError extends Error {
  constructor(kind, msg){ super(msg); this.nameKind = kind; this.shortMessage = msg; }
}
// 'notfound'    — mainnet answered, the name has no address
// 'offchain'    — an ENS name whose CCIP-read gateway could not be reached
// 'unreachable' — mainnet itself did not answer
// 'invalid'     — not an address and not a name we resolve
function _nameKind(e){
  if(e && e.nameKind) return e.nameKind;
  if(e && e.code === 'OFFCHAIN_FAULT') return 'offchain';
  if(e && (e.code === 'NETWORK_ERROR' || e.code === 'SERVER_ERROR' || e.code === 'TIMEOUT' || e.code === 'UNKNOWN_ERROR')) return 'unreachable';
  return 'notfound';
}
// A wedged mainnet RPC must not hang a deploy or a send happening on another
// chain entirely, so every mainnet name call is bounded.
function _nameRace(p){
  let t;
  return Promise.race([
    p, new Promise((_, rej) => { t = setTimeout(() => rej(new NameError('unreachable', 'MAINNET DID NOT ANSWER')), NAME_TIMEOUT_MS); })
  ]).finally(() => clearTimeout(t));
}
// One vocabulary for every "that name did not resolve" message in the app.
// Telling someone on Arbitrum that their name does not exist, when what
// happened is that mainnet timed out, is the failure this exists to prevent.
function nameErrText(raw, e){
  const r = String(raw || '').toUpperCase();
  switch(_nameKind(e)){
    case 'offchain':    return `${r} RESOLVES OFFCHAIN — ITS GATEWAY IS BLOCKED OR DOWN`;
    case 'unreachable': return 'CANNOT REACH ETHEREUM MAINNET TO RESOLVE NAMES';
    case 'invalid':     return 'ENTER A VALID ADDRESS OR NAME';
    default:            return `${r} DOES NOT RESOLVE`;
  }
}

// ethers reports an unreachable provider as "no resolver" — resolveName returns
// null rather than throwing — so a blank answer is ambiguous: the name may not
// exist, or mainnet may not be answering. One cheap probe settles it, and it
// only runs on the failure path. This is the difference between telling an
// Arbitrum user their name is wrong and telling them mainnet is down.
async function _nameFailure(v, e){
  let kind = _nameKind(e);
  if(kind === 'notfound'){
    // The probe has to actually leave the machine. getBlockNumber is answered
    // from the FallbackProvider's cached height, and getCode of a fixed address
    // is served from ethers' result cache — both report healthy while every
    // backend is down. Reading an address nobody has ever touched, different on
    // each probe, is the cheapest call that cannot come from a cache.
    const probe = '0x' + String(Date.now()).padStart(40, '0').slice(-40);
    try { await _nameRace(mainnetRpc().getCode(probe)); }
    catch(_) { kind = 'unreachable'; }
  }
  return new NameError(kind, nameErrText(v, { nameKind: kind }));
}

async function resolveName(input) {
  const v = input.trim();
  if(!v) throw new NameError('invalid', 'ENTER AN ADDRESS OR NAME');
  if(ethers.isAddress(v)) return ethers.getAddress(v);
  // .wei / .gwei — same contract shape, picked by suffix. Each hashes its own
  // suffix away and ignores case, but neither knows the other's: handing a
  // .gwei name to WNS hashes to an unrelated id that may well be registered.
  // So the service is chosen by suffix before a single call is made.
  const svc = nsFor(v);
  if(svc) {
    const ns = new ethers.Contract(svc.addr, WEINS_ABI, mainnetRpc());
    let addr;
    try {
      const tokenId = await _nameRace(ns.computeId(v));
      // resolve() = explicit recipient if set, else owner; 0 if inactive/expired.
      addr = await _nameRace(ns.resolve(tokenId));
    } catch(e) { throw await _nameFailure(v, e); }
    // The call itself succeeded here, so a zero really is an unregistered or
    // expired name — no liveness probe needed.
    if(!addr || addr === ethers.ZeroAddress) throw new NameError('notfound', nameErrText(v, { nameKind:'notfound' }));
    return ethers.getAddress(addr);
  }
  // Case-insensitive to match the field hints: ENS normalizes the name itself,
  // and both name contracts hash case-insensitively, so TYPED.ETH resolves.
  if(/\.eth$/i.test(v)) {
    let addr;
    try { addr = await _nameRace(mainnetRpc().resolveName(v)); }
    catch(e) { throw await _nameFailure(v, e); }
    if(!addr) throw await _nameFailure(v, null);
    return ethers.getAddress(addr);
  }
  throw new NameError('invalid', 'ENTER AN ADDRESS, .eth, .wei OR .gwei NAME');
}

// ── NAME PREVIEW (what you review is what you sign) ───────────────
// A signer approving a send to "alice.eth" has to see the address that send
// will actually carry. Punting it to the wallet prompt does not work here: in
// a multisig the co-signers never see that prompt — they see the queued
// proposal, already resolved, and vote on it. So names are resolved in the
// review card, before anything is signed.
//
// Resolution is async and the review repaints on every keystroke, so each
// result is cached per (name, chain) and the card is repainted when one lands.
const _namePreview = {};
function _pvKey(raw, chainId){ return String(raw || '').trim().toLowerCase() + '@' + chainId; }

// ENSIP-11: a name may publish a different address for a specific chain. Worth
// surfacing — sending to the mainnet address of a wallet that lives elsewhere
// on this chain is unrecoverable — but not worth silently obeying: distinct L2
// records are vanishingly rare (none of ENS's own, Base's or Coinbase's names
// publish one), and quietly disagreeing with every other tool about where funds
// go is its own hazard. So it warns; it never redirects. Never throws.
async function altChainAddress(name, chainId, mainAddr){
  if(!chainId || chainId === 1 || !/\.eth$/i.test(name)) return null;
  try {
    const r = await _nameRace(mainnetRpc().getResolver(name));
    if(!r) return null;
    const a = await _nameRace(r.getAddress(0x80000000 + chainId));
    if(!a || !ethers.isAddress(a)) return null;
    const addr = ethers.getAddress(a);
    return addr.toLowerCase() === String(mainAddr).toLowerCase() ? null : addr;
  } catch(_) { return null; }
}

// Kick off (or reuse) resolution of `raw` for display. Returns the entry
// synchronously so the renderer can show 'resolving' immediately.
function previewName(raw, chainId, onSettle){
  const key = String(raw || '').trim();
  if(!key || !NAME_RE.test(key)) return null;
  const ck = _pvKey(key, chainId);
  if(_namePreview[ck]) return _namePreview[ck];
  const entry = _namePreview[ck] = { state:'resolving', addr:null, alt:null, err:'' };
  (async () => {
    try {
      entry.addr = await resolveName(key);
      entry.state = 'ok';
      entry.alt = await altChainAddress(key, chainId, entry.addr);
    } catch(e) {
      entry.state = 'err';
      entry.err = e.shortMessage || e.message || 'DOES NOT RESOLVE';
    }
    try { onSettle && onSettle(entry); } catch(_) {}
  })();
  return entry;
}

// What was reviewed is what gets signed. Names are mutable, and the gap between
// reviewing a proposal and signing it is exactly where a repoint would land.
function assertPreviewed(raw, resolved, chainId){
  const p = _namePreview[_pvKey(raw, chainId)];
  if(p && p.state === 'ok' && p.addr && p.addr.toLowerCase() !== String(resolved).toLowerCase())
    throw new Error(`${String(raw).toUpperCase()} NOW RESOLVES ELSEWHERE — REVIEW IT AGAIN`);
  return resolved;
}

// Reverse-resolve owner addresses to human-readable names. Primary: WNS (.wei)
// and GNS (.gwei) reverse resolution, both batched into ONE Multicall3 call on
// mainnet, .wei preferred when an address holds a name in both.
// Fallback: ENS reverse for any still-unnamed owners (best-effort, parallel).
// Returns a lowercased-address → name map; never throws.
const _ownerNameCache = {};
async function resolveOwnerNames(addrs) {
  const out = {};
  if(!addrs || !addrs.length) return out;
  const need = [];
  for(const a of addrs) {
    const k = String(a).toLowerCase();
    if(_ownerNameCache[k] !== undefined) { if(_ownerNameCache[k]) out[k] = _ownerNameCache[k]; }
    // Anything that is not an address is skipped rather than encoded: one bad
    // entry would otherwise throw and cost every other owner its name.
    else if(ethers.isAddress(a)) need.push(a);
  }
  if(!need.length) return out;
  // A lookup that never completed must not be remembered as "this address has
  // no name" — mainnet is a foreign network from every other chain, and one
  // rate-limited burst would otherwise blank the signer list for the rest of
  // the session. Only addresses mainnet actually answered for get cached.
  const answered = new Set();
  // 1) Batched .wei + .gwei reverse resolution in a single Multicall3 on
  // mainnet. Services are walked in NAME_SERVICES order and the first name
  // found wins, so .wei takes precedence over .gwei for the same address.
  const claimed = {};
  try {
    const mc = new ethers.Contract(MC3, MC3_ABI, mainnetRpc());
    const calls = [];
    for(const svc of NAME_SERVICES) {
      for(const a of need) calls.push({ target: svc.addr, allowFailure: true, callData: weinsIface.encodeFunctionData('reverseResolve', [a]) });
    }
    const res = await mc.aggregate3(calls);
    res.forEach((r, n) => {
      const k = need[n % need.length].toLowerCase();
      answered.add(k);
      if(!r.success || claimed[k]) return;   // failed, or a preferred service already named it
      try {
        const nm = weinsIface.decodeFunctionResult('reverseResolve', r.returnData)[0];
        if(nm) claimed[k] = { name: nm.toLowerCase(), svc: NAME_SERVICES[Math.floor(n / need.length)] };
      } catch(_) {}
    });
  } catch(e) { console.error('wei/gwei reverse resolve:', e); }
  // 1b) A reverse record is a string the address chose, not proof of anything:
  // the name can be repointed with setAddr or sold on afterwards, and the stale
  // record survives. ENS reverse is forward-verified for us by ethers, so do
  // the same here — resolve each claimed name and keep only the ones that come
  // back to the address claiming them. One extra batched call, and a displayed
  // name means what a signer would assume it means.
  const claims = Object.entries(claimed);
  if(claims.length) {
    try {
      const mc = new ethers.Contract(MC3, MC3_ABI, mainnetRpc());
      // computeId is pure but still a call, so batch it too rather than firing
      // one per owner: a cloned Safe can bring a hundred of them.
      const idRes = await mc.aggregate3(claims.map(([, c]) =>
        ({ target: c.svc.addr, allowFailure: true, callData: weinsIface.encodeFunctionData('computeId', [c.name]) })));
      const fwdCalls = [];
      const fwdOf = [];
      idRes.forEach((r, i) => {
        if(!r.success) return;
        try {
          const id = weinsIface.decodeFunctionResult('computeId', r.returnData)[0];
          fwdOf.push(i);
          fwdCalls.push({ target: claims[i][1].svc.addr, allowFailure: true, callData: weinsIface.encodeFunctionData('resolve', [id]) });
        } catch(_) {}
      });
      const fwd = fwdCalls.length ? await mc.aggregate3(fwdCalls) : [];
      fwd.forEach((r, n) => {
        if(!r.success) return;
        try {
          const back = weinsIface.decodeFunctionResult('resolve', r.returnData)[0];
          const [k, c] = claims[fwdOf[n]];
          if(String(back).toLowerCase() === k) out[k] = c.name;
        } catch(_) {}
      });
    } catch(e) {
      // Could not verify: show nothing rather than an unverified name, and do
      // not remember the blank — these addresses go back in the queue.
      console.error('wei/gwei forward verify:', e);
      for(const [k] of claims) answered.delete(k);
    }
  }
  // 2) ENS fallback for owners without a verified .wei / .gwei name. Capped
  // concurrency: lookupAddress is several round trips each, and a cloned Safe
  // can arrive with a hundred owners at once.
  const unnamed = need.filter(a => !out[a.toLowerCase()]);
  if(unnamed.length) {
    const queue = unnamed.slice();
    await Promise.all(Array.from({ length: Math.min(6, queue.length) }, async () => {
      while(queue.length) {
        const a = queue.shift();
        // lookupAddress forward-verifies the ENS name before returning it.
        try { const nm = await mainnetRpc().lookupAddress(a); if(nm) out[a.toLowerCase()] = String(nm).toLowerCase(); answered.add(a.toLowerCase()); }
        catch(_) {}
      }
    }));
  }
  // Cache both hits and confirmed misses; leave unanswered addresses uncached
  // so a later call can try again.
  for(const a of need) {
    const k = a.toLowerCase();
    if(out[k]) _ownerNameCache[k] = out[k];
    else if(answered.has(k)) _ownerNameCache[k] = null;
  }
  return out;
}

// ── PRODUCTION: MULTICALL ─────────────────────────────────────────

async function multicallLoad(addr) {
  try {
    const mc = getMC3();
    const encode = fn => ({ target: addr, allowFailure: false, callData: msIface.encodeFunctionData(fn) });
    const fns = ['threshold','delay','nonce','executor','ownerCount','getOwners'];
    const [results, balance] = await Promise.all([mc.aggregate3(fns.map(encode)), provider.getBalance(addr)]);
    const d = (fn, i) => msIface.decodeFunctionResult(fn, results[i].returnData)[0];
    return { threshold:d('threshold',0), delay:d('delay',1), nonce:d('nonce',2), executor:d('executor',3), ownerCount:d('ownerCount',4), owners:d('getOwners',5), balance };
  } catch(e) {
    // Fallback for chains without Multicall3
    const ms = new ethers.Contract(addr, MULTISIG_ABI, provider);
    const [threshold, delay, nonce, executor, ownerCount, owners, balance] = await Promise.all([
      ms.threshold(), ms.delay(), ms.nonce(), ms.executor(), ms.ownerCount(), ms.getOwners(), provider.getBalance(addr)
    ]);
    return { threshold, delay, nonce, executor, ownerCount, owners, balance };
  }
}

async function loadTokenBalances(walletAddr, ethBalance) {
  const base = PROD_TOKENS[S.chainId] || ETH_ONLY;
  const seen = new Set(base.map(t => t.address.toLowerCase()));
  const custom = customTokensFor(S.chainId, walletAddr).filter(t => t.address && !seen.has(t.address.toLowerCase()));
  const allTokens = [...base, ...custom];
  const erc20Tokens = allTokens.filter(t => t.address !== ethers.ZeroAddress);

  const feeds = CHAINLINK_FEEDS[S.chainId] || {};
  const feedSymbols = Object.keys(feeds);
  const latestAnswerData = clIface.encodeFunctionData('latestAnswer');
  let balances, prices = {};

  try {
    const mc = getMC3();
    const balCalls = erc20Tokens.map(t => ({
      target: t.address, allowFailure: true,
      callData: erc20Iface.encodeFunctionData('balanceOf', [walletAddr])
    }));
    const priceCalls = feedSymbols.map(sym => ({
      target: feeds[sym], allowFailure: true,
      callData: latestAnswerData
    }));
    const results = await mc.aggregate3([...balCalls, ...priceCalls]);

    balances = results.slice(0, balCalls.length).map(r => ({
      success: r.success,
      bal: r.success ? erc20Iface.decodeFunctionResult('balanceOf', r.returnData)[0] : 0n
    }));
    results.slice(balCalls.length).forEach((r, i) => {
      if(r.success) {
        const answer = clIface.decodeFunctionResult('latestAnswer', r.returnData)[0];
        prices[feedSymbols[i]] = Number(answer) / 1e8;
      }
    });
  } catch(e) {
    console.error('Token balances:', e);
    balances = [];
  }

  if(ethBalance == null) ethBalance = await provider.getBalance(walletAddr);
  const ethPrice = prices['ETH'] || 0;
  const stableSymbols = new Set(['USDC', 'USDT', 'USDT0', 'DAI']);
  const holdings = [];

  // ETH
  if(ethBalance > 0n) {
    const ethAmount = Number(ethers.formatEther(ethBalance));
    const ethUsd = ethPrice > 0 ? ethAmount * ethPrice : 0;
    holdings.push({token:'ETH', balance:ethers.formatEther(ethBalance).slice(0,10), usd: ethUsd > 0 ? `$${ethUsd.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}` : '', raw: ethBalance.toString(), decimals: 18});
  }

  // ERC20s
  erc20Tokens.forEach((t, i) => {
    if(!balances[i] || !balances[i].success || balances[i].bal === 0n) return;
    const formatted = ethers.formatUnits(balances[i].bal, t.decimals);
    const amount = Number(formatted);
    const display = t.decimals <= 8 ? amount.toFixed(2) : amount.toFixed(4).replace(/\.?0+$/, '');
    let usd = 0;
    if(stableSymbols.has(t.symbol)) {
      usd = amount;
    } else if(prices[t.symbol]) {
      usd = amount * prices[t.symbol];
    }
    holdings.push({token:t.symbol, balance:display, usd: usd > 0 ? `$${usd.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}` : '', raw: balances[i].bal.toString(), decimals: t.decimals});
  });

  return holdings;
}

// Build a user-facing error for a failed critical write. `label` is shown in
// the flash; the underlying PostgREST error is attached for the console.
function dbError(label, err) {
  const detail = err && (err.message || err.status);
  return Object.assign(new Error(label), { shortMessage: label, dbDetail: detail });
}

async function dbProposeTx(wId, nonce, target, value, callData, txHash, thresh, proposedBy, desc) {
  const { data, error } = await sb.rpc('propose_tx', {
    p_wallet_id: wId, p_chain_id: S.chainId, p_nonce: nonce,
    p_target: target, p_value: value.toString(), p_call_data: callData,
    p_tx_hash: txHash, p_threshold: thresh, p_proposed_by: proposedBy,
    p_description: desc
  });
  if(error) { console.error('DB propose:', error); throw dbError('PROPOSAL NOT SAVED', error); }
  // A null id with no error means the row exists but under a different hash at
  // this nonce (nonce collision) — the caller's signature would be dropped
  // silently, so treat it as a hard failure the user can act on.
  if(!data) throw dbError('PROPOSAL NOT SAVED — NONCE IN USE', null);
  return data;
}

}

// Batch variant: fetch signatures for many txs in ONE request instead of
// N per-tx round-trips. Returns a Map of tx_id → sorted signatures.
async function dbGetSigsByTxIds(txIds) {
  const map = new Map();
  if(!txIds.length) return map;
  txIds.forEach(id => map.set(id, []));
  const { data } = await sb.from('signatures')
    .select('tx_id, signer, signature, sig_type')
    .in('tx_id', txIds)
    .order('signer', { ascending: true });
  (data || []).forEach(s => {
    const arr = map.get(s.tx_id);
    if(arr) arr.push({ signer: s.signer, signature: s.signature, sig_type: s.sig_type });
  });
  return map;
}

async function loadAllVaults() {
  if(S.demoMode) return;
  const addr = window._connectedAddress;
  if(!addr) return;
  const hadVaults = S.vaults.length > 0;
  if(!hadVaults) showLoading('LOADING VAULTS');
  try {
    const wallets = await dbMyWallets(addr);
    // Preserve vaults loaded via deep link that aren't in the user's DB set
    const existing = S.vaults.filter(v => v.address && !wallets.some(w => w.address.toLowerCase() === v.address.toLowerCase()));
    if(!wallets.length) {
      S.vaults = existing;
      S.sel = 0;
      hideLoading();
      render();
      return;
    }
    const results = await Promise.allSettled(wallets.map(w => loadSingleVaultData(w.address, { id: w.id, name: w.name })));
    const vaults = results.filter(r => r.status === 'fulfilled' && r.value).map(r => r.value);
    results.filter(r => r.status === 'rejected').forEach(r => console.error('Load vault:', r.reason));
    S.vaults = [...existing, ...vaults];
    S.sel = 0;
    if(vaults.length) {
      S.nt = vaults[0].threshold;
      setNd(vaults[0].delay);
    }
    hideLoading();
    render();
    // Load queues + history in background (single render after all complete)
    const snapshotVaults = S.vaults;
    Promise.all(S.vaults.map((_, i) => Promise.allSettled([loadVaultQueue(i), loadVaultHistory(i)])))
      .then(() => { if (S.vaults === snapshotVaults) render(); })
      .catch(e => { console.error('Background queue load:', e); if (S.vaults === snapshotVaults) render(); });
  } catch(e) {
    console.error('loadAllVaults:', e);
    hideLoading();
    flash('FAILED TO LOAD');
  }
}

async function loadSingleVaultData(addr, dbWallet) {
  // Phase 1: RPC + DB lookup in parallel
  const [s, dbWFromQuery] = await Promise.all([
    multicallLoad(addr),
    dbWallet ? Promise.resolve(null) : dbFindWallet(addr)
  ]);
  let dbW = dbWallet || dbWFromQuery;

  // Auto-register vault in DB if not found (e.g. loaded by address)
  if(!dbW && window._connectedAddress) {
    try {
      const ownerList = [...s.owners];
      const dbId = await dbRegisterWallet(addr, window._connectedAddress, 0, ownerList, Number(s.threshold), Number(s.delay), s.executor, 0, '', null, null, Number(s.nonce));
      if(dbId) dbW = { id: dbId, name: null };
    } catch(e) { console.error('Auto-register vault:', e); }
  }

  // Phase 2: owner labels + executor check + token balances + owner names in parallel
  const [labelsRaw, fpResult, holdings, ownerNames] = await Promise.all([
    dbW?.id ? dbGetOwnerLabels(dbW.id) : Promise.resolve([]),
    s.executor !== ethers.ZeroAddress ? (async () => {
      try {
        const tlContract = new ethers.Contract(s.executor, TIMELOCK_EXECUTOR_ABI, provider);
        return { isTE: true, fpEnabled: await tlContract.forwardEnabled(addr) };
      } catch(_) { return { isTE: false, fpEnabled: false }; }
    })() : Promise.resolve({ isTE: false, fpEnabled: false }),
    loadTokenBalances(addr, s.balance),
    resolveOwnerNames([...s.owners])
  ]);

  const ownerLabels = {};
  labelsRaw.forEach(l => { if(l.label) ownerLabels[l.address.toLowerCase()] = l.label; });
  const you = window._connectedAddress;
  const owners = [...s.owners].map(o => ({
    addr: o,
    label: ownerLabels[o.toLowerCase()] || (o.toLowerCase() === you?.toLowerCase() ? 'YOU' : ''),
    name: ownerNames[o.toLowerCase()] || null,
    you: o.toLowerCase() === you?.toLowerCase()
  }));
  const { isTE, fpEnabled } = fpResult;

  return {
    id: dbW?.id || addr.slice(0,8),
    name: dbW?.name || (CHAINS[S.chainId]?.name || 'VAULT').toUpperCase() + '_' + addr.slice(2,6).toUpperCase(),
    chain: (CHAINS[S.chainId]?.name || 'Ethereum').toUpperCase(),
    address: addr,
    threshold: Number(s.threshold),
    ownerCount: Number(s.ownerCount),
    delay: Number(s.delay),
    nonce: Number(s.nonce),
    executor: s.executor,
    holdings: holdings,
    owners: owners,
    queue: [],
    history: [],
    dbId: dbW?.id || null,
    fastPath: fpEnabled,
    loadedOwners: [...s.owners],
    isTimelockExecutor: isTE
  };
}

async function loadVaultQueue(vi) {
  const v = S.vaults[vi];
  if(!v || !v.dbId) return;
  try {
    const txs = await dbGetPending(v.dbId);
    const you = window._connectedAddress;
    const queue = [];

    // Fetch sigs (one batched request) + verify on-chain queue state in parallel
    const queuedTxs = txs.filter(t => t.status === 'queued' && t.tx_hash);
    const [sigMap, onchainQueued] = await Promise.all([
      dbGetSigsByTxIds(txs.map(t => t.id)),
      (async () => {
        const result = {};
        if(!queuedTxs.length) return result;
        try {
          const mc = getMC3();
          const calls = queuedTxs.map(t => ({
            target: v.address, allowFailure: true,
            callData: msIface.encodeFunctionData('queued', [t.tx_hash])
          }));
          const results = await mc.aggregate3(calls);
          queuedTxs.forEach((t, i) => {
            if(results[i].success) {
              result[t.tx_hash] = Number(msIface.decodeFunctionResult('queued', results[i].returnData)[0]);
            }
          });
        } catch(e) { console.error('Queue verification:', e); }
        return result;
      })()
    ]);

    // Track stale txs to clean up in DB
    const staleTxIds = [];

    // Build accelerate/cancel/reject sig counts: map original nonce → set of signers
    const accelSigs = {}, cancelSigs = {}, rejectSigs = {};
    for(let ti = 0; ti < txs.length; ti++) {
      const t = txs[ti];
      if(t.description && t.description.startsWith('Accelerate #')) {
        const origNonce = parseInt(t.description.replace('Accelerate #', ''));
        if(!isNaN(origNonce)) {
          accelSigs[origNonce] = new Set((sigMap.get(t.id) || []).map(s => s.signer.toLowerCase()));
        }
      } else if(t.description && t.description.startsWith('Cancel #')) {
        const origNonce = parseInt(t.description.replace('Cancel #', ''));
        if(!isNaN(origNonce)) {
          cancelSigs[origNonce] = new Set((sigMap.get(t.id) || []).map(s => s.signer.toLowerCase()));
        }
      } else if(t.description && t.description.startsWith('Reject #')) {
        const origNonce = parseInt(t.description.replace('Reject #', ''));
        if(!isNaN(origNonce)) {
          rejectSigs[origNonce] = new Set((sigMap.get(t.id) || []).map(s => s.signer.toLowerCase()));
        }
      }
    }

    for(let ti = 0; ti < txs.length; ti++) {
      const t = txs[ti];

      // Prune proposed txs whose nonce is behind on-chain nonce (already consumed)
      if(t.status === 'proposed' && t.nonce < v.nonce) {
        staleTxIds.push(t.id);
        continue;
      }

      // Skip accelerate/cancel/reject companions — they aggregate sigs separately
      if(t.description && (t.description.startsWith('Accelerate #') || t.description.startsWith('Cancel #') || t.description.startsWith('Reject #'))) continue;

      // Prune queued txs that are no longer queued on-chain (executed or cancelled externally)
      if(t.status === 'queued' && t.tx_hash && t.tx_hash in onchainQueued) {
        if(onchainQueued[t.tx_hash] === 0) {
          staleTxIds.push(t.id);
          continue;
        }
        // Update ETA if on-chain differs from DB
        if(onchainQueued[t.tx_hash] !== (t.eta || 0)) {
          t.eta = onchainQueued[t.tx_hash];
        }
      }

      const sigs = sigMap.get(t.id) || [];
      // Verify each stored sig against THIS tx's digest before counting it as
      // an approval. add_signature runs as anon with ON CONFLICT DO UPDATE, so
      // anyone can overwrite a stored sig with garbage. Verifying here means a
      // corrupted sig shows its owner as un-signed (prompting a re-sign, which
      // repairs the row) rather than a false "approved" that fails at execute
      // time. approval/sender sigs are trusted — the contract validates those.
      const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);
      const sigDomain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
      const sigMsg = { target: t.target, value: t.value ? BigInt(t.value) : 0n, data: t.call_data || '0x', nonce: t.nonce };
      const validSigs = verifySigs(sigs, sigDomain, EIP712_TYPES, sigMsg, ownerAddrs);
      const approvals = {};
      v.owners.forEach(o => approvals[o.addr] = false);
      const addrKey = {};
      v.owners.forEach(o => addrKey[o.addr.toLowerCase()] = o.addr);
      validSigs.forEach(s => { const k = addrKey[s.signer.toLowerCase()]; if(k) approvals[k] = true; });

      const dataLabel = selectorToLabel(t.call_data);

      const ethVal = t.value && t.value !== '0' ? ethers.formatEther(BigInt(t.value)) : '0';
      const value = ethVal === '0' ? '0' : ethVal;
      const token = (t.call_data === '0x' || !t.call_data) && ethVal !== '0' ? 'ETH' : '';
      let displayValue = value, displayToken = token, displayTo = null, slowDelay = 0;
      // Flag a stake from the call shape, so proposals raised outside this UI
      // are labelled the same way.
      const isStake = S.chainId === STAKE_CHAIN_ID && ethVal !== '0' && isStakeCall(t.target, t.call_data);
      // Decode a SLOW deposit so the queue shows the asset and the real
      // recipient rather than "0 → the SLOW contract".
      if(dataLabel === 'SLOW TRANSFER' && t.call_data && t.call_data.length >= 10) {
        try {
          const [tk, to, amt, delay] = slowIface.decodeFunctionData('depositTo', t.call_data);
          const isEth = tk === ethers.ZeroAddress;
          const info = isEth ? { symbol:'ETH', decimals:18 }
            : (PROD_TOKENS[S.chainId] || ETH_ONLY).find(x => x.address.toLowerCase() === tk.toLowerCase())
              || customTokensFor(S.chainId, v.address).find(x => x.address.toLowerCase() === tk.toLowerCase());
          if(info) {
            // ETH rides in msg.value; the encoded amount is zero for that path.
            displayValue = fmtAmount(isEth ? BigInt(t.value || '0') : BigInt(amt), info.decimals);
            displayToken = info.symbol;
          }
          displayTo = to;
          slowDelay = Number(delay);
        } catch(_) {}
      }
      // Decode ERC20 transfer amount and recipient for display
      if(dataLabel === 'ERC20 TRANSFER' && t.call_data && t.call_data.length >= 10) {
        try {
          const decoded = erc20Iface.decodeFunctionData('transfer', t.call_data);
          const allTokens = PROD_TOKENS[S.chainId] || ETH_ONLY;
          const tokenInfo = allTokens.find(tk => tk.address.toLowerCase() === t.target.toLowerCase());
          if(tokenInfo && decoded[1] != null) {
            displayValue = ethers.formatUnits(decoded[1], tokenInfo.decimals);
            displayToken = tokenInfo.symbol;
            displayTo = decoded[0];
          }
        } catch(_) {}
      }
      queue.push({
        nonce: t.nonce,
        target: t.target,
        displayTo: displayTo,
        displayValue: displayValue,
        displayToken: displayToken,
        value: value,
        token: token,
        dataLabel: dataLabel,
        slowDelay: slowDelay,
        isStake: isStake,
        eta: t.eta || 0,
        approvals: approvals,
        dbId: t.id,
        txHash: t.tx_hash,
        queueTx: t.queue_tx || null,
        callData: t.call_data,
        rawValue: t.value,
        signatures: sigs.map(s => ({signer: s.signer, sig: s.signature, sigType: s.sig_type})),
        accelSigners: accelSigs[t.nonce] || null,
        cancelSigners: cancelSigs[t.nonce] || null,
        rejectSigners: rejectSigs[t.nonce] || null
      });
    }
    v.queue = queue;

    // Background: mark stale txs in DB so they don't reappear
    if(staleTxIds.length) {
      for(const id of staleTxIds) {
        dbMarkExecuted(id, 0, '').catch(e => console.error('Prune stale tx:', e));
      }
    }
  } catch(e) {
    console.error('loadVaultQueue:', e);
  }
}

async function loadVaultHistory(vi) {
  const v = S.vaults[vi];
  if(!v || !v.dbId) return;
  try {
    const rows = await dbGetHistory(v.dbId, 50);
    v.history = rows.map(t => {
      const act = selectorToLabel(t.call_data);
      const ethVal = t.value && t.value !== '0' ? ethers.formatEther(BigInt(t.value)) : null;
      const desc = t.description || (ethVal ? `${ethVal} ETH → ${t.target.slice(0,6)}...` : act);
      const ts = t.executed_at || t.cancelled_at;
      const age = ts ? fmtAge(new Date(ts)) : '';
      return { nonce: t.nonce, act, desc, status: t.status, age, executionTx: t.execution_tx };
    });
  } catch(e) {
    console.error('loadVaultHistory:', e);
  }
}

function fmtAge(d) {
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if(s < 60) return '<1M';
  if(s < 3600) return Math.floor(s/60) + 'M';
  if(s < 86400) return Math.floor(s/3600) + 'H';
  return Math.floor(s/86400) + 'D';
}

async function reloadVault(vi) {
  const v = S.vaults[vi];
  if(!v) return;
  try {
    const s = await multicallLoad(v.address);
    v.threshold = Number(s.threshold);
    v.ownerCount = Number(s.ownerCount);
    v.delay = Number(s.delay);
    v.nonce = Number(s.nonce);
    v.executor = s.executor;
    const you = window._connectedAddress;
    // Preserve existing labels + resolved names (avoids display flicker)
    const oldLabels = {}, oldNames = {};
    v.owners.forEach(o => { if(o.label) oldLabels[o.addr.toLowerCase()] = o.label; if(o.name) oldNames[o.addr.toLowerCase()] = o.name; });
    if(v._pendingLabel && v._pendingLabel.label) {
      oldLabels[v._pendingLabel.addr] = v._pendingLabel.label;
    }
    v.owners = [...s.owners].map(o => ({
      addr: o,
      label: oldLabels[o.toLowerCase()] || (o.toLowerCase() === you?.toLowerCase() ? 'YOU' : ''),
      name: oldNames[o.toLowerCase()] || null,
      you: o.toLowerCase() === you?.toLowerCase()
    }));
    v.loadedOwners = [...s.owners];
    // Persist pending label to DB then clear it
    if(v._pendingLabel && v._pendingLabel.label && v.dbId) {
      const pl = v._pendingLabel;
      const match = v.owners.find(o => o.addr.toLowerCase() === pl.addr);
      if(match) dbUpdateOwnerLabel(v.dbId, match.addr, pl.label);
    }
    delete v._pendingLabel;
    // Executor check + token balances + queue + history + owner names in parallel
    const [fpResult, holdings, , , ownerNames, slowOut] = await Promise.all([
      s.executor !== ethers.ZeroAddress ? (async () => {
        try {
          const tlContract = new ethers.Contract(s.executor, TIMELOCK_EXECUTOR_ABI, provider);
          return { isTE: true, fpEnabled: await tlContract.forwardEnabled(v.address) };
        } catch(_) { return { isTE: false, fpEnabled: false }; }
      })() : Promise.resolve({ isTE: false, fpEnabled: false }),
      loadTokenBalances(v.address, s.balance),
      loadVaultQueue(vi),
      loadVaultHistory(vi),
      resolveOwnerNames([...s.owners]),
      loadSlowOutbound(v.address)
    ]);
    v.owners.forEach(o => { if(ownerNames[o.addr.toLowerCase()]) o.name = ownerNames[o.addr.toLowerCase()]; });
    v.isTimelockExecutor = fpResult.isTE;
    v.fastPath = fpResult.fpEnabled;
    v.holdings = holdings;
    v.slowOut = slowOut;
    if(v.dbId) dbSyncWalletState(v.address, v.dbId);
    render();
  } catch(e) {
    console.error('reloadVault:', e);
    flash('RELOAD FAILED');
  }
}

// ── PRODUCTION: CREATE2 VANITY ────────────────────────────────────

function buildInitcode(impl) {
  return '0x602d5f8160095f39f35f5f365f5f37365f73' + impl.slice(2).toLowerCase() + '5af43d5f5f3e6029573d5ffd5b3d5ff3';
}

// `rps` is every chain this deploy will touch, not just one. The salt is
// chain-independent, so a candidate that is free here but taken on a clone
// target lands on an address that already holds a different vault — and the
// deploy loop would report that stranger's vault as "already deployed".
async function mineVanitySalt(factory, impl, caller, rps) {
  const providers = (Array.isArray(rps) ? rps : [rps]).filter(Boolean);
  if(!providers.length) providers.push(provider);
  const hash = ethers.keccak256(buildInitcode(impl));
  const base = BigInt(caller) << 96n;
  const MAX_ITER = 2000000n;
  for(let n = 0n; n < MAX_ITER; n++) {
    const salt = '0x' + (base | n).toString(16).padStart(64, '0');
    const addr = ethers.getCreate2Address(factory, salt, hash);
    if(addr.slice(2, 4) === '00') {
      // A chain that will not answer cannot clear the address, but it cannot
      // block mining forever either — deployOnChain re-checks before signing.
      const codes = await Promise.all(providers.map(p => p.getCode(addr).catch(() => '0x')));
      if(codes.some(code => code && code !== '0x')) continue; // taken somewhere
      return { salt: base | n, address: addr, nonce: n };
    }
    if(n > 0n && n % 5000n === 0n) await new Promise(r => setTimeout(r, 0));
  }
  throw new Error('Vanity address mining exceeded max iterations');
}

// Does the contract already sitting at `addr` match what this deploy asked for?
// true = the same vault (a retry landing on work already done), false = someone
// else's, null = the chain could not be read. Called before a pre-existing
// deployment is allowed to stand in for this one.
async function vaultMatchesCtx(addr, ctx){
  try {
    const ms = new ethers.Contract(addr, MULTISIG_ABI, provider);
    const [th, dl, ex, ow] = await Promise.all([ms.threshold(), ms.delay(), ms.executor(), ms.getOwners()]);
    if(Number(th) !== Number(ctx.thresh)) return false;
    if(Number(dl) !== Number(ctx.del)) return false;
    if(String(ex).toLowerCase() !== String(ctx.executor).toLowerCase()) return false;
    const have = ow.map(a => String(a).toLowerCase()).sort();
    const want = ctx.resolvedOwners.map(a => a.toLowerCase()).sort();
    return have.length === want.length && have.every((v, i) => v === want[i]);
  } catch(_) { return null; }
}

// ── PRODUCTION: DEPLOY ────────────────────────────────────────────

async function prodDeploy() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;

  const c = S.cf, net = NETS[c.net];
  const valid = c.owners.filter(o => o.addr.trim());
  if(!valid.length) { flash('ADD AT LEAST 1 OWNER'); return; }
  if(parseInt(c.threshold) > valid.length) { flash('THRESHOLD > OWNER COUNT'); return; }

  // Resolve all owner addresses in parallel, each one welded to its label.
  // init() needs the owner list strictly ascending, and the labels are stored
  // positionally against it (owners[i] ↔ labels[i]), so the two have to be
  // sorted as pairs. Sorting the addresses alone leaves the labels behind in
  // form order and silently files every signer under someone else's name —
  // which a cloned Safe, whose getOwners() order is arbitrary, hits every time.
  let pairs;
  try {
    pairs = await Promise.all(valid.map(async o => ({ addr: await resolveName(o.addr), label: o.label || '' })));
  } catch(e) {
    flash(`OWNER: ${e.shortMessage || e.message}`);
    return;
  }
  pairs.sort((a, b) => a.addr.toLowerCase() < b.addr.toLowerCase() ? -1 : 1);
  const resolvedOwners = pairs.map(p => p.addr);
  const ownerLabels = pairs.map(p => p.label);

  // Reject duplicates before the expensive mining/deploy — init() requires
  // strictly ascending owners, so a repeat (incl. two names resolving to the
  // same address) would revert the whole tx after paying to mine + deploy.
  for(let i = 1; i < resolvedOwners.length; i++) {
    if(resolvedOwners[i].toLowerCase() === resolvedOwners[i-1].toLowerCase()) {
      flash('DUPLICATE OWNER ADDRESS'); return;
    }
  }
  // Same reasoning, for the sentinel end of the range: owners must be > 0x1.
  // A name can resolve to anything, so this is checked after resolution too.
  if(resolvedOwners.some(a => BigInt(a) <= 1n)) { flash('OWNER 0x0 IS NOT A VALID ADDRESS'); return; }

  const thresh = Math.min(parseInt(c.threshold) || 1, resolvedOwners.length);
  const del = toSec(c.delayVal, c.delayUnit);
  const executor = del > 0 ? TIMELOCK_EXECUTOR : ethers.ZeroAddress;
  const wantForward = c.fastPath && del > 0;
  // register_wallet() requires the deployer to be one of the owners. Cloning a
  // Safe you only watch produces exactly that vault, so surface it before the
  // deploy rather than losing the record afterwards.
  const deployerIsOwner = resolvedOwners.some(a => a.toLowerCase() === connectedAddress.toLowerCase());

  // Deploy chains: primary first, then clone targets. The CREATE2 address is
  // identical on every chain (same factory + salt + init code), so the vault
  // clones to the same address everywhere.
  const chainIdxs = [c.net, ...(c.clone || [])].filter((v,i,a)=>a.indexOf(v)===i);
  const chains = chainIdxs.map(i => NETS[i]).filter(n => CHAINS[n.id]);
  if(!chains.length) { flash('SELECT A NETWORK'); return; }

  // Deploy context shared across chains + retries.
  S.deploy = {
    chains,
    steps: chains.map(n => ({ id:n.id, name:n.name, status:'pending' })),
    ctx: { resolvedOwners, del, thresh, executor, wantForward, ownerLabels, connectedAddress, cfName: c.name || null, salt:null, minedAddr:null, deployerIsOwner },
    phase:'preflight', address:null, done:false, lastVaultAddr:null,
  };
  render();

  // Preflight (read-only, no chain switch): is the factory deployed on each
  // chain, does the wallet have gas there, and — when fast-path is on — is the
  // TimelockExecutor present? The factory check is the one that cannot be
  // skipped: a create() sent to a chain without it is a plain transfer to a
  // codeless address, which mines successfully and deploys nothing.
  const pfPromise = Promise.all(chains.map(async net => {
    const rp = makeProvider(net.id);
    let gasOk = null, executorOk = null, factoryOk = null;
    try { const fc = await rp.getCode(FACTORY); factoryOk = !!fc && fc !== '0x'; } catch(_){}
    try { gasOk = (await rp.getBalance(connectedAddress)) > 0n; } catch(_){}
    if(wantForward){ try { const code = await rp.getCode(TIMELOCK_EXECUTOR); executorOk = !!code && code !== '0x'; } catch(_){} }
    return { gasOk, executorOk, factoryOk };
  }));
  // Mine the CREATE2 salt up front (chain-independent), dedup-checked against
  // every chain this deploy targets, so the actual vault address is known and
  // shown in the review / deploy overlay before the user approves any wallet
  // prompt. Runs concurrently with preflight; if it fails we fall back to lazy
  // mining inside deployOnChain.
  const minePromise = (async () => {
    try {
      const mined = await mineVanitySalt(FACTORY, IMPLEMENTATION, connectedAddress, chains.map(n => makeProvider(n.id)));
      if(S.deploy){ S.deploy.ctx.salt = mined.salt; S.deploy.ctx.minedAddr = mined.address; S.deploy.address = mined.address; render(); }
    } catch(e){ console.error('Vanity mining (preflight):', e); }
  })();
  const pf = await pfPromise;
  await minePromise;
  if(!S.deploy) return;   // user cancelled during preflight
  pf.forEach((r,i)=>{ S.deploy.steps[i].pf = r; });
  const noFactory = pf.some(r => r.factoryOk === false);                 // factory truly missing
  const blocked = wantForward && pf.some(r => r.executorOk === false);   // executor truly missing
  const warn = pf.some(r => r.gasOk === false);
  if(noFactory || blocked || warn || !deployerIsOwner){ S.deploy.phase = 'review'; render(); return; }  // wait for user to PROCEED
  runDeploy();
}

// Wait for the connected wallet's active chain to match `id`, polling to absorb
// wallets that switch asynchronously. Resolves true once matched, false on timeout.
async function waitForWalletChain(id, tries=8, gap=400){
  const wp = window._connectedWalletProvider; if(!wp) return true;
  for(let i=0;i<tries;i++){
    try { const wc = await wp.request({method:'eth_chainId'}); if(parseInt(wc,16)===id) return true; } catch(_){}
    if(i<tries-1) await new Promise(r=>setTimeout(r,gap));
  }
  return false;
}

// Deploy the vault on one chain (used by the run loop and per-chain retry).
async function deployOnChain(k){
  const d = S.deploy; if(!d) return false;
  const net = d.chains[k], step = d.steps[k], ctx = d.ctx;
  try {
    step.status='switching'; step.err=null; render();
    if(net.id !== S.chainId) await switchChain(net.id, true);
    // Confirm the wallet landed on this chain before signing. Poll briefly: some
    // wallets (esp. over WalletConnect) resolve the switch request before the
    // active chain actually flips, so a single immediate read can false-negative.
    if(window._connectedWalletProvider && !(await waitForWalletChain(net.id))){
      step.status='failed'; step.err=`SWITCH TO ${net.name} IN WALLET`; render(); return false;
    }
    const w = requireSigner();
    if(!w || !w.signer){ step.status='failed'; step.err='NO SIGNER'; render(); return false; }
    // The salt is bound to the deployer: the factory requires salt >> 96 to be
    // msg.sender. Switching accounts mid-deploy would otherwise revert with an
    // opaque SaltDoesNotStartWith after the wallet prompt was already approved.
    if(w.addr && ctx.connectedAddress && w.addr.toLowerCase() !== ctx.connectedAddress.toLowerCase()){
      step.status='failed'; step.err=`SWITCH BACK TO ${shortAddr(ctx.connectedAddress)}`; render(); return false;
    }
    const signer = w.signer;
    if(!ctx.salt){
      step.status='mining'; render();
      const mined = await mineVanitySalt(FACTORY, IMPLEMENTATION, ctx.connectedAddress, d.chains.map(n => makeProvider(n.id)));
      ctx.salt = mined.salt; ctx.minedAddr = mined.address; d.address = mined.address; render();
    }
    const existing = await provider.getCode(ctx.minedAddr);
    if(existing && existing !== '0x'){
      // Something already holds this address. On a retry that is this vault, so
      // skipping is right. But an earlier deploy from the same EOA can occupy
      // the same salt on a chain the mining pass never saw, and that vault has
      // a different signer set — reporting it as "already deployed" would hand
      // back a stranger's wallet as though the clone had succeeded.
      const same = await vaultMatchesCtx(ctx.minedAddr, ctx);
      if(same !== true){
        step.status='failed';
        step.err = same === false ? 'ADDRESS HOLDS A DIFFERENT VAULT' : 'CANNOT VERIFY EXISTING VAULT';
        render(); return false;
      }
      step.status='skipped'; step.address=ctx.minedAddr; d.lastVaultAddr=ctx.minedAddr; render(); return true;
    }
    step.status='deploying'; render();
    const factory = new ethers.Contract(FACTORY, FACTORY_ABI, signer);
    let tx;
    if(ctx.wantForward){
      const enableData = tlIface.encodeFunctionData('enableForward', [true]);
      tx = await factory.createWithCalls(ctx.resolvedOwners, ctx.del, ctx.thresh, ctx.executor, ctx.salt, [TIMELOCK_EXECUTOR], [0], [enableData]);
    } else {
      tx = await factory.create(ctx.resolvedOwners, ctx.del, ctx.thresh, ctx.executor, ctx.salt);
    }
    const receipt = await tx.wait();
    let walletAddr = ctx.minedAddr;
    const iface = new ethers.Interface(FACTORY_ABI);
    for(const log of receipt.logs){ try { const p = iface.parseLog(log); if(p?.name === 'Created'){ walletAddr = p.args[0]; break; } } catch(_){} }
    // A mined receipt is not a deployment. If the factory is absent on this
    // chain the call is a plain transfer to a codeless address: status 1, no
    // Created event, nothing deployed. Confirm the vault has code before
    // recording it as one.
    const deployedCode = await provider.getCode(walletAddr).catch(() => null);
    if(deployedCode === '0x'){
      step.status='failed'; step.err='NO CODE AT ADDRESS — FACTORY MISSING?'; step.txHash=receipt.hash; render(); return false;
    }
    d.lastVaultAddr = walletAddr;
    try {
      const ms = new ethers.Contract(walletAddr, MULTISIG_ABI, provider);
      const onchainNonce = Number(await ms.nonce());
      const wid = await dbRegisterWallet(walletAddr, ctx.connectedAddress, ctx.salt, ctx.resolvedOwners, ctx.thresh, ctx.del, ctx.executor, Number(receipt.blockNumber), receipt.hash, ctx.cfName, ctx.ownerLabels, onchainNonce);
      if(!wid) step.dbWarn = true;   // deployed on-chain, absent from history
    } catch(e){ console.error('DB register failed:', e); step.dbWarn = true; }
    step.status='done'; step.address=walletAddr; step.txHash=receipt.hash; render();
    return true;
  } catch(e){
    console.error('deploy on', net.name, e);
    step.status='failed'; step.err = e.shortMessage || e.message || 'FAILED'; render();
    return false;
  }
}
async function _finishDeploy(){
  const d = S.deploy; if(!d) return;
  d.done = true; render();
  const addr = d.lastVaultAddr;
  if(!addr) return;
  // Land on a chain where the vault actually exists: the primary if it deployed,
  // otherwise the first chain that succeeded. loadSingleVaultData reads the live
  // `provider`, so pointing at a chain without the vault (e.g. after a trailing
  // clone failed) would make the multicall revert and the vault silently vanish.
  const ok = i => d.steps[i] && (d.steps[i].status==='done' || d.steps[i].status==='skipped');
  let landIdx = ok(0) ? 0 : d.steps.findIndex((_,i)=>ok(i));
  if(landIdx >= 0){
    const homeId = d.chains[landIdx].id;
    if(homeId !== S.chainId){ try { await switchChain(homeId, true); } catch(e){ console.error('Return to home chain:', e); } }
  }
  if(!S.vaults.some(v => v.address && v.address.toLowerCase() === addr.toLowerCase())){
    try { const vData = await loadSingleVaultData(addr); if(vData){ S.vaults.push(vData); S.sel = S.vaults.length - 1; render(); } } catch(e){ console.error('Load new vault:', e); }
  }
}
async function runDeploy(){
  if(!S.deploy) return;
  S.deploy.phase = 'deploying'; render();
  for(let k=0; k<S.deploy.chains.length; k++){
    const st = S.deploy.steps[k];
    if(st.status === 'done' || st.status === 'skipped') continue;
    await deployOnChain(k);

}

function senderSig(addr) {
  // Encode as r=addr (left-padded), s=0, v=0 — contract interprets as msg.sender approval
  return '0x' + addr.slice(2).toLowerCase().padStart(64, '0') + '0'.repeat(64) + '00';
}

async function prodSign(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';
    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const msg = { target, value, data, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);

    // Update local state
    tx.approvals[connectedAddress] = true;
    if(!tx.signatures) tx.signatures = [];
    const existing = tx.signatures.findIndex(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(existing >= 0) tx.signatures[existing] = {signer: connectedAddress, sig, sigType: 'ecdsa'};
    else tx.signatures.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
    tx.signatures.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    // Persist to DB
    if(tx.dbId) {
      await dbAddSig(tx.dbId, connectedAddress, sig);
    } else if(v.dbId) {
      const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);
      const txId = await dbProposeTx(v.dbId, nonce, target, value.toString(), data, txHash, v.threshold, connectedAddress);
      if(txId) {
        tx.dbId = txId;
        tx.txHash = txHash;
        await dbAddSig(txId, connectedAddress, sig);
      }
    }

    flash(`SIGNED #${nonce} (OFF-CHAIN)`);
    render();
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'SIGN FAILED');
  }
}

async function prodApprove(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    // Compute the EIP-712 hash to approve on-chain
    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';
    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const hash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, { target, value, data, nonce });

    const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);
    flash('APPROVING ON-CHAIN...');
    const atx = await ms.approve(hash, true);
    const receipt = await atx.wait();

    // Persist as sender-sig so it survives reload and is usable for submit
    const approvalSig = senderSig(connectedAddress);
    if(!tx.signatures) tx.signatures = [];
    const existing = tx.signatures.findIndex(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(existing >= 0) tx.signatures[existing] = {signer: connectedAddress, sig: approvalSig, sigType: 'approval'};
    else tx.signatures.push({signer: connectedAddress, sig: approvalSig, sigType: 'approval'});
    tx.signatures.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);
    if(tx.dbId) {
      await dbAddSig(tx.dbId, connectedAddress, approvalSig, 'approval');
    } else if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, value.toString(), data, hash, v.threshold, connectedAddress);
      if(txId) { tx.dbId = txId; tx.txHash = hash; await dbAddSig(txId, connectedAddress, approvalSig, 'approval'); }
    }

    // Track in approvals table
    if(v.dbId) await dbRecordApproval(v.dbId, S.chainId, connectedAddress, hash, true, Number(receipt.blockNumber), receipt.hash);

    tx.approvals[connectedAddress] = true;
    flash(`APPROVED #${nonce} (ON-CHAIN)`);
    render();
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'APPROVE FAILED');
  }
}

async function prodUnsign(vi, nonce) {
  const connectedAddress = window._connectedAddress;
  if(!connectedAddress) return;
  const signer = window._signer;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  // Check if this was an on-chain approval — if so, revoke it on-chain
  const mySig = tx.signatures?.find(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
  const wasOnchainApproval = mySig && (mySig.sigType === 'approval' || mySig.sigType === 'sender');
  if(wasOnchainApproval && signer) {
    try {
      const target = tx.target;
      const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
      const data = tx.callData || '0x';
      const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
      const hash = tx.txHash || ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, { target, value, data, nonce });
      const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);
      flash('REVOKING ON-CHAIN...');
      const atx = await ms.approve(hash, false);
      const receipt = await atx.wait();
      if(v.dbId) await dbRecordApproval(v.dbId, S.chainId, connectedAddress, hash, false, Number(receipt.blockNumber), receipt.hash);
    } catch(e) {
      console.error('Revoke approval:', e);
      flash(e.shortMessage || e.message || 'REVOKE FAILED');
      return;
    }
  }

  // Remove from local state
  tx.approvals[connectedAddress] = false;
  if(tx.signatures) {
    tx.signatures = tx.signatures.filter(s => s.signer.toLowerCase() !== connectedAddress.toLowerCase());
  }

  // Remove from DB
  if(tx.dbId) await dbRemoveSig(tx.dbId, connectedAddress);

  flash(wasOnchainApproval ? `REVOKED #${nonce} (ON-CHAIN)` : `UNSIGNED #${nonce}`);
  render();
}

function packSigs(sigs) {
  let packed = '0x';
  for(const s of sigs) {
    const raw = (s.sig || s.signature);
    if(!raw || raw.length !== 132) throw new Error(`Invalid signature length from ${s.signer}: expected 132 chars, got ${raw?.length}`);
    packed += raw.slice(2);
  }
  return packed;
}

function collectSigs(tx, v, connectedAddress) {
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
  const msg = { target: tx.target, value, data: tx.callData || '0x', nonce: tx.nonce };
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);
  let sigs = verifySigs(tx.signatures || [], domain, EIP712_TYPES, msg, ownerAddrs);
  const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
  const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
  if(callerIsOwner && !callerHasSigned) {
    sigs = [...sigs, {signer: connectedAddress, sig: senderSig(connectedAddress), sigType: 'sender'}];
  }
  sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);
  return { sigs, domain, msg, ownerAddrs };
}

function verifySigs(sigs, domain, types, msg, owners) {
  const ownerSet = new Set(owners.map(o => o.toLowerCase()));
  const seen = new Set();
  const verified = [];
  for(const s of sigs) {
    const key = s.signer.toLowerCase();
    if(seen.has(key)) continue;
    // Sender/approval sigs (on-chain approvals) — trust them, contract validates
    const st = s.sigType || s.sig_type;
    if(st === 'approval' || st === 'sender') {
      if(ownerSet.has(key)) { seen.add(key); verified.push(s); }
      continue;
    }
    // Verify ECDSA sigs client-side
    try {
      const sigData = s.sig || s.signature;
      const recovered = ethers.verifyTypedData(domain, types, msg, sigData);
      if(recovered.toLowerCase() === key && ownerSet.has(key)) {
        seen.add(key);
        verified.push(s);
      } else {
        console.warn(`Sig verification failed for ${s.signer}: recovered ${recovered}`);
      }
    } catch(e) {
      console.warn(`Invalid sig from ${s.signer}:`, e.message);
    }
  }
  return verified;
}

// Read the wallet's current on-chain nonce. execute() and executor.forward()
// both hash the tx against the live nonce, so off-chain sigs made over a
// different nonce silently fail — check up front for a clear message.
async function fetchLiveNonce(vAddr) {
  const ms = new ethers.Contract(vAddr, MULTISIG_ABI, provider);
  return Number(await ms.nonce());
}

async function prodSubmit(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';

    const { sigs } = collectSigs(tx, v, connectedAddress);

    // Sigs are made over tx.nonce; execute()/forward() hash against the live
    // nonce, so a stale entry would revert opaquely — surface it clearly.
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== nonce) {
      flash('NONCE CHANGED — RELOADING');
      await reloadVault(vi);
      return;
    }

    const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);

    // Check for cancel-via-executor or forward path
    const isCancelCall = v.isTimelockExecutor
      && target.toLowerCase() === v.address.toLowerCase()
      && data.length >= 10 && data.slice(0, 10) === msIface.getFunction('cancelQueued').selector;
    const canCancel = isCancelCall && sigs.length >= v.threshold;
    if(!canCancel && sigs.length < v.threshold) {
      flash(`NEED ${v.threshold - sigs.length} MORE VALID SIG${v.threshold - sigs.length > 1 ? 'S' : ''}`);
      return;
    }

    let atx;
    if(canCancel) {
      const executorAddr = v.executor;
      const tlContract = new ethers.Contract(executorAddr, TIMELOCK_EXECUTOR_ABI, signer);
      flash('CANCELLING VIA EXECUTOR...');
      atx = await tlContract.forward(v.address, target, value, data, packSigs(sigs.slice(0, v.threshold)));
    } else {
      // Contract requires exactly threshold * 65 bytes of sigs
      const packedSigs = packSigs(sigs.slice(0, v.threshold));
      flash('SUBMITTING TX...');
      atx = await ms.execute(target, value, data, packedSigs);
    }

    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    // Parse events
    for(const log of receipt.logs) {
      try {
        let parsed = msIface.parseLog(log);
        if(!parsed) parsed = tlIface.parseLog(log);
        if(parsed?.name === 'ExecutionSuccess') {
          flash(`EXECUTED #${nonce}`);
          if(tx.dbId) await dbMarkExecuted(tx.dbId, Number(receipt.blockNumber), receipt.hash);
        }
        if(parsed?.name === 'Queued') {
          const eta = Number(parsed.args[2]);
          if(eta === 0) {
            flash('CANCELLED QUEUED TX');
            const cancelledHash = parsed.args[0];
            const cancelledDbTx = await dbGetTxByHash(cancelledHash);
            if(cancelledDbTx) await dbCancelTx(cancelledDbTx.id, connectedAddress);
          } else {
            tx.eta = eta;
            tx.queueTx = receipt.hash;
            flash(`QUEUED #${nonce} \u2014 ETA: ${new Date(eta*1000).toLocaleString()}`);
            if(tx.dbId) await dbMarkQueued(tx.dbId, eta, Number(receipt.blockNumber), receipt.hash);
          }
        }
      } catch(_){}
    }

    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'SUBMIT FAILED');
  }
}

async function prodExecute(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];

    flash('EXECUTING QUEUED TX...');

    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    if(tx.dbId) await dbMarkExecuted(tx.dbId, Number(receipt.blockNumber), receipt.hash);

    // Parse events — detect if this was a cancel that emits Queued(hash, 0, 0)
    for(const log of receipt.logs) {
      try {

        if(parsed?.name === 'Queued') {

          if(eta === 0) {

            const cancelledDbTx = await dbGetTxByHash(cancelledHash);
            if(cancelledDbTx) await dbCancelTx(cancelledDbTx.id, connectedAddress);
          }
        }
      } catch(_){}
    }

    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'EXECUTE FAILED');
  }
}

async function prodFastExecute(vi, nonce) {
