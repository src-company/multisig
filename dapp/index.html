<!-- Unfurl metadata. Vault links get passed between co-signers and pasted into
     threads, and without these they arrive as a bare URL — no card, no title,
     no description. The 1200x630 card was already built and deployed here;
     nothing referenced it.

     These cannot describe a particular vault. A vault link is a fragment
     (#nrd.id.wei), and a fragment is never sent to the server — which is also
     what keeps a vault address out of the request log, and is a property worth
     keeping. So every vault link unfurls as the app itself, deliberately. -->

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
a,button,[role=button],[onclick]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Ink ladder. Hue is locked to the brand (blue 265 / teal 215); the contrast
   target is a hard constraint; chroma is the free variable and is maximised.
   Figures are APCA Lc against the theme's own --bg, monotone a > m > d > fr > ln.
   Dark theme runs light-on-blue because #2D5FE8 caps ANY dark ink at Lc 28 —
   below APCA's Lc 45 floor for text at any size. --on is the ink for text
   sitting on a light semantic fill (--g/--r/--y), where --bg would be too dim. */
:root{
  /* Lc:      78.1        —          64.3        73.3   */
  --a:#F5FBFF;--bg:#2D5FE8;--d:#D6E6FF;--m:#EAF4FF;
  /* Lc:       9.5         16.2        65.7                45.0        57.3 */
  --ln:#FFFFFF2E;--fr:#FFFFFF47;--g:#7DFFBA;--gc:#0A0A0A;--r:#FFB1AC;--y:#FFD600;
  --on:#0A0A0A;
  --f:'IBM Plex Mono','Courier New',monospace;
}
.light{
  /* Lc:      80.5        —          65.2        73.3   */
  --a:#00677C;--bg:#FDFDFD;--d:#008CA6;--m:#007990;
  --ln:#0099B326;--fr:#0099B340;--g:#059669;--gc:#fff;--r:#DC2626;--y:#B45309;
  --on:#FDFDFD;
}
body{font-family:var(--f);background:var(--bg);color:var(--a);min-height:100vh;min-height:100dvh;padding:10px;position:relative;overflow-x:hidden;transition:background .3s,color .3s;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}
input,select,button,textarea{font-family:var(--f);font-size:16px;color:var(--a)}
input:focus,textarea:focus,select:focus{border-bottom-color:var(--a)!important;outline:none;box-shadow:inset 0 -1px 0 var(--a);caret-color:var(--a)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
button{cursor:pointer}
button:active{transform:scale(.97)}
/* Text for assistive tech only. Used where meaning is carried by a glyph or a
   colour — a ✓ against an owner's name is unambiguous to look at and silent to
   a screen reader. Not display:none, which would take it out of the a11y tree
   as well. */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
::placeholder{color:var(--d)}
::selection{background:var(--a);color:var(--bg)}
::-moz-selection{background:var(--a);color:var(--bg)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--ln)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes txLinked{0%,40%{background:color-mix(in srgb,var(--g) 15%,transparent)}100%{background:transparent}}
.tx-linked{animation:txLinked 2s ease}
.tx-focus{box-shadow:inset 2px 0 0 var(--a);background:color-mix(in srgb,var(--a) 5%,transparent)}
.tx-share{display:inline-flex;align-items:center;gap:8px;font-size:8px;font-weight:700;letter-spacing:1px;color:var(--a);border:1px solid var(--a);padding:3px 4px 3px 8px;text-transform:uppercase}
.tx-share button{background:none;border:none;color:var(--a);cursor:pointer;font-size:11px;line-height:1;padding:0 2px;opacity:.8}
.tx-share button:hover{opacity:1}
/* Tertiary action: one shape, three intents. The shape is declared once and
   each variant states only its intent, which is the colour it resolves to on
   hover.
     .sim-btn     diagnostic, neutral
     .alt-link    a non-destructive fallback. On-chain approval is a real
                  capability, the only route a DAO or nested multisig has and
                  the only one needing no coordination service, but for an
                  ordinary signer it costs gas, publishes the authorization and
                  gives up the front-run binding. Offered, not recommended.
     .reject-link destructive, and arms before it fires. */
.alt-link,.reject-link,.sim-btn{background:transparent;border:1px solid var(--ln);color:var(--d);font-size:9px;font-weight:700;letter-spacing:2px;padding:6px 12px;cursor:pointer;font-family:var(--f);text-transform:uppercase;transition:border-color .15s,color .15s}
.alt-link:hover,.sim-btn:hover{border-color:var(--a);color:var(--a)}
.reject-link:hover{border-color:var(--r);color:var(--r)}
.reject-link.armed{border-color:var(--r);color:var(--r);background:color-mix(in srgb,var(--r) 8%,transparent)}
/* Peer of the above for undoing your own signature: destructive tone, no box.
   --r runs at full strength, Lc 45 on the blue. Dimming it is the thing to
   resist: at opacity .5 it falls to Lc 17, barely readable for a destructive
   control. */
.unsign-link{background:transparent;border:none;color:var(--r);font-size:9px;font-weight:700;letter-spacing:2px;padding:6px 0;cursor:pointer;font-family:var(--f);text-transform:uppercase;transition:opacity .15s}
@media(hover:hover){.unsign-link:hover{opacity:.75}}
/* Qualifier inside a filled button ("OFF-CHAIN", "VIA EXECUTOR"): subordinate
   to the verb, but it is the half of the label that says which route this is,
   so it stops short of .5, which would put it at Lc 41 on the fill. */
.btn-qual{opacity:.72;font-size:9px;margin-left:4px;font-weight:700}
/* .65 lands the glyph at Lc 37 on the blue and still recedes. Lower is not
   available: .4 gives Lc 20, under APCA's Lc 30 floor for an interactive
   non-text mark. */
.copy-btn{opacity:.65;transition:opacity .15s}
@media(hover:hover){.copy-btn:hover{opacity:1}}
@media(hover:hover){
  button:hover{opacity:.85}
  .btn:hover{opacity:.9}
  .btn-fill:hover,.btn-green:hover{opacity:.85}
  .btn-outline:hover{opacity:1;background:var(--a);color:var(--bg)}
  .btn-danger:hover{opacity:1;background:var(--r);color:var(--on);border-color:var(--r)}
  .net-row:hover{color:var(--a);background:var(--ln);transform:translateX(3px);box-shadow:inset 2px 0 0 var(--a)}
  .vtab:hover{color:var(--a)}
  .pill:not(.on):hover{border-color:var(--a);color:var(--a);background:color-mix(in srgb,var(--a) 6%,transparent)}
  .row:hover{background:var(--ln);box-shadow:inset 2px 0 0 var(--fr)}
  .inp:hover{border-bottom-color:var(--m)}
  .admin-tab:hover,.txb-tab:hover{color:var(--a)}
  .link-btn:hover{opacity:.7}
  .theme-btn:hover,.wallet-btn:hover{background:var(--ln);border-color:var(--fr)}
  .tx:not(.blocked):hover{background:var(--ln);box-shadow:inset 2px 0 0 var(--a)}
}

/* reactive affordances — explorer/address links, queue-card press, network-row slide */
.alink{transition:border-color .15s,color .15s}
@media(hover:hover){.alink:hover{border-bottom-color:var(--a)!important;color:var(--a)!important}}
.tx-explorer{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--d);text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
@media(hover:hover){.tx-explorer:hover{color:var(--a);border-bottom-color:var(--a)}}
.tx:not(.blocked):active{background:color-mix(in srgb,var(--a) 9%,transparent)}
.net-row:active{transform:translateX(1px)}

/* scanline */
.scan{position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0A0A0A04 3px,#0A0A0A04 6px)}
.light .scan{background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0099B302 3px,#0099B302 6px)}

/* frame */
.frame{position:relative;padding:0 24px;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;flex:1}
.rail{position:absolute;top:0;bottom:0;width:12px;overflow:hidden;writing-mode:vertical-lr;font-size:11px;letter-spacing:1px;color:var(--fr);user-select:none;line-height:12px}
.rail-l{left:0}.rail-r{right:0}
.hbar{font-size:11px;letter-spacing:1px;color:var(--fr);user-select:none;overflow:hidden;white-space:nowrap;line-height:1}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:22px 0 16px}
.logo{font-size:36px;font-weight:700;letter-spacing:-1px;line-height:1}
.sub{font-size:10px;letter-spacing:13px;color:var(--m);margin-top:2px;opacity:.5;user-select:none}
/* The "?" beside the wordmark is a real control, so it is a real button and it
   clears the text floor: .7 puts its glyph at Lc 49 on the blue and it still
   reads as quieter than the wordmark it hangs off. At .35 it would sit at
   Lc 21, well under the Lc 45 the ink ladder above commits to. */
.info-i{font-size:10px;font-weight:400;width:20px;height:20px;border-radius:50%;border:1px solid var(--a);background:transparent;padding:0;font-family:var(--f);color:var(--a);display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;opacity:.7;transition:opacity .2s;cursor:pointer;vertical-align:middle;margin-left:2px;flex-shrink:0}
@media(hover:hover){.info-i:hover{opacity:1}}
.info-tip{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(400px,88vw);max-height:85vh;max-height:85dvh;overflow-y:auto;padding:24px;background:var(--a);color:var(--bg);font-size:13px;line-height:1.9;letter-spacing:.3px;z-index:300;text-transform:none;font-weight:500}
.info-tip.open{display:block}
.info-tip .x{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--bg);font-size:14px;cursor:pointer;opacity:.6;padding:4px 8px}
.info-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:299}
.info-backdrop.open{display:block}
.addr{font-size:10px;letter-spacing:2px;color:var(--m);margin-top:4px}
/* The vault's WNS name in the header, beside its address. Accent-coloured and
   heavier so the eye lands on it first — it is the readable half of the pair —
   without growing the line: same size as the address it sits next to. */
.vault-name{font-weight:700;color:var(--a)}
/* The one copy button in the app that hands over something other than the string
   it sits next to, so it is the one that carries a word. Tracked and sized like
   the .addr line it belongs to rather than like the glyph, and set a little in
   from the address so the pair does not read as one token. */
.addr-link-btn{gap:5px;letter-spacing:2px;font-size:9px;font-weight:600;margin-left:6px}
.hdr-r{display:flex;gap:10px;align-items:center}
.theme-btn{background:transparent;border:1px solid var(--ln);color:var(--a);width:40px;height:40px;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.wallet-btn{background:transparent;border:1px solid var(--ln);color:var(--m);height:40px;padding:0 14px;font-size:10px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:6px;transition:background .15s;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot-sm{width:4px;height:4px;border-radius:50%;background:var(--g)}

/* nav */
.nav{display:flex;border-bottom:1px solid var(--ln)}
.nav button{position:relative;padding:14px 20px;font-size:12px;font-weight:700;letter-spacing:2px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--d);transition:color .15s}
.nav button.on{color:var(--a)}

/* content */
.content{padding:8px 0;min-height:60vh;display:flex;flex-direction:column;flex:1}

/* section divider */
.sec{display:flex;align-items:center;gap:10px;margin:40px 0 16px;user-select:none}
.sec span:first-child{font-size:10px;letter-spacing:3px;color:var(--d);flex-shrink:0}
.sec .line{flex:1;height:1px;background:var(--ln)}

/* buttons */
.btn{font-size:11px;font-weight:700;letter-spacing:2px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;text-transform:uppercase;border:none;transition:opacity .15s,background .15s,color .15s,border-color .15s,transform .1s ease}
.btn-fill{background:var(--a);color:var(--bg)}
.btn-green{background:var(--g);color:var(--gc)}
.btn-outline{background:transparent;color:var(--a);border:1px solid var(--a)}
.btn-danger{background:transparent;color:var(--r);border:1px solid color-mix(in srgb,var(--r) 35%,transparent)}
.btn-w{width:100%}
.btn-sm{height:30px;padding:0 14px;font-size:10px}
.btn-big{height:48px;font-size:13px;letter-spacing:3px}

/* inputs */
.inp{width:100%;padding:12px 0;font-size:16px;background:transparent;border:none;border-bottom:1px solid var(--ln);margin-bottom:16px;border-radius:0;-webkit-appearance:none;transition:border-color .15s}
.lbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--m);margin-bottom:4px;display:block}
.lbl .dim{opacity:.5}
textarea.inp{min-height:80px;resize:vertical;border:1px solid var(--ln);padding:12px;font-size:13px;border-bottom:1px solid var(--ln)}

/* row */
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 8px;border-bottom:1px solid var(--ln);flex-wrap:wrap;gap:10px;transition:background .15s}
.sep{height:1px;background:var(--ln);margin:32px 0}

/* vault tabs */
.vtabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
/* max-content is what makes the strip scroll instead of fitting, and it belongs
   only to the breakpoint that wants scrolling. Above it the tabs share the row,
   and leaving it on would hand a long holdings summary — now that .vtab-info is
   one line — the power to stretch the strip a character at a time into a
   horizontal scroll with no visible bar (.vtabs hides it), which is a worse loss
   than an ellipsis. A long list of vaults still overflows and scrolls: that
   comes from .vtab's 140px basis and flex-shrink:0, not from here. */
.vtabs-inner{display:flex;border-bottom:1px solid var(--ln)}
@media(max-width:640px){.vtabs-inner{min-width:max-content}}
/* Top-aligned, not centre-aligned. A <button> centres its content by default,
   which was invisible while every tab carried a name AND an info line; now that
   the selected tab gives its balance back to the hero it can be one line tall,
   and centring dropped its name to a different baseline from its neighbours'. */
.vtab{padding:16px 24px;text-align:left;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--d);position:relative;flex:1 0 140px;transition:color .15s;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.vtab.on{color:var(--a)}
.vtab-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.vtab-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite}
/* One line, always. This strip exists to be compared across — that is the whole
   argument for putting a balance on the tabs you might switch TO — and a column
   of summaries can only be read at a glance while they share a baseline. A vault
   holding more tokens than its neighbours spelled a longer line, wrapped, and
   pushed its own pending count onto a second row while every other tab's sat on
   the first; the row stopped being scannable at the one moment it had something
   to say. Truncation is the right loss: the exact figure is one click away in
   the hero below, and what a glance needs off this row is which vault, not the
   last digit of its balance.
   align-self is what supplies a width to truncate against — the tab is a
   flex-start column, so without it the line is content-sized and can never
   overflow. Below 640px .vtabs-inner is max-content and the strip scrolls
   instead, which is where these already sat on one line. */
.vtab-info{font-size:10px;opacity:.85;margin-top:3px;align-self:stretch;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stats */
.stats{padding:36px 0 8px}
.stat-big{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1}
.stat-token{font-size:16px;font-weight:600;color:var(--m)}
.stat-usd{font-size:13px;color:var(--d)}
.holdings{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;font-size:12px;color:var(--m)}
/* The reveal groups in the hero are sized to their figures, not to the column,
   so sweeping the pointer down the page doesn't trip them. */
.stats .privg{width:fit-content;max-width:100%}
.holdings strong{font-weight:700}
.holdings .usd{font-size:10px;color:var(--d);margin-left:4px}

/* Visual privacy — the over-the-shoulder pass, gated on body.priv-on.
   Contrast cannot hide anything here: an onlooker sits on the same contrast
   sensitivity function you do, so any contrast clearing your threshold clears
   theirs. Occlusion is the only lever that works.
   Radius: letter identification lives in a ~3 cycles-per-x-height band, i.e. a
   stroke period of 0.172em. A Gaussian of sigma s attenuates period p by
   exp(-2(pi*s/p)^2), so 0.08em drops that band below an onlooker's detection
   threshold at 1m. 0.11em keeps ~1.4x margin for better-than-20/20 eyes; 2x
   (0.16em) buys little further privacy and reads as a font fault rather than a
   deliberate veil. In em, so one radius serves the 9px chrome and the 52px hero
   alike and it tracks every breakpoint.
   What carries .priv is a rule, not a judgement call: a figure stating a
   QUANTITY OF MONEY — a balance, an amount, a delta — wherever it appears and
   at whatever size. Tickers, token icons, addresses, signer counts, gas, dates
   and thresholds never do. That is what keeps the veil from reading as damage:
   it lands on digits and leaves the furniture sharp.
   Size is deliberately not the boundary. A 12px+ rule is tempting, since 9-11px
   sits under the ~5 arcmin detection floor at 1m, but an onlooker on a train is
   at 0.5m; and once this is a mode the user switches on it is a promise, which
   hiding the hero balance while the same number sits sharp in the vault tab
   above it would break. */
body.priv-on .priv{filter:blur(.11em);transition:filter .32s ease}
/* Reveal by group, not by glyph. A balance and its USD line are one figure, so
   they lift together and the pointer never has to hunt for the right few
   pixels; .privg is that group, and it is drawn tightly around the figures so
   crossing the page doesn't strobe them. Quick to reveal, slow to re-veil —
   the reverse feels like a flinch. Touch has no hover, so groups without an
   inner control carry tabindex=0 (emitted only while the mode is on, so the
   mode never leaves dead tab stops behind) and lift on tap. */
body.priv-on .privg:hover .priv,body.priv-on .privg:focus-within .priv,
body.priv-on .priv:hover,body.priv-on .priv:focus{filter:none;transition-duration:.1s}
body.priv-on .privg,body.priv-on .priv{outline:none}
body.priv-on .privg:focus-visible,body.priv-on .priv:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.theme-btn svg{display:block}
@media(prefers-reduced-motion:reduce){
  body.priv-on .priv{transition:none}
}
.meta{display:flex;gap:24px;font-size:11px;letter-spacing:2px;color:var(--m);margin-top:12px;flex-wrap:wrap}
/* When this vault executes: the delay, and the one route around it. One rule
   brackets the pair, so the exception is read as belonging to the delay rather
   than as another entry in the run of facts beside it. The inner gap is narrower
   than .meta's 24px — they are two halves of one clause, and at the row's own
   spacing they would read as two of its items. */
.meta-when{display:inline-flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-left:2px solid var(--a);padding-left:10px;margin-left:2px}
.meta-when.open{border-left-color:var(--y);color:var(--y)}
.meta-fast{color:var(--g)}

/* queue */
.tx{padding:18px 8px;border-bottom:1px solid var(--ln);transition:opacity .3s,background .15s}
/* A blocked proposal is waiting on the nonce ahead of it, not cancelled, so the
   whole card (target, amount, who has signed) is still the thing a signer reads
   to decide whether to unblock it. .72 keeps the row plainly recessive at
   Lc 51, and the state itself is carried by the same bordered status pill every
   other card uses. Fog cannot do the signalling: at .3 the text falls to Lc 17,
   which recesses the row by destroying its content. */
.tx.blocked{opacity:.72}
.tx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tx-nonce{font-size:10px;font-weight:700;color:var(--d)}
.tx-val{font-size:20px;font-weight:700}
.tx-to{font-size:11px;color:var(--m);margin-top:3px;word-break:break-all}
/* State pill in the card header. Outlined in whatever colour the state resolves
   to, so it reads as status rather than as a third button. */
.tx-status{font-size:10px;font-weight:700;letter-spacing:2px;border:1px solid currentColor;padding:4px 9px;white-space:nowrap}
.approvals{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:10px;letter-spacing:1px}
.ap-ok,.ap-no{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--ln);letter-spacing:1px;font-weight:600}
.ap-ok{color:var(--g);border-color:color-mix(in srgb,var(--g) 40%,transparent);background:color-mix(in srgb,var(--g) 8%,transparent)}
.ap-no{color:var(--d)}
.eta{color:var(--d);margin-left:auto;font-size:10px}
.tx-progress{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--d)}
.tx-progress>.plabel{min-width:78px}
/* The maturity date is the TIMELOCK bar's readout — the instant it is filling
   toward — so it takes the same trailing slot the SIGNATURES bar puts its count
   in, and the row's own type with it. It was sitting at the end of the approvals
   row instead, where .eta's margin-left:auto stranded it against the card's far
   edge with nothing beside it to say what it was the time OF. That left the one
   bar on the card with no figure against it while its sibling had one.
   letter-spacing stays at 1: a date is read as words and numerals, not as the
   tracked-out labels around it, and at 2px "Jul 28, 04:19 AM" grows wide enough
   to crowd the bar on a phone. */
.tx-progress .eta{margin-left:0;font-size:9px;letter-spacing:1px;color:var(--m)}
.pbar{height:4px;background:var(--ln);overflow:hidden;flex:1;min-width:70px;max-width:220px}
.pbar>i{display:block;height:100%;transition:width .4s ease}
/* Proposal footer. The status pill reads as state and lives in the header next
   to .tx-kind, which it matches; the verbs it enables collect down here. Keeping
   them apart matters because .tx-status shares .btn's outlined-caps treatment:
   flush against EXECUTE/CANCEL it misreads as a third, disabled button.
   Diagnostics lead, committal actions sit on the trailing edge. */
.tx-foot{margin-top:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tx-foot-diag{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tx-foot-act{display:flex;gap:8px;flex-shrink:0;margin-left:auto}

/* tx builder */
.txb{padding:20px 18px;border:1px solid var(--fr);border-left:2px solid var(--a);background:color-mix(in srgb,var(--a) 4%,transparent);margin:6px 0 28px}
.txb-tabs{display:flex;gap:20px;margin-bottom:24px;align-items:center}
.txb-tab{position:relative;background:transparent;border:none;font-size:11px;font-weight:700;letter-spacing:2px;padding:4px 0;color:var(--d);border-bottom:2px solid transparent;transition:color .15s}
.txb-tab.on{color:var(--a)}
.x-btn{background:transparent;border:none;color:var(--d);font-size:14px;padding:8px;min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;margin-left:auto}
.x-btn.red{color:var(--r)}
/* Inline glyph button (copy, share, dismiss) that sits inside a line of text:
   it must not disturb the line box, so the visual box stays tiny and the TOUCH
   box is grown with a transparent ::after instead of with padding. Without it
   these are ~14px targets on a phone, while every other control in the app is
   held to 44px. Declared AFTER .x-btn, which it pairs with and must override at
   equal specificity, so source order is the whole argument.
   margin-left is reset because .x-btn floats right (for the tab-row ✕) and the
   copy glyphs otherwise inherit it: as a flex child beside a signer's address
   that shoves the glyph, and the name after it, to the far edge of the row. A
   copy affordance belongs against the thing it copies. */
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:auto;min-height:auto;padding:2px 5px;font-size:9px;line-height:1;vertical-align:middle;margin-left:0}
.icon-btn::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.grid3{display:grid;grid-template-columns:1fr 1fr 2fr;gap:16px}
.tok-ico{display:inline-flex;align-items:center;vertical-align:middle;line-height:0}
.tok-ico svg{width:15px;height:15px;display:block}
.pill .tok-ico{margin-right:6px}
.tok-ico.big svg{width:26px;height:26px}
.tok-ico.sm svg{width:12px;height:12px}
.ctok-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1px;border:1px solid var(--ln);padding:3px 4px 3px 8px;color:var(--m)}
.ctok-chip button{background:none;border:none;color:var(--d);cursor:pointer;font-size:11px;line-height:1;padding:0 2px}
.ctok-chip button:hover{color:var(--r)}
.token-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{height:34px;padding:0 14px;font-size:10px;font-weight:700;letter-spacing:2px;display:inline-flex;align-items:center;background:transparent;color:var(--d);border:1px solid var(--ln);text-transform:uppercase;transition:border-color .15s,color .15s}
.pill.on{color:var(--a);border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}
.link-btn{background:transparent;border:none;color:var(--a);font-size:11px;font-weight:700;letter-spacing:2px;padding:8px 0;display:flex;align-items:center}
.batch-call{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--ln)}
.call-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:10px;font-weight:700;color:var(--d);letter-spacing:2px}

/* signers — the same ordering the header commits to for the vault's own pair:
   whatever identifies the owner leads, and the machine half recedes behind it.
   It was the other way round here (addr 14/700, name 11), which put the weight
   on the one string nobody reads.
   Which element is which is decided per owner, not per column: .signer-id is
   the name when there is one and the ADDRESS when there is not, because an
   unnamed owner's address is the only identity in the row and has no business
   being styled as the recessive half of a pair that does not exist. .signer-addr
   is then the address in its second role only — the copy a name displaced.
   --d at 12px stays a text ink, not a whisper: Lc 64 dark / 65 light, above the
   ladder's floor. */
.signer-id{font-size:14px;font-weight:700;color:var(--a);letter-spacing:1px;word-break:break-all}
.signer-addr{font-size:12px;font-weight:400;color:var(--d);word-break:break-all}
/* A bare "R" floating after a name reads as a typo. Both of these are chips
   because they are annotations ON the signer, not more of the signer's name —
   the same bordered treatment the admin roster already gives YOU. */
.signer-label{font-size:9px;color:var(--m);letter-spacing:2px;border:1px solid var(--ln);padding:1px 6px}
.signer-you{font-size:9px;font-weight:700;color:var(--m);letter-spacing:1px;border:1px solid var(--fr);padding:1px 6px}

/* footer */
.footer{border-top:1px solid var(--ln);padding:12px 0;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:2px;color:var(--m);flex-wrap:wrap;gap:8px}
.footer-l,.footer-r{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.reset-btn{background:transparent;border:none;color:var(--d);font-size:9px;letter-spacing:2px;padding:4px 0}
.docs-link{color:var(--d);font-size:9px;letter-spacing:2px;text-decoration:none}
.docs-link:hover{color:var(--a)}

/* colophon — the SRC_CO mark, below the bottom rule and outside the functional
   footer row, because it is a credit and not a control. Held at .7 so it reads
   as a signature rather than competing with DOCS and AUDIT; full strength on
   hover, when someone has decided to look at it. */
.colophon{align-self:flex-end;display:inline-flex;align-items:center;gap:7px;margin:10px 0 16px;font-size:9px;letter-spacing:2px;color:var(--d);text-decoration:none;opacity:.7;transition:opacity .2s ease,color .2s ease}
.colophon:hover,.colophon:focus-visible{opacity:1;color:var(--a)}
.colophon svg{width:14px;height:14px;display:block;flex:none;user-select:none}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--a);color:var(--bg);padding:12px 24px;padding-bottom:max(12px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;letter-spacing:2px;z-index:999;animation:toastIn .2s ease;text-align:center}

/* empty */
.empty{text-align:center;padding:40px 0;margin:auto 0}
.empty-title{font-size:44px;font-weight:700;letter-spacing:-2px}
.empty-sub{font-size:12px;color:var(--m);letter-spacing:2px;margin:12px 0 32px}

/* network selector — a real <button> per row, so the chain picker is reachable
   by keyboard and announces as a control. Row chrome unchanged. */
.net-row{width:100%;text-align:left;background:transparent;border:none;font-family:var(--f);padding:12px 8px;font-size:12px;font-weight:700;letter-spacing:2px;border-bottom:1px solid var(--ln);color:var(--d);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s,transform .15s,box-shadow .15s}
.net-row.on{color:var(--a);border-bottom:none}
/* Both of these are read, not decoration: the chain id is how you tell two
   deployments apart, and TEST is the difference between play money and real.
   At .4/.5 they would sit at Lc 20/25 on the blue. */
.net-id{font-size:9px;opacity:.65}
.net-test{font-size:8px;opacity:.7}
.net-panel{border-left:2px solid var(--a);background:color-mix(in srgb,var(--a) 4%,transparent);padding:2px 16px}
.net-panel .net-row:last-child,.net-panel .net-tokens:last-child{border-bottom:none}
.net-tokens{padding:8px 0 12px 16px;border-bottom:1px solid var(--ln);font-size:10px;color:var(--d);display:flex;gap:10px;flex-wrap:wrap}
.net-tokens span{font-weight:600}

/* admin */
.admin-note{font-size:10px;color:var(--d);letter-spacing:2px;margin:12px 0 20px}
.admin-tabs{display:flex;gap:24px;margin-bottom:32px}
.admin-tab{position:relative;background:transparent;border:none;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--d);padding:4px 0;border-bottom:2px solid transparent;transition:color .15s}
.admin-tab.on{color:var(--a)}
/* animated tab indicators — the active bar slides in and previews faintly on hover */
.nav button::after,.vtab::after,.txb-tab::after,.admin-tab::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--a);transform:scaleX(0);transform-origin:center;transition:transform .22s cubic-bezier(.4,0,.2,1);pointer-events:none}
.nav button.on::after,.vtab.on::after,.txb-tab.on::after,.admin-tab.on::after{transform:scaleX(1)}
@media(hover:hover){
  .nav button:not(.on):hover::after,.vtab:not(.on):hover::after,.txb-tab:not(.on):hover::after,.admin-tab:not(.on):hover::after{transform:scaleX(1);background:var(--fr)}
}
.policy-big{font-size:44px;font-weight:700;letter-spacing:-2px}
.policy-of{font-size:18px;font-weight:700;color:var(--m)}
.changed-tag{font-size:10px;color:var(--y);letter-spacing:2px}
.policy-warn{font-size:10px;letter-spacing:1px;line-height:1.6;color:var(--y);border-left:2px solid var(--y);background:color-mix(in srgb,var(--y) 6%,transparent);padding:10px 14px;margin-bottom:20px}
.thresh-btns{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.thresh-btn{flex:0 0 auto;min-width:60px;padding:0 10px}
.btn-disabled{border:1px solid var(--fr)!important;color:var(--d)!important;background:transparent!important;cursor:not-allowed}
.owner-row{display:grid;grid-template-columns:22px minmax(0,1fr) 120px 40px;grid-template-areas:"num addr label del";gap:12px;align-items:center;margin-bottom:2px}
.owner-row .o-num{grid-area:num;font-size:10px;font-weight:700}
.owner-row .o-addr{grid-area:addr;margin:0}
.owner-row .o-label{grid-area:label;margin:0;font-size:11px;letter-spacing:1px}
.owner-row .o-del{grid-area:del;margin:0}
.owner-note{font-size:9px;letter-spacing:1px;margin:2px 0 10px 30px}
/* clone-from-Safe affordance: logo + a quiet CLONE hint beside OWNERS */
.safe-pill{height:26px;padding:0 10px;gap:6px;font-size:9px;color:var(--m)}
.safe-pill:hover{border-color:#12FF80;color:#12FF80}
.safe-pill .tok-ico svg{width:12px;height:12px}
.safe-src{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:9px;letter-spacing:1px;color:var(--d);border:1px solid var(--ln);border-left:2px solid #12FF80;padding:8px 10px;margin:0 0 12px}
.safe-src .x-btn{min-width:24px;min-height:24px;padding:0;font-size:11px}
.safe-row{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--m);border:1px solid var(--ln);padding:10px;margin-top:8px;cursor:pointer;text-align:left;width:100%;background:transparent;transition:border-color .15s,color .15s}
.safe-row:hover{border-color:#12FF80;color:#12FF80}
/* ── FREE id.wei IDENTITY ──────────────────────────────────────────
   One line under the vault name. It sits between a text field and the
   owner list, both of which are load-bearing, so it stays quiet until
   it is ticked: no fill, no colour, and a checkbox rather than the
   filled button the permanent choices on this form use. */
.wns-opt{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--d);border-left:2px solid var(--ln);padding:7px 0 7px 10px;margin:0 0 16px;transition:border-color .15s}
.wns-opt.on{border-left-color:var(--a);color:var(--m)}
.wns-opt.off{color:var(--d);opacity:.75}
.wns-opt b{color:var(--m);font-weight:700;letter-spacing:1px}
.wns-opt.on b{color:var(--a)}
.wns-box{width:14px;height:14px;flex-shrink:0;padding:0;background:transparent;border:1px solid var(--fr);color:var(--a);font-size:9px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s}
.wns-box:hover:not(:disabled){border-color:var(--a)}
.wns-box:disabled{opacity:.4;cursor:not-allowed}
.wns-opt.on .wns-box{border-color:var(--a)}
.wns-st{letter-spacing:2px;font-size:8px}
/* The tooltip carries the whole tradeoff — what is claimed, what it costs,
   what it cannot do — so the line itself does not have to. */
.wns-q{width:13px;height:13px;flex-shrink:0;border:1px solid var(--ln);color:var(--d);font-size:8px;line-height:11px;text-align:center;cursor:help;margin-left:auto}
.wns-q:hover,.wns-q:focus{border-color:var(--a);color:var(--a)}
.wns-why{flex-basis:100%;font-size:8px;letter-spacing:1.5px;color:var(--y);line-height:1.6;padding-left:23px}
.preview-text{font-size:12px;line-height:2;color:var(--m);padding:16px 18px;white-space:pre;border-left:2px solid var(--a);background:color-mix(in srgb,var(--a) 4%,transparent);overflow-x:auto}

/* mobile */
@media(max-width:900px){
  .frame{max-width:100%}
  .grid2{gap:24px}
  .policy-big{font-size:38px}
}
@media(max-width:640px){
  body{padding:6px}
  /* Force all form controls to >=16px so iOS Safari doesn't auto-zoom on focus.
     Every .inp is full-width at this breakpoint, so the larger size never overflows. */
  .inp{font-size:16px!important}
  .frame{padding:0 6px}
  .rail{display:none}
  .hbar{font-size:10px}
  .logo{font-size:24px}
  .sub{font-size:8px;letter-spacing:7.5px}
  .info-i{width:16px;height:16px;font-size:8px}
  .info-tip{width:min(340px,90vw);font-size:12px;padding:20px}
  .hdr{padding:18px 0 12px}
  .hdr-r{gap:8px}
  .wallet-btn{padding:0 10px;font-size:9px;gap:4px}
  .nav button{padding:14px 0;flex:1;text-align:center;font-size:11px}
  .content{padding:4px 0}
  .sec{margin:28px 0 12px}
  .stats{padding:24px 0 8px}
  .stat-big{font-size:32px}
  .stat-token{font-size:13px}
  .stat-usd{font-size:11px}
  .holdings{gap:14px}
  .meta{gap:10px;font-size:10px}
  .vtab{padding:14px 16px;flex:0 0 auto;min-width:120px}
  .vtab-name{font-size:12px}
  .tx{padding:18px 6px}
  .tx-val{font-size:16px}
  .tx-to{font-size:10px}
  /* actionBtn stacks full-width at this breakpoint, so the trailing block takes
     the whole row rather than sharing it with the diagnostics. */
  .tx-foot{align-items:stretch}
  .tx-foot-act{width:100%;margin-left:0;margin-top:2px}
  .tx-foot-act>*{width:100%}
  .row{padding:14px 6px}
  .sep{margin:24px 0}
  .grid2,.grid3{grid-template-columns:1fr;gap:0}
  .txb{padding:20px 6px}
  .txb-tabs{gap:12px}
  .token-pills{margin-bottom:12px}
  .pill{height:38px;padding:0 12px}
  .approvals{gap:6px}
  .btn{height:44px;padding:0 16px}
  .btn-sm{height:38px;padding:0 12px}
  .btn-big{height:52px}
  .thresh-btns{gap:4px}
  .thresh-btn{min-height:44px}
  .owner-row{grid-template-columns:22px 1fr 40px;grid-template-areas:"num addr del" ". label label";row-gap:6px}
  .owner-row .o-label{grid-column:label}
  .toast{bottom:max(20px,env(safe-area-inset-bottom));max-width:88vw}
  .footer{font-size:8px;letter-spacing:1px}
  .footer-l,.footer-r{gap:8px}
  .colophon{font-size:8px;letter-spacing:1px;gap:6px;margin:8px 0 12px}
  .colophon svg{width:12px;height:12px}
  .empty{padding:60px 0}
  .empty-title{font-size:28px}
  .admin-tabs{gap:14px;margin-bottom:24px}
  .admin-tab{font-size:11px}
  .policy-big{font-size:32px}
  .link-btn{padding:12px 0;min-height:44px}
  /* Tertiary controls are 9px text in a 6px box — ~23px tall, well under the
     44px every other control here is held to. */
  .alt-link,.reject-link,.sim-btn{min-height:44px}
  /* :not(.icon-btn) is load-bearing. .icon-btn resets these to auto above so an
     inline glyph does not disturb the line box it sits in, and it wins there
     only on source order at equal specificity — which this rule, being later in
     the file, would otherwise take back at exactly the breakpoint .icon-btn was
     written for. The 44px touch box is not lost: .icon-btn::after supplies it
     without occupying layout. */
  .x-btn:not(.icon-btn){min-width:44px;min-height:44px}
  .net-row{padding:14px 8px;min-height:44px}
  .addr{font-size:9px;letter-spacing:1px}
}
@media(max-width:380px){
  .logo{font-size:20px}
  .wallet-btn{padding:0 8px;font-size:8px;height:36px}
  .theme-btn{width:36px;height:36px;font-size:12px}
  .stat-big{font-size:26px}
  .vtab{min-width:100px;padding:12px 12px}
  .vtab-name{font-size:11px}
  .empty-title{font-size:24px}
  .nav button{font-size:10px;padding:12px 0}
}
/* ── OVERLAY LAYER ─────────────────────────────────────────────────
   Every modal in the app is the same object and says so here rather than in
   inline geometry per caller. One scrim, one cap, one scroll container. Width
   is the only knob a caller turns, via --ow. Scrolling lives on .ovl as well as
   the card, so a card taller than the viewport can still be reached on a short
   screen. The cap is in dvh, never vh: a mobile browser's collapsing toolbar
   can clip a vh cap, hiding the footer that holds PROCEED. */
.ovl{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ovl-card{width:min(var(--ow,440px),96vw);margin:auto;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--bg);border:1px solid var(--a);padding:22px}
.ovl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.ovl-title{font-size:12px;font-weight:700;letter-spacing:2px}
.ovl-sub{font-size:10px;color:var(--m);letter-spacing:1px;margin-bottom:16px;word-break:break-all}
/* While a modal owns the screen the page behind it must not scroll under the
   thumb. wallet.css declares the same rule for its own modal; stated here too
   so the app's overlays do not depend on a stylesheet they don't own. */
body.modal-open{overflow:hidden}
@media(max-width:640px){
  .ovl{padding:8px}
  .ovl-card{padding:18px;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
}

/* loading overlay */
.loading-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .35s ease}
.loading-overlay.dark-bg{background:#2D5FE8}
.loading-overlay.light-bg{background:#FDFDFD}
/* mark: settle-in on appear, then a slow breathing scale (GPU transform only) */
.loading-overlay .loading-svg{width:96px;height:96px;will-change:transform;transform:translateZ(0);animation:markIn .55s cubic-bezier(.2,.85,.25,1) both,markBreath 3.2s ease-in-out .55s infinite}
@keyframes markIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes markBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.loading-overlay .loading-text{font-family:var(--f,'IBM Plex Mono',monospace);font-size:9px;font-weight:700;letter-spacing:4px;animation:pulse 2s ease-in-out infinite}
.loading-overlay.dark-bg .loading-text{color:#F5FBFFCC}
.loading-overlay.light-bg .loading-text{color:#0099B3AA}
/* scanning progress bar — echoes the queue .pbar motion so it reads as one system */
.loading-overlay::after{content:"";width:132px;max-width:44vw;height:2px;opacity:.55;background-size:200% 100%;background-repeat:no-repeat;animation:loadSweep 1.4s cubic-bezier(.65,0,.35,1) infinite}
.loading-overlay.dark-bg::after{background-image:linear-gradient(90deg,transparent,#0A0A0A,transparent)}
.loading-overlay.light-bg::after{background-image:linear-gradient(90deg,transparent,#0099B3,transparent)}
@keyframes loadSweep{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-overlay.fade-out{opacity:0;pointer-events:none}
/* exit: mark shrinks slightly as the splash fades */
.loading-overlay.fade-out .loading-svg{animation:none;transform:scale(.92);opacity:0;transition:transform .35s ease,opacity .35s ease}
.loading-overlay.fade-out::after{opacity:0}
@media(max-width:640px){.loading-overlay{gap:16px}.loading-overlay .loading-svg{width:68px;height:68px}.loading-overlay .loading-text{font-size:8px;letter-spacing:3px}.loading-overlay::after{width:104px}}
@media(prefers-reduced-motion:reduce){.loading-overlay::after{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ── SEND FLOW ─────────────────────────────────────────────────────
   Two-track builder: the form fields run down the left, a live review
   card (what will actually be proposed) sits on the right and carries
   the terminal actions, so the eye never leaves the summary it signs. */
.send-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
.fset{margin-bottom:26px}
.fset:last-child{margin-bottom:0}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fhead .lbl{margin-bottom:0}
.fhint{font-size:9px;letter-spacing:1px;color:var(--d)}
.fhint b{color:var(--m);font-weight:700}

/* amount — the headline figure of the proposal, sized like one */
.amt{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ln);transition:border-color .15s,box-shadow .15s}
.amt:focus-within{border-bottom-color:var(--a);box-shadow:inset 0 -1px 0 var(--a)}
input.amt-in{flex:1;min-width:0;width:100%;padding:8px 0;font-size:32px;font-weight:700;letter-spacing:-1.5px;background:transparent;border:none;border-radius:0;-webkit-appearance:none}
input.amt-in:focus{outline:none;box-shadow:none!important;border-bottom-color:transparent!important}
.amt-tok{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--m);flex-shrink:0;padding-left:14px;border-left:1px solid var(--ln);align-self:stretch;padding-top:14px;padding-bottom:14px}
.amt-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:9px;min-height:24px}
.amt-usd{font-size:11px;letter-spacing:1px;color:var(--d);word-break:break-all}
.amt-warn{font-size:10px;letter-spacing:1px;color:var(--r);flex-basis:100%}
.qbtns{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.qbtn{height:24px;padding:0 9px;font-size:9px;font-weight:700;letter-spacing:1.5px;background:transparent;border:1px solid var(--ln);color:var(--d);font-family:var(--f);transition:color .15s,border-color .15s}
@media(hover:hover){.qbtn:hover{color:var(--a);border-color:var(--a)}}

/* segmented control — mutually-exclusive modes read better than loose pills */
.seg{display:inline-flex;border:1px solid var(--ln);padding:3px;gap:3px;max-width:100%}
.seg button{height:32px;padding:0 20px;font-size:10px;font-weight:700;letter-spacing:2px;background:transparent;border:none;color:var(--d);white-space:nowrap;transition:background .18s,color .18s}
.seg button.on{background:var(--a);color:var(--bg)}
@media(hover:hover){.seg button:not(.on):hover{color:var(--a);background:color-mix(in srgb,var(--a) 8%,transparent)}}

/* SLOW delay picker */
.slow-box{margin-top:14px;padding:14px;border:1px solid var(--ln);border-left:2px solid var(--a);background:color-mix(in srgb,var(--a) 4%,transparent)}
.slow-note{font-size:10px;letter-spacing:1px;line-height:1.7;color:var(--d)}
.slow-note b{color:var(--m);font-weight:700}
.slow-custom{display:flex;align-items:center;gap:10px;margin-top:12px}
.slow-custom-l{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--d);flex-shrink:0}
.slow-custom .inp{margin:0;font-size:13px;padding:6px 0;min-width:0}
.slow-unit{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--m);background:transparent;border:1px solid var(--ln);padding:7px 26px 7px 10px;border-radius:0;-webkit-appearance:none;appearance:none;flex-shrink:0;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.slow-unit:focus{border-color:var(--a);outline:none}
.slow-unit option{background:var(--bg);color:var(--a)}

/* review card */
.review{border:1px solid var(--fr);border-top:2px solid var(--a);background:color-mix(in srgb,var(--a) 4%,transparent);padding:16px 16px 18px}
.review-h{display:flex;justify-content:space-between;align-items:center;font-size:9px;font-weight:700;letter-spacing:3px;color:var(--d);margin-bottom:14px}
.review-tag{border:1px solid var(--ln);padding:2px 6px;font-size:8px;letter-spacing:2px}
.review-amt{display:flex;align-items:center;gap:9px;font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1.15;word-break:break-all}
.review-amt.ph{color:var(--fr)}
.review-usd{font-size:11px;letter-spacing:1px;color:var(--d);margin-top:4px}
.review .privg{width:fit-content;max-width:100%}
.review-arrow{font-size:9px;letter-spacing:2px;color:var(--d);margin:14px 0 5px}
.review-to{font-size:12px;font-weight:700;word-break:break-all;line-height:1.5}
.review-to.ph{color:var(--fr);font-weight:400}
/* the address a name resolves to — the thing actually being signed */
.review-to-sub{font-size:10px;font-weight:400;letter-spacing:1px;color:var(--m);word-break:break-all;line-height:1.6;margin-top:3px}
.review-to-sub.bad{color:var(--r)}
.review-rows{margin-top:16px}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:10px;letter-spacing:1px;padding:8px 0;border-top:1px solid var(--ln);color:var(--d)}
.rrow b{color:var(--m);font-weight:700;text-align:right;word-break:break-word}
.rrow b.hi{color:var(--a)}
.review-warn{font-size:10px;letter-spacing:1px;line-height:1.6;color:var(--y);border-left:2px solid var(--y);background:color-mix(in srgb,var(--y) 7%,transparent);padding:8px 10px;margin-top:14px}
.review-miss{font-size:9px;letter-spacing:1.5px;color:var(--d);text-align:center;margin-top:9px;line-height:1.5}
.btn-pending{opacity:.4}

/* ── SIMULATION ────────────────────────────────────────────────────
   A dry-run is the last thing between a signer and an irreversible
   proposal, so it gets a real panel: verdict, asset ledger, gas. */
.sim-idle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:11px 13px;border:1px dashed var(--fr)}
.sim-idle .t{font-size:9px;letter-spacing:1.5px;color:var(--d);line-height:1.6}
.sim{margin-top:16px;border:1px solid var(--ln);border-left:2px solid var(--fr);background:color-mix(in srgb,var(--a) 3%,transparent)}
.sim.run{border-left-color:var(--a)}
.sim.pass{border-left-color:var(--g)}
.sim.revert{border-left-color:var(--r)}
.sim-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--m)}
.sim.run .sim-h{color:var(--a)}
.sim.pass .sim-h{color:var(--g)}
.sim.revert .sim-h{color:var(--r)}
.sim-h .mark{font-size:12px;line-height:1}
.sim-tags{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sim-tag{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--d);border:1px solid var(--ln);padding:2px 6px}
.sim-x{background:transparent;border:none;color:var(--d);font-size:11px;line-height:1;padding:2px 4px;font-family:var(--f)}
@media(hover:hover){.sim-x:hover{color:var(--a)}}
.sim-b{padding:0 14px 13px}
.sim-sub{font-size:9px;letter-spacing:1.5px;color:var(--d);line-height:1.7}
.sim-scan{height:2px;background-image:linear-gradient(90deg,transparent,var(--a),transparent);background-size:200% 100%;background-repeat:no-repeat;animation:loadSweep 1.3s cubic-bezier(.65,0,.35,1) infinite;opacity:.55;margin-bottom:10px}
.sim-led{border-top:1px solid var(--ln);margin-top:2px}
.sim-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13px;font-weight:700}
.sim-row:last-child{border-bottom:none}
.sim-row .dir{font-size:9px;font-weight:700;letter-spacing:2px;width:46px;flex-shrink:0}
.sim-row .val{margin-left:auto;text-align:right;word-break:break-all}
.sim-out{color:var(--r)}
.sim-in{color:var(--g)}
.sim-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:10px;letter-spacing:1px;color:var(--d);padding-top:10px;border-top:1px solid var(--ln)}
.sim-reason{font-size:11px;line-height:1.6;color:var(--r);word-break:break-all;padding:10px 12px;background:color-mix(in srgb,var(--r) 14%,transparent);border-left:2px solid var(--r)}

/* ── STAKE ─────────────────────────────────────────────────────────
   One field and a diagram: the transfer is trivial, so the tab's job
   is making what it triggers legible before anyone signs it. */
.stake-flow{display:flex;align-items:stretch;justify-content:center;gap:44px;border:1px solid var(--ln);border-left:2px solid var(--a);background:color-mix(in srgb,var(--a) 4%,transparent);padding:20px 16px}
.stake-node{flex:0 1 180px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px}
.stake-node b{font-size:14px;font-weight:700;letter-spacing:-.2px;word-break:break-all}
.stake-node span:last-child{font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--d);line-height:1.4}
.stake-arrow{align-self:center;font-size:18px;color:var(--a);opacity:.65;flex-shrink:0}
.stake-note{font-size:10px;letter-spacing:1px;line-height:1.75;color:var(--d);margin-top:12px}
.stake-note b{color:var(--m);font-weight:700}
.stake-after{font-size:10px;letter-spacing:1px;line-height:1.75;color:var(--d);border-top:1px solid var(--ln);padding-top:14px}
.stake-after b{color:var(--m);font-weight:700}
.tx-kind.stake{color:var(--a);border-color:var(--fr);display:inline-flex;align-items:center;gap:5px}

/* ── NAME ──────────────────────────────────────────────────────────
   The diagram is two-headed on purpose: the pair of calls buys one
   direction each, and which one is missing is the thing a reader
   has to be able to see at a glance. */
.wns-flow{display:flex;align-items:stretch;justify-content:center;gap:28px;border:1px solid var(--ln);border-left:2px solid var(--a);background:color-mix(in srgb,var(--a) 4%,transparent);padding:20px 16px}
.wns-node{flex:0 1 200px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px}
.wns-node b{font-size:14px;font-weight:700;letter-spacing:-.2px;word-break:break-all}
.wns-node span{font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--d)}
.wns-arrows{align-self:center;display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.1;color:var(--a);opacity:.65;flex-shrink:0}
.wns-input{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--ln)}
.wns-input .inp{flex:1;min-width:0;border-bottom:none}
.wns-suffix{flex-shrink:0;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--d);padding-bottom:9px}

/* ── QUEUE CARDS ───────────────────────────────────────────────── */
/* Badge tone maps to what a proposal can do, not to what it is called:
   value moves are routine, policy outlives the proposal, danger is
   irreversible or unbounded, code is opaque until you read it. */
.tx-kind{font-size:8px;font-weight:700;letter-spacing:2px;border:1px solid var(--ln);color:var(--d);padding:2px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tx-kind.slow,.tx-kind.stake{color:var(--a);border-color:var(--fr)}
.tx-kind.policy{color:var(--y);border-color:color-mix(in srgb,var(--y) 45%,transparent);background:color-mix(in srgb,var(--y) 8%,transparent)}
.tx-kind.danger{color:var(--r);border-color:color-mix(in srgb,var(--r) 45%,transparent);background:color-mix(in srgb,var(--r) 8%,transparent)}
.tx-kind.code{color:var(--m);border-color:var(--fr)}
/* When the badge is suppressed as a duplicate of the headline, the headline
   carries the tone instead — the flag must not vanish with the badge. */
.tx-val.policy{color:var(--y)}
.tx-val.danger{color:var(--r)}
.tx-note{font-size:10px;letter-spacing:1px;line-height:1.65;color:var(--d);margin-top:8px;max-width:76ch}
.tx-note.warn{color:var(--y);border-left:2px solid var(--y);background:color-mix(in srgb,var(--y) 6%,transparent);padding:7px 10px;margin-top:10px}

@media(max-width:900px){
  .send-grid{grid-template-columns:minmax(0,1fr) 264px;gap:26px}
}
@media(max-width:760px){
  .send-grid{grid-template-columns:1fr;gap:24px}
  .review{margin-top:2px}
}
@media(max-width:640px){
  input.amt-in{font-size:26px}
  .amt-tok{font-size:12px;padding-left:10px}
  .seg{width:100%}
  .seg button{flex:1;padding:0 8px;height:38px}
  .qbtn{height:30px;padding:0 11px}
  .review-amt{font-size:22px}
  .sim-row{font-size:12px}
  /* Narrow enough that side-by-side nodes squeeze the tickers — stack and
     turn the arrow to match the reading direction. */
  .stake-flow{flex-direction:column;gap:10px;padding:16px 14px}
  /* flex-basis becomes a HEIGHT once the container stacks — reset it, or each
     node reserves 180px of empty vertical space. */
  .stake-node{flex:0 0 auto;flex-direction:row;justify-content:flex-start;text-align:left;gap:10px;align-items:center}
  .stake-node b{font-size:13px}
  .stake-node span:last-child{margin-left:auto;text-align:right}
  .stake-arrow{align-self:flex-start;margin-left:6px;transform:rotate(90deg);font-size:15px}
  .tx-kind{white-space:normal}
}
</style>
</head>
<body>
<div class="scan" aria-hidden="true"></div>
<div id="loading" class="loading-overlay" role="status" aria-label="Loading"></div>
<noscript>
  <div style="max-width:520px;margin:64px auto;padding:0 20px;font-family:'IBM Plex Mono','Courier New',monospace;color:#F5FBFF;font-size:13px;line-height:1.9;letter-spacing:.3px">
    <div style="font-size:28px;font-weight:700;letter-spacing:-1px">MULTISIG</div>
    <p style="margin-top:16px">This wallet reads chain state and signs EIP-712 messages in your browser, so it needs JavaScript enabled. Nothing is rendered server-side.</p>
    <p style="margin-top:12px">The contracts do not depend on this interface: a vault can be operated with any tool that can call <code>execute</code>. See <a href="docs.html" style="color:#F5FBFF">the docs</a>.</p>
  </div>
</noscript>
<script>
(function(){

const _providerCache = {};
// A FallbackProvider is not self-healing: ethers marks a backend with
// `_lastFatalError` the first time its getBlockNumber throws, never clears it,
// and once every backend carries one the provider answers "no runners?!" to
// everything from then on. Cached forever, that means a single network blip —
// a sleeping laptop, a dropped tunnel — silently kills a chain for the rest of
// the page session. Mainnet is the worst one to lose, because every .eth /
// .wei / .gwei name is read from it no matter which chain the app is on, so a
// wedged mainnet provider takes name resolution down everywhere. So: notice the
// wedge and rebuild on the next call.
function makeProvider(id) {
  const cached = _providerCache[id];
  if (cached && !cached._wedged) return cached;
  const c = CHAINS[id];
  const p = c.rpcs.length === 1
    ? new ethers.JsonRpcProvider(c.rpcs[0], id, { staticNetwork: true })
    : new ethers.FallbackProvider(
        c.rpcs.map((url, i) => ({
          provider: new ethers.JsonRpcProvider(url, id, { staticNetwork: true }),
          priority: i + 1, stallTimeout: 2000
        })),
        id,
        { quorum: 1 }
      );
  const perform = typeof p._perform === 'function' ? p._perform.bind(p) : null;
  if (perform) p._perform = async req => {
    try { return await perform(req); }
    catch (e) { if (/no runners/i.test((e && e.message) || '')) p._wedged = true; throw e; }
  };

// ── AUDIT SAFEGUARDS ──────────────────────────────────────────────
// Mitigations for the Shred Security review of 2026-07-11 (audit/report-shred-
// security.md). The factory, implementation and TimelockExecutor are immutable
// singletons that were not redeployed, so every finding it raised is fenced off
// here instead — at the last point where this interface can still decline to
// build the transaction, or explain the one that already reverted.

// L-1. execute() and executeQueued() call `executor.execute(...)` as a guard
// hook whenever the executor address carries the 0x1111 marker in its top or
// bottom 16 bits. An executor that is the vault itself turns that hook into
// unbounded self-recursion: every execute reverts, and because setExecutor is
// onlySelf it can only be reached *through* execute — so there is no way back.
// The vault and everything in it are frozen for good.
function isGuardHookAddr(a) {
  if(!ethers.isAddress(a)) return false;
  const n = BigInt(a);
  return (n >> 144n) === 0x1111n || (n & 0xFFFFn) === 0x1111n;
}
// What pointing `vaultAddr` at `next` as its executor would mean:
//   'lock' — permanent, unrecoverable DoS. Never build this transaction.
//   'self' — the vault as its own executor. Harmless today only because this
//            address happens to miss the marker; still a self-bypass of the
//            signature path with no legitimate use, and one the contract's own
//            recommended fix rejects outright.
//   'hook' — a real, distinct executor that will fire the guard hook. Valid
//            (that is the blocklist/veto pattern) but worth stopping over.
function executorRisk(next, vaultAddr) {
  if(!ethers.isAddress(next)) return null;
  const self = !!vaultAddr && next.toLowerCase() === vaultAddr.toLowerCase();
  if(self) return isGuardHookAddr(next) ? 'lock' : 'self';
  return isGuardHookAddr(next) ? 'hook' : null;
}

// H-01 (third review). Every signature in a `forward()` bundle is equally valid
// for `Multisig.execute()` — the two routes verify the same EIP-712 Execute
// digest, and nothing in it says which route was intended. So an observer who
// copies a bundle out of the mempool can submit it down the *other* route.
//
// For a cancellation that is fatal, and it needs no `forwardEnabled`: the honest
// owners sign a cancel meaning it to land immediately via `forward()`; the
// attacker front-runs with `execute()`, which — not being the executor — queues
// the cancellation for the full delay and consumes the nonce, so the real
// forward() reverts. The dangerous transaction was queued first, matures first,
// and anyone may execute it. The cancellation arrives afterwards and deletes an
// entry that is already gone, without reverting. The brake is neutralised.
//
// The binding: give one slot of the bundle to the submitter as a v=0 "sender
// slot" — 32 bytes naming an owner, 32 unused, then v=0 — which the contract
// accepts only when `msg.sender` is that owner (or they hold an on-chain
// approval for the hash). A copier is neither, so the bundle is inert in their
// hands on either route. Costs nothing: the slot replaces that owner's own
// signature, and they are the one submitting anyway.
function senderSlot(owner) {
  // Lowercased before getAddress, which validates the checksum and throws when a
  // mixed-case address fails it. The contract reads these 32 bytes as an address
  // and does not care how the string was cased, but the signer reaching here can
  // come from the `signatures` table — an anon-writable column that stores
  // whatever string it was handed. Rejecting one for its capitalisation would
  // fail the packing rather than the row, taking the whole bundle with it.
  // Anything that is not an address still throws, which is the check worth
  // keeping.
  return ethers.zeroPadValue(ethers.getAddress(String(owner).toLowerCase()), 32).slice(2) + '0'.repeat(64) + '00';
}
// forward() demands exactly `required * 65` bytes, so a bundle carrying more
// signatures than the route asks for reverts. Trim to `n`, keeping the
// submitter's slot — it is the one that binds the bundle, and sorted order
// alone would sometimes drop it. Re-sorted after, since the contract walks the
// slots expecting strictly ascending signers.
function pickSigs(sigs, n, submitter) {
  if(sigs.length <= n) return sigs;
  const mine = submitter ? sigs.filter(s => s.signer && s.signer.toLowerCase() === submitter.toLowerCase()) : [];
  const rest = sigs.filter(s => !mine.includes(s));
  return [...mine, ...rest].slice(0, n).sort((a, b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);
}
// Pack a forward() bundle bound to `submitter` where possible. Returns the
// packed bytes plus whether the binding actually took, so callers can say so
// rather than quietly assuming protection they did not get.
async function packSigsBound(sigs, submitter, msAddr, hash) {
  const packedPlain = packSigs(sigs);
  if(!submitter) return { packed: packedPlain, bound: false, why: 'NO SUBMITTER' };
  const i = sigs.findIndex(s => s.signer && s.signer.toLowerCase() === submitter.toLowerCase());
  if(i < 0) return { packed: packedPlain, bound: false, why: 'SUBMITTER IS NOT ONE OF THE SIGNERS' };

  // is the one case where the sender slot buys nothing. Read it rather than
  // assume — this is the emergency path.
  if(msAddr && hash) {
    try {
      const ms = new ethers.Contract(msAddr, MULTISIG_ABI, provider);
      if(await ms.approved(sigs[i].signer, hash)) {
        return { packed: packedPlain, bound: false, why: 'SUBMITTER HAS AN ON-CHAIN APPROVAL FOR THIS HASH' };
      }
    } catch(_) { /* unreadable — fall through and bind anyway; worst case it reverts */ }
  }
  let packed = '0x';
  sigs.forEach((s, k) => { packed += k === i ? senderSlot(s.signer) : sigSlot(s); });
  return { packed, bound: true };
}
// One slot of a packed bundle, 65 bytes, as the contract reads them.
//
// A v=0 slot is not a signature at all: the contract takes its first 32 bytes
// as an owner address and asks whether that owner is msg.sender or holds an
// on-chain approval. The bytes beside it in the database are never read, and
// they were never written by anyone this app verified — add_signature() runs as
// the anon role and takes whatever string it is handed, then ON CONFLICT DO
// UPDATE lets it be overwritten. Packing that string verbatim put an unchecked
// blob of unknown length into the middle of a bundle: 65 bytes is the one thing
// forward() and execute() both insist on, so a single mangled row made the
// emergency cancel route revert on a length check, for every owner, until
// somebody re-approved. Derive the slot from the signer instead — that is the
// only thing in the row this app has actually confirmed against the chain.
function sigSlot(s) {
  const st = s.sigType || s.sig_type;
  if(st === 'approval' || st === 'sender') return senderSlot(s.signer);
  const raw = (s.sig || s.signature);
  if(!raw || raw.length !== 132) throw new Error(`Invalid signature length from ${s.signer}: expected 132 chars, got ${raw?.length}`);
  return raw.slice(2);
}

// An unbindable bundle is a decision, not a footnote.
//
// packSigsBound returns bound:false when the submitter did not sign, or when
// they hold an on-chain approval that makes their slot usable by anyone. Either
// way the bundle is inert in nobody's hands: an observer can lift it out of the
// mempool and replay it down the execute() route, where a cancel is *queued*
// for the full delay instead of running now — maturing after the transaction it
// was meant to stop, with the nonce already burnt so the real one reverts.
//
// This was reported with flash(), and the progress line that follows landed in
// the same tick and painted straight over it. The warning existed, was correct,
// and was on screen for microseconds. So it takes the same press-again shape as
// every other irreversible step in this interface: say it, and let the operator
// decide, rather than say it into a toast nobody can read.
let _unboundArmed = null, _unboundArmTimer = null;
const UNBOUND_ARM_MS = 12000;
function armUnbound(key, what, why) {
  if(_unboundArmed === key) { clearTimeout(_unboundArmTimer); _unboundArmed = null; return true; }
  clearTimeout(_unboundArmTimer);
  _unboundArmed = key;
  _unboundArmTimer = setTimeout(() => { _unboundArmed = null; }, UNBOUND_ARM_MS);
