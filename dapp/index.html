// Build a user-facing error for a failed critical write. `label` is shown in
// the flash; the underlying PostgREST error is attached for the console.
function dbError(label, err) {
  const detail = err && (err.message || err.status);
  return Object.assign(new Error(label), { shortMessage: label, dbDetail: detail });
}

// `chainId` is optional and defaults to the chain the app is pointed at, which is
// what every caller that registers a vault it is looking at wants. A deploy walk
// passes it explicitly: it is registering a vault on a chain it named, and the
// selected chain is a side effect of that walk rather than the fact being recorded.
async function dbRegisterWallet(addr, deployer, salt, ownerList, thresh, del, exec, block, txHash, name, labels, nonce, chainId) {
  const { data, error } = await sb.rpc('register_wallet', {
    p_chain_id: chainId || S.chainId, p_address: addr, p_deployer: deployer,
    p_salt: salt.toString(), p_owners: ownerList, p_threshold: thresh,
    p_delay: del, p_executor: exec, p_block: block, p_tx: txHash,
    p_name: name || null, p_labels: labels || null,
    p_nonce: nonce || 0
  });
  if(error) console.error('DB register:', error);
  return data;
}

// Matched case-insensitively on the address. A miss here is not harmless: the
// caller treats "no row" as "this vault has never been registered" and creates
// one, and `wallets` is unique on (chain_id, address) as a string — so the same
// vault reached by a differently-cased address got a second row, with its own
// id, its own queue and its own signatures. Two owners could then be looking at
// the same vault and coordinating in different places.
// Ordered oldest-first, because a database that already collected a duplicate
// pair still has to hand every owner the same one of them. maybeSingle() takes
// the first row, and unordered that is whatever the planner returned.
async function dbFindWallet(addr) {
  const { data } = await sb.from('wallets')
    .select('id, name, threshold, delay, nonce, executor, owner_count')
    .eq('chain_id', S.chainId).ilike('address', addr)
    .order('created_at', { ascending: true }).maybeSingle();
  return data;
}

// Likewise: this answers "which vaults am I an owner of", and an owner whose
// address is stored in a different case than their wallet reports would have
// been told they have none.
// Returns null — not [] — when the question could not be asked.
//
// The error was discarded here, so a cold-starting PostgREST, a 502, or four
// timed-out retries all came back as an empty list, and loadAllVaults cannot
// tell that apart from "this account owns no vaults". What the operator saw was
// a dashboard with nothing on it: not an error, not a spinner, just the absence
// of everything they came to look at, with no way to tell whether their vaults
// were gone or merely unreachable. An empty answer has to mean the service
// answered.
async function dbMyWallets(ownerAddr) {
  const { data, error } = await sb.from('my_wallets')
    .select('id, chain_id, address, name, threshold, owner_count')
    .ilike('owner', ownerAddr).eq('chain_id', S.chainId);
  if(error) { console.error('DB my wallets:', error); return null; }
  // One vault, one entry. A database that collected a duplicate pair before the
  // lookup above was case-blind would otherwise put the same vault on screen
  // twice, under two names, each with its own queue — which is a worse way to
  // find out about it than quietly showing the older of the two.
  const seen = new Set();
  return (data || []).filter(w => {
    const k = String(w.address || '').toLowerCase();
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

async function dbProposeTx(wId, nonce, target, value, callData, txHash, thresh, proposedBy, desc) {
  const { data, error } = await sb.rpc('propose_tx', {
    p_wallet_id: wId, p_chain_id: S.chainId, p_nonce: nonce,
    p_target: target, p_value: value.toString(), p_call_data: callData,
    p_tx_hash: txHash, p_threshold: thresh, p_proposed_by: proposedBy,
    p_description: desc
  });
  if(error) { console.error('DB propose:', error); throw dbError('PROPOSAL NOT SAVED', error); }
  // The current propose_tx cannot return nothing: it either hands back an id or
  // raises, and a nonce that already holds a proposal is fine — a nonce is
  // contested, not owned, which is why UNIQUE (wallet_id, nonce) was dropped.
  //
  // So a null id with no error does not mean what it used to say. It means the
  // deployed function is older than this client: the previous one ended in a
  // bare ON CONFLICT DO NOTHING, which swallowed that unique violation and
  // returned nothing, and the message it produced — "NONCE IN USE" — sent
  // everyone hunting for a nonce collision that was not the problem. Name the
  // real cause, because the fix is to re-apply db/schema.sql and nothing the
  // operator does in this interface will help.
  if(!data) { markSchemaStale('propose_tx returned no id'); throw dbError('PROPOSAL NOT SAVED — THE COORDINATION DATABASE IS RUNNING AN OLDER SCHEMA THAN THIS APP. RE-APPLY db/schema.sql.', null); }
  return data;
}

async function dbGetPending(wId) {

// How many retired rows are re-checked against the chain on every queue load.
// Bounded because it rides in a multicall and a busy vault's history is not:
// what is being looked for is a proposal that is *still queued on chain*, and
// one of those can only have been retired recently — every earlier one has been
// overtaken by the vault's own nonce many times over.
const TERMINAL_RECHECK = 40;

// The most recently retired proposals: cancelled, executed, or superseded.
// Read so the chain can be asked whether they really are gone — a status in this
// database is written by an RPC that authenticates by a claimed address, so it
// is a claim about the vault, not the vault. See loadVaultQueue.
async function dbGetRecentTerminal(wId, limit) {
  const { data } = await sb.from('tx_history')
    .select('id, nonce, target, value, call_data, status, description, eta, queue_tx')
    .eq('wallet_id', wId)
    .order('sort_ts', { ascending: false })
    .limit(limit || TERMINAL_RECHECK);
  return data || [];
}

async function dbGetTxByHash(txHash) {
  if(!txHash || txHash === '\u2014') return null;
  const { data } = await sb.from('transactions')
    .select('id, wallet_id, nonce, target, value, call_data, threshold, status')
    .eq('chain_id', S.chainId).eq('tx_hash', txHash).maybeSingle();
  return data;
}

// Signatures for one transaction. Its only callers are the cancel / reject /
// accelerate companion flows, and those companions are always signed off-chain
// with signTypedData — so an approval/sender row on one is either noise or
// someone taking advantage of add_signature() accepting unverified rows from
// anyone. Either way it cannot be checked here the way verifySigs checks an
// ECDSA sig, and counting it toward a threshold buys a reverted transaction at
// the submitter's expense. Drop it, and let verifySigs judge the rest.
async function dbGetSigs(txId) {
  const { data } = await sb.from('signatures')
    .select('signer, signature, sig_type')
    .eq('tx_id', txId)
    .order('signer', { ascending: true });
  return (data || []).filter(s => {
    const st = s.sig_type || s.sigType;
    return st !== 'approval' && st !== 'sender';
  });
}

// Batch variant: fetch signatures for many txs in ONE request instead of
// N per-tx round-trips. Returns a Map of tx_id → sorted signatures.
async function dbGetSigsByTxIds(txIds) {
  const map = new Map();
  if(!txIds.length) return map;
  txIds.forEach(id => map.set(id, []));
  const { data } = await sb.from('signatures')
    .select('tx_id, signer, signature, sig_type')
    .in('tx_id', txIds)
    .order('signer', { ascending: true });
  (data || []).forEach(s => {
    const arr = map.get(s.tx_id);
    if(arr) arr.push({ signer: s.signer, signature: s.signature, sig_type: s.sig_type });
  });
  return map;
}

// The four writes below all run AFTER a transaction has landed on chain, and
// every one of them discarded its result. That is how a database serving an
// older schema stayed invisible for weeks: mark_executed had lost its grant to
// anon — schema.sql DROPs and recreates it, which takes the grant with it — so
// every execution came back 403 and nothing recorded it, while the interface
// went on saying the action had succeeded. Which it had. That is exactly why
// these must not throw or flash a failure: the operator's transaction is
// mined and irreversible, and reporting it as failed would be a lie in the
// more alarming direction.
//
// What a failure here actually means is narrower: the record now lags the
// chain. It is self-healing — loadVaultQueue re-reads the vault and reconciles
// every row against it — so the honest report is a notice that says so, once,
// rather than one per call in a cascade.
let _dbLagWarnedAt = 0;
function dbWriteLagged(op, error) {
  console.error('DB ' + op + ':', error);
  const now = Date.now();
  if(now - _dbLagWarnedAt < 15000) return;
  _dbLagWarnedAt = now;
  flash('THE TRANSACTION LANDED ON CHAIN, BUT THE COORDINATION RECORD DID NOT UPDATE — IT WILL RESYNC ON RELOAD', 7000);
}

// Retire a proposal that never ran — its nonce was consumed by something else,
// or it left the on-chain queue by a route this client did not observe. NOT
// mark_executed with block 0, which is what this used to be: that wrote status
// 'executed', and the history ledger then showed a proposal that never happened
// under the same green tick as one that did. A queued row leaving the chain is
// the sharpest case — executed and cancelled are indistinguishable from here,
// and calling both "executed" picks the flattering one.
// Logged but never flashed: this is a background sweep that runs in a loop over
// every superseded row on each queue load, so a failure is neither the
// operator's doing nor anything they can act on — and one notice per swept row
// would bury the ones that matter. sb.rpc resolves with {error} rather than
// rejecting, so the caller's .catch() never saw these.
async function dbPruneTx(txId) {
  const { error } = await sb.rpc('prune_tx', { p_tx_id: txId, p_caller: window._connectedAddress });
  if(error) console.error('DB prune tx:', error);
}

// `state` is an already-loaded multicallLoad() result. Its only caller has one
// in hand — reloadVault reads the whole configuration at the top and then called
// this at the bottom, which read it again: a second aggregate3 plus a second
// getBalance against the same address, after every action, for numbers that were
// already sitting in a local. Still falls back to reading when nothing is passed.
async function dbSyncWalletState(vaultAddr, dbId, state) {
  if(!dbId || !vaultAddr || !window._connectedAddress) return;
  try {
    const s = state || await multicallLoad(vaultAddr);
    await sb.rpc('sync_wallet_state', {
      p_wallet_id: dbId,
      p_caller: window._connectedAddress,
      p_threshold: Number(s.threshold),
      p_owner_count: Number(s.ownerCount),
      p_delay: Number(s.delay),
      p_executor: s.executor,
      p_nonce: Number(s.nonce),
      p_owners: [...s.owners]
    });
  } catch(e) { console.error('DB sync:', e); }
}

// ── PRODUCTION: VAULT LOADING ─────────────────────────────────────

// Where a vault sits in S.vaults is not a property of the vault — the array is
// rebuilt from scratch every time the operator's wallet list is re-read. Any
// selection that has to survive one of those rebuilds is carried as an address
// and looked up again on the other side.
function reselect(list, prev) {
  const a = prev && prev.address ? String(prev.address).toLowerCase() : '';
  const i = a ? list.findIndex(v => v && v.address && v.address.toLowerCase() === a) : -1;
  return i === -1 ? 0 : i;
}

async function loadAllVaults() {
  if(S.demoMode) return;
  const addr = window._connectedAddress;
  if(!addr) return;
  const hadVaults = S.vaults.length > 0;
  if(!hadVaults) showLoading('LOADING VAULTS');
  try {
    const wallets = await dbMyWallets(addr);
    // Unreachable, not empty — see dbMyWallets. Leave whatever is on screen
    // exactly as it is and say what happened, rather than replacing it with the
    // one thing that looks like an answer and is not.
    if(wallets === null) {
      hideLoading();
      flash('COULD NOT REACH THE COORDINATION SERVICE — YOUR VAULTS ARE NOT LOST. RETRYING ON THE NEXT REFRESH.', 6000);
      render();
      return;
    }
    if(!wallets.length) {
      const kept = S.vaults.filter(v => v && v.address);
      S.sel = reselect(kept, S.vaults[S.sel]);
      S.vaults = kept;
      hideLoading();
      render();
      return;
    }
    const results = await Promise.allSettled(wallets.map(w => loadSingleVaultData(w.address, { id: w.id, name: w.name })));
    const vaults = results.filter(r => r.status === 'fulfilled' && r.value).map(r => r.value);
    results.filter(r => r.status === 'rejected').forEach(r => console.error('Load vault:', r.reason));
    // Decide what to keep against S.vaults as it is NOW. This filter used to be
    // built before the await above, from a list that did not yet contain a vault
    // a deep link was still resolving in parallel — so that vault was absent
    // from the "keep" set and was dropped on the floor when the array below was
    // rebuilt. Following a link and losing it a second later was this line.
    const loaded = new Set(vaults.map(v => String(v.address).toLowerCase()));
    const keep = S.vaults.filter(v => v && v.address && !loaded.has(v.address.toLowerCase()));
    // Selection is an index into the array this replaces, so it has to be
    // re-found by address. Whatever is on screen stays on screen: the vault a
    // link just opened, or another one clicked since. Selecting 0 moved the
    // visitor to an arbitrary vault a second or two after the right one arrived.
    const was = S.vaults[S.sel];
    S.vaults = [...keep, ...vaults];
    S.sel = reselect(S.vaults, was);
    const shown = S.vaults[S.sel];
    if(shown) {
      S.nt = shown.threshold;
      setNd(shown.delay);
    }
    hideLoading();
    render();
    // Load queues + history in background (single render after all complete)
    const snapshotVaults = S.vaults;
    Promise.all(S.vaults.map((_, i) => Promise.allSettled([loadVaultQueue(i), loadVaultHistory(i)])))
      .then(() => { if (S.vaults === snapshotVaults) render(); })
      .catch(e => { console.error('Background queue load:', e); if (S.vaults === snapshotVaults) render(); });
  } catch(e) {
    console.error('loadAllVaults:', e);
    hideLoading();
    flash('FAILED TO LOAD');
  }
}

// Is this vault's executor a TimelockExecutor, and is its fast path on?
//
// One eth_call, and it used to answer both questions from a single bare catch —
// so an RPC that was merely unreachable read exactly like an executor that is
// not a TimelockExecutor at all. That is not a cosmetic difference: `isTE` is
// what canForwardCancel() gates on, and it is the only route a queued proposal
// can be stopped through. A network blip therefore took the CANCEL button off
// every card, on a vault that could cancel perfectly well, and left the owners
// watching a proposal mature with no brake in sight and no error explaining it.
//
// A revert (or an answer that will not decode) is a real answer: whatever is at
// that address, it does not implement forwardEnabled, so it is not one. Anything
// else is silence, and silence falls back to the address itself — the canonical
// singleton is a TimelockExecutor whether or not this call got through. The fast
// path is reported off only, never on, from a failed read: the honest direction
// for an unknown is the one that offers no shortcut.
async function readExecutorState(executor, vaultAddr) {
  const off = { isTE: false, fpEnabled: false };
  if(!executor || executor === ethers.ZeroAddress) return off;
  try {
    const tl = new ethers.Contract(executor, TIMELOCK_EXECUTOR_ABI, provider);
    return { isTE: true, fpEnabled: await tl.forwardEnabled(vaultAddr) };
  } catch(e) {
    const code = e && e.code;
    const answered = code === 'CALL_EXCEPTION' || code === 'BAD_DATA';
    if(answered) return off;
    return { isTE: String(executor).toLowerCase() === TIMELOCK_EXECUTOR.toLowerCase(), fpEnabled: false, unread: true };
  }
}

async function loadSingleVaultData(addr, dbWallet) {
  // Re-read the vault's own name every time its data is loaded. This runs on
  // explicit loads — page load, chain switch, deep link, a deploy landing —
  // not on a poll, and the vault is already in the reverse-resolution batch
  // below, so it costs no extra round trip and it is the only thing that makes
  // a name claimed during this session show up without a reload.
  forgetOwnerName(addr);
  // Phase 1: RPC + DB lookup in parallel
  const [s, dbWFromQuery] = await Promise.all([
    multicallLoad(addr),
    dbWallet ? Promise.resolve(null) : dbFindWallet(addr)
  ]);
  let dbW = dbWallet || dbWFromQuery;

  // Auto-register vault in DB if not found (e.g. loaded by address)
  if(!dbW && window._connectedAddress) {
    try {
      const ownerList = [...s.owners];
      const dbId = await dbRegisterWallet(addr, window._connectedAddress, 0, ownerList, Number(s.threshold), Number(s.delay), s.executor, 0, '', null, null, Number(s.nonce));
      if(dbId) dbW = { id: dbId, name: null };
    } catch(e) { console.error('Auto-register vault:', e); }
  }

  // Phase 2: owner labels + executor check + token balances + owner names in parallel
  const [labelsRaw, fpResult, holdings, ownerNames, codeKind] = await Promise.all([
    dbW?.id ? dbGetOwnerLabels(dbW.id) : Promise.resolve([]),
    readExecutorState(s.executor, addr),
    loadTokenBalances(addr, s.balance),
    // The vault rides along in the owners' reverse-resolution batch: same
    // multicall, same forward verification, one more entry. A vault that has
    // claimed a name should read as that name in its own header, and paying a
    // separate round trip for it would have been the reason not to.
    resolveOwnerNames([...s.owners, addr]),
    // What is actually running at this address. A vault can arrive here from a
    // pasted address or a history row, and answering threshold()/getOwners()
    // proves only that something implements the shape — not that it is the
    // audited build. Checked once per load, on the chain the vault is read on.
    classifyVaultCode(addr)
  ]);

  const ownerLabels = {};
  labelsRaw.forEach(l => { if(l.label) ownerLabels[l.address.toLowerCase()] = l.label; });
  const you = window._connectedAddress;
  const owners = [...s.owners].map(o => ({
    addr: o,
    label: ownerLabels[o.toLowerCase()] || (o.toLowerCase() === you?.toLowerCase() ? 'YOU' : ''),
    name: ownerNames[o.toLowerCase()] || null,
    you: o.toLowerCase() === you?.toLowerCase()
  }));
  const { isTE, fpEnabled } = fpResult;

  return {
    id: dbW?.id || addr.slice(0,8),
    name: dbW?.name || (CHAINS[S.chainId]?.name || 'VAULT').toUpperCase() + '_' + addr.slice(2,6).toUpperCase(),
    chain: (CHAINS[S.chainId]?.name || 'Ethereum').toUpperCase(),
    address: addr,
    threshold: Number(s.threshold),
    ownerCount: Number(s.ownerCount),
    delay: Number(s.delay),
    nonce: Number(s.nonce),
    executor: s.executor,
    holdings: holdings,
    owners: owners,
    queue: [],
    history: [],
    dbId: dbW?.id || null,
    fastPath: fpEnabled,
    loadedOwners: [...s.owners],
    isTimelockExecutor: isTE,
    codeKind,
    wnsName: ownerNames[addr.toLowerCase()] || null,
  };
}

// The EIP-712 digest a proposal row actually has, derived from its own
// target/value/data/nonce rather than read from the tx_hash column beside them.
// That column is written by the same anon-callable propose_tx() as the rest of
// the row and is never checked against it, yet it is what a cancel is built
// around: cancelQueued() takes a hash, so a row carrying one that does not match
// its own fields would have co-signers approving the cancellation of something
// else entirely. It is also what the queued() lookup keys off, where a wrong
// hash reads as "no longer queued" and quietly prunes a live proposal.
// Returns null for a row whose fields cannot produce a digest at all.
function proposalDigest(v, t) {
  const wei = weiStr(t.value);
  if(wei === null || !v || !v.address || !ethers.isAddress(v.address)) return null;
  try {
    return ethers.TypedDataEncoder.hash(
      { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address },
      EIP712_TYPES,
      { target: t.target, value: BigInt(wei), data: t.call_data || '0x', nonce: t.nonce }
    );
  } catch(_) { return null; }
}

// Which stored approval/sender rows the vault might actually be holding an
// approval for — one {id, hash, signer} per row worth asking about.
function approvalPairsFor(txs, sigMap, digests) {
  const pairs = [];
  for(const t of txs) {
    const hash = digests.get(t.id);
    if(!hash) continue;
    for(const s of (sigMap.get(t.id) || [])) {
      const st = s.sig_type || s.sigType;
      if(st !== 'approval' && st !== 'sender') continue;
      if(!s.signer || !ethers.isAddress(s.signer)) continue;
      pairs.push({ id: t.id, hash, signer: s.signer });
    }
  }
  return pairs;
}

// Both of the questions the queue has to put to the vault, in one round trip:
// which digests it still holds queued, and which of the stored approval rows it
// actually confirms.
//
// These were two aggregate3 calls in series — the approvals one could not even
// start until the signatures came back from the database — against the same
// contract, through the same batching primitive, on every queue load and after
// every action. There was never a reason for them to be two.
//
// An approval row is not a signature. It is a *claim* that an owner registered
// approval in the vault itself, and verifySigs takes it on trust because "the
// contract validates those". The contract does, at execute time; nothing
// validates it here. add_signature() runs as the anon role and checks only that
// the claimed signer is an owner, so anyone at all can mark any owner as having
// approved any proposal — and the queue would show a quorum that does not
// exist, right up until whoever acted on it paid gas for a transaction the
// vault rejects. So: ask the vault.
//
// A row that cannot be confirmed is not counted, and a read that fails outright
// confirms nothing. That direction is deliberate: under-reporting shows an owner
// who really did approve as un-signed, which costs them one harmless re-approve
// and repairs itself on the next load; over-reporting shows a quorum that is not
// there, and the only way to find out is to send the transaction. Likewise a
// failed read leaves `queued` empty, which means nothing is pruned — an
// unreachable chain is not evidence that a proposal has gone.
async function chainCheckQueue(v, queuedTxs, pairs) {
  const out = { queued: {}, approved: new Set() };
  if(!v || !v.address || !ethers.isAddress(v.address)) return out;
  if(!queuedTxs.length && !pairs.length) return out;
  const calls = [
    ...queuedTxs.map(q => ({ target: v.address, allowFailure: true,
      callData: msIface.encodeFunctionData('queued', [q.hash]) })),
    ...pairs.map(p => ({ target: v.address, allowFailure: true,
      callData: msIface.encodeFunctionData('approved', [p.signer, p.hash]) })),
  ];
  let res;
  try { res = await getMC3().aggregate3(calls); }
  catch(e) { console.error('Queue/approval verification:', e); return out; }
  queuedTxs.forEach((q, i) => {
    const r = res[i];
    if(!r || !r.success) return;
    try { out.queued[q.id] = Number(msIface.decodeFunctionResult('queued', r.returnData)[0]); } catch(_) {}
  });
  pairs.forEach((p, i) => {
    const r = res[queuedTxs.length + i];
    if(!r || !r.success) return;
    try {
      if(msIface.decodeFunctionResult('approved', r.returnData)[0])
        out.approved.add(p.id + '|' + p.signer.toLowerCase());
    } catch(_) {}
  });
  return out;
}

async function loadVaultQueue(vi) {
  const v = S.vaults[vi];
  if(!v || !v.dbId) return;
  try {
    // The live rows, and the recently-retired ones — because a retired row is a
    // claim, not a fact.
    //
    // Every status write in this database goes through an RPC that authenticates
    // by a *claimed* address: cancel_tx, prune_tx, mark_executed and mark_queued
    // all check `is_wallet_owner(wallet, p_caller)` against a string the caller
    // supplies, and an owner's address is public — it is in the `owners` table,
    // which anon may read, and it is on chain regardless. So one anonymous HTTP
    // request can flip any live proposal to cancelled / executed / stale.
    // dbGetPending filters on status, so the proposal then leaves every owner's
    // queue while it sits on chain, maturing, executable by anyone once it does.
    // That is the exact failure this interface refuses to commit itself (see
    // prodCancel: "recording one that did not happen is the single most damaging
    // thing this interface can get wrong") — it just could not be committed on
    // its behalf.
    //
    // It cannot be fixed in the database: PostgREST has no session here and
    // Postgres cannot recover a secp256k1 signature, so `p_caller` can never be
    // more than a claim. It can be fixed by not believing it. A proposal the
    // vault still holds queued is live no matter what any row says, and the
    // vault is already being asked about the queued ones — so ask it about the
    // retired ones too, in the same call, and put back anything it still has.
    const [pending, retired] = await Promise.all([
      dbGetPending(v.dbId),
      dbGetRecentTerminal(v.dbId, TERMINAL_RECHECK),
    ]);
    const txs = pending;
    const you = window._connectedAddress;
    const queue = [];

    // Every digest, derived from each row's own fields rather than read out of
    // the tx_hash column beside them — see proposalDigest. Computed once, up
    // front, because both the on-chain reads below key off it.
    const digests = new Map();
    txs.forEach(t => digests.set(t.id, proposalDigest(v, t)));
    retired.forEach(t => digests.set(t.id, proposalDigest(v, t)));

    const sigMap = await dbGetSigsByTxIds([...txs.map(t => t.id), ...retired.map(t => t.id)]);

    // One aggregate3 for both questions — see chainCheckQueue. The retired rows
    // ride in the same `queued()` batch as the live ones; a nonzero eta on one
    // of them is the vault contradicting the record.
    // Queueing goes through execute(), which consumes the nonce before it writes
    // the entry — so anything the vault still holds queued has a nonce strictly
    // below the live one. A retired row at or above it was never queued and
    // cannot be, which takes most of them out of the batch for free.
    // Every live row is asked about, not only the ones claiming to be queued.
    // The extra answers are what let an unsigned row be dropped below without
    // guessing: `queued()` returning zero is the vault saying "I am not holding
    // this", which is a different fact from never having asked. They ride in an
    // aggregate3 that is being made anyway, one call each.
    const askQueued = [
      ...txs.filter(t => digests.get(t.id)),
      ...retired.filter(t => digests.get(t.id) && t.nonce < v.nonce),
    ].map(t => ({ id: t.id, hash: digests.get(t.id) }));
    const chain = await chainCheckQueue(v, askQueued, approvalPairsFor(txs, sigMap, digests));
    const onchainQueued = chain.queued;
    const approvedOnChain = chain.approved;

    // Anything the vault still holds goes back in the queue, flagged, so the
    // owners can see it and stop it. Its recorded status is left alone: this
    // client is not the one that wrote it and has no way to tell a forgery from
    // an honest write it simply did not observe, and overwriting the row would
    // only start a fight with whoever is writing it.
    for(const t of retired) {
      if(!onchainQueued[t.id]) continue;
      t.eta = onchainQueued[t.id];
      t.orphanedFrom = t.status;
      t.status = 'queued';
      txs.push(t);
    }

    // Track stale txs to clean up in DB
    const staleTxIds = [];

    // Build accelerate/cancel/reject sig counts: map original nonce → set of signers.
    //
    // Every one of these signatures is VERIFIED against the companion row's own
    // digest before it is counted, exactly as an ordinary proposal's are below.
    // They used to be counted by presence alone — a row in `signatures` naming
    // an owner was a signature — and add_signature() runs as anon and checks
    // only that the named address is an owner. So anyone at all could post rows
    // naming every owner on a `Cancel #N` companion. The count is what drives
    // the buttons: a forged "signed by you" HIDES the CANCEL button from the
    // owner it names (txSt suppresses it once you have signed), and a forged
    // quorum shows a brake that is ready to pull and reverts when pulled.
    // Anyone can still create a companion row; nobody can put a signature in it
    // that this does not check.
    //
    // The row also has to be one the flow could actually submit. All three run
    // through executor.forward(), which hashes against the LIVE nonce — so a
    // companion at any other nonce is unusable however many valid signatures it
    // carries, and advertising it would promise a quorum that cannot be packed.
    // Same for its shape: a self-call carrying the selector its kind implies.
    const companionShape = {
      'Accelerate #': SEL.executeQueued,
      'Cancel #':     SEL.cancelQueued,
      'Reject #':     '',                  // a bare no-op self-call: no calldata
    };
    const cOwners = v.loadedOwners || v.owners.map(o => o.addr);
    const cDomain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    // lowercased owner address → the owner key `approvals` is filed under. Built
    // once; the proposal loop below needs it for every row.
    const addrKey = {};
    v.owners.forEach(o => addrKey[o.addr.toLowerCase()] = o.addr);
    const companionSigners = (t, kind) => {
      if(t.nonce !== v.nonce) return null;
      if(!t.target || !v.address || t.target.toLowerCase() !== v.address.toLowerCase()) return null;
      if(weiStr(t.value) !== '0') return null;
      const want = companionShape[kind];
      const data = t.call_data || '0x';
      if(want === '' ? data !== '0x' : selOf(data) !== want) return null;
      const usable = (sigMap.get(t.id) || [])
        .filter(s => { const st = s.sig_type || s.sigType; return st !== 'approval' && st !== 'sender'; });
      const msg = { target: t.target, value: 0n, data, nonce: t.nonce };
      return new Set(
        verifySigs(usable, cDomain, EIP712_TYPES, msg, cOwners).map(s => String(s.signer).toLowerCase())
      );
    };
    const accelSigs = {}, cancelSigs = {}, rejectSigs = {};
    const companionInto = { 'Accelerate #': accelSigs, 'Cancel #': cancelSigs, 'Reject #': rejectSigs };
    for(let ti = 0; ti < txs.length; ti++) {
      const t = txs[ti];
      const kind = t.description && Object.keys(companionShape).find(k => t.description.startsWith(k));
      if(!kind) continue;
      const origNonce = parseInt(t.description.slice(kind.length));
      if(isNaN(origNonce)) continue;
      const signers = companionSigners(t, kind);
      // Several rows can now claim the same kind and nonce — the unique
      // constraint that made a nonce exclusive is gone, because it was what
      // stopped a companion coexisting with the proposal it acts on. Keep the
      // strongest verified set rather than whichever row was read last, so a
      // planted empty row cannot mask a real one behind it.
      if(signers && signers.size >= ((companionInto[kind][origNonce] || new Set()).size))
        companionInto[kind][origNonce] = signers;
    }

    for(let ti = 0; ti < txs.length; ti++) {
      const t = txs[ti];

      // Prune proposed txs whose nonce is behind on-chain nonce (already
      // consumed) — unless the vault is still holding this one queued.
      //
      // A queued proposal ALWAYS has a nonce below the live one: execute()
      // consumes the nonce before it writes the queue entry. So the rows this
      // prunes are exactly the rows that could be queued, and the only thing
      // saying they are not is `status`, which mark_queued() writes on the word
      // of a caller-supplied address like everything else in this database.
      // Flip one live proposal back to 'proposed' with an anonymous request and
      // it left every owner's queue while sitting on chain, maturing, executable
      // by anyone the moment it matured. The vault gets asked now, and it is
      // asked before the record is believed.
      if(t.status === 'proposed' && t.nonce < v.nonce) {
        if(!onchainQueued[t.id]) { staleTxIds.push(t.id); continue; }
        t.eta = onchainQueued[t.id];
        t.orphanedFrom = t.status;
        t.status = 'queued';
      }

      // Skip accelerate/cancel/reject companions — they aggregate sigs separately
      if(t.description && (t.description.startsWith('Accelerate #') || t.description.startsWith('Cancel #') || t.description.startsWith('Reject #'))) continue;

      // Prune queued txs that are no longer queued on-chain (executed or cancelled externally)
      if(t.status === 'queued' && t.id in onchainQueued) {
        if(onchainQueued[t.id] === 0) {
          staleTxIds.push(t.id);
          continue;
        }
        // Update ETA if on-chain differs from DB
        if(onchainQueued[t.id] !== (t.eta || 0)) {
          t.eta = onchainQueued[t.id];
        }
      }

      // A value the vault could never execute is a row that cannot correspond to
      // anything real. Skip it rather than let BigInt() throw out of this loop
      // and take every other proposal in the queue with it.
      const rawValue = weiStr(t.value);
      if(rawValue === null) { console.warn('Skipping proposal with an unusable value:', t.id, t.value); continue; }

      // Same treatment for a row whose fields cannot produce a digest at all —
      // an unparseable target, calldata that is not hex. This used to fall back
      // to the tx_hash column (`digests.get(t.id) || t.tx_hash`), which handed
      // the row back the one thing proposalDigest exists to stop it asserting:
      // tx_hash is written by the same anon-callable propose_tx as the rest of
      // the row and is never checked against it, and it is what a cancel is
      // built around. A row that cannot be hashed cannot be executed either, so
      // there is nothing to show.
      const digest = digests.get(t.id);
      if(!digest) { console.warn('Skipping proposal with no derivable digest:', t.id, t.target); continue; }

      // Drop approval/sender rows the vault does not actually confirm — see
      // chainCheckQueue. Done here rather than inside verifySigs so the
      // filtered list is also what lands in tx.signatures, and therefore what
      // collectSigs later packs into a transaction.
      const sigs = (sigMap.get(t.id) || []).filter(s => {
        const st = s.sig_type || s.sigType;
        if(st !== 'approval' && st !== 'sender') return true;
        return approvedOnChain.has(t.id + '|' + String(s.signer).toLowerCase());
      });
      // Verify each stored sig against THIS tx's digest before counting it as
      // an approval. add_signature runs as anon with ON CONFLICT DO UPDATE, so
      // anyone can overwrite a stored sig with garbage. Verifying here means a
      // corrupted sig shows its owner as un-signed (prompting a re-sign, which
      // repairs the row) rather than a false "approved" that fails at execute
      // time.
      // cOwners / cDomain are the same owner set and the same EIP-712 domain the
      // companion scan above built; they do not vary per row, and rebuilding
      // them (and the address-case map) once per proposal was work done N times
      // for one answer.
      const sigMsg = { target: t.target, value: BigInt(rawValue), data: t.call_data || '0x', nonce: t.nonce };
      const validSigs = verifySigs(sigs, cDomain, EIP712_TYPES, sigMsg, cOwners);

      // A proposal nobody can be shown to have raised is not shown.
      //
      // propose_tx() authenticates its caller by a string the caller supplies —
      // is_wallet_owner(wallet, p_proposed_by) against an owner list that is
      // public on chain and anon-readable here — so one unauthenticated HTTP
      // request puts a row in this queue naming any owner as its author. It
      // cannot be signed into existence by the forger: every signature counted
      // above is recovered against this row's own digest and matched to a
      // current owner. But it renders, and a plausible row sitting in the queue
      // beside the real ones, apparently raised by a co-signer, only has to be
      // convincing for as long as it takes somebody to press SIGN. That is the
      // whole of the attack, and it needs the row to be visible.
      //
      // The test is the vault's own answer, not the record's. `queued()`
      // returning zero is the vault saying it is not holding this proposal;
      // undefined is a read that did not happen, and hiding a live proposal on
      // the strength of a failed read is the one direction that must never be
      // taken — a queued proposal is executable by anyone the moment it matures,
      // and its signatures can be deleted by the same anonymous request that
      // wrote the row. So: drop only what the chain positively disclaims AND no
      // owner has signed.
      //
      // A genuine proposal is unsigned for the width of one await — dbProposeTx
      // then dbAddSig — so a second client polling in that window will not see
      // it, and will on the next poll. Nothing is lost; it arrives late.
      if(!validSigs.length && onchainQueued[t.id] === 0) {
        console.warn('Hiding unsigned proposal (no valid owner signature, not queued on chain):', t.id, t.target);
        continue;
      }

      const approvals = {};
      v.owners.forEach(o => approvals[o.addr] = false);
      validSigs.forEach(s => { const k = addrKey[s.signer.toLowerCase()]; if(k) approvals[k] = true; });

      const dataLabel = selectorToLabel(t.call_data);

      const ethVal = rawValue !== '0' ? ethers.formatEther(BigInt(rawValue)) : '0';
      const value = ethVal === '0' ? '0' : ethVal;
      const token = (t.call_data === '0x' || !t.call_data) && ethVal !== '0' ? 'ETH' : '';
      let displayValue = value, displayToken = token, displayTo = null, slowDelay = 0;
      // Flag a stake from the call shape, so proposals raised outside this UI
      // are labelled the same way.
      const isStake = S.chainId === STAKE_CHAIN_ID && ethVal !== '0' && isStakeCall(t.target, t.call_data);
      // Decode a SLOW deposit so the queue shows the asset and the real
      // recipient rather than "0 → the SLOW contract".
      if(dataLabel === 'SLOW TRANSFER' && t.call_data && t.call_data.length >= 10) {
        try {
          const [tk, to, amt, delay] = slowIface.decodeFunctionData('depositTo', t.call_data);
          const isEth = tk === ethers.ZeroAddress;
          const info = isEth ? { symbol:'ETH', decimals:18 }
            : (PROD_TOKENS[S.chainId] || ETH_ONLY).find(x => x.address.toLowerCase() === tk.toLowerCase())
              || customTokensFor(S.chainId, v.address).find(x => x.address.toLowerCase() === tk.toLowerCase());
          if(info) {
            // ETH rides in msg.value; the encoded amount is zero for that path.
            displayValue = fmtAmount(isEth ? BigInt(rawValue) : BigInt(amt), info.decimals);
            displayToken = info.symbol;
          }
          displayTo = to;
          slowDelay = Number(delay);
        } catch(_) {}
      }
      // Decode ERC20 transfer amount and recipient for display
      if(dataLabel === 'ERC20 TRANSFER' && t.call_data && t.call_data.length >= 10) {
        try {
          const decoded = erc20Iface.decodeFunctionData('transfer', t.call_data);
          const allTokens = PROD_TOKENS[S.chainId] || ETH_ONLY;
          const tokenInfo = allTokens.find(tk => tk.address.toLowerCase() === t.target.toLowerCase());
          if(tokenInfo && decoded[1] != null) {
            displayValue = ethers.formatUnits(decoded[1], tokenInfo.decimals);
            displayToken = tokenInfo.symbol;
            displayTo = decoded[0];
          }
        } catch(_) {}
      }
      queue.push({
        nonce: t.nonce,
        target: t.target,
        displayTo: displayTo,
        displayValue: displayValue,
        displayToken: displayToken,
        value: value,
        token: token,
        dataLabel: dataLabel,
        slowDelay: slowDelay,
        isStake: isStake,
        eta: t.eta || 0,
        approvals: approvals,
        dbId: t.id,
        txHash: digest,
        queueTx: t.queue_tx || null,
        callData: t.call_data,
        rawValue: rawValue,
        signatures: sigs.map(s => ({signer: s.signer, sig: s.signature, sigType: s.sig_type})),
        // Set only when the vault contradicted the record — see the retired-row
        // re-check above. The card says so; nothing else about the proposal is
        // treated differently, because nothing else about it is different.
        orphanedFrom: t.orphanedFrom || null,
        accelSigners: accelSigs[t.nonce] || null,
        cancelSigners: cancelSigs[t.nonce] || null,
        rejectSigners: rejectSigs[t.nonce] || null
      });
    }
    v.queue = queue;

    // Background: retire superseded rows so they don't reappear. Recorded as
    // 'stale' rather than executed — see dbPruneTx. Owner-gated server-side, so
    // this is a no-op for someone merely viewing a vault they are not part of.
    if(staleTxIds.length && window._connectedAddress) {
      for(const id of staleTxIds) {
        dbPruneTx(id).catch(e => console.error('Prune stale tx:', e));
      }
    }
  } catch(e) {
    console.error('loadVaultQueue:', e);
  }
}

async function loadVaultHistory(vi) {
  const v = S.vaults[vi];
  if(!v || !v.dbId) return;
  try {
    const rows = await dbGetHistory(v.dbId, 50);
    v.history = rows.map(t => {
      const act = selectorToLabel(t.call_data);
      const hv = weiStr(t.value);
      const ethVal = (hv !== null && hv !== '0') ? ethers.formatEther(BigInt(hv)) : null;
      // Split when the line is ours to split: a derived "0.4 ETH → 0x12ab" has a
      // figure to veil, a description the user typed is arbitrary text and is left whole.
      const derived = !t.description && !!ethVal;
      const desc = t.description || (ethVal ? `${ethVal} ETH → ${t.target.slice(0,6)}...` : act);
      const ts = t.executed_at || t.cancelled_at;
      const age = ts ? fmtAge(new Date(ts)) : '';
      return { nonce: t.nonce, act, desc, status: t.status, age, executionTx: t.execution_tx,
        amt: derived ? `${ethVal} ETH` : null, descRest: derived ? `→ ${t.target.slice(0,6)}...` : null };
    });
  } catch(e) {
    console.error('loadVaultHistory:', e);
  }
}

function fmtAge(d) {
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if(s < 60) return '<1M';
  if(s < 3600) return Math.floor(s/60) + 'M';
  if(s < 86400) return Math.floor(s/3600) + 'H';
  return Math.floor(s/86400) + 'D';
}

async function reloadQueue(vi) {

async function reloadVault(vi) {
  const v = S.vaults[vi];
  if(!v) return;
  try {
    const s = await multicallLoad(v.address);
    v.threshold = Number(s.threshold);
    v.ownerCount = Number(s.ownerCount);
    v.delay = Number(s.delay);
    v.nonce = Number(s.nonce);
    v.executor = s.executor;
    const you = window._connectedAddress;
    // Preserve existing labels + resolved names (avoids display flicker)
    const oldLabels = {}, oldNames = {};
    v.owners.forEach(o => { if(o.label) oldLabels[o.addr.toLowerCase()] = o.label; if(o.name) oldNames[o.addr.toLowerCase()] = o.name; });
    if(v._pendingLabel && v._pendingLabel.label) {
      oldLabels[v._pendingLabel.addr] = v._pendingLabel.label;
    }
    v.owners = [...s.owners].map(o => ({
      addr: o,
      label: oldLabels[o.toLowerCase()] || (o.toLowerCase() === you?.toLowerCase() ? 'YOU' : ''),
      name: oldNames[o.toLowerCase()] || null,
      you: o.toLowerCase() === you?.toLowerCase()
    }));
    v.loadedOwners = [...s.owners];
    // Persist pending label to DB then clear it
    if(v._pendingLabel && v._pendingLabel.label && v.dbId) {
      const pl = v._pendingLabel;
      const match = v.owners.find(o => o.addr.toLowerCase() === pl.addr);
      if(match) dbUpdateOwnerLabel(v.dbId, match.addr, pl.label);
    }
    delete v._pendingLabel;
    // Executor check + token balances + queue + history + owner names in parallel
    const [fpResult, holdings, , , ownerNames, slowOut] = await Promise.all([
      readExecutorState(s.executor, v.address),
      loadTokenBalances(v.address, s.balance),
      loadVaultQueue(vi),
      loadVaultHistory(vi),
      resolveOwnerNames([...s.owners]),
      loadSlowOutbound(v.address)
    ]);
    v.owners.forEach(o => { if(ownerNames[o.addr.toLowerCase()]) o.name = ownerNames[o.addr.toLowerCase()]; });
    v.isTimelockExecutor = fpResult.isTE;
    v.fastPath = fpResult.fpEnabled;
    v.holdings = holdings;
    v.slowOut = slowOut;
    if(v.dbId) dbSyncWalletState(v.address, v.dbId, s);
    render();
  } catch(e) {
    console.error('reloadVault:', e);
    flash('RELOAD FAILED');
  }
}
