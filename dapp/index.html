function proceedDeploy(){ if(S.deploy){ S.deploy.phase='deploying'; render(); runDeploy(); } }
async function retryChain(k){
  if(!S.deploy || _deployWalkBusy()) return;
  const run = S.deploy.run;
  S.deploy.done = false; S.deploy.halted = null; render();
  _deployWalkingRun = run;
  try {
    const r = await deployOnChain(k);
    if(!_deployLive(run)) return;
    // Same reasoning as the run loop: a wallet-level refusal is a halt, and it has
    // to be recorded as one here too — otherwise _finishDeploy reads the run as
    // merely finished and sends another switch prompt at someone who just declined.
    if(r === 'blocked') S.deploy.halted = { at:k, name:S.deploy.chains[k].name, reason:S.deploy.steps[k].err || 'WALLET DECLINED' };
    await _finishDeploy();
  } finally { if(_deployWalkingRun === run) _deployWalkingRun = 0; }
}
// Pick the walk back up where it stopped. A halted run leaves chains it never
// reached sitting at 'pending', and clearing the failed rows it did reach is what
// makes one button mean "carry on" — the alternative is retrying each remaining
// chain by hand, in order, which is the stall this is here to end.
async function resumeDeploy(){
  const d = S.deploy;
  // Checked here as well as in runDeploy: this rewrites the step rows before it
  // hands over, and doing that against a walk already in flight would clear the
  // status of a chain that walk is mid-way through.
  if(!d || _deployWalkBusy()) return;
  d.steps.forEach(s => { if(s.status === 'failed'){ s.status='pending'; s.err=null; s.blocked=false; } });
  d.done = false;
  await runDeploy();
}

// ── PRODUCTION: SIGN ──────────────────────────────────────────────

function senderSig(addr) {
  // Encode as r=addr (left-padded), s=0, v=0 — contract interprets as msg.sender approval
  return '0x' + addr.slice(2).toLowerCase().padStart(64, '0') + '0'.repeat(64) + '00';
}

async function prodSign(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';
    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const msg = { target, value, data, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);

    // Update local state
    tx.approvals[connectedAddress] = true;
    if(!tx.signatures) tx.signatures = [];
    const existing = tx.signatures.findIndex(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(existing >= 0) tx.signatures[existing] = {signer: connectedAddress, sig, sigType: 'ecdsa'};
    else tx.signatures.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
    tx.signatures.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    // Persist to DB
    if(tx.dbId) {
      await dbAddSig(tx.dbId, connectedAddress, sig);
    } else if(v.dbId) {
      const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);
      const txId = await dbProposeTx(v.dbId, nonce, target, value.toString(), data, txHash, v.threshold, connectedAddress);
      if(txId) {
        tx.dbId = txId;
        tx.txHash = txHash;
        await dbAddSig(txId, connectedAddress, sig);
      }
    }

    flash(`SIGNED #${nonce} (OFF-CHAIN)`);
    render();
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'SIGN FAILED');
  }
}

async function prodApprove(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    // Compute the EIP-712 hash to approve on-chain
    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';
    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const hash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, { target, value, data, nonce });

    const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);
    flash('APPROVING ON-CHAIN...');
    const atx = await ms.approve(hash, true);
    const receipt = await atx.wait();

    // Persist as sender-sig so it survives reload and is usable for submit
    const approvalSig = senderSig(connectedAddress);
    if(!tx.signatures) tx.signatures = [];
    const existing = tx.signatures.findIndex(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(existing >= 0) tx.signatures[existing] = {signer: connectedAddress, sig: approvalSig, sigType: 'approval'};
    else tx.signatures.push({signer: connectedAddress, sig: approvalSig, sigType: 'approval'});
    tx.signatures.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);
    if(tx.dbId) {
      await dbAddSig(tx.dbId, connectedAddress, approvalSig, 'approval');
    } else if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, value.toString(), data, hash, v.threshold, connectedAddress);
      if(txId) { tx.dbId = txId; tx.txHash = hash; await dbAddSig(txId, connectedAddress, approvalSig, 'approval'); }
    }

    // Track in approvals table
    if(v.dbId) await dbRecordApproval(v.dbId, S.chainId, connectedAddress, hash, true, Number(receipt.blockNumber), receipt.hash);

    tx.approvals[connectedAddress] = true;
    // An on-chain approval is readable by anyone, so the slot it fills is no
    // longer bound to whoever submits — the protection that stops a collected
    // bundle being replayed into execute() and queued. It survives if the
    // owner who finally submits has *not* approved on-chain: their slot stays
    // sender-only, and a copier is left one signature short. So a vault can run
    // with no coordination service at all and keep the binding, as long as the
    // last owner submits rather than approving.
    flash(`APPROVED #${nonce} (ON-CHAIN) — LET AN OWNER WHO HAS NOT APPROVED SUBMIT IT, SO THE BUNDLE STAYS BOUND TO THEM`);
    render();
  } catch(e) {
    console.error(e);
    flash(msErr(e, 'APPROVE FAILED'));
  }
}

async function prodUnsign(vi, nonce) {
  const connectedAddress = window._connectedAddress;
  if(!connectedAddress) return;
  const signer = window._signer;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  // Check if this was an on-chain approval — if so, revoke it on-chain
  const mySig = tx.signatures?.find(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
  const wasOnchainApproval = mySig && (mySig.sigType === 'approval' || mySig.sigType === 'sender');
  if(wasOnchainApproval && signer) {
    // This branch sends a transaction, so it needs the same chain check every
    // other sending path gets from requireSigner — a revoke aimed at whatever
    // occupies this address on the wallet's chain is not a revoke.
    if(!requireSigner()) return;
    try {
      const target = tx.target;
      const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
      const data = tx.callData || '0x';
      const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
      const hash = tx.txHash || ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, { target, value, data, nonce });
      const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);
      flash('REVOKING ON-CHAIN...');
      const atx = await ms.approve(hash, false);
      const receipt = await atx.wait();
      if(v.dbId) await dbRecordApproval(v.dbId, S.chainId, connectedAddress, hash, false, Number(receipt.blockNumber), receipt.hash);
    } catch(e) {
      console.error('Revoke approval:', e);
      flash(msErr(e, 'REVOKE FAILED'));
      return;
    }
  }

  // Remove from local state
  tx.approvals[connectedAddress] = false;
  if(tx.signatures) {
    tx.signatures = tx.signatures.filter(s => s.signer.toLowerCase() !== connectedAddress.toLowerCase());
  }

  // Remove from DB
  if(tx.dbId) await dbRemoveSig(tx.dbId, connectedAddress);

  flash(wasOnchainApproval ? `REVOKED #${nonce} (ON-CHAIN)` : `UNSIGNED #${nonce}`);
  render();
}

// Same slot rules as packSigsBound — see sigSlot. An approval/sender row's
// stored bytes are anon-writable and are not what the contract reads anyway, so
// the slot is rebuilt from the signer rather than copied out of the database.
function packSigs(sigs) {
  let packed = '0x';
  for(const s of sigs) packed += sigSlot(s);
  return packed;
}

function collectSigs(tx, v, connectedAddress) {
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
  const msg = { target: tx.target, value, data: tx.callData || '0x', nonce: tx.nonce };
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);
  let sigs = verifySigs(tx.signatures || [], domain, EIP712_TYPES, msg, ownerAddrs);
  const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
  const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
  if(callerIsOwner && !callerHasSigned) {
    sigs = [...sigs, {signer: connectedAddress, sig: senderSig(connectedAddress), sigType: 'sender'}];
  }
  sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);
  return { sigs, domain, msg, ownerAddrs };
}

function verifySigs(sigs, domain, types, msg, owners) {
  const ownerSet = new Set(owners.map(o => o.toLowerCase()));
  const seen = new Set();
  const verified = [];
  for(const s of sigs) {
    const key = s.signer.toLowerCase();
    if(seen.has(key)) continue;
    // Sender/approval sigs (on-chain approvals) — trust them, contract validates
    const st = s.sigType || s.sig_type;
    if(st === 'approval' || st === 'sender') {
      if(ownerSet.has(key)) { seen.add(key); verified.push(s); }
      continue;
    }
    // Verify ECDSA sigs client-side
    try {
      const sigData = s.sig || s.signature;
      const recovered = ethers.verifyTypedData(domain, types, msg, sigData);
      if(recovered.toLowerCase() === key && ownerSet.has(key)) {
        seen.add(key);
        verified.push(s);
      } else {
        console.warn(`Sig verification failed for ${s.signer}: recovered ${recovered}`);
      }
    } catch(e) {
      console.warn(`Invalid sig from ${s.signer}:`, e.message);
    }
  }
  return verified;
}

// Read the wallet's current on-chain nonce. execute() and executor.forward()
// both hash the tx against the live nonce, so off-chain sigs made over a
// different nonce silently fail — check up front for a clear message.
async function fetchLiveNonce(vAddr) {
  const ms = new ethers.Contract(vAddr, MULTISIG_ABI, provider);
  return Number(await ms.nonce());
}

// What the VAULT said happened, as opposed to what was in the receipt.
//
// ethers matches a log to an ABI event on topic0 alone, and these loops used to
// run over every log a transaction produced. Any contract the vault calls can
// emit `Queued(bytes32,uint256,uint256)` with a hash of its choosing, and a
// `Queued(h, _, 0)` is how a cancellation announces itself — so a hostile call
// target could name another live proposal and have this interface record it
// cancelled in the coordination database while it sat on chain, maturing, gone
// from every owner's queue. Filtering on the emitting address closes that, and
// gives the confirmations below something real to check against: every status
// write that follows is driven by an event the vault itself emitted.
function vaultLogs(receipt, vAddr) {
  const self = String(vAddr || '').toLowerCase();
  const out = [];
  for(const log of (receipt && receipt.logs) || []) {
    if(!log || !log.address || log.address.toLowerCase() !== self) continue;
    try { const p = msIface.parseLog(log); if(p) out.push(p); } catch(_) {}
  }
  return out;
}
const _sameHash = (a, b) => !!a && !!b && String(a).toLowerCase() === String(b).toLowerCase();
// cancelQueued emits Queued(hash, 0, 0) — the eta of zero is what distinguishes
// a cancellation from a queueing.
function sawCancelled(receipt, vAddr, hash) {
  return vaultLogs(receipt, vAddr).some(p =>
    p.name === 'Queued' && Number(p.args[2]) === 0 && _sameHash(p.args[0], hash));
}
function sawExecuted(receipt, vAddr, hash) {
  return vaultLogs(receipt, vAddr).some(p =>
    p.name === 'ExecutionSuccess' && _sameHash(p.args[0], hash));
}
// The eta a Queued(hash, nonce, eta) carries for this hash, or 0 for none.
function sawQueuedEta(receipt, vAddr, hash) {
  const hit = vaultLogs(receipt, vAddr).find(p =>
    p.name === 'Queued' && Number(p.args[2]) > 0 && _sameHash(p.args[0], hash));
  return hit ? Number(hit.args[2]) : 0;
}

async function prodSubmit(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';

    const { sigs } = collectSigs(tx, v, connectedAddress);

    // Sigs are made over tx.nonce; execute()/forward() hash against the live
    // nonce, so a stale entry would revert opaquely — surface it clearly.
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== nonce) {
      flash('NONCE CHANGED — RELOADING');
      await reloadVault(vi);
      return;
    }

    const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);

    // Check for cancel-via-executor or forward path
    const isCancelCall = v.isTimelockExecutor
      && target.toLowerCase() === v.address.toLowerCase()
      && selOf(data) === SEL.cancelQueued;
    const canCancel = isCancelCall && sigs.length >= v.threshold;
    if(!canCancel && sigs.length < v.threshold) {
      flash(`NEED ${v.threshold - sigs.length} MORE VALID SIG${v.threshold - sigs.length > 1 ? 'S' : ''}`);
      return;
    }

    let atx;
    if(canCancel) {
      const executorAddr = v.executor;
      const tlContract = new ethers.Contract(executorAddr, TIMELOCK_EXECUTOR_ABI, signer);
      // Audit H-01 — a cancel raised as an ordinary proposal reaches the same
      // forward() route, so it needs the same binding. Trimmed with pickSigs
      // rather than a bare slice, exactly as prodCancel does: the bundle has to
      // come down to `threshold` slots, and a plain slice drops whichever sigs
      // sort last — which is the submitter's own about (threshold/ownerCount)
      // of the time, and the submitter's slot is the one carrying the binding.
      const bnd = await packSigsBound(pickSigs(sigs, v.threshold, connectedAddress), connectedAddress, v.address, tx.txHash);
      if(!bnd.bound && !armUnbound(`submit-cancel|${v.address}|${nonce}`, 'THIS CANCEL', bnd.why)) return;
      flash('CANCELLING VIA EXECUTOR...');
      atx = await tlContract.forward(v.address, target, value, data, bnd.packed);
    } else {
      // Contract requires exactly threshold * 65 bytes of sigs
      const packedSigs = packSigs(sigs.slice(0, v.threshold));
      flash('SUBMITTING TX...');
      atx = await ms.execute(target, value, data, packedSigs);
    }

    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    // Parse events \u2014 only the vault's own, and only for this proposal's digest.
    // See vaultLogs: matching on topic0 across every log in the receipt let a
    // call target forge these.
    for(const parsed of vaultLogs(receipt, v.address)) {
      if(parsed.name === 'ExecutionSuccess' && _sameHash(parsed.args[0], tx.txHash)) {
        flash(`EXECUTED #${nonce}`);
        if(tx.dbId) await dbMarkExecuted(tx.dbId, Number(receipt.blockNumber), receipt.hash);
      }
      if(parsed.name === 'Queued') {
        const eta = Number(parsed.args[2]);
        if(eta === 0) {
          // A cancellation, naming the hash it removed. The row it points at is
          // looked up by that hash, so it is only acted on when the vault itself
          // announced it \u2014 and only for a proposal on this vault.
          const cancelledDbTx = await dbGetTxByHash(parsed.args[0]);
          if(cancelledDbTx && cancelledDbTx.wallet_id === v.dbId) {
            flash('CANCELLED QUEUED TX');
            await dbCancelTx(cancelledDbTx.id, connectedAddress);
          }
        } else if(_sameHash(parsed.args[0], tx.txHash)) {
          tx.eta = eta;
          tx.queueTx = receipt.hash;
          flash(`QUEUED #${nonce} \u2014 ETA: ${new Date(eta*1000).toLocaleString()}`);
          if(tx.dbId) await dbMarkQueued(tx.dbId, eta, Number(receipt.blockNumber), receipt.hash);
        }
      }
    }

    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(msErr(e, 'SUBMIT FAILED'));
  }
}

async function prodExecute(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';

    const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);
    flash('EXECUTING QUEUED TX...');
    const atx = await ms.executeQueued(target, value, data, nonce);
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    // Ask the vault what happened, exactly as the executor routes do. A mined
    // receipt is not evidence: a call to an address holding no code does not
    // revert, it is an ordinary transaction to an empty account — which is what
    // this is on a chain the vault was never cloned to, or against an address
    // that was pasted rather than deployed. This path was the one terminal
    // write that trusted the receipt, and recording an execution that did not
    // happen retires the proposal from every owner's queue while it sits on
    // chain, matured and executable by anyone.
    if(!sawExecuted(receipt, v.address, tx.txHash)) {
      flash(`THE VAULT DID NOT REPORT #${nonce} AS EXECUTED — NOTHING RECORDED. RELOADING.`);
      await reloadVault(vi);
      return;
    }
    if(tx.dbId) await dbMarkExecuted(tx.dbId, Number(receipt.blockNumber), receipt.hash);

    // Detect a cancel, which announces itself as Queued(hash, 0, 0). Read from
    // the vault's own logs only — see vaultLogs — and acted on only when the row
    // it names belongs to this vault.
    for(const parsed of vaultLogs(receipt, v.address)) {
      if(parsed.name === 'Queued' && Number(parsed.args[2]) === 0) {
        const cancelledDbTx = await dbGetTxByHash(parsed.args[0]);
        if(cancelledDbTx && cancelledDbTx.wallet_id === v.dbId) await dbCancelTx(cancelledDbTx.id, connectedAddress);
      }
    }

    flash(`EXECUTED #${nonce}`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(msErr(e, 'EXECUTE FAILED'));
  }
}

async function prodFastExecute(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  try {
    const { sigs } = collectSigs(tx, v, connectedAddress);

    if(sigs.length < v.ownerCount) {
      flash(`NEED ALL ${v.ownerCount} SIGS FOR INSTANT EXECUTE (HAVE ${sigs.length})`);
      return;
    }

    // forward() hashes against the live nonce — bail early if it moved.
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== nonce) {
      flash('NONCE CHANGED — RELOADING');
      await reloadVault(vi);
      return;
    }

    const target = tx.target;
    const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
    const data = tx.callData || '0x';
    const tlContract = new ethers.Contract(v.executor, TIMELOCK_EXECUTOR_ABI, signer);
    // Audit H-01 — bind to this submitter. Copied, this bundle would queue the
    // transaction through execute() and burn the nonce instead of running it.
    const bnd = await packSigsBound(sigs, connectedAddress, v.address, tx.txHash);
    if(!bnd.bound && !armUnbound(`fast|${v.address}|${nonce}`, 'THIS INSTANT EXECUTE', bnd.why)) return;
    flash('INSTANT EXECUTING VIA EXECUTOR...');
    const atx = await tlContract.forward(v.address, target, value, data, bnd.packed);
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    // Record what the vault reported, not what the route was meant to do. A
    // mined transaction is not evidence on its own: `v.executor` is read off
    // chain but the call to it is not, and an executor that is not a
    // TimelockExecutor can absorb forward() without doing anything.
    if(!sawExecuted(receipt, v.address, tx.txHash)) {
      flash(`THE VAULT DID NOT REPORT #${nonce} AS EXECUTED — NOTHING RECORDED. RELOADING.`);
      await reloadVault(vi);
      return;
    }
    if(tx.dbId) await dbMarkExecuted(tx.dbId, Number(receipt.blockNumber), receipt.hash);
    flash(`INSTANT EXECUTED #${nonce} VIA EXECUTOR`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(msErr(e, 'FAST EXECUTE FAILED'));
  }
}

async function prodCancel(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  // No executor, no in-window brake — see canForwardCancel. Refused here as well
  // as hidden in the UI, because this is reachable by deep link and by a stale
  // render, and the failure it prevents is the one that reports success.
  if(!canForwardCancel(v)) {
    flash('NO TIMELOCK EXECUTOR ON THIS VAULT — A CANCEL CANNOT BE FORWARDED, AND ONE RAISED AS AN ORDINARY PROPOSAL WOULD ITSELF BE QUEUED FOR THE FULL DELAY');
    return;
  }

  // Cancel via executor.forward() — only needs threshold sigs, no forwardEnabled required
  // This bypasses the nonce queue entirely
  const target = tx.target;
  const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
  const data = tx.callData || '0x';
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  // tx.txHash is the digest loadVaultQueue derived from the row's own fields —
  // never the tx_hash column beside them, which nothing checks against the row.
  // Recomputed here only for a queue entry built somewhere other than that path.
  const origTxHash = tx.txHash || ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, { target, value, data, nonce });
  const cancelData = msIface.encodeFunctionData('cancelQueued', [origTxHash]);
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);

  try {
    // The nonce is not negotiable and is never read from a row: forward() hashes
    // against the vault's LIVE nonce, so that is the only nonce a cancel can be
    // signed over. This used to adopt whatever nonce the stored companion
    // carried — and `description` is an anon-writable column, so a single
    // planted row reading `Cancel #N` pinned every owner's signature to a nonce
    // the executor would never hash, permanently. (The self-heal did not fire:
    // it required the row to hold signatures, and a planted row holds none.)
    // An existing companion is reused only if it is at that same live nonce.
    const cancelNonce = v.nonce;
    const msg = { target: v.address, value: 0n, data: cancelData, nonce: cancelNonce };
    const cancelTxHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    // Found by digest, not by description. The digest is derived here from the
    // cancel this flow is about to build, so the row it matches can only be the
    // companion for exactly that cancel — where `description` is free text any
    // anonymous caller can write, and matching on it is what let a planted row
    // be adopted in the first place. Description is still written, for the queue
    // to attribute the companion to the proposal it acts on; it is no longer
    // trusted to identify one.
    let existingSigs = [];
    let existingTxId = null;
    if(v.dbId) {
      const { data: rows } = await sb.from('transactions')
        .select('id')
        .eq('wallet_id', v.dbId)
        .eq('tx_hash', cancelTxHash)
        .in('status', ['proposed', 'executing'])
        .limit(1);
      if(rows?.length) {
        existingTxId = rows[0].id;
        existingSigs = verifySigs(await dbGetSigs(existingTxId), domain, EIP712_TYPES, msg, ownerAddrs);
      }
    }

    // Add caller's sig
    let sigs = [...existingSigs];
    const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
    const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(callerIsOwner && !callerHasSigned) {
      const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
      sigs.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
      if(v.dbId) {
        if(!existingTxId) {
          existingTxId = await dbProposeTx(v.dbId, cancelNonce, v.address, '0', cancelData, cancelTxHash, v.threshold, connectedAddress, `Cancel #${nonce}`);
        }
        if(existingTxId) await dbAddSig(existingTxId, connectedAddress, sigs[sigs.length-1].sig);
      }
    }
    sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    if(sigs.length < v.threshold) {
      flash(`SIGNED CANCEL (${sigs.length}/${v.threshold}) — NEED ${v.threshold} SIGS`);
      await reloadQueue(vi);
      return;
    }

    // Verify nonce still matches on-chain
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== cancelNonce) {
      flash('NONCE CHANGED — RESIGNING NEEDED');
      if(existingTxId) {
        await dbCancelTx(existingTxId, connectedAddress);
      }
      await reloadQueue(vi);
      return;
    }

    // Threshold met — execute via forward()
    const tlContract = new ethers.Contract(v.executor, TIMELOCK_EXECUTOR_ABI, signer);
    // Audit H-01 — bind the bundle to this submitter. A cancel is the one call
    // that must not be replayable down the execute() route: queued instead of
    // immediate, it matures after the transaction it was meant to stop.
    // Trimmed to exactly threshold: the route requires that byte length, and a
    // tight bundle is also what makes the binding airtight — one slot bound
    // leaves threshold-1 usable signatures, one short of what execute() needs.
    const bnd = await packSigsBound(pickSigs(sigs, v.threshold, connectedAddress), connectedAddress, v.address, cancelTxHash);
    if(!bnd.bound && !armUnbound(`cancel|${v.address}|${nonce}`, 'THIS CANCEL', bnd.why)) return;
    flash('CANCELLING VIA EXECUTOR...');
    const atx = await tlContract.forward(v.address, v.address, 0n, cancelData, bnd.packed);
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    // The vault has to say it dropped this exact hash before anything is written
    // down. Nothing else here proves it: a transaction that mines is not a
    // cancellation, and recording one that did not happen is the single most
    // damaging thing this interface can get wrong — the proposal leaves every
    // owner's queue while it goes on maturing on chain, executable by anyone.
    if(!sawCancelled(receipt, v.address, origTxHash)) {
      flash(`THE VAULT DID NOT REPORT #${nonce} AS CANCELLED — IT IS STILL QUEUED. NOTHING RECORDED.`);
      await reloadVault(vi);
      return;
    }

    if(v.dbId) {
      if(existingTxId) await dbMarkExecuted(existingTxId, Number(receipt.blockNumber), receipt.hash);
      if(tx.dbId) {
        await dbCancelTx(tx.dbId, connectedAddress);
      }
    }
    flash(`CANCELLED #${nonce} VIA EXECUTOR`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(msErr(e, 'CANCEL FAILED'));
  }
}

// Skip a stuck proposal so later ones can proceed. Because execution is
// strictly sequential by nonce, a proposal that can't reach threshold blocks
// everything behind it. REJECT signs a no-op self-call (execute(self,0,0x)) at
// that same nonce; once threshold owners sign it, submitting consumes the nonce
// and unblocks the queue. The payload moves nothing and is bound to this nonce.
async function prodReject(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  const rejectNonce = nonce;   // == the stuck proposal's (and live) on-chain nonce
  const rejectData = '0x';     // no-op self-call
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);

  // The head of the queue is not always at the live nonce: the proposal that was
  // there can be executed, cancelled or overtaken by another client, leaving the
  // next one along in front with a nonce the vault has not reached. execute()
  // hashes against the live nonce, so signatures made over any other one are
  // unusable — and this used to collect a full quorum of them before finding
  // out, then report it as "NONCE CHANGED" as though something had moved. Say
  // it before the first wallet prompt, and name the nonce a reject would have
  // to be raised at instead.
  if(typeof v.nonce === 'number' && rejectNonce !== v.nonce) {
    flash(`#${nonce} IS NOT AT THE VAULT'S LIVE NONCE (${v.nonce}) — A REJECT SIGNED HERE COULD NEVER EXECUTE. RELOADING.`, 6000);
    await reloadVault(vi);
    return;
  }

  try {
    const msg = { target: v.address, value: 0n, data: rejectData, nonce: rejectNonce };
    const rejectTxHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    // Aggregate any existing companion, found by its digest rather than by the
    // anon-writable description — same reasoning as prodCancel.
    let existingSigs = [];
    let existingTxId = null;
    if(v.dbId) {
      const { data: rows } = await sb.from('transactions')
        .select('id')
        .eq('wallet_id', v.dbId)
        .eq('tx_hash', rejectTxHash)
        .in('status', ['proposed', 'executing'])
        .limit(1);
      if(rows?.length) {
        existingTxId = rows[0].id;
        existingSigs = verifySigs(await dbGetSigs(existingTxId), domain, EIP712_TYPES, msg, ownerAddrs);
      }
    }

    let sigs = [...existingSigs];
    const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
    const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(callerIsOwner && !callerHasSigned) {
      const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
      sigs.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
      if(v.dbId) {
        if(!existingTxId) {
          existingTxId = await dbProposeTx(v.dbId, rejectNonce, v.address, '0', rejectData, rejectTxHash, v.threshold, connectedAddress, `Reject #${nonce}`);
        }
        if(existingTxId) await dbAddSig(existingTxId, connectedAddress, sigs[sigs.length-1].sig);
      }
    } else if(!callerIsOwner) {
      flash('ONLY OWNERS CAN REJECT'); return;
    }
    sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    if(sigs.length < v.threshold) {
      flash(`SIGNED REJECT (${sigs.length}/${v.threshold}) — NEED ${v.threshold} SIGS`);
      await reloadQueue(vi);
      return;
    }

    // Sigs are over rejectNonce; execute() hashes against the live nonce.
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== rejectNonce) {
      flash('NONCE CHANGED — RELOADING');
      await reloadVault(vi);
      return;
    }

    const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);
    flash('REJECTING — SKIPPING NONCE...');
    const atx = await ms.execute(v.address, 0n, rejectData, packSigs(sigs.slice(0, v.threshold)));
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    // The nonce is consumed either way — execute() increments it before it does
    // anything else — so the queue is unblocked whichever branch the vault took.
    // But on a timelocked vault this route QUEUES the no-op rather than running
    // it, and recording that as executed would put a live queued entry in the
    // history ledger and out of the queue. Record what actually happened.
    const rejEta = sawQueuedEta(receipt, v.address, rejectTxHash);
    if(v.dbId && existingTxId) {
      if(rejEta) await dbMarkQueued(existingTxId, rejEta, Number(receipt.blockNumber), receipt.hash);
      else if(sawExecuted(receipt, v.address, rejectTxHash)) await dbMarkExecuted(existingTxId, Number(receipt.blockNumber), receipt.hash);
    }
    // Retire the skipped proposal. cancel_tx used to no-op on anything that was
    // not already queued — which is every proposal this path ever retires — so
    // the row lingered until the queue loader swept it up.
    if(v.dbId && tx.dbId) await dbCancelTx(tx.dbId, connectedAddress);
    flash(rejEta ? `REJECTED #${nonce} — NONCE SKIPPED (THE NO-OP IS QUEUED)` : `REJECTED #${nonce} — NONCE SKIPPED`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(msErr(e, 'REJECT FAILED'));
  }
}

// ── PROPOSAL SIMULATION (walletchan-style, adapted for a smart-contract wallet) ──

// contract, so its real batch() / isValidSignature run as-is, and a self-call

}
function _simTx(v, tx) {

  // resolve to a symbol there rather than to its own truncated address.

  const meta = {}, unknown = [];
  for(const token of tokens) {
    const known = listed.find(t => t.address.toLowerCase() === token);
    if(known) { meta[token] = { symbol: known.symbol, decimals: known.decimals }; continue; }
    const ck = S.chainId + ':' + token;
    if(_tokenMetaCache[ck]) { meta[token] = _tokenMetaCache[ck]; continue; }
    unknown.push(token);
  }
  if(unknown.length) {
    try {
      const calls = [];

        calls.push({ target: token, allowFailure: true, callData: erc20Iface.encodeFunctionData('symbol') });
        calls.push({ target: token, allowFailure: true, callData: erc20Iface.encodeFunctionData('decimals') });

        _tokenMetaCache[S.chainId + ':' + token] = m;
        meta[token] = m;

async function _assetsFromLogs(logs, self) {

  const items = {};    // "token:id" -> { token, id, delta } for NFTs and 1155s
  const bumpItem = (token, id, amt) => {

    if(token === _NATIVE_SENTINEL) token = ethers.ZeroAddress.toLowerCase();
    if(topics[0] === _TRANSFER_TOPIC && topics.length >= 3) {
      const fromA = _logAddr(topics[1]), toA = _logAddr(topics[2]);
      if(fromA !== selfLc && toA !== selfLc) continue;
      if(topics.length >= 4) {
        // ERC-721: the id is the third indexed field, and one unit moves.
        let id; try { id = BigInt(topics[3]).toString(); } catch(_) { continue; }

        if(toA === selfLc) bumpItem(token, id, 1n);

      const fromA = _logAddr(topics[2]), toA = _logAddr(topics[3]);
      if(fromA !== selfLc && toA !== selfLc) continue;
      let ids, vals;
      try {
        const single = topics[0] === _TRANSFER_SINGLE_TOPIC;
        const d = abi.decode(single ? ['uint256','uint256'] : ['uint256[]','uint256[]'], log.data);

        vals = single ? [d[1]] : d[1];

      ids.forEach((id, k) => {
        const amt = BigInt(vals[k] ?? 0n);
        if(amt === 0n) return;
        if(fromA === selfLc) bumpItem(token, id.toString(), -amt);
        if(toA === selfLc) bumpItem(token, id.toString(), amt);

    }

    ...fungible.map(token => ({ symbol: meta[token].symbol, decimals: meta[token].decimals, delta: deltas[token] })),
    ...moved.map(it => ({ symbol: meta[it.token].symbol, decimals: 0, delta: it.delta, id: it.id, nft: true })),

    ${sim.basic ? '<span class="sim-tag" title="This RPC does not support eth_simulateV1 — the call was checked for revert only, with no balance trace">REVERT-CHECK ONLY</span>' : ''}
    ${opts.rerun ? `<button class="sim-x" onclick="${opts.rerun}" title="Run again against the latest block">&#8635;</button>` : ''}
    ${opts.dismiss ? `<button class="sim-x" onclick="${opts.dismiss}" title="Dismiss">&#10005;</button>` : ''}

  </div>`;

async function prodAccelerate(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  const target = tx.target;
  const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
  const data = tx.callData || '0x';

  // Accelerate uses executor.forward() with a self-call to executeQueued
  // This requires unanimous (all owners) signatures, same as instant execute
  // forward() hashes with the live nonce, so all signers must agree on the same nonce
  const accelData = msIface.encodeFunctionData('executeQueued', [target, value, data, nonce]);
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);

  try {
    // Live nonce only, and the companion is found by its digest — same reasoning
    // as prodCancel: forward() hashes against the live nonce, so no other nonce
    // can produce a usable signature, and `description` is an anon-writable
    // column that must not decide which row a signature lands in.
    const accelNonce = v.nonce;
    const msg = { target: v.address, value: 0n, data: accelData, nonce: accelNonce };
    const accelTxHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    let existingSigs = [];
    let existingTxId = null;
    if(v.dbId) {
      const { data: rows } = await sb.from('transactions')
        .select('id')
        .eq('wallet_id', v.dbId)
        .eq('tx_hash', accelTxHash)
        .in('status', ['proposed', 'executing'])
        .limit(1);
      if(rows?.length) {
        existingTxId = rows[0].id;
        existingSigs = verifySigs(await dbGetSigs(existingTxId), domain, EIP712_TYPES, msg, ownerAddrs);
      }
    }

    // Add caller's sig
    let sigs = [...existingSigs];
    const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
    const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(callerIsOwner && !callerHasSigned) {
      const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
      sigs.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
      // Store sig in DB
      if(v.dbId) {
        if(!existingTxId) {
          existingTxId = await dbProposeTx(v.dbId, accelNonce, v.address, '0', accelData, accelTxHash, v.ownerCount, connectedAddress, `Accelerate #${nonce}`);
        }
        if(existingTxId) await dbAddSig(existingTxId, connectedAddress, sig);
      }
    }
    sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    if(sigs.length < v.ownerCount) {
      flash(`SIGNED ACCELERATE (${sigs.length}/${v.ownerCount}) — NEED ALL OWNERS`);
      await reloadQueue(vi);
      return;
    }

    // Verify nonce still matches on-chain before executing
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== accelNonce) {
      flash('NONCE CHANGED — RESIGNING NEEDED');
      // Invalidate stale sigs in DB
      if(existingTxId) {
        await dbCancelTx(existingTxId, connectedAddress);
      }
      await reloadQueue(vi);
      return;
    }

    // All sigs collected — execute via forward()
    const tlContract = new ethers.Contract(v.executor, TIMELOCK_EXECUTOR_ABI, signer);
    // Audit H-01 — same binding. A copied accelerate bundle routed through
    // execute() queues the acceleration behind the delay it meant to skip and
    // burns the nonce, so the real one reverts.
    const bnd = await packSigsBound(sigs, connectedAddress, v.address, accelTxHash);
    if(!bnd.bound && !armUnbound(`accel|${v.address}|${nonce}`, 'THIS ACCELERATE', bnd.why)) return;
    flash('ACCELERATING VIA EXECUTOR...');
    const atx = await tlContract.forward(v.address, v.address, 0n, accelData, bnd.packed);
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    // executeQueued emits ExecutionSuccess for the ACCELERATED proposal's own
    // digest — that is the confirmation, not the outer call's. Without it the
    // queued proposal would be recorded executed while it is still waiting.
    if(!sawExecuted(receipt, v.address, tx.txHash)) {
      flash(`THE VAULT DID NOT REPORT #${nonce} AS EXECUTED — IT IS STILL QUEUED. NOTHING RECORDED.`);
      await reloadVault(vi);
      return;
    }

    if(v.dbId) {
      if(existingTxId) await dbMarkExecuted(existingTxId, Number(receipt.blockNumber), receipt.hash);
      if(tx.dbId) await dbMarkExecuted(tx.dbId, Number(receipt.blockNumber), receipt.hash);
    }
    flash(`ACCELERATED #${nonce} VIA EXECUTOR`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(msErr(e, 'ACCELERATE FAILED'));
  }
}

async function prodSubmitTransfer() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;

  // State first, DOM second — the same order buildSimInput() uses, and for the
  // same reason: oninput writes every keystroke into S and every render writes
  // S back into the field, so reading the two in a different order is the one
  // way this could simulate one transaction and propose another.
  const amt = stripCommas(S.txAmount || document.getElementById("tx-amount")?.value || "0");
  const to = (S.txTo || document.getElementById("tx-to")?.value || "").trim();
  if(!to || !amt) { flash('FILL IN AMOUNT AND RECIPIENT'); return; }

  try {
    const toAddr = assertPreviewed(to, await resolveName(to), S.chainId);
    // Audit L-2. The factory and the implementation hold no withdrawal path, so
    // anything sent there is burnt. Both are printed in this UI and on every
    // deploy receipt, which makes them exactly the kind of address that gets
    // pasted into a recipient field by mistake.
    const burn = lockedDest(toAddr);
    if(burn) { flash(`REFUSED — ${burn} CANNOT SEND FUNDS BACK OUT`); return; }
    const tokenInfo = curTok(v);
    const isEth = tokenInfo.address === ethers.ZeroAddress;
    const amountRaw = isEth ? ethers.parseEther(amt) : ethers.parseUnits(amt, tokenInfo.decimals);

    let target, value, data, desc;
    if(S.txSlow && slowAvailable()) {
      // SLOW delivery: build the depositTo call (plus an atomic approve batch
      // for ERC20 when the vault's allowance to SLOW falls short).
      ({ target, value, data, desc } = await buildSlowOutbound({
        tokenInfo, toAddr, amountRaw, delaySec: S.txSlowDelaySec, vaultAddr: v.address,
      }));
    } else if(isEth) {
      target = toAddr;
      value = amountRaw.toString();
      data = '0x';
      desc = `${amt} ETH \u2192 ${toAddr.slice(0,8)}...`;
    } else {
      target = tokenInfo.address;
      value = '0';
      data = erc20Iface.encodeFunctionData('transfer', [toAddr, amountRaw]);
      desc = `${amt} ${tokenInfo.symbol} \u2192 ${toAddr.slice(0,8)}...`;
    }

    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target, value: BigInt(value), data, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, value, data, txHash, v.threshold, connectedAddress, desc);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`TX #${nonce} CREATED`);
    S.showTx = false;
    resetTxFields();
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}

// Identity: claim a free id.wei subdomain for the vault, and point reverse
// resolution at it. Both calls are made by the vault, which is the whole point
// — a name minted by the operator and transferred afterwards would be a second
// transaction, a second chance to get the recipient wrong, and a window where
// the name belongs to a person rather than to the multisig.
async function prodSubmitName() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;
  if(S.chainId !== WNS_CHAIN_ID){ flash('WNS NAMES ARE ETHEREUM MAINNET ONLY'); return; }

  try {
    // Re-asked here rather than trusted from the form. The gap between reading
    // a name as free and signing for it is however long the operator took, and
    // a register() that reverts does not just fail — it consumes the nonce it
    // was proposed at and blocks everything queued behind it until the vault
    // burns that nonce with a no-op.
    const label = asciiLower(String(S.wnsLabel || '').trim());
    if(!wnsLabelValid(label)) { flash('ENTER A VALID NAME'); return; }
    const fresh = await wnsLookup(label, v.address);
    // The form's cached answer is now the stale one; replace it rather than
    // just dropping it, so a re-render does not fire a third lookup for a
    // question this call already answered.
    S.wnsAv[wnsAvKey(label, v.address)] = {
      state: fresh.free === true ? 'free' : fresh.free === false ? 'taken' : 'unknown', holder: fresh.holder };
    const ownedNow = fresh.free === false && fresh.holder
      && fresh.holder.toLowerCase() === v.address.toLowerCase();
    if(fresh.free === null) { flash('COULD NOT CHECK THE NAME ON MAINNET — TRY AGAIN'); return; }
    if(fresh.free === false && !ownedNow) { flash(`${wnsFullName(label).toUpperCase()} HAS JUST BEEN CLAIMED — PICK ANOTHER`); return; }

    const calls = wnsClaimCalls(label, { primary: !!S.wnsPrimary, registerToo: fresh.free === true });
    if(!calls.length) { flash('NOTHING TO PROPOSE — THE VAULT ALREADY HOLDS THIS NAME'); return; }
    const plan = { label, full: wnsFullName(label), registerToo: fresh.free === true, calls };
    const p = buildWnsProposal(v, plan);

    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target: p.target, value: 0n, data: p.data, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, p.target, '0', p.data, txHash, v.threshold, connectedAddress, p.desc);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`TX #${nonce} CREATED`);
    S.showTx = false;
    resetTxFields();
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}
