          <div class="token-pills" style="margin-bottom:0">${SLOW_PRESETS.map(p=>`<button class="pill${Number(S.txSlowDelaySec)===p.s?" on":""}" onclick="setSlowDelay(${p.s})">${p.l}</button>`).join("")}</div>
          <div class="slow-custom">
            <label class="slow-custom-l" for="slow-custom-n">CUSTOM</label>
            <input class="inp" id="slow-custom-n" style="flex:1" inputmode="decimal" placeholder="0" onchange="onSlowCustom()" onkeydown="if(event.key==='Enter'){event.preventDefault();onSlowCustom()}">
            <select class="slow-unit" id="slow-custom-u" aria-label="Delay unit" onchange="onSlowCustom()">
              <option value="h"${S.txSlowUnit==="h"?" selected":""}>HOURS</option>
              <option value="d"${S.txSlowUnit==="d"?" selected":""}>DAYS</option>
            </select>
          </div>
          <div class="slow-note" style="margin-top:12px">RECIPIENT GETS A TIME-LOCKED CLAIM &mdash; CLAIMABLE AFTER <b>${esc(fmtDelay(S.txSlowDelaySec))}</b>, AND THE VAULT CAN REVERSE IT ANY TIME BEFORE THEN.${S.txToken!=="ETH"?` ALLOWANCE TO SLOW IS BATCHED IN ATOMICALLY IF NEEDED.`:``}</div>
        </div>`:``}
      </div>`;
    body=`<div class="send-grid">
      <div>
        <div class="fset">
          <div class="fhead"><span class="lbl" id="lbl-token">TOKEN</span>${hold?`<span class="fhint privg"${pgAttrs()}>VAULT HOLDS <b><span class="priv">${esc(hold.balance)}</span> ${esc(S.txToken)}</b>${hold.usd?` &middot; <span class="priv">${esc(hold.usd)}</span>`:''}</span>`:`<span class="fhint">NO ${esc(S.txToken)} BALANCE</span>`}</div>
          <div class="token-pills" style="margin-bottom:0" role="group" aria-labelledby="lbl-token">${tokenObjs.map(t=>`<button class="pill${S.txToken===t.symbol?" on":""}"${S.txToken===t.symbol?' aria-current="true"':''} onclick="selectTxToken('${jstr(t.symbol)}')"><span class="tok-ico">${t.icon||iconForSym(t.symbol)}</span>${esc(t.symbol)}</button>`).join("")}${S.demoMode?"":`<button class="pill" onclick="S.showCustomTok=!S.showCustomTok;render()">+ CUSTOM</button>`}</div>
          ${(!S.demoMode&&S.showCustomTok)?`<div style="margin-top:12px"><div style="display:flex;gap:8px"><input class="inp" id="custom-tok-addr" style="margin:0;flex:1;min-width:0;font-size:13px" placeholder="0x... TOKEN ADDRESS" aria-label="Custom token address" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomTokenFlow()}"><button class="btn btn-outline btn-sm" onclick="addCustomTokenFlow()">ADD</button></div>${(()=>{const cl=customTokensFor(S.chainId,v.address);return cl.length?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${cl.map(t=>`<span class="ctok-chip">${tokIcon(t.symbol,'sm')} ${esc(t.symbol)} <span class="dim">${t.decimals}d</span><button onclick="removeCustomTokenFlow('${t.address}')" aria-label="Remove ${esc(t.symbol)}" title="Remove ${esc(t.symbol)}">&#10005;</button></span>`).join('')}</div>`:''})()}
          <div style="font-size:9px;color:var(--d);letter-spacing:1px;line-height:1.5;margin-top:8px">SAVED TO THIS BROWSER FOR THIS VAULT &mdash; AVAILABLE FOR TOP UPS TOO</div></div>`:''}
        </div>

        <div class="fset privg">
          <div class="fhead"><label class="lbl" for="tx-amount">AMOUNT</label><span class="fhint priv" id="tx-units"></span></div>
          <div class="amt">
            <input class="amt-in priv" id="tx-amount" inputmode="decimal" placeholder="0.0" aria-describedby="tx-units tx-amount-usd tx-amount-warn" value="${esc(S.txAmount)}" oninput="onTxAmount(this.value,${dec},${availNum},'${esc(unitLabel)}')" onkeydown="if(event.key==='Enter'){event.preventDefault();submitTransfer()}">
            <span class="amt-tok">${tokIcon(S.txToken)}${esc(S.txToken)}</span>
          </div>
          <div class="amt-foot">
            <span class="amt-usd priv" id="tx-amount-usd" data-rate="${rate||0}"></span>
            ${availNum>0?`<span class="qbtns">${[['25%',.25],['50%',.5],['MAX',1]].map(([l,f])=>`<button class="qbtn" onclick="fillTxPct(${f},'${availStr}',${dec},${availNum},'${esc(unitLabel)}')">${l}</button>`).join('')}</span>`:''}
            <span class="amt-warn" id="tx-amount-warn"></span>
          </div>
        </div>

        <div class="fset">
          <div class="fhead"><label class="lbl" for="tx-to">RECIPIENT</label><span class="fhint" id="tx-to-status" role="status"></span></div>
          <input class="inp" id="tx-to" style="margin-bottom:0" placeholder="0x... or name.eth / name.(g)wei" aria-describedby="tx-to-status" value="${esc(S.txTo)}" oninput="onTxRecipient(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();submitTransfer()}">
        </div>

        ${slowUi}
      </div>
      <div>
        <div class="review">
          <div class="review-h"><span>REVIEW</span><span class="review-tag">NONCE #${nextNonce(v)}</span></div>
          <div id="tx-review">${txReviewBody(v)}</div>
        </div>
        <button class="btn btn-fill btn-w btn-big" id="tx-submit" style="margin-top:14px" onclick="submitTransfer()">SIGN + SUBMIT</button>
        <div class="review-miss" id="tx-ready-note"></div>
      </div></div>`;
  }else if(S.txMode==="STAKE"){
    // One field. The proposal is a bare ETH transfer to wstETH, so the rest of
    // the tab is spent making it obvious what that transfer does.
    const hold=(v.holdings||[]).find(h=>h.token==='ETH');
    const availStr=hold?(hold.raw!=null?ethers.formatUnits(hold.raw,hold.decimals||18):stripCommas(hold.balance)):'';
    const availNum=availStr?Number(availStr):0;
    const rate=tokRate(hold);
    if(_stEthPerToken==null) loadStakeRate();
    body=`<div class="send-grid">
      <div>
        <div class="fset">
          <div class="stake-flow">
            <div class="stake-node">
              <span class="tok-ico big">${iconForSym('ETH')}</span>
              <b>ETH</b><span>OUT OF THE VAULT</span>
            </div>
            <div class="stake-arrow" aria-hidden="true">&rarr;</div>
            <div class="stake-node">
              <span class="tok-ico big">${iconForSym('wstETH')}</span>
              <b>wstETH</b><span>BACK TO THE VAULT</span>
            </div>
          </div>
          <div class="stake-note">A PLAIN ETH TRANSFER TO THE <b>wstETH</b> CONTRACT. ITS <b>receive()</b> FALLBACK SUBMITS THE ETH TO LIDO AND MINTS wstETH STRAIGHT BACK TO THE VAULT &mdash; NO APPROVAL, NO ROUTER, NO CALLDATA.</div>
        </div>

        <div class="fset privg">
          <div class="fhead"><label class="lbl" for="stake-amount">AMOUNT TO STAKE</label><span class="fhint priv" id="stake-units"></span></div>
          <div class="amt">
            <input class="amt-in priv" id="stake-amount" inputmode="decimal" placeholder="0.0" aria-describedby="stake-units stake-amount-usd stake-amount-warn" value="${esc(S.stakeAmount)}" oninput="onStakeAmount(this.value,${availNum})" onkeydown="if(event.key==='Enter'){event.preventDefault();submitStake()}">
            <span class="amt-tok">${tokIcon('ETH')}ETH</span>
          </div>
          <div class="amt-foot">
            <span class="amt-usd priv" id="stake-amount-usd" data-rate="${rate||0}"></span>
            ${availNum>0?`<span class="qbtns">${[['25%',.25],['50%',.5],['MAX',1]].map(([l,f])=>`<button class="qbtn" onclick="fillStakePct(${f},'${availStr}',${availNum})">${l}</button>`).join('')}</span>`:''}
            <span class="amt-warn" id="stake-amount-warn"></span>
          </div>
          <div class="fhint privg"${pgAttrs()} style="margin-top:10px">VAULT HOLDS <b><span class="priv">${hold?esc(hold.balance):'0'}</span> ETH</b>${hold&&hold.usd?` &middot; <span class="priv">${esc(hold.usd)}</span>`:''}</div>
        </div>

        <div class="fset">
          <div class="stake-after">
            <div class="lbl" style="margin-bottom:8px">AFTER IT EXECUTES</div>
            <div>wstETH LANDS IN THE VAULT LIKE ANY OTHER TOKEN &mdash; IT SHOWS UP IN TREASURY AND CAN BE SENT FROM THE <b>TRANSFER</b> TAB. IT ACCRUES STAKING REWARDS BY RISING AGAINST stETH RATHER THAN BY CHANGING BALANCE.</div>
            <div style="margin-top:10px">UNWRAPPING BACK TO ETH IS NOT DONE HERE &mdash; IT GOES THROUGH LIDO'S WITHDRAWAL QUEUE, WHICH YOU CAN PROPOSE FROM THE <b>CUSTOM</b> TAB.</div>
          </div>
        </div>
      </div>
      <div>
        <div class="review">
          <div class="review-h"><span>REVIEW</span><span class="review-tag">NONCE #${nextNonce(v)}</span></div>
          <div id="tx-review">${stakeReviewBody(v)}</div>
        </div>
        <button class="btn btn-fill btn-w btn-big" id="tx-submit" style="margin-top:14px" onclick="submitStake()">SIGN + SUBMIT</button>
        <div class="review-miss" id="tx-ready-note"></div>
      </div></div>`;
  }else if(S.txMode==="NAME"){
    // Two calls and one decision. The tab's job is to make it obvious which of
    // the two directions each call buys, because a name that resolves forward
    // but not back looks broken in every wallet and is the mistake this layout
    // exists to prevent.
    const label = asciiLower(S.wnsLabel.trim());
    const typed = !!label;
    const full = wnsFullName(label);
    const plan = wnsProposalPlan(v, label);
    const av = plan.av;
    const status = !typed ? `<span class="fhint">A LABEL, NOT A FULL NAME &mdash; <b>${WNS_ID_SUFFIX.slice(1)}</b> IS ADDED FOR YOU</span>`
      : av === 'invalid' ? `<span class="fhint" style="color:var(--r)">LETTERS, DIGITS, HYPHEN AND UNDERSCORE ONLY, UP TO ${WNS_LABEL_MAX} CHARACTERS, AND NOT A HYPHEN AT EITHER END</span>`
      : av === 'checking' ? `<span class="fhint" style="color:var(--a)">CHECKING <b>${esc(full)}</b>&hellip;</span>`
      : av === 'free' ? `<span class="fhint" style="color:var(--g)"><b>${esc(full)}</b> IS FREE</span>`
      : plan.owned ? `<span class="fhint" style="color:var(--g)">THIS VAULT ALREADY HOLDS <b>${esc(full)}</b> &mdash; ONLY THE REVERSE RECORD IS MISSING</span>`
      : av === 'taken' ? `<span class="fhint" style="color:var(--y)"><b>${esc(full)}</b> IS HELD BY ${plan.holder?esc(shortAddr(plan.holder)):'ANOTHER ADDRESS'} &mdash; PICK ANOTHER</span>`
      : `<span class="fhint" style="color:var(--y)">MAINNET DID NOT ANSWER <button class="reject-link" style="padding:1px 8px;margin-left:6px" onclick="retryWnsAv('${jstr(label)}','${jstr(v.address)}')">RETRY</button></span>`;
    const held = plan.owned;
    const ready = plan.calls.length > 0;
    body=`<div class="send-grid">
      <div>
        <div class="fset">
          <div class="wns-flow">
            <div class="wns-node"><b>${esc(wnsFullName(label) || 'name'+WNS_ID_SUFFIX)}</b><span>THE NAME</span></div>
            <div class="wns-arrows" aria-hidden="true"><span>&rarr;</span><span>&larr;</span></div>
            <div class="wns-node"><b>${esc(shortAddr(v.address))}</b><span>THIS VAULT</span></div>
          </div>
          <div class="stake-note">TWO CALLS, ONE PROPOSAL. <b>register()</b> MINTS THE NAME TO THE VAULT, WHICH MAKES THE NAME RESOLVE TO THIS ADDRESS. <b>setPrimaryName()</b> MAKES THIS ADDRESS ANSWER WITH THE NAME, WHICH IS THE DIRECTION WALLETS AND EXPLORERS READ. <b>id.wei</b> SUBDOMAINS COST NOTHING &mdash; NO FEE, NO RENEWAL &mdash; SO THE ONLY COST IS THE GAS TO EXECUTE.</div>
        </div>

        <div class="fset">
          <div class="fhead"><label class="lbl" for="wns-label">NAME</label><span class="fhint">FREE &middot; WNS</span></div>
          <div class="wns-input">
            <input class="inp" id="wns-label" style="margin:0" placeholder="treasury" aria-describedby="wns-status" value="${esc(S.wnsLabel)}" oninput="S.wnsLabel=this.value" onchange="_builderSim=null;render()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
            <span class="wns-suffix">${WNS_ID_SUFFIX}</span>
          </div>
          <div id="wns-status" role="status" style="margin-top:8px">${status}</div>
        </div>

        <div class="fset">
          <span class="lbl">REVERSE RESOLUTION</span>
          <div style="display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap">
            <button class="btn ${S.wnsPrimary?'btn-fill':'btn-outline'}" aria-pressed="${!!S.wnsPrimary}" style="padding:0 16px;font-size:10px" onclick="S.wnsPrimary=!S.wnsPrimary;_builderSim=null;render()">${S.wnsPrimary?'INCLUDED':'EXCLUDED'}</button>
            <span style="font-size:10px;color:var(--d);line-height:1.5;flex:1;min-width:180px">${S.wnsPrimary?'The vault will answer with this name wherever its address appears':'The name will resolve to the vault, but the vault will keep showing as an address'}</span>
          </div>
          ${v.wnsName && !held ? `<div style="margin-top:10px;font-size:9px;letter-spacing:1.5px;color:var(--y);line-height:1.6">THIS VAULT ALREADY ANSWERS WITH <b>${esc(v.wnsName)}</b>. EXECUTING THIS REPLACES THAT RECORD &mdash; THE OLD NAME KEEPS RESOLVING TO THE VAULT, IT JUST STOPS BEING THE ONE SHOWN.</div>` : ''}
        </div>

        <div class="fset">
          <div class="stake-after">
            <div class="lbl" style="margin-bottom:8px">WHAT IT DOES NOT DO</div>
            <div>HOLDING A NAME GRANTS NOBODY ANY POWER OVER THE VAULT, AND THE VAULT'S OWNERS, THRESHOLD AND TIMELOCK ARE UNCHANGED BY IT. THE NAME IS AN NFT THE VAULT ITSELF HOLDS, SO IT CAN ONLY BE MOVED THE WAY ANY OTHER ASSET IS MOVED &mdash; BY A PROPOSAL THAT REACHES QUORUM.</div>
            <div style="margin-top:10px">WNS IS ON ETHEREUM MAINNET. A VAULT CLONED TO OTHER CHAINS SHARES THIS ADDRESS BUT NOT THIS NAME.</div>
          </div>
        </div>
      </div>
      <div>
        <div class="review">
          <div class="review-h"><span>REVIEW</span><span class="review-tag">NONCE #${nextNonce(v)}</span></div>
          <div id="tx-review">${nameReviewBody(v)}</div>
        </div>
        <button class="btn ${ready?'btn-fill':'btn-disabled'} btn-w btn-big" id="tx-submit" style="margin-top:14px" onclick="${ready?'submitName()':''}">SIGN + SUBMIT</button>
        <div class="review-miss" id="tx-ready-note">${ready?'':'ENTER '+txMissing().join(' + ')}</div>
      </div></div>`;
  }else if(S.txMode==="CUSTOM"){
    const hasFns = Array.isArray(S.cxAbi) && S.cxAbi.length > 0;
    const isUnverified = S.cxAddr && Array.isArray(S.cxAbi) && S.cxAbi.length === 0;
    const selFn = hasFns && S.cxFn != null ? S.cxAbi[S.cxFn] : null;
    const encoded = selFn ? encodeCxCall() : null;
    let abiStatus = '';
    if(S.cxLoading) abiStatus = `<div style="font-size:10px;color:var(--d);letter-spacing:2px;margin:-8px 0 12px;animation:pulse 2s infinite">LOADING ABI...</div>`;
    else if(isUnverified) abiStatus = `<div style="font-size:10px;color:var(--d);margin:-8px 0 12px">UNVERIFIED CONTRACT — USE RAW CALLDATA</div>`;
    else if(hasFns) abiStatus = `<div style="font-size:10px;color:var(--g);margin:-8px 0 4px;letter-spacing:2px">CONTRACT VERIFIED &middot; ${S.cxAbi.length} WRITE FN${S.cxAbi.length>1?'S':''}</div>`;
    let fnPills = '';
    if(hasFns) {
      const dupes = new Set(); const seen = new Set();
      S.cxAbi.forEach(f => { if(seen.has(f.name)) dupes.add(f.name); seen.add(f.name); });
      fnPills = `<span class="lbl" id="lbl-fn">FUNCTION</span><div class="token-pills" role="group" aria-labelledby="lbl-fn" style="margin-bottom:12px;max-height:${mob?'140px':'200px'};overflow-y:auto">${S.cxAbi.map((fn, i) => {
        const label = dupes.has(fn.name) ? fn.name+'('+fn.inputs.map(p=>p.type).join(',')+')' : fn.name;
        return`<button class="pill${S.cxFn===i?" on":""}"${S.cxFn===i?' aria-current="true"':''} onclick="selectCxFn(${i})">${esc(label)}</button>`;
      }).join('')}</div>`;
    }
    let rightCol = '';
    if(selFn) {
      const fnSig = selFn.name+'('+selFn.inputs.map(p=>p.type).join(',')+')';
      const params = selFn.inputs.length ? selFn.inputs.map((inp, i) =>
        `<label class="lbl" for="cx-arg-${i}">${esc(inp.name||'arg'+i)} <span class="dim">${esc(inp.type)}</span></label><input class="inp" id="cx-arg-${i}" placeholder="${esc(inp.type)}" value="${esc(S.cxArgs[i]||'')}" oninput="S.cxArgs[${i}]=this.value">`
      ).join('') : '<div style="font-size:10px;color:var(--d);margin:8px 0 12px;letter-spacing:2px">NO PARAMETERS</div>';
      const preview = encoded
        ? `<label class="lbl">CALLDATA <span class="dim">${esc(fnSig)}</span></label><div style="font-size:10px;color:var(--d);word-break:break-all;max-height:48px;overflow-y:auto;line-height:1.6;margin-bottom:12px;padding:8px;border:1px solid var(--ln)">${esc(encoded)}</div>`
        : '';
      const encodeFail = !encoded && selFn.inputs.length && Object.keys(S.cxArgs).length
        ? '<div style="font-size:10px;color:var(--r);margin-bottom:12px;letter-spacing:1px">ENCODE ERROR — CHECK PARAMS</div>' : '';
      rightCol = `${params}${selFn.stateMutability==='payable'?'<div style="font-size:10px;color:var(--g);margin:-8px 0 12px;letter-spacing:1px">PAYABLE</div>':''}${preview}${encodeFail}<button class="btn btn-fill btn-w btn-big" style="margin-top:${mob?8:16}px" onclick="submitCustom()">SIGN + SUBMIT</button>`;
    } else {
      rightCol = `<label class="lbl" for="cx-data">CALLDATA</label><textarea class="inp" id="cx-data" placeholder="0x..."></textarea><button class="btn btn-fill btn-w btn-big" style="margin-top:${mob?8:16}px" onclick="submitCustom()">SIGN + SUBMIT</button>`;
    }
    body=`<div class="grid2">
      <div>
        <label class="lbl" for="cx-target">TARGET</label><input class="inp" id="cx-target" aria-describedby="cx-target-status" placeholder="0x... or name.eth / name.(g)wei" value="${esc(shortAddr(S.cxTarget))}" onfocus="this.value=S.cxTarget" onblur="this.value=shortAddr(S.cxTarget)" oninput="onCxTargetChange(this.value)">
        <div id="cx-target-status" role="status" style="font-size:9px;letter-spacing:1px;margin-top:-8px;margin-bottom:8px;min-height:11px"></div>
        ${abiStatus}${fnPills}
        <label class="lbl" for="cx-value">VALUE (ETH)</label><input class="inp" id="cx-value" aria-describedby="cx-wei" placeholder="0" value="${esc(S.cxValue)}" oninput="S.cxValue=this.value;document.getElementById('cx-wei').textContent=this.value?toUnits(this.value,18)+' WEI':''">
        <div id="cx-wei" style="font-size:10px;color:var(--d);margin-top:-12px;margin-bottom:12px;word-break:break-all">${S.cxValue?toUnits(S.cxValue,18)+' WEI':''}</div>
      </div><div>
        ${rightCol}
      </div></div>`;
  }else{
    body=S.batch.map((c,i)=>`<div class="batch-call">
      <div class="call-hdr"><span>CALL ${String(i+1).padStart(2,"0")}</span>${S.batch.length>1?`<button class="x-btn" onclick="S.batch.splice(${i},1);render()" aria-label="Remove call ${i+1}" title="Remove this call">&#10005;</button>`:""}</div>
      <div class="grid3">
        <div><label class="lbl" for="batch-t-in-${i}">TARGET</label><input class="inp" id="batch-t-in-${i}" aria-describedby="batch-t-${i}" data-bi="${i}" data-bf="t" placeholder="0x... or .eth/.(g)wei" value="${esc(shortAddr(c.t))}" onfocus="this.value=S.batch[${i}].t" onblur="this.value=shortAddr(S.batch[${i}].t)" oninput="onBatchTarget(${i},this.value)"><div id="batch-t-${i}" style="font-size:9px;letter-spacing:1px;margin-top:-12px;margin-bottom:8px;min-height:11px">${(()=>{const s=_addrState(c.t);return s.txt?`<span style="color:${s.color}">${ethers.isAddress((c.t||'').trim())?'✓':s.txt}</span>`:''})()}</div></div>
        <div><label class="lbl" for="batch-v-in-${i}">VALUE (ETH)</label><input class="inp" id="batch-v-in-${i}" data-bi="${i}" data-bf="v" placeholder="0" value="${esc(c.v)}" oninput="S.batch[${i}].v=this.value;this.nextElementSibling.textContent=this.value?toUnits(this.value,18)+' WEI':''"><div style="font-size:10px;color:var(--d);margin-top:-12px;margin-bottom:8px;word-break:break-all">${c.v?toUnits(c.v,18)+' WEI':''}</div></div>
        <div><label class="lbl" for="batch-d-in-${i}">CALLDATA</label><input class="inp" id="batch-d-in-${i}" aria-describedby="batch-d-${i}" data-bi="${i}" data-bf="d" placeholder="0x..." value="${esc(c.d)}" oninput="onBatchData(${i},this.value)"><div id="batch-d-${i}" style="font-size:9px;letter-spacing:1px;margin-top:-12px;margin-bottom:8px;min-height:11px">${(()=>{const s=_hexState(c.d);return s.txt?`<span style="color:${s.color}">${s.txt}</span>`:''})()}</div></div>
      </div></div>`).join("")+
      `<button class="link-btn" onclick="S.batch.push({t:'',v:'',d:''});render()">+ ADD CALL</button>
       <button class="btn btn-fill btn-w btn-big" style="margin-top:16px" onclick="submitBatch()">SIGN + SUBMIT BATCH</button>`;
  }
  return`<div class="txb"><div class="txb-tabs">${tabs}<button class="x-btn" onclick="closeTxBuilder()" aria-label="Discard this draft" title="Discard this draft">&#10005;</button></div>${body}
    ${_builderSim
      ? renderSim(_builderSim, { rerun:'simulateBuilder()', dismiss:'dismissBuilderSim()' })
      : `<div class="sim-idle">
          <button class="sim-btn" onclick="simulateBuilder()" title="Dry-run this transaction against current chain state before proposing">SIMULATE</button>
          <span class="t">DRY-RUN AGAINST THE LATEST BLOCK &mdash; SEE THE EXACT BALANCE CHANGES AND GAS BEFORE THIS BECOMES A PROPOSAL.</span>
        </div>`}</div>`;
}

function getProdTokenSymbols(){
  const toks = PROD_TOKENS[S.chainId] || ETH_ONLY;
  return toks.map(t=>t.symbol);
}

// ── CREATE ────────────────────────────────────────────────────────
// Owner names are previewed against chain 1: ENS, WNS (.wei) and GNS (.gwei)
// all live on mainnet, and an owner is a signer rather than a recipient, so
// ENSIP-11's per-chain address records do not apply to it. Pinning the preview
// key to 1 also means the resolution survives flipping the form between chains
// instead of being re-fetched, and re-shown as RESOLVING…, on every click.
const OWNER_NS_CHAIN = 1;

// Synchronous create-form validation. Classifies each owner (address / name /
// invalid / duplicate) and reports whether the form is ready to deploy.
// Names (.eth/.wei/.gwei) are resolved here, in the form, and the address each
// one lands on is shown next to it — the owner set is the one thing about a
// vault that can never be changed without a full multisig round, so it must not
// be signed for while half of it is still a string nobody has seen resolve.
// Resolution is async and cached; each pending lookup repaints the form when it
// lands. The returned entry rides along on the owner so the renderer can show
// it without repeating the lookup.
function validateCreate(c, demo){
  const seen = new Map();
  const owners = c.owners.map(o => {
    const raw = (o.addr || '').trim();
    if(!raw) return { state: 'empty', raw, pv: null };
    let state, key, pv = null;
    // init() walks a linked list headed by address(1) and requires each owner
    // to be strictly greater than the one before, so 0x0 and 0x1 are not owners
    // the contract can hold — reject them here, not with a reverted deploy.
    if(ethers.isAddress(raw) && BigInt(raw) <= 1n) { state = 'invalid'; key = null; }
    else if(ethers.isAddress(raw)) { state = 'address'; key = 'a:' + raw.toLowerCase(); }
    else if(NAME_RE.test(raw)) {
      state = 'name';
      pv = demo ? null : previewName(raw, OWNER_NS_CHAIN, render);
      // Dedup on the resolved address once it is known. Two names, or a name
      // and the address it points at, are the same owner — and init() reverts
      // on a repeat, after the salt has been mined and the gas paid.
      key = (pv && pv.state === 'ok') ? 'a:' + pv.addr.toLowerCase() : 'n:' + raw.toLowerCase();
    }
    else if(demo) { state = 'address'; key = 'x:' + raw.toLowerCase(); }
    else { state = 'invalid'; key = null; }
    if(key) { if(seen.has(key)) state = 'dup'; else seen.set(key, true); }
    return { state, raw, pv };
  });
  const filled = owners.filter(o => o.state !== 'empty').length;
  const t = parseInt(c.threshold) || 0;
  const delayOk = !c.delayVal || (/^\d*\.?\d*$/.test(String(c.delayVal)) && parseFloat(c.delayVal) >= 0);
  const badName = owners.find(o => o.pv && o.pv.state === 'err');
  // A name can point anywhere, including at the sentinels the owner list is
  // built out of, so the 0x0/0x1 rejection has to be re-run on what it resolved
  // to and not only on what was typed.
  const sentinelName = owners.find(o => o.pv && o.pv.state === 'ok' && BigInt(o.pv.addr) <= 1n);
  const resolving = owners.some(o => o.pv && o.pv.state === 'resolving');
  let ready = true, reason = '';
  if(filled < 1) { ready = false; reason = 'ADD AT LEAST ONE OWNER'; }
  else if(!demo && owners.some(o => o.state === 'invalid')) { ready = false; reason = 'ONE OR MORE OWNER ADDRESSES ARE INVALID'; }
  else if(badName) { ready = false; reason = badName.pv.err || (badName.raw.toUpperCase() + ' DOES NOT RESOLVE'); }
  else if(sentinelName) { ready = false; reason = sentinelName.raw.toUpperCase() + ' RESOLVES TO 0x0 — NOT A VALID OWNER'; }
  else if(owners.some(o => o.state === 'dup')) { ready = false; reason = 'DUPLICATE OWNER ADDRESSES'; }
  // Deploying while a name is still in flight would sign for an owner set the
  // operator has not seen. It is a second or two, and it only ever blocks a
  // form that has an unresolved name in it.
  else if(resolving) { ready = false; reason = 'RESOLVING OWNER NAMES…'; }
  // Audit H-2 — the same ceiling prodDeploy enforces, raised here so it is a
  // disabled button rather than a rejection after the form is filled in.
  else if(!demo && filled > MAX_SAFE_THRESHOLD) { ready = false; reason = `MORE THAN ${MAX_SAFE_THRESHOLD} OWNERS CAN OVERFLOW THE SIGNATURE-LENGTH CHECK`; }
  else if(t < 1 || t > filled) { ready = false; reason = 'THRESHOLD MUST BE 1..' + filled; }
  else if(!delayOk) { ready = false; reason = 'DELAY MUST BE A POSITIVE NUMBER'; }
  return { owners, filled, ready, reason };
}

const _OWNER_STATE_COLOR = { address:'var(--g)', name:'var(--a)', invalid:'var(--r)', dup:'var(--r)', empty:'var(--d)' };

// A failed lookup is cached, so a name that could not be reached once would stay
// unresolvable for the rest of the session — and since an unresolved name now
// holds the DEPLOY button, a single rate-limited burst against mainnet would wedge
// the form with no way out but a page reload. Dropping the cache entry lets the
// operator ask again.
function retryOwnerName(i){
  const raw = ((S.cf.owners[i] || {}).addr || '').trim();
  if(raw) delete _namePreview[_pvKey(raw, OWNER_NS_CHAIN)];
  render();
}

// The note under an owner row, and the colour of its row number. A name is only
// as good as the address it resolves to, so it is shown — truncated, and linked
// to the explorer of the chain this form is aimed at, so it can be checked
// against whatever the operator is holding it up against.
function ownerRowNote(ow, i, explorerBase){
  const pv = ow.pv;
  if(ow.state === 'invalid') return { html:'NOT A VALID ADDRESS OR .eth / .wei / .gwei NAME', color:'var(--r)', num:'var(--r)' };
  if(ow.state === 'dup') return {
    html: pv && pv.state === 'ok' ? `DUPLICATE &mdash; ${esc(shortAddr(pv.addr))} IS ALREADY LISTED ABOVE` : 'DUPLICATE &mdash; ALREADY LISTED ABOVE',
    color:'var(--r)', num:'var(--r)' };
  if(ow.state !== 'name') return { html:'', color:'var(--d)', num:_OWNER_STATE_COLOR[ow.state] || 'var(--d)' };
  if(!pv || pv.state === 'resolving') return { html:'NAME &middot; RESOLVING&hellip;', color:'var(--a)', num:'var(--a)' };
  if(pv.state === 'err') return {
    html: `${esc(pv.err)} <button class="reject-link" style="padding:1px 8px;margin-left:6px" onclick="retryOwnerName(${i})">RETRY</button>`,
    color:'var(--r)', num:'var(--r)' };
  return {
    html: `&rarr; <a href="${explorerBase}/address/${esc(pv.addr)}" target="_blank" rel="noopener" title="${esc(pv.addr)} &middot; view on explorer" style="color:var(--g);text-decoration:none;border-bottom:1px solid var(--ln)">${esc(shortAddr(pv.addr))}</a>`,
    color:'var(--g)', num:'var(--g)' };
}

// The identity offer, folded out of the vault name that is already being typed.
// Deliberately small: it is one free, reversible, no-privilege addition to a
// form whose other decisions are permanent, and it should not read like one of
// them. Everything a decision needs is here in one line — the exact name, that
// it costs nothing, and whether it is still free — with the rest behind the
// tooltip for anyone who wants it.
//
// WNS is a mainnet contract, so claiming means deploying on Ethereum. Rather
// than grey the offer out for anyone who picked another chain — which leaves
// them reading a disabled control and guessing why — ticking it adds Ethereum
// to the deploy, says so on the line before it is ticked, and ticks Ethereum
// visibly in the network panel below where it can be unticked again. What it
// must never do is add a mainnet transaction, at mainnet gas, off a checkbox
// that did not mention it.
// Dropping the claim also drops the chain the claim added, and only that one:
// Ethereum the operator selected themselves stays selected.
function cancelCreateWns(c){
  c.wns = false;
  if(c.wnsAddedNet){
    const mi = NETS.findIndex(n => n.id === WNS_CHAIN_ID);
    c.clone = (c.clone || []).filter(i => i !== mi);
    c.wnsAddedNet = false;
  }
}
function toggleCreateWns(){
  const c = S.cf, mi = NETS.findIndex(n => n.id === WNS_CHAIN_ID);
  if(c.wns) { cancelCreateWns(c); render(); return; }
  c.wns = true;
  if(mi >= 0 && c.net !== mi && !(c.clone || []).includes(mi)){
    c.clone = [...(c.clone || []), mi];
    c.wnsAddedNet = true;   // ours to remove; a chain the operator picked is not
  }
  render();
}
function renderCreateWns(c){
  // Not in the demo. Every other control on this form is pretend there; a live
  // registry lookup against a name someone could really lose is not, and the
  // demo deploy has no transaction to carry the claim in anyway.
  //
  // The claim is cancelled on the way out, not just hidden. There is no name to
  // fold when the field is empty, so a tick left standing would survive as a
  // claim for the empty label — an IDENTITY line in the preview reading
  // ".id.wei", and a chain still added to the deploy for a name that no longer
  // exists. Every path that stops offering the claim has to withdraw it.
  if(S.demoMode || !c.name || !c.name.trim()){ cancelCreateWns(c); return ''; }
  const slug = wnsSlug(c.name);
  const mainIdx = NETS.findIndex(n => n.id === WNS_CHAIN_ID);
  const onMainnet = c.net === mainIdx || (c.clone || []).includes(mainIdx);
  // Unticking Ethereum in the panel below cancels the claim rather than leaving
  // a ticked box for a chain the deploy no longer touches. Normalised here, at
  // the one place that reads both, so the network panel does not have to know
  // this option exists.
  if(c.wns && !onMainnet) cancelCreateWns(c);
  const tip = `Registers ${slug || 'a name'}${WNS_ID_SUFFIX} to the vault inside the very transaction that deploys it, and points reverse resolution at it — so the vault reads as a name instead of an address here, in wallets, and anywhere else that reads WNS. id.wei subdomains are free: no fee, no auction, no renewal, and nothing to pay again. The name is minted to the vault itself, so it is an asset only a full multisig round can move, and holding it grants nobody any power over the vault. WNS lives on Ethereum mainnet, so claiming means deploying there too; clones on other chains share this vault's address, not its name. You can also claim one later, from the NAME tab, as an ordinary proposal.`;
  if(!slug){ cancelCreateWns(c); return `<div class="wns-opt off"><span style="flex:1">NO <b>.id.wei</b> NAME CAN BE FOLDED OUT OF THIS VAULT NAME &mdash; LETTERS, DIGITS AND HYPHENS ONLY</span><span class="wns-q" tabindex="0" role="note" aria-label="${esc(tip)}" title="${esc(tip)}">?</span></div>`; }
  // Asked as the connected wallet, or as the codeless stand-in when there is
  // none. Not as the vault: the vault does not exist yet, and the address it
  // will have holds no code until the deploy lands — so the receiver half of
  // the answer is settled by the audited clone's own onERC721Received, and
  // confirmed by reading the name back off WNS after the deploy.
  const asker = window._connectedAddress || WNS_PROBE_FROM;
  const av = wnsAvState(slug, asker).state;
  const free = av === 'free';
  // Renaming the vault re-folds the slug, and the new one may be taken or
  // unreadable. A tick left standing over it would carry a claim the operator
  // never made into the review screen — so a claim only survives while the name
  // it names is still free. 'checking' is left alone: it is a state the lookup
  // is passing through, not an answer.
  if(c.wns && (av === 'taken' || av === 'invalid')) cancelCreateWns(c);
  const status =
    av === 'checking' ? `<span class="wns-st" style="color:var(--a)">CHECKING&hellip;</span>` :
    av === 'free'     ? `<span class="wns-st" style="color:var(--g)">FREE</span>` :
    av === 'taken'    ? `<span class="wns-st" style="color:var(--y)">ALREADY CLAIMED</span>` :
    av === 'invalid'  ? `<span class="wns-st" style="color:var(--r)">NOT A VALID LABEL</span>` :
    `<span class="wns-st" style="color:var(--y)">COULD NOT CHECK <button class="reject-link" style="padding:1px 8px;margin-left:6px" onclick="retryWnsAv('${jstr(slug)}','${jstr(asker)}')">RETRY</button></span>`;
  // Ticked stays clickable even while a renamed vault's new label is still
  // being checked: the box is disabled to stop a claim being made on an unknown
  // name, never to stop one being withdrawn.
  const on = !!c.wns;
  // Stated before the tick, not after it, and again in the review screen.
  const why = on && c.wnsAddedNet
    ? `<div class="wns-why">ETHEREUM ADDED TO THIS DEPLOY &mdash; ONE MORE TRANSACTION, AT MAINNET GAS. UNTICK ETHEREUM BELOW TO DROP BOTH.</div>`
    : !on && !onMainnet && free
      ? `<div class="wns-why">CLAIMING ALSO DEPLOYS ON ETHEREUM &mdash; ONE MORE TRANSACTION, AT MAINNET GAS.</div>`
      : '';
  return `<div class="wns-opt${on?' on':''}">
    <button type="button" class="wns-box" role="checkbox" aria-checked="${on}" aria-label="Claim ${esc(slug)}${WNS_ID_SUFFIX} for this vault, free" ${free||on?'':'disabled'} onclick="toggleCreateWns()">${on?'&#10003;':''}</button>
    <span>CLAIM <b>${esc(slug)}${WNS_ID_SUFFIX}</b> &middot; FREE</span>
    ${status}
    <span class="wns-q" tabindex="0" role="note" aria-label="${esc(tip)}" title="${esc(tip)}">?</span>
    ${why}
  </div>`;
}

        <input class="inp o-label" id="cf-own-lbl-${i}" maxlength="64" aria-label="Owner ${i+1} label" placeholder="LABEL" value="${esc(o.label)}" oninput="S.cf.owners[${i}].label=this.value" onchange="render()">
        ${c.owners.length>1?`<button class="x-btn red o-del" aria-label="Remove owner ${i+1}" title="Remove this owner" onclick="S.cf.owners.splice(${i},1);const fc=S.cf.owners.filter(o=>o.addr.trim()).length||1;S.cf.threshold=String(Math.min(+S.cf.threshold||1,fc));render()">&#10005;</button>`:""}

    <div style="margin-top:${mob?36:0}px">

IDENTITY    ${esc(wnsSlug(c.name))}${WNS_ID_SUFFIX} &middot; FREE &middot; ETHEREUM ONLY`:''}
OWNERS      ${c.owners.filter(o=>o.addr.trim()).length||0}${c.owners.some(o=>o.label&&o.addr.trim())?" ("+c.owners.filter(o=>o.label&&o.addr.trim()).map(o=>esc(o.label)).join(", ")+")":""}
THRESHOLD   ${c.threshold}/${c.owners.filter(o=>o.addr.trim()).length||1}${c.safeSrc?`
CLONED FROM ${esc(shortAddr(c.safeSrc.addr))} &middot; SAFE${c.safeSrc.version?" v"+esc(c.safeSrc.version):""}`:""}
DELAY       ${ds>0?c.delayVal+c.delayUnit+" ("+ds+"s)":"0 &mdash; UNLOCKED"}${ds>0?"\nFAST PATH   "+(c.fastPath?"ENABLED (ALL OWNERS)":"DISABLED"):""}
NETWORK     ${net.name} (${net.id})
TOKENS      ${toks.join(", ")}
FACTORY     <a href="${explorerBase}/address/${FACTORY}" target="_blank" rel="noopener" style="color:var(--a);text-decoration:none;border-bottom:1px solid var(--ln)">${FACTORY.slice(0,10)}...${FACTORY.slice(-4)}</a>

function addTxDemo(tx) {
  const v = S.vaults[S.sel];
  const n = v.nonce;
  const you = getYou();
  const ap = {};
  v.owners.forEach(o => ap[o.addr] = (o.you || o.addr === you));
  v.queue.push({ nonce: n, ...tx, eta: 0, approvals: ap });
  v.nonce++;
  S.showTx = false;
  resetTxFields();
  flash(`TX #${n} CREATED`);
  render();
}

function setTxSlow(on){ S.txSlow = !!on; _builderSim = null; render(); }
function setSlowDelay(sec){ S.txSlowDelaySec = sec; render(); }
function onSlowCustom(){
  const n = parseFloat(stripCommas(document.getElementById('slow-custom-n')?.value || ''));
  const u = document.getElementById('slow-custom-u')?.value || 'd';
  S.txSlowUnit = u;
  if(!(n > 0)) { render(); return; }
  S.txSlowDelaySec = Math.max(1, Math.round(n * (u === 'h' ? 3600 : 86400)));
  render();
}

function submitTransfer() {

    const to = document.getElementById("tx-to")?.value || "";
    const dec = DECIMALS[S.txToken] || 18;
    addTxDemo({
      value: amt, token: S.txToken, target: to, raw: toUnits(amt, dec),
      dataLabel: S.txToken === "ETH" ? "TRANSFER" : "ERC20 TRANSFER",
    });
  } else {
    guardSubmit(prodSubmitTransfer)();
  }
}

function getCxCalldata() {
  if(S.cxFn != null && Array.isArray(S.cxAbi) && S.cxAbi.length) {
    const d = encodeCxCall();
    if(!d) { flash('INVALID PARAMETERS — CHECK INPUTS'); return null; }
    return d;
  }
  return (document.getElementById("cx-data")?.value || "0x").trim();
}

function submitCustom() {
  if (S.demoMode) {
    const t = S.cxTarget || document.getElementById("cx-target")?.value || "";
    const val = S.cxValue || document.getElementById("cx-value")?.value || "0";
    const d = getCxCalldata(); if (d === null) return;
    const fnName = S.cxFn != null && Array.isArray(S.cxAbi) && S.cxAbi[S.cxFn] ? S.cxAbi[S.cxFn].name : null;
    resetCxState();
    addTxDemo({
      value: val, token: "ETH", target: t, wei: toUnits(val, 18),

    });
  } else {

}

  } else {

// No demo branch, the way submitStake has none: the tab is offered only on
// mainnet outside the demo, so a demo path here would be unreachable code
// pretending to be a fallback. If the chain moved underneath the open builder,

function submitName() {

}

function doSign(vi, nonce) {
  if (S.demoMode) {
    const tx = S.vaults[vi].queue.find(t => t.nonce === nonce);
    if (!tx) return;
    tx.approvals[DEMO_YOU] = true;
    flash(`SIGNED #${nonce} (OFF-CHAIN)`);
    render();
    highlightTx(nonce);
  } else {
    guardSubmit(prodSign)(vi, nonce);
  }
}

function doApprove(vi, nonce) {
  if (S.demoMode) {
    const tx = S.vaults[vi].queue.find(t => t.nonce === nonce);
    if (!tx) return;
    tx.approvals[DEMO_YOU] = true;
    flash(`APPROVED #${nonce} (ON-CHAIN)`);
    render();
    highlightTx(nonce);
  } else {
    guardSubmit(prodApprove)(vi, nonce);
  }
}

function doUnsign(vi, nonce) {
  if (S.demoMode) {
    const tx = S.vaults[vi].queue.find(t => t.nonce === nonce);
    if (!tx) return;
    tx.approvals[DEMO_YOU] = false;
    flash(`UNSIGNED #${nonce}`);
    render();
  } else {
    guardSubmit(prodUnsign)(vi, nonce);
  }
}

function doSubmit(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    const tx = vt.queue.find(t => t.nonce === nonce);
    if (!tx) return;
    if (tx.cancelTarget != null) {
      vt.queue = vt.queue.filter(t => t.nonce !== nonce && t.nonce !== tx.cancelTarget);
      flash(`CANCELLED #${tx.cancelTarget} VIA EXECUTOR`);
    } else if (vt.delay === 0) {
      vt.queue = vt.queue.filter(t => t.nonce !== nonce);
      flash(`EXECUTED #${nonce}`);
    } else {
      tx.eta = NOW() + vt.delay;
      flash(`QUEUED #${nonce}`);
    }
    render();
  } else {
    guardSubmit(prodSubmit)(vi, nonce);
  }
}

function doExecute(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`EXECUTED #${nonce}`);
    render();
  } else {
    guardSubmit(prodExecute)(vi, nonce);
  }
}

function doFastExecute(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`INSTANT EXECUTED #${nonce} VIA EXECUTOR`);
    render();
  } else {
    guardSubmit(prodFastExecute)(vi,nonce);
  }
}

function doCancel(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    const tx = vt.queue.find(t => t.nonce === nonce);
    if (!tx) return;
    const n = vt.nonce;
    const ap = {};
    vt.owners.forEach(o => ap[o.addr] = !!o.you);
    vt.queue.push({
      nonce: n, target: vt.address, value: "0", token: "",
      dataLabel: `CANCEL #${nonce}`, eta: 0, approvals: ap, cancelTarget: nonce,
    });
    vt.nonce++;
    flash(`CANCEL PROPOSED #${n} \u2192 cancelQueued(#${nonce})`);
    render();
  } else {
    guardSubmit(prodCancel)(vi, nonce);
  }
}

function doReject(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    // Demo: skipping the nonce drops the stuck proposal so the queue advances.
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`REJECTED #${nonce} \u2014 NONCE SKIPPED`);
    render();
  } else {
    guardSubmit(prodReject)(vi, nonce);
  }
}

// Two-click guard so a stray click can't skip a nonce: first click arms
// (button flips to CONFIRM, auto-disarms after a few seconds), second commits.
// Arms the guard-hook executor confirmation in prodAdminPropose — same
// press-again idiom as REJECT below, keyed by the address rather than a nonce
// so editing the field disarms it.
let _hookArmed = null, _hookArmTimer = null;
// Same idiom for an over-long timelock (audit M-2), keyed by the value.
let _delayArmed = null, _delayArmTimer = null;
// And for turning the fast path on where it makes the timelock advisory
// (audit H-1), keyed by the vault.
let _fpArmed = null, _fpArmTimer = null;

let _rejectArmed = null, _rejectArmTimer = null;
function armReject(vi, nonce) {
  clearTimeout(_rejectArmTimer);
  if (_rejectArmed === nonce) { _rejectArmed = null; doReject(vi, nonce); return; }
  _rejectArmed = nonce;
  _rejectArmTimer = setTimeout(() => { _rejectArmed = null; render(); }, 4000);
  render();
}

function doAccelerate(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`ACCELERATED #${nonce} VIA EXECUTOR`);
    render();
  } else {
    guardSubmit(prodAccelerate)(vi, nonce);
  }
}

function toggleClone(i){
  const s = new Set(S.cf.clone || []);
  s.has(i) ? s.delete(i) : s.add(i);
  S.cf.clone = [...s];
  render();
}

// ── CREATE: CLONE A GNOSIS SAFE ───────────────────────────────────
// Migrating off a Safe means retyping its signer set, which is exactly the
// step where an address gets fat-fingered. So copy it: two read-only getters
// give the owners and the threshold, and the rest of this page — timelock,
// fast path, chains — stays whatever the operator chose. The Safe itself is
// never touched, and no funds move; this only fills in the form.
const netIdx = chainId => NETS.findIndex(n => n.id === chainId);
const MAX_CLONE_OWNERS = 100;   // far above any real Safe; a guard, not a limit

function openSafeClone(){
  S.safeClone = { input:'', busy:false, err:'', found:null, addr:null, label:'' };
  render();
  setTimeout(() => document.getElementById('safe-input')?.focus(), 60);
}
function closeSafeClone(){ S.safeClone = null; render(); }

// Live field hint, in the same vocabulary as every other address input.
function safeCloneInput(val){
  if(S.safeClone){ S.safeClone.input = val; S.safeClone.err = ''; }
  const el = document.getElementById('safe-status');
  if(!el) return;
  const s = _addrState(val);
  el.textContent = s.txt;
  el.style.color = s.color || '';
}

// Read a Safe at `addr` on `chainId`. Resolves `{ hit, status }`, never throws.
// The status matters as much as the hit: "there is no Safe here" and "we could
// not look" are different claims, and reporting the second as the first is how
// a modal ends up telling someone their Safe does not exist because an RPC was
// wedged. 'none' = nothing deployed or not a Safe, 'big' = an owner list too
// long to render, 'down' = the chain would not answer inside `ms`. The timeout
// matters because this fans out over every supported chain.
function readSafe(addr, chainId, ms = 8000){
  if(!CHAINS[chainId]) return Promise.resolve({ hit:null, status:'none' });
  let timer;
  const read = (async () => {
    const p = makeProvider(chainId);
    let code;
    try { code = await p.getCode(addr); }
    catch(_) { return { hit:null, status:'down' }; }
    if(!code || code === '0x') return { hit:null, status:'none' };
    const s = new ethers.Contract(addr, SAFE_ABI, p);
    let owners, threshold;
    try { [owners, threshold] = await Promise.all([s.getOwners(), s.getThreshold()]); }
    catch(e) {
      // A contract that returns nothing decodable for these two getters is not
      // a Safe. Any other failure is the chain not answering — which must not
      // be reported back as "not a Safe".
      const notSafe = e && (e.code === 'BAD_DATA' || e.code === 'CALL_EXCEPTION');
      return { hit:null, status: notSafe ? 'none' : 'down' };
    }
    if(!owners || !owners.length) return { hit:null, status:'none' };
    // Both bounds are about a contract that only claims to be a Safe: an owner
    // list long enough to hang the form, or a VERSION() long enough to wreck
    // the layout, are the two things it gets to choose here.
    if(owners.length > MAX_CLONE_OWNERS) return { hit:null, status:'big' };
    let version = null;
    try { version = String(await s.VERSION()).trim().slice(0, 16); } catch(_){}
    return { hit: { addr, chainId, owners: owners.map(a => ethers.getAddress(a)), threshold: Number(threshold), version }, status:'ok' };
  })();
  return Promise.race([read, new Promise(r => { timer = setTimeout(() => r({ hit:null, status:'down' }), ms); })])
    .finally(() => clearTimeout(timer));
}

// One click: resolve the input (address, .eth, .wei or .gwei), read the Safe on
// the chain this form deploys to, and fill the form in. Safes share an address
// across chains but not always a signer set, so when it is not on the selected
// chain we say where it is instead of dead-ending — loading one of those is an
// explicit choice that also switches the deploy target.
async function safeCloneSearch(){
  const sc = S.safeClone;
  if(!sc || sc.busy) return;
  const raw = (document.getElementById('safe-input')?.value ?? sc.input ?? '').trim();
  sc.input = raw;
  if(!raw){ sc.err = 'ENTER A SAFE ADDRESS OR NAME'; render(); return; }
  sc.busy = true; sc.err = ''; sc.found = null; render();

  let addr;
  try { addr = await resolveName(raw); }
  catch(e) {
    if(!S.safeClone) return;
    sc.busy = false;
    sc.err = NAME_RE.test(raw) ? nameErrText(raw, e) : 'NOT A VALID ADDRESS OR NAME';
    render(); return;
  }

  const chainId = NETS[S.cf.net]?.id;
  const primary = await readSafe(addr, chainId);
  if(!S.safeClone) return;                  // modal closed while reading
  if(primary.hit){ applySafe(primary.hit, raw); return; }

  const ids = Object.keys(CHAINS).map(Number).filter(id => id !== chainId);
  const scans = await Promise.all(ids.map(id => readSafe(addr, id)));
  if(!S.safeClone) return;
  const others = scans.map(s => s.hit).filter(Boolean);
  const all = [primary, ...scans];
  sc.busy = false; sc.addr = addr; sc.label = raw;
  sc.found = others.length ? others.sort((a,b) => netIdx(a.chainId) - netIdx(b.chainId)) : null;
  // Say what actually happened. A Safe too big to clone is not a missing Safe,
  // and a chain that never answered is not a chain without one.
  if(others.length) sc.err = '';
  else if(all.some(s => s.status === 'big')) sc.err = `THAT SAFE HAS MORE THAN ${MAX_CLONE_OWNERS} OWNERS — TOO MANY TO CLONE`;
  else if(all.some(s => s.status === 'down')) sc.err = `NO SAFE AT ${shortAddr(addr)} ON THE CHAINS THAT ANSWERED — SOME COULD NOT BE READ`;
  else sc.err = `NO SAFE AT ${shortAddr(addr)} ON ANY SUPPORTED CHAIN`;
  render();
}

// Load a Safe that was found on a chain other than the selected one.
function applyFoundSafe(chainId){
  const sc = S.safeClone;
  const hit = (sc?.found || []).find(f => f.chainId === chainId);
  if(hit) applySafe(hit, sc.label);
}

// Fill the form from a Safe, keeping enough of the previous state to undo.
async function applySafe(src, typed){
  const c = S.cf;
  // The modal instance this clone belongs to. Reverse-resolving the signer
  // names takes a round trip, and closing the modal in the middle of it has to
  // mean cancelled — otherwise dismissing the dialog still rewrites the form.
  const token = S.safeClone;
  if(token){ token.busy = true; render(); }
  // Owner labels come free: whatever .wei / .gwei / ENS name each signer holds.
  let names = {};
  try { names = await resolveOwnerNames(src.owners); } catch(_){}
  if(S.safeClone !== token) return;
  const you = (window._connectedAddress || '').toLowerCase();
  c.safeSrc = {
    addr: src.addr, chainId: src.chainId, version: src.version,
    ownerCount: src.owners.length, threshold: src.threshold,
    // Snapshot everything this function touches — the chain picks included,
    // since loading a Safe found elsewhere moves the deploy target too.
    prev: { owners: c.owners.map(o => ({ ...o })), threshold: c.threshold, name: c.name, net: c.net, clone: (c.clone || []).slice() },
  };
  c.owners = src.owners.map(a => ({ addr: a, label: a.toLowerCase() === you ? 'YOU' : (names[a.toLowerCase()] || '') }));
  c.threshold = String(Math.min(Math.max(src.threshold || 1, 1), c.owners.length));
  const ni = netIdx(src.chainId);
  if(ni >= 0){ c.net = ni; c.clone = (c.clone || []).filter(x => x !== ni); }
  // Name the vault after whatever the operator searched for, but never
  // overwrite a name they typed themselves.
  if(!String(c.name || '').trim()) c.name = (NAME_RE.test(typed || '') ? typed.trim() : 'SAFE ' + src.addr.slice(2, 6)).toUpperCase();
  S.safeClone = null;
  flash(`CLONED ${c.owners.length} OWNERS · ${c.threshold} OF ${c.owners.length}`);
  render();
}

function undoSafeClone(){
  const c = S.cf, s = c.safeSrc;
  if(!s) return;
  if(s.prev){
    c.owners = s.prev.owners?.length ? s.prev.owners : [{ addr:'', label:'' }];
    c.threshold = s.prev.threshold;
    c.name = s.prev.name;
    if(typeof s.prev.net === 'number') c.net = s.prev.net;
    if(Array.isArray(s.prev.clone)) c.clone = s.prev.clone.slice();
  }
  c.safeSrc = null;
  flash('CLONE UNDONE');
  render();
}

function renderSafeCloneModal(){
  const sc = S.safeClone, net = NETS[S.cf.net] || NETS[0];
  const st = _addrState(sc.input || '');
  const rows = (sc.found || []).map(f => `<button class="safe-row" onclick="applyFoundSafe(${f.chainId})">
    ${chainIcon(f.chainId)}<span>${esc(String(CHAINS[f.chainId]?.name || f.chainId).toUpperCase())}</span>
    <span style="margin-left:auto;color:var(--d);font-weight:400">${f.threshold} OF ${f.owners.length}${f.version?' &middot; v'+esc(f.version):''}</span>
    <span aria-hidden="true">&rarr;</span>
  </button>`).join('');
  return`<div class="ovl" onclick="if(event.target===this)closeSafeClone()">
    <div class="ovl-card" style="--ow:440px;padding:20px;border-color:#12FF80" role="dialog" aria-modal="true" aria-label="Clone a Safe">
      <div class="ovl-head" style="align-items:center;gap:10px;margin-bottom:12px">
        <span class="ovl-title" style="display:flex;align-items:center;gap:8px">${safeIcon()}CLONE A SAFE</span>
        <button class="x-btn" style="margin:0" onclick="closeSafeClone()" aria-label="Close">&#10005;</button>
      </div>
      <div style="font-size:10px;line-height:1.7;color:var(--d);margin-bottom:16px">Copies the owners and threshold of a Gnosis Safe on <b style="color:var(--m)">${esc(net.name)}</b> into this form. Your timelock, instant execution and chain picks stay as you set them. Nothing leaves the Safe &mdash; this deploys a new vault, so move funds once it is live.</div>
      <label class="lbl" for="safe-input">SAFE ADDRESS OR NAME</label>
      <input class="inp" id="safe-input" style="margin-bottom:4px" placeholder="0x... or name.eth / name.(g)wei" value="${esc(sc.input||'')}" aria-describedby="safe-status" oninput="safeCloneInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();safeCloneSearch()}">
      <div id="safe-status" role="status" style="font-size:9px;letter-spacing:1px;min-height:12px;margin-bottom:12px;color:${st.color||''}">${esc(st.txt)}</div>
      ${sc.err?`<div style="font-size:9px;letter-spacing:1px;color:var(--r);line-height:1.6;margin-bottom:12px">${esc(sc.err)}</div>`:''}
      ${rows?`<div style="font-size:9px;letter-spacing:1px;color:var(--y);line-height:1.6">NOT ON ${esc(net.name.toUpperCase())} &mdash; FOUND ELSEWHERE. LOADING ONE SWITCHES THIS DEPLOY TO THAT CHAIN.</div>${rows}<div style="height:14px"></div>`:''}
      <button class="btn ${sc.busy?'btn-disabled':'btn-fill'} btn-w" id="safe-load" onclick="${sc.busy?'':'safeCloneSearch()'}">${sc.busy?'READING SAFE&hellip;':'LOAD SAFE'}</button>
    </div>
  </div>`;
}
// CANCEL and VIEW VAULT are the same button in different clothes, but they are
// not the same navigation. Cancelling from the review screen means "let me change
// something" — landing on a dashboard that has nothing new on it throws the form
// away from under the operator. Only a run that actually produced a vault leaves
// the create screen.
function closeDeploy(){
  const d = S.deploy;
  const landed = !!(d && d.lastVaultAddr);
  // Cancelling a run that never landed anywhere leaves nothing to finish, so the
  // mined salt goes with it rather than sitting in storage offering to resume a
  // deploy that never happened. Judged from the stored record rather than this
  // run's steps: a resumed run that lands nothing new is still finishing a vault
  // that does exist, and its record is the only way back to that address.
  if(d && d.ctx && d.ctx.minedAddr){
    const rec = _findResume(_readAllResume(), d.ctx.minedAddr);
    if(!rec || !((rec.doneIds || []).length)) _clearDeployResume(d.ctx.minedAddr);
  }
  S.deploy = null;
  if(landed){ S.view = 'DASH'; S.showTx = false; }
  render();
}

function doDeploy() {
  if (S.demoMode) { demoDeploy(); return; }
  guardSubmit(prodDeploy)();
}

// Demo: simulate the sequential multi-chain deploy so the flow/overlay is visible.
async function demoDeploy() {
  const c = S.cf, net = NETS[c.net];
  const valid = c.owners.filter(o => o.addr.trim());
  if (!valid.length) { flash("ADD AT LEAST 1 OWNER"); return; }
  if (parseInt(c.threshold) > valid.length) { flash("THRESHOLD > OWNER COUNT"); return; }

  const owners = valid.sort((a, b) => a.addr.localeCompare(b.addr))
    .map((o, i) => ({ addr: o.addr, label: o.label || "OWNER " + (i + 1) }));
  owners[0].you = true; owners[0].addr = DEMO_YOU; owners[0].label = owners[0].label || "DEPLOYER";

  const delay = toSec(c.delayVal, c.delayUnit);
  const fp = c.fastPath && delay > 0;
  const addr = "0x" + Array.from({length:40},()=>((Math.random()*16)|0).toString(16)).join("");
  const chainIdxs = [c.net, ...(c.clone||[])].filter((v,i,a)=>a.indexOf(v)===i);

  S.deploy = { run: ++_deployRun, chains: chainIdxs.map(i=>NETS[i]), steps: chainIdxs.map(i=>({ id:NETS[i].id, name:NETS[i].name, status:'pending' })), phase:'deploying', address:null, done:false, lastVaultAddr:null };
  render();
  for (let k=0; k<chainIdxs.length; k++) {
    const st = S.deploy.steps[k];
    st.status = 'switching'; render(); await new Promise(r=>setTimeout(r,350));
    if (k===0){ st.status='mining'; render(); await new Promise(r=>setTimeout(r,500)); S.deploy.address = addr; }
    st.status='deploying'; render(); await new Promise(r=>setTimeout(r,600));
    st.status='done'; st.address=addr; render(); await new Promise(r=>setTimeout(r,150));
  }
  // Marks the run as having produced a vault, which is what tells closeDeploy to
  // hand over to the dashboard rather than back to the form.
  S.deploy.lastVaultAddr = addr;
  S.deploy.done = true;
  const id = "V-" + String(S.vaults.length + 1).padStart(3, "0");
  S.vaults.push({
    id, name: c.name || net.name + "_" + id, chain: net.name, address: addr,
    threshold: parseInt(c.threshold) || 1, ownerCount: owners.length, delay, nonce: 0,
    executor: TIMELOCK_EXECUTOR, holdings: [], owners, queue: [], history: [], fastPath: fp,
  });
  S.sel = S.vaults.length - 1;
  render();
}

function doAdminPropose(action, val) {
  if (S.demoMode) {
    const v = S.vaults[S.sel];
    if (!v) return;
    const n = v.nonce;
    const you = getYou();
    const ap = {};
    v.owners.forEach(o => ap[o.addr] = (o.you || o.addr === you));

    let desc, target = v.address;
    if (action === 'setThreshold') desc = `setThreshold(${val})`;
    else if (action === 'setDelay') desc = `setDelay(${val})`;
    else if (action === 'setExecutor') desc = 'setExecutor(...)';
    else if (action === 'enableForward') { desc = `enableForward(${!v.fastPath})`; target = v.executor; }
    else if (action === 'removeOwner') desc = `removeOwner(${v.owners[val]?.addr || '...'})`;
    else if (action === 'addOwner') { desc = `addOwner(${document.getElementById('admin-add-owner')?.value || '...'})`; }
    else return;

    v.queue.push({ nonce: n, target, value: "0", token: "", dataLabel: desc.toUpperCase(), eta: 0, approvals: ap });
    v.nonce++;
    flash(`PROPOSE: ${desc}`);
    S.view = "DASH";
    render();
  } else {
    guardSubmit(prodAdminPropose)(action, val);
  }
}

// ── PRODUCTION: NAME RESOLUTION ───────────────────────────────────
// All three namespaces are rooted on Ethereum mainnet, so every lookup goes
// through this dedicated mainnet provider rather than the active `provider` — a
// name means the same thing whether the app is pointed at Base, Arbitrum or a
// testnet. The consequence is that resolution is a *foreign* network call from
// every chain but one, which is why it is bounded by a timeout and why its
// failures are classified instead of collapsed into "not found".
// Called rather than captured in a const so the lookup always goes through
// makeProvider's cache, which is also what the rest of the app uses for chain 1.
function mainnetRpc() { return makeProvider(1); }
const NAME_TIMEOUT_MS = 12000;

class NameError extends Error {
  constructor(kind, msg){ super(msg); this.nameKind = kind; this.shortMessage = msg; }
}
// 'notfound'    — mainnet answered, the name has no address
// 'offchain'    — an ENS name whose CCIP-read gateway could not be reached
// 'unreachable' — mainnet itself did not answer
// 'invalid'     — not an address and not a name we resolve
function _nameKind(e){
  if(e && e.nameKind) return e.nameKind;
  if(e && e.code === 'OFFCHAIN_FAULT') return 'offchain';
  if(e && (e.code === 'NETWORK_ERROR' || e.code === 'SERVER_ERROR' || e.code === 'TIMEOUT' || e.code === 'UNKNOWN_ERROR')) return 'unreachable';
  return 'notfound';
}
// A wedged mainnet RPC must not hang a deploy or a send happening on another
// chain entirely, so every mainnet name call is bounded.
function _nameRace(p){
  let t;
  return Promise.race([
    p, new Promise((_, rej) => { t = setTimeout(() => rej(new NameError('unreachable', 'MAINNET DID NOT ANSWER')), NAME_TIMEOUT_MS); })
  ]).finally(() => clearTimeout(t));
}
// One vocabulary for every "that name did not resolve" message in the app.
// Telling someone on Arbitrum that their name does not exist, when what
// happened is that mainnet timed out, is the failure this exists to prevent.
function nameErrText(raw, e){
  const r = String(raw || '').toUpperCase();
  switch(_nameKind(e)){
    case 'offchain':    return `${r} RESOLVES OFFCHAIN — ITS GATEWAY IS BLOCKED OR DOWN`;
    case 'unreachable': return 'CANNOT REACH ETHEREUM MAINNET TO RESOLVE NAMES';
    case 'invalid':     return 'ENTER A VALID ADDRESS OR NAME';
    default:            return `${r} DOES NOT RESOLVE`;
  }
}

// ethers reports an unreachable provider as "no resolver" — resolveName returns
// null rather than throwing — so a blank answer is ambiguous: the name may not
// exist, or mainnet may not be answering. One cheap probe settles it, and it
// only runs on the failure path. This is the difference between telling an
// Arbitrum user their name is wrong and telling them mainnet is down.
async function _nameFailure(v, e){
  let kind = _nameKind(e);
  if(kind === 'notfound'){
    // The probe has to actually leave the machine. getBlockNumber is answered
    // from the FallbackProvider's cached height, and getCode of a fixed address
    // is served from ethers' result cache — both report healthy while every
    // backend is down. Reading an address nobody has ever touched, different on
    // each probe, is the cheapest call that cannot come from a cache.
    const probe = '0x' + String(Date.now()).padStart(40, '0').slice(-40);
    try { await _nameRace(mainnetRpc().getCode(probe)); }
    catch(_) { kind = 'unreachable'; }
  }
  return new NameError(kind, nameErrText(v, { nameKind: kind }));
}

async function resolveName(input) {
  const v = input.trim();
  if(!v) throw new NameError('invalid', 'ENTER AN ADDRESS OR NAME');
  if(ethers.isAddress(v)) return ethers.getAddress(v);
  // .wei / .gwei — same contract shape, picked by suffix. Each hashes its own
  // suffix away and ignores case, but neither knows the other's: handing a
  // .gwei name to WNS hashes to an unrelated id that may well be registered.
  // So the service is chosen by suffix before a single call is made.
  const svc = nsFor(v);
  if(svc) {
    const ns = new ethers.Contract(svc.addr, WEINS_ABI, mainnetRpc());
    let addr;
    try {
      const tokenId = await _nameRace(ns.computeId(v));
      // resolve() = explicit recipient if set, else owner; 0 if inactive/expired.
      addr = await _nameRace(ns.resolve(tokenId));
    } catch(e) { throw await _nameFailure(v, e); }
    // The call itself succeeded here, so a zero really is an unregistered or
    // expired name — no liveness probe needed.
    if(!addr || addr === ethers.ZeroAddress) throw new NameError('notfound', nameErrText(v, { nameKind:'notfound' }));
    return ethers.getAddress(addr);
  }
  // Case-insensitive to match the field hints: ENS normalizes the name itself,
  // and both name contracts hash case-insensitively, so TYPED.ETH resolves.
  if(/\.eth$/i.test(v)) {
    let addr;
    try { addr = await _nameRace(mainnetRpc().resolveName(v)); }
    catch(e) { throw await _nameFailure(v, e); }
    if(!addr) throw await _nameFailure(v, null);
    return ethers.getAddress(addr);
  }
  throw new NameError('invalid', 'ENTER AN ADDRESS, .eth, .wei OR .gwei NAME');
}

// ── NAME PREVIEW (what you review is what you sign) ───────────────
// A signer approving a send to "alice.eth" has to see the address that send
// will actually carry. Punting it to the wallet prompt does not work here: in
// a multisig the co-signers never see that prompt — they see the queued
// proposal, already resolved, and vote on it. So names are resolved in the
// review card, before anything is signed.
//
// Resolution is async and the review repaints on every keystroke, so each
// result is cached per (name, chain) and the card is repainted when one lands.
const _namePreview = {};
function _pvKey(raw, chainId){ return String(raw || '').trim().toLowerCase() + '@' + chainId; }

// ENSIP-11: a name may publish a different address for a specific chain. Worth
// surfacing — sending to the mainnet address of a wallet that lives elsewhere
// on this chain is unrecoverable — but not worth silently obeying: distinct L2
// records are vanishingly rare (none of ENS's own, Base's or Coinbase's names
// publish one), and quietly disagreeing with every other tool about where funds
// go is its own hazard. So it warns; it never redirects. Never throws.
async function altChainAddress(name, chainId, mainAddr){
  if(!chainId || chainId === 1 || !/\.eth$/i.test(name)) return null;
  try {
    const r = await _nameRace(mainnetRpc().getResolver(name));
    if(!r) return null;
    const a = await _nameRace(r.getAddress(0x80000000 + chainId));
    if(!a || !ethers.isAddress(a)) return null;
    const addr = ethers.getAddress(a);
    return addr.toLowerCase() === String(mainAddr).toLowerCase() ? null : addr;
  } catch(_) { return null; }
}

// Kick off (or reuse) resolution of `raw` for display. Returns the entry
// synchronously so the renderer can show 'resolving' immediately.
function previewName(raw, chainId, onSettle){
  const key = String(raw || '').trim();
  if(!key || !NAME_RE.test(key)) return null;
  const ck = _pvKey(key, chainId);
  if(_namePreview[ck]) return _namePreview[ck];
  const entry = _namePreview[ck] = { state:'resolving', addr:null, alt:null, err:'' };
  (async () => {
    try {
      entry.addr = await resolveName(key);
      entry.state = 'ok';
      entry.alt = await altChainAddress(key, chainId, entry.addr);
    } catch(e) {
      entry.state = 'err';
      entry.err = e.shortMessage || e.message || 'DOES NOT RESOLVE';
    }
    try { onSettle && onSettle(entry); } catch(_) {}
  })();
  return entry;
}

// What was reviewed is what gets signed. Names are mutable, and the gap between
// reviewing a proposal and signing it is exactly where a repoint would land.
function assertPreviewed(raw, resolved, chainId){
  const p = _namePreview[_pvKey(raw, chainId)];
  if(p && p.state === 'ok' && p.addr && p.addr.toLowerCase() !== String(resolved).toLowerCase())
    throw new Error(`${String(raw).toUpperCase()} NOW RESOLVES ELSEWHERE — REVIEW IT AGAIN`);
  return resolved;
}

// Reverse-resolve owner addresses to human-readable names. Primary: WNS (.wei)
// and GNS (.gwei) reverse resolution, both batched into ONE Multicall3 call on
// mainnet, .wei preferred when an address holds a name in both.
// Fallback: ENS reverse for any still-unnamed owners (best-effort, parallel).
// Returns a lowercased-address → name map; never throws.
const _ownerNameCache = {};
// Drop one address's cached answer. An owner's name is theirs and changes on
// their schedule, but a vault's name changes on *this app's* — the NAME tab
// claims one, and a confirmed "no name" cached before that claim would outlive
// it for the rest of the session, leaving the vault showing as an address in
// the one interface that just gave it a name.
function forgetOwnerName(addr){ if(addr) delete _ownerNameCache[String(addr).toLowerCase()]; }
async function resolveOwnerNames(addrs) {
  const out = {};
  if(!addrs || !addrs.length) return out;
  const need = [];
  for(const a of addrs) {
    const k = String(a).toLowerCase();
    if(_ownerNameCache[k] !== undefined) { if(_ownerNameCache[k]) out[k] = _ownerNameCache[k]; }
    // Anything that is not an address is skipped rather than encoded: one bad
    // entry would otherwise throw and cost every other owner its name.
    else if(ethers.isAddress(a)) need.push(a);
  }
  if(!need.length) return out;
  // A lookup that never completed must not be remembered as "this address has
  // no name" — mainnet is a foreign network from every other chain, and one
  // rate-limited burst would otherwise blank the signer list for the rest of
  // the session. Only addresses mainnet actually answered for get cached.
  const answered = new Set();
  // 1) Batched .wei + .gwei reverse resolution in a single Multicall3 on
  // mainnet. Services are walked in NAME_SERVICES order and the first name
  // found wins, so .wei takes precedence over .gwei for the same address.
  const claimed = {};
  try {
    const mc = new ethers.Contract(MC3, MC3_ABI, mainnetRpc());
    const calls = [];
    for(const svc of NAME_SERVICES) {
      for(const a of need) calls.push({ target: svc.addr, allowFailure: true, callData: weinsIface.encodeFunctionData('reverseResolve', [a]) });
    }
    const res = await mc.aggregate3(calls);
    res.forEach((r, n) => {
      const k = need[n % need.length].toLowerCase();
      answered.add(k);
      if(!r.success || claimed[k]) return;   // failed, or a preferred service already named it
      try {
        const nm = weinsIface.decodeFunctionResult('reverseResolve', r.returnData)[0];
        if(nm) claimed[k] = { name: nm.toLowerCase(), svc: NAME_SERVICES[Math.floor(n / need.length)] };
      } catch(_) {}
    });
  } catch(e) { console.error('wei/gwei reverse resolve:', e); }
  // 1b) A reverse record is a string the address chose, not proof of anything:
  // the name can be repointed with setAddr or sold on afterwards, and the stale
  // record survives. ENS reverse is forward-verified for us by ethers, so do
  // the same here — resolve each claimed name and keep only the ones that come
  // back to the address claiming them. One extra batched call, and a displayed
  // name means what a signer would assume it means.
  const claims = Object.entries(claimed);
  if(claims.length) {
    try {
      const mc = new ethers.Contract(MC3, MC3_ABI, mainnetRpc());
      // computeId is pure but still a call, so batch it too rather than firing
      // one per owner: a cloned Safe can bring a hundred of them.
      const idRes = await mc.aggregate3(claims.map(([, c]) =>
        ({ target: c.svc.addr, allowFailure: true, callData: weinsIface.encodeFunctionData('computeId', [c.name]) })));
      const fwdCalls = [];
      const fwdOf = [];
      idRes.forEach((r, i) => {
        if(!r.success) return;
        try {
          const id = weinsIface.decodeFunctionResult('computeId', r.returnData)[0];
          fwdOf.push(i);
          fwdCalls.push({ target: claims[i][1].svc.addr, allowFailure: true, callData: weinsIface.encodeFunctionData('resolve', [id]) });
        } catch(_) {}
      });
      const fwd = fwdCalls.length ? await mc.aggregate3(fwdCalls) : [];
      fwd.forEach((r, n) => {
        if(!r.success) return;
        try {
          const back = weinsIface.decodeFunctionResult('resolve', r.returnData)[0];
          const [k, c] = claims[fwdOf[n]];
          if(String(back).toLowerCase() === k) out[k] = c.name;
        } catch(_) {}
      });
    } catch(e) {
      // Could not verify: show nothing rather than an unverified name, and do
      // not remember the blank — these addresses go back in the queue.
      console.error('wei/gwei forward verify:', e);
      for(const [k] of claims) answered.delete(k);
    }
  }
  // 2) ENS fallback for owners without a verified .wei / .gwei name. Capped
  // concurrency: lookupAddress is several round trips each, and a cloned Safe
  // can arrive with a hundred owners at once.
  const unnamed = need.filter(a => !out[a.toLowerCase()]);
  if(unnamed.length) {
    const queue = unnamed.slice();
    await Promise.all(Array.from({ length: Math.min(6, queue.length) }, async () => {
      while(queue.length) {
        const a = queue.shift();
        // lookupAddress forward-verifies the ENS name before returning it.
        // On failure the address has to be un-answered: step 1 already marked
        // it, and leaving that mark caches "no name" for an owner whose ENS
        // name was merely rate-limited away — the exact poisoning this guards.
        try { const nm = await mainnetRpc().lookupAddress(a); if(nm) out[a.toLowerCase()] = String(nm).toLowerCase(); answered.add(a.toLowerCase()); }
        catch(_) { answered.delete(a.toLowerCase()); }
      }
    }));
  }
  // Cache both hits and confirmed misses; leave unanswered addresses uncached
  // so a later call can try again.
  for(const a of need) {
    const k = a.toLowerCase();
    if(out[k]) _ownerNameCache[k] = out[k];
    else if(answered.has(k)) _ownerNameCache[k] = null;
  }
  return out;
}

// ── PRODUCTION: MULTICALL ─────────────────────────────────────────

async function multicallLoad(addr) {
  try {
    const mc = getMC3();
    const encode = fn => ({ target: addr, allowFailure: false, callData: msIface.encodeFunctionData(fn) });
    const fns = ['threshold','delay','nonce','executor','ownerCount','getOwners'];
    const [results, balance] = await Promise.all([mc.aggregate3(fns.map(encode)), provider.getBalance(addr)]);
    const d = (fn, i) => msIface.decodeFunctionResult(fn, results[i].returnData)[0];
    return { threshold:d('threshold',0), delay:d('delay',1), nonce:d('nonce',2), executor:d('executor',3), ownerCount:d('ownerCount',4), owners:d('getOwners',5), balance };
  } catch(e) {
    // Fallback for chains without Multicall3
    const ms = new ethers.Contract(addr, MULTISIG_ABI, provider);
    const [threshold, delay, nonce, executor, ownerCount, owners, balance] = await Promise.all([
      ms.threshold(), ms.delay(), ms.nonce(), ms.executor(), ms.ownerCount(), ms.getOwners(), provider.getBalance(addr)
    ]);
    return { threshold, delay, nonce, executor, ownerCount, owners, balance };
  }
}

async function loadTokenBalances(walletAddr, ethBalance) {
  const base = PROD_TOKENS[S.chainId] || ETH_ONLY;
  const seen = new Set(base.map(t => t.address.toLowerCase()));
  const custom = customTokensFor(S.chainId, walletAddr).filter(t => t.address && !seen.has(t.address.toLowerCase()));
  const allTokens = [...base, ...custom];
  const erc20Tokens = allTokens.filter(t => t.address !== ethers.ZeroAddress);

  const feeds = CHAINLINK_FEEDS[S.chainId] || {};
  const feedSymbols = Object.keys(feeds);
  const latestAnswerData = clIface.encodeFunctionData('latestAnswer');
  let balances, prices = {};

  try {
    const mc = getMC3();
    const balCalls = erc20Tokens.map(t => ({
      target: t.address, allowFailure: true,
      callData: erc20Iface.encodeFunctionData('balanceOf', [walletAddr])
    }));
    const priceCalls = feedSymbols.map(sym => ({
      target: feeds[sym], allowFailure: true,
      callData: latestAnswerData
    }));
    const results = await mc.aggregate3([...balCalls, ...priceCalls]);

    balances = results.slice(0, balCalls.length).map(r => ({
      success: r.success,
      bal: r.success ? erc20Iface.decodeFunctionResult('balanceOf', r.returnData)[0] : 0n
    }));
    results.slice(balCalls.length).forEach((r, i) => {
      if(r.success) {
        const answer = clIface.decodeFunctionResult('latestAnswer', r.returnData)[0];
        prices[feedSymbols[i]] = Number(answer) / 1e8;
      }
    });
  } catch(e) {
    console.error('Token balances:', e);
    balances = [];
  }

  if(ethBalance == null) ethBalance = await provider.getBalance(walletAddr);
  const ethPrice = prices['ETH'] || 0;
  const stableSymbols = new Set(['USDC', 'USDT', 'USDT0', 'DAI']);
  const holdings = [];

  // ETH
  if(ethBalance > 0n) {
    const ethAmount = Number(ethers.formatEther(ethBalance));
    const ethUsd = ethPrice > 0 ? ethAmount * ethPrice : 0;
    holdings.push({token:'ETH', balance:ethers.formatEther(ethBalance).slice(0,10), usd: ethUsd > 0 ? `$${ethUsd.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}` : '', raw: ethBalance.toString(), decimals: 18});
  }

  // ERC20s
  erc20Tokens.forEach((t, i) => {
    if(!balances[i] || !balances[i].success || balances[i].bal === 0n) return;
    const formatted = ethers.formatUnits(balances[i].bal, t.decimals);
    const amount = Number(formatted);
    const display = t.decimals <= 8 ? amount.toFixed(2) : amount.toFixed(4).replace(/\.?0+$/, '');
    let usd = 0;
    if(stableSymbols.has(t.symbol)) {
      usd = amount;
    } else if(prices[t.symbol]) {
      usd = amount * prices[t.symbol];
    }
    holdings.push({token:t.symbol, balance:display, usd: usd > 0 ? `$${usd.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}` : '', raw: balances[i].bal.toString(), decimals: t.decimals});
  });

  return holdings;
}
