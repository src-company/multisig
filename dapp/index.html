// ── UTILITIES ─────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const DECIMALS = { ETH: 18, USDC: 6, USDT: 6, USDT0: 6, DAI: 18, WBTC: 8, wstETH: 18, cbBTC: 8 };

function stripCommas(s) { return String(s).replace(/,/g, ''); }

function toUnits(val, dec) {
  if (!val || val === "0") return "0";
  const s = val.replace(/,/g, "");
  if (!/^\d*\.?\d+$/.test(s)) return "INVALID";
  const p = s.split(".");
  const w = p[0] || "0";
  const f = (p[1] || "").padEnd(dec, "0").slice(0, dec);
  return (w + f).replace(/^0+/, "") || "0";
}

function fmtEta(eta) {
  if (!eta) return null;
  const d = eta - NOW();
  if (d <= 0) return "READY";
  const h = Math.floor(d / 3600), m = Math.floor((d % 3600) / 60), s = d % 60;
  if (h > 0) return `${h}H ${m}M`;
  if (m > 0) return `${m}M ${s}S`;
  return `${s}S`;
}

function fmtD(s) {
  if (!s) return "0";
  const h = s / 3600;
  if (h >= 24) return `${Math.floor(h / 24)}D`;
  if (h < 1) return `${Math.round(s / 60)}M`;
  return Number.isInteger(h) ? `${h}H` : `${h.toFixed(1)}H`;
}

// Timelock delay is set in a user-chosen unit (minutes/hours/days) but stored
// on-chain as uint32 seconds. These convert between the two.
const UNIT_SEC = { m: 60, h: 3600, d: 86400 };
const UNIT_LABEL = { m: 'MIN', h: 'HR', d: 'DAY' };
// Below this a non-zero timelock offers little practical protection — warn, don't block.
const SHORT_DELAY_SEC = 600;
// value (in `unit`) -> whole seconds
function toSec(val, unit) { return Math.floor((parseFloat(val) || 0) * (UNIT_SEC[unit] || 3600)); }
// seconds -> the tidiest {val, unit} that represents it exactly
function fromSec(sec) {
  if (!sec || sec <= 0) return { val: 0, unit: 'h' };
  if (sec % 86400 === 0) return { val: sec / 86400, unit: 'd' };
  if (sec % 3600 === 0) return { val: sec / 3600, unit: 'h' };
  return { val: sec / 60, unit: 'm' };
}
// set the admin "new delay" value+unit from a seconds figure (picks tidiest unit)
function setNd(sec) { const p = fromSec(sec); S.nd = p.val; S.ndUnit = p.unit; }

// middle-ellipsis for a full 0x address; passes anything else through unchanged
function shortAddr(a){return /^0x[0-9a-fA-F]{40}$/.test(a||"")?a.slice(0,6)+"…"+a.slice(-4):(a||"");}

const _selectorLabels = {};
function selectorToLabel(callData) {
  if(!callData || callData === '0x') return 'TRANSFER';
  if(callData.length < 10) return 'CALL';
  const sel = callData.slice(0, 10);
  if(_selectorLabels[sel] !== undefined) return _selectorLabels[sel];
  const map = [
    [erc20Iface, 'transfer', 'ERC20 TRANSFER'],
    [msIface, 'addOwner', 'ADD OWNER'], [msIface, 'removeOwner', 'REMOVE OWNER'],
    [msIface, 'setThreshold', 'SET THRESHOLD'], [msIface, 'setDelay', 'SET DELAY'],
    [msIface, 'setExecutor', 'SET EXECUTOR'], [msIface, 'cancelQueued', 'CANCEL'],
    [msIface, 'executeQueued', 'ACCELERATE'], [msIface, 'batch', 'BATCH'],
    [msIface, 'delegateCall', 'DELEGATE CALL'], [tlIface, 'enableForward', 'ENABLE FORWARD'],
    [slowIface, 'depositTo', 'SLOW TRANSFER'], [erc20Iface, 'approve', 'ERC20 APPROVE'],
  ];
  for(const [iface, fn, label] of map) {
    if(sel === iface.getFunction(fn).selector) { _selectorLabels[sel] = label; return label; }
  }
  const fallback = `CALL ${sel}`;
  _selectorLabels[sel] = fallback;
  return fallback;
}

// ── PROPOSAL CLASSIFICATION ───────────────────────────────────────
// Every proposal type this vault can hold, resolved from the call itself to a
// badge and one plain sentence about what executing it actually does. Read from
// target/value/calldata rather than from anything this UI recorded, so a
// proposal raised by another tool is described identically.
//
// Returns { label, tone, note, warn, icon }. `tone` drives the badge colour;
// `warn` marks proposals whose consequences outlive them — a weaker policy, a
// standing allowance, foreign code in the vault's own storage. Routine asset
// movements carry no note: the amount and the recipient already say it.
function txKind(tx, v) {
  const data = tx.callData || '0x';
  const val = tx.rawValue ? BigInt(tx.rawValue) : 0n;
  const self = !!(v.address && tx.target && tx.target.toLowerCase() === v.address.toLowerCase());
  const sel = data.length >= 10 ? data.slice(0, 10) : '';
  const is = (iface, fn) => sel === iface.getFunction(fn).selector;
  const dec = (fn, iface) => { try { return (iface || msIface).decodeFunctionData(fn, data); } catch(_) { return null; } };
  const at = a => a ? shortAddr(a) : 'AN ADDRESS';

  // ── no calldata: value moves, or a nonce-consuming no-op ──
  if(data === '0x') {
    if(self && val === 0n) return { label:'REJECT · NO-OP', tone:'danger',
      note:'A DO-NOTHING SELF-CALL WHOSE ONLY EFFECT IS TO CONSUME THIS NONCE, SO LATER PROPOSALS CAN PROCEED. IT MOVES NOTHING.' };
    if(tx.isStake || isStakeCall(tx.target, data)) return { label:'STAKE · ETH → wstETH', tone:'stake', icon:'wstETH',
      note:'STAKES ETH WITH LIDO — THE wstETH CONTRACT MINTS wstETH STRAIGHT BACK TO THE VAULT. HOW MUCH IS SET BY THE RATE AT EXECUTION, NOT NOW.' };
    return { label:'ETH TRANSFER', tone:'value' };
  }

  // ── asset movement ──
  if(is(erc20Iface, 'transfer')) return { label:'ERC20 TRANSFER', tone:'value' };
  if(is(erc20Iface, 'approve')) {
    const d = dec('approve', erc20Iface);
    const max = d && d[1] != null && BigInt(d[1]) >= (2n ** 255n);
    return { label:'ERC20 APPROVE', tone:'code', warn:true,
      note:`LETS ${at(d && d[0])} MOVE ${max ? 'AN UNLIMITED AMOUNT OF' : 'UP TO THE APPROVED AMOUNT OF'} THIS TOKEN OUT OF THE VAULT, AT ANY TIME, UNTIL THE ALLOWANCE IS REVOKED. IT DOES NOT EXPIRE WITH THIS PROPOSAL.` };
  }
  if(is(slowIface, 'depositTo')) {
    const d = dec('depositTo', slowIface);
    const delay = d ? Number(d[3]) : 0;
    return { label:`SLOW · ${delay ? fmtDelay(delay) : 'DELAYED'}`, tone:'slow',
      note:`LOCKS THE ASSET IN A TIME-DELAYED CLAIM FOR ${at(d && d[1])}. THEY CAN COLLECT IT ONLY AFTER ${delay ? fmtDelay(delay) : 'THE DELAY'}, AND THE VAULT CAN REVERSE IT AT ANY POINT BEFORE THEN.` };
  }

  // ── policy: outlives the proposal, so every one of these gets a note ──
  if(is(msIface, 'addOwner')) {
    const d = dec('addOwner');
    return { label:'ADD OWNER', tone:'policy',
      note:`ADDS ${at(d && d[0])} AS AN OWNER &mdash; ${v.ownerCount} &rarr; ${v.ownerCount + 1} OWNERS. THE THRESHOLD STAYS AT ${v.threshold}, SO EACH SIGNATURE COVERS A SMALLER SHARE OF THE OWNER SET.` };
  }
  if(is(msIface, 'removeOwner')) {
    const d = dec('removeOwner');   // (prevOwner, owner) — the second is the one removed
    const tooFew = v.ownerCount <= v.threshold;
    return { label:'REMOVE OWNER', tone:'policy', warn:tooFew,
      note:`REMOVES ${at(d && d[1])} &mdash; ${v.ownerCount} &rarr; ${v.ownerCount - 1} OWNERS, STILL ${v.threshold} SIGNATURES REQUIRED.` +
        (tooFew ? ` THAT WOULD LEAVE FEWER OWNERS THAN THE THRESHOLD, SO THE CALL WILL REVERT.` : '') };
  }
  if(is(msIface, 'setThreshold')) {
    const d = dec('setThreshold');
    const n = d ? Number(d[0]) : null;
    const lower = n != null && n < v.threshold;
    return { label:'SET THRESHOLD', tone:'policy', warn:lower,
      note:`REQUIRES ${n != null ? n : '?'} OF ${v.ownerCount} SIGNATURES AFTER THIS, FROM ${v.threshold} NOW.` +
        (n === 1 ? ` AT 1, ANY SINGLE OWNER COULD MOVE EVERYTHING ON THEIR OWN.` : lower ? ` THIS LOWERS THE BAR FOR EVERY FUTURE PROPOSAL, INCLUDING ONES ALREADY IN THE QUEUE.` : '') };
  }
  if(is(msIface, 'setDelay')) {
    const d = dec('setDelay');
    const s = d ? Number(d[0]) : null;
    const shorter = s != null && s < v.delay;
    return { label:'SET TIMELOCK', tone:'policy', warn:shorter,
      note:`TIMELOCK BECOMES ${s == null ? '?' : s === 0 ? 'NONE' : fmtD(s)}, FROM ${v.delay ? fmtD(v.delay) : 'NONE'} NOW.` +
        (s === 0 ? ` AT ZERO THERE IS NO DELAY AT ALL — PROPOSALS EXECUTE THE MOMENT THEY REACH QUORUM, WITH NO WINDOW TO CANCEL ONE.` :
         shorter ? ` A SHORTER DELAY MEANS LESS TIME TO SPOT AND CANCEL A BAD PROPOSAL.` : '') };
  }
  if(is(msIface, 'setExecutor')) {
    const d = dec('setExecutor');
    const a = d ? d[0] : null;
    const clearing = a && a === ethers.ZeroAddress;
    return { label:'SET EXECUTOR', tone:'policy', warn:true,
      note:clearing
        ? `REMOVES THE VAULT'S EXECUTOR. THE FAST PATH AND THE CANCEL/ACCELERATE ROUTES THAT RUN THROUGH IT ALL STOP WORKING.`
        : `POINTS THE VAULT AT ${at(a)} AS ITS TIMELOCK EXECUTOR. THAT CONTRACT CAN THEN FORWARD CALLS ON THE VAULT'S BEHALF — VERIFY IT BEFORE SIGNING.` };
  }
  if(is(tlIface, 'enableForward')) {
    const d = dec('enableForward', tlIface);
    const on = d ? !!d[0] : null;
    return { label:'EXECUTOR FAST PATH', tone:'policy', warn:on === true,
      note:on
        ? `TURNS ON THE FAST PATH — ONCE EVERY OWNER SIGNS, A PROPOSAL CAN SKIP THE TIMELOCK ENTIRELY.`
        : `TURNS OFF THE FAST PATH — EVERY PROPOSAL MUST THEN SERVE THE FULL TIMELOCK, WITH NO UNANIMOUS SHORTCUT.` };
  }

  // ── queue control ──
  if(is(msIface, 'cancelQueued')) return { label:'CANCEL QUEUED', tone:'danger',
    note:`DROPS A PROPOSAL THAT IS ALREADY QUEUED, BEFORE ITS TIMELOCK ELAPSES. THE CANCELLED PROPOSAL CANNOT THEN EXECUTE.` };
  if(is(msIface, 'executeQueued')) return { label:'ACCELERATE', tone:'danger',
    note:`EXECUTES A QUEUED PROPOSAL IMMEDIATELY, SKIPPING WHATEVER IS LEFT OF ITS TIMELOCK. THIS IS THE STEP THE DELAY EXISTS TO PREVENT, SO IT TAKES EVERY OWNER'S SIGNATURE.` };

  // ── composite / raw ──
  if(is(msIface, 'batch')) {
    const d = dec('batch');
    if(d) {
      const [targets, values, datas] = d;
      const parts = datas.map((cd, i) => (!cd || cd === '0x') && BigInt(values[i]) > 0n ? 'ETH TRANSFER' : selectorToLabel(cd));
      return { label:`BATCH · ${targets.length} CALLS`, tone:'code',
        note:`${parts.join(' + ')} — EXECUTED ATOMICALLY, SO EITHER EVERY CALL LANDS OR THE WHOLE PROPOSAL REVERTS AND NOTHING DOES.` };
    }
    return { label:'BATCH', tone:'code', note:`SEVERAL CALLS EXECUTED ATOMICALLY — ALL SUCCEED, OR THE WHOLE PROPOSAL REVERTS.` };
  }
  if(is(msIface, 'delegateCall')) {
    const d = dec('delegateCall');
    return { label:'DELEGATE CALL', tone:'danger', warn:true,
      note:`RUNS ${at(d && d[0])}'S CODE INSIDE THE VAULT'S OWN STORAGE. IT CAN REACH EVERY ASSET THE VAULT HOLDS AND REWRITE EVERY SETTING IT HAS, INCLUDING THE OWNER SET. ONLY APPROVE THIS IF YOU HAVE READ THAT CODE.` };
  }

  return { label:`CALL ${sel || '?'}`, tone:'code', warn:true,
    note:`UNRECOGNISED FUNCTION. NOTHING IN THIS INTERFACE CAN TELL YOU WHAT IT DOES — READ THE TARGET CONTRACT AND THE CALLDATA, OR SIMULATE IT, BEFORE SIGNING.` };
}

function isCancelTx(tx, v) {
  return tx.cancelTarget != null
    || (tx.callData && tx.callData.length >= 10
        && tx.callData.slice(0, 10) === msIface.getFunction('cancelQueued').selector
        && tx.target && tx.target.toLowerCase() === v.address.toLowerCase());
}

function nextNonce(v) {
  return v.queue.length
    ? Math.max(v.nonce, ...v.queue.map(t => t.nonce + 1))
    : v.nonce;
}

// Pending self-calls that mutate the owner set / threshold. Because execution
// is strictly sequential by nonce, a new owner change created now executes
// AFTER these and may revert if the set shifts first — used to warn the user.
let _policySelectors = null;
function pendingPolicyChanges(v) {
  if(!v || !v.address || !v.queue) return [];
  if(!_policySelectors) _policySelectors = {
    [msIface.getFunction('addOwner').selector]: 'ADD OWNER',
    [msIface.getFunction('removeOwner').selector]: 'REMOVE OWNER',
    [msIface.getFunction('setThreshold').selector]: 'SET THRESHOLD',
  };
  const self = v.address.toLowerCase();
  return v.queue.filter(t => t.target && t.target.toLowerCase() === self && t.callData && _policySelectors[t.callData.slice(0,10)])
    .map(t => ({ nonce: t.nonce, label: _policySelectors[t.callData.slice(0,10)] }));
}

function txSt(tx, v) {
  const you = getYou();
  const ac = Object.values(tx.approvals).filter(Boolean).length;

  if (tx.eta > 0) {
    const csc = tx.cancelSigners ? tx.cancelSigners.size : 0;
    const cancelReady = csc >= v.threshold;
    const youCancel = you && tx.cancelSigners && tx.cancelSigners.has(you.toLowerCase());

    if (fmtEta(tx.eta) === "READY") {
      return { l: "READY", c: "var(--g)", exec: true,
        cancel: !cancelReady && !youCancel, cancelExec: cancelReady, cancelSigs: csc };
    }

    const accelSigCount = tx.accelSigners ? tx.accelSigners.size : 0;
    const accelReady = v.fastPath && accelSigCount >= v.ownerCount;
    const youAccel = you && tx.accelSigners && tx.accelSigners.has(you.toLowerCase());

    return { l: fmtEta(tx.eta), c: "var(--d)",
      cancel: !cancelReady && !youCancel, cancelExec: cancelReady, cancelSigs: csc,
      accel: v.fastPath && !accelReady && !youAccel, accelExec: accelReady, accelSigs: accelSigCount };
  }

  if (ac < v.threshold) return { l: `${ac}/${v.threshold} SIGS`, c: "var(--y)", sign: true };
  if (v.delay === 0) return { l: "EXECUTE", c: "var(--g)", queue: true, instant: true };
  return { l: "SUBMIT", c: "var(--a)", queue: true };
}

function getYou(){
  if(S.demoMode) return DEMO_YOU;
  return window._connectedAddress || null;
}

// Best short identity for an owner: custom label, else resolved
// .wei/.gwei/ENS name, else a shortened address.
function ownerIdent(o){
  return o.label || o.name || (o.addr && ethers.isAddress(o.addr) ? o.addr.slice(0,6)+'…'+o.addr.slice(-4) : (o.addr || ''));
}

function addrLink(addr, chain) {
  const safe = esc(addr);
  const base = S.demoMode
    ? (EXPLORERS[chain] || EXPLORERS.ETHEREUM)
    : (CHAINS[S.chainId]?.explorer || 'https://etherscan.io');
  if (ethers.isAddress(addr)) {
    return `<a class="alink" href="${base}/address/${safe}" target="_blank" rel="noopener" title="${safe}" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--ln)">${esc(shortAddr(addr))}</a>`;
  }
  return `<span style="border-bottom:1px solid var(--ln)">${safe}</span>`;
}

// Small copy-to-clipboard button (⧉) with a flash confirmation.
function copyBtn(text, msg) {
  return `<button class="x-btn copy-btn" style="display:inline-flex;min-width:auto;min-height:auto;padding:2px 5px;font-size:9px;vertical-align:middle" onclick="event.stopPropagation();navigator.clipboard.writeText('${esc(text)}');flash('${msg||'ADDRESS COPIED'}')" title="Copy address">⧉</button>`;
}

function highlightTx(nonce) {
  const el = document.querySelector(`[data-tx-nonce="${nonce}"]`);
  if (el) { el.classList.remove('tx-linked'); void el.offsetWidth; el.classList.add('tx-linked'); }

// Inline validity hint for the load-existing-vault field.
function updateLoadStatus(val) {
  const el = document.getElementById('load-status');

  if (!t) { el.textContent = ''; return; }
  if (ethers.isAddress(t)) { el.textContent = 'VALID ADDRESS'; el.style.color = 'var(--g)'; }

// ── ABI FETCH (Sourcify) ─────────────────────────────────────────
// Cache: false=EOA, []=unverified contract, [...]=verified fns, undefined=not fetched
const _abiCache = {};
const _ABI_CACHE_MAX = 200;
let _cxDebounce = null;
const SOURCIFY_REPO = 'https://repo.sourcify.dev/contracts';
// Proxy implementation storage slots
const IMPL_SLOTS = [
  '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc', // EIP-1967
  '0x7050c9e0f4ca769c69bd3a8ef740bc37934f8e2c036e5a723fd8ee048ed3f8c3', // OZ legacy
];

async function sourcifyAbi(chainId, addr) {
  for(const match of ['full_match', 'partial_match']) {
    try {
      const res = await fetch(`${SOURCIFY_REPO}/${match}/${chainId}/${addr}/metadata.json`);
      if(res.ok) {
        const json = await res.json();
        return (json.output && json.output.abi) || [];
      }
    } catch(_) {}
  }
  return null;
}

function extractWriteFns(abi) {
  return abi
    .filter(item => item.type === 'function' && item.stateMutability !== 'view' && item.stateMutability !== 'pure')
    .sort((a, b) => a.name.localeCompare(b.name));
}

async function fetchContractAbi(addr) {
  const key = S.chainId + ':' + addr.toLowerCase();
  if(_abiCache[key] !== undefined) return _abiCache[key];
  if(Object.keys(_abiCache).length >= _ABI_CACHE_MAX) {
    const first = Object.keys(_abiCache)[0]; delete _abiCache[first];
  }
  try {
    const code = await provider.getCode(addr);
    if(!code || code === '0x') { _abiCache[key] = false; return false; }

    // Check proxy implementation slots in parallel
    const slotReads = IMPL_SLOTS.map(s => provider.getStorage(addr, s).catch(() => null));
    const [directAbi, ...slotResults] = await Promise.all([sourcifyAbi(S.chainId, addr), ...slotReads]);

    // Find implementation address from first non-zero slot
    let implAddr = null;
    for(const raw of slotResults) {
      if(raw && raw !== '0x' + '0'.repeat(64)) {
        const a = '0x' + raw.slice(-40);
        if(a !== ethers.ZeroAddress) { implAddr = ethers.getAddress(a); break; }
      }
    }

    // If proxy detected, fetch implementation ABI
    if(implAddr) {
      const implAbi = await sourcifyAbi(S.chainId, implAddr);
      if(implAbi && implAbi.length) {
        const fns = extractWriteFns(implAbi);
        _abiCache[key] = fns;
        return fns;
      }
    }

    // Fall back to direct ABI
    if(directAbi && directAbi.length) {
      const fns = extractWriteFns(directAbi);
      _abiCache[key] = fns;
      return fns;
    }

    _abiCache[key] = [];
    return [];
  } catch(e) {
    console.error('Fetch ABI:', e);
    return []; // Network error — don't cache, allow retry
  }
}

function onCxTargetChange(val) {
  S.cxTarget = val;
  clearTimeout(_cxDebounce);
  updateCxTargetStatus(val);
  if(!val || !ethers.isAddress(val)) {
    if(S.cxAbi !== null || S.cxLoading) { S.cxAbi = null; S.cxFn = null; S.cxArgs = {}; S.cxAddr = ''; S.cxLoading = false; }
    return;
  }
  const addr = ethers.getAddress(val);
  if(addr === S.cxAddr) return;
  S.cxLoading = true; S.cxAbi = null; S.cxFn = null; S.cxArgs = {}; S.cxAddr = addr; render();
  _cxDebounce = setTimeout(async () => {
    const fns = await fetchContractAbi(addr);
    if(S.cxAddr !== addr) return;
    S.cxAbi = fns; S.cxLoading = false;
    render();
  }, 500);
}

function selectCxFn(idx) {
  S.cxFn = S.cxFn === idx ? null : idx;
  S.cxArgs = {};

function encodeCxCall() {
  if(!S.cxAbi || S.cxFn == null) return null;
  const fn = S.cxAbi[S.cxFn];
  if(!fn) return null;
  try {
    const iface = new ethers.Interface([fn]);
    const args = fn.inputs.map((inp, i) => parseCxArg(S.cxArgs[i] || '', inp.type));
    return iface.encodeFunctionData(fn.name, args);
  } catch(e) { return null; }
}

function parseCxArg(raw, type) {
  if(type.endsWith('[]')) {
    if(!raw) return [];
    try { return JSON.parse(raw); } catch(_) { return raw.split(',').map(s => s.trim()); }
  }
  if(type === 'tuple') { try { return JSON.parse(raw); } catch(_) { return raw; } }
  if(type === 'bool') return raw === 'true' || raw === '1';
  return raw;
}

function resetCxState() {
  S.cxTarget = '';

// Explorer link for a queue transaction, context-aware:
// prefers a real on-chain tx hash (execution → queue), and always falls
// back to the vault's address page so EVERY tx exposes an explorer jump —
// even pending off-chain proposals that have no tx hash of their own yet.
function txExplorerLink(tx, v) {
  if(S.demoMode) return '';
  const c = CHAINS[S.chainId];
  const base = c ? c.explorer : 'https://etherscan.io';
  const isHash = h => h && /^0x[0-9a-fA-F]{64}$/.test(h);
  let href, tip;
  if(isHash(tx.executionTx))      { href = `${base}/tx/${tx.executionTx}`; tip = 'View execution transaction'; }
  else if(isHash(tx.queueTx))     { href = `${base}/tx/${tx.queueTx}`;     tip = 'View queue transaction'; }
  else if(v && v.address && ethers.isAddress(v.address)) { href = `${base}/address/${v.address}`; tip = 'View vault on explorer'; }
  else return '';
  return `<a class="tx-explorer" href="${href}" target="_blank" rel="noopener" title="${tip}" onclick="event.stopPropagation()">↗ EXPLORER</a>`;
}

let _vw = window.innerWidth;

// A full innerHTML rebuild drops the focused field and its caret. When the
// focused element has a stable id (form inputs do), remember it so we can put
// focus, selection, and its own scroll back after the swap. Only id'd active
// elements are touched, so navigation renders are unaffected.
function captureFocus(root){
  const el = document.activeElement;
  if(!el || !el.id || !root.contains(el)) return null;
  const state = { id: el.id, scrollTop: el.scrollTop, scrollLeft: el.scrollLeft };
  if(typeof el.selectionStart === 'number'){ state.selStart = el.selectionStart; state.selEnd = el.selectionEnd; }
  return state;
}
function restoreFocus(state){
  if(!state) return;
  const el = document.getElementById(state.id);
  if(!el) return;
  el.focus({ preventScroll: true });
  if(state.selStart != null && typeof el.setSelectionRange === 'function'){
    try { el.setSelectionRange(state.selStart, state.selEnd); } catch(_){}
  }
  el.scrollTop = state.scrollTop;
  el.scrollLeft = state.scrollLeft;
}

// Coalesce render() calls: multiple state mutations in one tick (or several

  const _appEl = document.getElementById("app");

      </div>
      <div class="hdr-r">
        <button class="theme-btn" onclick="S.dark=!S.dark;localStorage.setItem('ms_light',S.dark?'':'1');render()">${S.dark?"\u2600":"\u25CF"}</button>
        <button class="wallet-btn" onclick="${walletOnclick}">${walletDot}${esc(walletLabel)}</button>
      </div>
    </div>
    <div class="nav">
      ${[{k:"DASH",l:"DASHBOARD",m:"DASH"},{k:"ADMIN",l:"ADMIN",m:"ADMIN"},{k:"CREATE",l:"CREATE",m:"CREATE"}].map(i=>`<button class="${S.view===i.k?"on":""}" onclick="S.view='${i.k}';S.showTx=false;render()">${mob?i.m:i.l}</button>`).join("")}
    </div>
    <div class="content">${S.view==="DASH"?renderDash(v,mob):S.view==="CREATE"?renderCreate(mob):renderAdmin(v,mob)}</div>

        <span style="color:var(--ln)">&middot;</span>

        ${S.demoMode?`<button class="reset-btn" onclick="S.demoMode=false;S.vaults=[];S.sel=0;S.view='DASH';S.showTx=false;S.batch=[{t:'',v:'',d:''},{t:'',v:'',d:''}];S.adminTab='POLICY';flash('DEMO CLEARED');render()">RESET</button>`:""}
        ${!S.demoMode&&S.vaults.length>0?`<button class="reset-btn" onclick="loadAllVaults()">RELOAD</button>`:""}

  updateTxReview();
  // Scroll a freshly deep-linked tx into view once, when it first appears.
  if(_focusScroll){
    const fel = document.querySelector(`[data-tx-nonce="${_focusNonce}"]`);
    if(fel){ _focusScroll = false; fel.scrollIntoView({behavior:'smooth',block:'center'}); fel.classList.remove('tx-linked'); void fel.offsetWidth; fel.classList.add('tx-linked'); }

function renderDeployOverlay(){
  const d = S.deploy, phase = d.phase;
  const glyph = { pending:'○', switching:'◐', mining:'◐', deploying:'◐', done:'●', skipped:'●', failed:'✕' };
  const col = { pending:'var(--d)', switching:'var(--y)', mining:'var(--y)', deploying:'var(--y)', done:'var(--g)', skipped:'var(--m)', failed:'var(--r)' };
  const lbl = { pending:'WAITING', switching:'SWITCH IN WALLET…', mining:'MINING ADDRESS…', deploying:'CONFIRM IN WALLET…', done:'DEPLOYED', skipped:'ALREADY DEPLOYED', failed:'FAILED' };
  const anyFail = d.steps.some(s=>s.status==='failed');
  const nch = d.steps.length, plural = nch>1?'S':'';
  const title = phase==='preflight' ? `CHECKING ${nch} CHAIN${plural}…`
    : phase==='review' ? `REVIEW · ${nch} CHAIN${plural}`
    : `${d.done?(anyFail?'DEPLOY · DONE (WITH ERRORS)':'DEPLOY · DONE'):'DEPLOYING'} · ${nch} CHAIN${plural}`;

  const rows = d.steps.map((s,k)=>{
    let g = glyph[s.status], gc = col[s.status], right;
    if(phase==='preflight'){ g='◐'; gc='var(--y)'; right=`<span style="font-size:9px;color:var(--d)">CHECKING…</span>`; }
    else if(phase==='review'){
      const bad = s.pf && (s.pf.gasOk===false || s.pf.executorOk===false || s.pf.factoryOk===false);
      const w=[];
      if(s.pf&&s.pf.factoryOk===false)w.push('NO FACTORY');
      if(s.pf&&s.pf.gasOk===false)w.push('NO GAS');
      if(s.pf&&s.pf.executorOk===false)w.push('NO EXECUTOR');
      g = bad?'✕':'●'; gc = bad?'var(--y)':'var(--g)';
      right = `<span style="font-size:9px;letter-spacing:1px;color:${bad?'var(--y)':'var(--g)'}">${w.length?w.join(' · '):'READY'}</span>`;
    } else {
      const canRetry = s.status==='failed' && d.done;
      right = `<span style="font-size:9px;letter-spacing:1px;color:${gc}">${s.status==='failed'&&s.err?esc(String(s.err).slice(0,30)):lbl[s.status]}</span>${canRetry?` <button class="reject-link" style="padding:2px 9px;margin-left:8px" onclick="retryChain(${k})">RETRY</button>`:''}`;
    }
    // Per-chain explorer link: each chain has its own explorer, so build the
    // base from the step's chain id (not the connected chain) — links stay
    // correct across a multichain deploy.
    let xlink = '';
    if((s.status==='done'||s.status==='skipped') && (s.txHash||s.address)){
      const eb = CHAINS[s.id] ? CHAINS[s.id].explorer : 'https://etherscan.io';
      const href = s.txHash ? `${eb}/tx/${s.txHash}` : `${eb}/address/${s.address}`;
      xlink = `<a class="tx-explorer" href="${href}" target="_blank" rel="noopener" title="${s.txHash?'View deploy transaction':'View vault on explorer'} · ${esc(s.name)}">↗</a>`;
    }
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)">
      <span style="color:${gc};font-size:12px;width:14px;text-align:center">${g}</span>
      ${chainIcon(s.id)}<span style="flex:1;font-size:12px;font-weight:700;letter-spacing:1px">${esc(s.name)}</span>${right}${xlink}</div>`;
  }).join('');

  let footer;
  if(phase==='review'){
    const noExec = d.ctx && d.ctx.wantForward && d.steps.some(s=>s.pf&&s.pf.executorOk===false);
    const noGas = d.steps.some(s=>s.pf&&s.pf.gasOk===false);
    const noFac = d.steps.some(s=>s.pf&&s.pf.factoryOk===false);
    const notOwner = d.ctx && d.ctx.deployerIsOwner === false;
    footer = `<div style="margin-top:14px;font-size:10px;color:var(--y);letter-spacing:1px;line-height:1.6">${noFac?'No factory on some chains — the vault cannot be deployed there. ':''}${noExec?'No TimelockExecutor on some chains — fast path can’t be enabled there. ':''}${noGas?'No gas in the connected wallet on some chains. ':''}${notOwner?'You are not one of the owners — the vault will deploy, but it will not appear in your history. ':''}Proceed anyway and those chains may fail.</div>
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-outline btn-w" onclick="closeDeploy()">CANCEL</button><button class="btn btn-fill btn-w" onclick="proceedDeploy()">PROCEED</button></div>`;
  } else if(d.done){
    const dbWarn = d.steps.some(s=>s.dbWarn);
    footer = `${dbWarn?`<div style="margin-top:14px;font-size:10px;color:var(--y);letter-spacing:1px;line-height:1.6">Deployed on-chain, but not recorded in history — the vault is live at the address above.</div>`:''}<button class="btn btn-fill btn-w" style="margin-top:20px" onclick="closeDeploy()">${anyFail?'CLOSE':'VIEW VAULT'}</button>`;
  } else if(phase==='deploying'){
    footer = `<div style="margin-top:16px;font-size:9px;color:var(--d);letter-spacing:1px;text-align:center">APPROVE EACH WALLET PROMPT TO CONTINUE</div>`;
  } else { footer = ''; }

  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="width:min(460px,94vw);max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--a);padding:24px">
      <div style="font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:6px">${title}</div>
      ${d.address?`<div style="font-size:11px;color:var(--m);letter-spacing:1px;margin-bottom:16px;word-break:break-all">${addrLink(d.address)}</div>`:`<div style="font-size:10px;color:var(--d);letter-spacing:1px;margin-bottom:16px">Same vault address on every chain</div>`}
      <div>${rows}</div>
      ${footer}
    </div>
  </div>`;
}

// ── DASHBOARD ─────────────────────────────────────────────────────
function renderDash(v,mob){
  if(!v)return`<div class="empty"><div class="empty-title">NO VAULTS</div><div class="empty-sub">${S.demoMode?"":"DEPLOY YOUR FIRST MULTISIG"}</div><button class="btn btn-outline" style="padding:0 32px;height:48px" onclick="S.view='CREATE';render()">CREATE VAULT</button>${!S.demoMode?`<div style="max-width:400px;margin:44px auto 0;padding-top:32px;border-top:1px solid var(--ln)"><div style="font-size:10px;font-weight:600;letter-spacing:2px;color:var(--m)">LOAD EXISTING VAULT</div><div style="margin-top:12px;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap"><input class="inp" id="load-addr" style="max-width:320px;min-width:0;flex:1;margin:0;font-size:16px" placeholder="0x... or name.eth / name.(g)wei" oninput="updateLoadStatus(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();loadVaultByAddress()}"><button class="btn btn-outline btn-sm" onclick="loadVaultByAddress()">LOAD</button></div><div id="load-status" style="font-size:9px;letter-spacing:1px;text-align:center;min-height:12px;margin-top:6px"></div><div style="margin-top:24px"><button class="btn btn-outline" style="font-size:9px;border-color:var(--ln);color:var(--d)" onclick="S.demoMode=true;S.vaults=seed();S.sel=0;flash('DEMO LOADED');render()">LOAD DEMO</button></div></div>`:""}</div>`;
  const you = getYou();
  const h0=v.holdings[0];

  // Single pass over every vault's queue: accumulate the global action counts
  // and, per vault, the flags the tabs below need — so txSt() is evaluated once
  // per tx instead of again for each tab dot.
  let needsSig=0,readyExec=0,pendingSubmit=0;
  const vaultFlags=S.vaults.map(vt=>{
    let rdy=false,needsYou=false;
    vt.queue.forEach(tx=>{
      const st=txSt(tx,vt);
      if(st.sign&&you&&!tx.approvals[you]){needsSig++;needsYou=true;}
      if(st.exec||st.instant){readyExec++;rdy=true;}
      else if(st.queue)pendingSubmit++;
    });
    return{rdy,needsYou};
  });
  const totalActions=needsSig+readyExec+pendingSubmit;
  const attnParts=[];
  if(needsSig)attnParts.push(`${needsSig} NEED${needsSig>1?"":"S"} YOUR SIG`);
  if(readyExec)attnParts.push(`${readyExec} READY TO EXECUTE`);
  if(pendingSubmit)attnParts.push(`${pendingSubmit} READY TO SUBMIT`);

  return`
  ${totalActions>0?`<div style="padding:${mob?"12px 6px":"14px 8px"};margin-bottom:4px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:${mob?8:12}px;flex-wrap:wrap;font-size:10px;letter-spacing:2px">
    <span style="color:var(--y);font-weight:700">${totalActions} ACTION${totalActions>1?"S":""}</span>
    <span style="color:var(--d)">${attnParts.join(" &middot; ")}</span>
  </div>`:""}
  <div class="vtabs"><div class="vtabs-inner">
    ${S.vaults.map((vt,i)=>{
      const on=i===S.sel;
      const {rdy,needsYou}=vaultFlags[i];
      const dot=rdy?'<span class="vtab-dot" style="background:var(--g)"></span>':needsYou?'<span class="vtab-dot" style="background:var(--y)"></span>':"";
      const pending=vt.queue.length>0?`${vt.queue.length} PENDING`:"";
      // The balance summary is a comparison aid for choosing between vaults; with a
      // single vault it only echoes the hero stat below, so drop it and keep pending.
      const bal=vt.holdings.length?tokIcon(vt.holdings[0].token,'sm')+" "+vt.holdings[0].balance+" "+vt.holdings[0].token+(vt.holdings.length>1?" +"+(vt.holdings.length-1)+" MORE":""):"EMPTY";
      const info=S.vaults.length===1?pending:bal+(pending?` &middot; ${pending}`:"");
      return`<button class="vtab${on?" on":""}" onclick="S.sel=${i};S.nt=S.vaults[${i}].threshold;setNd(S.vaults[${i}].delay);S.showTx=false;render()">
      <div class="vtab-name">${esc(vt.name)}${dot}</div>
      ${info?`<div class="vtab-info">${info}</div>`:""}
    </button>`}).join("")}
  </div></div>
  <div class="stats">
    ${h0?`<div class="privg" tabindex="0" title="Tap or hover to reveal" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${tokIcon(h0.token,'big')}
      <span class="stat-big priv">${h0.balance}</span>
      <span class="stat-token">${h0.token}</span>
      <span class="stat-usd priv">${h0.usd}</span>
    </div>
    ${v.holdings.length>1?`<div class="holdings privg" tabindex="0" title="Tap or hover to reveal">${v.holdings.slice(1).map(h=>`<span>${tokIcon(h.token,'sm')} <span class="priv">${h.balance}</span> <strong>${h.token}</strong><span class="usd priv">${h.usd}</span></span>`).join("")}</div>`:""}`
    :`<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <span class="stat-big" style="color:var(--d)">0</span>
      <span class="stat-token">ETH</span>
    </div>
    <div style="font-size:11px;color:var(--d);letter-spacing:2px;margin-top:8px">NO BALANCES</div>`}
    ${!S.demoMode&&v.address&&ethers.isAddress(v.address)?`<div style="margin-top:16px"><button class="btn btn-outline btn-sm" style="display:inline-flex;align-items:center;gap:6px" onclick="openTopUp()"><span style="font-size:13px;line-height:1">&#8595;</span> TOP UP</button></div>`:""}
    <div class="meta">
      <span>${v.threshold}/${v.ownerCount} SIG</span>
      ${v.delay>0
        ?`<span style="border-left:2px solid var(--a);padding-left:10px;margin-left:2px"><strong>${fmtD(v.delay)}</strong> TIMELOCK</span>`
        :`<span style="border-left:2px solid var(--y);padding-left:10px;margin-left:2px;color:var(--y)"><strong>UNLOCKED</strong></span>`}
      <span>${S.demoMode?v.chain:chainName()}</span>
      ${v.address&&ethers.isAddress(v.address)?`<span>${S.demoMode?addrLink(v.address,v.chain):addrLink(v.address)}${copyBtn(v.address)}</span>`:""}
      ${v.executor===ethers.ZeroAddress||v.executor==="0x0000...0000"?'<span style="color:var(--y)">NO EXECUTOR</span>':""}
      ${v.fastPath?'<span style="color:var(--g)" title="Unanimous owner signatures can bypass the timelock — instant execution via the executor">INSTANT &middot; ALL OWNERS</span>':""}
    </div>
  </div>
  ${renderSlowOutbound(v,mob)}
  <div class="sec"><span>QUEUE</span><span class="line"></span>
    ${S.showTx?"":`<button class="btn btn-outline btn-sm" onclick="openTxBuilder()">+ NEW</button>`}
  </div>
  ${S.showTx?renderTxBuilder(v,mob):""}
  ${v.queue.length===0&&!S.showTx?`<div style="padding:48px 0;text-align:center;font-size:13px;color:var(--d);letter-spacing:2px">NO PENDING TRANSACTIONS</div>`:v.queue.map((tx,i)=>{
    const s=txSt(tx,v),isCancel=isCancelTx(tx,v);
    const isQueued=tx.eta>0;
    const firstUnqueued=v.queue.findIndex(t=>t.eta===0&&!isCancelTx(t,v));
    const blocked=!isQueued&&!isCancel&&i!==firstUnqueued;
    const dv=tx.displayValue||tx.value,dt=tx.displayToken||tx.token;
    // What kind of proposal this is, and what executing it would actually do.
    const kind=isCancel&&tx.cancelTarget!=null
      ?{label:`CANCEL #${tx.cancelTarget}`,tone:'danger',note:`DROPS QUEUED PROPOSAL #${tx.cancelTarget} BEFORE ITS TIMELOCK ELAPSES, SO IT CAN NEVER EXECUTE.`}
      :txKind(tx,v);
    // With no value to lead on, the kind label IS the headline — one vocabulary
    // across the badge, the headline and the note, instead of two.
    const display=dv&&dv!=="0"?`${dv} ${dt}`:kind.label;
    const acCount=Object.values(tx.approvals).filter(Boolean).length;
    let progressLine="";
    if(!isCancel&&!isQueued&&!blocked){
      const pct=v.threshold?Math.min(1,acCount/v.threshold):0,done=acCount>=v.threshold;
      progressLine=`<div class="tx-progress"><span class="plabel">SIGNATURES</span><div class="pbar"><i style="width:${Math.round(pct*100)}%;background:${done?"var(--g)":"var(--y)"}"></i></div><span style="color:${done?"var(--g)":"var(--m)"}">${acCount}/${v.threshold}${done&&acCount>=v.ownerCount?" \u00B7 ALL":""}</span></div>`;
    }else if(isQueued&&v.delay>0&&fmtEta(tx.eta)!=="READY"){
      const queuedAt=tx.eta-v.delay,pct=Math.min(1,Math.max(0,(NOW()-queuedAt)/v.delay));
      progressLine=`<div class="tx-progress"><span class="plabel">TIMELOCK</span><div class="pbar"><i data-tl-eta="${tx.eta}" data-tl-delay="${v.delay}" style="width:${Math.round(pct*100)}%;background:var(--a)"></i></div></div>`;
    }
    const apHtml=v.owners.map(o=>`<span class="${tx.approvals[o.addr]?"ap-ok":"ap-no"}">${tx.approvals[o.addr]?"\u2713":"\u25CB"} ${esc(ownerIdent(o))}${o.you?"*":""}</span>`).join("");
    const etaHtml=tx.eta>0&&fmtEta(tx.eta)!=="READY"?`<span class="eta" data-eta="${tx.eta}">${new Date(tx.eta*1000).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>`:"";
    const signedByYou=you&&tx.approvals[you];
    let actionBtn="";
    if(s.sign&&!signedByYou){
      actionBtn=mob
        ?`<div style="display:flex;gap:8px;flex-direction:column">
            <button class="btn btn-fill btn-w" onclick="doSign(${S.sel},${tx.nonce})">SIGN <span style="opacity:.5;font-size:9px;margin-left:4px">OFF-CHAIN</span></button>
            <button class="btn btn-outline btn-w" onclick="doApprove(${S.sel},${tx.nonce})">APPROVE <span style="opacity:.5;font-size:9px;margin-left:4px">ON-CHAIN</span></button>
          </div>`
        :`<div style="display:flex;gap:8px">
            <button class="btn btn-fill" onclick="doSign(${S.sel},${tx.nonce})">SIGN</button>
            <button class="btn btn-outline" onclick="doApprove(${S.sel},${tx.nonce})">APPROVE</button>
          </div>`;
    }else if(s.sign&&signedByYou){
      actionBtn=`<button class="btn btn-outline" ${mob?"style='width:100%'":""} onclick="doUnsign(${S.sel},${tx.nonce})">UNSIGN</button>`;
    }else if(s.queue){
      const ac=Object.values(tx.approvals).filter(Boolean).length;
      const unanimous=ac===v.ownerCount;
      const unsignLink=signedByYou?`<button style="background:transparent;border:none;color:var(--r);font-size:9px;font-weight:700;letter-spacing:2px;opacity:.5;padding:6px 0;cursor:pointer;font-family:var(--f)" onclick="doUnsign(${S.sel},${tx.nonce})">UNSIGN</button>`:'';
      if(s.instant){

    return`<div class="tx privg${blocked?" blocked":""}${isFocus?" tx-focus":""}" data-tx-nonce="${tx.nonce}">

      <div class="tx-top">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span class="tx-nonce">#${tx.nonce}${isCancel?" VIA EXECUTOR":i===firstUnqueued&&!isQueued?" NEXT":""}${txLink?` <button class="x-btn" style="font-size:8px;opacity:.4;display:inline-flex;min-width:auto;min-height:auto;padding:2px 4px;vertical-align:middle" onclick="event.stopPropagation();navigator.clipboard.writeText('${txLink}');flash('CO-SIGN LINK COPIED')" title="Copy co-sign link">\u29C9</button>`:""}</span>
            ${kindTag}
          </div>
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px">

          </div>
          <div class="tx-to">&rarr; ${S.demoMode?addrLink(tx.target,v.chain):addrLink(tx.displayTo||tx.target)}${(()=>{const a=S.demoMode?tx.target:(tx.displayTo||tx.target);return ethers.isAddress(a)?copyBtn(a):'';})()}</div>
          ${kindNote}
        </div>
        ${!blocked?`<span class="tx-status" style="color:${s.c}"${tx.eta>0&&!s.exec?` data-eta-status="${tx.eta}"`:``}>&bull; ${s.l}</span>`:""}
        ${blocked?'<span style="font-size:10px;color:var(--d);letter-spacing:2px">BLOCKED</span>':""}
      </div>
      ${blocked?"":progressLine}
      <div class="approvals">${apHtml}${etaHtml}${(()=>{const xl=txExplorerLink(tx,v);return xl?`<span class="eta" style="margin-left:${etaHtml?'12px':'auto'}">${xl}</span>`:'';})()}</div>
      ${blocked?'':(()=>{
        // Any live proposal can be dry-run — knowing it reverts is just as
        // useful while it sits in the timelock as it is before signing.
        const canReject = i===firstUnqueued && !isQueued && !isCancel;
        const rsc = tx.rejectSigners ? tx.rejectSigners.size : 0;
        const armed = _rejectArmed === tx.nonce;
        const rlabel = armed ? 'CONFIRM &middot; SKIP NONCE?' : `REJECT &middot; SKIP NONCE${rsc?` (${rsc}/${v.threshold})`:''}`;
        return `<div class="tx-foot">
          <div class="tx-foot-diag">
            <button class="sim-btn" onclick="simulateProposal(${S.sel},${tx.nonce})" title="Dry-run this proposal against current chain state (from = the vault)">${tx._sim&&!tx._sim.loading?'RE-SIMULATE':'SIMULATE'}</button>
            ${canReject?`<button class="reject-link${armed?' armed':''}" onclick="armReject(${S.sel},${tx.nonce})" title="Sign a no-op to consume this nonce so later transactions can proceed">${rlabel}</button>`:''}
          </div>
          ${actionBtn?`<div class="tx-foot-act">${actionBtn}</div>`:''}
        </div>`;
      })()}
      ${tx._sim?renderSim(tx._sim,{ rerun:`simulateProposal(${S.sel},${tx.nonce})`, dismiss:`dismissProposalSim(${S.sel},${tx.nonce})` }):''}
    </div>`}).join("")}
  <div class="sec"><span>SIGNERS</span><span class="line"></span></div>
  ${v.owners.map(o=>`<div class="row">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0">
      <span class="signer-addr">${S.demoMode?addrLink(o.addr,v.chain):addrLink(o.addr)}</span>${ethers.isAddress(o.addr)?copyBtn(o.addr):""}${o.name?`<span class="signer-name">${esc(o.name)}</span>`:""}${o.label&&o.label.trim().toUpperCase()!=='YOU'?`<span class="signer-label">${esc(o.label)}</span>`:""}
    </div>
    ${o.you?'<span class="signer-you">YOU</span>':""}
  </div>`).join("")}`;
}

// ── TX BUILDER ────────────────────────────────────────────────────
// DOM-only field feedback — updates the status nodes and the review card
// without a full re-render, so the input keeps focus and caret while typing.
function onTxAmount(val, dec, avail, unit){
  S.txAmount = val;
  const u = document.getElementById('tx-units');
  if(u) u.textContent = val ? toUnits(val, dec) + ' ' + unit : '';
  const n = parseFloat(stripCommas(String(val))) || 0;
  const w = document.getElementById('tx-amount-warn');
  if(w) w.textContent = (avail > 0 && n > avail) ? 'EXCEEDS AVAILABLE BALANCE' : '';
  const usd = document.getElementById('tx-amount-usd');
  if(usd){ const r = Number(usd.dataset.rate) || 0; usd.textContent = (r > 0 && n > 0) ? fmtUsd(n * r) : ''; }
  updateTxReview();
}
function onTxRecipient(val){
  S.txTo = val;
  updateTxToStatus();
  updateTxReview();
}
function updateTxToStatus(){
  const s = document.getElementById('tx-to-status');
  if(!s) return;
  const val = S.txTo || '';
  if(_nameHint(s, val, updateTxToStatus)) return;
  const st = _addrState(val);
  s.textContent = st.txt;
  s.style.color = st.color || '';
}
// Open/close the builder from a clean slate — a stale amount or recipient
// carried into the next proposal is the one mistake this form must not make.
function openTxBuilder(){
  S.showTx = true;
  S.txMode = 'TRANSFER';
  S.txToken = 'ETH';
  S.txSlow = false;
  resetTxFields();
  render();
}
function closeTxBuilder(){
  S.showTx = false;
  resetTxFields();
  render();
}
function resetTxFields(){
  S.txAmount = '';
  S.txTo = '';
  S.stakeAmount = '';
  _builderSim = null;
}
// Token switch keeps the typed amount but drops the stale unit/USD echo and
// any simulation, which was run against the previous asset.
function selectTxToken(sym){
  S.txToken = sym;
  S.showCustomTok = false;
  _builderSim = null;
  render();
}
function fillTxPct(frac, amountStr, dec, avail, unit){
  const el = document.getElementById('tx-amount');
  if(!el) return;
  let out;
  if(frac >= 1) out = amountStr;                       // MAX sends the exact raw balance, no rounding
  else {
    const n = Number(amountStr) * frac;
    out = n > 0 ? n.toFixed(Math.min(dec, 8)).replace(/\.?0+$/, '') : '0';
  }
  el.value = out;
  onTxAmount(out, dec, avail, unit);
}
function onStakeAmount(val, avail){
  S.stakeAmount = val;
  const n = parseFloat(stripCommas(String(val))) || 0;
  const u = document.getElementById('stake-units');
  if(u) u.textContent = val ? toUnits(val, 18) + ' WEI' : '';
  const w = document.getElementById('stake-amount-warn');
  if(w) w.textContent = (avail > 0 && n > avail) ? 'EXCEEDS VAULT ETH BALANCE' : '';
  const usd = document.getElementById('stake-amount-usd');
  if(usd){ const r = Number(usd.dataset.rate) || 0; usd.textContent = (r > 0 && n > 0) ? fmtUsd(n * r) : ''; }
  updateTxReview();
}
function fillStakePct(frac, amountStr, avail){
  const el = document.getElementById('stake-amount');
  if(!el) return;
  let out;
  if(frac >= 1) out = amountStr;
  else { const n = Number(amountStr) * frac; out = n > 0 ? n.toFixed(8).replace(/\.?0+$/, '') : '0'; }
  el.value = out;
  onStakeAmount(out, avail);
}
// USD rate for a holding, derived from the balance/usd pair the treasury
// loader already priced (0 when the asset has no feed).
function tokRate(hold){
  if(!hold || !hold.usd) return 0;
  const u = parseFloat(String(hold.usd).replace(/[^0-9.]/g, ''));
  const b = parseFloat(stripCommas(String(hold.balance)));
  return (u > 0 && b > 0) ? u / b : 0;
}
function fmtUsd(n){
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Thousands-separate the integer part of a decimal string, leaving the
// fraction exact — token amounts must stay digit-for-digit truthful.
function groupInt(s){
  const [w, f] = String(s).split('.');
  return w.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
}
// What the builder is still missing before it can be signed.
function txMissing(){
  const miss = [];
  if(S.txMode === 'STAKE'){
    if(!(parseFloat(stripCommas(S.stakeAmount || '')) > 0)) miss.push('AN AMOUNT TO STAKE');
    return miss;
  }
  if(!(parseFloat(stripCommas(S.txAmount || '')) > 0)) miss.push('AMOUNT');
  const t = (S.txTo || '').trim();
  if(!t || !(ethers.isAddress(t) || NAME_RE.test(t))) miss.push('RECIPIENT');
  return miss;
}
// Live summary for the STAKE tab. The wstETH figure is an estimate by
// construction: the rate that settles is the one at execution, which for a
// vault with a timelock is hours or days after this is signed.
function stakeReviewBody(v){
  const amtStr = stripCommas(S.stakeAmount || '').trim();
  const amtNum = parseFloat(amtStr) || 0;
  const hold = (v.holdings || []).find(h => h.token === 'ETH');
  const rate = tokRate(hold);
  const availNum = hold ? Number(hold.raw != null ? ethers.formatUnits(hold.raw, hold.decimals || 18) : stripCommas(hold.balance)) : 0;
  const out = wstethOut(amtStr);

  const amtHtml = amtNum > 0
    ? `<div class="privg" tabindex="0" title="Tap or hover to reveal">
         <div class="review-amt">${tokIcon('ETH')}<span class="priv">${esc(groupInt(amtStr))}</span><span style="font-size:13px;color:var(--m)">ETH</span></div>
         ${rate > 0 ? `<div class="review-usd priv">${esc(fmtUsd(amtNum * rate))}</div>` : ''}
       </div>`
    : `<div class="review-amt ph">${tokIcon('ETH')}<span>0.0</span><span style="font-size:13px">ETH</span></div>`;
  const outHtml = out
    ? `<div class="review-to" style="display:flex;align-items:center;gap:8px">${tokIcon('wstETH')}<span>&asymp; ${esc(groupInt(Number(ethers.formatUnits(out, 18)).toFixed(6).replace(/\.?0+$/, '')))} wstETH</span></div>`
    : `<div class="review-to ph">${amtNum > 0 ? 'RATE UNAVAILABLE' : 'NOTHING TO STAKE YET'}</div>`;

  const rows = [
    ['PROTOCOL', '<b>LIDO &middot; wstETH</b>'],
    ['CONTRACT', `<b>${esc(shortAddr(WSTETH_ADDRESS))}</b>`],
    _stEthPerToken ? ['RATE', `<b>1 wstETH = ${esc(Number(ethers.formatUnits(_stEthPerToken, 18)).toFixed(5))} stETH</b>`] : null,
    ['SIGNATURES', `<b>${v.threshold} OF ${v.ownerCount}</b>`],
    ['TIMELOCK', v.delay > 0
      ? `<b>${esc(fmtD(v.delay))}${v.fastPath ? ' &middot; SKIPPABLE' : ''}</b>`
      : '<b>NONE &middot; EXECUTES AT QUORUM</b>'],
    ['CALL', '<b>NATIVE SEND &rarr; wstETH</b>'],
  ].filter(Boolean).map(([k, val]) => `<div class="rrow"><span>${k}</span>${val}</div>`).join('');

  const warns = [];
  if(availNum > 0 && amtNum > availNum) warns.push('AMOUNT EXCEEDS THE VAULT ETH BALANCE — THIS WILL REVERT ON EXECUTION.');
  else if(!hold && amtNum > 0) warns.push('THE VAULT HOLDS NO ETH — THIS WILL REVERT ON EXECUTION.');
  if(amtNum > 0) warns.push('THE wstETH FIGURE IS AN ESTIMATE. THE RATE THAT SETTLES IS THE ONE AT EXECUTION, NOT NOW.');

  return `${amtHtml}
    <div class="review-arrow">&darr; VAULT RECEIVES</div>
    ${outHtml}
    <div class="review-rows">${rows}</div>
    ${warns.map(w => `<div class="review-warn">${w}</div>`).join('')}`;
}
// The live proposal summary: exactly what SIGN + SUBMIT will construct,
// down to the call it encodes and the nonce it will occupy.
function txReviewBody(v){
  const ct = curTok(v);
  const amtStr = stripCommas(S.txAmount || '').trim();
  const amtNum = parseFloat(amtStr) || 0;
  const to = (S.txTo || '').trim();
  const hold = (v.holdings || []).find(h => h.token === S.txToken);
  const rate = tokRate(hold);
  const slowOn = slowAvailable() && S.txSlow;
  const isAddr = ethers.isAddress(to);
  const isName = NAME_RE.test(to);
  const availNum = hold ? Number(hold.raw != null ? ethers.formatUnits(hold.raw, hold.decimals || ct.decimals) : stripCommas(hold.balance)) : 0;

  const amtHtml = amtNum > 0
    ? `<div class="privg" tabindex="0" title="Tap or hover to reveal">
         <div class="review-amt">${tokIcon(S.txToken)}<span class="priv">${esc(groupInt(amtStr))}</span><span style="font-size:13px;color:var(--m)">${esc(S.txToken)}</span></div>
         ${rate > 0 ? `<div class="review-usd priv">${esc(fmtUsd(amtNum * rate))}</div>` : ''}
       </div>`
    : `<div class="review-amt ph">${tokIcon(S.txToken)}<span>0.0</span><span style="font-size:13px">${esc(S.txToken)}</span></div>`;
  // A name shows the address it resolves to, right here, because that address
  // is what the proposal will carry and what every co-signer will vote on.
  const pv = isName ? previewName(to, S.chainId, () => { if(S.showTx) updateTxReview(); }) : null;
  const toHtml = isAddr
    ? `<div class="review-to">${esc(shortAddr(to))}</div>`
    : isName
      ? `<div class="review-to">${esc(to)}</div>` + (
          !pv ? ''
          : pv.state === 'resolving' ? `<div class="review-to-sub">RESOLVING&hellip;</div>`
          : pv.state === 'err' ? `<div class="review-to-sub bad">${esc(pv.err)}</div>`
          : `<div class="review-to-sub">&rarr; ${esc(pv.addr)}</div>`)
      : `<div class="review-to ph">NO RECIPIENT YET</div>`;

  // The on-chain shape of the proposal, named the way the queue will label it.
  const call = slowOn ? 'SLOW.depositTo()'
    : (S.txToken === 'ETH' ? 'NATIVE SEND' : `${esc(S.txToken)}.transfer()`);

  const rows = [
    ['ROUTE', slowOn ? `<b class="hi">SLOW &middot; ${esc(fmtDelay(S.txSlowDelaySec))}</b>` : '<b>DIRECT</b>'],
    slowOn ? ['CLAIMABLE', `<b>${esc(fmtDelay(S.txSlowDelaySec))} AFTER EXECUTION</b>`] : null,
    ['SIGNATURES', `<b>${v.threshold} OF ${v.ownerCount}</b>`],
    ['TIMELOCK', v.delay > 0
      ? `<b>${esc(fmtD(v.delay))}${v.fastPath ? ' &middot; SKIPPABLE' : ''}</b>`
      : '<b>NONE &middot; EXECUTES AT QUORUM</b>'],
    ['CALL', `<b>${call}</b>`],
    // The approve is only batched in when the vault's standing allowance to
    // SLOW falls short, so state it as conditional rather than promise a batch.
    (slowOn && S.txToken !== 'ETH') ? ['ALLOWANCE', '<b>APPROVE BATCHED IF SHORT</b>'] : null,
  ].filter(Boolean).map(([k, val]) => `<div class="rrow"><span>${k}</span>${val}</div>`).join('');

  const warns = [];
  if(availNum > 0 && amtNum > availNum) warns.push('AMOUNT EXCEEDS THE VAULT BALANCE — THIS WILL REVERT ON EXECUTION.');
  else if(!hold && amtNum > 0 && !S.demoMode) warns.push(`THE VAULT HOLDS NO ${esc(S.txToken)} — THIS WILL REVERT ON EXECUTION.`);
  if(slowOn && v.delay > 0 && !v.fastPath && v.delay >= Number(S.txSlowDelaySec))
    warns.push('THE VAULT TIMELOCK IS AS LONG AS THE SLOW DELAY — A REVERSE MAY NOT CLEAR IN TIME.');
  if(pv && pv.state === 'err') warns.push(`${esc(pv.err)} — THE PROPOSAL CANNOT BE BUILT UNTIL IT DOES.`);
  else if(pv && pv.alt) warns.push(`${esc(to.toUpperCase())} PUBLISHES A DIFFERENT ADDRESS FOR ${esc((CHAINS[S.chainId] || {}).name || 'THIS CHAIN').toUpperCase()} (${esc(shortAddr(pv.alt))}). THIS SENDS TO THE ADDRESS ABOVE — CONFIRM WHICH ONE YOU WANT.`);

  return `${amtHtml}
    <div class="review-arrow">&darr; TO</div>
    ${toHtml}
    <div class="review-rows">${rows}</div>
    ${warns.map(w => `<div class="review-warn">${w}</div>`).join('')}`;
}
// Repaint the review card + submit affordance in place (no re-render, so the
// amount/recipient fields keep focus while the summary tracks each keystroke).
function updateTxReview(){
  const host = document.getElementById('tx-review');
  if(!host) return;
  const v = S.vaults[S.sel];
  if(!v) return;
  if(S.txMode === 'STAKE'){
    host.innerHTML = stakeReviewBody(v);
    const sHold = (v.holdings || []).find(h => h.token === 'ETH');
    const sAvail = sHold ? Number(sHold.raw != null ? ethers.formatUnits(sHold.raw, sHold.decimals || 18) : stripCommas(sHold.balance)) : 0;
    const sN = parseFloat(stripCommas(S.stakeAmount || '')) || 0;
    const sU = document.getElementById('stake-units');
    if(sU) sU.textContent = S.stakeAmount ? toUnits(S.stakeAmount, 18) + ' WEI' : '';
    const sW = document.getElementById('stake-amount-warn');
    if(sW) sW.textContent = (sAvail > 0 && sN > sAvail) ? 'EXCEEDS VAULT ETH BALANCE' : '';
    const sUsd = document.getElementById('stake-amount-usd');
    if(sUsd){ const r = Number(sUsd.dataset.rate) || 0; sUsd.textContent = (r > 0 && sN > 0) ? fmtUsd(sN * r) : ''; }
    const sMiss = txMissing();
    const sBtn = document.getElementById('tx-submit');
    if(sBtn) sBtn.classList.toggle('btn-pending', sMiss.length > 0);
    const sNote = document.getElementById('tx-ready-note');
    if(sNote) sNote.textContent = sMiss.length ? 'ENTER ' + sMiss.join(' + ') : '';
    return;
  }
  host.innerHTML = txReviewBody(v);

  // Re-derive the field echoes too — they are wiped by each rebuild, but the
  // values behind them live in S and must survive it.
  const ct = curTok(v);
  const hold = (v.holdings || []).find(h => h.token === S.txToken);
  const availNum = hold ? Number(hold.raw != null ? ethers.formatUnits(hold.raw, hold.decimals || ct.decimals) : stripCommas(hold.balance)) : 0;
  const n = parseFloat(stripCommas(S.txAmount || '')) || 0;
  const u = document.getElementById('tx-units');
  if(u) u.textContent = S.txAmount ? toUnits(S.txAmount, ct.decimals) + ' ' + (S.txToken === 'ETH' ? 'WEI' : 'UNITS (' + ct.decimals + ' DECIMALS)') : '';
  const w = document.getElementById('tx-amount-warn');
  if(w) w.textContent = (availNum > 0 && n > availNum) ? 'EXCEEDS AVAILABLE BALANCE' : '';
  const usd = document.getElementById('tx-amount-usd');
  if(usd){ const r = Number(usd.dataset.rate) || 0; usd.textContent = (r > 0 && n > 0) ? fmtUsd(n * r) : ''; }
  const st = document.getElementById('tx-to-status');
  if(st){ const s = _addrState(S.txTo); st.textContent = s.txt; st.style.color = s.color || ''; }

  const miss = txMissing();
  const btn = document.getElementById('tx-submit');
  if(btn) btn.classList.toggle('btn-pending', miss.length > 0);
  const note = document.getElementById('tx-ready-note');
  if(note) note.textContent = miss.length ? 'ENTER ' + miss.join(' + ') : '';
}
// Shared address/name field feedback (returns state; writes to a status node).
function _addrState(t){
  t = (t || '').trim();
  if(!t) return { txt:'', color:'' };
  if(ethers.isAddress(t)) return { txt:'VALID ADDRESS', color:'var(--g)' };
  // Every namespace is rooted on mainnet, so this holds whichever chain the app
  // is pointed at. Timing is deliberately not promised here: the send flow now
  // resolves in the review, before anything is signed.
  if(NAME_RE.test(t)) return { txt:'NAME · RESOLVED ON MAINNET', color:'var(--a)' };
  // Right shape, wrong case: a mistyped or truncated paste, not a bad format.
  // Naming it precisely is the difference between a 2-second fix and a re-copy.
  if(/^0x[0-9a-fA-F]{40}$/.test(t)) return { txt:'BAD CHECKSUM — RE-COPY THE ADDRESS', color:'var(--r)' };
  if(/^0x[0-9a-fA-F]*$/.test(t)) return { txt:`${t.length-2}/40 HEX CHARS`, color:'var(--d)' };
  return { txt:'NOT A VALID ADDRESS OR NAME', color:'var(--r)' };
}
function _hexState(d){
  d = (d || '').trim();
  if(!d || d === '0x') return { txt:'', color:'' };
  if(!/^0x[0-9a-fA-F]*$/.test(d)) return { txt:'NOT HEX', color:'var(--r)' };
  if(d.length % 2 !== 0) return { txt:'ODD LENGTH', color:'var(--r)' };
  return { txt:'OK', color:'var(--g)' };
}
// CUSTOM target — mirrors onCxTargetChange's ABI fetch with an inline hint for
// the name / invalid cases the ABI status doesn't cover.
// A call target is signed just like a recipient is, so it gets the same
// treatment: show the address the name resolves to rather than promising to
// resolve it later, out of sight.
function _nameHint(el, raw, repaint){
  const t = (raw || '').trim();
  const pv = previewName(t, S.chainId, repaint);
  if(!pv) return false;
  if(pv.state === 'resolving'){ el.textContent = 'RESOLVING…'; el.style.color = 'var(--a)'; }
  else if(pv.state === 'err'){ el.textContent = pv.err; el.style.color = 'var(--r)'; }
  else { el.textContent = '→ ' + shortAddr(pv.addr) + (pv.alt ? ' · PUBLISHES A DIFFERENT ADDRESS FOR THIS CHAIN' : ''); el.style.color = pv.alt ? 'var(--y)' : 'var(--g)'; }
  return true;
}
function updateCxTargetStatus(val){
  const el = document.getElementById('cx-target-status');
  if(!el) return;
  const t = (val || '').trim();
  if(!t || ethers.isAddress(t)){ el.textContent = ''; return; }
  if(_nameHint(el, t, () => updateCxTargetStatus(S.cxTarget))) return;
  const s = _addrState(t);
  el.textContent = s.txt; el.style.color = s.color;
}
function onBatchTarget(i, val){
  S.batch[i].t = val;
  updateBatchTargetStatus(i);
}
function updateBatchTargetStatus(i){
  const el = document.getElementById('batch-t-' + i);
  if(!el) return;
  const val = S.batch[i] ? S.batch[i].t : '';
  const t = (val || '').trim();
  if(ethers.isAddress(t)){ el.textContent = '✓'; el.style.color = 'var(--g)'; return; }
  if(_nameHint(el, t, () => updateBatchTargetStatus(i))) return;
  const s = _addrState(t);
  el.textContent = s.txt || ''; el.style.color = s.color;
}
function onBatchData(i, val){
  S.batch[i].d = val;
  const el = document.getElementById('batch-d-' + i);

// Add a custom ERC-20 by address: fetch symbol()/decimals(), persist it for the
// vault, select it for the transfer, and refresh holdings so it's tracked.
async function addCustomTokenFlow(){
  const v = S.vaults[S.sel]; if(!v) return;
  const parsed = parseTokenAddr(document.getElementById('custom-tok-addr')?.value);
  if(parsed.err){ flash(parsed.err); return; }
  const addr = parsed.addr;
  const existing = vaultTokens(v).find(t => t.address && t.address.toLowerCase() === addr.toLowerCase());
  if(existing){ S.txToken = existing.symbol; S.showCustomTok = false; render(); return; }
  flash('FETCHING TOKEN…');
  try {
    const meta = await fetchTokenMeta(addr);
    if(vaultTokens(v).some(t => t.symbol === meta.symbol)){ flash(`SYMBOL "${meta.symbol}" ALREADY LISTED`); return; }
    const saved = saveCustomToken(S.chainId, v.address, meta);
    S.txToken = meta.symbol; S.showCustomTok = false;
    flash(saved ? `ADDED ${meta.symbol} · ${meta.decimals} DEC · SAVED` : `ADDED ${meta.symbol} · COULD NOT SAVE LOCALLY`);
    render();
    reloadHoldings(S.sel);
  } catch(e){
    flash(e.shortMessage || e.message || 'COULD NOT LOAD TOKEN');
  }
}
async function reloadHoldings(vi){
  const v = S.vaults[vi]; if(!v || S.demoMode || !v.address) return;
  try { v.holdings = await loadTokenBalances(v.address, null); render(); } catch(_){}
}
function removeCustomTokenFlow(tokenAddr){
  const v = S.vaults[S.sel]; if(!v) return;
  const tok = customTokensFor(S.chainId, v.address).find(t => t.address.toLowerCase() === tokenAddr.toLowerCase());
  removeCustomToken(S.chainId, v.address, tokenAddr);
  // Both pickers read the same list, so either can be left pointing at a token
  // that no longer exists.
  if(tok && S.txToken === tok.symbol) S.txToken = 'ETH';
  if(tok && S.topup && S.topup.sym === tok.symbol) S.topup.sym = 'ETH';
  flash(tok ? `REMOVED ${tok.symbol}` : 'REMOVED');
  render();
  reloadHoldings(S.sel);
}

// ── TOP UP (deposit into the multisig from the connected wallet) ───
// Sends ETH or an ERC-20 straight from the connected EOA to the vault address
// on the vault's own chain. Decimals are handled per-token via parseUnits.

function _amtTrim(s){ s=String(s||''); if(!s) return '0'; if(s.indexOf('.')<0) return s; s=s.replace(/0+$/,'').replace(/\.$/,''); return s||'0'; }
function _amtDisp(s){ s=_amtTrim(s); const i=s.indexOf('.'); return i<0?s:s.slice(0,i+7).replace(/\.$/,''); }

// Read the connected wallet's balance for each listed token (+ ETH) on the
// current chain. Returns a symbol -> {raw, decimals} map; never throws.
async function fetchTopUpBalances(walletAddr, toks){
  const out = {};
  const erc = toks.filter(t => t.address && t.address !== ethers.ZeroAddress);
  try {
    const mc = getMC3();
    const calls = erc.map(t => ({ target:t.address, allowFailure:true, callData: erc20Iface.encodeFunctionData('balanceOf',[walletAddr]) }));
    const res = await mc.aggregate3(calls);
    res.forEach((r,i)=>{ if(r.success){ try { const b=erc20Iface.decodeFunctionResult('balanceOf', r.returnData)[0]; out[erc[i].symbol]={ raw:b.toString(), decimals:erc[i].decimals }; } catch(_){} } });
  } catch(_){
    await Promise.all(erc.map(async t => {
      try { const c=new ethers.Contract(t.address, ERC20_ABI, provider); const b=await c.balanceOf(walletAddr); out[t.symbol]={ raw:b.toString(), decimals:t.decimals }; } catch(_){}
    }));
  }
  try { const e = await provider.getBalance(walletAddr); out['ETH']={ raw:e.toString(), decimals:18 }; } catch(_){}
  return out;
}

async function submitTopUp(){
  const v = S.vaults[S.sel]; if(!v) return;
  const t = S.topup; if(!t || t.sending) return;
  const w = requireSigner(); if(!w) return;
  const { signer } = w;
  const sel = vaultTokens(v).find(x => x.symbol === t.sym) || vaultTokens(v)[0];
  const amtStr = (document.getElementById('topup-amount')?.value || '').trim();
  if(!amtStr){ flash('ENTER AN AMOUNT'); return; }
  let amount;
  try { amount = ethers.parseUnits(stripCommas(amtStr), sel.decimals); }
  catch(_){ flash('INVALID AMOUNT'); return; }
  if(amount <= 0n){ flash('ENTER AN AMOUNT'); return; }

  t.sending = true; t.err = null; render();
  // Make sure the wallet is on the vault's chain before sending — otherwise the
  // funds would land at the same address on the wrong chain.
  if(window._connectedWalletProvider){
    let wc = null;
    try { wc = parseInt(await window._connectedWalletProvider.request({method:'eth_chainId'}), 16); } catch(_){}
    if(wc !== S.chainId){
      try { await walletSwitchChain({ chainId:S.chainId, chainHex:CHAINS[S.chainId].hex, rpc:CHAINS[S.chainId].rpcs[0], addChainParams:ADD_CHAIN_PARAMS[S.chainId]||null }); } catch(_){}
      if(!(await waitForWalletChain(S.chainId))){ t.sending=false; t.err = 'SWITCH WALLET TO ' + (CHAINS[S.chainId]?.name||'CHAIN').toUpperCase(); render(); return; }
    }
  }
  try {
    let tx;
    if(sel.symbol === 'ETH' || sel.address === ethers.ZeroAddress){
      tx = await signer.sendTransaction({ to: v.address, value: amount });
    } else {
      const erc = new ethers.Contract(sel.address, ERC20_ABI, signer);
      tx = await erc.transfer(v.address, amount);
    }
    if(S.topup){ S.topup.txHash = tx.hash; render(); }
    await tx.wait();
    flash(`TOPPED UP ${_amtDisp(amtStr)} ${sel.symbol}`);
    S.topup = null; render();
    reloadHoldings(S.sel);
  } catch(e){
    console.error('Top up:', e);
    if(S.topup){ S.topup.sending = false; S.topup.err = e.shortMessage || e.message || 'FAILED'; render(); }
  }
}

// ── CREATE ────────────────────────────────────────────────────────
// Synchronous create-form validation. Classifies each owner (address / name /
// invalid / duplicate) and reports whether the form is ready to deploy.
// Names (.eth/.wei/.gwei) are accepted here and resolved at deploy time.
function validateCreate(c, demo){
  const seen = new Map();
  const owners = c.owners.map(o => {
    const raw = (o.addr || '').trim();
    if(!raw) return { state: 'empty' };
    let state, key;
    // init() walks a linked list headed by address(1) and requires each owner
    // to be strictly greater than the one before, so 0x0 and 0x1 are not owners
    // the contract can hold — reject them here, not with a reverted deploy.
    if(ethers.isAddress(raw) && BigInt(raw) <= 1n) { state = 'invalid'; key = null; }
    else if(ethers.isAddress(raw)) { state = 'address'; key = 'a:' + raw.toLowerCase(); }
    else if(NAME_RE.test(raw)) { state = 'name'; key = 'n:' + raw.toLowerCase(); }
    else if(demo) { state = 'address'; key = 'x:' + raw.toLowerCase(); }
    else { state = 'invalid'; key = null; }
    if(key) { if(seen.has(key)) state = 'dup'; else seen.set(key, true); }
    return { state };
  });
  const filled = owners.filter(o => o.state !== 'empty').length;
  const t = parseInt(c.threshold) || 0;
  const delayOk = !c.delayVal || (/^\d*\.?\d*$/.test(String(c.delayVal)) && parseFloat(c.delayVal) >= 0);
  let ready = true, reason = '';
  if(filled < 1) { ready = false; reason = 'ADD AT LEAST ONE OWNER'; }
  else if(!demo && owners.some(o => o.state === 'invalid')) { ready = false; reason = 'ONE OR MORE OWNER ADDRESSES ARE INVALID'; }
  else if(owners.some(o => o.state === 'dup')) { ready = false; reason = 'DUPLICATE OWNER ADDRESSES'; }
  else if(t < 1 || t > filled) { ready = false; reason = 'THRESHOLD MUST BE 1..' + filled; }
  else if(!delayOk) { ready = false; reason = 'DELAY MUST BE A POSITIVE NUMBER'; }
  return { owners, filled, ready, reason };
}

    ${(()=>{const pc=pendingPolicyChanges(v);return pc.length?`<div class="policy-warn">${pc.length} OWNER/THRESHOLD CHANGE${pc.length>1?"S":""} PENDING (#${pc.map(p=>p.nonce).join(", #")}) &middot; changes execute in order, so a new one here may need re-creating if the owner set shifts first</div>`:''})()}
    ${v.owners.map((o,oi)=>{const isYouLbl=o.label&&o.label.trim().toUpperCase()==='YOU';return`<div class="row" style="${mob?"flex-direction:column;align-items:stretch;gap:10px":""}">

// ── DEMO TX ACTIONS ───────────────────────────────────────────────

function addTxDemo(tx) {
  const v = S.vaults[S.sel];
  const n = v.nonce;
  const you = getYou();
  const ap = {};
  v.owners.forEach(o => ap[o.addr] = (o.you || o.addr === you));
  v.queue.push({ nonce: n, ...tx, eta: 0, approvals: ap });
  v.nonce++;
  S.showTx = false;
  resetTxFields();
  flash(`TX #${n} CREATED`);
  render();
}

function setTxSlow(on){ S.txSlow = !!on; _builderSim = null; render(); }
function setSlowDelay(sec){ S.txSlowDelaySec = sec; render(); }
function onSlowCustom(){
  const n = parseFloat(stripCommas(document.getElementById('slow-custom-n')?.value || ''));
  const u = document.getElementById('slow-custom-u')?.value || 'd';
  S.txSlowUnit = u;
  if(!(n > 0)) { render(); return; }
  S.txSlowDelaySec = Math.max(1, Math.round(n * (u === 'h' ? 3600 : 86400)));
  render();
}

function submitTransfer() {
  if (S.demoMode) {
    const amt = document.getElementById("tx-amount")?.value || "0";
    const to = document.getElementById("tx-to")?.value || "";
    const dec = DECIMALS[S.txToken] || 18;
    addTxDemo({
      value: amt, token: S.txToken, target: to, raw: toUnits(amt, dec),
      dataLabel: S.txToken === "ETH" ? "TRANSFER" : "ERC20 TRANSFER",
    });
  } else {
    guardSubmit(prodSubmitTransfer)();
  }
}

// STAKE is mainnet-only and has no demo path — the tab is not offered there.
function submitStake() {
  if(!stakeAvailable()){ flash('STAKING IS ETHEREUM MAINNET ONLY'); return; }
  guardSubmit(prodSubmitStake)();
}

function getCxCalldata() {
  if(S.cxFn != null && Array.isArray(S.cxAbi) && S.cxAbi.length) {
    const d = encodeCxCall();
    if(!d) { flash('INVALID PARAMETERS — CHECK INPUTS'); return null; }
    return d;
  }
  return (document.getElementById("cx-data")?.value || "0x").trim();
}

function submitCustom() {
  if (S.demoMode) {
    const t = S.cxTarget || document.getElementById("cx-target")?.value || "";
    const val = S.cxValue || document.getElementById("cx-value")?.value || "0";
    const d = getCxCalldata(); if (d === null) return;
    const fnName = S.cxFn != null && Array.isArray(S.cxAbi) && S.cxAbi[S.cxFn] ? S.cxAbi[S.cxFn].name : null;
    resetCxState();
    addTxDemo({
      value: val, token: "ETH", target: t, wei: toUnits(val, 18),
      dataLabel: fnName ? fnName.toUpperCase() : (d && d !== '0x' ? `CALL ${d.slice(0, 10)}` : "CALL"),
    });
  } else {
    guardSubmit(prodSubmitCustom)();
  }
}

function submitBatch() {
  if (S.demoMode) {
    const v = S.vaults[S.sel];
    addTxDemo({ value: "0", token: "", target: v.address, dataLabel: `BATCH (${S.batch.length})` });
  } else {
    guardSubmit(prodSubmitBatch)();
  }
}

function doSign(vi, nonce) {
  if (S.demoMode) {
    const tx = S.vaults[vi].queue.find(t => t.nonce === nonce);
    if (!tx) return;
    tx.approvals[DEMO_YOU] = true;
    flash(`SIGNED #${nonce} (OFF-CHAIN)`);
    render();
    highlightTx(nonce);
  } else {
    guardSubmit(prodSign)(vi, nonce);
  }
}

function doApprove(vi, nonce) {
  if (S.demoMode) {
    const tx = S.vaults[vi].queue.find(t => t.nonce === nonce);
    if (!tx) return;
    tx.approvals[DEMO_YOU] = true;
    flash(`APPROVED #${nonce} (ON-CHAIN)`);
    render();
    highlightTx(nonce);
  } else {
    guardSubmit(prodApprove)(vi, nonce);
  }
}

function doUnsign(vi, nonce) {
  if (S.demoMode) {
    const tx = S.vaults[vi].queue.find(t => t.nonce === nonce);
    if (!tx) return;
    tx.approvals[DEMO_YOU] = false;
    flash(`UNSIGNED #${nonce}`);
    render();
  } else {
    guardSubmit(prodUnsign)(vi, nonce);
  }
}

function doSubmit(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    const tx = vt.queue.find(t => t.nonce === nonce);
    if (!tx) return;
    if (tx.cancelTarget != null) {
      vt.queue = vt.queue.filter(t => t.nonce !== nonce && t.nonce !== tx.cancelTarget);
      flash(`CANCELLED #${tx.cancelTarget} VIA EXECUTOR`);
    } else if (vt.delay === 0) {
      vt.queue = vt.queue.filter(t => t.nonce !== nonce);
      flash(`EXECUTED #${nonce}`);
    } else {
      tx.eta = NOW() + vt.delay;
      flash(`QUEUED #${nonce}`);
    }
    render();
  } else {
    guardSubmit(prodSubmit)(vi, nonce);
  }
}

function doExecute(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`EXECUTED #${nonce}`);
    render();
  } else {
    guardSubmit(prodExecute)(vi, nonce);
  }
}

function doFastExecute(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`INSTANT EXECUTED #${nonce} VIA EXECUTOR`);
    render();
  } else {
    guardSubmit(prodFastExecute)(vi,nonce);
  }
}

function doCancel(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    const tx = vt.queue.find(t => t.nonce === nonce);
    if (!tx) return;
    const n = vt.nonce;
    const ap = {};
    vt.owners.forEach(o => ap[o.addr] = !!o.you);
    vt.queue.push({
      nonce: n, target: vt.address, value: "0", token: "",
      dataLabel: `CANCEL #${nonce}`, eta: 0, approvals: ap, cancelTarget: nonce,
    });
    vt.nonce++;
    flash(`CANCEL PROPOSED #${n} \u2192 cancelQueued(#${nonce})`);
    render();
  } else {
    guardSubmit(prodCancel)(vi, nonce);
  }
}

function doReject(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    // Demo: skipping the nonce drops the stuck proposal so the queue advances.
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`REJECTED #${nonce} \u2014 NONCE SKIPPED`);
    render();
  } else {
    guardSubmit(prodReject)(vi, nonce);
  }
}

// Two-click guard so a stray click can't skip a nonce: first click arms
// (button flips to CONFIRM, auto-disarms after a few seconds), second commits.
let _rejectArmed = null, _rejectArmTimer = null;
function armReject(vi, nonce) {
  clearTimeout(_rejectArmTimer);
  if (_rejectArmed === nonce) { _rejectArmed = null; doReject(vi, nonce); return; }
  _rejectArmed = nonce;
  _rejectArmTimer = setTimeout(() => { _rejectArmed = null; render(); }, 4000);
  render();
}

function doAccelerate(vi, nonce) {
  if (S.demoMode) {
    const vt = S.vaults[vi];
    vt.queue = vt.queue.filter(t => t.nonce !== nonce);
    flash(`ACCELERATED #${nonce} VIA EXECUTOR`);
    render();
  } else {
    guardSubmit(prodAccelerate)(vi, nonce);
  }
}

function toggleClone(i){

  s.has(i) ? s.delete(i) : s.add(i);
  S.cf.clone = [...s];
