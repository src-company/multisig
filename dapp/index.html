// ── PRODUCTION: CREATE2 VANITY ────────────────────────────────────

function buildInitcode(impl) {
  return '0x602d5f8160095f39f35f5f365f5f37365f73' + impl.slice(2).toLowerCase() + '5af43d5f5f3e6029573d5ffd5b3d5ff3';
}

// `rps` is every chain this deploy will touch, not just one. The salt is
// chain-independent, so a candidate that is free here but taken on a clone
// target lands on an address that already holds a different vault — and the
// deploy loop would report that stranger's vault as "already deployed".
async function mineVanitySalt(factory, impl, caller, rps) {
  const providers = (Array.isArray(rps) ? rps : [rps]).filter(Boolean);
  if(!providers.length) providers.push(provider);
  const hash = ethers.keccak256(buildInitcode(impl));
  const base = BigInt(caller) << 96n;
  const MAX_ITER = 2000000n;
  for(let n = 0n; n < MAX_ITER; n++) {
    const salt = '0x' + (base | n).toString(16).padStart(64, '0');
    const addr = ethers.getCreate2Address(factory, salt, hash);
    if(addr.slice(2, 4) === '00') {
      // A chain that will not answer cannot clear the address, but it cannot
      // block mining forever either — deployOnChain re-checks before signing.
      const codes = await Promise.all(providers.map(p => p.getCode(addr).catch(() => '0x')));
      if(codes.some(code => code && code !== '0x')) continue; // taken somewhere
      return { salt: base | n, address: addr, nonce: n };
    }
    if(n > 0n && n % 5000n === 0n) await new Promise(r => setTimeout(r, 0));
  }
  throw new Error('Vanity address mining exceeded max iterations');
}

// Does the contract already sitting at `addr` match what this deploy asked for?
// true = the same vault (a retry landing on work already done), false = someone
// else's, null = the chain could not be read. Called before a pre-existing
// deployment is allowed to stand in for this one.
//
// `rp` names the chain to ask, for callers that cannot rely on the ambient
// `provider` still pointing where they mean — the same reason classifyVaultCode
// takes one. Answering this question against the wrong chain is worse than not
// answering it: "false" there condemns a good vault, and "true" blesses an
// address on a chain nobody asked about.
async function vaultMatchesCtx(addr, ctx, rp){
  try {
    const ms = new ethers.Contract(addr, MULTISIG_ABI, rp || provider);
    const [th, dl, ex, ow] = await Promise.all([ms.threshold(), ms.delay(), ms.executor(), ms.getOwners()]);
    if(Number(th) !== Number(ctx.thresh)) return false;
    if(Number(dl) !== Number(ctx.del)) return false;
    if(String(ex).toLowerCase() !== String(ctx.executor).toLowerCase()) return false;
    const have = ow.map(a => String(a).toLowerCase()).sort();
    const want = ctx.resolvedOwners.map(a => a.toLowerCase()).sort();
    return have.length === want.length && have.every((v, i) => v === want[i]);
  } catch(_) { return null; }
}

// ── PRODUCTION: DEPLOY ────────────────────────────────────────────

// Every deploy run carries a serial number, and the async work it started checks
// that number before writing anything back. `S.deploy` being non-null is not the
// same question: cancelling during preflight and starting a second deploy leaves
// the first run's mining and factory probes in flight, and they would land in
// the *new* S.deploy — filing a salt mined against the old chain set, and the
// old chains' readiness, against the run the operator is about to approve.
let _deployRun = 0;
const _deployLive = run => !!S.deploy && S.deploy.run === run;

// ── DEPLOY: RESUMING AN UNFINISHED CHAIN WALK ─────────────────────
//
// The CREATE2 address is a function of the salt, and the salt is mined per run.
// So a multichain deploy that lands on chain 1 and is then interrupted — the
// wallet declines a switch, the tab is closed, the browser is restarted — cannot
// reach the same address on the chains it never got to unless the salt outlives
// the run. It used to live only in S.deploy, which made "close" a silent,
// irreversible choice to scatter the clones.
//
// Written to localStorage the moment the salt is known, so the offer to finish
// survives everything short of clearing site data. Nothing secret is stored: the
// salt is public the instant the first chain deploys (it is an argument to
// create()), and it is useless to anyone else — the factory requires salt >> 96
// to equal msg.sender, so only this deployer can use it.
const RESUME_KEY = 'ms_deploy_resume';
const RESUME_MAX_AGE = 30 * 24 * 3600 * 1000;
const RESUME_MAX = 5;

// Is this record still worth keeping at all? Deployer identity is checked
// separately (_myResumes) — another account's unfinished deploy is none of this
// account's business, but it is not rubbish to be deleted either.
function _resumeValid(r){
  if(!r || r.v !== 1 || !Array.isArray(r.chains) || !r.chains.length) return false;
  if(!Array.isArray(r.owners) || !r.owners.length) return false;
  if(typeof r.ts !== 'number' || Date.now() - r.ts > RESUME_MAX_AGE) return false;
  // Shapes, not just presence. These two are fed straight to BigInt() and to a
  // getCode call when a run is rebuilt, and a record mangled by anything — a
  // half-written value, a hand-edited store — must fail here rather than throw out
  // of the RESUME button or send a malformed address to an RPC.
  if(typeof r.salt !== 'string' || !/^0x[0-9a-fA-F]{1,64}$/.test(r.salt)) return false;
  if(typeof r.minedAddr !== 'string' || !/^0x[0-9a-fA-F]{40}$/.test(r.minedAddr)) return false;
  if(!Number.isFinite(Number(r.thresh)) || !Number.isFinite(Number(r.del))) return false;
  if(!r.chains.every(c => c && Number.isFinite(Number(c.id)))) return false;
  return true;
}
const _sameAddr = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();

// Every stored record, newest first. More than one can be unfinished at a time,
// and they have to be kept apart: an operator who ignores the banner and creates
// a second vault must not thereby strand the first one's clones, which is what a
// single-slot store did — the new run's salt overwrote the only route back to the
// previous address.
function _readAllResume(){
  let raw = null;
  try { raw = JSON.parse(lsGet(RESUME_KEY) || 'null'); } catch(_) { return []; }
  const list = Array.isArray(raw) ? raw : (raw ? [raw] : []);
  return list.filter(_resumeValid).sort((a, b) => b.ts - a.ts);
}
function _writeAllResume(list){
  try {
    // Newest-first is the display order, but it is the wrong eviction order. The
    // store holds five, and a record is only worth keeping because it still owes
    // a chain a vault — so evicting purely by age let a sixth deploy drop the one
    // record that had clones outstanding, in favour of four that had nothing left
    // to finish. That is the failure the multi-record store exists to prevent,
    // and it happened silently: the RESUME banner reads the store, and what is
    // not in it was never offered. Rank by whether anything is still owed, then
    // by age.
    const owed = r => ((r.doneIds || []).length && _resumeLeft(r).length) ? 1 : 0;
    const keep = list.filter(_resumeValid)
      .sort((a, b) => (owed(b) - owed(a)) || (b.ts - a.ts))
      .slice(0, RESUME_MAX);
    if(keep.length) localStorage.setItem(RESUME_KEY, JSON.stringify(keep));
    else localStorage.removeItem(RESUME_KEY);
  } catch(_) {}   // storage full or blocked: the run still works, only resume is lost
}
// The records this account can actually act on. The salt only works for the
// account that mined it — the factory requires salt >> 96 to equal msg.sender —
// so an offer to anyone else is an offer to sign something that reverts.
function _myResumes(){
  const me = window._connectedAddress;
  if(!me) return [];
  return _readAllResume().filter(r => r.deployer && _sameAddr(r.deployer, me));
}
const _findResume = (list, addr) => list.find(r => _sameAddr(r.minedAddr, addr));

function _saveDeployResume(){
  const d = S.deploy;
  if(!d || !d.ctx || !d.ctx.salt || !d.ctx.minedAddr) return;
  const ok = s => s.status === 'done' || s.status === 'skipped';
  const all = _readAllResume();
  const prev = _findResume(all, d.ctx.minedAddr);
  // Merged with what is already stored, never overwritten. A resumed run carries
  // only the chains it still owes, so writing its view wholesale would drop every
  // chain the interrupted run already deployed to — and a resumed run that lands
  // nothing new would drop the record's only evidence that anything ever landed,
  // taking the offer to finish with it and stranding the vault's clones for good.
  const chains = [], seen = new Set();
  for(const c of (prev && Array.isArray(prev.chains) ? prev.chains : []).concat(d.chains.map(n => ({ id:n.id, name:n.name })))){
    if(seen.has(Number(c.id))) continue;
    seen.add(Number(c.id));
    chains.push({ id:Number(c.id), name:c.name });
  }
  const doneIds = [...new Set([
    ...((prev && prev.doneIds) || []).map(Number),
    ...d.steps.filter(ok).map(s => Number(s.id)),
  ])];
  const landedStep = d.steps.find(ok);
  const rec = {
    v: 1, ts: Date.now(),
    deployer: d.ctx.connectedAddress,
    salt: '0x' + d.ctx.salt.toString(16),
    minedAddr: d.ctx.minedAddr,
    owners: d.ctx.resolvedOwners, labels: d.ctx.ownerLabels || null,
    thresh: d.ctx.thresh, del: d.ctx.del, executor: d.ctx.executor,
    wantForward: !!d.ctx.wantForward, cfName: d.ctx.cfName || null,
    // A resume that no longer targets mainnet drops the name from its own context;
    // that is about this run, not about what the deploy was for, so the record
    // keeps it.
    wns: d.ctx.wns || (prev && prev.wns) || null,
    chains, doneIds,
    landedId: (prev && prev.landedId) || (landedStep ? Number(landedStep.id) : null),
  };
  _writeAllResume([rec, ...all.filter(r => !_sameAddr(r.minedAddr, d.ctx.minedAddr))]);
}

// Drop one deploy's record. Addressed rather than wholesale: the store holds every
// unfinished deploy, and finishing or dismissing this one says nothing about them.
function _clearDeployResume(addr){
  if(!addr) return;
  _writeAllResume(_readAllResume().filter(r => !_sameAddr(r.minedAddr, addr)));
}

// What the record still owes: target chains this vault is not known to be on.
function _resumeLeft(r){
  const done = new Set(((r && r.doneIds) || []).map(Number));
  return (r && r.chains ? r.chains : []).filter(c => CHAINS[c.id] && !done.has(Number(c.id)));
}

// The newest record worth offering, or null. Skipped: records with nothing
// deployed yet (a cancelled run has no clones to finish) and records whose every
// target chain already has the vault.
function loadDeployResume(){
  const mine = _myResumes();
  for(const r of mine){
    if(!((r.doneIds || []).length)) continue;
    const left = _resumeLeft(r);
    if(left.length) return { rec: r, left, others: mine.filter(o => o !== r && (o.doneIds||[]).length && _resumeLeft(o).length).length };
  }
  return null;
}

// Ask the chains themselves which of them already hold this vault, and fold the
// answer back into the record. The record is written by the running app, so
// anything that stops the app between a deploy landing and its status being
// saved — a crash, a killed tab, a reload — leaves it behind: the vault exists
// and the record says it does not. The address is derived from the salt through
// the factory, and the factory only accepts a salt whose top 160 bits are the
// caller, so code sitting there was put there by this deployer through this
// factory. deployOnChain still re-verifies the config before letting an existing
// deployment stand in for a pending one.
async function reconcileDeployResume(){
  let changed = false;
  for(const r of _myResumes()){
    const unknown = _resumeLeft(r);
    if(!unknown.length) continue;
    const hits = (await Promise.all(unknown.map(async c => {
      try { const code = await makeProvider(c.id).getCode(r.minedAddr); return (code && code !== '0x') ? Number(c.id) : null; }
      catch(_) { return null; }   // a chain that will not answer stays unknown, not done
    }))).filter(x => x !== null);
    if(!hits.length) continue;
    // Re-read rather than writing back the copy taken before the awaits: a deploy
    // may have started and saved its own progress while these reads were in
    // flight, and the running deploy is the authority on its own run.
    const all = _readAllResume();
    const cur = _findResume(all, r.minedAddr);
    if(!cur || cur.ts !== r.ts) continue;
    cur.doneIds = [...new Set([...((cur.doneIds || []).map(Number)), ...hits])];
    if(!cur.landedId) cur.landedId = hits[0];
    _writeAllResume(all);
    changed = true;
  }
  if(changed && !S.deploy) render();
}

// Rebuild a deploy from the saved record and stop at the review screen — the same
// checkpoint a fresh deploy gets, because this is still N wallet prompts against
// an immutable owner set. Only the chains that did not deploy are walked; each
// one still re-reads the address on its own chain before signing, so a chain the
// record thinks is unfinished but which actually has the vault comes back as
// ALREADY DEPLOYED rather than being deployed twice.
function resumeSavedDeploy(){
  const found = loadDeployResume();
  if(!found){ flash('NOTHING TO RESUME'); render(); return; }
  const { rec, left } = found;
  const chains = left.map(c => ({ id:c.id, name:(NETS.find(n=>n.id===c.id)||c).name }));
  const run = ++_deployRun;
  S.deploy = {
    run, chains,
    steps: chains.map(n => ({ id:n.id, name:n.name, status:'pending' })),
    ctx: {
      resolvedOwners: rec.owners, del: rec.del, thresh: rec.thresh, executor: rec.executor,
      wantForward: !!rec.wantForward, ownerLabels: rec.labels, connectedAddress: rec.deployer,
      cfName: rec.cfName, salt: BigInt(rec.salt), minedAddr: rec.minedAddr,
      deployerIsOwner: rec.owners.some(a => String(a).toLowerCase() === String(rec.deployer).toLowerCase()),
      fastPathVoid: !!rec.wantForward && rec.thresh === rec.owners.length,
      // The name is claimed by init calls on one chain only. If that chain is not
      // among the ones left, carrying the name forward would make the review
      // screen re-check a name this very vault now holds and report it as taken.
      wns: (rec.wns && chains.some(n => Number(n.id) === WNS_CHAIN_ID)) ? rec.wns : null,
    },
    phase:'preflight', address: rec.minedAddr, done:false, lastVaultAddr:null,
    wnsAvail:null, resumed:true, landedId: rec.landedId || null,
    startChainId: S.chainId,
  };
  render();
  // Same preflight as a fresh deploy — gas and factory can have changed on the
  // chains that are left, and this run is about to spend on exactly those.
  _deployPreflight(run, chains, rec.deployer)
    .catch(e => { console.error('Resume preflight:', e); if(_deployLive(run)){ S.deploy.phase='review'; render(); } });
}

function dismissDeployResume(){
  const found = loadDeployResume();
  if(found) _clearDeployResume(found.rec.minedAddr);
  flash('UNFINISHED DEPLOY DISMISSED');
  render();
}

// Offered on every view, not just CREATE: the run that left this behind was
// interrupted by something that moved the operator elsewhere, and a prompt only
// visible on the screen they were taken off is not an offer.
function renderResumeBanner(){
  if(S.deploy || S.demoMode) return '';
  const found = loadDeployResume();
  if(!found) return '';
  const { rec, left, others } = found;
  const n = left.length, names = left.map(c => c.name).join(', ');
  const landedN = (rec.doneIds || []).length;
  // Only the newest is offered, but a second stranded deploy must not be silent —
  // it surfaces here once this one is resumed or dismissed, and saying so is the
  // difference between waiting for it and never knowing it was there.
  const more = others ? `<div style="font-size:9px;letter-spacing:1px;color:var(--d);margin-top:6px">${others} OTHER UNFINISHED DEPLOY${others>1?'S':''} WAITING &middot; OFFERED AFTER THIS ONE.</div>` : '';
  // Deliberately not wrapped in .content — that class is the page's flex-growing
  // main column, and a banner that inherits min-height:60vh is a page.
  return `<div style="padding:8px 0 0">
    <div style="border:1px solid var(--y);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--y)">UNFINISHED DEPLOY &middot; ${n} CHAIN${n>1?'S':''} LEFT</div>
        <div style="font-size:9px;letter-spacing:1px;color:var(--d);line-height:1.7;margin-top:5px">
          ${esc(shortAddr(rec.minedAddr))} deployed on ${landedN} chain${landedN===1?'':'s'}. ${esc(names.toUpperCase())} ${n>1?'were':'was'} not reached.
          The mined address is still held, so resuming puts the vault at the same address there.
        </div>
        ${more}
      </div>
      <div style="display:flex;gap:8px">
        <button class="reset-btn" onclick="dismissDeployResume()">DISMISS</button>
        <button class="btn btn-fill btn-sm" onclick="resumeSavedDeploy()">RESUME</button>
      </div>
    </div>
  </div>`;
}

async function prodDeploy() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;

  const c = S.cf, net = NETS[c.net];
  const valid = c.owners.filter(o => o.addr.trim());
  if(!valid.length) { flash('ADD AT LEAST 1 OWNER'); return; }
  if(parseInt(c.threshold) > valid.length) { flash('THRESHOLD > OWNER COUNT'); return; }

  // Resolve all owner addresses in parallel, each one welded to its label.
  // init() needs the owner list strictly ascending, and the labels are stored
  // positionally against it (owners[i] ↔ labels[i]), so the two have to be
  // sorted as pairs. Sorting the addresses alone leaves the labels behind in
  // form order and silently files every signer under someone else's name —
  // which a cloned Safe, whose getOwners() order is arbitrary, hits every time.
  //
  // assertPreviewed welds the deploy to the form: the create screen already
  // showed the address each name resolves to, and a name that repoints between
  // being reviewed and being signed for would otherwise install a signer the
  // operator never saw — permanently, since the owner set can only be changed by
  // a full multisig round of the vault it is being installed into.
  let pairs;
  try {
    pairs = await Promise.all(valid.map(async o => ({
      addr: assertPreviewed(o.addr, await resolveName(o.addr), OWNER_NS_CHAIN),
      label: o.label || '',
    })));
  } catch(e) {
    flash(`OWNER: ${e.shortMessage || e.message}`);
    return;
  }
  pairs.sort((a, b) => a.addr.toLowerCase() < b.addr.toLowerCase() ? -1 : 1);
  const resolvedOwners = pairs.map(p => p.addr);
  const ownerLabels = pairs.map(p => p.label);

  // Reject duplicates before the expensive mining/deploy — init() requires
  // strictly ascending owners, so a repeat (incl. two names resolving to the
  // same address) would revert the whole tx after paying to mine + deploy.
  for(let i = 1; i < resolvedOwners.length; i++) {
    if(resolvedOwners[i].toLowerCase() === resolvedOwners[i-1].toLowerCase()) {
      flash('DUPLICATE OWNER ADDRESS'); return;
    }
  }
  // Same reasoning, for the sentinel end of the range: owners must be > 0x1.
  // A name can resolve to anything, so this is checked after resolution too.
  if(resolvedOwners.some(a => BigInt(a) <= 1n)) { flash('OWNER 0x0 IS NOT A VALID ADDRESS'); return; }
  // Audit H-2 — a threshold of 1009 or more overflows execute()'s uint16
  // signature-length check, and the threshold cannot exceed the owner count, so
  // the owner count is where the ceiling has to be enforced.
  if(resolvedOwners.length > MAX_SAFE_THRESHOLD) { flash(`REFUSED — MORE THAN ${MAX_SAFE_THRESHOLD} OWNERS CAN OVERFLOW THE SIGNATURE-LENGTH CHECK AND PERMANENTLY DISABLE OWNER-SIGNED EXECUTION`); return; }

  const thresh = Math.min(parseInt(c.threshold) || 1, resolvedOwners.length);
  const del = toSec(c.delayVal, c.delayUnit);
  const executor = del > 0 ? TIMELOCK_EXECUTOR : ethers.ZeroAddress;
  const wantForward = c.fastPath && del > 0;
  // Audit H-1. The fast path lets a unanimous signature set skip the timelock.
  // Where the threshold already is the owner count, unanimity is just quorum,
  // so the timelock stops being enforced and becomes a default that anyone
  // holding the signatures can waive. That is a legitimate thing to want — it
  // is what delay=0 gives you, with queuing still the normal path — so it is
  // surfaced in the review screen rather than refused. Raised before the deploy
  // because turning it off afterwards costs a full delay period.
  const fastPathVoid = wantForward && thresh === resolvedOwners.length;
  // register_wallet() requires the deployer to be one of the owners. Cloning a
  // Safe you only watch produces exactly that vault, so surface it before the
  // deploy rather than losing the record afterwards.
  const deployerIsOwner = resolvedOwners.some(a => a.toLowerCase() === connectedAddress.toLowerCase());

  // Deploy chains: primary first, then clone targets. The CREATE2 address is
  // identical on every chain (same factory + salt + init code), so the vault
  // clones to the same address everywhere.
  // The null guard is not decoration: these are indexes into NETS held in form
  // state, and this line sits outside the try below — an index that no longer
  // names a network (a stale saved form, a shortened NETS) threw a TypeError
  // straight out of prodDeploy, past guardSubmit, into an unhandled rejection.
  // The operator pressed DEPLOY and nothing happened, with nothing said.
  const chainIdxs = [c.net, ...(c.clone || [])].filter((v,i,a)=>a.indexOf(v)===i);
  const chains = chainIdxs.map(i => NETS[i]).filter(n => n && CHAINS[n.id]);
  if(!chains.length) { flash('SELECT A NETWORK'); return; }

  // Optional on-chain identity, carried as two extra init calls on the mainnet
  // step only. Whether it is still free is not decided here — it is re-asked in
  // the preflight and again immediately before signing, because between typing
  // a name and approving a wallet prompt is exactly long enough for someone
  // else to take it, and a register() that reverts takes the whole deploy with
  // it: the vault, the mined salt and the gas, for a name that was optional.
  const wnsLabel = c.wns ? wnsSlug(c.name) : '';
  const wns = wnsLabel && wnsLabelValid(wnsLabel) && chains.some(n => n.id === WNS_CHAIN_ID)
    ? { label: wnsLabel, full: wnsFullName(wnsLabel), id: wnsSubId(wnsLabel) }
    : null;

  // Deploy context shared across chains + retries.
  const run = ++_deployRun;
  S.deploy = {
    run, chains,
    steps: chains.map(n => ({ id:n.id, name:n.name, status:'pending' })),
    ctx: { resolvedOwners, del, thresh, executor, wantForward, ownerLabels, connectedAddress, cfName: c.name || null, salt:null, minedAddr:null, deployerIsOwner, fastPathVoid, wns },
    phase:'preflight', address:null, done:false, lastVaultAddr:null, wnsAvail:null,
    // Where the app was pointed when this run began — see _finishDeploy.
    startChainId: S.chainId,
  };
  render();
  // Handed off rather than awaited, so guardSubmit's lock is released the moment
  // the overlay is up. Holding it across the preflight would mean that pressing
  // CANCEL and pressing DEPLOY again did nothing at all until the RPC that caused
  // the cancelling finally answered. From here the run token and S.deploy are
  // what keep a second deploy from interleaving with this one.
  _deployPreflight(run, chains, connectedAddress)
    .catch(e => { console.error('Deploy preflight:', e); if(_deployLive(run)){ S.deploy.phase = 'review'; render(); } });
}

// What this deploy will cost in gas, near enough to tell "cannot pay" from
// "can". The measured range is 156k for a 1-of-1 through ~330k for a
// createWithCalls with several init calls (.gas-snapshot), and each extra owner
// is another cold SSTORE into the linked list. Rounded up rather than fitted:
// the answer this feeds is a yes/no about affordability, and an estimate that
// runs under the truth is the one that lets a deploy fail after the operator has
// already approved it.
function deployGasEstimate(ctx) {
  const owners = (ctx && ctx.resolvedOwners ? ctx.resolvedOwners.length : 1);
  const initCalls = (ctx && ctx.wantForward ? 1 : 0) + (ctx && ctx.wns ? 2 : 0);
  return 150000n + BigInt(owners) * 30000n + BigInt(initCalls) * 70000n;
}

async function _deployPreflight(run, chains, connectedAddress) {
  const ctx = (S.deploy && S.deploy.ctx) || {};
  // The executor is installed on the vault whenever there is a delay to enforce,
  // not only when the fast path is on — so its presence is checked on the same
  // condition. It used to be gated on wantForward, which meant a timelocked
  // vault cloned to a chain where the singleton is absent deployed pointing at a
  // codeless address: no cancel, no accelerate, no warning. The vault still
  // works and still queues, but the only brake that can act inside the delay
  // window is not there, and nothing said so until an owner needed it.
  const needExecutor = Number(ctx.del) > 0;
  const gasNeeded = deployGasEstimate(ctx);
  // Preflight (read-only, no chain switch): is the factory deployed on each
  // chain, can the wallet actually pay for the deploy there, and — where the
  // vault will carry one — is the TimelockExecutor present? The factory check is
  // the one that cannot be skipped: a create() sent to a chain without it is a
  // plain transfer to a codeless address, which mines successfully and deploys
  // nothing.
  //
  // Two rounds of reads, not four. These were sequential awaits — factory code,
  // then the factory's implementation, then balance and fees, then the executor —
  // against N chains at once, and the operator sits watching CHECKING… for the
  // sum of them. Only implementation() and forwardEnabled() depend on anything;
  // the rest are independent and now go together.
  const pfPromise = Promise.all(chains.map(async net => {
    const rp = makeProvider(net.id);
    let gasOk = null, executorOk = null, factoryOk = null, implOk = null, gasShort = null;
    const settled = p => p.then(v => ({ ok:true, v }), e => ({ ok:false, e }));
    const [fcR, balR, feeR, exCodeR] = await Promise.all([
      settled(rp.getCode(FACTORY)),
      settled(rp.getBalance(connectedAddress)),
      settled(rp.getFeeData()),
      needExecutor ? settled(rp.getCode(TIMELOCK_EXECUTOR)) : Promise.resolve(null),
    ]);
    if(fcR.ok) factoryOk = !!fcR.v && fcR.v !== '0x';
    // "Has a balance" is not "can pay". This was `balance > 0n`, so a wallet
    // holding a single wei cleared the preflight green and then failed at the
    // wallet prompt, or after it — on the chain the operator was least likely to
    // be funded on, which is the whole reason to check. Price the transaction
    // and compare against it, and keep the shortfall so the row can say how much
    // is missing rather than just that something is.
    if(balR.ok && feeR.ok){
      const price = feeR.v.maxFeePerGas || feeR.v.gasPrice;
      if(price == null){
        // No fee data to price it with — fall back to the old question rather
        // than reporting a shortfall this could not have measured.
        gasOk = balR.v > 0n;
      } else {
        const need = gasNeeded * BigInt(price);
        gasOk = balR.v >= need;
        if(!gasOk) gasShort = need - balR.v;
      }
    } else if(balR.ok){
      gasOk = balR.v > 0n;
    }
    // Code at the factory address is not proof it is *this* factory. The audit's
    // deployment checklist asks for the audited build to be confirmed on-chain
    // rather than assumed, and the cheapest confirmation is the factory naming
    // its own implementation: a chain where that address holds something else
    // would mint vaults running code this audit never saw.
    if(factoryOk){
      try {
        const impl = await new ethers.Contract(FACTORY, FACTORY_ABI, rp).implementation();
        implOk = String(impl).toLowerCase() === IMPLEMENTATION.toLowerCase();
      } catch(_){}
    }
    if(needExecutor){
      try {
        if(!exCodeR.ok) throw exCodeR.e;
        const code = exCodeR.v;
        // Code alone is the same weak claim the factory check stopped accepting:
        // on a chain where that address holds something else, a vault would be
        // deployed pointing its cancel route at a stranger. Ask it the one
        // question a TimelockExecutor can answer.
        if(!code || code === '0x') executorOk = false;
        else {
          await new ethers.Contract(TIMELOCK_EXECUTOR, TIMELOCK_EXECUTOR_ABI, rp).forwardEnabled(ethers.ZeroAddress);
          executorOk = true;
        }
      } catch(e){
        const answered = e && (e.code === 'CALL_EXCEPTION' || e.code === 'BAD_DATA');
        executorOk = answered ? false : null;   // silence is not an answer
      }
    }
    // needExec travels with the result so the review screen can tell "not asked"
    // from "asked and got no reply" — both leave executorOk null.
    return { gasOk, gasShort, executorOk, factoryOk, implOk, needExec: needExecutor };
  }));
  // Mine the CREATE2 salt up front (chain-independent), dedup-checked against
  // every chain this deploy targets, so the actual vault address is known and
  // shown in the review / deploy overlay before the user approves any wallet
  // prompt. Runs concurrently with preflight; if it fails we fall back to lazy
  // mining inside deployOnChain.
  //
  // A resumed run arrives with the salt already decided, and mining over it would
  // defeat the entire point: the whole reason to resume is to reach the *same*
  // address on the chains that were missed. It would not even mine the same one —
  // the miner rejects candidates whose address already holds code, and on a
  // resume that address holds the vault that already deployed.
  const haveSalt = !!(S.deploy && S.deploy.ctx && S.deploy.ctx.salt && S.deploy.ctx.minedAddr);
  const minePromise = haveSalt ? Promise.resolve() : (async () => {
    try {
      const mined = await mineVanitySalt(FACTORY, IMPLEMENTATION, connectedAddress, chains.map(n => makeProvider(n.id)));
      if(_deployLive(run)){ S.deploy.ctx.salt = mined.salt; S.deploy.ctx.minedAddr = mined.address; S.deploy.address = mined.address; _saveDeployResume(); render(); }
    } catch(e){ console.error('Vanity mining (preflight):', e); }
  })();
  // Is the requested name still free? Read alongside the rest of the preflight
  // so the review screen can say so before anything is signed, rather than
  // reporting it afterwards as a step that quietly did less than it said.
  const wnsPromise = (async () => {
    const ctx = S.deploy && S.deploy.ctx;
    if(!ctx || !ctx.wns) return;
    const ok = await wnsAvailable(ctx.wns.label, connectedAddress);
    if(_deployLive(run)){ S.deploy.wnsAvail = ok; render(); }
  })();
  const pf = await pfPromise;
  await minePromise;
  await wnsPromise;
  if(!_deployLive(run)) return;   // cancelled during preflight, or superseded
  pf.forEach((r,i)=>{ S.deploy.steps[i].pf = r; });
  // Always stop at the review screen. This is the last point before a chain of
  // wallet prompts that mints an immutable owner set on N chains and costs gas on
  // each, and it is the only place the mined CREATE2 address — the address funds
  // will be sent to — can be read before anything is signed. Skipping it when the
  // preflight happened to come back clean saved one click and spent the only
  // checkpoint the flow has.
  S.deploy.phase = 'review';
  render();
}

// Ask the wallet where it is, and record the answer.
//
// S.walletChain used to be written only by the chainChanged event, and
// requireSigner() refuses to sign whenever it disagrees with S.chainId. Not every
// wallet emits that event for every switch — WalletConnect sessions in
// particular resolve wallet_switchEthereumChain and go quiet — so the app could
// be holding a chain the wallet left minutes ago.
//
// Mid-deploy that was a dead end rather than a stale label. deployOnChain polls
// eth_chainId directly, confirms the wallet really did arrive, and then calls
// requireSigner() — which compared the *event's* view, found it stale, and
// refused. The step failed as 'WALLET DISCONNECTED', which it was not, the run
// halted, and RESUME walked into the same wall every time, because nothing on
// that path ever updated the value it was tripping over.
//
// So every direct read now writes it back. A poll is a stronger observation
// than an event that may never come.
async function readWalletChain(){
  const wp = window._connectedWalletProvider;
  if(!wp) return null;
  try {
    const id = parseInt(await wp.request({method:'eth_chainId'}), 16);
    if(Number.isFinite(id) && id > 0){ S.walletChain = id; return id; }
  } catch(_){}
  return null;
}

// Wait for the connected wallet's active chain to match `id`, polling to absorb
// wallets that switch asynchronously. Resolves true once matched, false on timeout.
// The default budget is for a wallet that has already agreed; pass a longer one
// where a human still has to tap approve.
async function waitForWalletChain(id, tries=8, gap=400){
  const wp = window._connectedWalletProvider; if(!wp) return true;
  for(let i=0;i<tries;i++){
    if(await readWalletChain() === id) return true;
    if(i<tries-1) await new Promise(r=>setTimeout(r,gap));
  }
  return false;
}

// Record a vault that exists on one chain — named, not inferred.
//
// `chainId` and `rp` are the chain this vault was found on. They used to be the
// ambient ones: the module-level `provider` for the nonce read, and S.chainId
// inside dbRegisterWallet for the row's own chain. That is true of every caller
// today and is exactly the kind of thing that stops being true quietly — a
// recovery path runs in a catch block, after an await, and the chain the app is
// pointed at is not a fact it controls. A row filed under the wrong chain is not
// a cosmetic error: my_wallets is keyed on it, so the vault would appear on a
// chain it does not exist on and be missing from the one it does.
//
// Every route that ends in "this vault is on this chain" has to come through
// here, because the coordination row is not bookkeeping — my_wallets is what puts
// a vault on its owners' dashboards, so a chain with no row is a chain where the
// vault cannot be found. Only the freshly-mined path used to write one. The
// already-deployed path did not, and that is the path RETRY takes: the overlay
// went green on all three chains, said ALREADY DEPLOYED, and left two of them
// absent from every owner's dashboard with nothing to indicate it.
//
// block/txHash are what this chain can attest to and are allowed to be unknown —
// a vault found sitting at the address by getCode carries no receipt to read them
// from. They are written blank in that case, and blank is where they stay: the
// INSERT only supplies created_block/created_tx on the row's first registration,
// and the ON CONFLICT branch does not touch them, so a later registration that
// does know the block cannot fill them in. That is a deliberate trade and not a
// silent one — nothing in this app reads either column, and the alternative is
// hunting a Created event across an unknown block range to complete a record no
// screen shows. What must not be blank is the row itself, which is the only thing
// standing between an owner and a vault they cannot find.
async function _recordDeployedVault(step, addr, ctx, block, txHash, chainId, rp){
  try {
    const ms = new ethers.Contract(addr, MULTISIG_ABI, rp || provider);
    const onchainNonce = Number(await ms.nonce());
    const wid = await dbRegisterWallet(addr, ctx.connectedAddress, ctx.salt, ctx.resolvedOwners,
      ctx.thresh, ctx.del, ctx.executor, Number(block) || 0, txHash || '',
      ctx.cfName, ctx.ownerLabels, onchainNonce, chainId);
    if(!wid) step.dbWarn = true;   // deployed on-chain, absent from history
  } catch(e){ console.error('DB register failed:', e); step.dbWarn = true; }
}

// Wait for a broadcast transaction to produce a receipt. Polled rather than
// subscribed to, and read off this chain's own RPC rather than the wallet's:
// every caller is on a recovery path, and the thing that put them there may well
// be the wallet provider itself.
//
// Resolves the receipt, or null when the chain has not produced one inside the
// budget — which is "cannot be read yet", not "it failed". The caller must not
// turn the second into the first: a transaction still in the mempool at the end
// of a minute is one whose vault will exist a block later, and RETRY finds it.
async function _waitForReceipt(rp, hash, tries=20, gap=3000){
  for(let i=0;i<tries;i++){
    try { const rec = await rp.getTransactionReceipt(hash); if(rec) return rec; } catch(_){}
    if(i<tries-1) await new Promise(r=>setTimeout(r,gap));
  }
  return null;
}

// Deploy the vault on one chain (used by the run loop and per-chain retry).
// Resolves 'done' | 'failed' | 'blocked'. The third is the one the run loop
// cares about: it means the wallet, not the chain, said no — so every remaining
// chain would hit the same wall and walking on would just fire N dead prompts.
async function deployOnChain(k){
  const d = S.deploy; if(!d) return 'failed';
  const net = d.chains[k], step = d.steps[k], ctx = d.ctx;
  // A reader pinned to the chain this step is about, so every question asked below
  // is asked of that chain by name. The ambient `provider` is the same thing today
  // — switchChain repoints it before any of this runs — but only for as long as
  // nothing else moves it, and the reads here are separated from that switch by a
  // wallet round trip and, in the catch, by a failure. makeProvider caches per
  // chain, so this costs a map lookup.
  //
  // The CHAINS guard is belt-and-braces, not a live case: every route that fills
  // d.chains has already dropped ids CHAINS does not carry — prodDeploy filters on
  // it directly, and a resumed run gets its list from _resumeLeft, which filters on
  // it too. It is here because makeProvider dereferences that entry without
  // checking, so the cost of the assumption ever going stale is a TypeError thrown
  // from whichever caller happens to be first rather than a chain quietly missing.
  const rp = (CHAINS[net.id] && makeProvider(net.id)) || provider;
  const NM = String(net.name).toUpperCase();
  try {
    // Cleared alongside the error: a retry re-asks whether the name is free, so
    // last attempt's answer must not still be on screen under this attempt's row.
    // The transaction hash goes too — a failed attempt can leave one (a receipt
    // that mined and deployed nothing), and keeping it means a row that later
    // reads ALREADY DEPLOYED still links out to the attempt that failed.
    step.status='switching'; step.err=null; step.blocked=false; step.wnsSkipped=null; step.wnsName=null;
    step.txHash=null; step.verified=undefined; step.dbWarn=false; render();
    let sw = { ok:true };
    // Whether to ask is decided by where the *wallet* is, not by where the app
    // thinks it is. Those come apart: the operator switches by hand mid-run, or a
    // previous chain's switch never landed. When they do, S.chainId can already
    // equal this chain while the wallet sits on another — and skipping the request
    // on that basis meant polling for thirty seconds for a switch nobody asked
    // for, then blaming the wallet for not making it. One read settles it.
    const alreadyThere = await waitForWalletChain(net.id, 1, 0);
    if(!alreadyThere || net.id !== S.chainId) sw = (await switchChain(net.id, true)) || { ok:true };
    // The wallet is the authority on which chain it is on — not its reply to the
    // switch request. Some wallets (esp. over WalletConnect) resolve the request
    // before the active chain flips, and some resolve it having done nothing at
    // all, so poll either way and only then use the request's own error to say
    // *why* it never landed.
    //
    // How long to wait is the request's answer to decide. A pending switch is a
    // human reaching for a phone, and the old 3.2s budget failed switches the user
    // was still approving, then blamed the chain. A switch that came back rejected
    // or unsupported has already been answered, and waiting half a minute to
    // report what the wallet said outright is its own kind of stall.
    const answered = sw.rejected || sw.unsupported;
    if(window._connectedWalletProvider && !(await waitForWalletChain(net.id, answered ? 4 : 40, answered ? 400 : 750))){
      step.status='failed'; step.blocked=true;
      step.err = sw.rejected ? `SWITCH TO ${NM} REJECTED IN WALLET`
        : sw.unsupported ? `ADD ${NM} TO YOUR WALLET, THEN RESUME`
        : `WALLET NEVER SWITCHED TO ${NM}`;
      render(); return 'blocked';
    }
    // Both halves named separately. They used to share one message — 'WALLET
    // DISCONNECTED' — which was the wrong half of the time and pointed at the
    // wrong remedy: a wallet that has drifted onto another chain is connected,
    // and reconnecting it does nothing.
    if(!window._signer){ step.status='failed'; step.blocked=true; step.err='WALLET DISCONNECTED'; render(); return 'blocked'; }
    // The wallet is on this chain now, so bind a signer to it here rather than
    // reusing the one built when the wallet connected. Nothing is asked of the
    // wallet; this is two local provider calls. It exists because the alternative
    // failed in the one place it mattered: a signer carried over from the previous
    // chain deployed onto this one and then threw on the way back, which is a red
    // row and an unrecorded vault over a deploy that worked.
    // A rebind that reports the account gone is the earliest and clearest place
    // this is knowable: the salt below is bound to the deployer, so the run cannot
    // continue as someone else, and saying so here costs no wallet prompt. Left to
    // be discovered at eth_sendTransaction instead, it arrives as the wallet
    // complaining that `from` is not the selected account — a true statement about
    // the wrong subject, after the operator has already been asked to approve.
    if(typeof window.walletRebindSigner === 'function'){
      try {
        const rb = await window.walletRebindSigner();
        if(rb && rb.moved){
          step.status='failed'; step.blocked=true;
          step.err=`SWITCH BACK TO ${shortAddr(ctx.connectedAddress)}`;

      catch(e){ console.error('Rebind signer:', e); }

    if(!w){

      step.status='failed'; step.blocked=true;
      step.err=`WALLET IS ON ${where}, NOT ${NM} — SWITCH IT AND RESUME`;
      render(); return 'blocked';
    }

    // msg.sender. Switching accounts mid-deploy would otherwise revert with an
    // opaque SaltDoesNotStartWith after the wallet prompt was already approved.

    // record of the account only when the signer cannot say. The rebind above binds
    // to the known account or reports it gone, so this should never be the thing
    // that catches a switch — which is exactly why it is worth keeping: it is the
    // last check standing between a stale signer and a prompt, it reads the one
    // object whose identity cannot be out of date, and window._connectedAddress is
    // deliberately left for accountsChanged to update, so comparing that instead
    // would trust the value most likely to still be wrong.
    const signer = w.signer;
    const signAs = (signer && signer.address) || w.addr;
    if(signAs && ctx.connectedAddress && signAs.toLowerCase() !== ctx.connectedAddress.toLowerCase()){
      step.status='failed'; step.blocked=true; step.err=`SWITCH BACK TO ${shortAddr(ctx.connectedAddress)}`; render(); return 'blocked';
    }

      // skipping is right. But an earlier deploy from the same EOA can occupy

      // a different signer set — reporting it as "already deployed" would hand
      // back a stranger's wallet as though the clone had succeeded.
      const same = await vaultMatchesCtx(ctx.minedAddr, ctx, rp);
      if(same !== true){
        step.status='failed';
        step.err = same === false ? 'ADDRESS HOLDS A DIFFERENT VAULT' : 'CANNOT VERIFY EXISTING VAULT';
        render(); return 'failed';
      }

      // after a step that deployed and was called failed, so it is the last chance
      // this run has to get the vault onto its owners' dashboards for this chain.
      step.status='skipped'; step.address=ctx.minedAddr; d.lastVaultAddr=ctx.minedAddr;

    // executor is installed. The fast path is one; the identity claim is two

    const initCalls = [];

      // on. The claim is optional and the vault is not: rather than send a
      // register() that would revert and take the whole deploy with it, drop
      // the name and say so. The vault still lands at the mined address, and
      // the NAME tab can claim a different name afterwards for the price of
      // one proposal. A lookup that would not answer is treated the same way —
      // "not confirmed free" is the only safe reading of silence when the cost
      // of being wrong is the deploy itself.
      const free = await wnsAvailable(ctx.wns.label, ctx.connectedAddress);
      if(free === true) initCalls.push(...wnsClaimCalls(ctx.wns.label));

    }

    // succeeding: createWithCalls executes each init call through the vault's

      try {
        const wnsC = new ethers.Contract(WEINS, WEINS_ABI, makeProvider(WNS_CHAIN_ID));
        const holder = await wnsC.resolve(ctx.wns.id);
        if(String(holder).toLowerCase() === String(walletAddr).toLowerCase()) step.wnsName = ctx.wns.full;
        else step.wnsSkipped = 'unconfirmed';
      } catch(e){ console.error('WNS read-back:', e); step.wnsSkipped = 'unconfirmed'; }
    }
    d.lastVaultAddr = walletAddr;
    await _recordDeployedVault(step, walletAddr, ctx, receipt.blockNumber, receipt.hash, net.id, rp);
    step.status='done'; step.address=walletAddr; step.txHash=receipt.hash; _saveDeployResume(); render();
    return 'done';
  } catch(e){
    console.error('deploy on', net.name, e);
    // Declining the prompt is a decision about the whole run, not a fault of this
    // chain: firing the next chain's prompt at someone who just pressed reject
    // walks the rest of the list into red rows they never chose. Insufficient gas
    // is chain-specific — the balance is per chain — so that one does not halt.
    const code = e && (e.code !== undefined ? e.code : (e.info && e.info.error && e.info.error.code));

    step.err = rejected ? 'REJECTED IN WALLET' : (e.shortMessage || e.message || 'FAILED');
    // A failure after the transaction was broadcast still leaves a transaction —
    // reverted, dropped, or merely un-awaited because the RPC went away mid-wait.
    // It is the first thing the operator needs and the row was throwing it away,
    // so the only route back to it was the wallet's own history. ethers carries
    // it in a different place depending on where the failure happened.
    //
    // info.sendTransactionHash is the one that matters most and was the one
    // missing. It is where ethers puts the hash when eth_sendTransaction has
    // already returned and the read that followed threw — no receipt to hang it
    // on, no transaction object ever built, so the error carries it instead. That
    // is precisely the failure whose row needs a link: a deploy that succeeded.
    const failedHash = e && (e.receipt?.hash || e.transaction?.hash || e.transactionHash ||
      e.info?.sendTransactionHash || (typeof e.hash === 'string' ? e.hash : null));
    if(typeof failedHash === 'string' && /^0x[0-9a-fA-F]{64}$/.test(failedHash)) step.txHash = failedHash;
    // Ask the chain before reporting a failure, because not every throw on this
    // path means nothing happened. Some of them land *after* the transaction was
    // broadcast — an RPC that went away mid-wait, a provider that decided its
    // network had changed under it — and the vault is then sitting at the mined
    // address while this row says FAILED. That is the worst of the three possible
    // answers: the operator is told to retry a deploy that already succeeded, and
    // nothing has recorded it.
    //
    // A vault that is there but not the one that was ordered fails vaultMatchesCtx
    // and falls through to the red row — an address holding a stranger's wallet
    // must never be reported as this run's clone.
    //
    // Not asked after a refusal, though the answer would often be 'done': a
    // declined prompt broadcast nothing, so anything at that address predates this
    // attempt, and turning the step green would release the halt and fire the next
    // chain's prompt at someone who has just said no. The halt stands, and RESUME
    // comes back through the already-deployed branch above, which records it.
    if(!rejected && ctx && ctx.minedAddr){
      // `rp` is the step's own reader, built once at the top of this function —
      // this chain by name, which is the whole point in a catch block reading a
      // chain the app may already have been moved off. Deliberately not rebuilt
      // here: one reader per step is what makes "which chain did this step ask"
      // answerable in one place, and a second construction sitting outside the try
      // below is a statement that could throw its way out of the error handler,
      // taking the real error with it.
      let blk = Number(e?.receipt?.blockNumber) || 0;
      try {
        // A transaction that has been broadcast is usually still in the mempool at
        // the moment the error arrives — that is the exact shape of the failure
        // this reconciliation is for, where the throw came from the read *after*
        // eth_sendTransaction returned a hash. Asking for code straight away would
        // find none and paint the row red over a deploy that was seconds from
        // landing, so wait for the receipt first. Only when a hash exists: with
        // nothing broadcast there is nothing to wait for, and a genuine failure
        // must not be made to sit through a minute of polling before it is named.
        if(step.txHash && !blk){
          step.status='checking'; render();
          const rec = await _waitForReceipt(rp, step.txHash);
          if(rec) blk = Number(rec.blockNumber) || 0;
          // Mined and reverted is a real failure and is worth saying plainly. The
          // thrown error describes whatever broke on the way back, which for a
          // revert observed through a dead RPC is not the revert.
          if(rec && Number(rec.status) === 0){
            step.status='failed'; step.err='TRANSACTION REVERTED ON CHAIN'; render(); return 'failed';
          }
          // Restored before the question below is asked, so that a row rendered
          // mid-check never sits at CONFIRMING with no answer coming.
          step.status='failed';
        }
        const kind = await classifyVaultCode(ctx.minedAddr, rp);
        if((kind === 'clone' || kind === '7702') && await vaultMatchesCtx(ctx.minedAddr, ctx, rp) === true){
          step.status='done'; step.err=null; step.blocked=false; step.verified=true;
          step.address=ctx.minedAddr; d.lastVaultAddr=ctx.minedAddr;
          await _recordDeployedVault(step, ctx.minedAddr, ctx, blk, step.txHash || '', net.id, rp);
          _saveDeployResume(); render();
          return 'done';
        }
      } catch(e2){
        console.error('Post-failure vault check:', e2);
        // The check itself broke. It has no verdict to offer, so the original one
        // stands — including the status, which the wait above may have moved.
        step.status='failed'; step.blocked = rejected;
      }
    }
    render();
    return rejected ? 'blocked' : 'failed';
  }
}
async function _finishDeploy(){
  const d = S.deploy; if(!d) return;
  d.done = true;
  const ok = i => d.steps[i] && (d.steps[i].status==='done' || d.steps[i].status==='skipped');
  // Fold this run's results in first, then ask the merged record — not this run's
  // steps — whether anything is still owed. A resumed run only ever sees the
  // chains it was asked to finish, so "every step here succeeded" is not the same
  // question as "this vault is now on every chain it was meant to be on".
  _saveDeployResume();
  if(d.ctx && d.ctx.minedAddr){
    const rec = _findResume(_readAllResume(), d.ctx.minedAddr);
    // Nothing left to offer: the salt has done its job and should not outlive it.
    if(!rec || !_resumeLeft(rec).length) _clearDeployResume(d.ctx.minedAddr);
  }
  render();
  const addr = d.lastVaultAddr || (d.resumed ? d.ctx && d.ctx.minedAddr : null);
  if(!addr) return;
  // Land on a chain where the vault actually exists: the primary if it deployed,
  // otherwise the first chain that succeeded. loadSingleVaultData reads the live
  // `provider`, so pointing at a chain without the vault (e.g. after a trailing
  // clone failed) would make the multicall revert and the vault silently vanish.
  let landIdx = ok(0) ? 0 : d.steps.findIndex((_,i)=>ok(i));
  // A resumed run whose remaining chains all failed has no landing chain of its
  // own, but the vault does exist — on the chain the interrupted run reached.
  const homeId = landIdx >= 0 ? d.chains[landIdx].id : (d.landedId || null);
  if(homeId){
    // When the run halted because the wallet refused something, move only the
    // app's own reads — the vault has to be read off a chain it exists on, but
    // the answer to a declined prompt is not another prompt. RESUME asks again.
    if(homeId !== S.chainId){
      if(d.halted || landIdx < 0) adoptChain(homeId);
      else try { await switchChain(homeId, true); } catch(e){ console.error('Return to home chain:', e); }
    }
  } else if(landIdx < 0) return;   // nothing deployed anywhere this run can read
  // The walk moves the app's own chain, and every switch it makes is skipLoad —
  // so the vault list on screen is still the one loaded for the chain the
  // operator was browsing when they opened CREATE. Deploying to a chain they
  // were not on therefore left that list sitting under a new chain id: cards for
  // vaults that do not exist here, reading their balances and queues against
  // this chain's copy of their addresses, and building EIP-712 domains with this
  // chain's id if anyone signed on one. Drop it and reload for where we landed.
  const moved = d.startChainId != null && S.chainId !== d.startChainId;
  if(moved){ S.vaults = []; S.sel = 0; }
  if(!S.vaults.some(v => v.address && v.address.toLowerCase() === addr.toLowerCase())){
    try { const vData = await loadSingleVaultData(addr); if(vData){ S.vaults.push(vData); S.sel = S.vaults.length - 1; render(); } } catch(e){ console.error('Load new vault:', e); }
  }
  // The new vault is on screen and selected; the rest of this chain's vaults are
  // fetched behind it, and the selection is restored by address afterwards
  // because loadAllVaults rebuilds the list and resets the index.
  if(moved){
    loadAllVaults().then(() => {
      const i = S.vaults.findIndex(v => v.address && v.address.toLowerCase() === addr.toLowerCase());
      if(i >= 0){ S.sel = i; render(); }
    }).catch(e => console.error('Reload after deploy:', e));
  }
}
// One chain walk at a time, per run. DEPLOY is behind guardSubmit, but RESUME and
// RETRY are plain buttons on a dialog that is already up, and a double press there
// used to start a second walk over the same chain list — two wallet prompts racing
// for the same step, with only the on-chain existence check downstream to stop the
// loser re-deploying what the winner just did.
//
// Held as the run number rather than a boolean, because a boolean outlived the run
// it belonged to. _finishDeploy sets done and then awaits a chain switch and a
// vault load, and the dialog is closable the moment done is set — so CLOSE during
// that window left the flag raised with no run behind it. The next deploy then
// walked its preflight, reached its review screen, and DEPLOY did nothing at all:
// no prompt, no error, no way forward. A walk over a run that has been closed or
// superseded exits at its own next liveness check and has no claim on the flag.
let _deployWalkingRun = 0;
const _deployWalkBusy = () => !!S.deploy && _deployWalkingRun === S.deploy.run;
async function runDeploy(){
  if(!S.deploy || _deployWalkBusy()) return;
  const run = S.deploy.run;
  S.deploy.phase = 'deploying'; S.deploy.halted = null; render();
  _deployWalkingRun = run;
  try {
    for(let k=0; k<S.deploy.chains.length; k++){
      // Re-checked every lap: each chain is a wallet round-trip, and the run this
      // loop belongs to must not keep walking chains into a deploy that replaced it.
      if(!_deployLive(run)) return;
      const st = S.deploy.steps[k];
      if(st.status === 'done' || st.status === 'skipped') continue;
      const r = await deployOnChain(k);
      if(!_deployLive(run)) return;
      // A wallet-level refusal is not this chain's problem, so it is not this
      // chain's failure to absorb either: the remaining chains need the same
      // wallet, the same account and the same switches, and walking on would fire
      // a prompt at each one to collect a row of identical errors. Stop with the
      // untried chains still untried, name what has to be fixed, and offer RESUME.
      if(r === 'blocked'){
        S.deploy.halted = { at:k, name:S.deploy.chains[k].name, reason:S.deploy.steps[k].err || 'WALLET DECLINED' };
        break;
      }
    }
    if(!_deployLive(run)) return;
    await _finishDeploy();
  } finally { if(_deployWalkingRun === run) _deployWalkingRun = 0; }
