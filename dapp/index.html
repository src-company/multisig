  return false;
}

// H-2 (fourth review). execute() reads `threshold` into a uint16 local and then
// computes `_threshold * 65` — uint16 arithmetic, inside the function-wide
// unchecked block, so it wraps at 65536. At threshold 1009 the length check
// demands 49 bytes while the verification loop reads to offset 65,584: no sigs
// value satisfies both, so the owners' signature path is dead permanently.
// isValidSignature() and TimelockExecutor.forward() widen to uint256 first and
// are unaffected — which is what makes this an owner-lockout rather than a full
// brick, and why an attacker-held executor would become unremovable.
// Verified against solc 0.8.34's IR: wrapping_mul_t_uint16 masks with 0xffff.
const MAX_SAFE_THRESHOLD = 1008;

// M-2. Past this, a timelock stops being a review window and starts being a
// liability: every proposal that would shorten it again waits it out first.
// A month is already far beyond any operational use.
const DELAY_SANE_MAX = 30 * 24 * 60 * 60;

// H-1. forward() distinguishes "execute now" from "queue for review" only by
// signature count — ownerCount vs threshold — over one shared Execute digest.
// Where those counts coincide the distinction does not exist.
function fastPathVoidsTimelock(v) {
  return !!v && v.delay > 0 && v.ownerCount > 0 && v.ownerCount === v.threshold;
}

// Can this vault be cancelled inside its timelock window at all?
//
// Cancelling runs through TimelockExecutor.forward(), and only a
// TimelockExecutor answers that call. The accelerate path was already gated on
// this (v.fastPath is false without one) and prodSubmit's cancel-via-executor
// branch checks it — the cancel button did not, so a vault with no executor
// offered a CANCEL that could never work. With executor == address(0) the
// failure was silent and worse than useless: a contract call to an address with
// no code does not revert, it is an ordinary transaction to an empty account.
// It mined successfully, the interface said CANCELLED, and the proposal was
// recorded cancelled in the coordination database — while on chain it was still
// queued, still maturing, and executable by anyone once it did.
//
// Without an executor there is no in-window brake at all: cancelQueued is
// onlySelf, so a cancel raised as an ordinary proposal is itself queued for the
// full delay and matures no earlier than what it means to stop. Saying so is
// the honest answer; offering a button is not.
function canForwardCancel(v) {
  if(S.demoMode) return true;
  if(!v || !v.isTimelockExecutor) return false;
  const ex = v.executor;
  return !!ex && ex !== ethers.ZeroAddress && ex !== '0x0000...0000';
}

// L-2 (second review). The wallet's fallback answers the three ERC-721/1155
// receiver selectors and returns empty success for everything else instead of
// reverting. A self-call carrying a mistyped selector therefore "succeeds":
// execute() sees ok == true, emits ExecutionSuccess, burns the nonce, and
// changes nothing — and the event says it worked, so monitoring agrees. Only
// governance runs as self-calls, so this converts exactly the class of mistake
// that should be loudest into the quietest one.
let _msSelectors = null;
function isKnownMultisigSelector(sel) {
  if(!_msSelectors) {
    _msSelectors = new Set();
    msIface.forEachFunction(f => _msSelectors.add(f.selector));
    // Answered by the fallback for real, not swallowed by it.
    ['0x150b7a02','0xf23a6e61','0xbc197c81'].forEach(s => _msSelectors.add(s));
  }
  return _msSelectors.has(sel);
}

// L-2. Both singleton constructors are payable and neither contract exposes a
// withdrawal path, so ETH — or any token — that reaches the factory or the
// implementation is unrecoverable by anyone. These are plausible paste targets:
// they are printed in this UI and on every deploy receipt. Nothing built here
// is allowed to send value to one.
// The TimelockExecutor belongs here too (third review, L-04): it has no
// withdrawal path and no arbitrary-execution function of its own. Plain ETH
// bounces — it has neither `receive` nor a payable fallback — but a token
// transfer succeeds and is then stuck forever.
const NO_WITHDRAWAL = {
  [FACTORY.toLowerCase()]: 'THE MULTISIG FACTORY',
  [IMPLEMENTATION.toLowerCase()]: 'THE MULTISIG IMPLEMENTATION',
  [TIMELOCK_EXECUTOR.toLowerCase()]: 'THE TIMELOCK EXECUTOR',
  [ethers.ZeroAddress]: 'THE ZERO ADDRESS',
  '0x0000000000000000000000000000000000000001': 'THE OWNER-LIST SENTINEL',
};
function lockedDest(addr) {
  if(!ethers.isAddress(addr)) return null;
  return NO_WITHDRAWAL[addr.toLowerCase()] || null;
}

// Appendix A (deployment checklist: "bytecode matches audited build",
// "post-deploy on-chain validation"). Every vault the factory produces is the
// same 45-byte clone delegating to IMPLEMENTATION. A successful receipt does
// not prove one was produced — on a chain where the factory is absent, create()
// is a plain transfer that mines with status 1 — so read the code back and
// compare it against the audited build rather than trusting the receipt.
function expectedCloneCode(impl) {
  return ('0x5f5f365f5f37365f73' + impl.slice(2) + '5af43d5f5f3e6029573d5ffd5b3d5ff3').toLowerCase();
}
// 'clone'   — the audited implementation, byte for byte
// '7702'    — an EOA delegating to it under EIP-7702 (0xef0100 ‖ address)
// 'foreign' — code that is not this protocol's
// 'empty'   — nothing deployed;  null — the chain could not be read
async function classifyVaultCode(addr, rp) {
  let code;
  try { code = await (rp || provider).getCode(addr); } catch(_) { return null; }
  if(!code || code === '0x') return 'empty';
  code = code.toLowerCase();
  if(code === expectedCloneCode(IMPLEMENTATION)) return 'clone';
  if(code === '0xef0100' + IMPLEMENTATION.slice(2).toLowerCase()) return '7702';
  return 'foreign';
}

// I-1. executeQueued reverts NotReady(eta) for two unrelated failures: the hash
// was never queued (eta 0 — cancelled, already executed, or a stale nonce), and
// the hash is queued but its timelock has not run out. One selector, two very
// different next steps for whoever is standing at the button. Split them, and
// decode the wallet's other custom errors while we are here.
function decodeMultisigError(e) {
  const data = e?.data ?? e?.info?.error?.data ?? e?.error?.data ?? e?.cause?.data;
  if(typeof data !== 'string' || !data.startsWith('0x') || data.length < 10) return null;
  let parsed = null;
  try { parsed = msIface.parseError(data); } catch(_) { return null; }
  if(!parsed) return null;
  if(parsed.name === 'NotReady') {
    const eta = Number(parsed.args[0]);
    if(!eta) return 'NOT QUEUED — NO SUCH ENTRY IN THE VAULT’S QUEUE. IT WAS CANCELLED, ALREADY EXECUTED, OR CARRIES A DIFFERENT NONCE.';
    const left = eta - Math.floor(Date.now() / 1000);
    return left > 0 ? `TIMELOCK NOT ELAPSED — ${fmtDelay(left)} LEFT` : 'TIMELOCK NOT ELAPSED';
  }
  if(parsed.name === 'InvalidSig') return 'INVALID SIGNATURES — WRONG SIGNERS, WRONG ORDER, OR A STALE NONCE';
  if(parsed.name === 'Unauthorized') return 'UNAUTHORIZED — THIS CALL HAS TO COME FROM THE VAULT ITSELF';
  if(parsed.name === 'InvalidConfig') return 'INVALID CONFIG — THE VAULT REJECTED THESE PARAMETERS';
  return null;
}
// Every catch that reports a failed vault call goes through here, so the split
// above reaches the user rather than stopping at the console.
function msErr(e, fallback) {
  return decodeMultisigError(e) || e?.shortMessage || e?.message || fallback;
}

const ERC20_ABI = [
  'function transfer(address to, uint256 amount) returns (bool)',
  'function balanceOf(address) view returns (uint256)',
  'function decimals() view returns (uint8)',
  'function symbol() view returns (string)',
  'function allowance(address owner, address spender) view returns (uint256)',
  'function approve(address spender, uint256 amount) returns (bool)',
];
const erc20Iface = new ethers.Interface(ERC20_ABI);

// ── SAFE (Gnosis Safe) ────────────────────────────────────────────
// Read-only, and only the two getters every Safe version has ever exposed, so
// the CREATE page can copy an existing Safe's signer set into a new timelocked
// vault. VERSION() is a nicety — pre-1.1 Safes lack it, so it stays optional.
const SAFE_ABI = [
  'function getOwners() view returns (address[])',
  'function getThreshold() view returns (uint256)',
  'function VERSION() view returns (string)',
];

// ── STAKE: ETH → wstETH via Lido (Ethereum mainnet only) ──────────
// https://etherscan.io/address/0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0
// wstETH's receive() fallback submits the incoming ETH to Lido and mints the
// resulting wstETH straight back to the sender. So the whole integration is a
// plain value transfer from the vault: no approval, no router, no calldata to
// get wrong — which is exactly what makes it safe to offer as a one-field tab.
const WSTETH_ADDRESS = '0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0';
const WSTETH_ABI = ['function stEthPerToken() view returns (uint256)'];
const STAKE_CHAIN_ID = 1;
function stakeAvailable(){ return !S.demoMode && S.chainId === STAKE_CHAIN_ID; }
// A queued proposal is a stake when it sends ETH to wstETH with empty calldata.
// Derived from the call itself, so proposals made elsewhere are flagged too.
function isStakeCall(target, callData){
  return !!target && target.toLowerCase() === WSTETH_ADDRESS.toLowerCase()
    && (!callData || callData === '0x');
}
// stETH per wstETH, 1e18-scaled. Cached per page load: it drifts with rewards,
// far slower than anything the user does inside one visit to the builder.
// The in-flight promise is held as well as the result: renderTxBuilder kicks
// this off whenever the STAKE tab paints with no rate yet, and that is every
// render — a poll tick, a keystroke echo, an overlay opening. Without the
// guard, one slow (or failing) read became a new RPC call per frame.
let _stEthPerToken = null, _stakeRatePromise = null, _stakeRateRetryAt = 0;
async function loadStakeRate(){
  if(!stakeAvailable() || _stEthPerToken != null) return _stEthPerToken;
  if(_stakeRatePromise) return _stakeRatePromise;
  if(Date.now() < _stakeRateRetryAt) return null;   // a read just failed — back off
  _stakeRatePromise = (async () => {
    try {
      const c = new ethers.Contract(WSTETH_ADDRESS, WSTETH_ABI, provider);
      _stEthPerToken = BigInt(await c.stEthPerToken());
      render();
    } catch(_) {
      // Leave the rate null so a later visit retries — just not every frame.
      _stakeRateRetryAt = Date.now() + 15000;
    } finally { _stakeRatePromise = null; }
    return _stEthPerToken;
  })();
  return _stakeRatePromise;
}
// wstETH minted for an ETH amount at the current rate. Lido's submit() is 1:1
// ETH→stETH, so the wrap rate is the only conversion. An estimate by nature —
// the rate that settles is the one at execution, after the timelock.
function wstethOut(ethAmountStr){
  if(!_stEthPerToken || _stEthPerToken === 0n) return null;
  try {
    const wei = ethers.parseEther(stripCommas(String(ethAmountStr || '')));
    if(wei <= 0n) return null;
    return (wei * (10n ** 18n)) / _stEthPerToken;
  } catch(_) { return null; }
}

// ── SLOW: time-delayed transfer protocol (Ethereum mainnet only) ──
// https://etherscan.io/address/0x000000000000888741b254d37e1b27128afeaabc
// A deposit locks funds in an ERC-1155 wrapper minted to the recipient; the
// recipient can only unlock/claim once `delay` seconds have elapsed, and the
// depositor (the vault) can `reverse` any time before the timer expires. ETH is
// the zero-address sentinel with amount carried in msg.value; ERC20 requires a
// prior approve of `amount` to the SLOW contract (batched atomically below).
const SLOW_ADDRESS = '0x000000000000888741b254d37e1b27128afeaabc';
const SLOW_ABI = [
  'function depositTo(address token, address to, uint256 amount, uint96 delay, bytes data) payable returns (uint256)',
  'function reverse(uint256 transferId)',
  'function withdrawFrom(address from, address to, uint256 id, uint256 amount)',
  'function canReverseTransfer(uint256 transferId) view returns (bool, bytes4)',
  'function getOutboundTransfers(address user) view returns (uint256[])',
  'function pendingTransfers(uint256) view returns (uint96 timestamp, address from, address to, uint256 id, uint256 amount)',
];
const slowIface = new ethers.Interface(SLOW_ABI);

// ── WNS / GNS ─────────────────────────────────────────────────────
// GNS (.gwei) is a direct fork of WNS (.wei): same ABI, same NameNFT calls,
// also on mainnet. Both are registered below and resolved identically; the
// only asymmetry is preference order — .wei wins when an address has both.
const WEINS = '0x0000000000696760E15f265e828DB644A0c242EB';
const GWEINS = '0x9D51D507BC7264d4fE8Ad1cf7Fe191933A0a81d6';
const WEINS_ABI = [
  'function computeId(string) pure returns (uint256)',
  // Canonical forward resolution: inactive/expired -> 0; explicitly-set
  // recipient address if any; otherwise the current owner. Use this rather
  // than ownerOf so a name pointed at a different address resolves correctly.
  'function resolve(uint256) view returns (address)',
  'function reverseResolve(address) view returns (string)',
  // Reverse resolution is opt-in and set by the holder: this is the call that
  // makes reverseResolve(holder) answer with a name the holder owns.
  'function setPrimaryName(uint256)',
];
const weinsIface = new ethers.Interface(WEINS_ABI);
// Preference order for reverse resolution — .wei first, .gwei as fallback.
const NAME_SERVICES = [
  { suffix: '.wei',  addr: WEINS },
  { suffix: '.gwei', addr: GWEINS },
];
// One matcher for every name we accept, so the field hints, the validators and
// the resolvers can never drift apart. '.gwei' does not end in '.wei', so the
// suffixes stay unambiguous.
const NAME_RE = /\.(eth|g?wei)$/i;
// The subset of those a link may be built on. A deep link is resolved with no
// operator watching and no field to type a correction into, so it takes only
// names that answer from one mainnet contract in two calls: WNS and its .gwei
// fork. ENS is excluded deliberately — a .eth name may resolve through an
// offchain gateway (ENSIP-10) that can be down, blocked, or simply slow, and a
// vault link that opens on some networks and not others is worse than one that
// always spells its address out. `<label>.id.wei` is the shape this app mints,
// but the matcher is the whole namespace: a vault holding a plain .wei name
// bought elsewhere should be reachable by it on the same terms. At least one
// label in front of the suffix, so a bare `.wei` is not a link to anything.
const WNS_NAME_RE = /^[a-z0-9_-]+(?:\.[a-z0-9_-]+)*\.g?wei$/i;
function nsFor(name) {
  const v = name.toLowerCase();
  return NAME_SERVICES.find(s => v.endsWith(s.suffix)) || null;
}

// ── WNS · FREE id.wei IDENTITY ────────────────────────────────────
// A vault with no name is forty-two hex characters in every wallet, every
// explorer and every co-signer's chat window, and the only way to tell two of
// them apart is to read the middle. WNS sells .wei names, but the `id.wei` node
// runs a subdomain registrar that mints `<label>.id.wei` for nothing — no
// fee, no commit/reveal, no renewal — so a vault can carry a name a human reads
// from the block it is deployed in.
//
// Two calls, and both have to be made BY the vault, or the name lands on
// whoever paid the gas instead of on the wallet it is supposed to identify:
//
//   registrar.register(namehash('id.wei'), label)  mints <label>.id.wei to msg.sender
//   WNS.setPrimaryName(id)                         makes reverseResolve(vault) answer with it
//
// They are separable and they do different things. The first makes the name
// resolve TO the vault; only the second makes the vault answer WITH the name,
// which is the direction this interface (and everything else reading WNS) uses
// to put a name beside an address. Claiming without the second leaves a name
// that works in one direction only, so both are offered together.
const WNS_ID_REGISTRAR = '0x53745292f0d30d68204a63002C17bDa16C772bf7';
// namehash('id.wei'). Hard-coded rather than computed from a string, because it
// is the single argument that decides which namespace a name is claimed in —
// deriving it would let a typo mint under a node nobody checked.
const WNS_ID_PARENT = '0xcea9efa56b7c8a673303d04b917a7119a2a68f8c4803d8e6fd1c3a1f0d2e4ebe';
const WNS_ID_SUFFIX = '.id.wei';
// WNS lives on mainnet only. Every other chain this app deploys to has no code
// at either address, where a call is not an error — it succeeds, mints nothing
// and returns nothing. So the offer is gated on chain 1 rather than attempted
// everywhere and silently lost on six of seven chains.
const WNS_CHAIN_ID = 1;
const wnsRegIface = new ethers.Interface([
  'function register(uint256 parentId, string label) payable returns (uint256)',
]);
// NotAvailable() — the registrar's single refusal. It covers both "that name is
// taken" and "that label is not legal", so a revert carrying it is not by
// itself a reason to tell someone their name is spelled wrong.
const WNS_NOT_AVAILABLE = '0xd9b91419';
// A stand-in sender for availability probes made before there is a real one —
// the create form asks about a name for a vault that does not exist yet, and
// with no sender at all the probe reverts on the mint rather than on the name.
// Any address with no code answers identically, and availability itself does
// not depend on who asks — only the mint's receiver check does, and a codeless
// address passes it the same way the deployer's wallet would.
const WNS_PROBE_FROM = '0x0000000000000000000000000000000000000001';

// The registrar lowercases the label byte-wise before hashing, which is ASCII
// lowercasing and not String.prototype.toLowerCase — the latter also folds
// non-ASCII (É → é) and would compute an id the contract never will.
function asciiLower(s){ return String(s == null ? '' : s).replace(/[A-Z]/g, c => c.toLowerCase()); }

// The token id of `<label>.id.wei`. WNS ids are ENS namehashes, so this is
// keccak(parent ‖ keccak(label)) and needs no RPC — which is the point:
// setPrimaryName has to be pointed at the name in the same transaction that
// mints it, before the name exists anywhere to be looked up.
function wnsSubId(label) {
  return BigInt(ethers.keccak256(ethers.concat([
    WNS_ID_PARENT, ethers.keccak256(ethers.toUtf8Bytes(asciiLower(label))),
  ])));
}
function wnsFullName(label){ return asciiLower(label) + WNS_ID_SUFFIX; }

// What this interface will claim, which is deliberately narrower than what the
// registrar will mint. The contract refuses only an empty label, one holding a
// dot or any byte at or below 0x20, and one with a hyphen at either end —
// everything else is a legal name, including a zero-width space, a non-breaking
// space, and Latin and Cyrillic letters in the same word. A name exists to be
// read by a human deciding whether to sign something, so a label that can be
// drawn to look like a different label is worse than no label at all. Latin
// letters, digits, hyphen and underscore, and never a hyphen on the edge.
const WNS_LABEL_RE = /^[a-z0-9](?:[a-z0-9_-]*[a-z0-9_])?$/;
// Not a contract limit — the registrar takes any length. It is the length past
// which a name stops being readable in the places names are read: a queue row,
// a badge, a wallet's address book.
const WNS_LABEL_MAX = 63;
function wnsLabelValid(label){
  const l = String(label || '');
  return l.length > 0 && l.length <= WNS_LABEL_MAX && WNS_LABEL_RE.test(l);
}
// A vault name is free text; a label is not. Fold one into the other rather
// than making the operator type the same thing twice — and show them the
// result, because what gets claimed is the fold, not what they typed.
function wnsSlug(name) {
  return String(name || '')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')   // café → cafe
    .toLowerCase()
    .replace(/[^a-z0-9_]+/g, '-')
    .replace(/^[-_]+/, '').replace(/-+$/, '')
    .slice(0, WNS_LABEL_MAX)
    .replace(/-+$/, '');
}

// Is `<label>.id.wei` free, and if not, who holds it?
//
// Availability is asked of the registrar by static call to the exact function
// that would run, rather than inferred from a resolve() that returns zero both
// for names nobody owns and for names that exist but point nowhere. A dry-run
// of the real call is the only answer that cannot disagree with the
// transaction. `free` is true, false, or null — null meaning mainnet would not
// answer, which is not the same as taken and must never be shown as one.
//
// The holder is read alongside it because "taken" and "taken by the vault you
// are standing in" are different situations with different remedies: the first
// is a dead end, the second means the mint already happened and only the
// reverse record is missing.
//
// `from` is not optional in practice and is not a formality. The registrar
// mints with _safeMint, so the call reverts TransferToZeroAddress() with no
// sender at all, and TransferToNonERC721ReceiverImplementer() when the sender
// is a contract with no onERC721Received — which is a real answer, not noise:
// asking as the vault that will make the call is how "this vault cannot hold
// this name" gets found here rather than on execution. Availability itself is
// the same for every caller; only the receiver check is not.
async function wnsLookup(label, from) {
  if(!wnsLabelValid(label)) return { free:false, holder:null };
  const lab = asciiLower(label);
  const rpc = mainnetRpc();
  const [availR, holderR] = await Promise.allSettled([
    _nameRace(rpc.call({ to: WNS_ID_REGISTRAR, from: from || WNS_PROBE_FROM,
      data: wnsRegIface.encodeFunctionData('register', [BigInt(WNS_ID_PARENT), lab]) })),
    _nameRace(rpc.call({ to: WEINS,
      data: weinsIface.encodeFunctionData('resolve', [wnsSubId(lab)]) })),
  ]);
  let free = null;
  if(availR.status === 'fulfilled') free = true;
  else {
    const e = availR.reason;
    const d = e && (e.data || (e.info && e.info.error && e.info.error.data));
    if(typeof d === 'string' && d.toLowerCase().startsWith(WNS_NOT_AVAILABLE)) free = false;
    else console.error('wns availability:', e);
  }
  let holder = null;
  if(holderR.status === 'fulfilled') {
    try {
      const a = weinsIface.decodeFunctionResult('resolve', holderR.value)[0];
      if(a && a !== ethers.ZeroAddress) holder = a;
    } catch(_) {}
  }
  return { free, holder };
}
// The deploy path only ever needs the yes/no.
async function wnsAvailable(label, from){ return (await wnsLookup(label, from)).free; }

// The two calls, in the order they have to run, ready for a factory init-call
// list or a multisig batch. `primary` is separable because a vault that already
// holds its name only needs the second one.
function wnsClaimCalls(label, { primary = true, registerToo = true } = {}) {
  const id = wnsSubId(label);
  const calls = [];
  if(registerToo) calls.push({ target: WNS_ID_REGISTRAR, value: 0n,
    data: wnsRegIface.encodeFunctionData('register', [BigInt(WNS_ID_PARENT), asciiLower(label)]) });
  if(primary) calls.push({ target: WEINS, value: 0n,
    data: weinsIface.encodeFunctionData('setPrimaryName', [id]) });
  return calls;
}

// Availability, memoised and repainted when it lands, so that a form which
// re-derives its slug on every render does not spend a mainnet round trip on
// every render. Returns { state, holder }, state being one of:
//   'invalid' | 'checking' | 'free' | 'taken' | 'unknown'
//
// Keyed on the asking address as well as the name, because half the answer is
// the asker's property and not the name's: the same free name is claimable by
// a wallet that can hold an ERC721 and not by one that cannot.
//
// A lookup mainnet would not answer is recorded as 'unknown' rather than
// dropped, because dropping it would have every subsequent render fire the
// same failing call again — a poll loop against a backend already struggling.
// It is retried on demand instead, the way an owner name that would not
// resolve is.
function wnsAvKey(label, from){ return asciiLower(label) + '@' + String(from || WNS_PROBE_FROM).toLowerCase(); }
function wnsAvState(label, from){
  if(!wnsLabelValid(label)) return { state:'invalid', holder:null };
  const k = wnsAvKey(label, from);
  if(S.wnsAv[k] !== undefined) return S.wnsAv[k];
  S.wnsAv[k] = { state:'checking', holder:null };
  wnsLookup(label, from).then(r => {
    S.wnsAv[k] = { state: r.free === true ? 'free' : r.free === false ? 'taken' : 'unknown', holder: r.holder };
    render();
  });
  return S.wnsAv[k];
}
function retryWnsAv(label, from){ delete S.wnsAv[wnsAvKey(label, from)]; render(); }

// Read a batch back and decide whether it is the identity pair above — the one
// this app builds — or merely two calls that happen to hit the same contracts.
// The check that matters is the last one: setPrimaryName takes an id, not a
// name, and an id is a one-way hash, so a batch whose reverse record points at
// some *other* name would read exactly like this one in a queue row. Comparing
// it against the id of the label being minted is the only way to know that the
// name shown and the name set are the same name.
// Returns { label, full, primary } or null.
function wnsIdentityBatch(targets, values, datas) {
  if(!targets || targets.length < 1 || targets.length > 2) return null;
  if(values.some(v => BigInt(v) !== 0n)) return null;
  if(selOf(datas[0]) !== SEL.wnsRegister) return null;
  if(String(targets[0]).toLowerCase() !== WNS_ID_REGISTRAR.toLowerCase()) return null;
  let d; try { d = wnsRegIface.decodeFunctionData('register', datas[0]); } catch(_) { return null; }
  if(BigInt(d[0]) !== BigInt(WNS_ID_PARENT)) return null;
  const label = asciiLower(d[1]);
  if(targets.length === 1) return { label, full: label + WNS_ID_SUFFIX, primary: false };
  if(selOf(datas[1]) !== SEL.wnsSetPrimary) return null;
  if(String(targets[1]).toLowerCase() !== WEINS.toLowerCase()) return null;
  let p; try { p = weinsIface.decodeFunctionData('setPrimaryName', datas[1]); } catch(_) { return null; }
  if(BigInt(p[0]) !== wnsSubId(label)) return null;
  return { label, full: label + WNS_ID_SUFFIX, primary: true };
}

// ── SELECTORS ─────────────────────────────────────────────────────
// Every 4-byte selector this interface compares against, resolved once at load.
// They were being recomputed through iface.getFunction(name).selector on each
// comparison, which put a dozen ABI lookups inside txKind() — a function the
// dashboard runs for every queued proposal on every render.
const SEL = {
  transfer:      erc20Iface.getFunction('transfer').selector,
  approve:       erc20Iface.getFunction('approve').selector,
  addOwner:      msIface.getFunction('addOwner').selector,
  removeOwner:   msIface.getFunction('removeOwner').selector,
  setThreshold:  msIface.getFunction('setThreshold').selector,
  setDelay:      msIface.getFunction('setDelay').selector,
  setExecutor:   msIface.getFunction('setExecutor').selector,
  cancelQueued:  msIface.getFunction('cancelQueued').selector,
  executeQueued: msIface.getFunction('executeQueued').selector,
  batch:         msIface.getFunction('batch').selector,
  delegateCall:  msIface.getFunction('delegateCall').selector,
  enableForward: tlIface.getFunction('enableForward').selector,
  depositTo:     slowIface.getFunction('depositTo').selector,
  wnsRegister:   wnsRegIface.getFunction('register').selector,
  wnsSetPrimary: weinsIface.getFunction('setPrimaryName').selector,
};
// The leading 4 bytes of `callData`, but only when they really are 4 bytes of
// hex. `call_data` reaches this interface from a row anyone can write, so a
// selector is untrusted text until it has been shaped — and it is interpolated
// into labels and notes that are emitted as HTML. Anything else reads as "no
// selector", which every caller already handles.
const SEL_RE = /^0x[0-9a-fA-F]{8}$/;
function selOf(callData) {
  if(typeof callData !== 'string' || callData.length < 10) return '';
  const s = callData.slice(0, 10);
  return SEL_RE.test(s) ? s.toLowerCase() : '';
}

const SLOW_CHAIN_ID = 1;
const SLOW_PRESETS = [
  { s: 3600,    l: '1H'  }, { s: 21600,  l: '6H'  }, { s: 86400,   l: '1D'  },
  { s: 259200,  l: '3D'  }, { s: 604800, l: '7D'  }, { s: 2592000, l: '30D' },
];
function slowAvailable(){ return !S.demoMode && S.chainId === SLOW_CHAIN_ID; }
function fmtDelay(sec){
  sec = Number(sec) || 0;
  if(sec >= 86400 && sec % 86400 === 0){ const d = sec / 86400; return d + ' DAY'  + (d > 1 ? 'S' : ''); }
  if(sec >= 3600  && sec % 3600  === 0){ const h = sec / 3600;  return h + ' HOUR' + (h > 1 ? 'S' : ''); }
  const m = Math.max(1, Math.round(sec / 60)); return m + ' MIN' + (m > 1 ? 'S' : '');
}
// Abstracts SLOW calldata construction for an outbound transfer. Returns the
// same {target,value,data,desc} shape a plain transfer produces, so callers stay
// agnostic to the delivery mode. For ERC20 it reads the vault's live allowance
// and, only when short, prepends an approve as a multisig `batch` so the approve
// and deposit settle atomically in one proposal.
async function buildSlowOutbound({ tokenInfo, toAddr, amountRaw, delaySec, vaultAddr }){
  const delay  = BigInt(delaySec);
  const dLabel = fmtDelay(delaySec);
  if(tokenInfo.address === ethers.ZeroAddress){
    // ETH: token=address(0), amount=0 (SLOW overwrites it with msg.value).
    const data = slowIface.encodeFunctionData('depositTo', [ethers.ZeroAddress, toAddr, 0n, delay, '0x']);
    return { target: SLOW_ADDRESS, value: amountRaw.toString(), data,
      desc: `SLOW ${dLabel} · ETH → ${toAddr.slice(0,8)}...` };
  }
  const token = tokenInfo.address;
  const depositData = slowIface.encodeFunctionData('depositTo', [token, toAddr, amountRaw, delay, '0x']);
  let allowance = 0n;
  try {
    const erc = new ethers.Contract(token, ERC20_ABI, provider);
    allowance = BigInt(await erc.allowance(vaultAddr, SLOW_ADDRESS));
  } catch(_){}
  if(allowance >= amountRaw){
    // Allowance already covers it — single call to SLOW. (SLOW pulls exactly
    // `amount`, so a standing allowance to it is normally 0 and this is the
    // rare path; when set, deposit consumes it fully.)
    return { target: SLOW_ADDRESS, value: '0', data: depositData,
      desc: `SLOW ${dLabel} · ${tokenInfo.symbol} → ${toAddr.slice(0,8)}...` };
  }
  // Insufficient allowance: approve(exact) + deposit, atomic via multisig batch.
  const approveData = erc20Iface.encodeFunctionData('approve', [SLOW_ADDRESS, amountRaw]);
  const batchData = msIface.encodeFunctionData('batch', [[token, SLOW_ADDRESS], [0n, 0n], [approveData, depositData]]);
  return { target: vaultAddr, value: '0', data: batchData, batched: true,
    desc: `SLOW ${dLabel} · APPROVE + ${tokenInfo.symbol} → ${toAddr.slice(0,8)}...` };
}

// Human "2D 5H" / "3H 12M" remaining-time label.
function fmtRemaining(sec){
  sec = Math.max(0, Math.floor(sec));
  if(sec <= 0) return 'EXPIRED';
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  if(d > 0) return `${d}D ${h}H`;
  if(h > 0) return `${h}H ${m}M`;
  if(m > 0) return `${m}M`;
  return `${sec}S`;
}
// Raw base-unit amount -> trimmed decimal string.
function fmtAmount(raw, decimals){
  try {
    let s = ethers.formatUnits(raw, decimals);
    if(s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  } catch(_){ return String(raw); }
}
// Resolve a SLOW-encoded token to {symbol,decimals}: ETH sentinel, then the
// mainnet built-in list, then an on-chain lookup as a last resort.
async function _slowTokenMeta(token){
  if(token === ethers.ZeroAddress) return { symbol: 'ETH', decimals: 18 };
  const known = (PROD_TOKENS[SLOW_CHAIN_ID] || []).find(t => t.address.toLowerCase() === token.toLowerCase());
  if(known) return { symbol: known.symbol, decimals: known.decimals };
  try { const m = await fetchTokenMeta(token); return { symbol: m.symbol, decimals: m.decimals }; }
  catch(_){ return { symbol: token.slice(0,6) + '…' + token.slice(-4), decimals: 18 }; }
}
// Read the vault's outstanding outbound SLOW transfers straight from the
// protocol's own enumeration (getOutboundTransfers -> pendingTransfers). Cleared
// entries return a zeroed struct (timestamp==0) and are filtered out. One
// multicall batches every pendingTransfers read; token metadata is resolved once
// per distinct asset. Returns [] off-mainnet or on any read failure.
async function loadSlowOutbound(vaultAddr){
  if(S.chainId !== SLOW_CHAIN_ID || !vaultAddr) return [];
  try {
    const slow = new ethers.Contract(SLOW_ADDRESS, SLOW_ABI, provider);
    const ids = await slow.getOutboundTransfers(vaultAddr);
    if(!ids || !ids.length) return [];
    const calls = ids.map(id => ({ target: SLOW_ADDRESS, allowFailure: true, callData: slowIface.encodeFunctionData('pendingTransfers', [id]) }));
    const res = await getMC3().aggregate3(calls);
    const rows = [];
    res.forEach((r, i) => {
      if(!r?.success) return;
      let d; try { d = slowIface.decodeFunctionResult('pendingTransfers', r.returnData); } catch(_){ return; }
      const timestamp = Number(d.timestamp);
      if(!timestamp) return; // reversed / claimed / never existed
      const idBig = BigInt(d.id);
      const token = ethers.getAddress('0x' + (idBig & ((1n << 160n) - 1n)).toString(16).padStart(40, '0'));
      const delay = Number(idBig >> 160n);
      rows.push({ transferId: ids[i].toString(), rawId: idBig.toString(), to: d.to,
        token, delay, timestamp, unlockAt: timestamp + delay, amount: d.amount.toString() });
    });
    const metas = {};
    await Promise.all([...new Set(rows.map(r => r.token))].map(async t => { metas[t] = await _slowTokenMeta(t); }));
    rows.forEach(r => { const m = metas[r.token] || { symbol: '?', decimals: 18 }; r.symbol = m.symbol; r.decimals = m.decimals; });
    rows.sort((a, b) => a.unlockAt - b.unlockAt); // soonest to unlock (least reverse-time) first
    return rows;
  } catch(e){ console.error('loadSlowOutbound:', e); return []; }
}
// Panel listing outstanding outbound SLOW transfers with a REVERSE action.
function renderSlowOutbound(v, mob){
  if(S.demoMode || S.chainId !== SLOW_CHAIN_ID) return '';
  const rows = v.slowOut || [];
  if(!rows.length) return '';
  const now = NOW();
  const items = rows.map(r => {
    const remaining = r.unlockAt - now;
    const reversible = remaining > 0;
    // A reverse proposal that must clear a timelock may miss the reverse window.
    const tight = reversible && v.delay > 0 && !v.fastPath && remaining < v.delay;
    const amtStr = fmtAmount(r.amount, r.decimals);
    const toShort = r.to.slice(0,6) + '…' + r.to.slice(-4);
    const timeLabel = reversible
      ? `<span class="slow-eta" data-slow-unlock="${r.unlockAt}" style="color:var(--a)">UNLOCKS IN ${fmtRemaining(remaining)}</span>${tight?`<span style="color:var(--y);margin-left:8px" title="This vault's timelock (${fmtD(v.delay)}) is longer than the time left to reverse — a reverse proposal may expire before it can execute. Use the fast path if all owners sign.">&#9888; MAY MISS WINDOW</span>`:''}`
      : `<span style="color:var(--d)">UNLOCKED · NO LONGER REVERSIBLE</span>`;
    const btn = reversible
      ? `<button class="btn btn-outline btn-sm" onclick="proposeSlowReverse(${S.sel},'${r.transferId}')" title="Propose to cancel this SLOW transfer and return the funds to the vault (reverse + withdraw, atomic)">REVERSE</button>`
      : '';
    return `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--ln)">
      <span style="display:inline-flex;align-items:center;gap:6px;font-weight:600">${tokIcon(r.symbol,'sm')} ${esc(amtStr)} ${esc(r.symbol)}</span>
      <span style="color:var(--d);font-size:11px">&rarr; ${esc(toShort)}${copyBtn(r.to)}</span>
      <span style="font-size:10px;letter-spacing:1px;margin-left:auto">${timeLabel}</span>
      ${btn}
    </div>`;
  }).join('');
  return `<div class="sec" style="margin-top:24px"><span>SLOW · OUTBOUND</span><span class="line"></span></div>
    <div style="font-size:10px;color:var(--d);letter-spacing:1px;line-height:1.5;margin:-4px 0 8px">TIME-LOCKED TRANSFERS THIS VAULT HAS SENT. REVERSE CANCELS ONE AND RETURNS THE FUNDS TO THE VAULT BEFORE ITS TIMER EXPIRES &mdash; PROPOSED &amp; APPROVED (${v.threshold}/${v.ownerCount}) LIKE ANY OUTBOUND TX.</div>
    ${items}`;
}
// Atomic cancel: reverse(transferId) + withdrawFrom(vault, vault, id, amount),
// batched so the pending SLOW transfer is undone and the underlying asset is
// returned to the vault in a single proposal. Reverse only works before expiry.
async function prodReverseSlow(vi, transferId){
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi]; if(!v) return;
  if(S.chainId !== SLOW_CHAIN_ID){ flash('SLOW IS MAINNET-ONLY'); return; }
  const entry = (v.slowOut || []).find(t => t.transferId === transferId);
  if(!entry){ flash('TRANSFER NOT FOUND — REFRESH'); return; }
  if(entry.unlockAt <= NOW()){ flash('TIMELOCK EXPIRED — CAN NO LONGER REVERSE'); return; }
  try {
    const reverseData  = slowIface.encodeFunctionData('reverse', [transferId]);
    const withdrawData = slowIface.encodeFunctionData('withdrawFrom', [v.address, v.address, entry.rawId, entry.amount]);
    const batchData = msIface.encodeFunctionData('batch', [[SLOW_ADDRESS, SLOW_ADDRESS], [0n, 0n], [reverseData, withdrawData]]);
    const target = v.address, value = '0';

    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target, value: 0n, data: batchData, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);
    const desc = `REVERSE SLOW · ${fmtAmount(entry.amount, entry.decimals)} ${entry.symbol} ↩ VAULT`;

    if(v.dbId){
      const txId = await dbProposeTx(v.dbId, nonce, target, value, batchData, txHash, v.threshold, connectedAddress, desc);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }
    flash(`REVERSE TX #${nonce} CREATED`);
    await reloadQueue(vi);
  } catch(e){ console.error(e); flash(e.shortMessage || e.message || 'FAILED'); }
}
function proposeSlowReverse(vi, transferId){ guardSubmit(prodReverseSlow)(vi, transferId); }

function customTokensFor(chainId, addr){
  if(!addr) return [];
  try { const v = JSON.parse(lsGet(_ctokKey(chainId, addr)) || '[]'); return Array.isArray(v) ? v : []; } catch(_) { return []; }
}
// Persist a custom token against the vault it was added for. Returns whether
// the token is on disk afterwards: without a vault address there is no key we
// could ever read back, and localStorage can refuse the write outright (quota,
// private browsing). Both cases used to be swallowed, so the token survived
// until the next reload and then silently vanished — callers now report it.
function saveCustomToken(chainId, addr, tok){
  if(!addr) return false;
  const list = customTokensFor(chainId, addr);
  if(list.some(t => t.address.toLowerCase() === tok.address.toLowerCase())) return true;
  list.push({ address: tok.address, symbol: tok.symbol, decimals: tok.decimals });
  try {
    localStorage.setItem(_ctokKey(chainId, addr), JSON.stringify(list));
    return customTokensFor(chainId, addr).some(t => t.address.toLowerCase() === tok.address.toLowerCase());
  } catch(_) { return false; }
}
// Parse a pasted token address. An all-lower or all-upper string carries no
// EIP-55 checksum to violate, so accept and normalise it; a mixed-case string
// does, and a mismatch there is a real typo worth naming.
function parseTokenAddr(raw){
  const t = (raw || '').trim();
  if(!/^0x[0-9a-fA-F]{40}$/.test(t)) return { err: 'ENTER A VALID TOKEN ADDRESS' };
  const body = t.slice(2);
  if(/[a-f]/.test(body) && /[A-F]/.test(body) && !ethers.isAddress(t))
    return { err: 'BAD CHECKSUM — RE-COPY THE ADDRESS' };
  try { return { addr: ethers.getAddress(t.toLowerCase()) }; }
  catch(_) { return { err: 'ENTER A VALID TOKEN ADDRESS' }; }
}
function removeCustomToken(chainId, addr, tokenAddr){
  const list = customTokensFor(chainId, addr).filter(t => t.address.toLowerCase() !== tokenAddr.toLowerCase());
  try { localStorage.setItem(_ctokKey(chainId, addr), JSON.stringify(list)); } catch(_){}
}
// Decode an ERC-20 symbol() result: string first, then bytes32 (old tokens
// like MKR return a fixed bytes32 instead of a string).
function _decodeSymbol(returnData){
  if(!returnData || returnData === '0x') return null;
  try { const s = erc20Iface.decodeFunctionResult('symbol', returnData)[0]; if(s && String(s).trim()) return String(s).trim(); } catch(_){}
  try { const s = ethers.decodeBytes32String(returnData); if(s && s.trim()) return s.trim(); } catch(_){}
  return null;
}
// Fetch {address, symbol, decimals} for an ERC-20; throws if it isn't one.
async function fetchTokenMeta(address){
  const addr = ethers.getAddress(address);
  const res = await getMC3().aggregate3([
    { target: addr, allowFailure: true, callData: erc20Iface.encodeFunctionData('symbol') },
    { target: addr, allowFailure: true, callData: erc20Iface.encodeFunctionData('decimals') },
  ]);
  let symbol = null, decimals = null;
  if(res[0]?.success) symbol = _decodeSymbol(res[0].returnData);
  if(res[1]?.success){ try { decimals = Number(erc20Iface.decodeFunctionResult('decimals', res[1].returnData)[0]); } catch(_){} }
  if(decimals == null || isNaN(decimals) || decimals < 0 || decimals > 36) throw new Error('NOT AN ERC-20 TOKEN');
  // symbol() is attacker-chosen text that then labels a pill, a ticker and a
  // proposal line. Strip control characters and bidi overrides (which can make
  // one symbol render as another), and cap the length — a ticker is a ticker,
  // and an unbounded one wraps every pill row it lands in.
  const clean = String(symbol || '')
    .replace(/[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u2028\u2029\u202A-\u202E\u2066-\u2069]/g, '')
    // Markup characters go the same way. Every render site escapes, so this is
    // belt and braces — but the symbol is persisted to localStorage and read
    // back into a dozen templates, and no real ticker has ever held a `<`.
    .replace(/[<>"'&`\\]/g, '')
    .trim().slice(0, 12);
  return { address: addr, symbol: clean || (addr.slice(0,6)+'…'+addr.slice(-4)), decimals };
}
// Effective token list for a vault: built-ins + its saved custom tokens.
function vaultTokens(v){
  const base = PROD_TOKENS[S.chainId] || ETH_ONLY;
  if(S.demoMode || !v || !v.address) return base;
  const seen = new Set(base.map(t => t.address.toLowerCase()));
  const custom = customTokensFor(S.chainId, v.address)
    .filter(t => !seen.has(t.address.toLowerCase()))
    .map(t => ({ symbol: t.symbol, address: t.address, decimals: t.decimals, icon: iconForSym(t.symbol), custom: true }));
  return [...base, ...custom];
}
// The currently-selected transfer token, resolved to {symbol,address,decimals}.
function curTok(v){
  if(!S.demoMode){
    const t = vaultTokens(v).find(t => t.symbol === S.txToken);
    if(t) return t;
  }
  return { symbol: S.txToken, address: S.txToken === 'ETH' ? ethers.ZeroAddress : '', decimals: DECIMALS[S.txToken] || 18, icon: iconForSym(S.txToken) };
}

// ── DATABASE (self-hosted PostgREST) ──────────────────────────────
// Minimal PostgREST client — a small fluent query builder covering just
// what this app uses (.from/.select/.eq/.in/.order/.limit/.maybeSingle
// and .rpc), so the db* helpers below stay compact.
// Every request runs as the `anon` role: no Authorization header is
// sent (matches roles.sql). Reads are RLS-gated SELECTs; writes go
// through the SECURITY DEFINER functions via .rpc().
const PGRST_URL = 'https://multisig-postgrest.onrender.com'; // ← set to your Render PostgREST URL

// Resilient fetch: per-attempt timeout + bounded retry with exponential
// backoff + jitter. Render's PostgREST can cold-start or return transient
// 5xx/429; the DB is the ONLY store for off-chain proposals & signatures,
// so a single dropped write loses coordination state. Retrying network
// errors and transient statuses turns those blips into non-events.
// Only idempotent-or-self-healing operations flow through here: reads,
// upserts (register/propose/add_signature), and nonce marks that are
// reconciled to on-chain state by dbSyncWalletState on the next reload.
const PG_TIMEOUT_MS = 12000;     // per-attempt; first cold start can be slow
const PG_MAX_ATTEMPTS = 4;       // 1 try + 3 retries
const PG_RETRY_STATUS = new Set([408, 425, 429, 500, 502, 503, 504]);
const pgSleep = ms => new Promise(r => setTimeout(r, ms));

// PostgREST serialises a `numeric` column as a bare JSON number, and a wei
// amount is routinely larger than the 2^53 a JavaScript number can hold exactly.
// JSON.parse rounds it before any of this code sees it, so a proposal for
// 1234567890123456789 wei is read back as …6800 — a different value, a different
// EIP-712 digest, and every signature stored against the original silently stops
// verifying. MAX on an ETH send is exactly the case that produces such a figure,
// because it sends the raw balance rather than a rounded one.
//
// So re-quote long integers before parsing, turning them into strings the way
// every consumer here already expects (`BigInt(t.value)`). The key has to sit in
// key position — preceded by `{` or `,` — or a description containing the text
// `\"value\":123…` would be rewritten inside its own string literal.
const _PG_BIGNUM = /([{,]\s*)"(value|salt)"(\s*:\s*)(-?\d{16,})(?=\s*[,}])/g;
function pgJson(text) {
  return JSON.parse(String(text).replace(_PG_BIGNUM, '$1"$2"$3"$4"'));
}

async function pgFetch(path, init) {
  let lastErr = null;
  for(let attempt = 0; attempt < PG_MAX_ATTEMPTS; attempt++) {
    if(attempt > 0) {
      // 300ms, 900ms, 2700ms (±30% jitter)
      const base = 300 * Math.pow(3, attempt - 1);
      await pgSleep(base * (0.7 + Math.random() * 0.6));
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), PG_TIMEOUT_MS);
    try {
      const res = await fetch(`${PGRST_URL}/${path}`, { ...init, signal: ctrl.signal });
      clearTimeout(timer);
      if(!res.ok && PG_RETRY_STATUS.has(res.status) && attempt < PG_MAX_ATTEMPTS - 1) {
        lastErr = { status: res.status, message: `HTTP ${res.status}` };
        continue; // transient — retry
      }
      return res; // success or non-retryable error (4xx) — hand back to caller
    } catch(e) {
      clearTimeout(timer);
      // Network failure / timeout (AbortError) — retryable
      lastErr = { message: e.name === 'AbortError' ? `timeout after ${PG_TIMEOUT_MS}ms` : String(e) };
    }
  }
  throw Object.assign(new Error(lastErr?.message || 'request failed'), { pgError: lastErr });
}

class PgQuery {
  constructor(table) { this._table = table; this._params = new URLSearchParams(); this._single = false; }
  select(cols) { this._params.set('select', cols || '*'); return this; }
  eq(col, val) { this._params.append(col, `eq.${val}`); return this; }
  // Case-insensitive equality, for the columns that hold addresses. An address
  // is a 160-bit number; the case of its hex is a checksum, not part of the
  // value, and the same vault legitimately arrives here checksummed from
  // getOwners(), lowercased from a URL somebody's chat client normalised, and
  // mixed from a paste. The SQL side already knew this — is_wallet_owner()
  // compares with lower() on both sides — but the queries did not, so a lookup
  // could miss a row that was plainly there. No wildcard is passed: these
  // values are hex, and ilike without % or _ is just a case-blind =.
  ilike(col, val) { this._params.append(col, `ilike.${val}`); return this; }
  in(col, arr) { this._params.append(col, `in.(${arr.join(',')})`); return this; }
  order(col, opts) { this._params.append('order', `${col}.${opts && opts.ascending === false ? 'desc' : 'asc'}`); return this; }
  limit(n) { this._params.set('limit', String(n)); return this; }
  maybeSingle() { this._single = true; return this; }
  async _run() {
    try {
      const res = await pgFetch(`${this._table}?${this._params}`, { headers: { 'Accept': 'application/json' } });
      if(!res.ok) return { data: null, error: { status: res.status, message: await res.text() } };
      const rows = pgJson(await res.text());
      return { data: this._single ? (rows[0] ?? null) : rows, error: null };
    } catch(e) { return { data: null, error: e.pgError || { message: String(e) } }; }
  }
  then(resolve, reject) { return this._run().then(resolve, reject); }
}
const sb = {
  from(table) { return new PgQuery(table); },
  async rpc(fn, params) {
    try {
      const res = await pgFetch(`rpc/${fn}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(params || {})
      });
      if(!res.ok) return { data: null, error: { status: res.status, message: await res.text() } };
      const text = await res.text();
      return { data: text ? pgJson(text) : null, error: null };
    } catch(e) { return { data: null, error: e.pgError || { message: String(e) } }; }
  }
};

// ── SCHEMA DRIFT ──────────────────────────────────────────────────
// The coordination database is migrated by hand (see render.yaml), and this app
// is deployed by pushing a static file. Nothing keeps the two in step, and when
// they drift the symptoms surface far from the cause: a failed migration once
// left production serving a previous schema for weeks, and what an operator saw
// was a proposal refused as "NONCE IN USE" — a message about a nonce, for a
// problem that had nothing to do with one.
//
// So say it plainly, once, the first time anything notices. Every db* helper
// already degrades to empty rather than throwing, which is what made this quiet
// in the first place; this is the one thing that is allowed to be loud.
let _schemaStale = null;
function markSchemaStale(why){
  if(_schemaStale) return;
  _schemaStale = why || 'unknown';
  console.error('Coordination database schema is behind this app:', _schemaStale, '— re-apply db/schema.sql');
  flash('THE COORDINATION DATABASE IS RUNNING AN OLDER SCHEMA THAN THIS APP — PROPOSALS AND HISTORY MAY FAIL. RE-APPLY db/schema.sql.', 9000);
  render();
}
// One read that only the current schema can answer. sort_ts arrived with the
// migration that also fixed propose_tx, so a database that cannot serve this
// column cannot serve a proposal either — and finding that out on page load is
// worth one request that returns at most a single row.
async function checkSchemaFresh(){
  const { error } = await sb.from('tx_history').select('sort_ts').limit(1);
  if(error) markSchemaStale('tx_history.sort_ts: ' + (error.message || error.status));
}

// ── UTILITIES ─────────────────────────────────────────────────────
// One pass, not five. render() rebuilds the page from a string and this is the
// function it calls most, so the five chained replaces were five full scans and
// four throwaway strings per escaped value.
const _ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const _escOne = c => _ESC[c];
function esc(s) {
  return String(s).replace(/[&<>"']/g, _escOne);
}

// esc() is correct for TEXT and for attribute values, but not for a string
// literal inside an inline handler: the browser HTML-decodes the attribute
// before the JS parser ever sees it, so esc()'s &#39; arrives back as a bare
// quote and closes the literal early. Anything reaching a handler this way —
// notably an ERC-20 `symbol()`, which is whatever an arbitrary contract chose to
// return — has to be escaped for JS first and for HTML second.
function jstr(s) {
  return esc(String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
}

const DECIMALS = { ETH: 18, USDC: 6, USDT: 6, USDT0: 6, DAI: 18, WBTC: 8, wstETH: 18, cbBTC: 8 };

function stripCommas(s) { return String(s).replace(/,/g, ''); }

// A proposal's `value` reaches this interface from a row anyone can write:
// propose_tx() runs as the anon role and checks only that the address the row
// *claims* proposed it is an owner. The column is `numeric`, which accepts
// 1.5 and -1 and 1e40, and every render path that touches a proposal hands it
// straight to BigInt() — where BigInt('1.5') throws. One such row would empty
// the whole queue on load, and reach txKind() on render if it got that far.
// Returns a canonical wei string, or null for anything that is not a
// non-negative whole number — which is anything the vault could never execute.
function weiStr(v) {
  if(v == null) return '0';
  const s = String(v).trim();
  if(!/^\d+$/.test(s)) return null;
  try { return BigInt(s).toString(); } catch(_) { return null; }
}
// The same guard for the render path, which has no row to skip and must not
// throw: an unreadable value counts as zero and the proposal is still drawn.
function bigOr0(v) {
  const s = weiStr(v);
  return s === null ? 0n : BigInt(s);
}

function toUnits(val, dec) {
  if (!val || val === "0") return "0";
  const s = val.replace(/,/g, "");
  if (!/^\d*\.?\d+$/.test(s)) return "INVALID";
  const p = s.split(".");
  const w = p[0] || "0";
  const f = (p[1] || "").padEnd(dec, "0").slice(0, dec);
  return (w + f).replace(/^0+/, "") || "0";
}

function fmtEta(eta) {
  if (!eta) return null;
  const d = eta - NOW();
  if (d <= 0) return "READY";
  const h = Math.floor(d / 3600), m = Math.floor((d % 3600) / 60), s = d % 60;
  if (h > 0) return `${h}H ${m}M`;
  if (m > 0) return `${m}M ${s}S`;
  return `${s}S`;
}

function fmtD(s) {
  if (!s) return "0";
  const h = s / 3600;
  if (h >= 24) return `${Math.floor(h / 24)}D`;
  if (h < 1) return `${Math.round(s / 60)}M`;
  return Number.isInteger(h) ? `${h}H` : `${h.toFixed(1)}H`;
}

// Timelock delay is set in a user-chosen unit (minutes/hours/days) but stored
// on-chain as uint32 seconds. These convert between the two.
const UNIT_SEC = { m: 60, h: 3600, d: 86400 };
const UNIT_LABEL = { m: 'MIN', h: 'HR', d: 'DAY' };
// Below this a non-zero timelock offers little practical protection — warn, don't block.
const SHORT_DELAY_SEC = 600;
// value (in `unit`) -> whole seconds
function toSec(val, unit) { return Math.floor((parseFloat(val) || 0) * (UNIT_SEC[unit] || 3600)); }
// seconds -> the tidiest {val, unit} that represents it exactly
function fromSec(sec) {
  if (!sec || sec <= 0) return { val: 0, unit: 'h' };
  if (sec % 86400 === 0) return { val: sec / 86400, unit: 'd' };
  if (sec % 3600 === 0) return { val: sec / 3600, unit: 'h' };
  return { val: sec / 60, unit: 'm' };
}
// set the admin "new delay" value+unit from a seconds figure (picks tidiest unit)
function setNd(sec) { const p = fromSec(sec); S.nd = p.val; S.ndUnit = p.unit; }

// middle-ellipsis for a full 0x address; passes anything else through unchanged
function shortAddr(a){return /^0x[0-9a-fA-F]{40}$/.test(a||"")?a.slice(0,6)+"…"+a.slice(-4):(a||"");}

const SELECTOR_LABELS = {
  [SEL.transfer]: 'ERC20 TRANSFER',   [SEL.approve]:      'ERC20 APPROVE',
  [SEL.addOwner]: 'ADD OWNER',        [SEL.removeOwner]:  'REMOVE OWNER',
  [SEL.setThreshold]: 'SET THRESHOLD',[SEL.setDelay]:     'SET DELAY',
  [SEL.setExecutor]: 'SET EXECUTOR',  [SEL.cancelQueued]: 'CANCEL',
  [SEL.executeQueued]: 'ACCELERATE',  [SEL.batch]:        'BATCH',
  [SEL.delegateCall]: 'DELEGATE CALL',[SEL.enableForward]:'ENABLE FORWARD',
  [SEL.depositTo]: 'SLOW TRANSFER',
  [SEL.wnsRegister]: 'CLAIM NAME',    [SEL.wnsSetPrimary]:'SET PRIMARY NAME',
};
function selectorToLabel(callData) {
  if(!callData || callData === '0x') return 'TRANSFER';
  const sel = selOf(callData);
  if(!sel) return 'CALL';
  return SELECTOR_LABELS[sel] || `CALL ${sel}`;
}

// ── PROPOSAL CLASSIFICATION ───────────────────────────────────────
// Every proposal type this vault can hold, resolved from the call itself to a
// badge and one plain sentence about what executing it actually does. Read from
// target/value/calldata rather than from anything this UI recorded, so a
// proposal raised by another tool is described identically.
//
// Returns { label, tone, note, warn, icon }. `tone` drives the badge colour;
// `warn` marks proposals whose consequences outlive them — a weaker policy, a
// standing allowance, foreign code in the vault's own storage. Routine asset
// movements carry no note: the amount and the recipient already say it.
function txKind(tx, v) {
  const data = tx.callData || '0x';
  const val = bigOr0(tx.rawValue);
  const self = !!(v.address && tx.target && tx.target.toLowerCase() === v.address.toLowerCase());
  const sel = selOf(data);
  const is = name => sel === SEL[name];
  const dec = (fn, iface) => { try { return (iface || msIface).decodeFunctionData(fn, data); } catch(_) { return null; } };
  const at = a => a ? shortAddr(a) : 'AN ADDRESS';

  // ── no calldata: value moves, or a nonce-consuming no-op ──
  if(data === '0x') {
    if(self && val === 0n) return { label:'REJECT · NO-OP', tone:'danger',
      note:'A DO-NOTHING SELF-CALL WHOSE ONLY EFFECT IS TO CONSUME THIS NONCE, SO LATER PROPOSALS CAN PROCEED. IT MOVES NOTHING.' };
    if(tx.isStake || isStakeCall(tx.target, data)) return { label:'STAKE · ETH → wstETH', tone:'stake', icon:'wstETH',
      note:'STAKES ETH WITH LIDO — THE wstETH CONTRACT MINTS wstETH STRAIGHT BACK TO THE VAULT. HOW MUCH IS SET BY THE RATE AT EXECUTION, NOT NOW.' };
    // Audit L-2 — see lockedDest().
    const burn = val > 0n && lockedDest(tx.target);
    if(burn) return { label:'ETH TRANSFER · UNRECOVERABLE', tone:'danger', warn:true,
      note:`SENDS ETH TO ${burn}, WHICH HAS NO WITHDRAWAL PATH OF ANY KIND. NOBODY — NOT THE OWNERS, NOT THE DEPLOYER — CAN EVER GET IT BACK. THIS IS A BURN.` };
    return { label:'ETH TRANSFER', tone:'value' };
  }

  // ── asset movement ──
  if(is('transfer')) {
    const d = dec('transfer', erc20Iface);
    const burn = d && lockedDest(d[0]);
    if(burn) return { label:'ERC20 TRANSFER · UNRECOVERABLE', tone:'danger', warn:true,
      note:`SENDS THIS TOKEN TO ${burn}, WHICH HAS NO WITHDRAWAL PATH AND CANNOT MOVE A TOKEN BALANCE. THE AMOUNT IS GONE FOR GOOD ONCE THIS EXECUTES.` };
    return { label:'ERC20 TRANSFER', tone:'value' };
  }
  if(is('approve')) {
    const d = dec('approve', erc20Iface);
    const max = d && d[1] != null && BigInt(d[1]) >= (2n ** 255n);
    return { label:'ERC20 APPROVE', tone:'code', warn:true,
      note:`LETS ${at(d && d[0])} MOVE ${max ? 'AN UNLIMITED AMOUNT OF' : 'UP TO THE APPROVED AMOUNT OF'} THIS TOKEN OUT OF THE VAULT, AT ANY TIME, UNTIL THE ALLOWANCE IS REVOKED. IT DOES NOT EXPIRE WITH THIS PROPOSAL.` };
  }
  if(is('depositTo')) {
    const d = dec('depositTo', slowIface);
    const delay = d ? Number(d[3]) : 0;
    return { label:`SLOW · ${delay ? fmtDelay(delay) : 'DELAYED'}`, tone:'slow',
      note:`LOCKS THE ASSET IN A TIME-DELAYED CLAIM FOR ${at(d && d[1])}. THEY CAN COLLECT IT ONLY AFTER ${delay ? fmtDelay(delay) : 'THE DELAY'}, AND THE VAULT CAN REVERSE IT AT ANY POINT BEFORE THEN.` };
  }

  // ── policy: outlives the proposal, so every one of these gets a note ──
  if(is('addOwner')) {
    const d = dec('addOwner');
    return { label:'ADD OWNER', tone:'policy',
      note:`ADDS ${at(d && d[0])} AS AN OWNER &mdash; ${v.ownerCount} &rarr; ${v.ownerCount + 1} OWNERS. THE THRESHOLD STAYS AT ${v.threshold}, SO EACH SIGNATURE COVERS A SMALLER SHARE OF THE OWNER SET.` };
  }
  if(is('removeOwner')) {
    const d = dec('removeOwner');   // (prevOwner, owner) — the second is the one removed
    const tooFew = v.ownerCount <= v.threshold;
    return { label:'REMOVE OWNER', tone:'policy', warn:tooFew,
      note:`REMOVES ${at(d && d[1])} &mdash; ${v.ownerCount} &rarr; ${v.ownerCount - 1} OWNERS, STILL ${v.threshold} SIGNATURES REQUIRED.` +
        (tooFew ? ` THAT WOULD LEAVE FEWER OWNERS THAN THE THRESHOLD, SO THE CALL WILL REVERT.` : '') };
  }
  if(is('setThreshold')) {
    const d = dec('setThreshold');
    const n = d ? Number(d[0]) : null;
    const lower = n != null && n < v.threshold;
    return { label:'SET THRESHOLD', tone:'policy', warn:lower,
      note:`REQUIRES ${n != null ? n : '?'} OF ${v.ownerCount} SIGNATURES AFTER THIS, FROM ${v.threshold} NOW.` +
        (n === 1 ? ` AT 1, ANY SINGLE OWNER COULD MOVE EVERYTHING ON THEIR OWN.` : lower ? ` THIS LOWERS THE BAR FOR EVERY FUTURE PROPOSAL, INCLUDING ONES ALREADY IN THE QUEUE.` : '') };
  }
  if(is('setDelay')) {
    const d = dec('setDelay');
    const s = d ? Number(d[0]) : null;
    const shorter = s != null && s < v.delay;
    // Audit M-2 — a delay nobody can walk back.
    const noExec = !v.executor || v.executor === ethers.ZeroAddress || v.executor === '0x0000...0000';
    if(s != null && s > DELAY_SANE_MAX) return { label:'SET TIMELOCK · EXTREME', tone:'danger', warn:true,
      note:`SETS THE TIMELOCK TO ${fmtDelay(s)}. EVERY LATER PROPOSAL WAITS THAT LONG — INCLUDING THE ONE THAT WOULD SHORTEN IT AGAIN, BECAUSE setDelay IS ITSELF QUEUED.` +
        (noExec ? ` THIS VAULT HAS NO EXECUTOR, SO THERE IS NO BYPASS AND NO CANCEL: THIS IS PERMANENT.` : ` ONLY A UNANIMOUS FAST-PATH FORWARD COULD UNDO IT.`) };
    return { label:'SET TIMELOCK', tone:'policy', warn:shorter,
      note:`TIMELOCK BECOMES ${s == null ? '?' : s === 0 ? 'NONE' : fmtD(s)}, FROM ${v.delay ? fmtD(v.delay) : 'NONE'} NOW.` +
        (s === 0 ? ` AT ZERO THERE IS NO DELAY AT ALL — PROPOSALS EXECUTE THE MOMENT THEY REACH QUORUM, WITH NO WINDOW TO CANCEL ONE.` :
         shorter ? ` A SHORTER DELAY MEANS LESS TIME TO SPOT AND CANCEL A BAD PROPOSAL.` : '') };
  }
  if(is('setExecutor')) {
    const d = dec('setExecutor');
    const a = d ? d[0] : null;
    const clearing = a && a === ethers.ZeroAddress;
    // Audit L-1, read off the calldata rather than off anything this UI
    // recorded — the proposal that matters most here is the one raised
    // somewhere else and brought to a co-signer for a second signature.
    // Audit M-3 — clearing the executor under a live timelock is not a
    // downgrade, it is the removal of the only role that can act inside the
    // window. cancelQueued is onlySelf, so a cancel is queued for `delay` too
    // and matures no earlier than what it cancels.
    if(clearing && v.delay > 0) return { label:'SET EXECUTOR · STRANDS THE QUEUE', tone:'danger', warn:true,
      note:`REMOVES THE EXECUTOR WHILE A ${fmtD(v.delay)} TIMELOCK IS SET. THE EXECUTOR IS THE ONLY ROLE THAT CAN CANCEL INSIDE THE DELAY WINDOW — A CANCEL RAISED WITHOUT ONE IS ITSELF QUEUED FOR ${fmtD(v.delay)} AND MATURES NO EARLIER THAN THE PROPOSAL IT MEANS TO STOP. AFTER THIS, ANYTHING QUEUED — INCLUDING WHAT IS ALREADY WAITING — EXECUTES ON SCHEDULE AND NOTHING CAN STOP IT.` };
    const risk = a ? executorRisk(a, v.address) : null;
    if(risk === 'lock') return { label:'SET EXECUTOR · LOCKS VAULT', tone:'danger', warn:true,
      note:`DO NOT SIGN. THIS POINTS THE VAULT AT ITSELF, AND THIS VAULT'S ADDRESS CARRIES THE 0x1111 GUARD-HOOK MARKER — SO EVERY execute() WOULD CALL BACK INTO ITSELF UNTIL IT RAN OUT OF GAS. NOTHING WOULD EXECUTE AGAIN, INCLUDING THE PROPOSAL THAT WOULD UNDO THIS. THE VAULT AND EVERYTHING IN IT WOULD BE FROZEN PERMANENTLY.` };
    if(risk === 'self') return { label:'SET EXECUTOR · SELF', tone:'danger', warn:true,
      note:`POINTS THE VAULT AT ITSELF. THE EXECUTOR ROLE SKIPS SIGNATURE CHECKS AND THE TIMELOCK, SO THIS HANDS THAT BYPASS TO THE VAULT'S OWN SELF-CALLS AND HAS NO LEGITIMATE USE. AT A VAULT ADDRESS CARRYING THE 0x1111 MARKER THE SAME CALL LOCKS THE VAULT FOR GOOD.` };
    if(risk === 'hook') return { label:'SET EXECUTOR · GUARD HOOK', tone:'danger', warn:true,
      note:`POINTS THE VAULT AT ${at(a)}, WHOSE ADDRESS CARRIES THE 0x1111 GUARD-HOOK MARKER. THE VAULT WILL CALL execute() ON IT AROUND EVERY TRANSACTION OF ITS OWN — BEFORE SIGNATURES ARE EVEN CHECKED — AND A REVERT THERE STOPS THE VAULT DEAD. ONLY SIGN IF YOU HAVE READ THAT CONTRACT.` };
    return { label:'SET EXECUTOR', tone:'policy', warn:true,
      note:clearing
        ? `REMOVES THE VAULT'S EXECUTOR. THE FAST PATH AND THE CANCEL/ACCELERATE ROUTES THAT RUN THROUGH IT ALL STOP WORKING.`
        : `POINTS THE VAULT AT ${at(a)} AS ITS TIMELOCK EXECUTOR. THAT CONTRACT CAN THEN FORWARD CALLS ON THE VAULT'S BEHALF — VERIFY IT BEFORE SIGNING.` };
  }
  if(is('enableForward')) {
    const d = dec('enableForward', tlIface);
    const on = d ? !!d[0] : null;
    // Audit H-1 — where unanimity and quorum are the same number, "skip the
    // timelock once everyone signs" and "skip the timelock" are the same offer.
    if(on && fastPathVoidsTimelock(v)) return { label:'FAST PATH · TIMELOCK BECOMES ADVISORY', tone:'danger', warn:true,
      note:`ON A ${v.threshold}-OF-${v.ownerCount} VAULT EVERY QUORUM IS ALREADY UNANIMOUS, SO THE SIGNATURES THAT QUEUE A PROPOSAL ARE THE SAME BYTES THAT EXECUTE IT INSTANTLY — WHOEVER HOLDS THEM DECIDES WHICH, AND THAT INCLUDES ANYONE WHO SEES THEM IN THE MEMPOOL. AFTER THIS THE ${fmtD(v.delay)} DELAY IS THE DEFAULT ROUTE, NOT A GUARANTEE. THE CANCEL BRAKE IS UNAFFECTED — IT NEEDS ${v.threshold} SIGNATURES EITHER WAY.` };
    return { label:'EXECUTOR FAST PATH', tone:'policy', warn:on === true,
      note:on
        ? `TURNS ON THE FAST PATH — ONCE EVERY OWNER SIGNS, A PROPOSAL CAN SKIP THE TIMELOCK ENTIRELY.`
        : `TURNS OFF THE FAST PATH — EVERY PROPOSAL MUST THEN SERVE THE FULL TIMELOCK, WITH NO UNANIMOUS SHORTCUT.` };
  }

  // ── on-chain identity ──
  // Named off the target as well as the selector. A four-byte match proves
  // nothing about which contract is being called, and "CLAIM NAME" beside a
  // stranger's address would be this interface vouching for something it never
  // checked — the same reasoning the executor branch above runs on.
  if(is('wnsRegister') && tx.target && tx.target.toLowerCase() === WNS_ID_REGISTRAR.toLowerCase()) {
    const d = dec('register', wnsRegIface);
    if(!d || BigInt(d[0]) !== BigInt(WNS_ID_PARENT)) return { label:'CLAIM NAME · UNKNOWN NAMESPACE', tone:'code', warn:true,
      note:`MINTS A SUBDOMAIN UNDER A PARENT NODE THIS INTERFACE DOES NOT RECOGNISE — NOT UNDER id.wei. THE NAME THIS PRODUCES IS NOT THE NAME THE LABEL READS AS. CHECK THE PARENT ID BEFORE SIGNING.` };
    // The label is a free-form string out of a proposal row, and rows are
    // anon-writable. `label` is escaped at its sink; `note` is emitted as
    // trusted HTML because every other note here is built from entities and
    // shaped values — so the one untrusted thing in it is escaped here, where
    // it enters, rather than relying on a sink that does not escape.
    const raw = wnsFullName(d[1]);
    const full = esc(raw.toUpperCase());
    // A label this interface would refuse to claim is one worth flagging when
    // it arrives from somewhere else: the registrar accepts zero-width spaces
    // and mixed scripts, and this is the screen where a name that is drawn to
    // look like another name gets signed for.
    const odd = !wnsLabelValid(asciiLower(d[1]));
    return { label:`CLAIM NAME · ${raw.toUpperCase()}`, tone:'policy', warn:odd,
      note:`REGISTERS ${full} TO THE VAULT, FREE — THE NAME IS AN NFT THE VAULT THEN HOLDS, SO MOVING IT LATER TAKES A FULL MULTISIG ROUND LIKE ANY OTHER ASSET. IT MAKES ${full} RESOLVE TO THIS ADDRESS. IT DOES NOT MAKE THIS ADDRESS ANSWER WITH ${full} — THAT IS setPrimaryName, AND IT IS NOT IN THIS PROPOSAL.`
        + (odd ? ` THIS LABEL USES CHARACTERS THIS INTERFACE WOULD NOT CLAIM — IT MAY CONTAIN INVISIBLE OR MIXED-SCRIPT CHARACTERS AND MAY NOT BE THE NAME IT APPEARS TO BE. READ THE CALLDATA BEFORE SIGNING.` : '') };
  }
  if(is('wnsSetPrimary') && tx.target && tx.target.toLowerCase() === WEINS.toLowerCase()) {
    // The id is a one-way hash, so which name this points at cannot be read off
    // the calldata alone. Say that rather than name a name we did not verify.
    return { label:'SET PRIMARY NAME', tone:'policy',
      note:`POINTS REVERSE RESOLUTION AT ONE .wei NAME THE VAULT HOLDS, SO WALLETS AND EXPLORERS SHOW THAT NAME WHEREVER THIS ADDRESS APPEARS. IT MOVES NOTHING AND GRANTS NOBODY ANYTHING. WHICH NAME IS GIVEN AS A HASHED ID, NOT AS TEXT, SO IT CANNOT BE READ BACK FROM THIS PROPOSAL — CONFIRM IT AGAINST THE NAME YOU EXPECT BEFORE SIGNING.` };
  }

  // ── queue control ──
  // Both name the proposal they act on wherever it can be identified. A cancel
  // carries only a hash, and a co-signer asked to approve one raised elsewhere
  // has no way to read which proposal that is — but every queued entry's digest
  // is derived here already, so the hash can simply be looked up. Says nothing
  // rather than guessing when there is no match: an unrecognised hash may be a
  // proposal this queue has not loaded, and naming the wrong one is worse than
  // naming none.
  const queuedAt = h => {
    const hit = (v.queue || []).find(q => q.txHash && String(q.txHash).toLowerCase() === String(h).toLowerCase());
    return hit ? `#${hit.nonce}` : null;
  };
  if(is('cancelQueued')) {
    const d = dec('cancelQueued');
    const which = d ? queuedAt(d[0]) : null;
    return { label: which ? `CANCEL QUEUED · ${which}` : 'CANCEL QUEUED', tone:'danger',
      note:(which
        ? `DROPS QUEUED PROPOSAL ${which} BEFORE ITS TIMELOCK ELAPSES, SO IT CAN NEVER EXECUTE.`
        : `DROPS A PROPOSAL THAT IS ALREADY QUEUED, BEFORE ITS TIMELOCK ELAPSES. THE CANCELLED PROPOSAL CANNOT THEN EXECUTE.`)
        + (which ? '' : ` IT NAMES THAT PROPOSAL BY HASH, AND NO PROPOSAL IN THIS QUEUE HAS THAT HASH — CHECK WHAT IT CANCELS BEFORE SIGNING.`) };
  }
  if(is('executeQueued')) {
    const d = dec('executeQueued');   // (target, value, data, nonce)
    const which = d ? `#${Number(d[3])}` : null;
    return { label: which ? `ACCELERATE · ${which}` : 'ACCELERATE', tone:'danger',
      note:`EXECUTES ${which ? `QUEUED PROPOSAL ${which}` : 'A QUEUED PROPOSAL'} IMMEDIATELY, SKIPPING WHATEVER IS LEFT OF ITS TIMELOCK. THIS IS THE STEP THE DELAY EXISTS TO PREVENT, SO IT TAKES EVERY OWNER'S SIGNATURE.` };
  }

  // ── composite / raw ──
  if(is('batch')) {
    const d = dec('batch');
    if(d) {
      const [targets, values, datas] = d;
      // The mint and the reverse record are one decision, so they are one
      // proposal — and a queue row reading "BATCH · 2 CALLS" would bury the
      // only thing a co-signer needs to check, which is the name itself.
      const ident = wnsIdentityBatch(targets, values, datas);
      if(ident) {
        // Same rule as the single-call branch above: escaped into the note,
        // raw into the label, which its own sink escapes.
        const full = esc(ident.full.toUpperCase());
        const odd = !wnsLabelValid(ident.label);
        return { label:`ON-CHAIN IDENTITY · ${ident.full.toUpperCase()}`, tone:'policy', warn:odd,
          note:`CLAIMS ${full} FOR THIS VAULT AND POINTS REVERSE RESOLUTION AT IT, ATOMICALLY — AFTER THIS THE NAME RESOLVES TO THIS ADDRESS AND THIS ADDRESS ANSWERS WITH THE NAME. THE SUBDOMAIN IS FREE; THE ONLY COST IS THE GAS TO EXECUTE. THE NAME BECOMES AN NFT THE VAULT HOLDS. IT GRANTS NOBODY ANY POWER OVER THE VAULT AND MOVES NOTHING OUT OF IT.`
            + (odd ? ` THIS LABEL USES CHARACTERS THIS INTERFACE WOULD NOT CLAIM — IT MAY CONTAIN INVISIBLE OR MIXED-SCRIPT CHARACTERS AND MAY NOT BE THE NAME IT APPEARS TO BE. READ THE CALLDATA BEFORE SIGNING.` : '') };
      }
      const parts = datas.map((cd, i) => (!cd || cd === '0x') && BigInt(values[i]) > 0n ? 'ETH TRANSFER' : selectorToLabel(cd));
      return { label:`BATCH · ${targets.length} CALLS`, tone:'code',
        note:`${parts.join(' + ')} — EXECUTED ATOMICALLY, SO EITHER EVERY CALL LANDS OR THE WHOLE PROPOSAL REVERTS AND NOTHING DOES.` };
    }
    return { label:'BATCH', tone:'code', note:`SEVERAL CALLS EXECUTED ATOMICALLY — ALL SUCCEED, OR THE WHOLE PROPOSAL REVERTS.` };
  }
  if(is('delegateCall')) {
    const d = dec('delegateCall');
    return { label:'DELEGATE CALL', tone:'danger', warn:true,
      note:`RUNS ${at(d && d[0])}'S CODE INSIDE THE VAULT'S OWN STORAGE. IT CAN REACH EVERY ASSET THE VAULT HOLDS AND REWRITE EVERY SETTING IT HAS, INCLUDING THE OWNER SET. ONLY APPROVE THIS IF YOU HAVE READ THAT CODE.` };
  }

  // Audit L-2 — a self-call the wallet has no function for is not a call, it is
  // a nonce burn that reports success. Say so, because nothing downstream will.
  if(self && sel && !isKnownMultisigSelector(sel)) return { label:'SELF-CALL · SILENT NO-OP', tone:'danger', warn:true,
    note:`THE VAULT HAS NO FUNCTION WITH SELECTOR ${sel}, AND ITS FALLBACK RETURNS SUCCESS INSTEAD OF REVERTING. THIS WOULD CONSUME NONCE ${tx.nonce != null ? tx.nonce : 'ITS NONCE'}, EMIT ExecutionSuccess, AND CHANGE NOTHING — A MISTYPED GOVERNANCE CALL THAT LOOKS EXECUTED EVERYWHERE AFTERWARDS. CHECK THE FUNCTION NAME BEFORE SIGNING.` };
  return { label:`CALL ${sel || '?'}`, tone:'code', warn:true,
    note:`UNRECOGNISED FUNCTION. NOTHING IN THIS INTERFACE CAN TELL YOU WHAT IT DOES — READ THE TARGET CONTRACT AND THE CALLDATA, OR SIMULATE IT, BEFORE SIGNING.` };
}

function isCancelTx(tx, v) {
  return tx.cancelTarget != null
    || (selOf(tx.callData) === SEL.cancelQueued
        && tx.target && tx.target.toLowerCase() === v.address.toLowerCase());
}

function nextNonce(v) {
  return v.queue.length
    ? Math.max(v.nonce, ...v.queue.map(t => t.nonce + 1))
    : v.nonce;
}

// Pending self-calls that mutate the owner set / threshold. Because execution
// is strictly sequential by nonce, a new owner change created now executes
// AFTER these and may revert if the set shifts first — used to warn the user.
const POLICY_SELECTORS = {
  [SEL.addOwner]: 'ADD OWNER',
  [SEL.removeOwner]: 'REMOVE OWNER',
  [SEL.setThreshold]: 'SET THRESHOLD',
};
function pendingPolicyChanges(v) {
  if(!v || !v.address || !v.queue) return [];
  const self = v.address.toLowerCase();
  return v.queue
    .map(t => ({ t, label: POLICY_SELECTORS[selOf(t.callData)] }))
    .filter(x => x.label && x.t.target && x.t.target.toLowerCase() === self)
    .map(x => ({ nonce: x.t.nonce, label: x.label }));
}

function txSt(tx, v) {
  const you = getYou();
  const ac = Object.values(tx.approvals).filter(Boolean).length;

  if (tx.eta > 0) {
    // Cancelling runs through the executor's forward(). Without one there is no
    // route at all, and offering the button anyway produced a cancel that
    // reported success and cancelled nothing — see canForwardCancel. `noCancel`
    // says so on the card rather than leaving a silent gap where the brake was.
    const cancellable = canForwardCancel(v);
    const csc = cancellable && tx.cancelSigners ? tx.cancelSigners.size : 0;
    const cancelReady = cancellable && csc >= v.threshold;
    const youCancel = cancellable && you && tx.cancelSigners && tx.cancelSigners.has(you.toLowerCase());

    if (fmtEta(tx.eta) === "READY") {
      return { l: "READY", c: "var(--g)", exec: true, noCancel: !cancellable,
        cancel: cancellable && !cancelReady && !youCancel, cancelExec: cancelReady, cancelSigs: csc };
    }

    const accelSigCount = tx.accelSigners ? tx.accelSigners.size : 0;
    const accelReady = v.fastPath && accelSigCount >= v.ownerCount;
    const youAccel = you && tx.accelSigners && tx.accelSigners.has(you.toLowerCase());

    return { l: fmtEta(tx.eta), c: "var(--d)", noCancel: !cancellable,
      cancel: cancellable && !cancelReady && !youCancel, cancelExec: cancelReady, cancelSigs: csc,
      accel: v.fastPath && !accelReady && !youAccel, accelExec: accelReady, accelSigs: accelSigCount };
  }

  if (ac < v.threshold) return { l: `${ac}/${v.threshold} SIGS`, c: "var(--y)", sign: true };
  if (v.delay === 0) return { l: "EXECUTE", c: "var(--g)", queue: true, instant: true };
  return { l: "SUBMIT", c: "var(--a)", queue: true };
}

function getYou(){
  if(S.demoMode) return DEMO_YOU;
  return window._connectedAddress || null;
}

// Best short identity for an owner: custom label, else resolved
// .wei/.gwei/ENS name, else a shortened address.
function ownerIdent(o){
  return o.label || o.name || (o.addr && ethers.isAddress(o.addr) ? o.addr.slice(0,6)+'…'+o.addr.slice(-4) : (o.addr || ''));
}

// The marked-up version of the above, for the two places that list owners as
// rows rather than name them in a sentence: the dashboard roster and the admin
// one. Stated once because they had drifted into opposite orders — name then
// address on one, address then name on the other — each having spelled it out
// inline. Precedence matches ownerIdent's: the identity leads, the address
// follows only when a name displaced it, and the copy affordance stays against
// the address it copies wherever that lands.
function signerIdentHtml(o, chain){
  const link = S.demoMode ? addrLink(o.addr, chain) : addrLink(o.addr);
  const copy = ethers.isAddress(o.addr) ? copyBtn(o.addr) : '';
  return o.name
    ? `<span class="signer-id">${esc(o.name)}</span><span class="signer-addr">${link}</span>${copy}`
    : `<span class="signer-id">${link}</span>${copy}`;
}

function addrLink(addr, chain) {
  const safe = esc(addr);
  const base = S.demoMode
    ? (EXPLORERS[chain] || EXPLORERS.ETHEREUM)
    : (CHAINS[S.chainId]?.explorer || 'https://etherscan.io');
  if (ethers.isAddress(addr)) {
    return `<a class="alink" href="${base}/address/${safe}" target="_blank" rel="noopener" title="${safe}" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--ln)">${esc(shortAddr(addr))}</a>`;
  }
  return `<span style="border-bottom:1px solid var(--ln)">${safe}</span>`;
}

// Copy, and only claim success if it actually copied. navigator.clipboard is
// undefined outside a secure context and rejects when the document isn't
// focused, so firing the confirmation unconditionally meant the UI could report
// an address as copied that was never on the clipboard — the one thing a
// clipboard affordance must not lie about. Falls back to a hidden textarea +
// execCommand, and says so plainly when neither route works.
function copyText(text, msg) {
  const ok = () => flash(msg || 'ADDRESS COPIED');
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const done = document.execCommand('copy');
      ta.remove();
      done ? ok() : flash('COULD NOT COPY');
    } catch(_) { flash('COULD NOT COPY'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, legacy);
  } else legacy();
}

// Small copy-to-clipboard button (⧉) with a flash confirmation.

// attribute, and esc() alone leaves a quote that the JS parser sees bare once

// addresses today, but this is a shared helper and the next one may not.

}
