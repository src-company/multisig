async function prodCancel(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  // Cancel via executor.forward() — only needs threshold sigs, no forwardEnabled required
  // This bypasses the nonce queue entirely
  const target = tx.target;
  const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
  const data = tx.callData || '0x';
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  const origTxHash = tx.txHash || ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, { target, value, data, nonce });
  const cancelData = msIface.encodeFunctionData('cancelQueued', [origTxHash]);
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);

  try {
    // Check DB for an existing cancel proposal (first signer sets the nonce)
    let cancelNonce = v.nonce;
    let existingSigs = [];
    let existingTxId = null;
    if(v.dbId) {
      const { data: rows } = await sb.from('transactions')
        .select('id, nonce, tx_hash')
        .eq('wallet_id', v.dbId)
        .eq('description', `Cancel #${nonce}`)
        .in('status', ['proposed', 'executing'])
        .limit(1);
      if(rows?.length) {
        existingTxId = rows[0].id;
        cancelNonce = rows[0].nonce;
        const dbSigs = await dbGetSigs(existingTxId);
        const msg = { target: v.address, value: 0n, data: cancelData, nonce: cancelNonce };
        existingSigs = verifySigs(dbSigs, domain, EIP712_TYPES, msg, ownerAddrs);
        if(existingSigs.length === 0 && dbSigs.length > 0) {
          cancelNonce = v.nonce;
          existingTxId = null;
        }
      }
    }

    const msg = { target: v.address, value: 0n, data: cancelData, nonce: cancelNonce };
    const cancelTxHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    // Add caller's sig
    let sigs = [...existingSigs];
    const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
    const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(callerIsOwner && !callerHasSigned) {
      const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
      sigs.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
      if(v.dbId) {
        if(!existingTxId) {
          existingTxId = await dbProposeTx(v.dbId, cancelNonce, v.address, '0', cancelData, cancelTxHash, v.threshold, connectedAddress, `Cancel #${nonce}`);
        }
        if(existingTxId) await dbAddSig(existingTxId, connectedAddress, sigs[sigs.length-1].sig);
      }
    }
    sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    if(sigs.length < v.threshold) {
      flash(`SIGNED CANCEL (${sigs.length}/${v.threshold}) — NEED ${v.threshold} SIGS`);
      await reloadQueue(vi);
      return;
    }

    // Verify nonce still matches on-chain
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== cancelNonce) {
      flash('NONCE CHANGED — RESIGNING NEEDED');
      if(existingTxId) {
        await dbCancelTx(existingTxId, connectedAddress);
      }
      await reloadQueue(vi);
      return;
    }

    // Threshold met — execute via forward()
    const tlContract = new ethers.Contract(v.executor, TIMELOCK_EXECUTOR_ABI, signer);
    flash('CANCELLING VIA EXECUTOR...');
    const atx = await tlContract.forward(v.address, v.address, 0n, cancelData, packSigs(sigs));
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    if(v.dbId) {
      if(existingTxId) await dbMarkExecuted(existingTxId, Number(receipt.blockNumber), receipt.hash);
      if(tx.dbId) {
        await dbCancelTx(tx.dbId, connectedAddress);
      }
    }
    flash(`CANCELLED #${nonce} VIA EXECUTOR`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'CANCEL FAILED');
  }
}

// Skip a stuck proposal so later ones can proceed. Because execution is
// strictly sequential by nonce, a proposal that can't reach threshold blocks
// everything behind it. REJECT signs a no-op self-call (execute(self,0,0x)) at
// that same nonce; once threshold owners sign it, submitting consumes the nonce
// and unblocks the queue. The payload moves nothing and is bound to this nonce.
async function prodReject(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  const rejectNonce = nonce;   // == the stuck proposal's (and live) on-chain nonce
  const rejectData = '0x';     // no-op self-call
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);

  try {
    // Aggregate any existing "Reject #N" companion signatures from the DB.
    let existingSigs = [];
    let existingTxId = null;
    if(v.dbId) {
      const { data: rows } = await sb.from('transactions')
        .select('id, nonce, tx_hash')
        .eq('wallet_id', v.dbId)
        .eq('description', `Reject #${nonce}`)
        .in('status', ['proposed', 'executing'])
        .limit(1);
      if(rows?.length) {
        existingTxId = rows[0].id;
        const dbSigs = await dbGetSigs(existingTxId);
        const msg = { target: v.address, value: 0n, data: rejectData, nonce: rejectNonce };
        existingSigs = verifySigs(dbSigs, domain, EIP712_TYPES, msg, ownerAddrs);
        // Companion exists but all its sigs are stale (e.g. nonce moved) — start fresh.
        if(existingSigs.length === 0 && dbSigs.length > 0) existingTxId = null;
      }
    }

    const msg = { target: v.address, value: 0n, data: rejectData, nonce: rejectNonce };
    const rejectTxHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    let sigs = [...existingSigs];
    const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
    const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(callerIsOwner && !callerHasSigned) {
      const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
      sigs.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
      if(v.dbId) {
        if(!existingTxId) {
          existingTxId = await dbProposeTx(v.dbId, rejectNonce, v.address, '0', rejectData, rejectTxHash, v.threshold, connectedAddress, `Reject #${nonce}`);
        }
        if(existingTxId) await dbAddSig(existingTxId, connectedAddress, sigs[sigs.length-1].sig);
      }
    } else if(!callerIsOwner) {
      flash('ONLY OWNERS CAN REJECT'); return;
    }
    sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    if(sigs.length < v.threshold) {
      flash(`SIGNED REJECT (${sigs.length}/${v.threshold}) — NEED ${v.threshold} SIGS`);
      await reloadQueue(vi);
      return;
    }

    // Sigs are over rejectNonce; execute() hashes against the live nonce.
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== rejectNonce) {
      flash('NONCE CHANGED — RELOADING');
      await reloadVault(vi);
      return;
    }

    const ms = new ethers.Contract(v.address, MULTISIG_ABI, signer);
    flash('REJECTING — SKIPPING NONCE...');
    const atx = await ms.execute(v.address, 0n, rejectData, packSigs(sigs.slice(0, v.threshold)));
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    if(v.dbId) {
      if(existingTxId) await dbMarkExecuted(existingTxId, Number(receipt.blockNumber), receipt.hash);
      if(tx.dbId) await dbCancelTx(tx.dbId, connectedAddress);   // retire the skipped proposal
    }
    flash(`REJECTED #${nonce} — NONCE SKIPPED`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'REJECT FAILED');
  }
}

// ── PROPOSAL SIMULATION (walletchan-style, adapted for a smart-contract wallet) ──
// A proposal's on-chain effect is the multisig's inner call:
//   target.call{value}(data)  with msg.sender == the multisig.
// We reproduce it faithfully with `from = multisig`. No signatures and no code
// injection (walletchan's EOA trick) are needed: the multisig is already a
// contract, so its real batch() / isValidSignature run as-is, and a self-call
// batch simulates atomically in one frame.
// Preferred: eth_simulateV1 → status + gasUsed + asset deltas from Transfer logs.
// Fallback: eth_call + estimateGas (revert check) on RPCs without simulateV1.
const _TRANSFER_TOPIC = ethers.id('Transfer(address,address,uint256)');
const _rawRpcCache = {};
function rawRpc() {
  const id = S.chainId;
  if(!_rawRpcCache[id]) _rawRpcCache[id] = new ethers.JsonRpcProvider(CHAINS[id].rpcs[0], id, { staticNetwork: true });
  return _rawRpcCache[id];
}
function _simTx(v, tx) {
  return {
    from: v.address, to: tx.target, data: tx.callData || '0x',
    value: tx.rawValue ? BigInt(tx.rawValue) : (tx.value && tx.value !== '0' ? ethers.parseEther(String(tx.value)) : 0n),
  };
}
const _tokenMetaCache = {};  // "chainId:token" -> { symbol, decimals }
function _shortTok(token){ return token.slice(0,6)+'…'+token.slice(-4); }
async function _assetsFromLogs(logs, self) {
  const selfLc = self.toLowerCase();
  const deltas = {};
  for(const log of (logs || [])) {
    const topics = log.topics || [];
    if(topics[0] !== _TRANSFER_TOPIC || topics.length < 3) continue;
    const fromA = ('0x' + topics[1].slice(26)).toLowerCase();
    const toA = ('0x' + topics[2].slice(26)).toLowerCase();
    if(fromA !== selfLc && toA !== selfLc) continue;
    let amt; try { amt = BigInt(log.data); } catch(_) { continue; }
    const token = log.address.toLowerCase();
    if(fromA === selfLc) deltas[token] = (deltas[token] || 0n) - amt;
    if(toA === selfLc) deltas[token] = (deltas[token] || 0n) + amt;
  }
  const tokens = Object.keys(deltas).filter(t => deltas[t] !== 0n);
  if(!tokens.length) return [];
  const allTokens = PROD_TOKENS[S.chainId] || [];
  const meta = {}, unknown = [];
  for(const token of tokens) {
    const known = allTokens.find(t => t.address.toLowerCase() === token);
    if(known) { meta[token] = { symbol: known.symbol, decimals: known.decimals }; continue; }
    const ck = S.chainId + ':' + token;
    if(_tokenMetaCache[ck]) { meta[token] = _tokenMetaCache[ck]; continue; }
    unknown.push(token);
  }
  // Resolve symbol()/decimals() for non-listed tokens in one Multicall3 call.
  if(unknown.length) {
    try {
      const calls = [];
      unknown.forEach(token => {
        calls.push({ target: token, allowFailure: true, callData: erc20Iface.encodeFunctionData('symbol') });
        calls.push({ target: token, allowFailure: true, callData: erc20Iface.encodeFunctionData('decimals') });
      });
      const res = await getMC3().aggregate3(calls);
      unknown.forEach((token, i) => {
        let symbol = null, decimals = null;
        const sr = res[i*2], dr = res[i*2+1];
        if(sr?.success) symbol = _decodeSymbol(sr.returnData);
        if(dr?.success) { try { decimals = Number(erc20Iface.decodeFunctionResult('decimals', dr.returnData)[0]); } catch(_){} }
        const m = { symbol: symbol || _shortTok(token), decimals: (decimals != null && !isNaN(decimals)) ? decimals : 18 };
        _tokenMetaCache[S.chainId + ':' + token] = m;
        meta[token] = m;
      });
    } catch(_) {
      unknown.forEach(token => { meta[token] = { symbol: _shortTok(token), decimals: 18 }; });
    }
  }
  return tokens.map(token => ({ symbol: meta[token].symbol, decimals: meta[token].decimals, delta: deltas[token] }));
}
function _revertReason(data) {
  if(typeof data === 'string' && data.startsWith('0x08c379a0')) {
    try { return ethers.AbiCoder.defaultAbiCoder().decode(['string'], '0x' + data.slice(10))[0]; } catch(_){}
  }
  return 'execution reverted';
}
async function _simViaSimulateV1(s) {
  const res = await rawRpc().send('eth_simulateV1', [{
    blockStateCalls: [{ calls: [{ from: s.from, to: s.to, value: '0x' + s.value.toString(16), data: s.data }] }],
    traceTransfers: true, validation: false,
  }, 'latest']);
  const call = res?.[0]?.calls?.[0];
  if(!call) throw new Error('no simulateV1 result');
  if(call.status === '0x0' || call.error) return { status:'revert', reason: _revertReason(call.error?.data ?? call.returnData) };
  return { status:'pass', gas: call.gasUsed ? BigInt(call.gasUsed).toString() : null, assets: await _assetsFromLogs(call.logs, s.from) };
}
async function _simViaCall(s) {
  await provider.call({ from: s.from, to: s.to, value: s.value, data: s.data }); // throws on revert
  let gas = null;
  try { gas = (await provider.estimateGas({ from: s.from, to: s.to, value: s.value, data: s.data })).toString(); } catch(_){}
  return { status:'pass', gas, assets: [], basic: true };
}
// Stamp a result with the wall-clock time it was produced, so a panel left on
// screen never reads as fresher than it is.
function _simStamp(r) {
  r.at = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  return r;
}
// Run a simulation for {from,to,value,data}; never throws (returns a revert result).
async function runSim(s) {
  let r;
  try {
    try { r = await _simViaSimulateV1(s); }
    catch(_) { r = await _simViaCall(s); }
  } catch(e) {
    return _simStamp({ status:'revert', reason: e.reason || e.shortMessage || _revertReason(e?.data) });
  }
  // Native ETH leaving the vault only shows up in the log trace when the RPC
  // supports traceTransfers; when it doesn't, derive it from the call value so
  // the ledger never silently omits the largest movement in the transaction.
  if(r.status === 'pass' && s.value > 0n) {
    r.assets = r.assets || [];
    if(!r.assets.some(a => a.symbol === 'ETH')) r.assets.unshift({ symbol:'ETH', decimals:18, delta: -s.value });
  }
  return _simStamp(r);
}
async function simulateProposal(vi, nonce) {
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;
  if(S.demoMode) { tx._sim = _simStamp({ status:'pass', demo:true, assets: [] }); render(); return; }
  tx._sim = { loading:true }; render();
  tx._sim = await runSim(_simTx(v, tx));
  render();
}

// Build {from,to,value,data} from the current tx-builder inputs, mirroring the
// prodSubmit* construction so the dry-run matches what would be proposed.
// Reads state first: oninput writes every keystroke to S and each render writes
// S back into the field, so the two cannot drift — and state-first means a
// programmatic change can never simulate one thing and propose another.
async function buildSimInput() {
  const v = S.vaults[S.sel];
  if(!v) return null;
  const from = v.address;
  if(S.txMode === 'TRANSFER') {
    const amt = stripCommas(S.txAmount || document.getElementById('tx-amount')?.value || '0');
    const to = S.txTo || document.getElementById('tx-to')?.value || '';
    if(!to || !amt || !(parseFloat(amt) > 0)) throw new Error('FILL IN AMOUNT AND RECIPIENT');
    const toAddr = assertPreviewed(to, await resolveName(to), S.chainId);
    const tokenInfo = curTok(v);
    const isEth = tokenInfo.address === ethers.ZeroAddress;
    const amountRaw = isEth ? ethers.parseEther(amt) : ethers.parseUnits(amt, tokenInfo.decimals);
    // SLOW delivery proposes a depositTo (plus an atomic approve for ERC20),
    // not a plain transfer — dry-run the call that will actually be queued.
    if(S.txSlow && slowAvailable()) {
      const { target, value, data } = await buildSlowOutbound({
        tokenInfo, toAddr, amountRaw, delaySec: S.txSlowDelaySec, vaultAddr: v.address,
      });
      return { from, to: target, value: BigInt(value), data };
    }
    if(isEth) return { from, to: toAddr, value: amountRaw, data: '0x' };
    return { from, to: tokenInfo.address, value: 0n, data: erc20Iface.encodeFunctionData('transfer', [toAddr, amountRaw]) };
  }
  if(S.txMode === 'STAKE') {
    const amt = stripCommas(S.stakeAmount || document.getElementById('stake-amount')?.value || '0');
    if(!amt || !(parseFloat(amt) > 0)) throw new Error('ENTER AN AMOUNT TO STAKE');
    return { from, to: WSTETH_ADDRESS, value: ethers.parseEther(amt), data: '0x' };
  }
  if(S.txMode === 'CUSTOM') {
    const target = S.cxTarget || document.getElementById('cx-target')?.value || '';
    if(!target) throw new Error('ENTER TARGET');
    const val = stripCommas(S.cxValue || document.getElementById('cx-value')?.value || '0');
    const d = getCxCalldata(); if(d === null) throw new Error('INVALID CALLDATA');
    const resolvedTarget = assertPreviewed(target, await resolveName(target), S.chainId);
    return { from, to: resolvedTarget, value: ethers.parseEther(val), data: d };
  }
  if(S.txMode === 'BATCH') {
    const calls = S.batch.filter(c => c.t.trim());
    if(!calls.length) throw new Error('ADD AT LEAST 1 CALL');
    const targets = await Promise.all(calls.map(async c => assertPreviewed(c.t, await resolveName(c.t), S.chainId)));
    const values = calls.map(c => ethers.parseEther(stripCommas(c.v || '0')));
    const datas = calls.map(c => (c.d || '0x').trim());
    return { from, to: v.address, value: 0n, data: msIface.encodeFunctionData('batch', [targets, values, datas]) };
  }
  return null;
}
let _builderSim = null;
async function simulateBuilder() {
  if(S.demoMode) { _builderSim = _simStamp({ status:'pass', demo:true, assets: [] }); render(); return; }
  _builderSim = { loading:true }; render();
  let s;
  try { s = await buildSimInput(); }
  catch(e) { _builderSim = null; flash(e.message || 'CHECK INPUTS'); render(); return; }
  if(!s) { _builderSim = null; render(); return; }
  _builderSim = await runSim(s);
  render();
}
// The dry-run panel. Three states — running, reverted, passed — each carrying
// the detail that state actually justifies: a scan bar while it works, the
// decoded revert reason when it fails, and the vault's per-asset balance
// ledger plus gas when it passes.
// opts: { rerun, dismiss } are onclick expressions; both optional.
function renderSim(sim, opts) {
  opts = opts || {};
  const actions = `<span class="sim-tags">
    ${sim.at ? `<span class="sim-tag">${esc(sim.at)}</span>` : ''}
    ${sim.demo ? '<span class="sim-tag">DEMO</span>' : ''}
    ${sim.basic ? '<span class="sim-tag" title="This RPC does not support eth_simulateV1 — the call was checked for revert only, with no balance trace">REVERT-CHECK ONLY</span>' : ''}
    ${opts.rerun ? `<button class="sim-x" onclick="${opts.rerun}" title="Run again against the latest block">&#8635;</button>` : ''}
    ${opts.dismiss ? `<button class="sim-x" onclick="${opts.dismiss}" title="Dismiss">&#10005;</button>` : ''}
  </span>`;

  if(sim.loading) return `<div class="sim run">
    <div class="sim-h"><span class="mark">&#9679;</span><span>SIMULATING</span></div>
    <div class="sim-b"><div class="sim-scan"></div><div class="sim-sub">REPLAYING THE CALL FROM THE VAULT AGAINST THE LATEST BLOCK&hellip;</div></div>
  </div>`;

  if(sim.status === 'revert') return `<div class="sim revert">
    <div class="sim-h"><span class="mark">&#10007;</span><span>WOULD REVERT</span>${actions}</div>
    <div class="sim-b">
      ${sim.reason ? `<div class="sim-reason">${esc(sim.reason)}</div>` : ''}
      <div class="sim-sub" style="margin-top:9px">THIS PROPOSAL CAN STILL BE CREATED AND SIGNED, BUT IT WILL FAIL WHEN EXECUTED. CHECK THE BALANCE, THE RECIPIENT AND ANY ALLOWANCE FIRST.</div>
    </div>
  </div>`;

  const assets = (sim.assets || []).filter(a => a.delta !== 0n);
  const ledger = assets.length
    ? `<div class="sim-led">${assets.map(a => {
        const neg = a.delta < 0n, abs = neg ? -a.delta : a.delta;
        return `<div class="sim-row ${neg?'sim-out':'sim-in'}">
          <span class="dir">${neg ? 'OUT' : 'IN'}</span>
          ${tokIcon(a.symbol,'sm')}<span>${esc(a.symbol)}</span>
          <span class="val">${neg ? '&minus;' : '+'}${esc(groupInt(fmtAmount(abs, a.decimals)))}</span>
        </div>`;
      }).join('')}</div>`
    : `<div class="sim-sub">NO BALANCE CHANGE TO THE VAULT${sim.basic ? '' : ' &mdash; NOTHING ENTERS OR LEAVES IT'}.</div>`;

  return `<div class="sim pass">
    <div class="sim-h"><span class="mark">&#10003;</span><span>SIMULATION PASSED</span>${actions}</div>
    <div class="sim-b">
      ${assets.length ? '<div class="sim-sub" style="margin-bottom:2px">VAULT BALANCE CHANGES</div>' : ''}
      ${ledger}
      ${sim.gas ? `<div class="sim-foot"><span>ESTIMATED GAS</span><span>~${Number(sim.gas).toLocaleString()}</span></div>` : ''}
    </div>
  </div>`;
}

async function prodAccelerate(vi, nonce) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[vi];
  const tx = v.queue.find(t => t.nonce === nonce);
  if(!tx) return;

  const target = tx.target;
  const value = tx.rawValue ? BigInt(tx.rawValue) : ethers.parseEther(tx.value || '0');
  const data = tx.callData || '0x';

  // Accelerate uses executor.forward() with a self-call to executeQueued
  // This requires unanimous (all owners) signatures, same as instant execute
  // forward() hashes with the live nonce, so all signers must agree on the same nonce
  const accelData = msIface.encodeFunctionData('executeQueued', [target, value, data, nonce]);
  const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
  const ownerAddrs = v.loadedOwners || v.owners.map(o => o.addr);

  try {
    // Check DB for an existing accelerate proposal (first signer sets the nonce)
    let accelNonce = v.nonce;
    let existingSigs = [];
    let existingTxId = null;
    if(v.dbId) {
      // Look for an existing accelerate entry for this original tx nonce
      const { data: rows } = await sb.from('transactions')
        .select('id, nonce, tx_hash')
        .eq('wallet_id', v.dbId)
        .eq('description', `Accelerate #${nonce}`)
        .in('status', ['proposed', 'executing'])
        .limit(1);
      if(rows?.length) {
        existingTxId = rows[0].id;
        accelNonce = rows[0].nonce;
        const dbSigs = await dbGetSigs(existingTxId);
        const msg = { target: v.address, value: 0n, data: accelData, nonce: accelNonce };
        existingSigs = verifySigs(dbSigs, domain, EIP712_TYPES, msg, ownerAddrs);
        // If nonce changed on-chain and existing sigs are invalid, start fresh
        if(existingSigs.length === 0 && dbSigs.length > 0) {
          accelNonce = v.nonce;
          existingTxId = null;
        }
      }
    }

    const msg = { target: v.address, value: 0n, data: accelData, nonce: accelNonce };
    const accelTxHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    // Add caller's sig
    let sigs = [...existingSigs];
    const callerIsOwner = ownerAddrs.some(o => o.toLowerCase() === connectedAddress.toLowerCase());
    const callerHasSigned = sigs.some(s => s.signer.toLowerCase() === connectedAddress.toLowerCase());
    if(callerIsOwner && !callerHasSigned) {
      const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
      sigs.push({signer: connectedAddress, sig, sigType: 'ecdsa'});
      // Store sig in DB
      if(v.dbId) {
        if(!existingTxId) {
          existingTxId = await dbProposeTx(v.dbId, accelNonce, v.address, '0', accelData, accelTxHash, v.ownerCount, connectedAddress, `Accelerate #${nonce}`);
        }
        if(existingTxId) await dbAddSig(existingTxId, connectedAddress, sig);
      }
    }
    sigs.sort((a,b) => a.signer.toLowerCase() < b.signer.toLowerCase() ? -1 : 1);

    if(sigs.length < v.ownerCount) {
      flash(`SIGNED ACCELERATE (${sigs.length}/${v.ownerCount}) — NEED ALL OWNERS`);
      await reloadQueue(vi);
      return;
    }

    // Verify nonce still matches on-chain before executing
    const liveNonce = await fetchLiveNonce(v.address);
    if(liveNonce !== accelNonce) {
      flash('NONCE CHANGED — RESIGNING NEEDED');
      // Invalidate stale sigs in DB
      if(existingTxId) {
        await dbCancelTx(existingTxId, connectedAddress);
      }
      await reloadQueue(vi);
      return;
    }

    // All sigs collected — execute via forward()
    const tlContract = new ethers.Contract(v.executor, TIMELOCK_EXECUTOR_ABI, signer);
    flash('ACCELERATING VIA EXECUTOR...');
    const atx = await tlContract.forward(v.address, v.address, 0n, accelData, packSigs(sigs));
    flash('TX SENT, WAITING...');
    const receipt = await atx.wait();

    if(v.dbId) {
      if(existingTxId) await dbMarkExecuted(existingTxId, Number(receipt.blockNumber), receipt.hash);
      if(tx.dbId) await dbMarkExecuted(tx.dbId, Number(receipt.blockNumber), receipt.hash);
    }
    flash(`ACCELERATED #${nonce} VIA EXECUTOR`);
    await reloadVault(vi);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'ACCELERATE FAILED');
  }
}

async function prodSubmitTransfer() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;

  const amt = stripCommas(document.getElementById("tx-amount")?.value || "0");
  const to = document.getElementById("tx-to")?.value || "";
  if(!to || !amt) { flash('FILL IN AMOUNT AND RECIPIENT'); return; }

  try {
    const toAddr = assertPreviewed(to, await resolveName(to), S.chainId);
    const tokenInfo = curTok(v);
    const isEth = tokenInfo.address === ethers.ZeroAddress;
    const amountRaw = isEth ? ethers.parseEther(amt) : ethers.parseUnits(amt, tokenInfo.decimals);

    let target, value, data, desc;
    if(S.txSlow && slowAvailable()) {
      // SLOW delivery: build the depositTo call (plus an atomic approve batch
      // for ERC20 when the vault's allowance to SLOW falls short).
      ({ target, value, data, desc } = await buildSlowOutbound({
        tokenInfo, toAddr, amountRaw, delaySec: S.txSlowDelaySec, vaultAddr: v.address,
      }));
    } else if(isEth) {
      target = toAddr;
      value = amountRaw.toString();
      data = '0x';
      desc = `${amt} ETH \u2192 ${toAddr.slice(0,8)}...`;
    } else {
      target = tokenInfo.address;
      value = '0';
      data = erc20Iface.encodeFunctionData('transfer', [toAddr, amountRaw]);
      desc = `${amt} ${tokenInfo.symbol} \u2192 ${toAddr.slice(0,8)}...`;
    }

    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target, value: BigInt(value), data, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, value, data, txHash, v.threshold, connectedAddress, desc);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`TX #${nonce} CREATED`);
    S.showTx = false;
    resetTxFields();
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}

async function prodSubmitCustom() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;

  const target = S.cxTarget || document.getElementById("cx-target")?.value || "";
  const val = stripCommas(S.cxValue || document.getElementById("cx-value")?.value || "0");
  const d = getCxCalldata(); if(d === null) return;
  if(!target) { flash('ENTER TARGET'); return; }
  if(d !== '0x' && !/^0x[0-9a-fA-F]*$/.test(d)) { flash('INVALID CALLDATA — MUST BE HEX (0x...)'); return; }
  if(d !== '0x' && d.length % 2 !== 0) { flash('INVALID CALLDATA — ODD LENGTH'); return; }

  try {
    const resolvedTarget = assertPreviewed(target, await resolveName(target), S.chainId);
    const value = ethers.parseEther(val).toString();

    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target: resolvedTarget, value: BigInt(value), data: d, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    const fnName = S.cxFn != null && Array.isArray(S.cxAbi) && S.cxAbi[S.cxFn] ? S.cxAbi[S.cxFn].name : null;
    const desc = fnName ? `${fnName}() → ${resolvedTarget.slice(0,8)}...` : undefined;

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, resolvedTarget, value, d, txHash, v.threshold, connectedAddress, desc);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`TX #${nonce} CREATED`);
    S.showTx = false;
    resetCxState();
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}

async function prodSubmitBatch() {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;

  const calls = S.batch.filter(c => c.t.trim());
  if(!calls.length) { flash('ADD AT LEAST 1 CALL'); return; }
  for(const c of calls) {
    const cd = (c.d || '0x').trim();
    if(cd !== '0x' && !/^0x[0-9a-fA-F]*$/.test(cd)) { flash('INVALID CALLDATA — MUST BE HEX (0x...)'); return; }
    if(cd !== '0x' && cd.length % 2 !== 0) { flash('INVALID CALLDATA — ODD LENGTH'); return; }
  }

  try {
    const targets = await Promise.all(calls.map(async c => assertPreviewed(c.t, await resolveName(c.t), S.chainId)));
    const values = calls.map(c => ethers.parseEther(stripCommas(c.v || '0')));
    const datas = calls.map(c => (c.d || '0x').trim());

    const batchData = msIface.encodeFunctionData('batch', [targets, values, datas]);
    const target = v.address;
    const value = '0';

    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target, value: 0n, data: batchData, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, value, batchData, txHash, v.threshold, connectedAddress, `Batch (${calls.length} calls)`);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`BATCH TX #${nonce} CREATED`);
    S.showTx = false;
    S.batch = [{t:'',v:'',d:''},{t:'',v:'',d:''}];
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}

// ── PRODUCTION: ADMIN PROPOSALS ───────────────────────────────────

async function prodAdminPropose(action, val) {
  const w = requireSigner(); if(!w) return;
  const { signer, addr: connectedAddress } = w;
  const v = S.vaults[S.sel];
  if(!v) return;

  let data, desc;
  try {
    switch(action) {
      case 'setThreshold': {
        if(!val || val < 1 || val > v.ownerCount) { flash('THRESHOLD MUST BE 1..' + v.ownerCount); return; }
        data = msIface.encodeFunctionData('setThreshold', [val]);
        desc = `setThreshold(${val})`;
        break;
      }
      case 'setDelay': {
        if(val > 4294967295) { flash('DELAY TOO LARGE'); return; }  // setDelay(uint32)
        data = msIface.encodeFunctionData('setDelay', [val]);
        desc = `setDelay(${val})`;
        break;
      }
      case 'setExecutor': {
        const addr = document.getElementById('admin-executor-input')?.value?.trim();
        if(!addr || !ethers.isAddress(addr)) { flash('INVALID ADDRESS'); return; }
        data = msIface.encodeFunctionData('setExecutor', [ethers.getAddress(addr)]);
        desc = `setExecutor(${addr.slice(0,10)}...)`;
        break;
      }
      case 'enableForward': {
        const newState = !v.fastPath;
        data = tlIface.encodeFunctionData('enableForward', [newState]);
        desc = `enableForward(${newState})`;
        // For enableForward, target is the executor, not self
        const target = v.executor;
        const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
        const nonce = nextNonce(v);
        const msg = { target, value: 0n, data, nonce };
        const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
        const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);
        if(v.dbId) {
          const txId = await dbProposeTx(v.dbId, nonce, target, '0', data, txHash, v.threshold, connectedAddress, desc);
          if(txId) await dbAddSig(txId, connectedAddress, sig);
        }
        flash(`PROPOSE: ${desc}`);
        await reloadQueue(S.sel);
        return;
      }
      case 'addOwner': {
        const raw = document.getElementById('admin-add-owner')?.value?.trim();
        if(!raw) { flash('ENTER AN ADDRESS'); return; }
        const addr = await resolveName(raw);
        // Contract requires _owner > SENTINEL (address(1)); reject 0x0 / 0x1.
        if(addr === ethers.ZeroAddress || addr.toLowerCase() === SENTINEL.toLowerCase()) { flash('INVALID OWNER ADDRESS'); return; }
        const ownerList = v.loadedOwners || v.owners.map(o => o.addr);
        if(ownerList.some(o => o.toLowerCase() === addr.toLowerCase())) { flash('ALREADY AN OWNER'); return; }
        const addLabel = document.getElementById('admin-add-label')?.value?.trim() || '';
        data = msIface.encodeFunctionData('addOwner', [addr]);
        desc = `addOwner(${addr.slice(0,10)}...)`;
        // Store label so it can be applied after execution
        v._pendingLabel = { addr: addr.toLowerCase(), label: addLabel };
        break;
      }
      case 'removeOwner': {
        const idx = val;
        const ownerAddr = v.owners[idx]?.addr;
        if(!ownerAddr) { flash('INVALID OWNER'); return; }
        if(v.ownerCount <= v.threshold) { flash('LOWER THRESHOLD FIRST'); return; }
        // prevOwner is the linked-list predecessor from getOwners() order; the
        // contract requires _owners[prevOwner] == ownerAddr, so it must be exact.
        const loadedIdx = v.loadedOwners ? v.loadedOwners.findIndex(o => o.toLowerCase() === ownerAddr.toLowerCase()) : -1;
        if(loadedIdx === -1) { flash('OWNER NOT IN ON-CHAIN LIST — RELOAD VAULT'); return; }
        const prevOwner = loadedIdx === 0 ? SENTINEL : v.loadedOwners[loadedIdx - 1];
        data = msIface.encodeFunctionData('removeOwner', [prevOwner, ownerAddr]);
        desc = `removeOwner(${ownerAddr.slice(0,10)}...)`;
        break;
      }
      default: return;
    }

    // Self-call for settings changes
    const target = v.address;
    const domain = { ...EIP712_DOMAIN, chainId: S.chainId, verifyingContract: v.address };
    const nonce = nextNonce(v);
    const msg = { target, value: 0n, data, nonce };
    const sig = await signer.signTypedData(domain, EIP712_TYPES, msg);
    const txHash = ethers.TypedDataEncoder.hash(domain, EIP712_TYPES, msg);

    if(v.dbId) {
      const txId = await dbProposeTx(v.dbId, nonce, target, '0', data, txHash, v.threshold, connectedAddress, desc);
      if(txId) await dbAddSig(txId, connectedAddress, sig);
    }

    flash(`PROPOSE: ${desc}`);
    await reloadQueue(S.sel);
  } catch(e) {
    console.error(e);
    flash(e.shortMessage || e.message || 'FAILED');
  }
}

// ── CHAIN SWITCHING ───────────────────────────────────────────────

async function switchChain(id, skipLoad) {
  if(!CHAINS[id]) return;
  S.chainId = id;
  localStorage.setItem('ms_chain', String(id));
  provider = makeProvider(id);
  S.showChains = false;
  S.latestBlock = 0;
  S.txToken = 'ETH';
  resetCxState();
  fetchBlock();

  // Ask wallet to switch chain
  if(window._connectedWalletProvider) {
    try {
      await walletSwitchChain({
        chainId: id,
        chainHex: CHAINS[id].hex,
        rpc: CHAINS[id].rpcs[0],
        addChainParams: ADD_CHAIN_PARAMS[id] || null
      });
    } catch(e) { console.error('Chain switch:', e); }
    // Warn if wallet rejected the switch (browsing still works, signing won't).
    // Suppressed for programmatic switches (skipLoad) — e.g. the multi-chain
    // deploy loop, which surfaces per-chain switch state in its own overlay.
    if(!skipLoad) try {
      const wc = await window._connectedWalletProvider.request({method:'eth_chainId'});
      if(parseInt(wc, 16) !== id) flash('WALLET ON DIFFERENT CHAIN — SWITCH TO SIGN');
    } catch(_) {}
  }

  if(!S.demoMode && !skipLoad) {
    S.vaults = [];
    S.sel = 0;
    if(window._connectedAddress) showLoading('SWITCHING CHAIN');
    render();
    loadAllVaults();
  } else {
    render();
  }
}

// ── WALLET INTEGRATION ────────────────────────────────────────────

function onWalletConnect() {
  if(S.demoMode) S.demoMode = false;
  const deepLinked = S.vaults.length > 0 ? [...S.vaults] : null;
  S.vaults = [];
  S.sel = 0;

  if(window._connectedWalletProvider) {
    (async () => {
      try {
        const wc = await window._connectedWalletProvider.request({method:'eth_chainId'});
        const walletChain = parseInt(wc, 16);
        if(walletChain !== S.chainId && CHAINS[walletChain]) {
          S.chainId = walletChain;
          localStorage.setItem('ms_chain', String(S.chainId));
          provider = makeProvider(S.chainId);
          S.latestBlock = 0;
          fetchBlock();
        }
      } catch(_) {}
      // Restore deep-linked vaults so they aren't lost on auto-reconnect
      if(deepLinked) { S.vaults = deepLinked; S.sel = 0; }
      render();
      loadAllVaults();
    })();
  } else {
    if(deepLinked) { S.vaults = deepLinked; S.sel = 0; }
    render();
    loadAllVaults();
  }
}

function onWalletDisconnect() {
  S.vaults = [];
  S.sel = 0;
  render();
}

window.onWalletDisplayUpdate = function() {
  const hasFocused = document.querySelector(
    '.txb input:focus, .txb textarea:focus, .content input:focus, .content textarea:focus, .content select:focus'
  );
  if (!hasFocused) render();
};

// ── DEEP LINKING ──────────────────────────────────────────────────

function handleDeepLink() {
  const hash = location.hash.slice(1);
  const matchTx = hash.match(/^(\d+)\/(0x[0-9a-fA-F]{40})\/tx\/(\d+)$/);
  const match = matchTx || hash.match(/^(\d+)\/(0x[0-9a-fA-F]{40})$/);
  if(match) {
    const linkChain = parseInt(match[1]);
    if(CHAINS[linkChain]) {
      S.chainId = linkChain;
      localStorage.setItem('ms_chain', String(S.chainId));
      provider = makeProvider(S.chainId);
      fetchBlock();
      // Sync wallet target chain so auto-reconnect uses the deep-linked chain
      walletSwitchChain({
        chainId: linkChain,
        chainHex: CHAINS[linkChain].hex,
        rpc: CHAINS[linkChain].rpcs[0],
        addChainParams: ADD_CHAIN_PARAMS[linkChain] || null
      }).catch(_=>{});
      // Load this specific vault
      const addr = match[2];
      if(matchTx){ _focusNonce = parseInt(match[3]); _focusVaultAddr = addr; _focusScroll = true; }
      showLoading('LOADING VAULT');
      (async () => {
        try {
          const vData = await loadSingleVaultData(addr);
          if(vData) {
            S.vaults = [vData];
            S.sel = 0;
            S.nt = vData.threshold;
            setNd(vData.delay);
            hideLoading();
            render();
            await Promise.all([loadVaultQueue(0), loadVaultHistory(0)]);
            render();
            // If the linked tx isn't in the queue (already executed or cancelled),
            // tell the co-signer instead of silently doing nothing.
            if(_focusNonce !== null && !S.vaults[0].queue.some(t => t.nonce === _focusNonce)) {
              flash(`TX #${_focusNonce} NOT IN QUEUE — MAY BE EXECUTED OR CANCELLED`);
              _focusNonce = null; _focusVaultAddr = null; _focusScroll = false;
            }
          } else {
            hideLoading();
          }
        } catch(e) {
          console.error('Deep link load:', e);
          hideLoading();
          render();
        }
      })();
      return true;
    }
  }
  return false;
}

// ── TICK (block number + ETA updates) ─────────────────────────────
async function fetchBlock() {
  try {
    // The active-chain provider is held in a global rather than fetched per
    // call, so it cannot heal itself the way makeProvider's callers do. This
    // poll runs anyway — use it to swap a wedged provider out.
    if (provider && provider._wedged) provider = makeProvider(S.chainId);
    const n = await provider.getBlockNumber();
    S.latestBlock = n;
    document.querySelectorAll("[data-block]").forEach(el => el.textContent = "BLOCK " + n.toLocaleString());
  } catch (_) {}
}
function pollTick() {
  if (document.hidden) return;
  fetchBlock();
  let anyReady = false;
  document.querySelectorAll("[data-eta]").forEach(el => {
    const eta = +el.dataset.eta;
    const f = fmtEta(eta);
    if (f) {
      if (f === "READY" && el.textContent !== "READY") anyReady = true;
      el.textContent = f === "READY"
        ? "READY"
        : new Date(eta * 1000).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
  });
  document.querySelectorAll("[data-eta-status]").forEach(el => {
    const eta = +el.dataset.etaStatus;
    const f = fmtEta(eta);
    if (f) {
      if (f === "READY" && !el.textContent.includes("READY")) anyReady = true;
      el.textContent = "\u2022 " + f;
      el.style.color = f === "READY" ? "var(--g)" : "var(--d)";
    }
  });
  document.querySelectorAll("[data-tl-eta]").forEach(el => {
    const eta = +el.dataset.tlEta, delay = +el.dataset.tlDelay;
    if (delay > 0) el.style.width = Math.round(Math.min(1, Math.max(0, (NOW() - (eta - delay)) / delay)) * 100) + "%";
  });
  const hasFocused = document.querySelector(
    '.txb input:focus, .txb textarea:focus, .content input:focus, .content textarea:focus, .content select:focus'
  );
  if (anyReady && !hasFocused) render();
}
setInterval(pollTick, 12000);
// Refresh immediately when the tab regains focus instead of waiting out the
// interval, so the block number and ETAs are current the moment the user returns.
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollTick(); });

// SLOW · OUTBOUND unlock countdowns tick every second (in-place text updates so
// the seconds are visible in the final minute). When a timer crosses zero, do a
// single focus-guarded re-render so that row drops its REVERSE button and
// relabels as no longer reversible.
function tickSlowCountdowns() {
  if (document.hidden) return;
  const els = document.querySelectorAll('[data-slow-unlock]');
  if (!els.length) return;
  const now = NOW();
  let crossed = false;
  els.forEach(el => {
    const remaining = (+el.dataset.slowUnlock) - now;
    if (remaining > 0) el.textContent = 'UNLOCKS IN ' + fmtRemaining(remaining);
    else crossed = true;
  });
  if (crossed) {
    const hasFocused = document.querySelector(
      '.txb input:focus, .txb textarea:focus, .content input:focus, .content textarea:focus, .content select:focus'
    );
    if (!hasFocused) render();
  }
}
setInterval(tickSlowCountdowns, 1000);

// ── INIT ──────────────────────────────────────────────────────────
(function init() {
  if(!CHAINS[S.chainId]) S.chainId = 1;
  provider = makeProvider(S.chainId);

  walletInit({
    appName: 'Multisig',
    chainId: S.chainId,
    chainHex: CHAINS[S.chainId].hex,
    rpc: CHAINS[S.chainId].rpcs[0],
    addChainParams: ADD_CHAIN_PARAMS[S.chainId] || null,
    onConnect: [onWalletConnect],
    onDisconnect: [onWalletDisconnect],
  });

  fetchBlock();

  const hasDeepLink = handleDeepLink();
  render();
  if(!hasDeepLink) {
    const hasSavedWallet = !!localStorage.getItem('ms_wallet');
    if(hasSavedWallet) {
      window._onAutoReconnectFail = () => { clearTimeout(_initLoadingTimer); hideLoading(); };
      _initLoadingTimer = setTimeout(hideLoading, 5000);
    } else {
      _initLoadingTimer = setTimeout(hideLoading, 400);
    }
  }

  let resizeT;
  window.addEventListener("resize", () => {
    _vw = window.innerWidth;
    clearTimeout(resizeT);
    resizeT = setTimeout(render, 150);
  });
})();
</script>
