<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* Ink ladder — the same one docs.html and index.html use, copied rather than
   diverged. If it changes there it changes here. */
:root{
  --a:#F5FBFF;--bg:#2D5FE8;--d:#D6E6FF;--m:#EAF4FF;
  --ln:#FFFFFF2E;--fr:#FFFFFF47;--g:#7DFFBA;--gc:#0A0A0A;--r:#FFB1AC;--y:#FFD600;
  --on:#0A0A0A;
  --f:'IBM Plex Mono','Courier New',monospace;
}
.light{
  --a:#00677C;--bg:#FDFDFD;--d:#008CA6;--m:#007990;
  --ln:#0099B326;--fr:#0099B340;--g:#059669;--gc:#fff;--r:#DC2626;--y:#B45309;
  --on:#FDFDFD;
}
body{font-family:var(--f);background:var(--bg);color:var(--a);min-height:100vh;padding:10px;transition:background .3s,color .3s}
a{color:var(--a)}
button{cursor:pointer;font-family:var(--f)}
button:active{transform:scale(.97)}
@media(hover:hover){button:hover{opacity:.75}}
button:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--ln)}

.scan{position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0A0A0A04 3px,#0A0A0A04 6px)}
.light .scan{background:repeating-linear-gradient(0deg,transparent,transparent 3px,#0099B302 3px,#0099B302 6px)}

.frame{position:relative;padding:0 24px;max-width:780px;margin:0 auto}
.rail{position:absolute;top:0;bottom:0;width:12px;overflow:hidden;writing-mode:vertical-lr;font-size:11px;letter-spacing:1px;color:var(--fr);user-select:none;line-height:12px}
.rail-l{left:0}.rail-r{right:0}
.hbar{font-size:11px;letter-spacing:1px;color:var(--fr);user-select:none;overflow:hidden;white-space:nowrap;line-height:1}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:22px 0 16px}
.logo{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1}
.logo a{text-decoration:none;color:var(--a)}
.logo-sub{font-size:10px;letter-spacing:2px;color:var(--m);margin-top:4px}
.theme-btn{background:transparent;border:1px solid var(--ln);color:var(--a);width:40px;height:40px;font-size:14px;display:flex;align-items:center;justify-content:center}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--ln);margin-bottom:32px}
.tab{background:transparent;border:none;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--d);padding:14px 0;border-bottom:2px solid transparent;text-transform:uppercase}
.tab.on{color:var(--a);border-bottom-color:var(--a)}

.content{min-height:50vh}
h2{font-size:14px;font-weight:700;letter-spacing:2px;margin:32px 0 12px;text-transform:uppercase}
h2:first-child{margin-top:0}
h3{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--d);margin:24px 0 10px;text-transform:uppercase}
p{font-size:13px;line-height:1.9;color:var(--m);margin-bottom:16px}
code{font-size:12px;color:var(--a);background:var(--ln);padding:2px 6px}
pre{font-size:11px;line-height:1.7;color:var(--m);padding:16px;border:1px solid var(--ln);overflow-x:auto;margin-bottom:16px;white-space:pre;tab-size:2}
.note{font-size:11px;color:var(--m);border-left:2px solid var(--a);padding:8px 0 8px 14px;margin:16px 0;line-height:1.7}
ul{margin:0 0 16px 0;padding:0;list-style:none}
li{font-size:12px;line-height:1.8;color:var(--m);padding-left:16px;position:relative;margin-bottom:8px}
li::before{content:"/";position:absolute;left:0;color:var(--fr)}

table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--d);padding:10px 20px 10px 0;border-bottom:1px solid var(--ln);vertical-align:bottom}
td{padding:12px 20px 12px 0;border-bottom:1px solid var(--ln);color:var(--m);vertical-align:top}
th:last-child,td:last-child{padding-right:0}
td.brk{word-break:break-all}
td strong{color:var(--a);font-weight:700}
td a{color:var(--a);text-decoration:none;border-bottom:1px solid var(--ln)}
td a:hover{border-bottom-color:var(--a)}
/* The reviews table's first column holds reviewer names over a date. Left to
   auto width it took whatever the prose column didn't want, which broke
   "Claude Opus 5" after "Opus" and "Shred Security" after "Shred" — a name
   split across lines reads as two reviewers. Wide enough for the longest. */
.rev td:first-child{width:136px}
@media(max-width:640px){.rev td:first-child{width:96px}}

/* ── QUOTE BLOCKS ──────────────────────────────────────────────────
   The reason anyone opens this page. Each is verbatim copy with a word count
   and a button, because the job a journalist actually has is "fill 40 words"
   and the answer should be one click, not a selection drag that picks up the
   surrounding furniture. The text lives in the DOM and the button reads it
   back off its own parent — no string escaping between here and the clipboard,
   which is where a stray apostrophe in body copy would otherwise break it. */
.quote{border:1px solid var(--ln);padding:16px 18px;margin-bottom:14px}
.quote-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.quote-n{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--d);text-transform:uppercase}
.quote-t{font-size:13px;line-height:1.85;color:var(--a)}
.copy{background:transparent;border:1px solid var(--ln);color:var(--d);font-size:9px;font-weight:700;letter-spacing:1.5px;padding:5px 10px;white-space:nowrap}
.copy.done{color:var(--g);border-color:var(--g)}
.copy.fail{color:var(--r);border-color:var(--r)}

/* ── LOGO SWATCHES ─────────────────────────────────────────────────
   Each tile carries its own background rather than inheriting the page's,
   because the whole point of four finishes is which background each survives.
   A transparent-white mark shown on a white page would demonstrate nothing. */
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.sw-i{border:1px solid var(--ln)}
.sw-p{height:132px;display:flex;align-items:center;justify-content:center}
.sw-p svg{width:84px;height:84px;display:block}
.sw-m{padding:10px 12px;border-top:1px solid var(--ln)}
.sw-n{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--a)}
.sw-u{font-size:10px;color:var(--d);line-height:1.6;margin-top:3px}
.sw-d{display:flex;gap:12px;margin-top:8px}
.sw-d a{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--d);text-decoration:none;border-bottom:1px solid var(--ln)}
.sw-d a:hover{color:var(--a);border-bottom-color:var(--a)}
.lock{border:1px solid var(--ln);padding:26px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.lock svg{width:100%;max-width:360px;height:auto;display:block}

/* Colour chips are click-to-copy for the same reason the quotes are: the hex
   is the deliverable, and reading it off a screen to retype it is how a brand
   colour ends up one digit wrong in someone's stylesheet. */
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.chip{border:1px solid var(--ln);text-align:left;background:transparent;padding:0;display:block;width:100%}
.chip-c{height:56px}
.chip-m{padding:9px 11px;border-top:1px solid var(--ln)}
.chip-n{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--a)}
.chip-h{font-size:10px;color:var(--d);margin-top:2px;letter-spacing:1px}
.chip-r{font-size:9px;color:var(--m);margin-top:5px;line-height:1.5}
.chip.done .chip-h{color:var(--g)}
.chip.fail .chip-h{color:var(--r)}

.footer{border-top:1px solid var(--ln);padding:12px 0;display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:var(--d)}
.footer a{color:var(--d);text-decoration:none}
.footer a:hover{color:var(--a)}

@media(max-width:640px){
  body{padding:6px}
  .frame{padding:0 6px}
  .rail{display:none}
  .hbar{font-size:10px}
  .logo{font-size:22px}
  .hdr{padding:18px 0 12px}
  .tabs{gap:12px;margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{font-size:11px;padding:12px 0;white-space:nowrap}
  h2{font-size:13px;margin:24px 0 10px}
  p{font-size:12px}
  pre{font-size:10px;padding:12px}
  th,td{padding-right:14px}
  .quote{padding:13px 14px}
  .quote-t{font-size:12px}
  .lock{padding:16px}
  /* The header stacks before the count and the button start wrapping onto
     each other at 320px. */
  .quote-h{flex-wrap:wrap}
}
</style>

// ── Copy ──────────────────────────────────────────────────────────
// Lifted from index.html, which has the argument for why this is not a
// one-liner: navigator.clipboard is undefined outside a secure context and
// rejects when the document isn't focused, so a confirmation fired
// unconditionally would claim a copy that never happened. Reads its text out
// of the DOM rather than an escaped attribute — the boilerplate is full of
// apostrophes and em dashes and none of them should be able to break this.
function clip(text,ok,fail){
  const legacy=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:-9999px;opacity:0';
      document.body.appendChild(ta); ta.select();
      const done=document.execCommand('copy'); ta.remove();
      done?ok():fail();
    }catch(_){ fail(); }
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok,legacy);
  else legacy();
}

// Both affordances flash on the same rule: swap the label, restore it after a
// beat, and only ever say COPIED on a resolved write.
function flashLabel(host,el,word,cls){
  const back=host.dataset.label||el.textContent;
  host.dataset.label=back;
  host.classList.remove('done','fail'); host.classList.add(cls);
  el.textContent=word;
  clearTimeout(host._t);
  host._t=setTimeout(()=>{host.classList.remove(cls);el.textContent=back;},1600);
}
function copyQuote(btn){
  const text=btn.closest('.quote').querySelector('.quote-t').textContent.trim().replace(/\s+/g,' ');
  clip(text,()=>flashLabel(btn,btn,'COPIED','done'),
            ()=>flashLabel(btn,btn,'FAILED','fail'));
}
function copyHex(el){
  const h=el.querySelector('.chip-h');
  clip(h.dataset.hex,()=>flashLabel(el,h,'COPIED','done'),
                     ()=>flashLabel(el,h,'FAILED','fail'));
}

EXPLAINER:`
<h2>WHAT A MULTISIG IS</h2>
<p>A <strong>multisig</strong> is a shared account that no single person can empty. Instead of one key there are several, and the account only moves money when enough of them agree. "3-of-5" means five people hold keys and any three can authorise a payment. Lose a key and the other four still work. Steal a key and one is not enough.</p>
<p>DAOs, protocol treasuries, exchanges and crypto funds nearly all run on one. When you read that a project's treasury is "controlled by a 4-of-7", this is the thing being described.</p>

<h2>WHAT THIS ONE ADDS</h2>
<p>Multisig is one of those, written from scratch to be as small as it can be, with two things built in that are usually add-ons.</p>

<h3>A timelock</h3>
<p>Turn it on and approved transactions don't execute — they sit in a public queue with a timestamp. Anyone can see exactly what is about to happen and how long they have. If the owners are being coerced, or a key was stolen, or someone simply made a mistake, there is a window to cancel. Protocols use this so their users can exit before an admin change takes effect.</p>

<h3>An executor</h3>
<p>One optional address that can act without signatures and without waiting — the break-glass. Two things people use it for: a <strong>security council</strong> that can move instantly during a live exploit while the ordinary owners stay behind the delay, and <strong>social recovery</strong>, where trusted friends can rotate the keys of someone who has lost theirs. The owners choose whether to appoint one, and can remove it.</p>

<h2>A TRANSACTION, END TO END</h2>
<table>
<tr><td style="width:28px"><strong>1</strong></td><td><strong>Propose.</strong> An owner builds a transaction — send 10 ETH here, call this contract. The interface shows the decoded effect before anyone signs.</td></tr>
<tr><td><strong>2</strong></td><td><strong>Approve.</strong> Other owners sign it, off-chain and free, or approve it on-chain. Nothing has happened yet.</td></tr>
<tr><td><strong>3</strong></td><td><strong>Execute.</strong> Once the threshold is met, anyone can submit it. Without a delay it runs immediately. With a delay it joins the queue, and runs when the clock expires — unless it is cancelled first.</td></tr>
</table>

<h2>WHAT MAKES IT DIFFERENT</h2>
<table>
<tr><td><strong>The timelock is part of the wallet</strong></td><td>Most multisigs need a second contract wired in front to get a delay. Here <code>delay</code> is a field on the wallet. Fewer moving parts, one thing to audit.</td></tr>
<tr><td><strong>One file</strong></td><td>The wallet and its factory are 275 lines of Solidity in a single file, comments aside. You can read the whole thing in an afternoon, which is the only real way to trust it.</td></tr>
<tr><td><strong>One storage slot</strong></td><td>Delay, nonce, threshold, owner count and executor are packed together. That is where most of the gas saving comes from.</td></tr>
<tr><td><strong>Same address everywhere</strong></td><td>Deployed with CREATE2, so a wallet has one address across Ethereum, Base, MegaETH, Arbitrum and OP Mainnet.</td></tr>
<tr><td><strong>Works on a normal wallet</strong></td><td>Under EIP-7702 an existing EOA can take on multisig behaviour without moving funds, while its owner keeps the original key.</td></tr>
<tr><td><strong>Nobody can change it</strong></td><td>The contracts are immutable. No admin key, no upgrade path, no proxy we control.</td></tr>
<tr><td><strong>It costs nothing</strong></td><td>No token, no fee, no revenue. A public good by <a href="https://github.com/src-company" target="_blank" rel="noopener">src_co</a>.</td></tr>
</table>
`,

<table>
<tr><th></th><th>MULTISIG</th><th>SAFE v1.4.1</th><th></th></tr>
<tr><td>Wallet bytecode</td><td>10,532 B</td><td>23,579 B</td><td><strong>55% less</strong></td></tr>
<tr><td>At feature parity<sup>1</sup></td><td>12,881 B</td><td>32,680 B</td><td><strong>61% less</strong></td></tr>
<tr><td>Source, lines of code</td><td>275</td><td>702</td><td><strong>61% fewer</strong></td></tr>
<tr><td>Deploy, 3 owners</td><td>183,171 gas</td><td>306,366 gas</td><td><strong>40% cheaper</strong></td></tr>
<tr><td>Send ETH, 2-of-3</td><td>52,918 gas</td><td>61,113 gas</td><td><strong>13% cheaper</strong></td></tr>
<tr><td>Storage slots, core state</td><td>1</td><td>several</td><td></td></tr>
<tr><td>Timelock</td><td>built in</td><td>needs a second contract</td><td></td></tr>
</table>
<p style="font-size:11px"><sup>1</sup> Adds Safe's <code>CompatibilityFallbackHandler</code> and <code>MultiSendCallOnly</code>, since this wallet has both built in.</p>
<p>Deployment savings run from <strong>35% to 47%</strong> depending on owner count; steady-state execution from <strong>12% to 16%</strong>. Batching is a wash, and the executor path costs about <strong>6% more</strong> — the <a href="${REPO}/blob/main/README.md" target="_blank" rel="noopener">README</a> says why, and does not round it in our favour.</p>
<pre>forge test --mc SafeComparisonTest -vv    # every gas figure above
forge build --sizes                       # every bytecode figure above</pre>
<p>Also verifiable: <strong>100% test coverage</strong>, a <strong>45-byte</strong> proxy per wallet, and an <strong>MIT</strong> licence.</p>

<h2>ON THE REVIEWS</h2>
<p>Five reviews are published, and they are not all the same kind of thing. Please don't flatten them into "audited".</p>
<table class="rev">
<tr><td><strong>Shred Security</strong><br>2026-07-11</td><td>External, human — kenzo and yashar — with stateful invariant fuzzing. 0 high, 0 medium.</td></tr>
<tr><td><strong>GPT-5.6 Sol<br>Claude Opus 5<br>leftclaw</strong><br>2026-07</td><td>External, model- and agent-driven.</td></tr>
<tr><td><strong>Pashov Skills</strong><br>2026-04</td><td>An <em>internal</em> 8-agent pass, run before the external ones. Widest scope, and the reason <code>cancelQueued</code> exists at all.</td></tr>
</table>
<p>Severities were not consistent between them — one critical rested on a misreading, and two mis-sized the same arithmetic bug by a factor of 65. Every finding, including the disputed ones and the arguments against them, is in <a href="${DOCS_URL}#audits">the audit ledger</a> and <a href="${REPO}/blob/main/SECURITY.md" target="_blank" rel="noopener">SECURITY.md</a>.</p>
<div class="note">The one line worth quoting, and the one we stand behind: <strong>no reviewer found a way for an unauthorised party to move funds from a correctly configured wallet.</strong> The qualifier is load-bearing — a wallet set as its own executor bricks itself, and funds sent directly to the factory are gone permanently. Both are documented warnings, not surprises.</div>

<h2>WHAT IT IS NOT</h2>
<p>Worth stating plainly, because these are the assumptions a crypto story usually carries in by default.</p>
<ul>
<li><strong>Not custodial.</strong> We cannot move your funds. There is no key, no admin function and no upgrade hatch that would let us.</li>
<li><strong>Not a token.</strong> No coin, no airdrop, no points programme, no fundraise. Nothing to buy.</li>
<li><strong>No fees.</strong> Not on deployment, not on execution, not ever. The only cost is the chain's own gas.</li>
<li><strong>Not upgradeable.</strong> The deployed contracts are immutable. A deliberate trade: no upgrade key to steal, but also no patching. It is why the reviews matter.</li>
<li><strong>Not a Safe fork.</strong> A separate implementation with its own interface. Safe is the comparison because it is the standard, not the source.</li>
<li><strong>Not a company product.</strong> No support contract, no SLA, no roadmap commitment. A public good, maintained in the open.</li>
<li><strong>Not risk-free.</strong> It is new, and the reviews found real issues. Read them before writing that it is "audited" full stop.</li>
</ul>
`,

<p>A capital M inside a dashed frame. The M is the wallet; the frame is the hatch the interface draws around a transaction that has been signed but not yet executed — the visual language of a thing that is pending, waiting on someone else. A multisig is exactly that gap, so the mark is the gap.</p>
<p>One path and a border of slashes. No gradient, no shadow, no rounded container. It resolves at 24px because there is nothing in it that needs resolving.</p>
<div class="sw">
${MARKS.map(([n,f,ink,use,file])=>`

<h2>TYPE</h2>
<p><strong>IBM Plex Mono</strong>, and only IBM Plex Mono — SIL OFL 1.1, on <a href="https://github.com/IBM/plex" target="_blank" rel="noopener">GitHub</a> and Google Fonts. Monospace is not decoration here: everything this project displays is an address, a hash, a nonce or a gas figure, and those are read column-by-column or not at all. The wordmark inherits it so the logo and the data are the same voice.</p>
<table>
<tr><th></th><th>FACE</th><th>TRACKING</th></tr>
<tr><td>Wordmark, <code>MULTISIG</code></td><td>Bold, all caps</td><td>&minus;0.034 em</td></tr>
<tr><td><code>.software</code></td><td>Regular, lowercase</td><td>+1.44 em</td></tr>
<tr><td>Headings, UI labels</td><td>Bold, all caps</td><td>+0.06 em</td></tr>
<tr><td>Body, data</td><td>Regular</td><td>0</td></tr>
</table>
<div class="note">The wordmark in the supplied files is already outlined, so you never have to match this by hand. Every asset is font-free — the slashes and the letters are real Plex Mono outlines converted to paths — which is why they open correctly in Figma and Illustrator without anyone chasing a missing typeface.</div>

<h2>DON'T</h2>
<ul>
<li>Don't recolour the mark. There are four finishes; one of them fits.</li>
<li>Don't rebuild the wordmark in another typeface, or in Plex Mono Regular.</li>
<li>Don't stretch, rotate, outline, emboss or add a shadow.</li>
<li>Don't box the mark in a circle or a squircle. It already has a container.</li>
<li>Don't put the transparent mark on a busy photograph — use blue, which brings its own field.</li>
<li>Don't crop the frame, and don't close its corners. The gaps are the point.</li>
<li>Don't set the mark beside your own logo in a way that reads as a joint product, and don't put it on a page that implies we endorse yours.</li>
</ul>
